name: Build e-manifest

# 手動觸發：去 GitHub repo 的 Actions 頁籤，選這個 workflow，按 Run workflow。
# 之後如果想要「Drive 資料夾一有新圖就自動更新」，可以把下面的
# schedule 區塊取消註解（例如每天跑一次），目前先維持純手動，
# 避免在圖片庫還沒穩定前就跑出一堆不必要的 commit。
on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: '0 18 * * *'  # 每天 UTC 18:00（台北時間凌晨 2:00）

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run build-e-manifest.js
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: node scripts/build-e-manifest.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add e-manifest.json e-images/
          if git diff --cached --quiet; then
            echo "沒有變動，不 commit。"
          else
            git commit -m "chore: update e-manifest (automated)"
            git push
          fi
