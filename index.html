      if(url && isStillCurrent() && imgEl.src !== url) imgEl.src = url;
    });
  }

  function stopPreviewCycle(){
    previewActive = false;
  }

  // pushHistory=false 用在「因為網址本來就是 #preview（例如重新整理、上一頁/下一頁）
  // 才開啟這個頁面」的情境，這種情況不需要再往歷史紀錄多推一筆，否則會造成
  // 網址狀態跟瀏覽器上一頁/下一頁按鈕的行為對不起來。
  // ---------- 貫穿全站的飄動英文字（EDEN）----------
  // 不再只在手機版 preview 頁顯示，也不再區分手機/桌機兩種抓取方式——
  // 這顆元素是 <body> 的直接子節點，從進站那一刻就開始跑，切換
  // gallery / preview / detail 頁面完全不會影響它、不會被重新定位、
  // 不會被重新啟動，所以「切頁」不會有任何跳動或震動。
  const dvdBounce = document.getElementById('dvdBounce');
  const dvdBounceImgEl = dvdBounce ? dvdBounce.querySelector('.dvd-bounce-img') : null;

  // ---------- 飄動物件：只有真正的照片庫圖片就緒才放行顯示 ----------
  // 完整成因、設計理由見上面 CSS .dvd-bounce.dvd-image-pending 那段說明。
  // dvdRealImageReady 確保這裡只會真的放行一次；之後就算又被呼叫到
  // （理論上不會，圖片庫只抓取一次），也不會重複觸發彈出動畫。
  let dvdRealImageReady = false;
  function markDvdRealImageReady(){
    if(dvdRealImageReady || !dvdBounce) return;
    dvdRealImageReady = true;
    const chromeAlreadyRevealed = initialChromeRevealed; // 見上面 revealInitialChrome() 的說明
    dvdBounce.classList.remove('dvd-image-pending');
    if(chromeAlreadyRevealed){
      // 整體首屏（header／照片）那一組已經先淡入過了，飄動物件因為圖片庫
      // 還沒準備好才多等了這一下——這裡額外補一次跟「首次進站」同樣的
      // 縮放彈入動畫（見 revealInitialChrome() 內同樣的寫法），讓它終於
      // 現身時一樣有「彈出來」的份量感，不會顯得像是忽然憑空冒出來、跟
      // 其他元素的出場方式不一致。如果放行時機剛好跟首屏淡入同一刻或
      // 更早，revealInitialChrome() 自己那段邏輯就已經處理過彈入動畫，
      // 這裡不需要再重複疊加一次。
      dvdBounce.classList.add('dvd-reveal');
      clearTimeout(dvdBounce._revealPopTimer);
      dvdBounce._revealPopTimer = setTimeout(() => {
        dvdBounce.classList.remove('dvd-reveal');
      }, 650);
    }
  }

  // ---------- 依照每張圖片「實際的可視邊緣」撞牆（自動裁掉透明留白） ----------
  // PNG 檔案本身四周常常留有一圈透明留白（例如美術軟體匯出時保留的安全
  // 邊界），如果直接拿整張圖片的矩形框去判斷撞牆，框住的範圍會比肉眼看到
  // 的圖案本身大一圈——視覺上就是「明明圖案還沒真的碰到牆，就已經彈開了」。
  // 做法：圖片一到手（不管是內建的預設圖，還是圖片庫抓回來的每一張），先
  // 用 canvas 掃一次 alpha 色版，找出「真正有畫到東西」的像素範圍，把圖片
  // 裁到只剩下那個範圍再拿來用——裁完之後，<img> 元素本身的框（撞牆判斷
  // 用的 dvdW/dvdH 就是量這個框，見 measureDvdSize()）自然就等於圖案實際
  // 的可視邊緣，不需要額外改撞牆的計算邏輯本身。
  //
  // 讀取像素資料需要瀏覽器認定這張圖片「乾淨」（沒有 CORS 限制），否則
  // canvas 會被判定成 tainted、getImageData() 直接丟出安全性錯誤——這正是
  // 「撞牆隔著一段透明才撞到」的實際成因：飄動的 e 換上圖片庫（Google
  // Drive）抓回來的真實照片後，如果那張圖沒能通過 CORS 檢查，裁切就會
  // 整張失敗，退回「整張圖含透明留白」的舊行為，撞牆自然就會在圖案本身
  // 還沒真的碰到之前提早彈開。原本只用「在 <img> 標籤設 crossOrigin=
  // 'anonymous'」單一種方式嘗試，這種方式在某些圖片來源（尤其是這裡用到的
  // Google Drive 縮圖 CDN）偶爾會不穩定：如果同一個網址稍早在頁面其他地方
  // 已經用「沒有帶 CORS 資訊」的方式載入過、被瀏覽器快取下來，之後就算
  // 伺服器其實開放 CORS，<img crossOrigin> 也可能還是命中舊的快取版本、
  // 繼續被判定成 tainted——單一種方式失敗就直接放棄，成功率因此偏低。
  //
  // 改成依序嘗試兩種方式，第一種失敗才試第二種，兩種都失敗才真的放棄裁切：
  //   1) fetch() 把圖片位元組真的抓下來，轉成 blob: URL 再讀取——只要
  //      fetch 本身成功（代表對方伺服器確實開放了 CORS），blob: URL 一定
  //      是同源，讀取像素就一定不會被判定成 tainted，也不會受前面提到的
  //      舊快取問題影響，成功率通常比 <img crossOrigin> 更高更穩定。
  //   2) fetch 失敗（例如伺服器連 fetch 本身都不允許跨網域讀取回應內容）
  //      才退回原本「直接在 <img> 上設 crossOrigin='anonymous'」的做法再
  //      試一次。
  // 兩種都失敗，才真的放棄裁切、原圖照樣拿來用——不影響網站正常運作，
  // 只是那一張圖退回原本「整張圖當撞牆範圍」的舊行為，不會讓整個功能壞掉。
  const DVD_TRIM_ALPHA_THRESHOLD = 10; // 忽略幾乎透明（雜訊等級）的殘留像素，避免因為極輕微的殘留 alpha 裁不乾淨

  // 補強：很多「素材圖」其實從頭到尾都是完全不透明的（alpha 全部是 255）
  // ——例如圖片是用純色（常見是白色）畫布匯出，而不是真的去背 PNG。這種
  // 圖片原本的裁切邏輯完全派不上用場（alpha 掃描找到的可視範圍就是整張
  // 圖，因為沒有任何一個像素真的透明），撞牆判斷因此還是用「整張圖含
  // 純色留白」的大小去算，飄動物件撞到東西之前，肉眼會先看到一段留白
  // ——這正是「還是會隔一段空白才撞到」這個回報的成因。
  // 這裡補上第二種判斷方式：從圖片四個邊框取樣，統計出現次數最多的顏色
  // 當作「背景色」的估計值，再把顏色跟背景色夠接近的像素也一併當成背景
  // 裁掉。只有在圖片完全沒有真正的 alpha 透明像素時才會用到這一輪判斷，
  // 真正有去背的 PNG 維持原本只看 alpha 的行為，不受影響、也不會被這輪
  // 判斷誤裁到顏色剛好跟背景相近的圖案邊緣。
  const DVD_TRIM_BG_COLOR_THRESHOLD = 26; // 顏色跟背景色的歐式距離在這個範圍內（0~441），視為背景的一部分；留一點容錯空間給圖片壓縮／重新編碼帶來的些微色差

  // 從圖片四個邊框（不只四個角，範圍更大更抗雜訊）取樣顏色，統計出現
  // 次數最多的顏色當作背景色的估計值——比只看四個角落更穩定，避免剛好
  // 有一個角落被圖案本身佔到、導致背景色判斷失準。取樣間距隨圖片尺寸
  // 調整，避免超大圖片時樣本點過多、拖慢掃描速度。
  function estimateEdgeBackgroundColor(data, w, h){
    const counts = new Map();
    const step = Math.max(1, Math.floor(Math.min(w, h) / 60));
    function sample(x, y){
      const idx = (y * w + x) * 4;
      const key = (data[idx] << 16) | (data[idx + 1] << 8) | data[idx + 2];
      counts.set(key, (counts.get(key) || 0) + 1);
    }
    for(let x = 0; x < w; x += step){ sample(x, 0); sample(x, h - 1); }
    for(let y = 0; y < h; y += step){ sample(0, y); sample(w - 1, y); }
    let bestKey = null, bestCount = -1;
    counts.forEach((count, key) => { if(count > bestCount){ bestCount = count; bestKey = key; } });
    if(bestKey === null) return null;
    return { r: (bestKey >> 16) & 255, g: (bestKey >> 8) & 255, b: bestKey & 255 };
  }

  // 把「已經載入完成的 <img> 元素」畫進 canvas、掃描 alpha 色版找出實際
  // 可視範圍再裁切——單純的像素運算，不管圖片是從哪一種方式載入的，這一
  // 段本身完全共用，被下面兩種載入策略各自呼叫。
  // 回傳值有三種情況，呼叫端要分開處理：
  //   - 裁切後的 data URL：正常成功，有裁到透明留白
  //   - fallbackSrc（原封不動傳入的網址）：讀取成功，但這張圖本來就沒有
  //     透明留白可裁，屬於「正常、不用再試下一種方式」的結果
  //   - null：讀取像素這一步本身失敗（多半是 tainted canvas），呼叫端看到
  //     null 才需要改試下一種載入方式
  // 回傳值從單純一個 src 字串，改成 {src, coverage} 物件：coverage 是「裁切
  // 後範圍內，實際有畫到東西（非透明／非背景色）的像素」佔整個裁切範圍
  // 面積的比例（0~1）。這是供上面 --dvd-area-scale 那套「依實際有色面積
  // 平均每張飄動照片顯示大小」機制使用的原始數據（見 computeDvdAreaScales()
  // 的完整說明）：細長、鏤空的圖案（例如樹枝）coverage 會很低，塞滿整個
  // 畫面的照片 coverage 會接近 1。coverage 算不出來的情況（讀取像素失敗、
  // 整張圖完全透明等）一律回傳 null，呼叫端會把這張圖從「平均值」的計算
  // 中排除、维持縮放倍率 1，不受影響。
  function trimLoadedImage(img, fallbackSrc){
    try{
      const w = img.naturalWidth, h = img.naturalHeight;
      if(!w || !h) return Promise.resolve({ src: fallbackSrc, coverage: null });
      const srcCanvas = document.createElement('canvas');
      srcCanvas.width = w; srcCanvas.height = h;
      // willReadFrequently:true：明確告訴瀏覽器這顆 canvas 接下來會被
      // getImageData() 讀取像素（下面這幾行馬上就會呼叫），瀏覽器可以
      // 因此把這顆 canvas 直接配置在 CPU 記憶體、用軟體算繪，省掉「本來
      // 預設走 GPU 加速算繪、讀取像素時卻要多一輪 GPU→CPU 資料搬運」的
      // 額外開銷——這是瀏覽器公開建議的標準優化寫法，純粹加速這裡的像素
      // 掃描，不影響畫出來的結果、也不影響最終圖片的畫質。撞牆換圖的圖片
      // 庫每次進站都要把整批圖片各跑一次這個流程，這裡加速對整體「圖片庫
      // 準備好」的時間有實際幫助。
      const srcCtx = srcCanvas.getContext('2d', { willReadFrequently: true });
      srcCtx.drawImage(img, 0, 0);

      // ---------- 修正「剛進站飄動物件很LAG」：找邊界的逐像素掃描改在縮小版
      // 的取樣 canvas 上進行 ---------- 原本下面三輪迴圈（找留白邊界／判斷
      // 純色背景／算 coverage）都是直接對「來源全解析度」掃描——圖片庫縮圖
      // 現在請求的是 =s1600（見上面 EDEN_E_CACHE_KEY 的說明，畫質比舊版好
      // 很多），一張 1600×1600 的圖，光是找邊界那一輪就要跑 256 萬次逐像素
      // 判斷，三輪疊加、圖片庫裡通常不只一張，使用者剛進站、瀏覽器主執行緒
      // 同時還在處理照片載入／版面計算等其他工作，這幾百萬次迴圈疊在同一
      // 時間點，就是「剛進入網頁飄動物件很LAG」的主因——不是網路慢，是這段
      // 裁切運算本身太重。
      // 找邊界／算 coverage 只需要抓到「大概位置」，不需要跟原圖一樣精細；
      // 改成先把圖片縮小畫到一張最長邊不超過 SCAN_MAX_DIM 的取樣用 canvas，
      // 所有逐像素迴圈都改在這張縮小版上跑（面積只剩原本的
      // (SCAN_MAX_DIM/原始邊長)² 倍，1600px 的來源大約只剩 1/16 不到的
      // 像素量，速度對應快上十幾倍），算出邊界座標之後再等比例換算回原始
      // 解析度，最後仍然是拿全解析度的 srcCanvas 做「真正裁切」——輸出圖片
      // 本身的畫質完全不受影響，只是「決定要裁哪裡」這個判斷過程改成在
      // 縮小版上算，純粹省運算量、不犧牲最後看到的圖片品質。
      // ---------- 修正：「preview 頁停留期間，飄動物件移動優先，網格可以晚一點」----------
      // 低效能裝置（DVD_LOW_POWER_DEVICE，實務上等於沒有 requestIdleCallback
      // 的 Safari/WebKit 系，包含 IG／LINE／Threads 內建瀏覽器）找邊界這輪
      // 迴圈的取樣解析度再降一階（400→260），面積只剩約 42%，這段同步
      // 掃描的運算量對應等比例下降。使用者剛進站幾乎都會先停在 preview
      // 頁一段時間，這幾秒內畫面上唯一在動、使用者眼睛真正盯著看的就是
      // 飄動物件本身，寧可讓它撞牆換圖用的裁切輪廓精細度再粗一點點（肉眼
      // 感覺不出差異），也要換取這幾秒主執行緒更空、移動更順。桌機/平板
      // （有真正 requestIdleCallback，同一批運算本來就會被排到真正閒置
      // 時才做）維持原本 400 不變，不受影響。
      const SCAN_MAX_DIM = DVD_LOW_POWER_DEVICE ? 260 : 400;
      const scanScale = Math.min(1, SCAN_MAX_DIM / Math.max(w, h));
      const sw = Math.max(1, Math.round(w * scanScale));
      const sh = Math.max(1, Math.round(h * scanScale));
      const scanCanvas = document.createElement('canvas');
      scanCanvas.width = sw; scanCanvas.height = sh;
      const scanCtx = scanCanvas.getContext('2d', { willReadFrequently: true });
      scanCtx.drawImage(srcCanvas, 0, 0, sw, sh);
      const data = scanCtx.getImageData(0, 0, sw, sh).data; // tainted canvas 的話，錯誤會在這一行丟出

      // 第一輪：原本就有的邏輯，純看 alpha 色版找出「真的不透明」的像素範圍
      // ——下面全部改用縮小版的 sw/sh，找到的 minX/minY/maxX/maxY 座標這時
      // 是「縮小版座標」，稍後統一換算回全解析度座標再使用。
      let minX = sw, minY = sh, maxX = -1, maxY = -1;
      let hasRealTransparency = false;
      for(let y = 0; y < sh; y++){
        const rowBase = y * sw * 4;
        for(let x = 0; x < sw; x++){
          if(data[rowBase + x * 4 + 3] <= DVD_TRIM_ALPHA_THRESHOLD){
            hasRealTransparency = true;
            continue;
          }
          if(x < minX) minX = x;
          if(x > maxX) maxX = x;
          if(y < minY) minY = y;
          if(y > maxY) maxY = y;
        }
      }
      // 整張圖都是透明（極端情況），直接用原圖，不用多包一層 canvas；也沒有
      // 任何有色像素可以算 coverage，回傳 null 讓這張圖不參與大小平均計算
      if(maxX < minX || maxY < minY) return Promise.resolve({ src: fallbackSrc, coverage: null, aspect: null });

      let coverageBg = null; // 若下面第二輪「純色背景」判斷真的被採用，記下
                              // 估計出來的背景色，之後算 coverage 時要沿用
                              // 同一套判斷標準，結果才會跟裁切範圍一致

      // 第二輪：只有在圖片從頭到尾都沒有一個像素是真正透明的（hasRealTransparency
      // 仍是 false，代表上面那輪算出來的範圍必然等於整張圖）時才需要——處理
      // 「素材本身沒有去背、只是純色背景畫布」的情況（見上面 DVD_TRIM_BG_COLOR_THRESHOLD
      // 那段的完整說明）。真的有去背的 PNG 不會走進這裡，維持原本行為不受影響。
      // 同樣在縮小版（sw/sh）上掃描。
      if(!hasRealTransparency){
        const bg = estimateEdgeBackgroundColor(data, sw, sh);
        if(bg){
          let cMinX = sw, cMinY = sh, cMaxX = -1, cMaxY = -1;
          for(let y = 0; y < sh; y++){
            const rowBase = y * sw * 4;
            for(let x = 0; x < sw; x++){
              const idx = rowBase + x * 4;
              const dr = data[idx] - bg.r, dg = data[idx + 1] - bg.g, db = data[idx + 2] - bg.b;
              if((dr * dr + dg * dg + db * db) <= (DVD_TRIM_BG_COLOR_THRESHOLD * DVD_TRIM_BG_COLOR_THRESHOLD)){
                continue; // 判定為背景色，不算進可視範圍
              }
              if(x < cMinX) cMinX = x;
              if(x > cMaxX) cMaxX = x;
              if(y < cMinY) cMinY = y;
              if(y > cMaxY) cMaxY = y;
            }
          }
          // 有偵測到跟背景色明顯不同的「圖案」範圍，且不是整張圖都被判定成圖案
          // （那樣多半代表背景色估計失準，維持原本不裁的行為比較安全）才採用。
          if(cMaxX >= cMinX && cMaxY >= cMinY && !(cMinX === 0 && cMinY === 0 && cMaxX === sw - 1 && cMaxY === sh - 1)){
            minX = cMinX; minY = cMinY; maxX = cMaxX; maxY = cMaxY;
            coverageBg = bg;
          }
        }
      }

      // 在最終確定下來的裁切範圍內（仍是縮小版座標），重新掃一次「實際有色
      // （非透明／非背景）」的像素數量，除以整個範圍的面積，得出 coverage。
      // 判斷標準刻意跟上面決定裁切範圍時完全一致：真的有 alpha 透明就用
      // alpha 門檻；是純色背景畫布、且上面第二輪判斷真的被採用，就用跟該
      // 背景色的距離；兩者都不是（例如整張圖本來就沒有留白可裁，也沒偵測到
      // 可信的背景色）就視為整個範圍都是圖案本身，coverage 直接算 1。
      // coverage 是比例值，縮小版跟全解析度算出來的結果幾乎一致，不受這裡
      // 改用縮小版掃描影響精確度。
      let coverage = 1;
      {
        const boxW = maxX - minX + 1, boxH = maxY - minY + 1;
        if(boxW > 0 && boxH > 0 && (hasRealTransparency || coverageBg)){
          let coloredCount = 0;
          for(let y = minY; y <= maxY; y++){
            const rowBase = y * sw * 4;
            for(let x = minX; x <= maxX; x++){
              const idx = rowBase + x * 4;
              if(hasRealTransparency){
                if(data[idx + 3] > DVD_TRIM_ALPHA_THRESHOLD) coloredCount++;
              } else {
                const dr = data[idx] - coverageBg.r, dg = data[idx + 1] - coverageBg.g, db = data[idx + 2] - coverageBg.b;
                if((dr * dr + dg * dg + db * db) > (DVD_TRIM_BG_COLOR_THRESHOLD * DVD_TRIM_BG_COLOR_THRESHOLD)) coloredCount++;
              }
            }
          }
          coverage = coloredCount / (boxW * boxH);
        }
      }

      // 把縮小版座標換算回全解析度座標，才能從全解析度的 srcCanvas 裁出
      // 畫質不打折的最終圖片。等比例換算之外，額外往外擴一點安全邊界
      // （pad，大約是「一格縮小取樣格換算回原尺寸對應幾個像素」），避免
      // 縮小取樣造成邊緣被誤裁掉薄薄一層。
      const invScale = 1 / scanScale;
      const pad = Math.max(1, Math.ceil(invScale));
      const fullMinX = Math.max(0, Math.floor(minX * invScale) - pad);
      const fullMinY = Math.max(0, Math.floor(minY * invScale) - pad);
      const fullMaxX = Math.min(w - 1, Math.ceil((maxX + 1) * invScale) + pad - 1);
      const fullMaxY = Math.min(h - 1, Math.ceil((maxY + 1) * invScale) + pad - 1);

      // aspect：裁切後矩形本身的寬高比（trimW / trimH）。這張圖顯示時走的是
      // CSS 的「固定 height、width:auto」，寬度會跟著這個寬高比自動等比例
      // 縮放——換句話說，光看 coverage（矩形「裡面」有多滿）還不夠：兩張
      // coverage 相同、但一張矩形是細長型（trimW/trimH 很小）、一張矩形是
      // 寬扁型（trimW/trimH 很大），在「固定 height」的顯示方式下，寬扁型
      // 那張的實際顯示面積、乃至於「有色像素顯示出來的面積」都會比細長型
      // 那張大上好幾倍，光靠 coverage 補不回這個差距。下面 computeDvdAreaScales()
      // 會把 coverage 和 aspect 兩者一起帶入計算，才能真正讓「肉眼看到的
      // 有色面積」平均，不只是「矩形裡面的疏密程度」平均。
      const trimW = fullMaxX - fullMinX + 1;
      const trimH = fullMaxY - fullMinY + 1;
      const aspect = trimW / trimH;

      // 裁到的範圍等於整張圖，代表本來就沒有留白可裁（不管是透明留白還是
      // 純色留白），直接用原圖即可，不用多包一層 canvas；coverage/aspect
      // 這裡算好的數值依然照樣回傳給呼叫端，不受這條「不用裁切」的捷徑影響。
      if(fullMinX === 0 && fullMinY === 0 && fullMaxX === w - 1 && fullMaxY === h - 1){
        return Promise.resolve({ src: fallbackSrc, coverage, aspect });
      }
      const outCanvas = document.createElement('canvas');
      outCanvas.width = trimW; outCanvas.height = trimH;
      outCanvas.getContext('2d').drawImage(srcCanvas, fullMinX, fullMinY, trimW, trimH, 0, 0, trimW, trimH);
      // ---------- 修正：Performance 錄製檔案實測到的長任務主因 ----------
      // 原本這裡用 outCanvas.toDataURL('image/png')：這是「同步」API，瀏覽器
      // 必須在目前這一次函式呼叫、目前這一影格的主執行緒上，把整張裁切後的
      // 圖（可能到 1400px 見方）完整編碼成 PNG，還要再把編碼結果轉成 base64
      // 文字字串（多一道轉換、資料量還會膨脹約 33%）——實際錄製一段
      // Performance 效能紀錄後發現，這一步正是整段「飄動物件出現時卡頓」
      // 期間耗時最長的長任務之一（單次可到 90 毫秒），因為它是完全同步、
      // 不能被瀏覽器打斷去畫下一影格的。
      // 改用 outCanvas.toBlob()：這是非同步 API，瀏覽器可以把 PNG 編碼這段
      // 運算挪到背景（通常是獨立的編碼執行緒）進行，不再佔用主執行緒、也
      // 不用再多一道 base64 轉換，編碼完成才透過 callback 回傳一個
      // Blob，這裡直接用 URL.createObjectURL() 包成一個可以當 <img src>
      // 使用的網址（blob: 開頭，效果跟原本 data: 開頭的網址一樣可以正常
      // 顯示、正常被畫進其他 canvas 使用，不會有跨網域限制問題，因為畫面
      // 上這份像素資料本來就已經是解碼過的乾淨資料）。
      // 呼叫端（trimViaFetchBlob() / trimViaCrossOriginImg()）已經一併改用
      // .then() 銜接這個 Promise，對外行為完全等價，只是这段編碼工作不再
      // 卡住畫面。這裡刻意不呼叫 URL.revokeObjectURL()：這個網址接下來要
      // 一直被拿來當作看得見的 <img src> 長期使用（不是像 fetch 那邊那種
      // 讀完像素就能馬上釋放的暫時性 blob），提前釋放反而會讓圖片顯示壞掉；
      // 瀏覽器會在整個分頁關閉/reload 時自動回收，不會持續累積洩漏。
      return new Promise(resolve => {
        outCanvas.toBlob(blob => {
          if(!blob){ resolve({ src: fallbackSrc, coverage, aspect }); return; }
          resolve({ src: URL.createObjectURL(blob), coverage, aspect });
        }, 'image/png');
      });
    }catch(err){
      return Promise.resolve(null); // tainted canvas 等讀取失敗，回傳 null 讓呼叫端知道要試下一種載入方式，不是「這張圖沒有留白可裁」
    }
  }

  // 單純載入一張圖片，載入完成才 resolve；crossOrigin 是 null 就完全不設
  // 這個屬性（給同源的 blob: URL 用，不需要、也不該設）。
  function loadImageEl(src, crossOrigin){
    return new Promise((resolve, reject) => {
      const img = new Image();
      if(crossOrigin) img.crossOrigin = crossOrigin;
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }

  // 方式一：fetch 把圖片位元組抓下來、轉成 blob: URL 再讀取（見上面大段
  // 說明，這是成功率通常最高的做法）。fetch 本身失敗，或讀取像素失敗
  // （理論上 blob: URL 不會發生，保留這條路徑只是防禦性寫法），都直接
  // reject，交給呼叫端接手試下一種方式。
  function trimViaFetchBlob(src){
    return fetch(src, { mode: 'cors' }).then(res => {
      if(!res.ok) throw new Error('fetch failed: ' + res.status);
      return res.blob();
    }).then(blob => {
      const blobUrl = URL.createObjectURL(blob);
      return loadImageEl(blobUrl, null).then(img => {
        // trimLoadedImage() 現在改成回傳 Promise（見該函式內 toBlob() 那段
        // 的完整說明），這裡跟著改用 .then() 銜接，行為對外完全等價。
        return trimLoadedImage(img, src).then(trimmed => {
          URL.revokeObjectURL(blobUrl); // 已經畫進 canvas、也已經編碼完成了，不再需要這個暫存網址，馬上釋放
          if(trimmed === null) throw new Error('read pixels failed via blob');
          return trimmed;
        });
      }, err => { URL.revokeObjectURL(blobUrl); throw err; });
    });
  }

  // 方式二（備援）：原本的做法，直接在 <img> 標籤設 crossOrigin='anonymous'
  // 再讀取。同樣讀取失敗就 reject，讓最外層的 catch 接手退回原圖。
  function trimViaCrossOriginImg(src){
    return loadImageEl(src, 'anonymous').then(img => {
      // trimLoadedImage() 現在改成回傳 Promise（見該函式內 toBlob() 那段的
      // 完整說明），這裡跟著改用 .then() 銜接，行為對外完全等價。
      return trimLoadedImage(img, src).then(trimmed => {
        if(trimmed === null) throw new Error('read pixels failed via crossOrigin img');
        return trimmed;
      });
    });
  }

  // 回傳值統一是 {src, coverage} 物件（見 trimLoadedImage() 的完整說明）。
  // 兩種方式都失敗時，照原圖使用、coverage 給 null——這張圖一樣正常顯示，
  // 只是不參與下面「依實際有色面積平均大小」的計算，縮放倍率維持預設的 1，
  // 不影響原本「這張圖壞不掉整個功能」的行為。
  function trimTransparentImage(src){
    return trimViaFetchBlob(src)
      .catch(() => trimViaCrossOriginImg(src))
      .catch(() => ({ src, coverage: null, aspect: null }));
  }

  // ---------- 依「實際去背後的形狀邊緣」做像素級撞牆判斷 ----------
  // 上面 trimTransparentImage() 只解決「圖片四周留白」的問題——把圖片裁到
  // 只剩下「有東西的最小矩形範圍」，但裁完之後那個矩形本身多半還不是圖案
  // 真正的輪廓（例如飄動的「e」本身是英文字母的鏤空造型、詳情頁大圖如果
  // 也是去背過的異形照片），矩形範圍內部本來就還留有大片透明區域——單純
  // 拿「矩形 vs 矩形」做撞牆判斷，物件還沒真的碰到圖案本身、只是矩形框
  // 提早重疊，看起來就是「隔著一段透明才撞到」，這正是使用者回報的成因。
  //
  // 這裡改成「像素遮罩（alpha mask）vs 像素遮罩」的作法：把每張參與撞牆的
  // 圖片，掃一次 alpha 色版，記錄哪些像素「真的有畫到東西」，撞牆判斷時
  // 除了原本的矩形是否重疊（廣義相位，快速排除完全沒交集的情況），還要
  // 再確認「兩邊真正不透明的像素」有沒有真的疊在一起（窄義相位）——沒有
  // 疊到，就代表肉眼看起來還沒真的碰到，直接放行讓物件繼續往前移動、可以
  // 自由穿過對方的透明區域，只有在兩邊圖案本身真的疊到才觸發反彈。
  //
  // 這一套遮罩取樣解析度刻意縮到很小（PF_ALPHA_MASK_MAX_DIM），因為撞牆
  // 判斷只需要「有沒有碰到」這種程度的精確度，不需要跟原圖一樣細；縮小
  // 解析度換來的是每一影格取樣時的運算量大幅降低，物件飛得再快也不會
  // 拖慢畫面。
  // 效能較弱裝置（見上面 DVD_LOW_POWER_DEVICE 的完整說明）把遮罩取樣
  // 格數上限調降一階：這個數字連同下面 PF_ALPHA_MASK_FULL_CAP_DIM 是
  // buildAlphaMaskFromSourceChunked() 要讀取／掃描的像素總量的主要決定
  // 因素（大致是這兩個數字的平方量級），調降能讓每一次建立遮罩的運算
  // 量明顯減少，換來的精細度差異在撞牆判斷這個用途上肉眼感覺不出來。
  // 桌機、或原本就有真正 requestIdleCallback 且核心數足夠的裝置，維持
  // 原本數值不變，畫質/精細度完全不受影響。
  const PF_ALPHA_MASK_MAX_DIM = DVD_LOW_POWER_DEVICE ? 48 : 72; // 遮罩取樣格數上限（長邊），數字越大判斷越精細但越吃效能
  const PF_ALPHA_MASK_THRESHOLD = 10; // 跟 DVD_TRIM_ALPHA_THRESHOLD 用同一個容忍值，判斷是否為「有畫到東西」
  const PF_ALPHA_MASK_CELL_MAJORITY = 0.5; // 縮小成遮罩格子時，這一格裡「有畫到東西」的像素要佔多少比例才算整格實心——見下面 buildAlphaMaskFromSourceChunked() 內的完整說明，避免只沾到一點顏色的邊緣格被整格補滿，讓遮罩邊界比原圖實際邊緣多凸出一圈

  // src -> {mask:Uint8Array(0/1), w, h}｜null（讀取失敗，永久視為沒有遮罩可用）。
  // 沒有這個 key 代表「還沒開始建立」；建立中的狀態另外用 Set 追蹤，避免
  // 同一張圖同時被重複觸發好幾次建立流程。
  const pfAlphaMaskCache = new Map();
  const pfAlphaMaskPending = new Set();

  // 把「已經載入完成的圖片來源」（<img> 元素，或已解碼的 Image()）掃一次
  // alpha 色版，轉成 0/1 的像素遮罩。跟 trimLoadedImage() 共用同樣的「畫進
  // canvas 才能讀像素」原理，只是這裡目的是拿去做撞牆判斷、不是拿去裁圖，
  // 兩邊職責不同，故意不合併成同一支函式；讀取失敗（tainted canvas）會
  // 直接把例外丟給呼叫端處理。
  // 這裡的縮小方式刻意不能直接 ctx.drawImage(source, 0, 0, maskW, maskH)
  // 把原圖一口氣畫進一顆只有 PF_ALPHA_MASK_MAX_DIM（72px）的小 canvas——
  // 瀏覽器內建的縮圖演算法在縮小比例很大時（例如原圖是兩千多 px 高的
  // 直式照片，縮到 72px 大概是 28 倍以上的縮小率），是用「鄰域像素取
  // 平均值」在做縮圖，去背圖案的邊緣、細節（例如筆畫收尾的尖角、樹枝
  // 細梢、只有一兩個像素寬的突起）在平均之後，alpha 會被周圍大片透明
  // 稀釋到門檻以下，等於直接從遮罩上消失——算出來的遮罩會比圖案實際
  // 範圍還要往內縮一圈，但縮多少完全看「那一側剛好是細節還是實心色塊」，
  // 不同圖案、不同邊縮的量都不一樣，這正是「每張照片都有一兩側是正常的
  // （剛好是實心色塊那幾側），其他面依舊是空白在撞擊（剛好是細節、
  // 突起的那幾側，被縮圖平均掉了）」這個回報的實際成因。
  //
  // 改成兩階段、用「像素塊內只要有一個不透明就算實心」（max-pool，不是
  // 平均值）的方式手動縮小：先把原圖畫進一張解析度高很多的 canvas（上限
  // capDim，遠大於最終遮罩用的 72px，但還是有上限避免極端大圖拖慢建立
  // 遮罩的一次性運算），完整讀一次這個解析度的 alpha 值；再手動把這份
  // 資料縮到最終的 maskW×maskH——每一個縮小後的格子，只要對應範圍內的
  // 來源像素「有任何一個」超過透明門檻，這一格就算實心。不管圖案邊緣的
  // 細節多細小，只要它在這個中繼解析度底下還佔得到至少一個像素，就一定
  // 會被保留下來，不會再被平均演算法稀釋消失——遮罩因此只會等於或略小於
  // 原本用平均值縮圖時的範圍，絕不會比圖案實際範圍更往內縮。
  // 中繼高解析度讀取的上限（長邊）：從 800 降到 560——最終遮罩本來就只有
  // PF_ALPHA_MASK_MAX_DIM（72px）見方，800px 中繼解析度對這麼粗的最終
  // 格數而言早就遠遠超過需要保留細節（樹枝細梢等）所需的程度，560px
  // 依然遠大於 72px、足以保留同樣的邊緣細節，但 getImageData 要讀取＋
  // 手動縮小迴圈要掃過的像素數量降到約原本的 1/2（560²／800²≈0.49），
  // 讓上面 preloadDvdEImages() 背景暖機每一張圖的遮罩時，每一格
  // requestIdleCallback 實際佔用的主執行緒時間更短，更不容易因為單一張
  // 圖片的運算量超過瀏覽器分配的閒置時間額度而讓那一影格掉幀。只在
  // 建立遮罩時算一次，不影響每影格的撞牆運算量（那是用建好之後的
  // 72px 遮罩查詢，見 computeDvdPixelInsets()／pixelShapesOverlap()）。
  const PF_ALPHA_MASK_FULL_CAP_DIM = DVD_LOW_POWER_DEVICE ? 360 : 560; // 效能較弱裝置調降中繼解析度，理由同上面 PF_ALPHA_MASK_MAX_DIM 的說明
  // ---------- 手機優化：把這段最重的同步運算拆成多個小批 ----------
  // drawImage／getImageData 這兩步是瀏覽器原生實作，耗時已經被上面的
  // 解析度上限（PF_ALPHA_MASK_FULL_CAP_DIM／PF_ALPHA_MASK_MAX_DIM）限制
  // 住，不是主要問題；真正花時間的是後面「手動兩階段縮小」那個雙層
  // 迴圈——它會掃過中繼解析度（最大到 560×560，效能較弱裝置降到
  // 360×360）底下的每一個像素，運算量隨中繼解析度的面積線性成長，桌機
  // CPU 快、感覺不出來，換到手機較弱的 CPU 上，這段迴圈本身就可能單獨
  // 佔用主執行緒好幾十毫秒，而且不管有沒有包 requestIdleCallback，這
  // 整段運算從呼叫到回傳都是「一次做完」，中途沒有機會把主執行緒還給
  // 瀏覽器去處理畫面更新／觸控——這正是撞牆換圖那一刻手機上仍會感覺到
  // 頓一下的直接原因。
  // 修法：把外層迴圈（依縮小後的「列」my）拆成一批批處理，每批之間主動
  // 讓出主執行緒——有真正的 requestIdleCallback 時，用它回傳的
  // deadline.timeRemaining() 動態決定這一批能做多少列（跟上面
  // renderGrid() 的 processChunk() 用同一套手法）；沒有的話（Safari 退場
  // 路徑），改成每批固定只做一小段（PF_ALPHA_MASK_ROWS_PER_CHUNK 列）就
  // 透過 scheduleIdle() 排下一批，不再假設一次就能做完整份。這樣不管
  // 裝置效能好壞、瀏覽器支不支援 requestIdleCallback，單一次執行都只會
  // 卡住主執行緒很短一段時間，最終算出來的遮罩內容跟原本完全一樣，只是
  // 攤開在好幾個影格裡完成，不會再讓使用者感覺到明顯的一次性卡頓。
  // 呼叫端（requestAlphaMask()）本來就已經是非同步、可以容忍「晚一點才
  // 就緒」的設計（遮罩沒準備好之前一律優雅退回矩形碰撞），這裡讓建立
  // 過程本身也攤開成好幾步，跟既有的容忍機制完全相容，不需要改動任何
  // 呼叫端的碰撞／物理判斷邏輯，飄動物件跑動的規則（速度、反彈、旋轉
  // 衝量等）完全不受影響。
  // 呼叫端改用 callback 接收結果（原本是直接 return），draw／
  // getImageData 這段可能丟出的例外（tainted canvas）維持同步丟出，
  // 交給呼叫端原本的 try/catch 處理，行為跟原本完全一致。
  // ---------- 修正：「preview 頁停留期間，移動優先於遮罩精細度追趕速度」----------
  // 低效能裝置（DVD_LOW_POWER_DEVICE）每批只處理一半的列數（12→6），且
  // 排下一批時額外多等 24ms（見下面兩處 scheduleIdle(processRows, ...)
  // 呼叫的 fallbackDelay）：這是目前整條「撞牆換圖」流程裡，唯一還沒有
  // 依裝置調整「單批工作量／批次間距」的重運算——上面 trimDvdEImagesStaggered()
  // 的排隊間隔已經在前一輪修正時刻意調快（見該處說明），沒有再往下調的
  // 空間；這裡改成調小批次、拉開批次間距，換來的是每一次 processRows()
  // 佔用主執行緒的時間更短、而且批次跟批次之間確實讓出一小段時間給
  // 飄動物件的 requestAnimationFrame 迴圈，影格間隔更穩定。代價是遮罩要
  // 花更多批次、更長的總時間才會全部建完，但在遮罩還沒就緒之前，撞牆
  // 判斷本來就會優雅退回矩形碰撞（見 sampleAlphaMaskSolid() 的說明），
  // 不會有任何功能性的問題，只是精細撞牆的時間點稍微晚一點點。
  const PF_ALPHA_MASK_ROWS_PER_CHUNK = DVD_LOW_POWER_DEVICE ? 6 : 12; // 沒有 requestIdleCallback 時，每批固定處理的「列」數，抓一個經驗上足夠短、不會讓單批卡住太久的數字
  const PF_ALPHA_MASK_IDLE_TIME_MARGIN_MS = 3; // 跟 renderGrid() 的 GRID_IDLE_TIME_MARGIN_MS 同一個道理，留一點緩衝給瀏覽器自己排的其他工作
  function buildAlphaMaskFromSourceChunked(source, naturalW, naturalH, callback){
    if(!naturalW || !naturalH){ callback(null); return; }
    const fullScale = Math.min(1, PF_ALPHA_MASK_FULL_CAP_DIM / Math.max(naturalW, naturalH));
    const fullW = Math.max(1, Math.round(naturalW * fullScale));
    const fullH = Math.max(1, Math.round(naturalH * fullScale));
    const fullCanvas = document.createElement('canvas');
    fullCanvas.width = fullW; fullCanvas.height = fullH;
    const fullCtx = fullCanvas.getContext('2d', { willReadFrequently: true });
    fullCtx.drawImage(source, 0, 0, fullW, fullH);
    const fullData = fullCtx.getImageData(0, 0, fullW, fullH).data; // tainted canvas 的話，錯誤會在這一行丟出，交給呼叫端的 try/catch 處理

    const scale = Math.min(1, PF_ALPHA_MASK_MAX_DIM / Math.max(fullW, fullH));
    const maskW = Math.max(2, Math.round(fullW * scale));
    const maskH = Math.max(2, Math.round(fullH * scale));
    const mask = new Uint8Array(maskW * maskH);

    let my = 0;
    function processRows(deadline){
      let rowsDoneThisBatch = 0;
      while(my < maskH){
        const sy0 = Math.floor(my * fullH / maskH);
        const sy1 = Math.max(sy0 + 1, Math.floor((my + 1) * fullH / maskH));
        for(let mx = 0; mx < maskW; mx++){
          const sx0 = Math.floor(mx * fullW / maskW);
          const sx1 = Math.max(sx0 + 1, Math.floor((mx + 1) * fullW / maskW));
          // ---------- 修正「撞牆其實是用圖片旁邊的空白在撞」 ----------
          // 原本這裡只要縮小前的這一小格範圍內，有「任何一個」像素 alpha
          // 超過門檻，就把整格判定成實心（"any"／OR 邏輯）。缺角、羽化邊緣
          // 這種每一格只有一小角落沾到顏色的情況，會被這個 OR 邏輯直接
          // 「補滿」成整格實心——等於把遮罩的可視範圍往外撐大了最多將近
          // 一整格的寬度（72 格解析度下，一格約等於原圖寬度的 1/72）。使用者
          // 撞牆時看到的「明明是空白卻撞到」，正是因為遮罩在那一小圈邊緣
          // 本來就多算了一圈「其實透明」的格子當作實心。
          // 改成算這一格範圍內「真正有畫到東西」的像素比例，超過一半
          // （PF_ALPHA_MASK_CELL_MAJORITY）才算這一格實心——這樣遮罩的
          // 邊界會落在「這一格大部分是不是有顏色」的中線附近，貼齊原圖
          // 實際去背邊緣的視覺重心，不會再系統性地把邊界往外膨脹一整格。
          let solidCount = 0, totalCount = 0;
          for(let sy = sy0; sy < sy1; sy++){
            const rowBase = sy * fullW;
            for(let sx = sx0; sx < sx1; sx++){
              totalCount++;
              if(fullData[(rowBase + sx) * 4 + 3] > PF_ALPHA_MASK_THRESHOLD) solidCount++;
            }
          }
          mask[my * maskW + mx] = (totalCount > 0 && solidCount / totalCount >= PF_ALPHA_MASK_CELL_MAJORITY) ? 1 : 0;
        }
        my++;
        rowsDoneThisBatch++;
        if(deadline){
          if(deadline.timeRemaining() < PF_ALPHA_MASK_IDLE_TIME_MARGIN_MS) break; // 真的有 deadline 時，動態依剩餘閒置時間決定這一批做到哪
        } else if(rowsDoneThisBatch >= PF_ALPHA_MASK_ROWS_PER_CHUNK){
          break; // 沒有 deadline（Safari 退場路徑），固定小批次，確保單批執行時間有上限
        }
      }
      if(my < maskH){
        scheduleIdle(processRows, { timeout: 400, fallbackDelay: DVD_LOW_POWER_DEVICE ? 24 : 0 });
        return;
      }
      finishMask();
    }

    function finishMask(){
      // 額外找出遮罩的「輪廓像素」（供 computeDvdPixelInsets() 用來算撞
      // 螢幕邊界時的實際圖案最外緣，完整理由見上面原本的說明）：這段只
      // 掃過已經縮小完成的 maskW×maskH 網格（最大 72×72＝5184 格，效能
      // 較弱裝置只有 48×48＝2304 格），運算量遠小於上面掃描中繼解析度
      // 那段，維持一次做完，不需要額外分批。
      const boundaryPts = [];
      for(let y = 0; y < maskH; y++){
        const rowBase = y * maskW;
        for(let x = 0; x < maskW; x++){
          if(mask[rowBase + x] !== 1) continue;
          const left = x > 0 ? mask[rowBase + x - 1] : 0;
          const right = x < maskW - 1 ? mask[rowBase + x + 1] : 0;
          const up = y > 0 ? mask[rowBase - maskW + x] : 0;
          const down = y < maskH - 1 ? mask[rowBase + maskW + x] : 0;
          if(left === 1 && right === 1 && up === 1 && down === 1) continue; // 四周都是實心＝內部像素，不可能是最外緣，跳過
          boundaryPts.push((x + 0.5) / maskW, (y + 0.5) / maskH);
        }
      }
      callback({ mask, w: maskW, h: maskH, boundary: new Float32Array(boundaryPts) });
    }

    scheduleIdle(processRows, { timeout: 400, fallbackDelay: DVD_LOW_POWER_DEVICE ? 24 : 0 });
  }

  // 觸發（或直接沿用快取）某張圖片的像素遮罩建立，非同步、不阻塞呼叫端——
  // 呼叫這支的當下如果遮罩還沒準備好，撞牆判斷會暫時退回「矩形 vs 矩形」
  // 的舊行為（見下面 getCachedAlphaMask() 的說明），不會等待、也不會報錯，
  // 等遮罩真的建立好之後，下一次撞牆判斷自然就會開始用上精確版本。
  function requestAlphaMask(src, imgEl){
    if(!src || !imgEl || pfAlphaMaskCache.has(src) || pfAlphaMaskPending.has(src)) return;
    pfAlphaMaskPending.add(src);
    const finish = (result) => { pfAlphaMaskCache.set(src, result); pfAlphaMaskPending.delete(src); };

    // ---------- 修正：「頭幾秒還是會lag」----------
    // buildAlphaMaskFromSource() 內部要畫一張最大到 800px 見方的 canvas、
    // 完整讀出所有像素（getImageData），再手動跑一次二階段縮小成 72px 見方
    // 的遮罩——這是真正會吃掉一截主執行緒時間的同步運算。這裡原本是「呼叫
    // 到就立刻同步跑」，而飄動的 e 每撞一次邊界就會換一張新圖、換圖當下
    // 就會呼叫到這裡（見 setDvdBounceImageSrc()）。剛進站的頭幾秒，飄動
    // 物件會密集撞到好幾張「這輩子第一次用到、還沒建立過遮罩」的新圖，
    // 等於這段同步運算在這幾秒內被連續觸發好幾次——這正是「頭幾秒還是會
    // lag」剩下的主因；之後同一批圖片重複出現，遮罩已經有快取、不用重算，
    // 這也是「lag 程度後來變小」的原因。
    // 修法：呼叫端（computeDvdPixelInsets()／pixelShapesOverlap() 等）本來
    // 就已經把「遮罩還沒準備好」處理成優雅退回矩形判斷（undefined／null
    // 都當作「暫時當實心／不內縮處理」，等遮罩真的就緒才切換成精確版本），
    // 本來就是為了容忍「延遲一拍才就緒」而設計的——那就真的讓它延遲一拍：
    // 實際運算搬進 requestIdleCallback（沒有這個 API 就退回極短的
    // setTimeout），瀏覽器真正閒下來、不影響當下畫面互動時才執行，不再
    // 佔用使用者能感覺到的這幾秒；碰撞判斷在遮罩就緒之前只是暫時精細度
    // 稍差一點（退回外框矩形），不會有任何功能性的錯誤或卡住。
    const run = () => {
      // 第一步：直接用現有的圖片元素畫（同源的 data: URL——飄動的 e 裁切完
      // 一定是這種——這裡最快，不需要多一輪 fetch）。跨網域圖片如果沒有通過
      // CORS 檢查，這裡會直接丟出例外，走下面 fetch 備援，跟 trimTransparentImage()
      // 的兩階段策略同樣的道理。
      // buildAlphaMaskFromSourceChunked() 內部把最重的那段迴圈拆成好幾批
      // 執行（完整理由見該函式上方的說明），這裡呼叫時只有「畫布繪製＋
      // getImageData」這一小段是同步的、可能丟出 tainted canvas 例外，
      // 之後的分批運算都是非同步透過 callback 回傳結果，因此用一個旗標
      // 記錄「這一次呼叫本身有沒有同步丟出例外」，藉此判斷要不要繼續走
      // 下面的 fetch 備援，行為跟原本完全對應。
      let threwSync = false;
      try{
        buildAlphaMaskFromSourceChunked(imgEl, imgEl.naturalWidth, imgEl.naturalHeight, finish);
      }catch(err){ threwSync = true; /* tainted canvas，繼續往下試 fetch+blob */ }
      if(!threwSync) return;

      fetch(src, { mode: 'cors' }).then(res => {
        if(!res.ok) throw new Error('fetch failed: ' + res.status);
        return res.blob();
      }).then(blob => {
        const blobUrl = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => {
          try{
            buildAlphaMaskFromSourceChunked(img, img.naturalWidth, img.naturalHeight, (result) => {
              URL.revokeObjectURL(blobUrl);
              finish(result);
            });
          }catch(err){
            URL.revokeObjectURL(blobUrl);
            finish(null);
          }
        };
        img.onerror = () => { URL.revokeObjectURL(blobUrl); finish(null); };
        img.src = blobUrl;
      }).catch(() => finish(null)); // 兩種方式都失敗，標記成「沒有遮罩」，撞牆判斷永久退回矩形版本，不會讓功能壞掉
    };
    scheduleIdle(run, { timeout: 500, fallbackDelay: 0 });
  }

  // 讀取快取——回傳三種狀態，呼叫端要分開處理：
  //   - {mask,w,h}：遮罩已就緒，可以做像素級判斷
  //   - null：已經確定讀不到像素（tainted 或載入失敗），視為「沒有遮罩」
  //   - undefined：還沒建立好（或還沒呼叫 requestAlphaMask）
  // null 和 undefined 這兩種「沒有遮罩」的情況，在下面 sampleAlphaMaskSolid()
  // 裡都當作「這個位置算實心」處理，等同還沒套用這套像素判斷之前的矩形
  // 行為，寧可暫時retain舊行為，也不要讓物件在遮罩準備好之前莫名其妙穿過去。
  function getCachedAlphaMask(src){
    return pfAlphaMaskCache.get(src);
  }

  function sampleAlphaMaskSolid(maskEntry, u, v){
    if(!maskEntry) return true;
    if(u < 0 || u >= 1 || v < 0 || v >= 1) return false;
    const x = Math.min(maskEntry.w - 1, Math.floor(u * maskEntry.w));
    const y = Math.min(maskEntry.h - 1, Math.floor(v * maskEntry.h));
    return maskEntry.mask[y * maskEntry.w + x] === 1;
  }

  // ---------- 照片物理堆疊模式共用：把 alpha 遮罩換算成貼合實際形狀的碰撞體 ----------
  // 給 spawnFallingPhotos()（每張掉落照片）跟 startPhotoFallEngine()（飄動
  // 的 e 本身進場落下那顆 body）共用——兩邊都是「同一批去背異形圖，需要
  // 貼合真實輪廓的碰撞體，而不是整張外框矩形」，邏輯完全一樣，抽成這裡
  // 共用一份。
  //
  // 第一版只用單一凸包（convex hull）貼合輪廓，已經比整張矩形準確很多；
  // 但凸包天生沒辦法還原「凹陷」——例如蝴蝶兩片翅膀中間那個 V 形缺口、
  // 豆莢彎成愛心形狀中間凹進去那塊、陶笛鏤空的洞——凸包會直接把這些凹陷
  // 「橋接」過去變成一塊實心區域，導致其他照片肉眼看起來明明有空間可以
  // 卡進那個缺口，物理上卻被這塊「其實不存在的隱形凸起」擋住，完全塞不
  // 進去，正是「蝴蝶下方縫隙其他圖片根本進不去」的成因；飄動的 e 進場後
  // 落下那顆 body 目前也還是整張矩形，同一個原因，還沒真的貼到自己的
  // 真實邊緣。
  // 修法：改把 alpha 遮罩降到一個較粗的網格（PF_BODY_GRID_MAX——效能考量
  // 不能跟原本用於像素級撞牆判斷的 72×72 遮罩一樣細，那樣拆出的矩形數量
  // 太多，多張照片同時落下、物理引擎會撐不住），對每一列做「連續實心格子
  // 合併成一個小矩形」（run-length 合併），把同一張圖所有列合併出的小矩形
  // 一起組成一個 Matter「複合物體」（compound body：多個 part 組成、彼此
  // 固定相對位置，物理上仍是一個整體）。用一整排小矩形逼近原始形狀輪廓
  // （含凹陷），是點陣圖形轉成物理碰撞體的常見實用技巧，不需要額外載入
  // poly-decomp（凹多邊形分解函式庫，這頁面目前沒有載入），也不用處理它
  // 的相容性/效能問題。
  // 遮罩還沒建立好時（例如剛好在第一次雙擊那一刻還沒暖機完成），優雅退回
  // 原本的矩形 body（+ 圓角），不會讓功能壞掉或報錯。
  // ---------- 再次加強：拆解網格精細度直接等於遮罩本身解析度，徹底去掉
  // 「降兩次解析度」的落差 ----------
  // 上一輪修正把上限從 10/16 調到 24/44，比 PF_ALPHA_MASK_MAX_DIM（48/72）
  // 還是低了整整一半——等於還是對同一份輪廓的細節「打對折」，量化誤差
  // 依舊比遮罩本身能提供的精細度粗，使用者反映堆疊頁面仍然容易看到照片
  // 交疊，就是這一半落差殘留下來的結果。這裡不再折衷，直接把上限設成跟
  // PF_ALPHA_MASK_MAX_DIM 完全相等：buildFallItemPhysicsRects() 裡的
  // scaleFactor（= Math.round(遮罩邊長 / 這個常數)）在兩者相等時算出來
  // 剛好是 1，等同完全不再對遮罩做任何二次縮小，直接照遮罩原始格數組
  // 矩形——量化誤差只剩遮罩本身那一層（建立遮罩時已經是效能與精細度的
  // 折衷），是目前這套「粗網格逼近輪廓」做法在不重新拉高遮罩本身解析度
  // 之下，所能做到最貼合真實邊緣的精細度。拆出的矩形數量雖然會比之前
  // 多（沿長邊格數變成原本的兩倍），但仍然是線性成長、run-length 合併後
  // 每列還是只會拆出個位數的小矩形，效能較弱裝置一樣維持用比較低的
  // PF_ALPHA_MASK_MAX_DIM（因此這裡也跟著等比例調低），維持原有的效能
  // 折衷分寸不變。
  const PF_BODY_GRID_MAX = PF_ALPHA_MASK_MAX_DIM; // 拆解精細度上限（沿長邊的格數），直接等於遮罩本身的解析度——見上方說明，這是目前這套做法所能達到的最高精細度
  const PF_BODY_GRID_CELL_MAJORITY = 0.5; // 跟 PF_ALPHA_MASK_CELL_MAJORITY 同樣的道理：降到粗網格時，這一格要「多數」原始像素都有畫到東西才算整格實心，避免只沾到一點顏色的邊緣格被整格補滿

  // 把 maskEntry（見 finishMask() 的 {mask,w,h} 格式）降到粗網格、按列合併
  // 出一批矩形，每個矩形都是「以整張圖 w×h 為範圍、原點在中心」的區域座標
  // （cx/cy 是矩形中心相對整張圖中心的偏移量），供呼叫端直接加上世界座標
  // 的 x/y 平移使用。
  function buildFallItemPhysicsRects(maskEntry, w, h){
    if(!maskEntry || !maskEntry.mask || !maskEntry.w || !maskEntry.h) return null;
    const srcW = maskEntry.w, srcH = maskEntry.h;
    const scaleFactor = Math.max(1, Math.round(Math.max(srcW, srcH) / PF_BODY_GRID_MAX));
    const gridW = Math.max(1, Math.round(srcW / scaleFactor));
    const gridH = Math.max(1, Math.round(srcH / scaleFactor));
    const grid = new Uint8Array(gridW * gridH);
    for(let gy = 0; gy < gridH; gy++){
      const y0 = Math.floor(gy * srcH / gridH), y1 = Math.max(y0 + 1, Math.floor((gy + 1) * srcH / gridH));
      for(let gx = 0; gx < gridW; gx++){
        const x0 = Math.floor(gx * srcW / gridW), x1 = Math.max(x0 + 1, Math.floor((gx + 1) * srcW / gridW));
        let solid = 0, total = 0;
        for(let sy = y0; sy < y1; sy++){
          const rowBase = sy * srcW;
          for(let sx = x0; sx < x1; sx++){ total++; if(maskEntry.mask[rowBase + sx] === 1) solid++; }
        }
        grid[gy * gridW + gx] = (total > 0 && solid / total >= PF_BODY_GRID_CELL_MAJORITY) ? 1 : 0;
      }
    }
    const cellW = w / gridW, cellH = h / gridH;
    const rects = [];
    for(let gy = 0; gy < gridH; gy++){
      let runStart = -1;
      for(let gx = 0; gx <= gridW; gx++){
        const solid = gx < gridW && grid[gy * gridW + gx] === 1;
        if(solid && runStart === -1) runStart = gx;
        if(!solid && runStart !== -1){
          rects.push({
            cx: (runStart + gx) / 2 * cellW - w / 2,
            cy: (gy + 0.5) * cellH - h / 2,
            w: (gx - runStart) * cellW,
            h: cellH,
          });
          runStart = -1;
        }
      }
    }
    return rects.length ? rects : null;
  }

  // 建立最終要加進物理世界的 body：優先用上面「多矩形逼近實際形狀」的
  // 做法（回傳複合物體），遮罩還沒就緒時退回原本的矩形（+ 圓角）。
  // options 裡的 angle 刻意不直接傳給每一個小矩形——那樣會變成每個小矩形
  // 各自先被轉了一次角度，跟複合物體組好之後「整體再轉一次」的物理語意
  // 對不上；改成组好複合物體之後，用 Body.setAngle() 對整個複合物體只轉
  // 一次，等同原本單一矩形 body 直接帶 angle 建立的效果。restitution／
  // friction／frictionAir／density／collisionFilter 這些則要讓每個小矩形
  // 各自帶著（決定整體的質量分佈、以及每個 part 各自的碰撞判斷/篩選規則），
  // 所以原封不動傳給每一個小矩形。
  function buildFallItemBody(Matter, maskEntry, x, y, w, h, options){
    const { Bodies, Body } = Matter;
    const angle = options.angle;
    const partOptions = {};
    for(const key in options){ if(key !== 'angle') partOptions[key] = options[key]; }
    // Matter.js 每個 body 預設允許 0.05（世界座標，這裡跟畫面像素 1:1）的
    // 「容許重疊量」(slop)：只要重疊沒超過這個值，引擎會直接視為已解決、
    // 不再花力氣繼續修正，這是為了避免解算在浮點誤差邊緣無限微調、抖動
    // 不收斂的正常機制，但代價是永遠會留一絲絲允許的重疊。這裡用不到那
    // 麼多容忍空間（不需要顧慮浮點雜訊造成的抖動，複合物體本來就是離散
    // 小矩形拼出來的），調低到 0.01，讓引擎盡量把重疊收斂到肉眼看不出來
    // 的程度，而不是提早在還有明顯重疊時就放棄。若呼叫端自己有指定 slop
    // 則尊重呼叫端的設定，不覆寫。
    // ---------- 修正「照片疊在一起時會一直瘋狂抖動、停不下來」 ----------
    // 根本成因：上面把每張照片拆成貼合真實輪廓的一整排小矩形（複合物體），
    // 精細度越高、沿邊緣切出的小矩形越多，每一小塊都是直角。兩張這樣的
    // 複合物體疊在一起時，實際接觸點往往不是落在「視覺上看起來平滑」的
    // 那條邊，而是卡在某一小塊矩形的直角上——這個接觸點（法線方向）每一
    // 影格都可能因為極些微的位置變化，在相鄰兩個小矩形的邊角之間跳來跳去，
    // 解算出來的推開方向也跟著每一影格變來變去，肉眼看起來就是「疊在一起
    // 的照片一直小幅度抖動、停不下來」——因為抖動本身讓 body 的動量
    // （motion）一直沒辦法低於 Matter.js 判斷「可以睡眠」的門檻，於是永遠
    // 不會被引擎跳過計算，變成真的「一直」抖不停，不是抖一下就停。
    // 修法一：幫每一小塊矩形都加一點點圓角（chamfer）——半徑刻意抓得很小
    // （最多 3px，且不超過這塊矩形本身寬/高的一半），肉眼幾乎看不出跟直角
    // 差異，但足以把「兩塊矩形交界處那個銳利直角」磨掉一點，讓相鄰兩張
    // 照片實際接觸到的法線方向不會因為卡在直角上而每影格亂跳，大幅減少
    // 這種「假接觸點」造成的抖動。
    // 修法二：slop（容許重疊量）原本被調到 0.01（世界座標≈像素），比
    // Matter.js 內建預設 0.05 還緊很多倍——這裡的精細度已經是整排小矩形
    // 組成的複合物體，兩兩相疊時同時存在的接觸點數量遠比一般單一矩形碰撞
    // 多出好幾倍，即使把 position/velocity 迭代次數都調高，每一步能真正
    // 收斂到「小於 0.01」這麼緊的重疊量，對這麼多接觸點來說還是勉強，容易
    // 在幾種收斂不完全的接觸點之間來回拉扯、解算結果每影格略有不同，也是
    // 抖動的一部分成因。這裡放寬回比 Matter 預設略寬的 0.06——0.01 跟 0.06
    // 的差距換算成實際重疊量，兩者都遠小於 1 個像素，肉眼完全分辨不出來
    // （不會重新出現「看得到縫隙／交疊」那個舊問題，那個問題的根本原因是
    // 遮罩精細度不夠、不是 slop），但給解算器多一點點容許空間，可以讓它在
    // 「已經幾乎重合、剩下的重疊量根本不影響觀感」時就直接放手收工，不用
    // 再繼續為了逼近 0.01 這麼極端的目標而每影格微調、抖個不停。
    if(partOptions.slop === undefined) partOptions.slop = 0.06;
    const rects = buildFallItemPhysicsRects(maskEntry, w, h);
    if(rects){
      const parts = rects.map(r => {
        const chamferR = Math.max(0, Math.min(3, r.w / 2 - 0.2, r.h / 2 - 0.2));
        const rectOptions = chamferR >= 0.4
          ? Object.assign({}, partOptions, { chamfer: { radius: chamferR } })
          : partOptions;
        return Bodies.rectangle(x + r.cx, y + r.cy, r.w, r.h, rectOptions);
      });
      const body = Body.create({ parts });
      // ---------- 真正修好「複合碰撞體仍會跟視覺畫面對不齊」的根本成因 ----------
      // Body.create({parts}) 底層是呼叫 Matter 的 Body.setParts()，它會把
      // body.position 強制改寫成「所有小矩形（也就是實際有畫到東西的
      // alpha 像素）依面積加權算出來的質心」，而不是我們原本想要的「整張
      // 去背圖外框矩形的正中心」（w/2, h/2）。上面兩者只有形狀完全對稱、
      // 顏色平均分佈在外框正中央時才會剛好重合；但這裡多半是異形去背圖
      // （例如蕨類捲起的一端比較密、蝴蝶翅膀左右不對稱、香蕉一整串偏向
      // 一側），質心天生就會偏離外框正中心。下面 pfSyncHandler／飛入詳細頁
      // 動畫等每個地方，全部都是直接拿 body.position 當「外框矩形正中心」
      // 去反推 DOM 該畫在哪裡（translate(body.position.x - w/2, ...)）——
      // 這個假設一旦不成立，畫出來的整張圖（含外框內的透明留白）就會
      // 整個偏移，偏移量剛好等於「質心到外框中心」這段距離。碰撞判斷本身
      // （質心 vs 質心）其實是準的，兩張圖的碰撞體真的沒有互相穿透；但
      // 畫面上看到的，是兩張「因為偏移而被畫錯位置」的完整外框圖片在打架，
      // 這才是不管怎麼調網格解析度、肉眼看起來還是會交疊的真正原因。
      // 修法：在 Body.create 把 position 改寫成質心「當下」（角度還是 0，
      // 因為下面 Body.setAngle 還沒呼叫），先把「質心 → 外框正中心」這段
      // 向量算出來記住（body-local 座標系下的固定偏移量，不會再變），存進
      // Matter 官方保留給外掛自訂資料用的 body.plugin 裡。之後無論這顆
      // body 怎麼被物理引擎轉動、位移，只要在畫面同步時把這段固定的本地
      // 偏移量依照 body 目前的 angle 重新旋轉一次、加回 body.position，
      // 就能還原出「外框正中心」目前真正該在的世界座標——這才是畫面元素
      // 真正該對齊的點（見下面共用的 pfBoxCenter()）。
      body.plugin = body.plugin || {};
      body.plugin.pfCenterOffset = { x: x - body.position.x, y: y - body.position.y };
      if(typeof angle === 'number') Body.setAngle(body, angle);
      return body;
    }
    const body = Bodies.rectangle(x, y, w, h, Object.assign({}, options, { slop: 0.01, chamfer: { radius: 3 } }));
    // 退回單一矩形 body 時，body.position 本來就等於外框正中心，偏移量是
    // 零向量——跟上面複合物體共用同一套 pfBoxCenter() 讀取邏輯，不用另外
    // 特判「這顆是不是複合物體」。
    body.plugin = body.plugin || {};
    body.plugin.pfCenterOffset = { x: 0, y: 0 };
    return body;
  }

  // 共用：把「質心 → 外框正中心」這段固定的本地偏移量，依 body 目前的
  // angle 重新旋轉，加回 body.position，還原出外框正中心目前真正在世界
  // 座標系裡的位置。所有需要「把 body 換算成畫面矩形」的地方（每影格
  // 同步 transform、算飛行動畫起點矩形、判斷是否已經完全掉出畫面……）都
  // 應該呼叫這個函式，不要再直接拿 body.position 當外框正中心用。
  function pfBoxCenter(body){
    const off = body.plugin && body.plugin.pfCenterOffset;
    if(!off || (off.x === 0 && off.y === 0)) return body.position;
    const cosA = Math.cos(body.angle), sinA = Math.sin(body.angle);
    return {
      x: body.position.x + off.x * cosA - off.y * sinA,
      y: body.position.y + off.x * sinA + off.y * cosA,
    };
  }

  // 窄義相位：在兩個矩形（螢幕座標）的重疊範圍內，依固定間距取樣，逐點
  // 換算回各自的本地遮罩座標（dvd 這邊還要考慮目前的旋轉角度），只要有
  // 任何一個取樣點「兩邊都是實心像素」，就代表圖案本身真的疊到了。
  // dvdRotationDegNow 用度數、跟 CSS rotate() 一致；轉換成本地座標時要用
  // 「反方向」旋轉，把螢幕上的點轉回 dvd 未旋轉狀態下的座標系，這樣才能
  // 正確對應到旋轉前建立的那份遮罩。
  const PF_MASK_SAMPLE_STEP = 4; // 取樣間距（px）：越小越精準也越吃效能，4px 對這裡的物件尺寸來說肉眼已經看不出差別
  function pixelShapesOverlap(dvdLeft, dvdTop, dvdWidth, dvdHeight, dvdRotationDegNow, dvdMaskEntry, obsLeft, obsTop, obsWidth, obsHeight, obsMaskEntry){
    const left = Math.max(dvdLeft, obsLeft);
    const right = Math.min(dvdLeft + dvdWidth, obsLeft + obsWidth);
    const top = Math.max(dvdTop, obsTop);
    const bottom = Math.min(dvdTop + dvdHeight, obsTop + obsHeight);
    if(right <= left || bottom <= top) return false;

    // 兩邊都沒有遮罩可用（或都還沒準備好）——沒有更精確的資訊可以查，直接
    // 沿用矩形已經重疊這件事本身當作「有撞到」，等同舊版行為，不會卡住。
    if(!dvdMaskEntry && !obsMaskEntry) return true;

    const cx = dvdLeft + dvdWidth / 2, cy = dvdTop + dvdHeight / 2;
    const theta = -dvdRotationDegNow * Math.PI / 180; // 反方向旋轉，把螢幕座標轉回 dvd 本地未旋轉座標系
    const cosT = Math.cos(theta), sinT = Math.sin(theta);

    for(let py = top + PF_MASK_SAMPLE_STEP / 2; py < bottom; py += PF_MASK_SAMPLE_STEP){
      for(let px = left + PF_MASK_SAMPLE_STEP / 2; px < right; px += PF_MASK_SAMPLE_STEP){
        // dvd 本地座標：先減去中心點、反旋轉，再加回半寬高換算成 0~1 normalized
        const relX = px - cx, relY = py - cy;
        const localX = relX * cosT - relY * sinT + dvdWidth / 2;
        const localY = relX * sinT + relY * cosT + dvdHeight / 2;
        const du = localX / dvdWidth, dv = localY / dvdHeight;
        if(!sampleAlphaMaskSolid(dvdMaskEntry, du, dv)) continue;

        const ou = (px - obsLeft) / obsWidth, ov = (py - obsTop) / obsHeight;
        if(!sampleAlphaMaskSolid(obsMaskEntry, ou, ov)) continue;

        return true; // 兩邊都是實心像素，確定真的撞到圖案本身
      }
    }
    return false; // 矩形雖然重疊，但取樣範圍內兩邊實心像素從未疊在一起——只是透明區域重疊，不算撞到
  }

  // 換上一張新圖（不管是內建預設圖，還是圖片庫裁切完的圖）之後，圖片的
  // 實際尺寸／長寬比通常都不一樣，撞牆判斷要用的 dvdW/dvdH（見上面
  // measureDvdSize()）必須跟著重新量測，不然還是沿用「上一張圖」的舊
  // 尺寸，撞牆位置會對不準新圖的邊緣。decode() 確保瀏覽器真的解碼完成、
  // 準備好可以量測出正確的渲染尺寸；不支援的瀏覽器退回一個很短的
  // timeout 當備援。
  // 換上一張新圖之後，回傳一個 Promise，等瀏覽器真的把這張圖 decode 完成
  // （不只是設定 src 那一刻）才 resolve——呼叫端如果需要「圖片真的畫得出來
  // 之後才做某件事」（例如下面 markDvdRealImageReady() 放行顯示），必須
  // 等這個 Promise resolve 之後才能動作，不能在設定 src 的同一刻就動作。
  // 這是修正「有時候打開網站還是看到黃色 e」殘留一瞬間的關鍵：原本設定
  // 完 src 就馬上同步呼叫 markDvdRealImageReady() 拿掉隱藏用的 class，
  // 但瀏覽器此時通常還沒真的完成新圖片的解碼／畫面更新，那一瞬間畫面上
  // 其實還停留在「這個 <img> 元素前一次顯示的內容」——也就是還沒被換掉的
  // 內建黃色 e 預設圖，等新圖真的解碼完成才會被下一次畫面重繪蓋過去，
  // 中間這一小段空窗期使用者偶爾會瞥到那一瞬間的黃色 e。改成等 decode()
  // 真的 resolve（代表瀏覽器已經備妥可以直接畫出來的像素資料）才放行
  // 顯示，就不會再有這個空窗期。
  // areaScale：這張圖依照「實際有色面積」算出來的顯示縮放倍率（見上面 CSS
  // .dvd-bounce-img 的 --dvd-area-scale 用法、下面 computeDvdAreaScales()
  // 的完整說明）。不是每個呼叫端都會算過這個倍率（例如下面內建預設圖只是
  // 拿來量撞牆矩形、從來不會真的顯示給使用者看，不需要參與大小平均），
  // 這種情況不傳這個參數即可，CSS 那邊的 var(--dvd-area-scale, 1) 預設值
  // 會接手，行為等同沒有這個機制時的原本固定高度。
  function setDvdBounceImageSrc(src, areaScale){
    if(!dvdBounceImgEl) return Promise.resolve();
    const scaleValue = (typeof areaScale === 'number' && areaScale > 0) ? areaScale : 1;
    // 真正把新圖套到「畫面上看得見」的這顆 <img> 上，並重新量測撞牆矩形。
    const apply = () => {
      // 保險登記：這張圖既然能走到這裡（畫面外 Image() 已經 decode()／
      // onload 完成），就代表它確定解碼好了，一併寫進 dvdEDecodedSrcSet，
      // 涵蓋內建預設圖、備援路徑等原本不會經過 predecodeDvdEImage() 的
      // 情況，避免 cycleDvdEImage() 誤判成「還沒準備好」。
      dvdEDecodedSrcSet.add(src);
      dvdBounceImgEl.src = src;
      dvdBounceImgEl.style.setProperty('--dvd-area-scale', scaleValue);
      // 同步記錄「目前顯示的是哪一張圖」，供 computeDvdPixelInsets() 查詢
      // 對應的像素遮罩、算撞螢幕邊界時圖案本身實際的最外緣（完整說明見
      // 該函式上方的註解）。
      dvdActiveImgSrc = src;
      // 量完撞牆用的矩形尺寸之後，順便觸發這張圖的像素遮罩建立（見上面
      // requestAlphaMask() 的完整說明）——撞牆判斷要用的「實際去背形狀」
      // 從這裡開始準備，不需要呼叫端另外再做任何事。
      measureDvdSize();
      requestAlphaMask(src, dvdBounceImgEl);
    };
    // ---------- 修正撞牆換圖時「很短暫的消失」，改成無縫直接切換 ----------
    // 原本的做法是直接把新的 src 寫進畫面上這顆看得見的 <img>，再呼叫
    // decode() 等它解碼完成——decode() 只保證「解碼完成後才 resolve」，
    // 不保證瀏覽器在解碼完成前不會先把畫面上舊的那張圖清掉；尤其手機
    // 瀏覽器通常會在 src 換掉的那一瞬間就先清空目前內容，等新圖真的解碼
    // 繪製完成才重新畫上去，中間那一小段空白，就是使用者看到的「切換時
    // 很短暫地消失」，不是無縫直接切換。
    // 修正做法：先在畫面外、使用者看不到的地方（一顆沒有插進 DOM、只存在
    // 記憶體裡的 Image()）把新圖解碼好，確定解碼完成之後，才把同一個
    // src 寫進畫面上這顆看得見的 <img>。瀏覽器對同一個 URL（這裡是裁切好
    // 的 data URL）的解碼結果本身就會快取，等到真正寫進看得見的 <img>
    // 那一刻，幾乎可以直接沿用剛剛解碼好的結果立即顯示，不需要重新解碼、
    // 中間也就不會再有那段空白——視覺上就是使用者要的「直接切換」。
    const offscreen = new Image();
    offscreen.src = src;
    if(offscreen.decode){
      return offscreen.decode().then(apply, apply);
    } else {
      return new Promise(resolve => {
        const finish = () => { apply(); resolve(); };
        offscreen.onload = finish;
        offscreen.onerror = finish;
      });
    }
  }

  // 內建的預設圖（EDEN 那張 base64 PNG）進站就先套用同一套裁切邏輯，撞牆
  // 判斷從一開始就是照圖案實際邊緣算，不用等使用者換上圖片庫的圖才生效。
  // data: URI 是內嵌在頁面裡的本地資料，不會有 CORS 問題，一定能成功裁切。
  // 注意：這張內建預設圖現在純粹只當「物理迴圈量測撞牆矩形」用的內部
  // 素材，配合上面 CSS .dvd-bounce.dvd-image-pending 那層獨立的隱藏開關，
  // 保證使用者從頭到尾都不會真的看到它——真正會被看到的第一張圖，一定是
  // 下面圖片庫（EDEN_E_FOLDER_ID）抓回來、裁切完成後的照片（見
  // markDvdRealImageReady() 呼叫處的完整說明）。
  if(dvdBounceImgEl){
    // 這張內建預設圖從頭到尾不會真的顯示給使用者看（見上面完整說明），
    // 不需要算面積縮放倍率，這裡只取 .src、不傳 areaScale 給
    // setDvdBounceImageSrc()，維持固定高度。
    trimTransparentImage(dvdBounceImgEl.src).then(result => setDvdBounceImageSrc(result.src));
  }

  // ---------- 飄動的「e」撞牆換圖（來自 EDEN_E_FOLDER_ID 那個圖片庫） ----------
  // dvdEImages：裁切好的圖片庫陣列，init() 裡 await 完 dvdEImagesPromise、
  // 逐一裁切完成後才會填入；在那之前（或資料夾沒設定／是空的）維持空
  // 陣列，撞牆時直接跳過、繼續顯示原本內建的那張圖，不影響既有行為。
  // 陣列每一項是 {src, scale} 物件（見下面 computeDvdAreaScales() 的完整
  // 說明）：src 是可以直接當 <img src> 用的裁切後 data URL，scale 是這張
  // 圖依「實際有色面積」相對整批照片平均值算出來的顯示縮放倍率，換圖時
  // 兩個都要一起傳給 setDvdBounceImageSrc()。
  // dvdEImageIndex：目前顯示到陣列中的第幾張。每次撞牆改用隨機挑選（見
  // 下面 pickNextDvdEImageIndex() 的完整說明），不再是單純按順序 +1。
  let dvdEImages = [];
  let dvdEImageIndex = 0;
  // src -> 寬高比（naturalWidth/naturalHeight）：照片物理堆疊模式改成掉落
  // 「漂浮物件圖片庫」（dvdEImages）的去背圖之後，需要知道每張圖去背後
  // 真正的長寬比才能算出正確的掉落尺寸（見 spawnFallingPhotos()）。這裡
  // 在 predecodeDvdEImage() 每張圖解碼完成的同一刻順便量出來、寫進這個
  // cache——跟撞牆用的 dvdEDecodedSrcSet／pfAlphaMaskCache 是同一批背景
  // 暖機流程，不需要另外多跑一次。查不到（例如剛好還沒暖機完成）就退回
  // 正方形，行為跟原本 photo.aspect 缺值時的退回邏輯一致。
  const dvdEImageAspectCache = new Map();
  // ---------- 修正：「撞牆當下下一張還沒載入好，會在接下來的空中飄動
  // 途中才『趕上』切換」----------
  // 成因：setDvdBounceImageSrc() 內部一律用「畫面外 Image().decode() 完成
  // 後才 apply」這套機制換圖（見該函式的完整說明，這是為了避免換圖那一刻
  // 短暫消失，不是本次要動的部分）。但 cycleDvdEImage() 原本不管這張圖
  // 有沒有真的預先解碼完成，撞牆當下一律直接呼叫 setDvdBounceImageSrc()
  // 並且立刻更新 dvdEImageIndex／history／dvdEImageLastChangeAt 這些狀態、
  // 當成「這次撞擊已經換好圖了」。如果這張圖剛好還沒被 predecodeDvdEImage()
  // 處理完（網路慢、或裁切/解碼還在排隊），decode() 要等到之後才 resolve
  // ——但飄動物件的物理迴圈完全不會因此暫停，撞牆後照樣繼續往反方向飄，
  // 等 decode() 真的 resolve、新圖才套用上去時，畫面上的物件其實已經
  // 離開牆面、飄在半空中了，使用者體感就是「撞擊當下沒反應，換圖動作卻
  // 發生在接下來的飄動途中才趕上」。
  // 修法：用這個 Set 記錄「這個 src 已經確定被瀏覽器解碼完成過」（寫入
  // 時機見下面 predecodeDvdEImage() 的 afterDecode、以及
  // setDvdBounceImageSrc() 的 apply()）。cycleDvdEImage() 撞牆當下先查
  // 這個 Set：已經解碼完成過，才真的换圖、更新狀態；還沒解碼完成，代表
  // 「這一次撞擊來不及了」，直接放棄這次換圖、完全不更新任何狀態（連
  // dvdEImageLastChangeAt 也不動），畫面維持顯示原本那張圖，等下一次
  // 真的撞牆時才重新檢查一次——不會有「已經飄離牆面才切換」的空中趕上
  // 情形，只會「這次沒換成、下次撞擊再換」。
  const dvdEDecodedSrcSet = new Set();

  // 背景把整個圖片庫都預先解碼好，撞牆換圖的當下才不用臨時等待——這裡的
  // 圖片這時已經是裁切完成的 data URL（本地資料），主要是讓瀏覽器先解碼
  // 一次、避免第一次顯示時的解碼延遲，不是網路下載的問題。
  // 同樣改成一張一張、用 requestIdleCallback 排隊處理（理由跟上面
  // trimDvdEImagesStaggered() 完全一樣：避免整批圖片同時觸發解碼，
  // 集中在同一小段時間內造成卡頓），不是一次把整批全部塞給瀏覽器。
  // ---------- 修正：「初次進站撞牆換到新圖那一刻還是會頓一下，撞過一輪
  // 之後就不會了」----------
  // 成因：requestAlphaMask()（撞牆判斷要用的像素遮罩）原本只在
  // setDvdBounceImageSrc() 真正換上一張新圖的當下才第一次被觸發建立——
  // 也就是使用者眼前的飄動物件「剛好撞到牆、正在切換圖片」的那一瞬間，
  // 才臨時去跑 buildAlphaMaskFromSource() 那段「畫 800px 見方的 canvas＋
  // 完整讀取像素＋手動兩階段縮小」的同步運算，雖然本身已經包了一層
  // requestIdleCallback（見 requestAlphaMask() 內的說明），但也代表這段
  // 運算跟「畫面上物件正要開始新一段飄動」幾乎是同一時間發生，很容易
  // 讓那一格動畫影格被延遲。圖片庫每張圖只要建立過一次遮罩就會永久
  // 快取（pfAlphaMaskCache），所以撞過一輪、每張圖都至少被撞過一次
  // 之後，之後同一批圖片重複出現就不會再觸發這段運算——這正是「漸漸
  // 就不會了」的原因。
  // 修法：不要被動等撞牆才建立，而是在這裡（圖片庫已經解碼完成、閒置
  // 時間本來就要拿來暖機解碼快取）順便把每一張圖的像素遮罩也一起建立
  // 好——用同一套 requestIdleCallback 節奏，一張圖解碼完成、順手觸發它
  // 的遮罩建立，再排下一張，不會集中在同一小段時間內。等飄動物件真的
  // 撞到這張圖時，遮罩早就已經在背景準備好了，不會再需要臨時運算，
  // 「撞到新圖那一刻卡一下」的情況因此完全不會發生，而不是像原本那樣
  // 只是「撞過一輪之後才不會」。
  // ---------- 修正：「手機板初次打開網頁，飄動物件撞擊後偶爾沒有馬上
  // 切換，要到接下來的空中飄動途中才切換」----------
  // 成因：已就緒池（dvdEImages）裡的每一格，原本要嘛是上面「快速預載」
  // 那批已經先 decode() 過的 =s400 小圖，要嘛是背景 trimDvdEImagesStaggered()
  // 剛裁切完成、直接用 `dvdEImages[idx] = { src: result.src, scale: 1 }`
  // 寫進陣列的正式版本——後者這個 canvas.toBlob() 產生的新 blob URL，
  // 從來沒有被任何 <img> 真的解碼過一次。原本唯一會幫整批圖片預先
  // decode() 的 preloadDvdEImages()，要等 trimDvdEImagesStaggered() 整批
  // 全部處理完成才會被呼叫（見下面 `.then(trimmedEntries => {...})` 收尾
  // 那段），圖片庫張數多、或手機處理器較慢時，這段「整批跑完」可能要
  // 好幾秒——這段期間內，只要撞牆當下 pickNextDvdEImageIndex() 剛好選到
  // 「已經寫進池子、但還沒被 preloadDvdEImages() 排到」的這種格子，
  // cycleDvdEImage() 呼叫的 setDvdBounceImageSrc() 內部第一次對這個
  // blob URL 呼叫 decode()，就會是這張圖「這輩子第一次」真正解碼——
  // decode() 是非同步的，即使通常很快，也需要跨過至少一個事件迴圈的
  // 等待，而飄動物件的 requestAnimationFrame 物理迴圈完全沒有因此暫停，
  // 撞牆之後照樣繼續往反方向飄。等 decode() 真的 resolve、新圖被換上去
  // 的那一刻，畫面上的飄動物件其實已經離開牆面、正飄在半空中——使用者
  // 體感到的就是「撞擊當下沒反應，換圖動作卻發生在接下來的飄動途中」，
  // 而不是撞牆那一瞬間乾淨俐落地切換。
  // 修法：把「單張圖片預先 decode()＋建立像素遮罩」拆成獨立的
  // predecodeDvdEImage()，一張圖片「剛被寫進已就緒池的那一刻」就立刻
  // 呼叫（見下面 trimDvdEImagesStaggered() 的 onItemReady callback 內），
  // 不用再等整批背景裁切全部跑完才輪到。等使用者真的撞牆選到這一格時，
  // 瀏覽器對同一個 blob URL 的解碼結果早就快取好了，setDvdBounceImageSrc()
  // 內部的 decode() 幾乎必定立即 resolve，換圖動作因此能準確對齊撞牆的
  // 那一影格，不會再延到下一段飄動才顯現。
  // preloadDvdEImages()（整批完成後的收尾）維持不變、繼續呼叫：多數格子
  // 這時早已經被 predecodeDvdEImage() 處理過，重複呼叫 decode() 只是
  // 立即命中快取、幾乎零成本，純粹當作保底（例如萬一某一格 predecodeDvdEImage()
  // 失敗過），不會造成任何額外負擔或重複的視覺效果。
  function predecodeDvdEImage(src){
    const im = new Image();
    im.src = src;
    const afterDecode = () => {
      // 標記這個 src 已經確定解碼完成過——cycleDvdEImage() 撞牆當下靠這個
      // 標記判斷「這張圖來不來得及在這次撞擊換上」，完整成因見上面
      // dvdEDecodedSrcSet 宣告處的說明。就算 decode() 是走 onerror 那條路
      // （圖片本身壞掉），也一併標記過，避免同一張壞圖每次撞到都被當成
      // 「還沒準備好」卡住不放行、永遠選不到別張。
      dvdEDecodedSrcSet.add(src);
      // 順便量出這張去背圖真正的長寬比，供照片物理堆疊模式掉落這張圖時
      // 使用（見 dvdEImageAspectCache 宣告處的完整說明）。decode() 失敗時
      // naturalWidth/naturalHeight 會是 0，不寫入，呼叫端自然退回正方形。
      if(im.naturalWidth && im.naturalHeight){
        dvdEImageAspectCache.set(src, im.naturalWidth / im.naturalHeight);
      }
      // 遮罩建立本身已經包了一層 requestIdleCallback（見 requestAlphaMask()
      // 內部），這裡呼叫只是「登記」，不會在這一刻同步跑重運算。
      requestAlphaMask(src, im);
    };
    if(im.decode){ im.decode().then(afterDecode, afterDecode); }
    else { im.onload = afterDecode; im.onerror = () => {}; }
  }
  function preloadDvdEImages(){
    let i = 0;
    function step(){
      if(i >= dvdEImages.length) return;
      const entry = dvdEImages[i++];
      if(!entry){ step(); return; } // 防呆：理論上呼叫這裡時整批應該都已經填滿密實，保留以防萬一有空洞
      predecodeDvdEImage(entry.src);
      scheduleIdle(step, { timeout: 600, fallbackDelay: 60 });
    }
    step();
  }

  // ---------- 修正「飄動物件一開始出現，馬上又LAG一下」----------
  // 成因：整批圖片庫原本是用 Promise.all(urls.map(trimTransparentImage))
  // 一次全部送出去——所有圖片幾乎同時下載完成，緊接著全部圖片的「裁切＋
  // toDataURL 編碼」這幾個同步、吃 CPU 的步驟，會在同一小段時間內一個接
  // 一個擠在主執行緒上跑完，中間完全沒有讓瀏覽器喘息、畫下一影格的機會；
  // 這個時間點又剛好緊接在使用者剛看到飄動物件第一次出現（見上面「先用
  // 小尺寸縮圖快速顯示」那段）之後，也剛好跟 renderGrid() 建立整個網格
  // DOM、prefetchAllInBackground() 開始搶網路頻寬同一時間發生——多件重工作
  // 疊在同一小段時間，就是使用者感受到的「一開始還很順，馬上就LAG一下」。
  // 修法：改成一次只處理一張，處理完才用 requestIdleCallback 排下一張——
  // 瀏覽器真的閒下來（代表這一影格該畫的畫面都畫完了）才會執行下一張的
  // 裁切，每張之間都讓得出至少一次繪圖／輸入處理的機會，運算總量沒有變少
  // （跟原本 Promise.all 最終要做的事完全一樣），但攤開在一段時間裡進行，
  // 不會再有「集中在同一小段時間內」造成的明顯卡頓。跟上面 prefetchAllInBackground()
  // / prefetchHoverThumbsInBackground() 用的是同一套排隊手法。
  // ---------- 修正：「還是會卡卡的」剩下的主因——網路下載整個被序列化了
  // ----------
  // 上面幾輪修正（去背裁切本身改用縮小版取樣掃邊界、PNG 編碼改走非同步
  // toBlob()、遮罩建立拆成一批批列）都已經把「裁切運算」這件事本身的
  // 主執行緒成本壓得很低了；但這裡原本 step() 是「這一張完整處理完（含
  // 網路下載＋解碼＋裁切）才透過 scheduleIdle() 排下一張」——網路下載
  // 本身完全被綁進這條序列化的鏈子裡，圖片庫張數一多，光是「一張一張
  // 排隊等網路來回」加總起來的時間，就可能是使用者形容「剛進站還會卡
  // 好一陣子」的主要來源：不是裁切運算真的卡住主執行緒那麼久，是「整批
  // 圖片庫要花多久才全部準備好」這件事本身被網路延遲拖得很長，而飄動
  // 物件在這整段「還沒準備好」的期間，撞牆用的像素遮罩、換圖用的裁切
  // 版本都還沒完全就緒，跟這段期間內其他背景工作（網格建置、預抓等）
  // 的執行時間點又常常重疊，加起来就是「頓一下」的次数、感受到的时长
  // 都偏多。
  // 修法：把「下載」跟「裁切」拆成兩件事分開處理——
  //   ① 下載（fetch＋轉成 blob URL＋等圖片真的解碼完成）：改用一個固定
  //      大小的「預抓視窗」（DVD_E_PREFETCH_LOOKAHEAD 張）主動提前搶跑，
  //      不受 scheduleIdle() 的閒置節奏限制。這一段主要是在「等網路」，
  //      不吃主執行緒的運算時間，多開幾張平行下載並不會讓飄動物件更卡，
  //      純粹是縮短「整批圖片庫準備好」所需的總時間。
  //   ② 真正花 CPU 的裁切運算（trimLoadedImage()）：完全維持原本一張
  //      一張、透過 scheduleIdle() 排隊執行的節奏不變——這一段才是真的
  //      會讓主執行緒卡住一下的部分，繼續攤開執行，不因為下載變快了就
  //      跟著變得更密集，飄動物件單次頓挫的幅度不會因此變得更明顯。
  // 兩者疊加：下載時間被「平行、提前」蓋掉大半，真正決定「整批準備好」
  // 所需總長的變成裁切運算本身（本來就已經很輕量）＋ scheduleIdle() 的
  // 排隊間隔，可以明顯縮短；但每一批裁切運算單獨造成的頓挫幅度完全沒變，
  // 不會有「總時間變短、但同一段時間內卡得更密集」這種副作用。
  // 下載失敗（網路錯誤、CORS 等）時退回呼叫原本的 trimTransparentImage()
  // 整套容錯路徑（重新 fetch 一次、失敗再試 crossOrigin img、最後真的
  // 不行就用原圖），行為跟原本完全一致，只是這種情況下沒辦法享受到
  // 預抓帶來的時間縮短。
  function trimDvdEImagesStaggered(urls, onItemReady){
    return new Promise(resolve => {
      const results = new Array(urls.length);
      let i = 0;

      // 低效能裝置（同上 DVD_LOW_POWER_DEVICE）降到 1 張：這幾張圖下載完
      // 之後緊接著的 decode／裁切都會排進同一條 scheduleIdle() 隊伍，
      // 一次搶跑越多張，代表越多張圖幾乎同時進入「待裁切」狀態，即使
      // 裁切本身還是排隊執行，光是「同時有好幾個 decode 在跑」本身在
      // 較弱的手機處理器上就會多佔用主執行緒／記憶體頻寬。preview 頁
      // 停留期間以飄動物件移動順暢為優先，張數降低換取影響更小；圖片庫
      // 「整批準備好」的總時間會拉長一些，但這段時間內物件依然可以正常
      // 撞牆／飄動，只是換圖用的新圖到位速度稍慢，可接受的取捨。
      const DVD_E_PREFETCH_LOOKAHEAD = DVD_LOW_POWER_DEVICE ? 1 : 3; // 同時間最多幾張圖片在搶跑下載，抓一個不會對行動網路造成太大負擔、又足夠蓋掉單張下載時間的數字
      const prefetchCache = new Map(); // idx -> Promise，resolve 成 { img, blobUrl }（下載＋解碼成功）或 null（失敗，裁切階段會改用 trimTransparentImage() 的完整容錯路徑重新讀取）

      function prefetchDvdEBlob(idx){
        if(idx >= urls.length || prefetchCache.has(idx)) return;
        const url = urls[idx];
        prefetchCache.set(idx, fetch(url, { mode: 'cors' }).then(res => {
          if(!res.ok) throw new Error('fetch failed: ' + res.status);
          return res.blob();
        }).then(blob => {
          const blobUrl = URL.createObjectURL(blob);
          return loadImageEl(blobUrl, null).then(
            img => ({ img, blobUrl }),
            err => { URL.revokeObjectURL(blobUrl); throw err; }
          );
        }).catch(() => null));
      }

      // 一開始先把最前面這一批填滿預抓視窗，讓最先要用到的幾張圖立刻
      // 開始搶跑下載，不用等第一次 scheduleIdle() 真的觸發才開始。
      for(let p = 0; p < DVD_E_PREFETCH_LOOKAHEAD; p++) prefetchDvdEBlob(p);

      function step(){
        if(i >= urls.length){ resolve(results); return; }
        const idx = i++;
        const url = urls[idx];
        // 這一張正式輪到處理了，順手把預抓視窗往後推一格，讓還沒被排到
        // 的下一張圖片也提前開始下載，維持視窗大小（同時在搶跑下載的
        // 張數）不變，形成一個持續往前滑動的下載視窗。
        prefetchDvdEBlob(idx + DVD_E_PREFETCH_LOOKAHEAD);

        const afterTrim = (trimmed) => {
          results[idx] = trimmed;
          // onItemReady：每處理完一張就立刻通知呼叫端，不用等整批都跑完
          // ——供下面 init() 的「已就緒池」機制使用，讓可以撞牆換到的圖庫
          // 隨處理進度即時變多，不用整批處理完成才一次到位（完整成因、
          // 設計理由見 init() 內對應的完整說明）。
          if(onItemReady) onItemReady(idx, trimmed);
          scheduleNext();
        };

        (prefetchCache.get(idx) || Promise.resolve(null)).then(entry => {
          if(!entry){
            // 預抓失敗，或這張圖片還沒被提前排進視窗（理論上不會發生，
            // 保底而已）：退回原本整套容錯路徑重新讀取。
            trimTransparentImage(url).then(afterTrim);
            return;
          }
          // 下載＋解碼多半這時候已經在背景完成了，這裡才真正花 CPU 做
          // 裁切運算——只有這一步會被計入 scheduleIdle() 的排隊節奏。
          trimLoadedImage(entry.img, url).then(trimmed => {
            URL.revokeObjectURL(entry.blobUrl);
            if(trimmed === null){
              // 理論上不太會發生（blob: URL 屬於同源，不該有跨網域限制
              // 讀取像素失敗的問題）：保底跟原本 trimTransparentImage() 一樣，
              // 改走完整的容錯路徑重新讀取。
              trimTransparentImage(url).then(afterTrim);
            } else {
              afterTrim(trimmed);
            }
          });
        });
      }
      function scheduleNext(){
        // ---------- 修正：「手機版一開始撞牆都不會變照片，一陣子後才會」
        // （承上面 init() 內那段 750ms 緩衝的說明，這裡是同一個症狀的
        // 另一半成因）----------
        // 成因：這裡原本不分裝置一律用 { timeout:600, fallbackDelay:60 }
        // 排下一張。有原生 requestIdleCallback 的桌機瀏覽器，這只是「最晚
        // 600ms 內一定會排到」的保底，實際多半更快觸發；但沒有原生 API
        // 的裝置（DVD_LOW_POWER_DEVICE，見上面 scheduleIdle() 旁的完整
        // 說明），會固定走「等一影格畫完＋再等 fallbackDelay」這條路徑，
        // 每一張圖之間都會確實吃到這 60ms，圖庫張數一多，光是排隊等待
        // 本身累積起來就是好幾百毫秒——這段時間裡「已就緒池」張數增加得
        // 很慢，使用者連續撞牆時常常還是命中同一張還沒被裁切好的位置，
        // 感覺就是「一開始都不會變、要等好一陣子」。
        // 修法：這類裝置改用更緊的排程間隔（timeout 降到 250、fallbackDelay
        // 降到 20），縮短的只是「排隊等待」本身，不影響 trimLoadedImage()
        // 真正花 CPU 的裁切運算內容或畫質；跟「頭幾秒還是會頓一下」這件事
        // 的取捨關係，已就緒池更快長大、使用者更快能撞到新照片，優先順序
        // 排在前面。桌機（有真正的 requestIdleCallback）維持原本數值不變。
        //
        // ---------- 再修正：「手機版剛進站，撞沒幾次就又看到同一張照片」----------
        // 成因：pickNextDvdEImageIndex() 的「最近 N 張不重複」規則，排除
        // 張數會被「目前已就緒池的張數」限制住（見該函式上方完整說明：
        // excludeCount = min(6, 池子張數 - 1)）。剛進站的頭幾秒，池子還在
        // 從 0 開始一張一張長大，張數本身就很小（例如只有 2、3 張），這時候
        // 排除名單自然也只能排除 1、2 張——不是隨機挑圖出包，是「防重複」
        // 這條規則在池子太小時本來就排不出更長的間隔，使用者這段時間內
        // 撞兩三次就看到同一張，機率上是必然的。上面 250ms/20ms 這組數值
        // 已經是「頭一次讓手機版撞牆就有反應」那輪修正調出來的，但填滿
        // 整批圖庫仍需要「張數 × 這組間隔」的時間，圖庫張數稍多時，這個
        // 「池子還很小」的窗口期依然有感。
        // 修法：把這類裝置的排程間隔再收更緊（timeout 降到 80、fallbackDelay
        // 降到 0）。trimLoadedImage() 真正花 CPU 的裁切運算完全不受影響
        // （這裡調的純粹是「排隊等待」的節奏），fallbackDelay:0 仍然是透過
        // setTimeout 排到下一個巨集任務、會先讓瀏覽器有機會畫面、處理觸控
        // 等更優先的事，不會變成真正的同步阻塞迴圈；只是不再額外多等那
        // 20ms，讓池子長大的速度更接近「網路下載＋裁切本身需要的時間」，
        // 盡量壓縮「池子太小、防重複規則形同虛設」這段窗口期的長度。
        scheduleIdle(step, DVD_LOW_POWER_DEVICE
          ? { timeout: 80, fallbackDelay: 0 }
          : { timeout: 600, fallbackDelay: 60 });
      }
      scheduleNext();
    });
  }

  // ---------- 依「實際有色面積」平均每張飄動照片顯示的大小 ----------
  // 使用者需求：飄動物件顯示的每一張照片，去背後真正「有顏色」的可視面積
  // 差異很大——例如細長的樹枝，去背後剩下的實際圖案面積遠比一張塞滿整個
  // 畫布的照片小很多；如果統一用同一個固定高度顯示，視覺上會覺得「樹枝
  // 那張明顯比較不明顯、比較小」。
  //
  // 這張圖顯示時走的是 CSS「固定 height、width:auto」，寬度是跟著裁切後
  // 矩形自己的寬高比（aspect = trimW/trimH，見 trimLoadedImage() 的完整
  // 說明）自動等比例算出來的。這代表單純只看 coverage（矩形「裡面」有多
  // 滿）並不夠：在「固定 height」的前提下，
  //   顯示面積 ∝ height² × aspect
  //   顯示出來的「有色面積」 ∝ 顯示面積 × coverage = height² × aspect × coverage
  // 也就是說矩形本身的寬高比（細長 vs 寬扁）跟 coverage 一樣，都會直接
  // 影響肉眼看到的有色面積大小；只針對 coverage 平均、完全不管 aspect，
  // 細長型的圖片矩形（例如直向的樹枝）就算 coverage 補到跟別人一樣，
  // 顯示出來的實際有色面積還是會偏小，這正是「現在看來不太平均」的成因。
  //
  // 做法：整批圖片庫都裁切完成後，改成取 coverage × aspect 這個乘積
  // （直接對應到上面「顯示出來的有色面積 ÷ height²」這個比例常數）的平均值
  // 當基準（用這批照片自己的平均，不寫死常數，圖庫換一批照片基準也會跟著
  // 自動調整）：
  //   - coverage × aspect 低於平均的（矩形細長、或畫面稀疏，例如細長的
  //     樹枝）→ 縮放倍率 > 1，顯示得比原本大
  //   - coverage × aspect 高於平均的（矩形寬扁、或畫面飽滿，例如塞滿畫面
  //     的橫幅照片）→ 縮放倍率 < 1，顯示得比原本小
  // 縮放同樣是套在 CSS 的 height 上，「顯示出來的有色面積」正比於 scale²，
  // 用 sqrt(平均值 / 自己的 coverage×aspect) 換算縮放倍率，縮放完之後
  // 「height² × aspect × coverage × scale²」這個乘積，每一張理論上都會
  // 趨近同一個數值——這時比較的才是使用者真正在意的「肉眼看到的有色面積」，
  // 不只是「矩形裡面的疏密程度」。
  // 縮放倍率夾在 [DVD_AREA_SCALE_MIN, DVD_AREA_SCALE_MAX] 之間，避免極端
  // 稀疏／細長（例如幾乎全透明、只剩一兩條細線的圖，理論倍率會大到不成
  // 比例）或極端飽滿／寬扁的照片被縮放到不合理的大小。
  // coverage 或 aspect 是 null／算不出來的項目（裁切失敗、整張透明等，見
  // trimTransparentImage() 的說明）不參與平均值計算，縮放倍率固定給 1，
  // 維持原本固定高度的行為。
  //
  // ---------- 修正「還是有些照片顯得突然特別小或特別大」----------
  // 上面這套「完全按 coverage×aspect 比例修正」的做法在數學上没問題，但
  // 實際套用到一整批照片、且圖庫組成不受控制時，有兩個地方會放大成「视觉
  // 上忽大忽小」的觀感問題：
  //
  //   1) 基準用「平均數」：只要圖庫裡混進一兩張特別極端的照片（例如整張
  //      幾乎全透明、只剩一根細線的圖案），這一兩張的 coverage×aspect 值
  //      會小到不成比例，直接把「平均數」這個基準本身往下拉走，等於連帶
  //      拖累了其他原本正常、比例均衡的照片，讓它們的縮放倍率也跟著被
  //      這一兩張離群值污染、算出不合理的結果。
  //      改用「中位數」當基準：中位數只看排序後最中間那個值，不會因為
  //      一兩張極端照片的數值有多誇張而被拉走，天然對離群值不敏感，抓到
  //      的是這批照片裡「一般典型的那一張」大概長什麼樣子，其他照片才有
  //      一個穩定、不被少數幾張污染的比較基準。
  //
  //   2) 「完全修正」（100% 照理論倍率縮放）：coverage×aspect 終究只是用
  //      裁切後矩形這個粗略幾何量去估計「人眼實際感受到的視覺份量」，兩者
  //      不會每次都完全吻合——例如同樣的有色面積，形狀瑣碎、破碎分散的
  //      圖案，人眼會覺得比一整塊完整色塊「輕」，但公式算出來的面積是
  //      一樣的。這批估計特別不準的照片，用 100% 修正力道去縮放，反而會
  //      矯枉過正，變成「這張突然放超大」或「這張突然縮超小」——這正是這次
  //      使用者回報「有些看起來突然太小或太大」的成因，不是公式邏輯錯誤，
  //      是「完全相信一個本來就只是粗略估計值」這個做法本身太激進。
  //      改成只套用 DVD_AREA_SCALE_DAMPING 這個比例的修正力道（例如 0.7 代表
  //      只修正理論差距的 7 成，保留 3 成原本的落差不修正）：效果是「把最
  //      極端的落差往中間拉近、變得沒那麼誇張，但不強求每張的顯示面積
  //      完全相等」，比「數學上完全相等」更貼近人眼的自然觀感，也更能
  //      容忍 coverage/aspect 這個估計值本身偶爾不準。
  //
  //   另外縮放區間本身也一併收窄（0.65~1.7 → 0.78~1.3）：兩者疊加後，
  //   整批照片之間最大的顯示比例差距從原本理論上的 2.6 倍（1.7/0.65），
  //   收斂到約 1.67 倍（1.3/0.78），肉眼感受上是「差不多大、略有大小之分」，
  //   不會再出現單張特別突兀的極端大小。
  const DVD_AREA_SCALE_MIN = 0.78; // 飽滿/寬扁照片最多可以縮到多小——維持原樣不變
  const DVD_AREA_SCALE_MAX = 1.6; // 稀疏/細長圖案（去背後面積佔比小）最多可以放大到多大——原本是 1.3，
                                    // 使用者確認「相對細小的圖片顯示得比較大」是可以接受的，所以放寬上限，
                                    // 讓這類圖案的顯示大小能更接近其他照片
  // 修正力道拆成「該放大」跟「該縮小」兩個方向分開調整：idealScale > 1（去背後面積佔比偏小、該被放大
  // 拉近平均）的圖案，用 UP 這組更高的力道，讓它們更接近其他照片的視覺份量；idealScale < 1（面積佔比
  // 偏大、飽滿寬扁、該被縮小）的圖案，維持原本 0.7 的力道不變——使用者只要求「小圖可以更大」這個方向，
  // 沒有要求「大圖要再縮更小」，所以那個方向刻意不動，避免意外把原本正常大小的照片縮得比之前更小。
  // 力道定義同下：1 = 完全按比例修正（理論上讓每張圖的有色面積完全相等），0 = 完全不修正（維持固定高度）
  const DVD_AREA_SCALE_DAMPING_UP = 0.9;   // 該放大的方向：力道拉高，原本兩個方向共用 0.7
  const DVD_AREA_SCALE_DAMPING_DOWN = 0.7; // 該縮小的方向：維持原本力道，不額外加強
  function computeDvdAreaScales(entries){
    const weightOf = e => e.coverage * e.aspect;
    const valid = entries.filter(e => e
      && typeof e.coverage === 'number' && e.coverage > 0
      && typeof e.aspect === 'number' && e.aspect > 0);
    if(!valid.length){
      // 這批圖沒有任何一張算得出 coverage/aspect（理論上很少見）：全部
      // 維持縮放倍率 1，等同沒有這套機制時的原本固定高度行為。
      return entries.map(e => ({ src: (e && e.src) || e, scale: 1 }));
    }
    // 中位數當基準（見上面完整說明）：排序後取最中間的值，資料筆數是偶數
    // 時取中間兩個的平均，是標準的中位數算法。
    const sortedWeights = valid.map(weightOf).sort((a, b) => a - b);
    const mid = Math.floor(sortedWeights.length / 2);
    const medianWeight = sortedWeights.length % 2 === 0
      ? (sortedWeights[mid - 1] + sortedWeights[mid]) / 2
      : sortedWeights[mid];
    return entries.map(e => {
      const src = (e && e.src) || e;
      if(!e || typeof e.coverage !== 'number' || e.coverage <= 0
        || typeof e.aspect !== 'number' || e.aspect <= 0){
        return { src, scale: 1 };
      }
      const idealScale = Math.sqrt(medianWeight / weightOf(e)); // 理論上「完全修正」該用的倍率
      // 只朝理論倍率的方向拉近對應力道的比例，不是直接套用理論值本身——
      // 1 + (理論值 - 1) × 力道，力道是 0 就等於維持 1（不修正），力道是 1
      // 就等於完全採用理論值，中間值就是按比例拉近。idealScale >= 1（該放大
      // 的細小/稀疏圖案）用 DAMPING_UP，< 1（該縮小的飽滿圖案）用
      // DAMPING_DOWN，兩個方向分開調整（見上面常數定義處的完整說明）。
      const damping = idealScale >= 1 ? DVD_AREA_SCALE_DAMPING_UP : DVD_AREA_SCALE_DAMPING_DOWN;
      const damped = 1 + (idealScale - 1) * damping;
      const scale = Math.min(DVD_AREA_SCALE_MAX, Math.max(DVD_AREA_SCALE_MIN, damped));
      return { src, scale };
    });
  }
