    if(pfFinished) return; // 保底逾時跟「全部掉出畫面」偵測可能幾乎同時觸發，只收尾一次
    pfFinished = true;
    clearTimeout(pfExitFallbackTimer);
    clearTimeout(pfExitPollTimer);

    const Matter = window.Matter;
    if(Matter && pfEngine){
      const { Runner, Composite } = Matter;
      // pfSyncHandler 現在已經不是掛在 Matter 的 afterUpdate 事件上（見
      // startPhotoFallEngine() 內的說明，改由 pfLoopTick() 每影格手動呼叫
      // 一次），這裡不用再 Events.off 解除訂閱；下面把 pfLoopTick 停掉、
      // pfSyncHandler 設回 null，自然就不會再有任何後續呼叫。
      if(pfRunner) pfStopLoop();
      pfRunnerPaused = true;
      Composite.clear(pfEngine.world, false);
      Matter.Engine.clear(pfEngine);
    }
    pfEngine = null; pfRunner = null; pfMouse = null; pfMouseConstraint = null;
    pfGroundBody = null; pfLeftWall = null; pfRightWall = null;
    // 見 startPhotoFallEngine() 內 pfMouseButtonGuard 宣告處的完整說明：
    // 這是額外掛在 document 上的 listener，不是掛在 pfMouseConstraint／
    // pfEngine 這些會被上面 Engine.clear()／Composite.clear() 一併清掉的
    // 物件上，必須自己手動 removeEventListener，否則下一次進堆疊模式
    // 又會重新掛一個新的，document 上会疊加越來越多份同樣的 listener。
    if(pfMouseButtonGuard){
      document.removeEventListener('mousemove', pfMouseButtonGuard);
      pfMouseButtonGuard = null;
    }
    pfDragging = false; // 這一輪徹底收尾了，重設乾淨，避免殘留的 true 影響下一輪堆疊模式
    pfDvdFloor = null; pfLastBatchUrls = new Set(); // 換批用的狀態一併重設，避免殘留影響下一輪堆疊模式
    pfDvdItem = null; pfSyncHandler = null; pfFinished = false;

    photoFallStage.classList.remove('active', 'grabbing');
    photoFallStage.innerHTML = '';
    pfItems = [];

    document.body.classList.remove('photo-fall-active');
    document.body.style.overflow = '';

    // 飄動的 e：清掉物理迴圈留下的 inline transition，交還給原本的拖曳／
    // 彈跳系統，resetDvdBounce() 會給它一個全新的隨機位置＋方向重新出發，
    // 跟平常「放開甩出去之後」的手感一致。
    //
    // 修正：物理迴圈（pfSyncHandler）每一影格寫入的是
    // `translate(...) rotate(body.angle)`，帶著旋轉角度——上面只清掉了
    // transition，沒有清掉這個殘留的 transform，rotate() 還留在元素身上。
    // 緊接著 startDvdBounce() → resetDvdBounce() 會先呼叫 measureDvdSize()
    // 量測 e 的實際寬高才決定新的撞牆邊界；measureDvdSize() 是用
    // getBoundingClientRect() 量，這支 API 算的是「套用當下 CSS transform
    // 之後」的軸對齊外接矩形——元素還帶著旋轉角度時，量到的外接矩形會比
    // 圖片實際的視覺大小更大（旋轉的矩形，四個角會撐開外接框）。後面整套
    // 撞牆物理（dvdW/dvdH、dvdBoundMaxX/MaxY、resolveDvdObstacleCollision）
    // 全部沿用這個被撐大的錯誤尺寸判斷碰撞，跟畫面上實際看到的圖片邊緣
    // 對不齊——這正是「點開堆疊頁面、回到首頁後，飄動的 e 撞在不是實際
    // 照片邊界的地方」的成因：物理判定用的碰撞框比看得到的圖片範圍還大
    // 一圈，肉眼看起來「還沒碰到照片」就先觸發了碰撞。
    // 這裡先把 transform 一併清空，讓 measureDvdSize() 量到的是乾淨、
    // 沒有殘留旋轉的原始尺寸；resetDvdBounce() 稍後會用正確的新位置重新
    // 寫入乾淨的 translate(...)，不會有瞬間跳位或閃爍。
    dvdBounce.style.transition = '';
    dvdBounce.style.transform = '';
    photoFallModeActive = false; // 一定要在呼叫 startDvdBounce()／resetDvdBounce() 之前解除，否則會被上面那組 guard 擋下
    startDvdBounce();

    // 首頁縮圖／編號：直接重用「照片詳情頁關閉回首頁」同一套放大進場動畫
    // （prepareGridRevealState + playGridRevealAnimation），確保視覺效果
    // 跟使用者已經熟悉的首頁進場完全一致，不是另外做一套新的。
    prepareGridRevealState();
    pageClock.style.transition = 'none';
    pageClock.style.opacity = '0';
    void grid.offsetWidth; // 強制 reflow，確保上面「瞬間切到起始值」先套用過一次
    pageClock.style.transition = `opacity ${HOME_REVEAL_MS}ms ease`;
    requestAnimationFrame(() => { pageClock.style.opacity = '1'; });
    playGridRevealAnimation();
    photoFallGridAlreadyRevealed = true; // 見該旗標宣告處的完整說明：告訴 closePreviewPage() 這輪不用再播一次
    clearTimeout(homeRevealCleanupTimer);
    homeRevealCleanupTimer = setTimeout(() => {
      pageClock.style.transition = '';
      pageClock.style.opacity = '';
    }, HOME_REVEAL_MS + 60);

    photoFallState = 'idle';
  }

  // ================= 堆疊模式期間按 Preview：飄動的 e 暫停等待／恢復飄動／掉回堆疊 =================
  // 使用者可能在堆疊模式（photoFallState === 'active'）期間直接點 Preview
  // 標籤：見 openPreviewPage() 內對 photoFallModeActive 的特例判斷（負責
  // 觸發下面的凍結）、useSlideCover 分支內 settleAfterCover()（preview 的
  // 照片真正蓋滿畫面那一刻，呼叫下面的 resumeDvdFloatAfterPhotoFallCover()）、
  // 以及 closePreviewPage() 內的 closingBackToPhotoFall（使用者點一下關閉
  // preview、要回到堆疊頁面那一刻，呼叫下面的 dropDvdBackIntoPhotoFall()）。
  let previewFromPhotoFall = false; // 記錄這次開啟的 preview 是不是從堆疊模式底下打開的

  // ---------- Preview 的照片真正蓋滿畫面後：e 脫離物理世界，恢復成一般飄動狀態 ----------
  function resumeDvdFloatAfterPhotoFallCover(){
    if(!previewFromPhotoFall) return; // 使用者可能在蓋下來的動畫播完之前就已經按了關閉
                                       // （見 dropDvdBackIntoPhotoFall()），那種情況已經處理過了，這裡不用再重複做一次
    document.body.classList.remove('pf-dvd-covering');

    // 修正：openPreviewPage() 現在改成只要 photoFallModeActive 就認定是
    // 「從堆疊模式底下打開」（見該處完整說明），這也包含使用者剛好在雙擊
    // 收起堆疊（exitPhotoFallMode() 進入 'exiting'）之後、整批照片還沒真正
    // 掉出畫面前，緊接著又按了 Preview 的情況。這種情況下，蓋下來的這段
    // 時間裡，原本的堆疊收場流程可能已經自己跑完了（exitPhotoFallMode()
    // 的輪詢偵測到全部掉出畫面、呼叫 finishExitPhotoFallMode()）——它已經
    // 負責把 photoFallModeActive 設回 false、把飄動的 e 恢復成正常飄動
    // （重新呼叫 startDvdBounce()）、也已經觸發首頁縮圖重新放大進場的
    // 動畫。這裡如果不判斷、照樣往下走完整套「讓 e 脫離物理世界、恢復
    // 飄動」的邏輯，會在 finishExitPhotoFallMode() 已經處理好的飄動狀態上
    // 再蓋一次隨機方向／位置，讓 e 出現不該有的跳動；如果使用者關閉
    // preview 時又誤判成要「掉回堆疊」，堆疊其實已經不存在了，也會出錯。
    // photoFallModeActive 在這裡如果已經是 false，代表就是這種「已經自己
    // 收尾完畢」的情況——不需要（也不應該）再重複處理，直接結束即可。
    if(!photoFallModeActive) return;

    const Matter = window.Matter;
    // ---------- 修正「preview 頁蓋下來時，飄動物件的角度會被拉正回 0 度」
    // ----------
    // 物理世界裡的旋轉角度（Matter body.angle，弧度、連續累加，可能是
    // 撞了好幾次牆、滾了不只一整圈之後的任意角度）要在這裡（Composite.remove
    // 把 body 真正拿掉之前）先讀出來——原本這裡完全沒有讀它，下面直接把
    // dvdRotationDeg 寫死成 0，等於使用者看到的畫面是「還在堆疊裡歪斜著的
    // 那個物件，preview 蓋下來、恢復飄動的那一瞬間，角度忽然被拉正回
    // 水平」，跟牠原本自由旋轉、停在哪個角度就是哪個角度的觀感完全不符。
    let bodyAngleRad = 0;
    if(Matter && pfEngine && pfDvdItem){
      bodyAngleRad = pfDvdItem.body.angle;
      Matter.Composite.remove(pfEngine.world, pfDvdItem.body);
    }
    pfDvdItem = null;
    // 從按下 Preview 到這一刻蓋滿畫面為止，整個物理世界（飄動的 e＋底下
    // 堆疊照片）都持續正常運作、沒有被提早凍結（見 openPreviewPage() 內
    // 的說明），這裡才是真正該讓它停下來的時間點：preview 已經完全蓋住
    // 畫面，不管停不停使用者都看不出差異，純粹是省下沒必要的運算，也讓
    // dropDvdBackIntoPhotoFall() 之後重新 Runner.run() 的行為跟原本設計
    // 一致（那邊預期的是「進來時停、關閉時才重新啟動」）。
    if(Matter && pfRunner){ pfStopLoop(); pfRunnerPaused = true; }
    // e 目前畫面上的位置（物理世界凍結那一刻停在哪裡）就是它恢復飄動的
    // 起始位置，讀出目前的 transform 換算回 dvdX/dvdY，接上飄動迴圈的座標
    // 系統，才不會有瞬間跳位。
    measureDvdSize();
    const rect = dvdBounce.getBoundingClientRect();
    dvdX = rect.left;
    dvdY = rect.top;
    // 修正：不再寫死成 0——把剛剛讀到的物理世界角度（弧度）換算成度數，
    // 接到飄動迴圈這一套「小幅度撞牆旋轉」系統的角度變數上。兩套系統的
    // 角度單位（Matter 用弧度、飄動迴圈用度數）不同，基準（0 度的定義）
    // 卻是一致的，只要做這一次單位換算，銜接起來就是「牠當下圖片是什麼
    // 角度，扁成飄動物件就是什麼角度」，不會有瞬間轉正的跳動。
    dvdRotationDeg = bodyAngleRad * 180 / Math.PI;
    dvdRotationVel = 0; // 角速度不延續：物理世界裡滾動的瞬時角速度單位、量級都跟飄動迴圈這套「撞牆才轉一點」的角速度對不上，延續過去的意義不大，靜止的角度本身才是重點，這裡維持原本「重新出發」的設計，只修正角度本身被拉正的問題
    dvdBounce.style.transition = '';
    dvdBounce.style.transform = dvdTransformString(dvdX, dvdY);
    setDvdDirection(Math.random() * Math.PI * 2); // 從靜止的堆疊狀態重新出發，隨機挑一個飄動方向
    dvdSpeed = DVD_SPEED;
    dvdDecaying = false;
    if(!dvdDragging && !dvdRAF){
      dvdLastTime = null;
      dvdRAF = requestAnimationFrame(stepDvdBounce);
    }
  }

  // ---------- 使用者關閉 preview、回到堆疊頁面：e 立刻恢復重力，原地掉回堆疊 ----------
  function dropDvdBackIntoPhotoFall(){
    previewFromPhotoFall = false;
    document.body.classList.remove('pf-dvd-covering'); // 保險：蓋下來的動畫可能還沒播完就被使用者提早關閉
    if(dvdRAF){ cancelAnimationFrame(dvdRAF); dvdRAF = null; }
    dvdDragging = false;
    dvdBounce.classList.remove('dvd-grabbing');
    // 保險同上（見 enterPhotoFallMode 內對應那段的說明）。
    if(dvdRotatePointerId !== null) endDvdRotateGesture(dvdRotatePointerId);
    if(dvdDragRotRAF){ cancelAnimationFrame(dvdDragRotRAF); dvdDragRotRAF = null; }
    const Matter = window.Matter;
    if(Matter && pfEngine){
      if(!pfDvdItem){
        // e 已經恢復飄動過（蓋下來的動畫已經播完），這裡要重新建立一個新的
        // 物理 body，把它目前飄動到的座標帶回物理世界，才能接上重力掉回
        // 堆疊；如果蓋下來的動畫還沒播完就被關閉，pfDvdItem 這時其實還在
        // 如果蓋下來的動畫還沒播完就被關閉，pfDvdItem 這時其實還在
        // 世界裡正常運作中（現在改成蓋滿畫面那一刻才凍結，見
        // openPreviewPage() 內的說明），不需要重建，直接跳過這一段。
        measureDvdSize();
        const dvdMaskEntry = dvdActiveImgSrc ? getCachedAlphaMask(dvdActiveImgSrc) : null;
        const dvdBody = buildFallItemBody(Matter, dvdMaskEntry, dvdX + dvdW / 2, dvdY + dvdH / 2, dvdW, dvdH, {
          // 同 startPhotoFallEngine() 內的修正：帶入目前飄動角度
          // （dvdRotationDeg），避免重新掉回堆疊那一刻先瞬間轉正成 0 度、
          // 才開始下墜，改成維持原本傾斜的樣子自然往下掉。
          angle: dvdRotationDeg * Math.PI / 180,
          restitution: 0.3, // 0.8 太接近全彈跳，多顆疊在一起的照片互相碰撞時會一直小幅度來回彈、看起來在抖動；調低到 0.3，還有一點回彈感，但不會抖個不停
          friction: 0.55,
          frictionAir: 0.012,
          density: 0.0026,
          collisionFilter: { category: PF_CATEGORY_DVD }, // 見 startPhotoFallEngine() 內同一個屬性的說明
        });
        Matter.Composite.add(pfEngine.world, dvdBody);
        pfDvdItem = { body: dvdBody, w: dvdW, h: dvdH };
        dvdBounce.style.transition = 'none';
      }
      // 只有在物理世界真的已經被停下來的情況下（pfRunnerPaused，見該旗標
      // 的完整說明）才需要重新呼叫 Runner.run()：使用者如果是在蓋滿畫面
      // 之前就提早關閉 preview，runner 這段期間其實從頭到尾沒被停過，
      // 這裡就不能再呼叫一次 Runner.run()，否則會疊加出第二個
      // requestAnimationFrame 迴圈，讓物理模擬速度變兩倍。
      if(pfRunner && pfRunnerPaused){ pfStartLoop(); pfRunnerPaused = false; }
    }
  }

  // ---------- preview ↔ 首頁：「整塊滑動」轉場的共用設定 ----------
  // 原本這套「整塊從正上方蓋下來 / 往上滑走」的轉場只套用在桌機／平板，
  // 手機版另外走一套純 opacity 淡入淡出。使用者要求手機版改成跟桌機版
  // 完全同一種形式——一樣是整塊從畫面正上方蓋下來/滑走，一樣的時長、
  // 一樣的速度曲線（不要手機另外套一條「線性」或其他曲線，物理感要
  // 完全一致）——所以拿掉原本依螢幕寬度切換兩套轉場的判斷，統一全裝置
  // 都走這一套滑動轉場；下面 --preview-slide-duration / --preview-slide-ease
  // 這兩個變數本來就定義在 :root（不分螢幕寬度），現在全裝置共用同一份，
  // 天生保證「同樣的加速度、同樣流暢」，不需要另外同步兩處數字。
  const PREVIEW_SLIDE_DURATION_MS = 420; // 跟 CSS 的 --preview-slide-duration（.42s）保持同一個數字
  const PREVIEW_SLIDE_FALLBACK_MS = PREVIEW_SLIDE_DURATION_MS + 130; // 保底逾時：萬一某些瀏覽器邊界情況下 transitionend 沒有觸發，最多等動畫時長再加一點緩衝就強制收尾，不要讓頁面卡在滑一半的狀態

  let previewClosing = false; // 「往上滑走」轉場進行中的旗標，避免重複觸發疊加動畫
  let previewOpening = false; // 「往下蓋下來」轉場進行中的旗標，避免重複觸發疊加動畫

  function openPreviewPage(pushHistory, instant){
    if(pushHistory === undefined) pushHistory = true;
    if(!previewOddPhotos.length || !previewEvenPhotos.length) return;

    // ---------- 從照片物理堆疊模式按 Preview 進來的特例 ----------
    // 使用者可能在堆疊模式期間直接點 Preview 標籤：飄動的 e（以及底下已經
    // 落地不動的堆疊照片）這裡「不」立刻凍結物理世界——讓它們照常繼續
    // 運作，飄動的 e 會維持正常的碰撞／彈跳動作，直到下面 useSlideCover
    // 分支內 settleAfterCover() 偵測到 preview 的照片真正蓋滿整個畫面那一
    // 刻，才在 resumeDvdFloatAfterPhotoFallCover() 裡把整個物理世界的時鐘
    // 停下來、同時讓飄動的 e 脫離物理世界、恢復成一般的飄動狀態（那時已經
    // 被 preview 完全蓋住，畫面上不會看到任何切換的痕跡）。
    // pf-dvd-covering 這個 class 純粹是疊圖順序的處理：把飄動字（原本
    // z-index:99999，全站最高）暫時壓到 preview-page（900）之下，讓
    // preview 蓋下來的照片能真的視覺上蓋過它，不會穿幫地浮在最上層；
    // 15 張堆疊照片本身則是靠 CSS body.photo-fall-active.preview-active
    // 這條規則自動被蓋住（見該處說明），不需要另外用 JS 處理，也跟物理
    // 世界要不要繼續運作無關。
    //
    // 修正：這裡原本只認 photoFallState === 'active' 這一種狀態，'entering'
    // （15 張照片還在陸續掉進來）、'exiting'（雙擊收起、整批正在掉出畫面）、
    // 'reshuffling'（單擊換批、舊照片正在掉出畫面）這三種過渡狀態按下
    // Preview 完全不會被這裡認出來——不會加上 pf-dvd-covering、
    // previewFromPhotoFall 也維持 false。結果是：飄動的 e／堆疊照片其實
    // 還照常在物理世界裡運作，蓋下來的 preview 卻完全不知道自己是從堆疊
    // 模式底下打開的；使用者關閉 preview 時，closePreviewPage() 因為讀到
    // previewFromPhotoFall 是 false，會誤判成「要回到首頁格子」，提早把
    // 首頁縮圖的放大進場動畫播出來——這正是「堆疊照片在前面、後面是正常
    // 首頁」同時並存的成因之一：首頁格子其實已經被重新顯示，只是暫時被
    // 還沒收乾淨的堆疊畫面擋在前面。
    // 改成只要 photoFallModeActive 是 true（entering／active／exiting／
    // reshuffling 這整段期間都是 true，見該旗標的定義），不管當下是哪一個
    // 細部狀態，一律視為「這次 Preview 是從堆疊頁面底下打開的」，讓後續
    // 蓋下來、關閉的整套邏輯都能正確辨識、正確收尾，不會再有堆疊畫面跟
    // 首頁格子同時出現的情況。
    if(!previewFromPhotoFall && photoFallModeActive){
      previewFromPhotoFall = true;
      document.body.classList.add('pf-dvd-covering');
      // 每次重新開始一輪「從堆疊模式底下打開 preview」都要重設成 false：
      // 這個旗標只該反映「這一輪蓋住畫面期間，堆疊是不是自己在背後跑完
      // 收場流程」（見 finishExitPhotoFallMode() 內設成 true 的地方、
      // closePreviewPage() 內消耗它的說明）。如果不在這裡歸零，萬一
      // 上一次是「單純在首頁雙擊收起堆疊、完全沒有經過 preview」的正常
      // 流程，finishExitPhotoFallMode() 一樣會把它設成 true，但那次根本
      // 沒有任何地方會去消耗它——這個「過期的 true」會一路殘留，直到這
      // 一輪才被誤判成「這次也已經播過了」，害這次真正需要播放的首頁進場
      // 動畫被平白跳過。
      photoFallGridAlreadyRevealed = false;
    }

    // 不管使用者當下是在首頁網格還是照片詳細頁進來（後者代表是從詳細頁
    // 按 Preview，底下留著 detail-active，見下面的說明），preview 頁本身
    // 都該看得到飄動的 e——先把 openDetail() 可能加上的 dvd-hidden 拿掉，
    // 讓它照 CSS 那條帶回彈的 transition 快速放大＋淡入出現。就算目前
    // 根本沒有這個 class（例如本來就是從首頁開的），classList.remove 對
    // 沒有這個 class 的元素也是無害的重複操作。
    dvdBounce.classList.remove('dvd-hidden');
    // 如果剛剛是從「preview 關閉、退回詳細頁」那條路徑暫停掉物理迴圈
    // （見 closePreviewPage() 內 closingBackToDetail 的說明），這裡重新
    // 打開 preview 時要記得接回去，飄動的 e 才不會停在原地不動；直接從
    // 暫停當下的 dvdX/dvdY 繼續飄，不重新隨機取位置/方向。
    if(!photoFallModeActive && !dvdDragging && !dvdRAF){
      dvdLastTime = null;
      dvdRAF = requestAnimationFrame(stepDvdBounce);
    }

    // 不管使用者當下是在首頁網格還是照片詳細頁，這裡都不主動關閉/清空
    // 詳細頁的狀態，讓它原封不動留在 preview 底下——因為 preview-page
    // 的 z-index（900）本來就比 detail-page（50）高、蓋起來時又是完全
    // 不透明的白底，兩者疊在一起使用者也看不出底下是首頁還是詳細頁。
    // 好處是等使用者關閉 preview 時（見 closePreviewPage()），只要保留
    // 原本就在的東西不去動它，自然就會「回到剛剛蓋下來之前所在的那個
    // 畫面」——是首頁網格就留在首頁，是照片詳細頁就留在同一張照片，
    // 不會被強制導回首頁。
    hideHoverPreview();

    if(previewClosing){
      // 使用者在「往上滑走」轉場還沒播完時就又要開啟：立刻打斷關閉動畫，
      // 不要讓兩個方向的滑動轉場疊在一起互相打架
      previewPage.classList.remove('preview-slide-exit', 'no-fade');
      // 上面關閉動畫如果正在讓 collab 同步淡出（見 closePreviewPage() 內
      // collab-slide-exit 的說明），這裡也要一併打斷、拿掉，不然 collab
      // 會卡在被強制 opacity:0 的狀態——重新開啟 preview 後，collab 應該
      // 跟一般「從照片詳細頁按 Preview」一樣正常顯示（見 CSS 中
      // body.detail-active:not(.preview-active) 那條規則旁的完整說明）。
      document.body.classList.remove('collab-slide-exit');
      previewClosing = false;
    }

    document.body.classList.add('preview-active');
    // 注意：這裡不再連帶加上 preview-header-white（文字轉白色的 class）。
    // 下面 useSlideCover 分支（現在涵蓋所有裝置寬度）會改成動態量測照片
    // 實際滑動到的位置，等真的蓋過 header 那一整排才加上（見該分支內
    // checkCoverProgress 的完整說明）；instant（進站當下瞬間開啟）這種
    // 情境沒有這個時間差問題，該分支裡會立刻加上，效果跟原本一樣。字重維持
    // 全站統一的 350、不再有 preview 專屬的 260，所以不會再有「切換
    // preview 瞬間文字寬度跟著變、對齊偏移量對不準」的問題。這裡呼叫
    // syncFixedChrome() 純粹是保底：確保進入 preview 前 header 的對齊都
    // 是最新狀態，不影響任何視覺切換時機。
    syncFixedChrome();
    document.body.style.overflow = 'hidden';

    const useSlideCover = !instant; // 現在不分裝置寬度，全部走同一套滑動蓋下來轉場，只有「進站當下瞬間開啟」這個特例不需要動畫

    if(instant){
      // 進站當下第一次自動開啟：先關掉淡入動畫再切成 active，讓 opacity
      // 直接一步到位變成 1，不會有中間值讓底下的首頁網格透出來；下一個
      // 影格再把這個 class 拿掉，之後使用者手動開關 preview 都還是原本
      // 平滑的轉場。
      previewPage.classList.add('no-fade');
      void previewPage.offsetHeight; // 強制 reflow，確保上面這行先生效
      previewPage.classList.add('active');
      // 進站當下這一步是瞬間切成完全不透明，沒有前面提到的那段時間差
      // 問題，文字可以跟著同一刻直接轉白，不需要額外延後。
      document.body.classList.add('preview-header-white');
      // preview 現在真的蓋滿畫面了，補呼叫一次把時鐘定位、準備好（見
      // syncClockAlignment() 內的說明）——這一刻時鐘仍然被不透明的
      // previewPage 蓋住、使用者看不到，純粹是先把位置算好、備妥。
      syncFixedChrome();
      requestAnimationFrame(() => requestAnimationFrame(() => {
        previewPage.classList.remove('no-fade');
      }));
    } else if(useSlideCover){
      previewOpening = true;
      // 整塊從畫面正上方「蓋下來」，不分手機／平板／桌機，全部共用同一套
      // 時長／速度曲線（見 CSS 的 --preview-slide-duration /
      // --preview-slide-ease），物理感完全一致。
      // 先用 no-fade + preview-slide-start 把 opacity/visibility/transform
      // 一次到位「瞬間」定位到畫面正上方（不透明、但整塊在畫面外），下一
      // 影格才拿掉 no-fade、換成 preview-slide-cover，讓瀏覽器真的先畫出
      // 「在畫面正上方」這一幀，接下來的 transform 變化才會被當成一段可以
      // 播放的轉場，而不是被瀏覽器合併成一次跳過中間過程的瞬間變化。
      previewPage.classList.add('no-fade');
      previewPage.classList.add('preview-slide-start');
      void previewPage.offsetHeight;
      previewPage.classList.add('active');
      void previewPage.offsetHeight;

      requestAnimationFrame(() => requestAnimationFrame(() => {
        previewPage.classList.remove('no-fade');
        previewPage.classList.remove('preview-slide-start');
        previewPage.classList.add('preview-slide-cover');
        // 照片從畫面正上方往下蓋的 transform 從這一刻才真正開始播放
        // （前面 preview-slide-start 只是把它瞬間定位到畫面外，沒有任何
        // 移動）。
        // 滑動用的是 easeInQuart 系速度曲線（--preview-slide-ease：前段
        // 明顯較慢、後段才加速），如果只用「動畫開始的同一刻」或「總時長
        // 的固定比例」去估算「什麼時候真的蓋過上排大標題」都會不準——
        // 前段慢代表照片其實還要花一段時間才會真正經過 header 那一整排。
        // 改成每一影格直接讀瀏覽器算出來的即時位置：previewPage 套用
        // transform 後 getBoundingClientRect().bottom 就是「照片目前蓋到
        // 畫面上的哪一條線」，等這條線的位置超過 .fixed-header 本身的下緣
        // （代表照片這一刻已經整片蓋過標題那一排），才在這一刻加上
        // preview-header-white、讓文字轉白色的 0.22s transition 從這裡才
        // 開始播放。這樣不管速度曲線前段多慢，永遠是跟畫面上真正發生的
        // 進度同步，而不是用時間去猜測。
        let colorTriggered = false;
        const fixedHeaderEl = document.querySelector('.fixed-header');
        const headerBottomY = fixedHeaderEl
          ? fixedHeaderEl.getBoundingClientRect().bottom
          : 0;
        const triggerHeaderColor = () => {
          if(colorTriggered || !previewOpening) return;
          colorTriggered = true;
          document.body.classList.add('preview-header-white');
        };
        const checkCoverProgress = () => {
          if(colorTriggered || !previewOpening) return;
          if(previewPage.getBoundingClientRect().bottom >= headerBottomY){
            triggerHeaderColor();
            return;
          }
          requestAnimationFrame(checkCoverProgress);
        };
        requestAnimationFrame(checkCoverProgress);
        // 保底：極端情況下（例如量測異常、或滑動被中途打斷後又立刻恢復）
        // 最多等到滑動動畫的保底逾時時間就強制轉白，避免文字卡在黑色
        // 永遠不會轉過去。
        setTimeout(triggerHeaderColor, PREVIEW_SLIDE_FALLBACK_MS);

        let settled = false;
        const settleAfterCover = () => {
          if(settled) return;
          settled = true;
          previewPage.removeEventListener('transitionend', onCoverEnd);
          // 蓋下來的動畫已經跑完，整塊回到正常覆蓋畫面的位置，這裡把
          // preview-slide-cover 拿掉純粹是回收 class（transform 的目標值
          // 本來就是 translate3d(0,0,0)，跟 .preview-page 預設的
          // translateZ(0) 視覺上是同一個位置，拿掉不會有任何跳動）。
          previewPage.classList.remove('preview-slide-cover');
          previewOpening = false;
          // 動畫已經結束，保底一定要轉白（正常情況下這時 colorTriggered
          // 早就是 true 了，這裡純粹是防呆：萬一上面量測到最後一刻都沒有
          // 觸發，收尾時強制補上，不留下文字停在黑色的邊界情況）。
          triggerHeaderColor();
          // preview 的照片這一刻已經真正蓋滿整個畫面：如果這次是從堆疊模式
          // 底下打開的（見上面 openPreviewPage() 內的說明），輪到飄動的 e
          // 脫離物理世界、恢復成一般飄動狀態的時候了。
          resumeDvdFloatAfterPhotoFallCover();
        };
        const onCoverEnd = (e) => {
          if(e.target !== previewPage || e.propertyName !== 'transform') return;
          settleAfterCover();
        };
        previewPage.addEventListener('transitionend', onCoverEnd);
        setTimeout(settleAfterCover, PREVIEW_SLIDE_FALLBACK_MS);
      }));
    }

    // 把目前網址記錄成 #preview，這樣重新整理頁面時才知道要留在這頁，
    // 而不是每次都跳回首頁
    if(pushHistory && location.hash !== '#preview'){
      history.pushState({ page: 'preview' }, '', '#preview');
    }

    // 每次重新進入都重新隨機挑一張起始張（見 warmPreviewStart 內的說明），
    // 並確保起始畫面已經暖機好，這裡如果先前已經暖過就直接沿用快取，幾乎不用等
    warmPreviewStart();
    startPreviewCycle();

    // 注意：EDEN 飄動字現在是貫穿全站的元素，從進站那一刻就開始跑，
    // 進出 preview 頁面完全不需要（也不應該）重新啟動或重新定位它——
    // 這正是「切換頁面不會有任何震動」的原因。
  }

  // 「首頁網格已經準備好、不會是白的」的判斷：只看一開啟就在第一畫面內、
  // 會被立刻看到的前 GRID_EAGER_COUNT 張縮圖是否都已經真的載入完成（帶有
  // .loaded class——這個 class 是 renderGrid() 裡每張圖片的 load 事件加上
  // 的，見上面）。往上滑開的動態轉場裡，畫面下緣會最先露出網格、上緣（含
  // header 那一整排）最後才露出，這批 eager 縮圖涵蓋的正是「首次進站會看到
  // 的第一畫面」，跟滑動轉場實際會露出來的範圍一致，不需要另外算捲動位置。
  function isHomeGridVisuallyReady(){
    if(!grid) return true;
    const items = grid.querySelectorAll('.grid-item');
    if(!items.length) return false;
    const eagerCount = Math.min(GRID_EAGER_COUNT, items.length);
    for(let i = 0; i < eagerCount; i++){
      const img = items[i].querySelector('img');
      if(!img || !img.classList.contains('loaded')) return false;
    }
    return true;
  }

  // 用 requestAnimationFrame 輪詢代替另外掛一整排 load 事件監聽器：每一影格
  // 檢查一次是否全部就緒，一就緒立刻執行轉場；設一個 600ms 的保底上限，
  // 避免極端情況下（例如某張圖片遲遲載入失敗、onerror 還在重試備援網址）
  // 使用者點了卻卡住看不到任何反應——寧可讓極少數情況下還是看到一瞬間沒
  // 載完的縮圖，也不要讓轉場整個卡住不會發生。
  function whenHomeGridReady(callback){
    if(isHomeGridVisuallyReady()){ callback(); return; }
    const maxWaitMs = 600;
    const startedAt = performance.now();
    const poll = () => {
      if(isHomeGridVisuallyReady() || (performance.now() - startedAt) >= maxWaitMs){
        callback();
        return;
      }
      requestAnimationFrame(poll);
    };
    requestAnimationFrame(poll);
  }

  // 兩種關閉路徑（手機淡出 / 桌機滑開）收尾要做的事完全一樣：body class、
  // 對齊重算、恢復捲動、preview 自動循環停止、網址列同步，拆成共用函式，
  // 不用寫兩次。
  function finishClosePreviewPage(pushHistory){
    document.body.classList.remove('preview-active');
    document.body.classList.remove('preview-header-white');
    // header 的黑／白顏色現在是靠獨立的 preview-header-white class 切換
    // （見該 class 旁的 CSS 說明），這裡跟 preview-active 同一時間點一起
    // 拿掉，維持跟原本一樣「滑動關閉的動畫真正播完之後才轉黑」的時機——
    // 手機版立即淡出、桌機/平板要等 settleAfterSlide() 呼叫這個函式才會
    // 執行到這裡，行為跟原本完全一致，沒有改變關閉時的時間點。這裡呼叫
    // syncFixedChrome() 只是保底重算一次對齊，不影響任何顏色切換的時機。
    syncFixedChrome();
    document.body.style.overflow = '';
    stopPreviewCycle();

    if(pushHistory && location.hash === '#preview'){
      history.pushState({ page: 'home' }, '', location.pathname + location.search);
    }
  }

  function closePreviewPage(pushHistory){
    if(pushHistory === undefined) pushHistory = true;
    if(previewClosing) return; // 滑動轉場進行中，忽略重複觸發
    if(!previewPage.classList.contains('active')) return;

    // ---------- 使用者提前關閉 preview：網格建置不能再等 ----------
    // init() 裡把網格建置＋背景預抓延後（見 GRID_BUILD_DEFER_MS 的完整
    // 說明），前提假設是「使用者這幾秒還停在 preview 頁」；一旦使用者
    // 這一刻就主動點掉 preview、要看首頁格子，代表這個假設不成立了，
    // 應該立刻補建，不然使用者會對著一個還沒建置、空白的網格等到
    // 下面 whenHomeGridReady() 的 600ms 保底上限到才勉強顯示。這裡只是
    // 「提前觸發」，triggerGridBuildOnce() 內部有防重複呼叫，跟保底
    // 延遲的 setTimeout 只會有一邊真正執行 buildGridDeferred()。
    if(typeof window.__triggerGridBuildOnce === 'function') window.__triggerGridBuildOnce();

    if(previewOpening){
      // 使用者在「往下蓋下來」轉場還沒播完時就又要關閉：立刻打斷開場動畫，
      // 不要讓兩個方向的滑動轉場疊在一起互相打架
      previewPage.classList.remove('preview-slide-cover', 'preview-slide-start', 'no-fade');
      previewOpening = false;
    }

    // 立刻停止 preview 自動輪播，讓滑走的畫面停在使用者按下那一刻看到的
    // 照片，不會在滑動過程中還繼續切換照片
    stopPreviewCycle();
    previewClosing = true;

    whenHomeGridReady(() => {
      // 如果退出 preview 後會留在照片詳細頁（detail-active 還在），代表這次
      // 滑走底下露出來的其實是詳細頁（一樣是完全不透明、蓋住首頁格子），
      // 不是首頁格子本身——先判斷出來，只有真正要露出首頁格子時才需要
      // 底下這段「縮圖放大進場」，避免在使用者根本看不到格子的情況下，
      // 平白多跑一輪沒有意義的動畫。
      const closingBackToDetail = document.body.classList.contains('detail-active');
      // 這次的 preview 如果是從堆疊模式底下打開的（見 openPreviewPage() 內
      // previewFromPhotoFall 的說明），使用者點一下關閉，代表要回到堆疊
      // 頁面，而不是首頁格子或照片詳細頁——立刻（不等滑走動畫播完）讓
      // 飄動的 e 恢復重力、原地掉回堆疊，細節見 dropDvdBackIntoPhotoFall()。
      // 先把這一刻的 previewFromPhotoFall 讀出來存成區域變數：下面不管走
      // 哪個分支都可能會把 previewFromPhotoFall 重設回 false（見
      // dropDvdBackIntoPhotoFall() 或緊接著的 else 分支），如果直接沿用
      // 這個外部變數，稍後判斷「這次 preview 是不是從堆疊模式打開的」會
      // 因為它已經被重設而永遠讀到 false，判斷失準。
      const wasOpenedFromPhotoFall = previewFromPhotoFall;
      const closingBackToPhotoFall = wasOpenedFromPhotoFall && photoFallModeActive;
      if(closingBackToPhotoFall){
        dropDvdBackIntoPhotoFall(); // 內部會把 previewFromPhotoFall 重設回 false
      } else if(wasOpenedFromPhotoFall){
        // 修正：這次 preview 原本是從堆疊模式底下打開的
        // （wasOpenedFromPhotoFall 是 true），但堆疊模式這時已經不在了
        // （photoFallModeActive 是 false）——多半是使用者在雙擊收起堆疊、
        // 整批照片還沒真正掉出畫面前就按了 Preview，收場流程在蓋住畫面的
        // 這段期間已經自己跑完（見 finishExitPhotoFallMode()）。這種情況
        // 不會走上面 dropDvdBackIntoPhotoFall() 那條分支，previewFromPhotoFall
        // 原本會一路維持 true、沒有任何地方負責重設回 false——導致「這次
        // preview 是不是從堆疊模式打開的」這個旗標卡在錯誤的 true，一路
        // 沿用到使用者下一次完全無關、單純從首頁打開的 preview，讓
        // openPreviewPage() 誤判成已經處理過而跳過該有的判斷、
        // resumeDvdFloatAfterPhotoFallCover() 也會在跟堆疊模式完全無關的
        // 一般 preview 關閉／開啟循環裡被誤觸發，讓飄動的 e 無緣無故被
        // 重新指定一個隨機方向，出現不該有的跳動。這裡補上重設，讓這個
        // 旗標只反映「這一次」preview 開關的真實狀態。
        previewFromPhotoFall = false;
      }

      // 如果 preview 關閉後底下露出來的其實是照片詳細頁（不是首頁格子），
      // 飄動的 e 就不該出現——重新加回 dvd-hidden，讓它照 openDetail() 那套
      // 一樣的專屬 transition 縮小＋淡出。preview 頁本身是完全不透明的，
      // 使用者這段時間本來就看不到 e，這裡加 class 不會有任何視覺跳動；
      // 等 preview 真正滑走、詳細頁露出來的那一刻，e 已經是乾淨的隱藏
      // 狀態，不會閃現一下又消失。
      if(closingBackToDetail){
        // 理由同 openDetail() 內的說明：一併暫停物理飄動迴圈，避免 e 在
        // 這段隱藏期間（雖然此刻使用者看不到）仍持續改變位置，等真的
        // 露出首頁格子時卻不是首頁而是詳細頁、之後又從詳細頁按上一頁
        // 回到 preview 或首頁，才不會因為位置早已跑掉一大段而不連續。
        if(dvdRAF){ cancelAnimationFrame(dvdRAF); dvdRAF = null; }
        dvdLastTime = null;
        dvdBounce.classList.add('dvd-hidden');
      }

      // 修正：使用者可能是在雙擊收起堆疊、整批照片還沒真正掉出畫面前就
      // 按了 Preview（見 openPreviewPage() 內對 photoFallModeActive 的
      // 說明）——這種情況下堆疊的收場流程有可能已經在 preview 蓋住畫面
      // 的這段期間自己跑完（finishExitPhotoFallMode()），首頁縮圖的放大
      // 進場動畫其實已經播過一次，只是被完全不透明的 preview 蓋住、使用者
      // 當下看不到。closingBackToPhotoFall 這時會正確判斷成 false（因為
      // photoFallModeActive 已經變成 false，見該處說明），照原本的判斷式
      // 會落入下面這個分支、把動畫再重複播一次——縮圖會先瞬間縮小消失、
      // 再重新放大，多出一次使用者看得到的閃爍。
      // 這裡額外用 wasOpenedFromPhotoFall 收斂 photoFallGridAlreadyRevealed
      // 只在「這次 preview 本來就是從堆疊模式打開的」這個情境下才生效——
      // 避免它是「單純在首頁雙擊收起堆疊、完全沒經過 preview」那種正常
      // 流程留下的旗標，被不相干的下一次 preview 誤讀、誤跳過該有的動畫
      // （openPreviewPage() 也已經在每次真正進入這個情境時把它歸零，
      // 兩處算是雙重保險）。判斷成立才把旗標消耗掉（重設回 false），不
      // 影響下一次真正需要播放的時機。
      const skipGridRevealBecauseAlreadyDone = wasOpenedFromPhotoFall && !photoFallModeActive && photoFallGridAlreadyRevealed;
      if(skipGridRevealBecauseAlreadyDone){
        photoFallGridAlreadyRevealed = false;
      } else if(!closingBackToDetail && !closingBackToPhotoFall){
        // 底下的首頁縮圖先瞬間切到「放大進場」的起始狀態（極小、編號透明）
        // ——這一刻 previewPage 還完整蓋在最上面，使用者看不到這一瞬間的
        // 縮小。
        //
        // 但「開始放大」這件事不能跟這裡一樣馬上觸發：previewPage 接下來
        // 還要花 PREVIEW_SLIDE_DURATION_MS（.42s）整塊往上滑走，滑走的
        // 過程本身就需要時間，縮圖是隨著這塊蓋子被掀開才逐漸露出來的——
        // 如果放大動畫在蓋子都還沒開始滑走前就先起跑，等蓋子終於滑完、
        // 縮圖真正露出來給使用者看到的那一刻，放大動畫其實已經播了一大段
        // （尤其套用的是 easeOutExpo，前段變化速度非常快，一下子就快
        // 播完了），使用者看到的就是「縮圖幾乎都已經放大完成」，跟從照片
        // 詳細頁回首頁那種「一露出來就從最小開始放大」的畫面對不起來。
        // 這裡刻意延後到蓋子整塊滑走的時間（PREVIEW_SLIDE_DURATION_MS）
        // 之後，才真正觸發放大動畫，讓「使用者看得到縮圖」跟「縮圖開始
        // 從最小放大」這兩件事發生在同一個時間點，兩種入口回到首頁時
        // 看到的畫面才會一致。
        prepareGridRevealState();
        clearTimeout(gridRevealPreviewDelayTimer);
        // 原本延後整整 PREVIEW_SLIDE_DURATION_MS（蓋子滑走的全部時間）才
        // 觸發放大動畫，讓「蓋子剛好滑完、縮圖第一次露出來」跟「放大動畫
        // 從最小開始播」剛好同一刻發生，使用者會看到完整一輪從極小到正常
        // 大小的放大過程。
        // 現在改成提早很多觸發（只延後滑走時間的 20%）：這時蓋子絕大部分
        // 時間都還沒滑開、縮圖仍被蓋住看不到，放大動畫已經先在「幕後」開始
        // 播放好一段——等蓋子真正滑完、縮圖露出來給使用者看到的那一刻，
        // 動畫其實已經播到接近尾聲（尤其套用的是 easeOutExpo 系曲線，前段
        // 變化本來就快，開場沒多久就幾乎放大到位），使用者實際「看得到」
        // 的只剩收尾階段非常小幅度的放大，比原本又更不明顯。
        gridRevealPreviewDelayTimer = setTimeout(playGridRevealAnimation, PREVIEW_SLIDE_DURATION_MS * 0.2);
      }

      // 開始整塊往上滑出。opacity / visibility 維持 .active 當下的數值
      // （全程不透明），純粹靠 transform 位移做出「照片往上滑走、底下首頁
      // 露出來」的效果，見上面 CSS 的 .preview-slide-exit。
      previewPage.classList.add('preview-slide-exit');

      if(closingBackToDetail){
        document.body.classList.add('collab-slide-exit');
      }

      let settled = false;
      const settleAfterSlide = () => {
        if(settled) return;
        settled = true;
        previewPage.removeEventListener('transitionend', onSlideEnd);

        // 跟 openPreviewPage() 的 instant 開場用同一招：先關掉 transition，
        // 把 active / preview-slide-exit 一次拿掉，讓它瞬間回到「關閉」的
        // 最終狀態（opacity:0、visibility:hidden、transform 歸零）。這時
        // 使用者早就完全看不到這個元素了（已經滑出畫面外），所以「瞬間歸位」
        // 不會被看到，不會有滑走的照片突然跳回原位再淡出這種二次閃爍。
        previewPage.classList.add('no-fade');
        void previewPage.offsetHeight; // 強制 reflow，確保上面這行先生效
        previewPage.classList.remove('active');
        previewPage.classList.remove('preview-slide-exit');
        void previewPage.offsetHeight;
        requestAnimationFrame(() => requestAnimationFrame(() => {
          previewPage.classList.remove('no-fade');
        }));

        // 滑動已經完全結束，collab-slide-exit 這個「同步淡出」的過渡用途已經
        // 達成（opacity 這時已經是 0），拿掉它純粹是回收 class，讓下一次
        // 重新進入照片頁時 header-right 用回預設的 0.2s 淡入淡出，不受這次
        // 滑動時長影響。finishClosePreviewPage() 接著會拿掉 preview-active，
        // 那時上面 body.detail-active:not(.preview-active) 的規則會接手把
        // opacity 繼續釘在 0，兩條規則交接的數值完全一樣，不會有任何跳動。
        document.body.classList.remove('collab-slide-exit');

        previewClosing = false;
        finishClosePreviewPage(pushHistory);
        if(closingBackToPhotoFall){
          // finishClosePreviewPage() 一律把 overflow 重設成可捲動，但這次
          // 退回的其實是堆疊頁面（本來就該鎖住捲動，見 startPhotoFallEngine()
          // 內的說明），這裡補回去。
          document.body.style.overflow = 'hidden';
        }
      };

      const onSlideEnd = (e) => {
        if(e.target !== previewPage || e.propertyName !== 'transform') return;
        settleAfterSlide();
      };
      previewPage.addEventListener('transitionend', onSlideEnd);
      // 保底：萬一某些瀏覽器邊界情況下 transitionend 沒有觸發，最多等動畫
      // 時長（PREVIEW_SLIDE_DURATION_MS）再加一點緩衝後強制收尾，避免頁面
      // 卡在「滑到一半」的狀態。
      setTimeout(settleAfterSlide, PREVIEW_SLIDE_FALLBACK_MS);
    });
  }

  previewLabel.addEventListener('click', () => openPreviewPage());
  // 這個頁面點任何地方都直接跳回首頁；頁面開啟時 header 會把 pointer-events
  // 關掉，讓點擊直接穿透到這裡，所以點在標題文字上也一樣會回首頁。EDEN 飄動字
  // 不在 previewPage 的 DOM 樹裡（它是 body 的直接子節點），點在它上面的
  // click 本來就不會冒泡到這裡，不需要另外攔截。
  previewPage.addEventListener('click', () => {
    closePreviewPage();
  });
  // ---------- 修正：「preview 頁剛開始蓋下來的滑動動畫還沒播完時，點擊
  // 畫面下半部（照片還沒被蓋到的地方）好像沒反應，要點第二下才有用」----------
  // 成因：openPreviewPage() 開啟時「整塊從正上方蓋下來」這段轉場，是
  // previewPage（position:fixed; inset:0）用 transform 從畫面正上方
  // 逐漸位移蓋下來——雖然 pointer-events:auto／.active 這個 class 在按下
  // Preview 那一刻就已經同步生效，但 click 事件終究是照元素「這一刻真正
  // 畫在螢幕上的位置」做 hit-test，不是照 class 生不生效判斷。配合
  // --preview-slide-ease 前段慢、後段快的速度曲線，動畫前半段這塊「已經
  // 蓋到」的範圍擴張得特別慢——蓋下來的動畫還沒播到畫面下半部之前，那
  // 一刻底下其實還是首頁網格，previewPage 本身根本沒有蓋到那裡，點下去
  // 的 click 命中的是網格（可能是空白處，也可能不小心點到某張縮圖），
  // 完全不會冒泡給上面 previewPage 自己這個 click 監聽器——這正是使用者
  // 反應「剛進 preview、點太快，下面的照片好像沒反應，要點第二下才有用」
  // 的成因：第一下其實根本沒點到 previewPage，等到第二下，動畫多半已經
  // 蓋滿整個畫面，才真的點對地方。
  // 修法：另外掛一個 window 層級、capture 階段的 click 監聽器，只要
  // preview 正在「蓋下來」這段動畫進行中（previewOpening 為 true），
  // 不管這一下實際點在畫面上的哪個座標、底下當下露出來的是首頁網格還是
  // 什麼，一律視為「使用者想關閉 preview、回首頁」，直接呼叫
  // closePreviewPage()——closePreviewPage() 本來就已經寫好 previewOpening
  // 為 true 時要打斷開場動畫、無縫接上關閉動畫這條路徑（見該函式內
  // previewOpening 那段說明），這裡只是讓「點擊」這個動作不必等動畫真的
  // 蓋滿整個畫面才能觸發它。同時呼叫 stopPropagation()，避免這次點擊繼續
  // 冒泡到底下網格的縮圖，意外多觸發一次 openDetail()。
  // 用 capture 階段（第三個參數 true）確保這個監聽器一定搶在目標元素自己
  // 的 click 監聽器（例如縮圖的 openDetail()）之前執行；掛在 window 而不是
  // previewPage 身上，正是因為問題出在「這一下根本沒點在 previewPage
  // 上」，掛在 previewPage 身上永遠不會收到這個事件。
  // 這個監聽器只在 previewOpening 為 true 時才動作，因此不會誤觸發：
  //   - 開啟 preview 那一下點擊本身：previewLabel 的 click 處理常式是
  //     bubble 階段、掛在較深層的節點，會在這個 capture 監聽器「之後」
  //     才輪到執行——也就是說，我們這裡先跑的時候，openPreviewPage() 根本
  //     還沒被呼叫，previewOpening 這時還是 false，不會被誤判成「動畫
  //     進行中」，不會出現「一點開就立刻自己關掉」的情況。
  //   - 動畫播完之後的一般點擊：previewOpening 這時已經是 false，交還給
  //     previewPage 自己原本的 click 監聽器處理，行為完全不變。
  window.addEventListener('click', (e) => {
    if(!previewOpening) return;
    e.stopPropagation();
    closePreviewPage();
  }, true);
  // overflow:hidden 已經擋住捲動了，這裡再擋一次滾輪事件保險
  previewPage.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });
  // detail-page（點進去單張照片的頁面）同樣道理：body overflow:hidden + CSS
  // touch-action:none 已經擋住大部分捲動，這裡再擋一次滑鼠滾輪事件保險，
  // 確保電腦上滾輪也不會把底下的頁面捲動
  detailPage.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });

  // ---------------------------------------------------------------
  // 首頁滾輪捲動：比照拉簾（filmstrip）同一套「臨界阻尼彈簧」
  // (fsSmoothDamp / SmoothDamp) 物理，讓滑鼠/觸控板在首頁捲動時也有
  // 「先加速、後減速貼齊」的慣性感，取代瀏覽器原生滾輪一次跳一截、
  // 忽快忽慢的生硬感覺——手感、曲線跟拉簾完全共用同一顆彈簧函式，
  // 維持全站動態語言一致（拉簾怎麼「拉」，首頁就怎麼「捲」）。
  // 滾輪事件直接推動「目標捲動位置」本身（不是速度），不管觸發得多
  // 密集或多疏落，追出來的永遠是同一條連續曲線，不會被拆成階梯狀。
  // 只在 wheel 事件（滑鼠/觸控板）生效；手機觸控本身滑動已經有系統
  // 原生的慣性捲動，不需要、也不應該疊加這一層額外的彈簧。
  const HOME_SCROLL_SMOOTH_TIME = 0.34; // 反應時間常數，比拉簾(0.30)略慢一點點，
                                         // 貼合「拉動整個頁面」該有的份量感，同時仍夠靈敏跟手。
  const HOME_SCROLL_SETTLE_EPS = 0.5;   // px，位置／速度都小於這個閾值視為已完全貼齊目標，
                                         // 停止逐幀重算，省電也避免無意義的浮點抖動。
  let homeScrollTarget = 0;
  let homeScrollPos = 0;
  let homeScrollVel = { v: 0 };
  let homeScrollRAFId = null;
  let homeScrollLastT = 0;

  // 首頁＝preview 頁跟照片詳細頁都沒蓋在上面的狀態；這兩個頁面自己的
  // wheel 監聽器（見上面）已經各自 preventDefault 擋掉底下的捲動，這裡
  // 只要判斷目前不是那兩個狀態，就代表使用者滾輪滾到的是首頁本身。
  function isHomeScrollActive(){
    return !document.body.classList.contains('preview-active')
        && !document.body.classList.contains('detail-active');
  }
  function homeScrollMax(){
    return Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
  }

  function homeScrollTick(t){
    if(!isHomeScrollActive()){
      // 滾輪彈簧還在追趕途中，使用者卻切去了 preview／照片詳細頁（例如
      // 點擊縮圖切換頁面），直接中止這顆彈簧，避免它在背景繼續跑、之後
      // 回到首頁時忽然把頁面捲去一個使用者沒有主動操作過的位置。
      homeScrollRAFId = null;
      homeScrollLastT = 0;
      homeScrollVel.v = 0;
      return;
    }
    if(!homeScrollLastT) homeScrollLastT = t;
    const dt = Math.min(0.048, Math.max(0.001, (t - homeScrollLastT) / 1000)); // 秒，夾在 1~48ms 之間
                                        // 避免分頁切走再切回時的巨大 dt 讓彈簧暴衝
    homeScrollLastT = t;

    homeScrollPos = fsSmoothDamp(homeScrollPos, homeScrollTarget, homeScrollVel, HOME_SCROLL_SMOOTH_TIME, dt);
    window.scrollTo(0, homeScrollPos);

    const settled = Math.abs(homeScrollPos - homeScrollTarget) < HOME_SCROLL_SETTLE_EPS
                  && Math.abs(homeScrollVel.v) < HOME_SCROLL_SETTLE_EPS;

    if(!settled){
      homeScrollRAFId = requestAnimationFrame(homeScrollTick);
    } else {
      homeScrollPos = homeScrollTarget;
      window.scrollTo(0, homeScrollPos);
      homeScrollVel.v = 0;
      homeScrollRAFId = null;
      homeScrollLastT = 0;
    }
  }
  function startHomeScrollRAF(){
    if(!homeScrollRAFId) homeScrollRAFId = requestAnimationFrame(homeScrollTick);
  }

  if(!supportsTouch){
    window.addEventListener('wheel', (e) => {
      if(!isHomeScrollActive()) return; // preview／詳細頁自己的 wheel 監聽器已經處理（見上方）
      e.preventDefault();

      // 彈簧目前沒在跑（例如使用者剛用捲軸拖曳、或用鍵盤捲動過頁面），
      // 先把位置／目標對齊當下瀏覽器實際的 scrollY，下一次滾輪事件才
      // 不會從一個過期的舊位置忽然銜接、跳一截。
      if(!homeScrollRAFId){
        homeScrollPos = window.scrollY;
        homeScrollTarget = window.scrollY;
      }

      homeScrollTarget += e.deltaY;
      homeScrollTarget = Math.max(0, Math.min(homeScrollMax(), homeScrollTarget));
      startHomeScrollRAF();
    }, { passive: false });
  }

  // 支援瀏覽器「上一頁 / 下一頁」按鈕，跟網址列的 #preview 狀態保持同步
  window.addEventListener('popstate', () => {
    if(location.hash === '#preview'){
      openPreviewPage(false);
    } else if(previewPage.classList.contains('active')){
      closePreviewPage(false);
    }
  });

  function nextPhoto(){
    if(detailClosing) return; // 退場動畫播放中，不接受切換照片的操作
    if(fsReady){
      fsScrollToOffset(Math.round(fsPos) + 1); // 桌機／平板：讓拉簾跟著平滑捲一格，不要直接瞬間跳
      return;
    }
    currentIndex = (currentIndex + 1) % photos.length;
    renderDetail();
  }
  function prevPhoto(){
    if(detailClosing) return; // 退場動畫播放中，不接受切換照片的操作
    if(fsReady){
      fsScrollToOffset(Math.round(fsPos) - 1);
      return;
    }
    currentIndex = (currentIndex - 1 + photos.length) % photos.length;
    renderDetail();
  }

  prevBtn.addEventListener('click', prevPhoto);
  nextBtn.addEventListener('click', nextPhoto);
  // 「Photobook by edenchen」標題：平常點擊維持原本行為（在照片詳情頁時
  // 關閉詳情頁回首頁，見 closeDetail()）。額外加一個情況——目前正處在
  // 照片物理堆疊模式（雙擊飄動的 e 進來的那個畫面）時，點這個標題要有
  // 跟「再雙擊一次飄動的 e」完全一樣的效果：收起整疊照片、回到正常首頁。
  // 直接沿用 handleDvdDoubleClick() 裡「active 狀態就呼叫 exitPhotoFallMode()」
  // 的同一條路徑，不另外寫一套收尾邏輯，兩個入口的動畫、狀態機完全共用。
  // 只在 photoFallState === 'active' 時觸發：'entering' / 'exiting' 這兩個
  // 過渡中的狀態，跟雙擊飄動的 e 當下的處理方式一致——動畫播放中，這次
  // 點擊先忽略，不會打斷或疊加另一段收尾動畫。
  backHome.addEventListener('click', () => {
    // 修正：現在堆疊模式底下也可以點照片進到照片詳細頁（見
    // openDetailFromPhotoFallItem()），這種情況下 photoFallState 仍然是
    // 'active'（整段只是暫停物理世界，狀態機沒有離開堆疊模式），如果這裡
    // 只看 photoFallState，點標題會被誤判成「要收起整疊照片回首頁」，
    // 而不是「先關掉目前開著的照片詳細頁」。加上 detail-active 的判斷：
    // 只要目前正在照片詳細頁（不管是從首頁還是從堆疊畫面點進來的），一律
    // 先用 closeDetail() 收尾，讓它自己的 detailFromPhotoFall 分支決定
    // 該回到首頁還是回到堆疊畫面；只有真正身處「沒有開著任何詳細頁」的
    // 堆疊畫面時，點標題才直接收起整疊照片。
    if(photoFallState === 'active' && !document.body.classList.contains('detail-active')){
      exitPhotoFallMode();
      return;
    }
    closeDetail();
  });
  backArrowBtn.addEventListener('click', closeDetail);

  document.addEventListener('keydown', (e) => {
    if(!detailPage.classList.contains('active')) return;
    if(e.key === 'ArrowRight') nextPhoto();
    if(e.key === 'ArrowLeft') prevPhoto();
    if(e.key === 'Escape') closeDetail();
  });

  // 縮放（pinch-zoom）在某些行動瀏覽器上會連帶觸發 resize 事件，
  // 但此時 window.innerWidth/innerHeight 可能回報的是「縮放後」的數值，
  // 若照樣重新定位，大圖就會瞬間跳位、變得極小。
  //
  // 原本的做法：resize 事件「一觸發當下」先判斷是否還在縮放，沒有縮放才排一個
  // 120ms 後執行的 timeout。問題是使用者放開兩指後，縮放比例通常還會再微調
  // 好幾次才真正穩定到 1，這些微調也會觸發 resize；如果剛好某一次判斷時 scale
  // 已經很接近 1（但還沒完全穩定），就會排入 timeout，等 120ms 後才執行——但那時
  // 版面可能還沒真正定案，所以會先用「還沒穩定」的尺寸重新定位一次（歸到偏掉的
  // 位置），等下一次 resize 事件抓到真正穩定的狀態才又修正一次，看起來就是
  // 「先跳到錯誤位置、才瞬間修正」。
  //
  // 修正方式：判斷「是否還在縮放」要放在 timeout 真正執行的當下重新檢查一次，
  // 而不是相信事件剛觸發時的舊狀態；還沒穩定就直接跳過，等下一次 resize 事件
  // 再重新排一次，這樣只有在真正確定縮放已經結束時才會定位，不會有中途跳動。
  let viewportSettleDebounce = null;
  // 手機／平板點進照片頁的那一刻，body 被鎖住捲動（overflow:hidden），這個
  // DOM 變化常常會讓瀏覽器（尤其 iOS/Android 上的 Safari／Chrome）緊接著把
  // 網址列／工具列收合起來，藉此多讓出一截可視高度——這個收合動作本身就會
  // 觸發一次 window resize 事件，但這次 resize「只有 innerHeight 變大，
  // innerWidth 完全沒變」，跟真正的視窗尺寸改變（拖曳桌機視窗邊框）或裝置
  // 橫直轉向（另外由 handleOrientationChange 處理）是不同性質的事件。
  // 原本 scheduleViewportSettle 不分青紅皂白，只要 150ms 內沒有再收到新的
  // resize 就會照樣拿當下（已經變大的）innerHeight 重新呼叫一次
  // positionDetailImage()——這正是使用者回報「照片頁一進去、過一下下照片
  // 忽然跳一下位置、好像沒對準」的真正成因：使用者看到的是「網址列收合前
  // 用小視窗算出來的位置」瞬間換成「網址列收合後用大視窗重算的位置」這兩
  // 種狀態的跳動，不是動畫或畫質切換造成的。
  // 修法：resize 穩定下來後，額外比對這次的 innerWidth 跟上一次記住的
  // innerWidth 是否真的不一樣——工具列收合/展開只會動到高度，寬度不會變，
  // 這種「純高度變化」的 resize 直接跳過、不重新定位大圖；只有寬度真的
  // 改變（代表使用者真的調整了視窗，或裝置真的轉向——轉向另外交給
  // handleOrientationChange 專門處理）才需要重新算一次大圖的尺寸／位置。
  let lastSettledViewportWidth = window.innerWidth;
  function scheduleViewportSettle(){
    clearTimeout(viewportSettleDebounce);
    viewportSettleDebounce = setTimeout(() => {
      const stillZoomed = window.visualViewport && Math.abs(window.visualViewport.scale - 1) > 0.01;
      if(stillZoomed) return; // 縮放還沒穩定，先不動，等下一次 resize 事件再判斷

      const widthChanged = window.innerWidth !== lastSettledViewportWidth;
      lastSettledViewportWidth = window.innerWidth;

      // flipInFlight 為 true 代表分身飛行動畫正在播放（含剛開始的那一下），
      // 這裡先跳過，等飛行結束（見 runGridToDetailTransition 的 finish()）
      // 自然會補一次最新定位，避免大圖容器在飛行途中被搬動、跟分身終點
      // 對不上，見 flipInFlight 旁的完整說明。
      if(widthChanged && !flipInFlight && detailPage.classList.contains('active')){
        positionDetailImage(lastNaturalW, lastNaturalH);
      }
      // 縮放期間 syncFixedChromeLive 全程跳過沒有更新（見下方），縮放真正結束、
      // 穩定下來的這一刻，順便補一次正確的重新定位，不用等使用者手動觸發
      // 下一次 resize 事件才修正回來
      syncFixedChrome();
    }, 150);
  }

  // syncFixedChrome()（header 的 preview 對齊 / detail-info / 左右箭頭定位）原本
  // 認為只用 getBoundingClientRect() 讀「當下實際渲染位置」，不像 positionDetailImage
  // 依賴 innerWidth/innerHeight，所以不需要等縮放穩定——但這個假設漏算了一種情況：
  // detail-info 的直式定位（syncDetailInfoAlignment）本身就有用到 window.innerHeight
  // 去算 top，雙指縮放中途這個值一樣不可靠，算出來的位置可能整個飛出畫面外，
  // 而且因為縮放結束後沒有任何後續事件會再重新校正它（不像 resize 那樣持續觸發），
  // 這個錯誤的偏移量會一直卡住，直到重新整理頁面、CSS 變數被重置才會消失——
  // 這正是「雙指縮放後 001 那排字飛不見，切換照片、不重整都救不回來」的成因。
  // 修法：縮放進行中（scale 明顯不是 1）就直接跳過整次 live 更新，等縮放真的
  // 結束（下一次 resize/visualViewport resize 事件時 scale 已經穩定）才繼續算。
  let fixedChromeRAF = null;
  function syncFixedChromeLive(){
    if(fixedChromeRAF) return;
    fixedChromeRAF = requestAnimationFrame(() => {
      fixedChromeRAF = null;
      const stillZoomed = window.visualViewport && Math.abs(window.visualViewport.scale - 1) > 0.01;
      if(stillZoomed) return; // 縮放中途座標不可靠，先不要算，避免把 detail-info 之類的定位帶偏
      syncFixedChrome();

      // 大圖本身的尺寸／位置（positionDetailImage，內含 layoutFilmstripZone
      // 算拉簾寬度）原本只有 scheduleViewportSettle() 那條 150ms debounce
      // 路徑會重算，而且還要等「resize 事件停下來」才觸發——結果是拖曳
      // 視窗邊框、畫面持續變窄的整個過程中，大圖跟右側拉簾的尺寸完全卡在
      // 拖曳開始前的舊數值，沒有跟著即時縮小，但上面 syncFixedChrome() 算
      // 的箭頭／header／編號文字卻是每一影格都在即時跟著新寬度移動——兩邊
      // 更新的時間點對不上，看起來就是「拉窄的過程中東西互相吃到、卡住不動
      // 或忽然跳一下」。這裡只在桌機／平板（>640px，跟 isDetailMobile() 用
      // 同一個門檻）額外加一段：只要照片詳細頁正開著，就讓大圖跟拉簾也比照
      // 上面 syncFixedChrome() 一樣每一影格即時重算，兩邊終於用同一套時間
      // 軸更新，縮放過程才會看起來是同一個東西在等比例平滑縮小，而不是
      // 各自卡在不同的更新時機。手機版（<=640px）維持原樣不動，仍然完全
      // 交給下面 scheduleViewportSettle() 那條 150ms debounce 路徑處理
      // （那裡額外考慮了 iOS 網址列收合、雙指縮放這些手機特有情境，不宜
      // 在這裡一併改動）。
      // 同上，飛行動畫播放期間先跳過，避免跟分身終點打架，見 flipInFlight
      // 旁的說明。
      if(window.innerWidth > 640 && !flipInFlight && detailPage.classList.contains('active')){
        positionDetailImage(lastNaturalW, lastNaturalH);
      }
    });
  }

  window.addEventListener('resize', scheduleViewportSettle);
  window.addEventListener('resize', syncFixedChromeLive);
  // visualViewport 的 resize 事件在雙指縮放時觸發得比 window resize 更即時、更頻繁，
  // 一起監聽可以更快抓到「縮放剛結束」的那個時間點。
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', scheduleViewportSettle);
    window.visualViewport.addEventListener('resize', syncFixedChromeLive);
  }

  // 手機橫直切換（orientationchange）目前完全靠上面這套 resize 事件機制
  // 順便處理，但這套機制原本是為了「雙指縮放」設計的，對橫直切換來說有
  // 兩個問題疊在一起：
  //   1) 手機瀏覽器（尤其是 iOS Safari）在橫直切換時，網址列高度、安全
  //      區域（safe-area）都要跟著重新計算，resize 事件常常會在這些都
  //      還沒真正定案之前就先觸發一次，此時讀到的 window.innerWidth /
  //      getBoundingClientRect() 都還是過渡態的數字；fitCollabWidth() 用
  //      這種過渡態尺寸算出來的縮放比例，套用下去就是完全錯的大小。
  //   2) 雙指縮放時使用者會連續觸發好幾次 resize，就算某一次算錯了，
  //      下一次 resize 也會自動修正回來；但橫直切換通常只觸發一兩次
  //      resize，如果剛好「最後一次」就是算錯的那次，就沒有任何後續事件
  //      會再自動修正，錯誤的縮放比例／位置會一路卡住，直到使用者重新
  //      整理頁面、CSS 變數被重新初始化才會消失——這正是「橫轉直後 Collab
  //      那塊字忽然變超大，要重新整理才會恢復正常」的成因。
  // 修法：額外獨立監聽 orientationchange（跟雙指縮放無關，不需要
  // stillZoomed 那套判斷），並且不只重算一次，而是排幾個有間隔的延遲
  // 重算（100ms / 400ms / 800ms）。不管手機瀏覽器實際要花多久，才能讓
  // 橫直切換後的 viewport 尺寸真正穩定下來，這幾次重算裡一定會有一次是
  // 在正確的最終尺寸下執行，把 fitCollabWidth() 的縮放比例、時鐘位置等
  // 全部修正回來，不用再靠使用者手動重新整理。
  // 原本用固定的 100/400/800ms 三次重算，賭「一定有一次會抓到旋轉完成後
  // 的正確尺寸」——但某些裝置（尤其 iOS Safari）網址列/安全區域的過渡動畫
  // 可能跑得比 800ms 更久，三次都還是抓到過渡值，之後又沒有任何事件會再
  // 自動修正，錯誤的字級/位置就一路卡住，直到重新整理頁面。改成持續輪詢
  // window.innerWidth，直到連續兩次讀到「同一個數值」（代表尺寸真的穩定
  // 下來了）才停止；輪詢期間每次都照樣重算，就算中途抓到過渡值，最後穩定
  // 下來那一次一定會蓋掉前面所有錯誤結果。設一個總時長上限（3000ms）當
  // 保險，避免極端情況下 resize 事件一直沒停過，輪詢也不會無限跑下去。
  function handleOrientationChange(){
    let lastWidth = null;
    let stableCount = 0;
    let elapsed = 0;
    const interval = 100;
    const maxElapsed = 3000;

    const poll = () => {
      syncFixedChrome();
      clampDvdIntoViewport();
      // 飛行動畫播放期間先跳過，避免跟分身終點打架，見 flipInFlight 旁的說明。
      if(!flipInFlight && detailPage.classList.contains('active')){
        positionDetailImage(lastNaturalW, lastNaturalH);
      }

      const currentWidth = window.innerWidth;
      if(currentWidth === lastWidth){
        stableCount++;
      } else {
        stableCount = 0;
        lastWidth = currentWidth;
      }

      elapsed += interval;
      if(stableCount >= 2 || elapsed >= maxElapsed) return;
      setTimeout(poll, interval);
    };

    setTimeout(poll, interval);
  }
  window.addEventListener('orientationchange', handleOrientationChange);
  if(window.screen && window.screen.orientation && window.screen.orientation.addEventListener){
    window.screen.orientation.addEventListener('change', handleOrientationChange);
  }

  async function init(){
    // 一律先鎖住捲動，不等 openPreviewPage() 才鎖（那要等照片非同步抓回來、
    // renderGrid() 把整個網格塞進 DOM 之後才會執行到）。網站預設一進來就是
    // 先看到 preview 頁、網格暫時被蓋在底下看不到，理當從最一開始就不能捲動，
    // 不要有任何一個時間窗口是「網格已經塞進 DOM、但還沒被鎖住捲動」的狀態。
    // 使用者實際點開網格頁（closePreviewPage）時才會恢復正常捲動。
    document.body.style.overflow = 'hidden';

    scheduleClockTick(); // 排在 syncFixedChrome() 之前：桌機版三塊防重疊計算需要文字先有內容，才能量出正確寬度
    syncFixedChrome();
    startDvdBounce(); // 貫穿全站的飄動字，不等照片載入，進站就開始跑（但視覺上會先被
                       // initial-reveal-pending 這層遮罩蓋住，見該處 CSS 說明，物理
                       // 迴圈本身照常先跑，只是使用者暫時還看不到）
    setTimeout(revealInitialChrome, INITIAL_REVEAL_FALLBACK_MS); // 保底逾時，見上面該函式旁的說明
    // 「e」的圖片庫刻意不用 await 卡住主要流程——這組圖片只有撞牆換圖時
    // 才用得到，不是「使用者這一刻馬上要看到」的關鍵內容（那是上面的
    // photosPromise），用 .then() 讓它在背景自己完成就好，不拖慢首頁/preview
    // 第一批照片出現的時間。抓回來之後先逐一裁掉透明留白（見上面
    // trimTransparentImage() 的完整說明，撞牆才會照圖案實際邊緣算），
    // 裁完的版本才存進 dvdEImages、預先解碼好，撞牆換圖的當下不用臨時等待。
    //
    // ---------- 優化首次進站加載：先只裁切第一張，讓飄動物件盡快跟著照片
    // 一起出現 ----------
    // 原本的做法是等「整批」圖片庫都裁切完成（Promise.all 全部跑完）才
    // 第一次讓飄動物件顯示出來——裁切每一張圖都牽涉到 canvas 畫圖、算
    // 透明留白邊界這類要花時間的工作，圖片庫張數一多，即使每張只多花
    // 幾十毫秒，加總起來也會讓飄動物件比首頁照片晚好一段時間才出現，這
    // 正是「飄動物件都不會跟著照片馬上出來」的成因——不是網路請求本身慢，
    // 是「裁切這批圖片庫全部跑完才放行顯示」這段邏輯本身在等待。
    // 改成：先單獨裁切陣列的第一張，裁完立刻用暫時倍率（scale:1，這張
    // 還沒被拿去跟其他張一起算面積平均值）讓飄動物件顯示出來，不用等
    // 其餘所有圖片都裁切完成；剩下的圖片留到下面用 .then() 串接、在背景
    // 慢慢裁切，裁完之後才重新統一算一次整批的面積縮放倍率、更新
    // dvdEImages 供之後撞牆換圖使用，同時把目前顯示中這張的倍率也一併
    // 更新成正確值。
    dvdEImagesPromise.then(urls => {
      if(!urls.length) return Promise.reject(new Error('dvd e images empty'));
      // 每次進站隨機挑一張圖當作飄動物件的初始圖，而不是永遠固定用陣列
      // 第一張（urls[0]）。
      const initialIndex = Math.floor(Math.random() * urls.length);
      const firstUrl = urls[initialIndex];

      // ---------- 修正：「一開始進去照片一股腦亂跳，且撞擊跟切換沒有
      // 同步」----------
      // 成因（前幾輪修正走過的彎路）：曾經試過讓過渡期的 dvdEImages 直接
      // 指向圖庫「原始、還沒裁切」的網址，本意是解決「隔了一陣子才開始
      // 有撞擊切照片」——但這麼做等於讓撞牆可以換到「根本還沒準備好」的
      // 圖，帶出兩個新問題：① 原始網址是完全沒去背裁切的大圖，不同照片
      // 留白、長寬比差異很大，直接顯示會忽大忽小、忽寬忽窄，肉眼看起來
      // 就是「亂跳」；② 這些原始網址完全沒有預先解碼快取，撞牆的當下才
      // 臨時下載＋解碼一張全新的大圖，這段跟網路速度有關的非同步等待，
      // 跟「這一影格物理迴圈判定撞牆」這個瞬間動作對不上拍，就是撞擊跟
      // 換圖「不同步」的成因。
      // 修法（成熟、常見的漸進式預載作法）：dvdEImages 一開始是空陣列，
      // 只有真的「裁切去背 + 解碼」都完成的照片，才會被 push 進來；
      // cycleDvdEImage() 永遠只從這個「已就緒池」裡面選圖，保證撞牆的
      // 當下能立即、無延遲地換上去（早就解碼快取好了），也保證每一張
      // 顯示出來的都是已經去背裁切過、視覺大小經過統一計算的版本，不會
      // 忽大忽小地亂跳。已就緒池會用背景 requestIdleCallback 逐張處理
      // （見 trimDvdEImagesStaggered()），隨處理進度慢慢長大，從一開始
      // 可能只有 1 張可選，隨時間增加到整個圖庫——這是「剛進站不要卡頓」
      // 跟「撞牆換圖要可靠、即時」兩者之間常見的權衡，比起「假裝全部都
      // 能選、但選到的其實還沒準備好」要正確、扎實得多。
      // orderedUrls 刻意把 firstUrl 排在最前面優先處理——這樣使用者最早
      // 能撞牆換到的第一張，會跟畫面上已經用快速小圖預覽過的那張是同一
      // 張（只是換成裁切乾淨的正式版本），不會突然跳成完全不相關的另
      // 一張。
      const orderedUrls = [firstUrl].concat(urls.filter((_, i) => i !== initialIndex));

      // ---------- 第一次出現先用小尺寸縮圖，不用等裁切完成 ----------
      // 圖片庫來源縮圖是 =s1600（畫質好但檔案也大很多），使用者「這一刻
      // 馬上要看到」的其實只是一個小小的飄動物件（畫面上最大也才
      // 300~600px 高），用得到 1600px 完整畫質的時機，其實是「已經在
      // 畫面上飄了一陣子」之後。第一次顯示改成先跟 Google 圖片 CDN 要一份
      // 小很多的 =s400 版本（同一張來源圖，只是換一個尺寸參數，不會另外
      // 多打一次 Drive API），下載量大幅減少；等這張小圖顯示出來、使用者
      // 已經看得到飄動物件之後，才在下面背景把完整畫質下載＋裁切好，
      // 用 setDvdBounceImageSrc() 原本就有的「畫面外先解碼好才切換」機制
      // 無縫換成正式畫質，使用者不會感覺到任何跳動。
      const quickUrl = /=s\d+$/.test(firstUrl) ? firstUrl.replace(/=s\d+$/, '=s400') : firstUrl;

      // ---------- 修正：「手機版剛進站，第一次撞牆永遠不會換照片」----------
      // 成因：撞牆真的能換到「不一樣的一張」，前提是已就緒池
      // （dvdEImages）裡至少要有 2 張——1 張沒得選，pickNextDvdEImageIndex()
      // 只能選回原本那張（見該函式 n<=1 的分支，以及上面 cycleDvdEImage()
      // 內對應的 guard）。但原本池子裡的「第二張」，一律要等
      // trimDvdEImagesStaggered() 這條背景流程排到 orderedUrls[1]（還要先
      // 經過下面那段 200ms/750ms 緩衝，再加上下載原始大圖＋canvas 裁切去背
      // 這段真正花時間的運算）才會真的補進 dvdEImages[1]。使用者從進站、
      // 畫面淡入、飄動物件開始飄，到第一次真的撞到牆，往往用不到一兩秒，
      // 手機處理器又比桌機慢上不少——「第一次撞牆」幾乎必然發生在「背景
      // 裁切還沒排到第二張」之前。這是撞牆換圖需要「至少 2 張候選」跟湊出
      // 第 2 張候選要等一整條慢流程，這兩件事天生對不上拍的結構性問題，
      // 不是參數調得不夠、guard 加得不夠多的問題——只要換圖的先決條件是
      // 「背景裁切排到第 2 張」，這個空窗期就一定存在，難怪怎麼改都還是
      // 會發生。
      // 修法：比照上面 quickUrl 的做法，但不是只多預載「第二張」，而是把
      // orderedUrls 最前面一整批（DVD_E_QUICK_PRELOAD_COUNT 張）都一起要
      // 一份 =s400 小尺寸縮圖，進站當下就跟第一張平行送出下載請求，各自
      // 解碼成功就直接補進 dvdEImages[該索引]（scale 先用預設值 1，跟
      // dvdEImages[0] 一開始的暫時值一致）——不等待、不卡住上面的 initial
      // reveal 流程（reveal 只看第一張是否就緒，這裡純粹是背景並行預抓）。
      //
      // ---------- 修正：「換一張之後，接著幾次撞牆像沒反應，然後又忽然
      // 跳回第一張，節奏整個亂掉」----------
      // 成因：上一輪修正只多預載了「第二張」，池子在背景裁切
      // （trimDvdEImagesStaggered，手機尤其慢）追上進度之前，長時間只有
      // 2 張候選。pickNextDvdEImageIndex() 為了「最近 DVD_E_IMAGE_NO_REPEAT_COUNT
      // 張不重複」，池子只有 2 張時唯一合法候選永遠是「另外那一張」——
      // 這代表撞牆只能在這兩張之間死板來回：第一下從索引 0 換到索引 1
      // （使用者看到「换成下一張」），下一次真的觸發換圖時就只能從 1 換
      // 回 0（肉眼看起來像是「瞬間跳回第一張」）；中間如果撞擊間隔剛好落

      // 撞擊直接忽略、畫面沒有任何變化——三件事疊在一起，就是使用者體感
      // 到的「換一張、幾次沒反應、又跳回第一張，完全沒有規則」。
      // 修法：把快速預載的張數從「只有第二張」擴大成一整批（見下面
      // DVD_E_QUICK_PRELOAD_COUNT），讓已就緒池從進站那一刻起就有足夠多
      // 候選，撞牆換圖才會是「一張接一張、真的隨機」地往下跑，不會被迫
      // 卡在兩三張裡死板輪替。這幾張快速縮圖一樣是「不去背、保留原始
      // 留白」的暫時版本、面積縮放先用預設值 1（跟原本 quickUrl2 的做法
      // 完全一致，使用者先前已經確認這條快速路徑本身視覺上沒有問題），
      // 之後背景 trimDvdEImagesStaggered() 照樣會依序排到這些索引，用
      // 同一套「跳過目前正在顯示的那格」規則（見下面 onItemReady 內的
      // 說明）無縫換成裁切乾淨的正式版本，不會有額外的跳動。
      //
      // 注意：這些下載彼此之間、以及跟下面下載完成寫回 dvdEImages 的順序
      // 完全不保證跟索引順序一致（純粹看各自網路請求誰先回來），陣列中
      // 間因此可能暫時出現「空洞」——上面 pickNextDvdEImageIndex() 已經
      // 改成只在 dvdEReadyIndices() 這份「真的有內容」的索引清單裡選，
      // 不會選到空洞，這裡不需要額外處理順序。
      // 低效能裝置（DVD_LOW_POWER_DEVICE）把同時併發預載的張數再收斂一點
      // （原本統一是「防重複張數 + 4」，這類裝置改成「防重複張數 + 1」）：
      // 這批 decode() 雖然都是非同步、理論上不直接佔用主執行緒，但剛進站
      // 這一刻手機處理器同時要應付淡入動畫、飄動物件的 RAF 物理迴圈、
      // 網路多工下載這幾張小圖——decode() resolve 的那一刻仍然需要瀏覽器
      // 排一個任務回主執行緒執行 markReadyN()，張數越多，這幾個小任務
      // 越容易跟移動的那個 RAF 影格擠在一起。降低張數犧牲的是「防重複」
      // 機制在最初幾秒的候選圖片略少一點，但這個效果原本就會隨著背景
      // trimDvdEImagesStaggered() 陸續補位而快速消失，換取這幾秒移動更順
      // 是划算的取捨。
      const DVD_E_QUICK_PRELOAD_COUNT = Math.min(orderedUrls.length, DVD_E_IMAGE_NO_REPEAT_COUNT + (DVD_LOW_POWER_DEVICE ? 1 : 4));
      for(let qi = 1; qi < DVD_E_QUICK_PRELOAD_COUNT; qi++){
        const quickIdx = qi; // 迴圈變數本身在閉包裡會變動，先固定成獨立變數給下面的 closure 用
        const urlN = orderedUrls[quickIdx];
        const quickUrlN = /=s\d+$/.test(urlN) ? urlN.replace(/=s\d+$/, '=s400') : urlN;
        const offscreenN = new Image();
        offscreenN.src = quickUrlN;
        const markReadyN = () => {
          // 背景裁切流程如果剛好比這裡快、已經把正式版本寫進這一格，就
          // 不要用還沒去背的快速縮圖蓋掉已經更好的版本。
          if(!dvdEImages[quickIdx]){
            dvdEImages[quickIdx] = { src: quickUrlN, scale: 1 };
          }
        };
        if(offscreenN.decode){
          offscreenN.decode().then(markReadyN, () => {}); // 失敗就放棄這條快速路徑，交給下面完整流程處理
        } else {
          offscreenN.onload = markReadyN;
          offscreenN.onerror = () => {};
        }
      }

      return setDvdBounceImageSrc(quickUrl, 1)
        .then(markDvdRealImageReady)
        .then(() => {
          // ---------- 修正：「手機版剛打開網頁，飄動物件第一次撞牆時圖案
          // 完全沒反應（要等一陣子才會開始換）」----------
          // 成因：cycleDvdEImage() 一開頭就是 `if(!dvdEImages.length) return;`
          // ——撞牆當下如果 dvdEImages 還是空陣列，就直接整個no-op、畫面上
          // 什麼都不會發生。但 dvdEImages 原本要等下面 trimDvdEImagesStaggered()
          // 這條背景流程真的處理完「至少一張」（下載＋canvas 裁切透明留白）
          // 才會 push 進第一筆，這是一段跟網路/裝置效能有關、長短不定的
          // 非同步等待；而飄動物件本身（帶著 quickUrl 這張小圖）在這之前
          // 就已經可以開始移動、開始撞牆了——中間這段「已經在飄、但圖片庫
          // 還是空的」的空窗期，正是使用者回報「剛打開網頁時撞牆都不會換
          // 圖案，過一陣子才正常」的成因。也正因為是「等圖片庫背景填滿」
          // 這件事，不是一次性的初始化 bug，所以只要使用者稍微等一下（或
          // 像離開 preview 頁再回來這種、中間隔了幾秒的操作）就會「自己
          // 變正常」——池子這時多半已經被填了至少一筆。
          // 另外下面 pickNextDvdEImageIndex() 旁的說明也已經預先假設了
          // 「dvdEImages[0] 一定對應使用者這一刻已經在畫面上看到的初始圖」
          // （dvdEImageRecentHistory 初始值是 [0]，等同把這張算成「已經
          // 用過一次」）——但實際上 dvdEImages[0] 要等背景裁切完成才會真的
          // 被寫入，在那之前陣列根本是空的，等於這個假設有一段時間對不上
          // 實際狀態。
          // 修法：這裡不等背景裁切，直接就地把「使用者這一刻已經看到的
          // quickUrl 小圖」當成 dvdEImages[0] 先寫進去，讓撞牆判斷從一開始
          // 就有「至少一張」可以用，不會再整個 no-op。之後 orderedUrls 的
          // 背景裁切流程處理到第一張（同一張圖、裁切乾淨的正式版本）時，
          // 原本就有的 `if(idx === dvdEImageIndex)` 分支會自動接手、換上
          // 正式版本，不會被這裡的暫時寫入影響、也不會重複觸發跳動。
          dvdEImages[0] = { src: quickUrl, scale: 1 };

          // 飄動物件這邊也準備好了：舉手告訴 attemptInitialReveal()，
          // 讓它跟 preview 照片那邊的旗標一起判斷，確保兩者是同一刻
          // 一起放行、一起出現，而不是各自獨立放行（完整說明見上面
          // attemptInitialReveal() 旁的註解）。
          dvdReadyForInitialReveal = true;
          attemptInitialReveal();
        })
        // ---------- 讓「整批圖片庫開始處理」的重運算，稍微晚一點點才開始 ----------
        // 上面 attemptInitialReveal() 一放行，除了飄動物件本身淡入之外，
        // header 文字、preview 起始照片也會在同一刻一起出現，瀏覽器這一刻
        // 通常還有其他排版／繪製工作要忙。緊接著如果馬上呼叫
        // trimDvdEImagesStaggered() 開始處理圖片庫第一張圖，底層
        // trimTransparentImage()／trimLoadedImage() 需要對 canvas 做
        // drawImage、getImageData、以及最花時間的 toDataURL('image/png')
        // 編碼，是一段會真的佔用主執行緒一小段時間的同步運算（見
        // trimLoadedImage() 開頭「剛進站飄動物件很LAG」那段說明）。這段
        // 運算實際開始的時間點取決於這張圖的網路下載／解碼何時完成，是
        // 不確定的——如果剛好落在使用者剛看到畫面淡入的這一刻，容易讓
        // 同時跑著的 RAF 物理迴圈（負責位置飄動）跟著卡一下、掉幾影格。
        // 修法：不改動 trimTransparentImage() 本身的運算（畫質、精確度都
        // 不受影響），只是刻意把「整批圖片庫開始處理」這件事延後一小段
        // 緩衝時間才開始，讓這段同步運算不會緊貼著淡入那一刻搶主執行緒。
        // 畫面上第一次看到的飄動物件，這段延遲期間仍然是用上面已經顯示
        // 中的 quickUrl 小圖（=s400，早就載入完成），不會有任何空白或
        // 卡住的狀態，只是「正式高畫質版本」的無縫替換稍微晚一點點才發生，
        // 使用者不會感覺到差異。
        // ---------- 修正：「手機版一開始撞牆都不會變照片，一陣子後才會」----------
        // 成因：這段緩衝原本固定 750ms，目的是避開「整批圖片庫開始處理」
        // 這件事跟剛淡入畫面那一刻的排版／繪製工作撞在一起（見上面這段
        // 開頭的完整說明）。但在沒有原生 requestIdleCallback、或核心數較少
        // 的裝置上（DVD_LOW_POWER_DEVICE，目前幾乎等於手機 Safari／LINE、
        // Threads 等內建 WebKit 瀏覽器），下面 trimDvdEImagesStaggered()
        // 本身要把「已就緒池」填滿就已經比桌機慢很多（見該函式
        // scheduleNext() 內對應的說明）；在這之前又先固定多等 750ms 才
        // 「開始」處理，等於雪上加霜——使用者這段時間內每一次撞牆，
        // cycleDvdEImage() 看到的 dvdEImages 都還是空陣列，直接被
        // `if(!dvdEImages.length) return;` 擋掉、畫面上完全沒有變化，
        // 體感就是「撞了好幾次都沒反應，過一陣子才忽然開始正常」。
        // 這類裝置改用短很多的緩衝（200ms）：仍然足夠讓淡入那一刻最急迫
        // 的排版工作先跑完、不會整批疊在同一影格，但不再讓使用者白白
        // 多等大半秒才開始建池；桌機（有真正的 requestIdleCallback，
        // 原本就比較不受這段延遲影響）維持原本 750ms 不變，不動既有手感。
        .then(() => new Promise(resolve => setTimeout(resolve, DVD_LOW_POWER_DEVICE ? 200 : 750)))
        .then(() => {
          let firstEntryApplied = false;
          return trimDvdEImagesStaggered(orderedUrls, (idx, result) => {
            // 每處理完一張，立刻加進「已就緒池」——池子從空的開始，隨著
            // 處理進度慢慢長大，cycleDvdEImage() 永遠只從裡面選，保證
            // 每一次撞牆換到的都是已經準備好、能立即顯示的圖。
            //
            // 注意：這裡改成依 idx 直接指定位置（原本是 .push()）——因為
            // 上面新增的「先用 quickUrl 暫時佔住 dvdEImages[0]」那段修正
            // （見 dvdEImagesPromise.then() 內對應的完整說明）會讓陣列在
            // 這段背景流程開始之前就已經有 1 筆暫時資料，如果這裡繼續用
            // .push()（永遠加到陣列尾端），idx=0 處理完成時會被誤塞進
            // dvdEImages[1]，導致「idx 對應 orderedUrls 第幾張」跟「這筆
            // 資料實際落在 dvdEImages 陣列的第幾格」整個錯位一格——後面
            // `idx === dvdEImageIndex`（目前正在顯示哪一格）的判斷、以及
            // 下面 computeDvdAreaScales() 算完後 `dvdEImages[i] = entry`
            // 依索引寫回的邏輯，都會全部跟著對不上。改成直接依 idx 指定
            // 位置，不管陣列是從空的開始、還是已經預先塞了第 0 格，都能
            // 保證 dvdEImages[idx] 永遠對應 orderedUrls[idx] 這一張，兩邊
            // 索引不會再錯位。
            dvdEImages[idx] = { src: result.src, scale: 1 };
            // 立刻在背景把這張剛就緒的圖預先解碼＋建立像素遮罩，不用等
            // 整批處理完才輪到 preloadDvdEImages()——見上面 predecodeDvdEImage()
            // 旁「撞擊後沒有馬上切換，要到接下來的空中飄動途中才切換」的
            // 完整成因說明。這裡只是「登記」一次非同步 decode()，不會佔用
            // 主執行緒，也不影響這一步 onItemReady 原本的其他行為。
            predecodeDvdEImage(result.src);
            if(!firstEntryApplied){
              firstEntryApplied = true;
              // ---------- 修正「剛進網頁時還是會卡頓式稍微放大」----------
              // 成因：這裡原本不管使用者這一刻是不是還在看著這張圖，一律
              // 立刻呼叫 setDvdBounceImageSrc() 換成裁切乾淨的正式版本——
              // 換之前（快速小圖 quickUrl，沒去背，保留原始留白）跟換之後
              // （緊貼主體邊緣裁切過）的長寬比通常不一樣，畫面上呈現的
              // 寬度（height 固定不變、width:auto 會自動跟著長寬比縮放）
              // 會瞬間跳一格；.dvd-bounce-img 的 transition 只設定給
              // transform／opacity（見上面 CSS 的完整說明），寬度變化完全
              // 沒有過渡可以吃掉這一下跳動，使用者看到的就是「卡頓式稍微
              // 放大／縮小」——而且這個時間點通常跟上面「整批圖片庫延後
              // 750ms 才開始處理」結束的時間點很接近，主執行緒剛好也在忙
              // 別的事，兩者疊在一起，感覺起來更像是「卡一下、順便跳了
              // 一下」。
              // 下面「整批處理完成」那段分支，其實早就用「跳過目前顯示中
              // 的格子，留到下一次真的撞牆才自然換上」這個原則處理過同一
              // 類問題（見那段的完整說明）——這裡改成套用一模一樣的原則：
              // 如果使用者這一刻還在看著這張圖（idx === dvdEImageIndex，
              // 也就是還沒撞牆換到別張），就不要現在硬換，維持顯示手上
              // 這張快速小圖，正式版本已經在「已就緒池」裡待命；真正換成
              // 裁切乾淨版本的時機，留到使用者下一次真的撞牆、
              // cycleDvdEImage() 自然切換圖片的那一刻（見該函式：一律讀
              // 當下 dvdEImages[dvdEImageIndex] 最新的內容），兩件事合併
              // 在同一次換圖動作裡，不會再是一次額外、突兀的跳動。如果
              // 使用者這時候已經撞牆換到別張圖了（idx !== dvdEImageIndex），
              // 代表這張圖現在根本不在畫面上，換掉不會被看到，維持原本
              // 「立刻換上正式版本」的行為即可，撞牆邊界照樣盡快變準確。
              if(idx === dvdEImageIndex){
                // 先不换：正式版本已經寫進 dvdEImages[idx] 了，下一次真的
                // 撞牆時 cycleDvdEImage() 自然會用上，這裡什麼都不用做。
              } else {
                setDvdBounceImageSrc(result.src, 1);
              }
            }
          }).then(trimmedEntries => {
            // 整批都處理完成，統一重新算一次正確的面積縮放倍率（見
            // computeDvdAreaScales() 的完整說明，需要整批照片的平均值
            // 才能算），套用回已就緒池——trimmedEntries 跟 dvdEImages
            // 是用同一份 orderedUrls、同樣的處理順序累積出來的，位置
            // 一一對應，可以直接依索引寫回。
            const scaled = computeDvdAreaScales(trimmedEntries);
            scaled.forEach((entry, i) => {
              // 跳過「目前正在畫面上顯示」的那一格：height 是套用
              // --dvd-area-scale 算出來的，沒有 transition，直接改會讓
              // 瀏覽器瞬間套用新高度、看起來像「忽然變大/變小」的跳動
              // （完整成因見上面「lag完之後飄動物件忽然變大」這輪舊
              // 修正的說明）。只更新 src/scale 都不影響、當下沒被看到的
              // 其餘格子即可，下一次真的撞牆換到那一張時，正確倍率自然
              // 隨著整張圖一起換上，不會顯得突兀。
              if(i === dvdEImageIndex) return;
              dvdEImages[i] = entry;
            });
            preloadDvdEImages();
          });
        });
    }).catch(() => {
      // 圖片庫抓取或裁切整個失敗（資料夾沒設定、離線、空陣列等）：這裡
      // 刻意不呼叫 markDvdRealImageReady()，飄動物件會維持隱藏、不會退回
      // 顯示內建那張黃色 e 預設圖——這是使用者明確要求的行為：寧可這種
      // 情況下不顯示飄動物件，也不要顯示錯的那張預設圖。
    });
    photos = await photosPromise; // 請求早在腳本最上方就已經發出去了（見 photosPromise 宣告處的說明），這裡只是接收結果

    // 照片一到手，第一件事是先暖機 preview 頁要用的起始兩張照片，而不是
    // 先渲染網格。現在進站預設會直接顯示 preview 頁（見下面 openPreviewPage），
    // 網格在使用者點一下之前其實是被蓋在底下、看不到的——所以「使用者這一刻
    // 真正會看到的東西」是 preview 的這兩張照片，理當比網格縮圖更早發出
    // 網路請求、更早拿到瀏覽器的連線／頻寬。原本是先 renderGrid()（會一次
    // 發出前 GRID_EAGER_COUNT 張網格縮圖的請求）才輪到 preview 暖機，等於
    // 讓使用者看不到的內容搶先跟使用者馬上要看到的內容搶頻寬，這是
    // 「preview 頁一開始還是白幕好一陣子」的原因之一。
    preparePreviewSequences();

    // ---------- 修正：「剛進站還是會有點lag」 ----------
    // 上面的說明只解決了「網路請求的優先順序」——preview 起始兩張照片的
    // 下載請求确實已經搶先網格縮圖發出去了。但這裡原本 renderGrid()／
    // positionAllGridIdx() 是「同步」呼叫，兩者都要等真的執行完（幫上百張
    // 照片組出 DOM、綁事件監聽器）才會輪到下面的 openPreviewPage()——這段
    // 純粹是主執行緒在跑 JS，跟網路快慢無關，即使網路完全沒有延遲，這一段
    // 同步運算本身也會卡住主執行緒一小段時間，讓瀏覽器沒有機會去處理繪製、
    // 觸控、動畫等其他更優先的事——而使用者進站當下第一眼看到的其實只有
    // preview 頁那兩張照片＋飄動的 e（網格整個被蓋在下面看不到），這段
    // 「使用者根本還看不到」的網格建置工作，沒有理由搶在 openPreviewPage()
    // 之前、佔用使用者能感覺到「頁面卡一下」的這段黃金時間。
    // 修法：先呼叫 openPreviewPage()，讓瀏覽器可以盡快把這一輪需要的
    // 工作（開始 preview 轉場、continue 走 startPreviewCycle 內的非同步
    // 流程）排進事件迴圈；網格的建置／定位／背景預抓，改成用
    // requestIdleCallback（瀏覽器真正閒下來、不影響更優先工作時）才執行，
    // 沒有這個 API 的瀏覽器則退回極短的 setTimeout，等同「盡快、但排在
    // 目前這一輪同步工作之後」。網格本來就是使用者點一下才會看到的東西，
    // 慢個幾十~幾百毫秒才建置完成，肉眼完全感覺不到差別；換來的是
    // 「使用者這一刻真正看得到的 preview 頁」不用再陪著等這一段。
    openPreviewPage(false, true);

    // gridBuildStarted：防止「保底延遲時間到」跟「使用者提前關閉 preview」
    // 兩條觸發路徑同時／重複呼叫 buildGridDeferred()。這裡刻意在呼叫
    // scheduleIdle(buildGridDeferred, ...) 之前就標記成 true（見下面
    // triggerGridBuildOnce()），不是等 buildGridDeferred() 真的執行完才標記
    // ——因為 renderGrid() 本身是分批非同步完成的，如果用「執行完」當判斷
    // 依據，使用者在網格還沒建完的這段期間關閉 preview，會誤判成「還沒
    // 開始」而重複觸發第二次 renderGrid()。只要已經排進佇列（不管排進
    // requestIdleCallback 還是排進 setTimeout），就視為「已經處理過」，
    // 不重複觸發。
    let gridBuildStarted = false;
    const buildGridDeferred = () => {
      // renderGrid() 現在改成分批、跨好幾次 requestIdleCallback 才會全部
      // 建完（見該函式上方「頭幾秒還是會lag」的完整說明）——positionAllGridIdx()
      // 這個「保底補一次」的動作，改成放進 onComplete callback、等全部
      // 批次都真的建完才觸發，不然只會補到第一批，後面批次的格子還是要
      // 完全依賴各自的 load 事件才會補位，等於這層保底少了大半效果。
      renderGrid(positionAllGridIdx);

      // 這兩個背景預抓都是直接走 `photos` 這個資料陣列、不依賴網格 DOM
      // 元素本身，不需要等 renderGrid() 全部批次完成才開始，維持原本
      // 「越早開始背景暖機越好」的行為，不受這次改動影響。
      prefetchAllInBackground();
      prefetchHoverThumbsInBackground();
    };
    // ---------- 修正：「preview 頁停留期間，飄動物件移動優先，網格可以晚一點」----------
    // 使用者剛進站幾乎一定會先停在 preview 頁一段時間，才會點回首頁——
    // 這段停留期間網格本來就被蓋在下面看不到，沒有理由讓它的建置／背景
    // 預抓在這段「使用者眼睛只看得到飄動物件」的黃金時間內跟它搶主執行緒。
    // 低效能裝置（DVD_LOW_POWER_DEVICE，見上面完整說明）原本的延遲從
    // 1500ms 拉長到 4000ms：桌機/平板有真正 requestIdleCallback，同一批
    // 工作本來就只會排到瀏覽器真正閒下來才做，維持 1500ms 不受影響；
    // 只有沒有這個 API 的 Safari/IG 系，才需要靠「延後起跑點」這個土法
    // 煉鋼的方式模擬同樣的效果，拉長延遲讓飄動物件那幾秒能獨佔主執行緒。
    // 這裡不是「等它整個圖片庫都跑完才開始」，只是換一個起跑時間點，跟
    // 原本 1500ms 的設計理念一致，只是数字更保守。
    const GRID_BUILD_DEFER_MS = DVD_LOW_POWER_DEVICE ? 4000 : 1500;
    let gridBuildDeferTimer = null;
    const triggerGridBuildOnce = () => {
      if(gridBuildStarted) return;
      gridBuildStarted = true;
      if(gridBuildDeferTimer !== null){ clearTimeout(gridBuildDeferTimer); gridBuildDeferTimer = null; }
      scheduleIdle(buildGridDeferred, { timeout: 1200, fallbackDelay: 0 });
    };
    gridBuildDeferTimer = setTimeout(triggerGridBuildOnce, GRID_BUILD_DEFER_MS);
    // 但如果使用者比這個延遲時間更早就主動關閉 preview、要看首頁格子——
    // 不能讓他們對著還沒建置的空白網格等到保底延遲時間到，這裡讓
    // closePreviewPage() 觸發時（見該函式內對 window.__triggerGridBuildOnce
    // 的呼叫）立刻補建，不用等 GRID_BUILD_DEFER_MS 那個「預期使用者還在
    // preview 頁」的保守延遲。掛在 window 上是因為 closePreviewPage() 定義
    // 在這個 async function 之外的外層作用域，兩邊都在同一個 IIFE 裡、
    // 不會外洩到全域，純粹借用 window 當一個雙方都拿得到的溝通管道。
    window.__triggerGridBuildOnce = triggerGridBuildOnce;

    // 背景閒置時間先把 Matter.js 預先載入＋剖析好（不等使用者真的雙擊
    // 飄動的 e 才臨時去下載）：原本 loadMatterJS() 只在 enterPhotoFallMode()
    // 裡第一次被呼叫，代表使用者「這輩子頭一次」雙擊觸發堆疊模式時，
    // 除了原本已有的「等首頁縮圖收起」那段等待，還要多疊加一次真正跨網路
    // 下載＋剖析執行這個 library（在網路較慢或手機 CPU 較弱時，剖析／
    // 執行這幾十 KB 的 JS 本身也會佔用一小段主執行緒時間），使用者感受
    // 到的就是「一開始特別頓」。這裡改成使用 requestIdleCallback，在瀏覽器
    // 真的閒下來、不影響首屏渲染／照片載入等更優先的工作時，提前把
    // Matter.js 載入＋剖析好、快取進 window.Matter——等使用者真正雙擊時，
    // loadMatterJS() 會直接命中「window.Matter 已存在」那條路徑立刻
    // resolve，不再需要臨時等網路。失敗（例如離線）不處理，反正
    // enterPhotoFallMode() 本來就有自己的 loadMatterJS() 失敗處理／重試
    // 路徑，這裡只是「能先準備就先準備」的加分項，不是必要條件。
    const warmMatterJS = () => { loadMatterJS().catch(() => {}); };
    scheduleIdle(warmMatterJS, { timeout: 4000, fallbackDelay: 2000 });

    // ---------- 進站預設先看到 preview 頁，點一下才到首頁 ----------
    // 原本只有網址是 #preview 時才會自動開 preview；現在改成不管網址有沒有
    // 這個 hash，一律先開 preview——但故意傳 pushHistory=false，不把
    // #preview 寫進網址列。這樣「剛進站看到 preview」跟「點一下回到首頁」
    // 這兩個狀態，網址列從頭到尾都是同一個乾淨網址（沒有 hash 差異）：
    //   - 進站當下 hash 本來就是空的，這裡不會主動加上 #preview
    //   - 使用者點擊 previewPage 觸發 closePreviewPage() 時，裡面判斷
    //     「pushHistory && location.hash === '#preview'」才會改網址，
    //     這裡 hash 從頭到尾不是 '#preview'，所以自然不會觸發、不會動到網址
    // 如果是使用者分享 https://.../#preview 這種明確帶 hash 的連結進來，
    // 一樣會走到這裡正常開啟 preview，行為不變。
    //
    // 照片「保證會出現」的部分不需要另外重寫一套邏輯——上面
    // preparePreviewSequences() 早就把起始兩張照片（極小圖／縮圖／原始
    // 高畫質）全部排進暖機佇列，而 openPreviewPage → startPreviewCycle →
    // applyPreviewSide() 內建的是一層一層的降級保護：已經暖好就直接上
    // 高畫質、還沒暖好就先等縮圖 decode 完成再顯示、縮圖也還沒好就繼續等
    // 高畫質——不管網路快慢，最後一定會顯示出照片，不會卡在空白或半張的
    // 狀態。這套機制原本就是為了「使用者手動點 preview」這個情境準備的，
    // 這裡讓進站自動開啟也走同一套，不需要重新設計。
    //
    // （這個呼叫本身已經搬到上面 preparePreviewSequences() 之後、
    // renderGrid() 之前，讓它盡快開始跑，不用等網格建置完——見上面
    // 「修正：剛進站還是會有點lag」那段說明，這裡只保留原本這一整段
    // 設計理念的說明，不再重複呼叫一次。）
  }

  // 禁止右鍵選單、禁止拖曳圖片（防止另存新檔 / 長按儲存）
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('dragstart', (e) => {
    if(e.target.tagName === 'IMG') e.preventDefault();
  });

  // 只擋雙擊縮放，不影響雙指縮放（pinch-zoom 保持可用）
  // 用 isMultiTouch 標記排除「雙指放開手指」被誤判成雙擊的狀況
  //
  // 注意：原本這裡只比對時間（兩次 touchend 間隔 <=300ms 就當作雙擊擋掉），
  // 沒有同時比對位置——這正是「preview 頁偶爾按一下沒反應」的成因。例如
  // 使用者先點了「Preview」標籤打開 preview 頁，那一下的 touchend 會把
  // lastTouchEnd 更新成當下時間；如果使用者緊接著（300ms 內）在 preview
  // 頁上按一下想關閉／切換，即使兩次點擊的位置完全不同（一個在標籤上、
  // 一個在 preview 頁上），純看時間的邏輯還是會誤判成「同一個雙擊」，
  // 呼叫 e.preventDefault() 把這次點擊吃掉——瀏覽器接下來就不會再合成
  // click 事件，previewPage 的 click 監聽器（負責 closePreviewPage()／
  // 切換照片）完全沒被呼叫，使用者看到的就是「按一下沒反應」，而且只有
  // 兩次點擊剛好落在 300ms 內才會發生，符合「大部分時候正常、偶爾才會」
  // 的描述。
  // 修法：額外記錄上一次 touchend 的座標，只有「時間夠接近、位置也夠接近」
  // 才真的當作雙擊縮放擋掉；位置差太多（不同元素、不同地方點擊）一律放行，
  // 讓 click 事件正常合成、正常觸發。
  let lastTouchEnd = 0;
  let lastTouchX = 0;
  let lastTouchY = 0;
  const DOUBLE_TAP_MAX_DIST = 30; // px，兩次點擊座標差在這個範圍內才視為同一個點
  let isMultiTouch = false;
  document.addEventListener('touchstart', (e) => {
    if(e.touches.length > 1) isMultiTouch = true;
  }, { passive: true });
  document.addEventListener('touchend', (e) => {
    if(e.touches.length > 0) return; // 還有手指沒放開，先不判斷
    const touch = e.changedTouches && e.changedTouches[0];
    if(isMultiTouch){
      isMultiTouch = false;
      lastTouchEnd = Date.now();
      if(touch){ lastTouchX = touch.clientX; lastTouchY = touch.clientY; }
      return; // 這是縮放手勢放開，不是雙擊，不攔截
    }
    const now = Date.now();
    const dx = touch ? Math.abs(touch.clientX - lastTouchX) : Infinity;
    const dy = touch ? Math.abs(touch.clientY - lastTouchY) : Infinity;
    const isRealDoubleTap = (now - lastTouchEnd <= 300) && dx <= DOUBLE_TAP_MAX_DIST && dy <= DOUBLE_TAP_MAX_DIST;
    if(isRealDoubleTap) e.preventDefault(); // 時間、位置都夠接近，才是真的雙擊縮放，擋掉
    lastTouchEnd = now;
    if(touch){ lastTouchX = touch.clientX; lastTouchY = touch.clientY; }
  }, { passive: false });


  // 背景慢慢把所有照片都預先下載一次（不搶主要資源），
  // 這樣使用者不管點開哪一張、往哪個方向連續切換，都大機率已經有快取
  function prefetchAllInBackground(){
    let i = 0;
    function step(){
      if(i >= photos.length) return;
      prefetchOne(photos[i].detailUrlMobile || photos[i].detailUrl || photos[i].url, true);
      i++;
      scheduleIdle(step, { timeout: 800, fallbackDelay: 120 });
    }
    step();
  }

  // hover 大圖預覽現在改用獨立的 thumbUrl（這一輪調整後是 s700，不受網格
  // 縮圖瘦身影響），跟網格顯示用的 gridUrl 已經是兩個不同檔案、不會互相
  // 沾光快取。為了不讓「使用者第一次 hover 到某張照片」變成要重新等一次
  // 網路下載，這裡在背景把所有照片的 thumbUrl 都先跑過一輪、解碼好放進
  // hoverPreviewCache，等真的 hover 到時幾乎都已經是現成的。只在支援 hover
  // 的裝置（桌機／滑鼠）才跑，手機本來就沒有 hover 預覽功能，不需要多耗這筆
  // 流量。優先順序低於 prefetchAllInBackground（大圖頁要用的原始畫質），
  // 用 idle callback 排在更後面，不搶主要資源。
  function prefetchHoverThumbsInBackground(){
    if(!supportsHover) return;
    let i = 0;
    function step(){
      if(i >= photos.length) return;
      const photo = photos[i];
      i++;
      if(photo && photo.thumbUrl && !hoverPreviewCache.has(photo.thumbUrl)){
        const loader = new Image();
        try { loader.fetchPriority = 'low'; } catch(e){} // 純背景暖機用，不搶當下畫面實際需要的資源
        loader.src = photo.thumbUrl;
        const store = () => hoverPreviewCache.set(photo.thumbUrl, loader);
        if(loader.decode){ loader.decode().then(store, () => {}); } // 失敗不快取，理由同上
        else if(loader.complete && loader.naturalWidth > 0){ store(); }
        else { loader.onload = store; }
      }
      scheduleIdle(step, { timeout: 1500, fallbackDelay: 200 });
    }
    step();
  }

  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(() => {
      syncFixedChrome();
      clampDvdIntoViewport();
    });
  }

  init();

})();
</script>
</body>
</html>
