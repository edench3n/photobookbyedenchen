<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>photobook by edenchen</title>

<!-- 🌟 分享預覽（LINE / Facebook / Threads 等）用的 Open Graph 標籤 🌟 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="edenchen">
<meta property="og:title" content="edenchen">
<meta property="og:description" content="edenchen">
<meta property="og:image" content="https://raw.githubusercontent.com/edench3n/photobookbyedenchen/main/og-image.png?v=2">
<!-- 給爬蟲的尺寸提示：數值故意設小（正方形、200x200），大部分平台（包含 LINE）
     在圖片本身是正方形且尺寸不大時，會把它當「小縮圖／小 icon」排版，
     而不是撐滿版面的橫幅大圖。這兩個數值務必跟 og-image.png 實際檔案的
     長寬「同比例」，否則有些爬蟲會直接忽略這個 hint、改抓實際檔案尺寸來排版。 -->
<meta property="og:image:width" content="200">
<meta property="og:image:height" content="200">
<meta property="og:url" content="https://www.edench3n.com/">
<!-- 🌟 改成 summary（不是 summary_large_image）：summary_large_image 是 Twitter/X
     指定的「大圖橫幅」卡片樣式，把 og-image.png 撐到滿版顯示；summary 才是
     「小縮圖 + 文字」的樣式，圖片會像小 logo 一樣顯示在旁邊，這正是你要的效果。
     這個標籤主要影響 Twitter/X 的預覽，LINE 則是靠圖片本身的長寬比例（見下方
     og-image.png 的說明）來決定顯示大小。 🌟 -->
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="edenchen">
<meta name="twitter:description" content="edenchen">
<meta name="twitter:image" content="https://raw.githubusercontent.com/edench3n/photobookbyedenchen/main/og-image.png?v=2">


<!-- 🌟 1. 設定瀏覽器分頁圖示 (Favicon) 🌟 -->
<link rel="icon" href="/EDEN.png?v=2" type="image/png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 照片放在 Google Drive / Google 圖片 CDN，先建立連線可以讓第一批照片更快開始下載 -->
<link rel="preconnect" href="https://drive.google.com">
<link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
<!-- 照片清單本身（誰有哪些照片、網址是什麼）要先打一次 Google Drive API
     才會知道，這是整個頁面「第一張照片出現前」最前面、會卡住後面所有事情
     的一個網路請求；先建好連線，能省下這個關鍵請求的 TCP/TLS 交握時間。 -->
<link rel="preconnect" href="https://www.googleapis.com" crossorigin>
<!-- 全站字體 Stack Sans Text：這次要用到 260、350 這種非標準字重數值，
     改成用可變字重（variable font）的範圍語法載入，瀏覽器可以在範圍內
     內插出任意數字的字重，不用侷限在 400/500/700 這些固定字重。
     載入方式改成「preload + 載完才切成 stylesheet」：原本用一般的
     <link rel="stylesheet">，瀏覽器會把它當成會影響畫面呈現的資源，
     整個首次繪製（first paint）都要等它下載、解析完才會開始，等於
     字體還沒到手之前，網頁一片空白什麼都看不到——即使已經有
     display=swap，那只解決「字型檔本身」延遲時的行為，不解決「這份
     CSS 檔案」本身仍然是 render-blocking 這件事。
     改用 rel="preload" 先把這份 CSS 當成一般資源背景下載（不阻擋繪製），
     onload 時才把它「切換」成真正的 stylesheet 套用進頁面——網頁可以先
     用 html/body 上已經設定好的 fallback 字體（見下面 body 的
     font-family: 'Stack Sans Text', sans-serif，sans-serif 是這裡的
     fallback）立刻繪製出畫面，字體真正下載完成後才平滑換成
     Stack Sans Text，不會再讓字體成為「畫面出現」這件事的阻塞點。
     <noscript> 保留原本寫法當退場機制，確保停用 JavaScript 的瀏覽器
     一樣拿得到這份字體，行為跟原本完全一致。 -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Stack+Sans+Text:wght@200..700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Text:wght@200..700&display=swap" rel="stylesheet"></noscript>
<style>
  :root{
    --header-h: 120px;
    --gap: 18px;
    --edge: 48px;
    --fs-title-gap: 170px; /* 桌機／平板拉簾右側預留給編號(010)/標題(Golf..)兩塊文字的寬度，
      JS 的 layoutFilmstripZone() 會依視窗寬度覆寫這個值，這裡只是初始預設，
      同時也是拉簾跟螢幕右邊界之間的留白依據（見 .detail-filmstrip 的 right） */
    --header-font-size: clamp(12.28px, 10.27px + 0.59vw, 16.73px); /* 桌機／平板版在原本
      0.85 倍的基礎上，再等比縮小成 0.88 倍（13.95→12.28、11.67→10.27、
      0.67→0.59、19.01→16.73），套用在上排大標題（header-left/preview/right，
      含 Preview 頁同步）、首頁下排時鐘（page-clock）、以及照片詳細頁「001
      tokyo」那排文字（detail-info），三者都共用這顆變數。只改字級大小，
      對齊邏輯（各元素的 left/位置計算、JS 的 syncEdgeAlignment 等）完全不受影響。
      手機版在下面 max-width:640px 那段有自己覆蓋的數值（見該處），不受這裡影響，
      維持原樣不變。 */
    color-scheme: light only; /* 避免手機在深色模式下，頁面自己的 CSS/JS 生效之前，
                                  瀏覽器先用系統預設的深色底色渲染，造成一瞬間的黑色閃爍 */
  }
  *{ box-sizing: border-box; }

  /* ---------- 全站文字/元件不可被選取，行動裝置點擊不出現灰色高亮方塊 ---------- */
  html, body, *{
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin:0; padding:0;
    background:#ffffff;
    color:#000000;
    font-family: 'Stack Sans Text', sans-serif;
    font-weight:350; /* 全站統一字重，preview 頁不再另外覆寫（見 .fixed-header 內的說明） */
    -webkit-font-smoothing: antialiased;
    overflow-x:hidden;
    touch-action: manipulation; /* allow scrolling + pinch-zoom, block double-tap-zoom */
    /* 手機瀏覽器（尤其 iOS/Android）內建「文字自動縮放」(text autosizing)：
       為了方便閱讀，遇到窄欄位裡的多行文字（例如手機版被拆成三行的 Collab
       區塊）會自動把字級再放大一次，而且這個放大是疊加在網站自己算出來的
       字級「之上」、由瀏覽器自己決定倍率，橫轉直時會重新估算一次——這正是
       「Collab 那塊橫轉直後忽然變超大、要重新整理才恢復」的真正成因，跟
       上面 JS 計算的時機無關，所以單純調整重算時機沒辦法根治。加上
       text-size-adjust:100% 直接關閉瀏覽器這層自動縮放，字級永遠只由我們
       自己的 CSS/JS 決定。 */
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  html{
    /* 垂直捲軸的寬度永遠保留（不管當下內容需不需要捲動），瀏覽器就不會在
       「捲軸剛好從無到有 / 從有到無」的那個瞬間，讓整個視窗寬度多出/少掉
       那十幾 px。這正是使用者回報「黑線出現的那一刻，剛好跟 Chrome 右邊
       捲軸一起出現」的成因：捲軸一冒出來，100vw／50% 這些用視窗寬度算出來
       的版面（包含 preview 頁左右兩欄的重疊計算）瞬間跟著變窄一次，先前
       特地做出來蓋住縫隙的 2px 重疊來不及跟著重新計算，縫隙就在那一瞬間
       露出來，看起來像一條黑線。固定保留捲軸寬度後，視窗寬度全程不會再
       因為捲軸有無而跳動，這個縫隙也就不會再有機會露出來。
       scrollbar-gutter 是新一點的標準寫法，某些瀏覽器（例如 Safari）還不
       支援，所以下面用 overflow-y:scroll 當退場機制，效果一樣、支援度更廣。 */
    scrollbar-gutter: stable;
    overflow-y: scroll;
  }

  a, button, .grid-item, .header-left, .nav-arrow {
    font-family:inherit;
    font-weight:inherit;
  }

  /* ---------- FIXED HEADER (always on top, always black, never covered) ---------- */
  /* 原本用 CSS Grid「五等分欄位」排版：header-left / header-preview / header-right
     各佔固定的 1/5 欄寬。問題是欄寬只跟總寬度成比例，跟文字實際需要多寬完全無關——
     螢幕變窄到某個程度（大約 700~1000px 之間，並非任何一個明確的 breakpoint），
     "photobook by edenchen" 這行字會比它所在的欄位還寬，被迫換行，看起來就是
     「文字忽然跳行」。改成 Flexbox：每個區塊只佔用文字實際需要的寬度
     （flex-shrink:0 + white-space:nowrap 鎖住 header-left 不被硬擠壓換行），
     彼此靠 justify-content:space-between 撐開版面。這樣同一套排版可以套用在所有
     寬度，不需要再切換 grid/flex，也不會再有那個模式切換造成的額外跳動。 */
  .fixed-header{
    position:fixed;
    top:0; left:0; right:0;
    z-index:1000;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap: var(--gap);
    padding: 36px var(--edge) 0 var(--edge);
    pointer-events:none;
    /* 進站初次載入的整體淡入用（見上面 body.initial-reveal-pending 那段
       說明），跟裡面每個子元素自己的 .positioned opacity transition
       是兩條互不干擾的獨立軌道：子元素負責「算出正確位置後才顯示自己」，
       這裡負責「所有子元素都準備好之後，整排一起淡入」。 */
    transition: opacity .3s ease;
  }
  .fixed-header .header-left,
  .fixed-header .header-preview,
  .fixed-header .header-right{
    color:#000000;
    /* 顏色改用「一般的黑↔白切換 + CSS transition」，不再用 mix-blend-mode。
       原本想用 mix-blend-mode:difference 讓顏色完全自動跟著正下方畫面即時
       計算，理論上很理想，但 .preview-page / .preview-col 為了避免另一個
       「圖層剛建立時黑閃一下」的問題，刻意用 transform:translateZ(0) 把
       自己拉成獨立的 GPU 合成圖層（見那兩處註解）——瀏覽器在跨圖層合成時
       常常沒辦法正確計算 blend mode（等於把背景當成透明處理），結果文字
       反而變成「永遠是白色、疊在白底首頁上完全看不見」，比原本的問題更
       嚴重。
       改回明確的黑／白兩個狀態切換（由 body.preview-active 控制，見下面該
       規則），但額外幫 color 加上一小段 transition，讓它是平滑淡過去、
       不是瞬間跳掉。刻意選一個較短的時間（.22s，比整塊滑動轉場的 .42s
       短很多）：header 因為 z-index 比照片高，全程都畫在照片「上面」，
       桌機／平板整塊滑動關閉時，畫面下緣最先露出網格、header 所在的最上緣
       其實是滑動快結束時才會露出來（見下面 .preview-slide-exit 的說明）
       ——JS 那邊也是抓「滑動剛結束」那個時間點才觸發顏色切換（見
       finishClosePreviewPage() 的說明），這一小段 transition 剛好接在
       那一刻之後平滑淡開，感覺上顏色轉換跟照片剛完成的移動是同一個連續
       動作、而不是分開的兩段動畫。 */
    transition: color .22s ease;
    /* 字級隨螢幕寬度連續、按比例縮小（不是斷點式的一次性跳動）：桌機滿版
       （≥1100px）維持 15px 不變，窄到手機縮小，中間用 vw 連續內插。line-height
       維持 unitless 的 1.5 倍率，會自動跟著 font-size 等比例縮放，不用另外
       處理；letter-spacing 改用 em（相對字級的比例單位）也是同樣道理，字級
       縮小時會自動等比例縮小，不會維持固定像素值變得不成比例。
       這樣做主要是為了避免 header-left / header-preview / header-right 三塊文字
       加起來的總寬度，在窄螢幕下超出螢幕，把 collab 那塊擠出右側畫面。
       數值抽成 --header-font-size 這個 CSS 變數（定義在 :root），detail-info
       （點進照片後下面的說明文字）會直接沿用同一個變數，確保兩邊字級/行距
       永遠一致，不用兩處分別調整、維護。 */
    font-size: var(--header-font-size);
    line-height:1.5;
    pointer-events:auto;
    white-space:pre-line;
  }
  .fixed-header .header-left{
    letter-spacing:0.014em;
    white-space:nowrap; /* 這行字沒有預期的換行點，鎖住不換行，避免中等寬度時被硬擠成兩行 */
    flex-shrink:0;
    position:relative;
    left: var(--header-left-nudge, 0px); /* 桌機滿版 5 欄時，JS 會把這個微調成精準對齊 001 照片左邊緣的偏移量，做法跟 header-preview 對齊 002 完全一樣；手機版這個變數固定是 0，位置不受影響 */
    opacity:0; /* 原因跟 header-preview / header-right 一樣：等 001 圖片載入、
                  算出精準位置後才顯示，避免進頁面/重新整理時「先跑到錯誤位置
                  再跳回來」 */
    transition: opacity .2s ease;
  }
  .fixed-header .header-left.positioned{ opacity:1; }
  .fixed-header .header-preview{
    letter-spacing:0.014em;
    white-space:nowrap;
    flex-shrink:0;
    position:relative;
    left: var(--preview-nudge, 0px); /* 桌機滿版 5 欄時，JS 會把這個微調成精準對齊 002 照片左邊緣的偏移量 */
    opacity:0; /* 進頁面/重新整理的瞬間，precise 對齊還沒算出來（要等 002 圖片載入），
                  在算出正確位置之前先不顯示，避免使用者看到它先出現在錯誤位置、
                  再「跳」到正確位置；JS 算完準確位置後會加上 .positioned 類別
                  才顯示出來（見下面 .positioned 規則） */
    transition: opacity .2s ease;
    /* 注意：這裡故意不對 left 加 transition。JS 每一幀都會用
       getBoundingClientRect() 讀「當下實際渲染出來的位置」回推下一次要設定的
       nudge 值；如果 left 有 transition，瀏覽器會在動畫過程中間插值，但 JS
       讀到的 --preview-nudge（CSS 變數）卻是已經設定好的「最終目標值」而不是
       插值中的當下值，兩者對不上，算出來的新 nudge 就會偏掉，且在連續拖曳、
       每一幀都重算的情況下持續放大誤差，畫面上就是「左右亂飛」。拿掉 transition
       後，每次讀到的都是瀏覽器已經套用完成的實際值，才不會有這個誤差累積問題。 */
  }
  .fixed-header .header-preview.positioned{ opacity:1; }
  @media (hover: hover){
    /* :hover 只在滑鼠這種真的有「懸停」概念的裝置上生效；觸控裝置點擊時
       瀏覽器常會把 tap 模擬成短暫的 :hover，導致手機上點按鈕會看到變淡一下
       這個不想要的效果，用 (hover: hover) 把這條規則限制在滑鼠裝置上即可。 */
    .fixed-header .header-preview.positioned:hover{ opacity:0.5; }
  }
  .fixed-header .header-right{
    text-align:left;
    letter-spacing:0.014em;
    flex-shrink:0;
    position:relative;
    left: var(--header-right-nudge, 0px); /* 桌機滿版 5 欄時，JS 會把這個微調成精準對齊 004 照片左邊緣的偏移量，做法跟 header-preview 對齊 002 完全一樣 */
    opacity:0; /* 原因跟 header-preview 一樣：等 004 圖片載入、算出精準位置後
                  才顯示，避免進頁面/重新整理時「先跑到錯誤位置再跳回來」 */
    transition: opacity .2s ease;
  }
  .fixed-header .header-right.positioned{ opacity:1; }

  /* ---------- 首頁時鐘（桌機／平板／手機都會顯示） ----------
     不管螢幕寬度，body.preview-active（目前在 Preview 頁）或
     body.detail-active（目前在照片詳細頁）都會把它藏起來，確保「只出現在
     首頁」。字體沿用跟大標題同一顆 --header-font-size 變數，字級、行距、
     字重都跟 header 文字一致。
     預設 opacity:0，等 JS 的 syncClockAlignment() 算出精準位置後才加上
     .positioned 顯示出來——做法跟 header-preview / header-right 完全一樣，
     避免進頁面/重新整理時「先跑到錯誤位置再跳回來」的閃爍。
     三塊（年份／月份日期／時間）的 left 由 syncClockAlignment() 依螢幕
     寬度算出精準像素：
       - 桌機／平板（>640px）：三塊同一高度（都貼齊 .page-clock 底部），
         由左到右分別對齊 header-left（標題）、header-preview（"Preview"
         字樣）、header-right（"Collab..." 那排字）的左邊緣，並用跟
         syncEdgeAlignment 同一套 Math.max 最小間距做法逐一往右鏈接，
         確保視窗變窄時三塊彼此不會疊到或跑位。
       - 手機（≤640px）：header-right 換行變成單獨一整排，不再適合當
         基準，改成時間對齊 header-left（標題），年份＋月份日期兩行疊在
         一起、對齊 header-preview（"Preview" 字樣），維持原本手機版設計。 */
  .page-clock{
    display:none !important; /* 主頁下排時間（年份／月份日期／時間）整組移除。
      維持原本的 DOM/JS（syncClockAlignment 等）不變，只用 display:none 讓它
      不再顯示、不佔版面，避免動到其他元素既有的對齊計算與規則。 */
    position:fixed;
    left:0; right:0;
    bottom:36px; /* 跟 header 上方 36px 留白對稱，高度感跟手機版一致 */
    z-index:900; /* 蓋在照片格子之上，但在 header（1000）之下 */
    pointer-events:none;
    opacity:0;
    transition: opacity .2s ease;
  }
  .page-clock.positioned{ opacity:1; }
  .page-clock-year,
  .page-clock-monthday,
  .page-clock-time{
    position:absolute;
    bottom:0; /* 桌機版三塊同一高度的基準線；手機版年份會用下面 media query 另外往上抬 */
    color:#000000;
    font-size: var(--header-font-size);
    line-height:1.5;
    letter-spacing:0.014em;
    white-space:nowrap;
  }
  .page-clock-year{ left: var(--clock-year-left, var(--edge)); }
  .page-clock-monthday{ left: var(--clock-monthday-left, var(--edge)); }
  .page-clock-time{ left: var(--clock-time-left, var(--edge)); }

  /* "Collab at" 跟 "edenchenworks@gmail.com" 之間的換行，只在手機版需要——
     桌機維持原本「Collab at edenchenworks@gmail.com」同一行、下一行才是
     「@edench3n」的兩行排版。這裡預設先把這個 <br> 藏起來（display:none
     時 <br> 完全不觸發換行，效果等同它不存在，前後的空白字元會正常收合成
     一個空格），只在下面 640px 的手機版 media query 裡才把它顯示出來、
     真正產生換行，變成三行。 */
  .collab-line-break{ display:none; }

  /* 「@edench3n」這一行往上拉近一點，靠近上面的
     「edenchenworks@gmail.com」，但不動「Collab at」跟
     「edenchenworks@gmail.com」之間的間距——line-height 是整個區塊統一的
     倍率，沒辦法只調整其中一行的行距，所以把這一行包成獨立的
     inline-block（<span class="collab-line3">），只在它身上套一個小小的
     負值 margin-top，把它往上拉近；用 em 為單位，這樣不管上面
     fitCollabWidth() 把字級縮放成多少，這個拉近的幅度都會跟著等比例縮放，
     不會在字級變小/變大時看起來忽近忽遠。 */
  .collab-line3{
    display:inline-block;
    margin-top:-0.45em;
  }

  /* 量測用的隱形分身：position:absolute 讓它徹底脫離 .fixed-header 的
     flex 版面（絕對定位的子元素不算 flex item，flex-basis:100% 之類的
     規則完全不會套用在它身上），寬度不設死值，交給瀏覽器用「shrink-to-fit」
     演算法自動收縮成內容本身的自然寬度（也就是因為 <br> 被斷成三行後，
     最長那一行真正需要的寬度）。selector 疊了三層 class 是刻意要贏過上面
     `.fixed-header .header-right{ position:relative; opacity:0; ... }`
     那條規則（兩層 class）的特異度，才能確實蓋掉 position/opacity 這些值。 */
  .fixed-header .header-right.collab-measure{
    position:absolute;
    visibility:hidden;
    opacity:0;
    pointer-events:none;
    left:0;
    top:0;
    width:max-content;
    transition:none;
  }

  /* ---------- GALLERY PAGE ---------- */
  #galleryPage{
    position:relative;
    min-height:100vh;
    padding: calc(var(--header-h)) var(--edge) 140px var(--edge);
    transition: opacity .5s ease, filter .5s ease;
  }
  .grid{
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap: var(--gap) var(--gap);
    /* 編號現在改成貼在「照片實際下方一點點」，不再是貼齊整個正方形格子的
       下緣——縮圖用 max-height:52% 置中顯示，照片下緣跟格子下緣之間本來
       就留有一段沒被照片佔用的空間（至少 24% 格高），編號會落在這段空間
       裡，不會超出格子本身的高度範圍，所以不需要再額外加大列距，跟欄距
       用同一個 var(--gap) 即可。 */
    row-gap: var(--gap);
  }
  .grid-item{
    position:relative;
    touch-action: manipulation;
  }
  .grid-item .thumb-wrap{
    width:100%;
    aspect-ratio: 1 / 1;
    overflow:visible;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative; /* .idx 現在改成絕對定位，left / top 都由 JS 依「照片本身」
                           實際渲染出來的邊界即時算出 */
  }
  .grid-item img{
    /* 尺寸現在完全由 JS 的 sizeGridItemImage() 依「面積」算出來、直接寫入
       inline style.width/height（見該函式的完整說明）。這裡的 max-width/
       max-height 只是最後一道保險（避免極端情況，例如量不到寬高比、或
       JS 還沒來得及套用時，圖片意外撐爆格子），數值放寬到 100%——不能再
       維持原本的 52%，那正是「橫式照片被硬壓扁、直式照片被拉得極端大」
       的成因（原本以為 52% 是最終顯示大小的上限，但實際上瀏覽器只有
       max-width 這一條真的生效，等於變成「用寬度上限決定大小」，見上面
       sizeGridItemImage() 註解的完整說明）；JS 算出來的寬高本來就已經是
       依面積換算過的正確值，這裡不需要、也不應該再額外收得更緊。 */
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
    object-fit:contain;
    display:block;
    transform: scale(1);
    /* transform 不再放進 CSS transition 清單：桌機滑鼠「引力放大」特效
       （見下面 JS 的 magnetFrame()）改成每一影格都用 requestAnimationFrame
       直接寫入 style.transform，靠 JS 自己的指數平滑（lerp）算出流暢的
       過渡手感——如果這裡同時還掛著 CSS transition，兩邊的平滑機制會
       疊加、互相打架，滑鼠移動時放大效果反而會變得遲鈍、黏滯，不夠
       跟手。opacity 的淡入轉場跟放大特效無關，維持不變。
       首頁縮圖「放大進場」動畫（prepareGridRevealState/playGridRevealAnimation）
       自己會在需要時用 inline style.transition 暫時覆寫，播完後清掉、
       交還這裡的預設值，不受影響。 */
    transition: opacity .3s ease;
    will-change: transform;
    -webkit-user-drag:none;
    -webkit-touch-callout:none;
    opacity:0; /* hidden (plain white) until fully loaded — no broken-image icon flash */
  }
  .grid-item img.loaded{
    opacity:1;
  }
  /* 原本「滑鼠移上單張照片，那張照片用 CSS :hover 觸發 scale(1.12)」的
     二元式放大規則，已經改成下面 JS 的 magnetFrame()：滑鼠像有引力一樣，
     不管游標落在網頁空間的哪裡，附近的每一張照片都會依照距離遠近連續、
     平滑地放大（越靠近放大越多、越遠越接近原始大小），可以同時有好幾張
     照片一起反應，不再是只有正在 hover 的那一張才會動。只在真正支援
     滑鼠 hover 的桌機環境啟用（見 JS 的 supportsHover 判斷），觸控裝置
     完全不受影響。 */
  .grid-item .idx{
    display:none; /* 首頁照片下方的小字編號（001/002...），依需求整個移除、不再顯示。
                     JS 端（positionGridIdxItem() / prepareGridRevealState() /
                     playGridRevealAnimation() 等）還是會照常計算、寫入這個元素
                     的 left/top/opacity，維持這些函式原本的邏輯不變，這裡單純
                     在畫面上不畫出來，不影響其他計算或動畫時序。 */
    /* 縮圖是用 object-fit:contain 置中顯示在正方形格子裡的（見上面
       .grid-item img { max-width:52%; max-height:52% }），照片的長寬比
       不同，實際渲染出來的照片本身在格子裡的寬度、高度、左邊緣、下邊緣
       都會跟著不同——格子本身的邊緣，不等於「照片實際」的邊緣。
       這裡的 left（水平：對齊照片實際的最左側）跟 top（垂直：貼在照片
       實際下緣往下一點點的位置）都不是寫死的，而是由 JS 的
       positionGridIdxItem()（每次照片載入完成 / 視窗尺寸改變時都會重算）
       依照片這一刻實際渲染出來的邊界即時算出、寫進 inline style。
       JS 還沒算出正確值之前，left/top 先給保守的預設值 0（格子左上角），
       避免完全沒有 fallback 位置。 */
    position:absolute;
    left:0;
    top:0;
    font-size:9px;
    letter-spacing:0.5px;
    color:#aaaaaa;
    text-align:left;
    white-space:nowrap;
    pointer-events:none; /* 純標示文字，不要擋到底下照片的 hover / 點擊 */
    /* 編號平常不需要任何 transform（left/top 已經是由 JS 對齊照片實際邊緣
       算出來的絕對位置，見下面 positionGridIdxItem()）。這裡故意不寫死
       transform / transition 的預設值：首頁縮圖「放大進場」動畫
       （prepareGridRevealState/playGridRevealAnimation）會在播放期間自己
       用 inline style 暫時加上位移＋淡入效果，播完後清乾淨、自然回到
       「沒有 transform」的狀態，效果跟 translateX(0) 完全一樣。滑鼠引力
       放大特效不再需要編號額外位移——positionGridIdxItem() 每一影格都會
       用照片這一刻實際（已放大）的邊界重新算一次 left/top，編號本來就會
       跟著照片放大即時同步移動，不需要再疊加一層 CSS transform。 */
  }

  /* 照片欄數：5 欄（桌機滿版）→ 3 欄 → 2 欄。header 現在固定用 Flexbox（見上），
     不會再跟著這兩個 breakpoint 切換排版模式，兩者互不影響。 */
  @media (max-width: 1100px){
    .grid{ grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 640px){
    .grid{ grid-template-columns: repeat(2, 1fr); }
    :root{ --header-h: 140px; --edge: 20px; }

    /* 手機版改成兩排：第一排是「Photobook by edenchen」與「Preview」左右
       對齊；Collab 那塊（header-right）獨立換到第二排、佔滿整行寬度，
       顏色改成 #999999 的灰色，跟標題文字做出區隔。
       flex-wrap:wrap 讓超出第一排空間的項目自動換到下一排；header-right
       設 flex-basis:100% 強制它自己單獨佔一整排（不會跟前兩個項目擠在
       同一排），DOM 順序本來就是 header-left → header-preview →
       header-right，所以自然而然會排成「第一排兩個、第二排一個」。
       「edenchenworks@gmail.com」中間沒有空白，瀏覽器預設只會在空白處換行，
       遇到這種一整串不可斷開的文字，就算容器縮小了，文字本身還是會把容器
       撐開、超出螢幕——加上 overflow-wrap / word-break，允許瀏覽器在真的
       塞不下時於文字中間斷行，確保不會溢出螢幕。 */
    .fixed-header{
      flex-wrap: wrap;
      row-gap: 8px;
    }
    .fixed-header .header-left,
    .fixed-header .header-preview{
      flex-shrink:0;
    }
    .fixed-header .header-right{
      flex-basis:100%;
      flex-shrink:1;
      min-width:0;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    /* 手機版才把上面藏起來的 <br> 顯示出來，變成「Collab at」／
       「edenchenworks@gmail.com」／「@edench3n」三行；display 只要不是
       none，<br> 就會強制換行，不需要特別指定成哪個 display 值。 */
    .collab-line-break{ display:inline; }

    /* 手機版把 header-right 拆成三行後，「@edench3n」跟上一行
       「edenchenworks@gmail.com」之間的距離感覺比桌機版更明顯（手機字級
       縮小但 line-height 是等比例縮放，實際像素間距反而顯得鬆），這裡針對
       手機版把上面 .collab-line3 的負值 margin-top 加大，讓兩行更靠近。 */
    .collab-line3{
      margin-top:-1.1em;
      transform: translateY(-6px); /* 額外用 transform 位移，確保就算 inline-block
        的 margin 在某些瀏覽器排版下效果被行高吃掉，這個位移也一定會生效，
        不受行框（line box）高度影響。 */
    }

    /* 用連續、按比例縮放的字級（跟桌機那條 clamp 同樣做法），螢幕越窄字級
       跟著越小，多一層安全邊界，確保在最窄的手機上也能完整容納。
       這裡把最大值從 13px 再調小到 12px——原本 13px 時「edenchenworks@gmail.com」
       换行換到最後一個「m」單獨被擠到下一行，稍微縮小整體字級後，這一行就能
       完整塞下，不會再有孤字跑到下一行的狀況。改寫成覆蓋 --header-font-size
       這個變數，detail-info 會自動跟著一起變小，不用另外處理。 */
    :root{ --header-font-size: clamp(17.5px, 14px + 1.094vw, 21px); } /* 手機版標題文字再放大 1.75 倍：10→17.5、8→14、0.625→1.094、12→21，等比例縮放，clamp 的連續縮放邏輯不變 */

    /* 手機版時鐘改成「時間」單獨一塊、「年份＋月份日期」疊成兩行的原本設計
       （桌機版三塊同高度排開的新設計只適用於 >640px，見上面 syncClockAlignment()
       的分支說明）。年份跟月份日期共用同一個 left（--clock-monthday-left，
       JS 在手機分支會把兩者設成同一個值），這裡只需要把年份往上抬一行；
       抬的幅度用 em 為單位，字級縮放時會跟著等比例縮放。 */
    .page-clock-year{
      left: var(--clock-monthday-left, var(--edge));
      bottom: 1.25em;
    }

    /* 手機版首頁時鐘（年份+月份日期那組、時間那塊）整組再往螢幕下方移動
       一些：.page-clock-year 和 .page-clock-time 都是相對 .page-clock 這個
       容器算 bottom，容器本身桌機/手機共用同一個 bottom:36px；這裡針對手機
       版單獨覆寫成更小的值，兩塊文字就會一起往下移。 */
    .page-clock{
      bottom: 16px;
    }
  }

  /* 照片詳細頁時（body 帶 detail-active class）把時鐘藏起來，確保它「只
     出現在首頁」。這條規則不限定寬度，桌機／平板／手機都適用。
     注意：preview 頁開啟時「不」再把時鐘 display:none 藏起來——時鐘的
     z-index（900）比 preview-page（900）低，但 DOM 順序在它前面，疊圖時
     本來就會被 preview-page 蓋住，不需要額外用 display 隱藏。維持一直
     渲染在原地的好處是：桌機／平板關閉 preview 時整塊照片往上滑走，畫面
     下緣（時鐘所在的位置）本來就是最先被滑開、露出來的區域（見下面
     .preview-slide-exit 的說明）——時鐘既然本來就已經在那個位置畫好了，
     照片一滑開就會馬上被「揭開」看到，而不是等滑動動畫整個結束、
     finishClosePreviewPage() 才把它從 display:none 切回來、慢半拍才
     突然冒出來。 */
  body.detail-active .page-clock{ display:none; }

  /* ---------- HOVER PREVIEW ---------- */
  .hover-preview{
    position:fixed;
    z-index:60;
    width: 45vw;
    max-width: 650px;
    pointer-events:none;
    opacity:0;
    transition: none;
  }
  .hover-preview.show{
    opacity:1;
  }
  @media (max-width: 640px){
    /* 手機版首頁不需要 hover 大圖預覽功能，整個隱藏掉。JS 那邊
       supportsHover（(hover:hover) and (pointer:fine)）在真正的觸控手機上
       本來就會是 false、不會綁 mouseenter/mouseleave，但如果是用滑鼠把
       瀏覽器視窗縮到手機寬度測試（hover:hover 仍然成立），JS 判斷會誤判成
       「支援 hover」，這裡額外用 CSS 斷點把手機版寬度下的 hover-preview
       強制隱藏，雙重保險確保手機版版面下絕對不會出現這個功能。 */
    display:none !important;
  }
  .hover-preview img{
    width:100%;
    height:auto;
    display:block;
    box-shadow: 0 30px 60px rgba(0,0,0,0.18);
    background:#111;
    -webkit-user-drag:none;
    -webkit-touch-callout:none;
  }

  /* ---------- DETAIL PAGE ---------- */
  .detail-page{
    position:fixed;
    inset:0;
    z-index:50;
    background:#ffffff;
    opacity:0;
    pointer-events:none;
    /* 注意：這裡故意不對 opacity 加 transition。這片純白背景如果本身也用
       淡出/淡入動畫，在它還是半透明的那零點幾秒之間，底下的照片格子會透出來，
       使用者看到的就是「畫面下方閃過一下首頁縮圖」，而不是乾淨地淡入照片——
       這正是「前幾次點進去會閃過小圖」這個 bug 的成因。改成瞬間出現（不透明、
       完全蓋住底下的格子），真正的淡入效果交給下面 .detail-image-wrap 自己的
       0.25s opacity transition 負責（照片本身在純白背景之上淡入），這樣使用者
       看到的就是乾淨地淡入照片，不會有格子透出來的問題。 */
    touch-action: pinch-zoom; /* 擋掉單指上下滑動捲動，但保留雙指縮放的手勢 */
    overflow:hidden;
  }
  .detail-page.active{
    opacity:1;
    pointer-events:auto;
  }
  .detail-image-wrap{
    position:absolute;
    transition: opacity .25s ease;
    opacity:0;
  }
  .detail-image-wrap.show{ opacity:1; }
  .detail-image-wrap img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    -webkit-user-drag:none;
    -webkit-touch-callout:none;
  }

  .nav-arrow{
    position:fixed;
    top:50%;
    transform: translateY(-50%);
    background:none;
    border:none;
    color:#000;
    z-index:55;
    padding:20px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: opacity .2s ease;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .nav-arrow svg{
    width:22px;
    height:22px;
    display:block;
  }
  @media (min-width: 641px){
    /* 桌機／平板箭頭跟著上面 header 字級縮放（上一輪 30px 覺得太大，
       再乘 0.85 縮回約 25.5px），手機維持原本 22px 不變。left/right/top
       這些對齊用的座標都是獨立屬性，不受圖示大小影響，對齊規則維持原樣。 */
    .nav-arrow svg{
      width:25.5px;
      height:25.5px;
    }
  }
  .nav-left{ left: calc(var(--edge) - 20px); }
  .nav-right{ right: calc(var(--edge) - 20px); }
  .nav-left svg{ transform: scaleX(-1); }
  @media (hover: hover){
    /* 觸控裝置點擊常被瀏覽器模擬成短暫的 :hover，導致手機上點按鈕會看到
       變淡一下這個不想要的效果；限制在真正有滑鼠懸停能力的裝置才生效 */
    .nav-arrow:hover{ opacity:0.5; }
  }

  .nav-back{
    position:fixed;
    /* 手機版維持原本設計：貼著 header 文字正下方、畫面左側。桌機／平板
       版改成跟上排大標題同一條水平線、貼齊拉簾右側標題文字左邊緣，見下面
       min-width:641px 那條規則，這裡的數字只在手機版生效。 */
    top: calc(36px + var(--header-font-size) * 1.5 + 22px);
    left: calc(var(--edge) - 20px);
    transform:none;
  }
  .nav-back svg{ transform: rotate(-90deg); }
  @media (hover: hover){
    .nav-back:hover{ opacity:0.5; }
  }
  @media (min-width: 641px){
    /* 桌機／平板：改成跟上排大標題（header-left 那排字）同一條水平線，
       右側固定貼齊 var(--edge)——跟 detail-title（拉簾右邊「地名」那塊
       文字，例如 Akihabara, Tokyo）共用同一個右邊界，兩者對齊的是彼此的
       「最右側」，不是箭頭去貼標題文字的左邊緣（標題長度不同時，左邊緣
       本來就會跟著跑動，貼左邊緣反而會讓箭頭位置一直變動、對不齊）。
       垂直置中對齊 header 文字那一行的中心：36px（header 頂部留白）
       + 半行高，再用 translateY(-50%) 把按鈕自己的中心點對上去，純
       CSS 算好，不需要 JS 量測。 */
    .nav-back{
      top: calc(36px + (var(--header-font-size) * 1.5) / 2);
      left: auto;
      right: var(--edge);
      transform: translateY(-50%);
    }
  }

  @media (max-width: 640px){
    /* 手機版照片詳細頁：大圖／拉簾／說明文字都跟著 collab 消失空出來的
       空間往上收一點（見 JS DETAIL_MOBILE_LIFT 的說明），左右切換箭頭
       （nav-left/nav-right）原本單純用螢幕垂直居中（top:50%），這裡跟著
       往上偏移半個 DETAIL_MOBILE_LIFT（20px），大致對齊大圖新的垂直中心，
       不會變成大圖已經往上移了、箭頭卻還留在原本比較低的位置。 */
    .nav-left,
    .nav-right{
      top: calc(50% - 20px);
    }
  }

  /* ---------- DETAIL PAGE — 桌機／平板專用：右側拉簾 (filmstrip) ----------
     手機版完全不受影響：拉簾在 max-width:640px 直接 display:none，維持原本
     prev/next 箭頭切換的操作方式；desktop/tablet 則反過來把 prev/next 箭頭
     藏起來，改用拉簾操作（見下面 .nav-left/.nav-right 規則）。 */
  @media (min-width: 641px){
    .detail-page .nav-left,
    .detail-page .nav-right{ display:none; }
  }
  .detail-filmstrip{
    position:fixed;
    top:0; bottom:0;
    /* 原本 right:0，拉簾整組貼死在螢幕最右邊界，太靠邊。改成扣掉一般頁面
       邊界(--edge)，再扣掉右側預留給「編號／標題」兩塊文字的寬度
       (--fs-title-gap)——這樣拉簾本身會往畫面內側再退一截，右邊多出來的
       空間剛好用來放 .detail-title（見下面該規則），不是留白浪費掉。 */
    right: calc(var(--edge) + var(--fs-title-gap, 170px));
    width: var(--fs-zone-w, 320px);
    z-index:52;
    overflow:hidden;
    /* 修正首頁滑鼠移到第4欄照片（004、009、014...跟拉簾對齊的同一欄）時
       滾輪/hover大圖/點擊全部失效的 bug：這個容器不管有沒有在照片詳細頁
       裡使用，從頁面一載入就常駐在 DOM 裡（top:0; bottom:0，貫穿整個畫面
       高度），過去這裡直接寫 pointer-events:auto，就算它本身是完全透明、
       視覺上根本看不到（opacity:0、還沒有 .ready），還是會照樣攔截滑鼠事件
       ——首頁網格剛好有一整欄落在這個透明容器底下，滾輪/hover/點擊全部被
       它吃掉，才會出現「這一欄完全沒反應」的現象。改成預設 none，只有真的
       進入照片詳細頁、拉簾準備好顯示出來（.ready）時才需要讓它可以互動，
       這裡才打開 pointer-events。 */
    pointer-events:none;
    opacity:0;
    /* 拉簾容器進場時，除了淡入，額外從右側外面往內輕輕滑入一小段距離
       （拉簾＝可以拉出來的簾子，這個小滑動呼應「拉」這個動作本身）。
       時間長度／曲線刻意跟 runGridToDetailTransition() 那個縮圖飛到大圖
       欄位的分身動畫用同一組數字（460ms、cubic-bezier(0.22,1,0.36,1)，
       類似 ease-out-expo：一開始快、後段迅速收斂到定點）——這樣拉簾滑入、
       分身飛行、拉簾內部縮圖捲動就位（見下面 JS 的 fsPos 進場彈簧）三件
       事雖然各自是不同的 CSS/JS 機制，視覺上會被感知成同一個連續的到位
       動作，而不是三段各自獨立、時間點對不齊的動畫。 */
    transform: translateX(30px);
    transition: opacity .46s cubic-bezier(0.22,1,0.36,1), transform .46s cubic-bezier(0.22,1,0.36,1);
    touch-action:none; /* 拉簾自己的滾輪/拖曳手勢自己處理，不要交給瀏覽器預設捲動 */
  }
  .detail-filmstrip.ready{ opacity:1; transform:translateX(0); pointer-events:auto; }
  /* 退場（closeDetail()）時，拉簾內部縮圖本身已經在垂直方向用彈簧捲動出場
     （見 JS 的 fsClosing／FS_EXIT_OFFSET），如果容器同時又疊加 .ready 拿掉
     後的水平 translateX(30px) 滑出，兩個方向的位移合在一起，視覺上就會變成
     一段「往右下」的斜向移動，使用者會覺得「怎麼突然往右跳了一下」，跟
     「單純垂直往下捲出去」的預期不一致。這裡用比 .ready 更高的特異度
     （兩個 class）鎖死 transform 在 translateX(0)，退場時容器只剩淡出，
     水平方向完全不動，真正看到的位移只來自內部縮圖的垂直捲動。 */
  .detail-filmstrip.closing{ transform: translateX(0); }
  /* ---------- DETAIL PAGE — 手機版：拉簾搬到下方、變成橫式 ----------
     拉簾不再是桌機那種「螢幕右側直式」，改成貼在畫面最下緣、橫向左右
     堆疊縮圖，跟上方置中顯示的大圖形成「上圖下拉簾」的版面。沿用完全
     同一套彈簧/堆疊動態（fsPos/fsTarget/fsScaleAt 等），JS 只是依
     isDetailMobile() 把「堆疊軸」從垂直換成水平（見 layoutFilmstripZone()
     / applyFilmstripTransform() 的分流），這裡的 CSS 只需要把容器本身的
     位置、寬高、進場方向從「右側直式」改成「下方橫式」。 */
  @media (max-width:640px){
    .detail-filmstrip{
      top:auto;
      /* 原本 bottom:0 死貼在畫面最下緣，改用 JS 算好的 --fs-zone-bottom-gap
         （見 layoutFilmstripZoneMobile 的說明）把整條拉簾往上抬一點，
         不要緊貼著螢幕邊界／安全區域。 */
      bottom: var(--fs-zone-bottom-gap, 18px);
      left:0;
      right:0;
      width:100%;
      height: var(--fs-zone-h, 130px);
      /* 進場從畫面下方往上滑入，呼應拉簾實際貼著的邊緣（對應桌機版從
         右側橫向滑入的邏輯，兩者都是朝拉簾所在的那一側滑入）。 */
      transform: translateY(30px);
    }
    .detail-filmstrip.ready{ transform: translateY(0); }
    /* 退場理由跟桌機版 .closing 規則完全一樣（見上方原本的說明）：內部
       縮圖已經自己用彈簧橫向捲出畫面，容器這裡只負責淡出，鎖住位移不要
       疊加造成斜向移動的錯覺。 */
    .detail-filmstrip.closing{ transform: translateY(0); }

    /* 拉簾已經接手照片切換的操作，跟桌機版一樣把原本的左右箭頭藏起來，
       改成滑動/點擊拉簾操作，介面更乾淨、也不會兩套操作方式並存造成混淆。 */
    .detail-page .nav-left,
    .detail-page .nav-right{ display:none; }
  }
  .filmstrip-track{
    position:absolute;
    inset:0;
  }
  .filmstrip-item{
    position:absolute;
    left:50%; top:50%;
    /* 寬高不寫死固定值／固定 3:2 比例，改由 JS（fsFitSize，套用在
       applyFilmstripTransform 裡）依每張照片真正的寬高比，用「等面積」
       算法反推出寬高：width=√(面積×r)、height=√(面積÷r)，r 是照片本身
       的寬高比。這樣算出來的容器長寬比永遠精準等於照片本身的長寬比
       （width/height 剛好等於 r），不管照片是直是橫，佔的面積都差不多，
       同時完整保留照片原始長寬比，不會裁切；容器都靠 left:50%/top:50% +
       translate(-50%,-50%) 置中，不管照片形狀怎麼變，中心點永遠對齊在
       同一個位置，不會因為長寬不同而偏移。 */
    overflow:hidden;
    cursor:pointer;
    background:#ffffff; /* 圖片載入完成前的短暫留白色，也是萬一 overscan
      仍有極端情況沒蓋滿邊界時的最後一層保險；真正解決黑線／白線的修法
      在下面 .filmstrip-item img 的 inset:-1px overscan，這裡的背景色
      本身不再是主要防線。 */
  }
  .filmstrip-item img{
    position:absolute;
    /* 原本 width:100%; height:100%（跟容器邊界完全貼齊）。問題根源在於
       容器的 width/height 是 JS 算出的浮點數（toFixed(2)px）又疊在
       scale() transform 上，瀏覽器合成時對次像素做四捨五入，容器實際
       畫出來的邊界跟圖片用 100% 算出來的邊界不一定剛好重合，兩者其中
       一邊沒對齊就會露出縫隙——縫隙後面是什麼色，就變成什麼顏色的細線
       （原本背景是深色 #111 就看到黑線，改成白色背景後換成白線，本質上
       同一個問題只是換了顏色）。
       改成讓圖片往容器四邊各多蓋出 1px（inset:-1px + width/height各多
       2px），container 本身 overflow:hidden 會把多出來的這 1px 裁掉、
       視覺上完全看不出來，但無論次像素怎麼四捨五入，圖片的四個邊界永遠
       確保完整蓋過容器邊界，不會再露出容器底色，也就不會再出現任何顏色
       的細線——這個修法不靠「背景色跟畫面融合」去掩蓋，而是讓縫隙這件事
       本身不會發生。 */
    inset:-1px;
    width:calc(100% + 2px);
    height:calc(100% + 2px);
    /* 容器的長寬比已經在 JS 那邊精準算成跟照片本身一致（見上面
       .filmstrip-item 的說明），這裡改用 object-fit:contain 當保險：
       就算真的遇到极端長寬比被 fsFitSize() 的安全上限等比例縮小、或是
       極少數瀏覽器對小數位的四捨五入造成一兩個像素的落差，contain 也
       保證絕對不會裁掉照片的任何一邊，跟 cover 在容器比例精準吻合時
       效果相同、但多一層「絕不裁切」的保障。（多出來的 1px overscan
       套用在 contain 上，等同整張圖含空白一起放大一點點，實際照片內容
       本身不會被多裁到任何一邊。） */
    object-fit:contain;
    display:block;
    -webkit-user-drag:none;
    -webkit-touch-callout:none;
    pointer-events:none;
  }

  /* 從網格首頁飛到照片頁左側大圖欄位的過場用「分身」圖片：獨立於
     .detail-page 之外（直接掛在 body 下），用 transform 做位移＋縮放（GPU
     合成、不觸發 layout reflow，動畫比改 left/top/width/height 更流暢），
     transform-origin 固定在左上角，這樣 translate 的座標跟 scale 的效果
     才會疊加得剛好對齊目標矩形，不會偏移。 */
  .detail-flip-clone{
    position:fixed;
    top:0; left:0;
    transform-origin: 0 0;
    z-index:1500;
    display:block;
    object-fit:cover;
    pointer-events:none;
    -webkit-user-drag:none;
    will-change: transform;
  }

  /* 進入照片詳細頁時，Collab 那塊（header-right）淡出消失——手機版現在
     也套用跟桌機／平板完全一樣的規則（不再只限桌機／平板生效），單純在
     照片頁時 collab 整塊消失，從照片頁按 Preview 開啟預覽時 collab 才會
     出現，規則完全比照電腦版。
     沿用 .header-right 本來就有的 `transition: opacity .2s ease`，這裡只是
     覆寫目標值，動畫本身不用再重寫一次。
     注意：加上 :not(.preview-active)。openPreviewPage() 刻意不會清掉
     detail-active（見該函式內的說明，這樣關閉 preview 才能原封不動回到
     剛剛那張照片），但 fixed-header 的 z-index（1000）比 preview-page
     （900）高，會整排疊在 preview 上面一起顯示——如果只認 detail-active，
     從照片詳細頁按 Preview 開啟預覽時，collab 那塊會因為 detail-active
     還在而被硬藏起來，變成「從照片頁進 preview 看不到 collab、從首頁進
     preview 才看得到」這種不一致的狀況。preview-active 一開，代表畫面上
     蓋著的已經是 preview 頁本身（不是詳細頁），這裡用 :not(.preview-active)
     排除掉這個情況，collab 就會跟首頁進 preview 時一樣正常顯示；等使用者
     關閉 preview、preview-active 被拿掉，若還留在詳細頁上，才會繼續照原本
     設計把 collab 藏起來。
     注意：以下兩條規則不再包在 @media (min-width:641px) 裡——手機版現在
     跟桌機／平板共用同一套 collab 顯示/隱藏規則，行為完全一致（單純在
     照片頁 collab 消失，照片頁按 Preview 才會出現）。 */
  body.detail-active:not(.preview-active) .fixed-header .header-right{
    opacity:0 !important;
    pointer-events:none !important;
  }

  /* 在照片詳細頁按 Preview、又按退出回到照片頁時，collab 原本的行為是：
     preview 整塊轉場（所有裝置寬度統一都是「整塊往上滑走 / 從正上方蓋
     下來」，見下面「桌機／平板：preview」區塊——手機版現在也共用同一套）
     期間 preview-active 這個 class 全程都還在（見 closePreviewPage()／
     finishClosePreviewPage() 的說明——這是刻意設計，header 的黑／白文字
     顏色要等轉場真的結束才切換），所以上面那條 :not(.preview-active)
     規則要等轉場完全結束、preview-active 被拿掉的那一刻才會生效，collab
     才開始用預設的 0.2s 獨立淡出。結果是：照片轉場已經播完、露出照片頁
     本身，過了一小段時間 collab 才「突然」自己淡出，跟照片的轉場是兩段
     分開、對不上時間點的動畫，看起來像多閃一下。
     這裡新增一個由 JS 在轉場「一開始」就加上的 class（見 closePreviewPage()
     內 collab-slide-exit 的說明），讓 collab 在轉場開始的同一刻就開始
     淡出，且淡出時長／曲線直接沿用跟照片轉場一樣的 --preview-slide-duration
     / --preview-slide-ease（不分裝置寬度，全部共用同一組數字），兩者會在
     同一瞬間完成——視覺上就像 collab 是被照片轉場一起「帶走」的，而不是
     轉場完之後才輪到它自己單獨淡出。 */
  body.detail-active.collab-slide-exit .fixed-header .header-right{
    opacity:0 !important;
    transition: opacity var(--preview-slide-duration) var(--preview-slide-ease) !important;
  }

  .detail-info{
    position:fixed;
    left: var(--detail-info-left, var(--edge));
    top: var(--detail-info-top, auto);
    /* 注意：這裡故意不設 bottom。如果同時設 top（JS 算好的 px 值）又設
       bottom，在沒有指定 height 的 position:fixed 元素上，瀏覽器不會把
       bottom「忽略」掉，而是會把方塊撐高到 top～bottom 之間的整段距離——
       這樣一來，下面 JS 用 getBoundingClientRect().height 量到的就不是
       文字實際內容的高度，而是「上一次撐出來的高度」，導致每次重新定位
       都拿不準的高度去算下一個不準的 top，多次觸發（切換照片、縮放、
       字型載入完成…）後誤差會慢慢疊加，這正是「文字偶爾往上飄到照片上」
       這個 bug 的成因。拿掉 bottom 後，高度永遠由內容自然決定，量測才會
       準；JS 一定會在畫面顯示前就把 --detail-info-top 算好，所以拿掉
       bottom 不會有「JS 還沒算完先閃一下」的問題。 */
    z-index:55;
    text-align:left;
    /* 字級、行距直接沿用 header 那排標題用的同一個變數/比例，兩邊永遠一致，
       header 變小（例如手機版）這裡就跟著一起變小，不用兩處分別調整 */
    font-size: var(--header-font-size);
    line-height:1.5;
    /* 手機版 header 是橫向一排、用 space-between 排版，"collab" 常常被推到很
       靠右的地方，如果 detail-info 從那個 x 座標開始還維持不換行的單行文字，
       絕大部分內容會直接超出螢幕右側被裁掉、整段看起來就像「不見了」。
       這裡限制寬度為「從目前這個 left 位置到螢幕右側邊界（扣掉 edge）」剩下的
       空間，超過就自動換行，確保不管 left 落在螢幕哪個位置，文字都完整留在
       可視範圍內，同時仍然維持「對齊 collab 左側」這個位置關係。 */
    max-width: calc(100vw - var(--detail-info-left, var(--edge)) - var(--edge));
    overflow-wrap: break-word;
  }
  .detail-info .detail-number{ color:#000; }
  .detail-info .detail-title{ color:#000; }

  /* 桌機／平板：編號(010)、標題(Golf..)拆成拉簾兩側各自獨立的一塊文字，
     不再疊在一起放左下角。兩塊都用 position:fixed 各自定位，直接跳脫
     .detail-info 這個父層原本的 flow 排版（父層在桌機版因此變成沒有可見
     內容的空殼，不影響畫面）。
     垂直方向統一用 top:50% + translateY(-50%)：拉簾本身是 top:0;bottom:0
     滿版高度的容器，「目前作用中」的縮圖（d=0）套用的位移 fsOffsetAt(0)=0，
     永遠精準落在螢幕垂直正中央——這裡用同一個 50% 對齊，文字就會跟那張
     縮圖的中心線對齊，不需要額外量測拉簾目前捲到哪。
     手機版完全不受影響：這條規則包在 min-width:641px 裡，手機維持原本
     .detail-info 疊在一起、貼左下角、對齊 header-right 那套設計。 */
  @media (min-width: 641px){
    .detail-number,
    .detail-title{
      position:fixed;
      top:50%;
      transform:translateY(-50%);
      z-index:55;
      font-size: var(--header-font-size);
      line-height:1.5;
      white-space:nowrap;
    }
    .detail-number{
      /* 貼在拉簾左邊緣往左 32px，跟拉簾維持一段固定間距 */
      right: calc(var(--edge) + var(--fs-title-gap, 170px) + var(--fs-zone-w, 320px) + 32px);
      text-align:right;
    }
    .detail-title{
      /* 貼齊螢幕右邊界（跟頁面其他區塊共用同一個 --edge 留白），寬度限制在
         拉簾右側預留的那塊區域內（--fs-title-gap），標題太長時自動換行，
         不會蓋到拉簾本身。
         這裡故意把 max-width 同時設成 width（固定寬度，不再是原本
         shrink-to-fit 的「自動收縮成目前這行文字需要的寬度」）：如果寬度
         還是自動收縮，不同標題長短不同，方塊實際佔用的寬度就會不一樣，
         配合 text-align:left 的話，每張照片的標題第一行起始的那個左邊界
         x 座標就會跟著內容長短一起跳來跳去，不同照片之間對不齊。改成
         固定 width 之後，方塊寬度永遠等於這塊預留區域的滿寬，左邊界
         （= right 錨點往左量整個固定寬度）因此是一個固定不變的 x 座標，
         不管標題多長、換成幾行，最上面那一行永遠從同一個位置開始，
         跟其他照片、以及對面 .detail-number 那塊維持同一套「左邊界固定」
         的視覺邏輯，不會因為換了一張標題比較短/比較長的照片就跟著偏移。

         垂直位置：上面共用規則給的是 top:50% + translateY(-50%)，這是
         「把整個方塊的正中心」對齊在螢幕垂直 50% 這條線——.detail-number
         永遠只有一行，方塊高度固定，這樣做等於這一行文字剛好卡在 50%
         正中央，沒問題。但 .detail-title 換成多行後，方塊高度變成
         「行數 × 單行高度」，如果還是整塊置中，方塊會往上下兩側一起
         長高，多一行、最上面那一行就會跟著往上多推一點——標題只有一行
         時「第一行」（也是唯一一行）卡在 50% 正中央，跟編號同高；標題
         變兩行、三行時，「第一行」就不再是同一個高度，會比編號那行還要
         高，兩塊文字對不齊。
         這裡改成只用「單行高度的一半」往上位移（而不是整個方塊高度的
         一半），單行高度＝字級 × line-height（1.5）。這個位移量只取決於
         字級，不受行數影響，所以不管標題後來換行變成幾行，永遠只有
         「第一行」卡在原本 50% 那個高度上，之後多出來的行只會往下長，
         第一行的高度因此永遠跟 .detail-number 那一行對齊，不會因為行數
         增加而一起被往上推。 */
      right: var(--edge);
      transform: translateY(calc(var(--header-font-size) * -0.75));
      text-align:left;
      width: calc(var(--fs-title-gap, 170px) - 16px);
      max-width: calc(var(--fs-title-gap, 170px) - 16px);
      white-space: normal;
      overflow-wrap: break-word;
    }
  }

  /* "preview" 標籤現在是 .fixed-header 裡的一般欄位（跟 header-left / header-right
     用同一套 grid/flex 排版），樣式定義已合併到上面的 .fixed-header 規則，
     不再需要獨立的 position:fixed + JS 算像素位置 + opacity 淡入技巧 —— 這樣它
     一定跟另外兩塊文字同時、立刻出現，畫面變窄時也會跟著同一套 grid/flex 換行，
     不會被推出螢幕外。 */

  /* 照片詳細頁「040 / hcmc」那排編號＋標題文字，手機版整體縮小字級——原本
     直接沿用跟 header 標題同一顆 --header-font-size 變數（17.5~21px），在
     小小一塊「編號+地名」上顯得偏大，這裡另外疊一層縮放係數單獨調整，
     不影響 header 本身或桌機版（桌機版 detail-number/detail-title 是
     min-width:641px 底下的獨立規則，同樣讀 --header-font-size，不受這裡
     的縮放影響）。
     注意：這條規則故意寫在「上面 .detail-info 基礎規則（font-size:
     var(--header-font-size)）」之後——兩者選擇器特異度完全相同，CSS
     cascade 在特異度相同時由「誰在原始碼裡排在後面」決定最終生效的是
     哪一條，如果寫在基礎規則前面（例如塞進本檔案更早的手機版 media
     query 區塊），反而會被後面那條基礎規則蓋掉、縮小完全不生效。 */
  @media (max-width: 640px){
    .detail-info{
      font-size: calc(var(--header-font-size) * 0.62);
    }
  }

  /* ---------- PREVIEW PAGE（左右交錯全版跳轉） ---------- */
  .preview-page{
    position:fixed;
    inset:0;
    z-index:900;
    overflow:hidden; /* 配合下面 .preview-col 故意做出的重疊，超出邊界的部分直接裁掉 */
    display:flex; /* 一律保持 flex 版面，用 opacity+visibility 做淡入淡出，
                     不再用 display 直接切換（那樣完全沒有轉場、是瞬間跳出來） */
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    background:#fff; /* 桌機版左右兩欄各佔 50% 寬，理論上剛好拼滿，但螢幕寬度
                         不是整數、或瀏覽器算 50% 時的次像素捨入，偶爾會在正
                         中間留下不到 1px 的縫；這條縫原本會直接透出後面（半
                         透明疊在網格頁上）的內容，變成一條不固定顏色、看起來
                         像細黑線的縫。整個 preview-page 先鋪一層白色底色，
                         這條縫不管什麼時候出現，透出來的都是白色，不會再看到
                         奇怪的線。 */
    /* 進場：opacity 立刻開始淡入，visibility 也立刻變 visible（delay:0s），
       不然還沒淡入就先被 visibility 卡住看不到。
       退場交給 .active 被移除時，下面沒有 .active 的這條規則接手（見下）。 */
    transition: opacity .15s ease, visibility 0s linear 0s;
    touch-action:none; /* 這個頁面不能捲動/縮放 */
    /* 從頁面一載入就先把這個元素固定拉成獨立的 GPU 合成圖層（而不是等第一次
       opacity 動畫觸發時才臨時建立）。部分 WebKit/Safari 版本在「臨時」建立
       合成圖層的那一瞬間，圖層內容還沒真正畫上去之前會先合成出一格黑色畫面，
       這正是「圖片還沒出現前那條/那片黑」的另一個可能來源，跟前面 CSS
       background 完全無關（背景其實一直是白的），所以單純把背景設白沒辦法
       解決。圖層提早建立好、常駐著，就不會再有這個「臨時建立」的瞬間。 */
    transform: translateZ(0);
  }
  .preview-page.active{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
  }
  .preview-page.no-fade{
    /* 進站當下第一次自動打開 preview 頁專用：跳過 0.15s 的淡入動畫，
       直接瞬間變成完全不透明。原因是這段淡入期間 preview-page 本身
       （包含它的白色底色）也在跟著淡入，opacity 還沒到 1 之前，底下
       已經渲染好的首頁網格（001 002...等數字是不等圖片就會馬上出現的）
       會透過這段還沒淡完的透明度被看到，造成「preview 圖片還沒出來，
       首頁數字先跑出來」的畫面。只有這個進站瞬間需要瞬間切換，使用者
       之後手動點擊 preview 標籤 / 點擊畫面關閉，都還是走原本平滑的
       0.15s 淡入淡出，不受影響。 */
    transition:none !important;
  }
  .preview-page:not(.active){
    /* 退場：opacity 淡出的這 0.15s 期間，visibility 還要維持 visible，
       等淡出動畫真正跑完（transition-delay 跟 opacity 的時長對齊）才切成
       hidden，不然畫面會在還沒淡完就被 visibility 直接切掉、變成一半淡出
       一半瞬間消失的怪異效果 */
    transition: opacity .15s ease, visibility 0s linear .15s;
  }

  /* ---------- preview ↔ 首頁 之間「整塊滑動」的轉場（全裝置統一） ----------
     關閉（回首頁，整塊往上滑走）跟開啟（回 preview，整塊從正上方蓋下來）
     用同一套時間長度／速度曲線（見下面 --preview-slide-* 變數），只差在
     transform 的起訖值相反，讓兩個方向的動態手感完全對稱、一樣流暢。
     不分螢幕寬度，手機／平板／桌機全部套用同一套 class、同一組 CSS 變數
     （原本手機版另外走一套 opacity 淡入淡出，速度曲線、時長都跟桌機版
     不一樣；現在統一成跟桌機版完全相同的滑動蓋下來/滑走形式，物理感
     全裝置一致）。
     這裡刻意不去動 opacity/visibility（維持 .active 當下的 1 / visible 不變），
     單純用 transform 把整塊照片（桌機/平板是左右兩欄、手機是上下兩欄，
     不含上面 fixed-header——header 是獨立的 fixed 元素、z-index 更高，
     本來就不在這個容器內，位置完全不受影響）整塊位移，讓底下 #galleryPage
     的網格隨著位移「露」出來或被蓋住，是實體的滑動轉場，不是淡入淡出。
     easing 選用 easeInQuart 系的曲線（前段慢、後段明顯加速），符合「流暢
     但快速、由慢到快」的動態需求，也是 motion graphic 常見的 accelerate
     曲線；時長 .42s，按下去之後畫面反應迅速。
     時長／曲線抽成 CSS 變數，本來就定義在 :root（不分螢幕寬度），JS 的
     保底逾時計算會讀同一組數字，全裝置只需要改一個地方就能同步調整。
     transform 用 translate3d（而不是 translateY）延續上面 .preview-page
     本來就有的 translateZ(0) 獨立圖層技巧，滑動期間全程留在同一個 GPU
     合成圖層裡，不會在動畫開始/結束的瞬間重新合成圖層造成的那種閃爍。 */
  :root{
    --preview-slide-duration: .42s;
    --preview-slide-ease: cubic-bezier(.5, 0, .75, 0);
  }
  .preview-page.preview-slide-exit{
    transition: transform var(--preview-slide-duration) var(--preview-slide-ease);
    transform: translate3d(0, -100%, 0);
  }
  /* 開啟（點 Preview 標籤 / 從別處導回 preview）：先用 .preview-slide-start
     把整塊瞬間定位到畫面正上方（transform 沒有被 .preview-page 或
     .preview-page.active 的 transition 涵蓋到，所以這一步不會被誤動畫，
     是真正的瞬間跳位），下一影格再切換成這個 class，讓它用跟關閉時完全
     一樣的時間長度／速度曲線，從正上方往下蓋下來蓋滿整個畫面。 */
  .preview-page.preview-slide-cover{
    transition: transform var(--preview-slide-duration) var(--preview-slide-ease);
    transform: translate3d(0, 0, 0);
  }
  .preview-page.preview-slide-start{
    transform: translate3d(0, -100%, 0);
  }
  .preview-col{
    position:relative;
    /* 桌機/平板是左右兩欄各佔 50% 寬，理論上剛好拼滿，但螢幕寬度不是整數、
       或瀏覽器算 50% 時的次像素捨入，偶爾會在正中間留下不到 1px 的縫——
       這條縫不管 preview-page / preview-col 背景設多白都沒用，因為那其實
       不是「背景透出來」，而是兩個各自獨立的渲染圖層中間真的有一絲空隙，
       瀏覽器（尤其是手機 Safari）在那條空隙上有時會合成出一條看起來像
       黑色的細線。修法跟下面手機版「上下兩欄」用的是同一招：兩欄都故意
       「多蓋出」2px（遠大於任何次像素捨入誤差），右欄再往左拉 2px 貼上去，
       兩張圖片保證重疊 2px，那條縫就不可能再露出來；多出來的 2px 由上面
       .preview-page 的 overflow:hidden 裁掉，不影響版面寬度。 */
    width: calc(50% + 2px);
    height:100%;
    overflow:hidden;
    transform: translateZ(0); /* 跟 .preview-page 同樣的道理，提早固定成獨立圖層，避免臨時建立圖層那一瞬間的黑色閃爍 */
    background:#fff; /* 原本是 #000（黑幕）；圖片還沒載出來之前的空檔容易被
                         使用者感知成「當機」，改成跟全站底色一致的白色，
                         視覺上比較不突兀，也跟白色背景銜接得更自然。 */
    /* 進站初次載入的整體淡入用（見上面 body.initial-reveal-pending 那段
       說明）。裡面的 <img>（.preview-col img）本身維持 transition:none
       不變（那是給「同一張照片縮圖→高畫質切換」「撞牆跳下一張」用的，
       必須維持瞬間無縫切換，不能加淡入淡出，見該規則旁的完整說明）；
       這裡淡入的是外層容器整體，兩者是分開的兩層，互不影響。 */
    transition: opacity .3s ease;
  }
  .preview-right{
    margin-left: -2px; /* 往左貼上去跟左欄重疊 2px，後渲染的右欄會蓋掉重疊區域，縫隙不會露出來 */
  }
  .preview-col img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover; /* 剛好填滿區域、不留白，也不會過度放大 */
    display:block;
    background:#fff; /* 圖片本身也鋪一層白色：萬一這個 <img> 被瀏覽器獨立拉成一個
                         合成圖層（compositing layer），圖層剛建立、內容還沒真正
                         畫出來之前的那一瞬間，畫面來源就是這個底色，不會是黑的 */
    -webkit-user-drag:none;
    -webkit-touch-callout:none;
    /* 明確禁止任何轉場效果：暖場縮圖（thumbUrl）換成高畫質版本時，兩者都是
       直接指定 src、瞬間切換，本來就不會自動觸發淡入淡出——這裡還是明講
       transition:none，避免以後不小心加了其他共用規則（例如改成套用某個
       全站 img 的 transition class）意外讓這裡也淡入淡出，確保永遠是完全
       無縫的瞬間跳接。 */
    transition:none !important;
  }

  /* 手機：左右兩欄改成上下兩欄。只改排版方向跟每欄的寬高比例，跳轉的時機/節奏
     （JS 那邊完全沒動）跟每張照片的填滿方式（object-fit:cover）都維持不變。 */
  @media (max-width: 640px){
    /* 這條規則故意不寫成 .preview-page.active（只在開啟時生效），而是直接
       套用在 .preview-page 本身，不管有沒有 .active 都生效。顯示/隱藏本來
       就完全交給 opacity + visibility（以及現在全裝置共用的滑動 transform）
       控制，跟 flex-direction 無關，讓「上下兩欄」這個排版規則不受開關狀態
       影響、隨時保持正確，不會有版面規則被 .active 這個時機綁住、在轉場
       途中出現錯誤中間狀態的風險。 */
    .preview-page{
      flex-direction: column;
      overflow:hidden; /* 配合下面刻意重疊的 2px，多出來的部分直接裁掉，
                           不會往下多推出一截或跑出捲軸 */
    }
    /* 上下兩欄用 height:50% 各分一半時，手機瀏覽器（尤其動態網址列造成
       視窗高度不是整數，或算 50% 時本身就有次像素捨入）常常會在兩欄交界
       處留下不到 1px 的空隙，因為背景是白色、又剛好貼著白色的
       body/preview-page 底色，看起來就是一條很細的白線。
       修法：讓兩欄都刻意「多蓋出」2px（遠大於任何次像素捨入誤差），
       下面那欄再往上拉 2px，兩張照片一定會重疊個 1~2px，白線就不可能
       再露出來；多出來的 2px 由上面 .preview-page.active 的
       overflow:hidden 裁掉，不影響版面高度。 */
    .preview-col{
      width:100%;
      height: calc(50% + 2px);
    }
    .preview-right{
      margin-left: 0; /* 手機是上下欄，取消桌機版左右重疊用的 margin-left，改用下面的 margin-top 做上下重疊 */
      margin-top: -2px;
    }
  }

  /* ---------- 進站第一次載入：照片／header 文字／飄動的 e 同一刻一起出現 ----------
     問題成因：飄動的 e 從 init() 一開始（startDvdBounce()）就跑起來、
     預設就是完全不透明；header 那排文字／時鐘也在 openPreviewPage()
     一開始（照片都還沒真正抓回來、preview 兩張起始照片的 <img> 都還沒
     被賦值 src）就已經算完位置、加上 .positioned 顯示出來。preview 頁
     真正要顯示的兩張起始照片，反而是全部東西裡最後才準備好、最後才被
     賦值 src 的（要等 Google Drive 圖檔真的下載＋decode 完成，見
     startPreviewCycle() 內 Promise.all(...).then(...) 的說明）。結果
     使用者看到的順序是：飄動的 e／header 文字先跳出來、停在一片還是
     白底的 preview 頁上晃一下，過一會兒照片才「補」跳進來，觀感上不
     成熟、不流暢。
     修法：不去動前面那幾個各自獨立、原本運作良好的定位／顯示邏輯（例如
     header 文字自己的 .positioned opacity transition、飄動的 e 進出
     照片詳細頁用的 .dvd-hidden 機制），而是額外疊一層「進站初次載入
     專用」的整體遮罩：<body> 一開始就帶著 initial-reveal-pending 這個
     class（見 <body> 標籤），把這幾個首屏會看到的視覺元素整組強制隱藏
     （opacity:0 + transition:none，避免跟它們各自原有的 transition
     打架、產生奇怪的中間狀態）。等 JS 確認 preview 頁起始的兩張照片
     真的準備好、即將賦值顯示的那一刻（見 startPreviewCycle() 內
     revealInitialChrome() 的呼叫），才一次把這個 class 拿掉——那一刻
     它們各自原本就設定好的位置／內容都已經是正確的，只是差在「被這層
     遮罩晚一點放行」，拿掉的瞬間全部一起用同一段 .3s ease 淡入，跟
     照片同一刻出現，不會再有誰先誰後的落差。
     這個 class 只在網站第一次載入時使用一次（有安全逾時保底，見 JS
     revealInitialChrome() 呼叫處的說明，避免照片萬一抓取失敗導致畫面
     永遠卡在隱藏狀態），之後使用者手動切換 preview／首頁、或重新整理
     網址帶 #preview 進來，都不會再重新加上這個 class，不影響原本這些
     元素各自運作良好的顯示/隱藏機制。 */
  body.initial-reveal-pending .fixed-header,
  body.initial-reveal-pending .page-clock,
  body.initial-reveal-pending .dvd-bounce,
  body.initial-reveal-pending .preview-col{
    opacity:0 !important;
    transition:none !important;
  }

  /* ---------- 進站第一次載入：全白遮罩淡入畫面 ----------
     在上面 initial-reveal-pending 這層「個別元素各自 opacity:0」的機制
     之外，另外疊一層純白、蓋住全畫面的遮罩，z-index 比飄動的 e
     （99999，全站最高）還高，一開始完全不透明，把整個網頁（包含還沒
     排版好、還沒載完圖的瞬間）整片擋住。等 revealInitialChrome() 真正
     判斷所有東西都準備好、要放行的那一刻，才幫這個遮罩加上 .hide，
     用 .5s 淡出，讓使用者看到的是「從全白淡入到完整畫面」，而不是
     像原本那樣看著白畫面等、東西才一個個蹦出來。
     這層遮罩本身刻意跟 initial-reveal-pending 分開判斷、慢一點才拿掉：
     revealInitialChrome() 內會在真正放行前，額外多等一段緩衝時間（見
     JS INITIAL_REVEAL_EXTRA_BUFFER_MS 的說明），讓飄動的 e 撞牆用的
     圖片庫（quick-preload 那一批）有更多時間在背景載完、decode 完，
     避免使用者一進站馬上撞牆、圖片庫還沒準備好而「撞了但沒換圖」。
     pointer-events 淡出時一起關掉，避免這段期間內使用者點到還沒真正
     顯示出來的元素；display:none 則等淡出動畫真的播完才加上（用
     transitionend，找不到就用 timeout 保底），避免中途把 opacity
     transition 打斷。 */
  .initial-load-overlay{
    position:fixed;
    inset:0;
    background:#fff;
    z-index:2147483647;
    opacity:1;
    transition:opacity .5s ease;
    pointer-events:auto;
  }
  .initial-load-overlay.hide{
    opacity:0;
    pointer-events:none;
  }

  /* ---------- 貫穿全站、蓋在所有頁面之上的飄動英文字 ----------
     不再只在手機版 preview 頁面顯示、也不再區分手機/桌機兩種操作方式：
     用 position:fixed（相對視窗，不是相對捲動位置）+ transform 定位
     （JS 算好 x/y 直接寫 transform，不動 top/left，效能比較好）。這個
     元素是 <body> 的直接子節點，不屬於 galleryPage / previewPage /
     detailPage 任何一個頁面容器，所以切換頁面（顯示/隱藏、加減 class）
     完全不會影響到它、不會有任何跳動或重新定位。z-index 拉到最高，
     蓋過頁面裡所有文字、圖片。手機、桌機都用同一套 Pointer Events
     直接抓取拖曳，放開後依甩動速度飛出去，撞到視窗邊緣就反彈。 */
  .dvd-bounce{
    position:fixed;
    top:0; left:0;
    box-sizing:border-box;
    z-index:99999;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:0; /* 拿掉原本的按鍵熱區 padding，讓這個容器的邊界=圖片實際邊緣，撞牆判斷才會精準貼合圖形 */
    /* 原本這裡是 pointer-events:auto，讓整個元素隨時都能接收滑鼠/觸控事件
       才能被抓取拖曳——但代價是它飄到首頁縮圖上方時，會直接擋掉「底下」
       那張照片的 click / mouseenter / mouseleave / wheel 事件（瀏覽器一律
       只把事件送給當下最上層、pointer-events 不是 none 的元素），使用者
       看起來就是「有時候滾輪沒用、有時候點了照片沒反應、hover 大圖也沒
       跳出來」——症狀是隨機的，因為飄動字的位置本來就隨機、不固定停在哪；
       如果它剛好卡在同一欄兩張照片中間來回反彈（撞牆物理本身沒有問題，
       只是恰好卡住），那一整欄的照片在那段時間都會被蓋住，就是「一整
       直排都沒反應」的成因。
       改成 pointer-events:none：預設完全不參與 hit-test，滑鼠/觸控/滾輪
       事件會直接「穿透」它，落到底下真正看得到、可以互動的照片或頁面上，
       行為就跟這個元素單純只是視覺裝飾一樣。抓取／拖曳的手勢改成在
       window 層級用座標比對它目前的實際位置（見下面 JS `dvdGlobalPointerDown`
       的說明），不再依賴這裡的 pointer-events，兩者互不影響。 */
    pointer-events:none;
    touch-action:none; /* 讓拖曳完全交給 JS 的 Pointer Events 處理，瀏覽器不要自己介入 */
    -webkit-user-drag:none;
    -webkit-touch-callout:none;
    will-change: transform;
    cursor: grab;
    /* 進站初次載入的整體淡入用（見上面 body.initial-reveal-pending 那段
       說明）。跟下面 .dvd-bounce-img 那條「進出照片詳細頁」用的 transition
       是分開兩層：外層（這裡）只在初次進站、照片準備好那一刻用一次；
       之後進出詳細頁、抓放縮放等等，全部都是內層 .dvd-bounce-img 自己
       的 transition 在負責，彼此不會互相影響。 */
    transition: opacity .3s ease;
  }
  .dvd-bounce:active{ cursor: grabbing; }
  .dvd-bounce-img{
    display:block;
    /* 高度在原本區間的基礎上，再乘上 --dvd-area-scale 這個自訂屬性：JS 換上
       每一張圖片時（見 setDvdBounceImageSrc() 的完整說明），會依照這張圖
       去背後「實際有色面積」相對於整批照片平均值的比例，算出一個縮放
       倍率寫進這個屬性——面積小的照片（例如細長的樹枝）倍率大於 1，會
       顯示得比原本大；面積大、佔滿整個畫面的照片倍率小於 1，會顯示得比
       原本小，讓使用者撞牆看到的每一張照片，肉眼看到的實際圖案大小趨近
       一致，不會因為照片本身疏密不同而忽大忽小。沒有算過（例如還沒換上
       圖片庫的圖、或那張圖裁切失敗沒有 coverage 資料）就用預設值 1，
       維持原本固定高度的行為不變。width:auto 會自動跟著等比例縮放，不用
       另外處理。 */
    height: calc(clamp(107.54px, 25.81vw, 315.45px) * var(--dvd-area-scale, 1));
    width:auto;
    -webkit-user-drag:none;
    -webkit-touch-callout:none;
    pointer-events:none; /* 拖曳事件交給外層 .dvd-bounce 處理，圖片本身不用再接收事件 */
    /* 抓／放的縮放效果獨立套在「內層圖片」上，不動到外層 .dvd-bounce 的
       transform：外層的 transform 是每一影格由 RAF／pointermove 持續改寫
       的 translate(x,y)，如果把 transition 加在同一個 transform 上，
       每次改位置都會被瀏覽器當成新的過渡目標，位置會變得延遲、黏滯、
       追不上手指/滑鼠。改成縮放只作用在這顆內層圖片的 scale 上，
       跟外層的位置 transform 完全分開兩條軌道，互不干擾：位置依然是
       逐幀精準同步，縮放則是平滑的 transition。
       這裡也順便加上 opacity 的 transition（跟 transform 同一段時間曲線），
       給下面「進入照片詳細頁」用的淡出/淡入效果共用同一顆元素、同一條
       過渡規則，不用另外拆一顆變數。
       另外加上 height 的 transition：撞牆換下一張圖時（見 cycleDvdEImage()／
       setDvdBounceImageSrc()），--dvd-area-scale 會跟著新圖重新算過一次
       （見上面 computeDvdAreaScales() 的完整說明），兩張圖的縮放倍率通常
       不會完全一樣。原本沒有這條 transition，height 是直接瞬間跳到新的
       數值——就算上面已經把倍率之間的落差收斂得更接近了，「換圖的同時
       尺寸也瞬間跳一下」還是會有一點點「喀」一聲切換的生硬感。加上這條
       之後，換圖那一刻大小是平滑地滑到新的高度，跟拿到新圖案這件事融合
       成同一個柔和的過渡，不會有生硬的瞬間跳動。用比較短、不帶回彈的
       ease-out 曲線（跟下面 transform 的回彈曲線刻意分開）：高度變化是
       「換上新內容」的一部分，該是穩重地過渡過去，不需要 transform 那種
       抓放互動要的Q彈回饋感。進站首次顯示、抓放縮放、隱藏／恢復等場景
       原本就各自有 transition:none !important 蓋掉整段過渡（見下面
       .dvd-instant／body.initial-reveal-pending／.dvd-reveal 三處），
       這條新的 height transition 一併被蓋掉，不會在那些情境下多跑一段
       不該有的動畫。 */
    transform-origin: center center;
    transition: transform .22s cubic-bezier(.34,1.56,.64,1), opacity .22s ease, height .32s cubic-bezier(.22,.61,.36,1);
  }
  /* 抓住飄動字的當下（見 JS dvdPointerDown 加上的 .dvd-grabbing class）
     稍微縮小；放開的瞬間（dvdPointerUp 移除這個 class）transition 會用
     同一段時間曲線平滑放大回原本大小，抓與放的動作因此是對稱、一樣
     流暢的兩段動畫，不是「秒縮小、慢慢變大」這種不對稱的手感。
     縮小幅度改成非常小（0.97，只縮小 3%）：原本 0.82 縮小了 18%，
     肉眼看起來像「一抓就明顯變小」，使用者要的是幾乎感覺不出來、只是
     給一點點「有確實抓到」的回饋感。滑鼠、觸控共用同一個 .dvd-grabbing
     class（見 JS dvdPointerDown 的說明），這裡改了兩種輸入方式都會套用
     一樣非常小的縮小幅度。 */
  .dvd-bounce.dvd-grabbing .dvd-bounce-img{
    transform: scale(0.97);
  }
  /* 進到照片詳細頁（見 JS openDetail() 加上這個 class）：飄動的 e 整個
     縮小到看不見＋淡出，不再出現在照片頁面上；離開詳細頁、回到首頁或
     preview 頁（見 finishCloseDetail() / openPreviewPage() / closePreviewPage()
     移除這個 class）時，因為沒有更精確、優先權更高的規則覆寫，會直接
     落回上面 .dvd-bounce-img 預設的那條 transition（.22s、帶一點回彈的
     cubic-bezier），用同一種「快速放大彈出」的手感重新出現，跟抓／放
     縮放的視覺語言保持一致。
     消失方向（加上這個 class 的瞬間）改用專屬、稍微長一點、沒有回彈的
     曲線：縮小消失是「收起來」的動作，改用 linear（純物理等速）取代
     原本帶一點加速度感的 cubic-bezier，讓縮小的過程從頭到尾速度一致、
     單純、線性，不會有回彈或忽快忽慢的手感，跟放大出現想要的「快速
     彈出」是兩種不同的手感，各自套用最適合自己的曲線。
     另外，這個 class 加上的同一刻，JS（見 openDetail() / closePreviewPage()
     內的說明）也會同步暫停飄動字背後那套 requestAnimationFrame 物理
     飄動／撞牆迴圈，讓外層 .dvd-bounce 的 translate(x,y) 位置在整段縮小
     期間完全靜止不動——這裡的 scale/opacity transition 因此是「原地」
     單純縮小淡出，不會出現一邊縮小、一邊還在飄動位移的違和感。 */
  .dvd-bounce.dvd-hidden .dvd-bounce-img{
    transform: scale(0);
    opacity: 0;
    transition: transform .28s linear, opacity .22s ease;
  }
  /* 從照片物理堆疊模式點進單張照片、又按上一頁回到堆疊畫面時專用：見
     finishCloseDetail() 裡 cameFromPhotoFall 那個分支的完整說明。這種
     情況下飄動的 e 其實從頭到尾都還在堆疊畫面裡原地待著（只是暫時被
     detail-page 蓋住），拿掉 dvd-hidden 的那一刻不該再套用上面預設、
     帶回彈效果的放大＋淡入 transition（那是給「真的從無到有重新出現」
     準備的，這裡用會顯得莫名其妙多跳一下），改成瞬間切回原本大小／
     透明度。用 !important 蓋掉上面兩條規則（不管當下還留著 dvd-hidden
     還是已經拿掉），JS 只在拿掉 dvd-hidden 的同一刻短暫加上這個 class、
     下一影格就會拿掉，不影響其他情境原本的動畫手感。 */
  .dvd-bounce.dvd-instant .dvd-bounce-img{
    transition: none !important;
  }
  /* ---------- 飄動的 e：進站時「不要」有從小放大的彈入效果 ----------
     這裡原本刻意掛在 body.initial-reveal-pending 這個既有的機制上（只在
     進站首次載入時存在一次），讓遮罩期間內層圖片維持 scale(0)，等
     revealInitialChrome() 放行時再用一段帶回彈的曲線（.6s）從無到有放大
     彈出——這是刻意設計的進場效果，但使用者實際感受下來就是「一進站
     還是會看到飄動物件從小變大」，跟他要的「進站就直接是完整大小」不
     符，所以徹底拿掉這個縮放彈入效果，改成單純依賴外層 .dvd-bounce 原本
     就有的 opacity .3s ease 淡入（見上面 .dvd-bounce 的說明）：遮罩期間
     內層圖片維持「完整大小、只是被外層蓋住看不到」，放行的那一刻只有
     透明度從 0 淡入到 1，不再有任何 transform/scale 的變化，畫面上看到
     的就是「直接以完整大小淡入」，不會有從小長大的過程。
     dvd-reveal 這個 class 目前 JS（revealInitialChrome()）還是會照常加上、
     650ms 後拿掉，不需要另外改 JS——這裡只是把它對應的 CSS 規則清空，讓
     這個 class 存在與否不再造成任何視覺差異，比較保守、影響範圍最小。 */
  body.initial-reveal-pending .dvd-bounce-img{
    transition: none !important;
    transform: none !important; /* 加強保險：不只關掉 transition，連 transform 本身
      都直接鎖死成 none，不管是不是有其他規則（包含還沒被抓到的）想在這個階段
      對這顆圖片套用任何縮放，這裡都會被 !important 蓋掉，徹底排除「由小放大」
      在遮罩期間出現的任何可能性。 */
  }
  .dvd-bounce.dvd-reveal .dvd-bounce-img{
    transition: none !important;
    transform: none !important; /* 同上，dvd-reveal 這個狀態（首次放行那一刻的
      650ms 視窗期）也一併鎖死，理由同上一條規則。 */
  }
  /* ---------- 飄動物件：真正的照片庫圖片準備好之前，強制保持隱藏 ----------
     這個元素一進站就內建掛著這個 class（見 <body> 裡 <div class="dvd-bounce
     dvd-image-pending">），跟上面 body.initial-reveal-pending 那組「整體
     首屏淡入」是兩層互相獨立的隱藏開關：initial-reveal-pending 管的是
     「header／照片／飄動物件」這一整組東西該不該一起出現，跟圖片庫（來自
     EDEN_E_FOLDER_ID）有沒有抓回來完全無關；這裡額外多一層專屬於飄動物件
     本身的開關，只有在 JS 真的把圖片庫的第一張照片裁切好、指定成
     <img src> 之後（見 markDvdRealImageReady() 的完整說明），才會拿掉這個
     class、讓它第一次顯示出來。
     這樣不管 initial-reveal-pending 那一組是照 4 秒保底逾時放行、還是照片
     頁面提前準備好放行，只要圖片庫還沒抓回來，使用者就完全看不到這個元素
     （包含看不到內建那張黃色 e 的 base64 預設圖）——原本的行為是「兩組
     隱藏開關綁在一起、一放行就顯示當下的 <img src>」，如果那一刻圖片庫剛好
     還沒抓回來，顯示出來的就會是還沒被換掉的內建預設圖，這正是「有時候
     打開網站還是看到黃色 e」這個回報的成因。拆成兩層之後，內建那張預設圖
     從頭到尾都只當成「量測撞牆用矩形大小」的內部素材使用（見 JS
     trimTransparentImage(dvdBounceImgEl.src) 那段），視覺上保證不會再有
     機會被使用者看到。
     如果圖片庫抓取／裁切整個失敗（資料夾沒設定、離線等），JS 端故意
     "不" 放行這個 class，飄動物件會維持隱藏、不會退回顯示內建預設圖——
     這是使用者明確要求的行為：寧可這次不顯示飄動物件，也不要顯示錯的
     那張黃色 e 預設圖。 */
  .dvd-bounce.dvd-image-pending{
    opacity:0 !important;
    transition:none !important;
  }
  @media (max-width: 640px){
    /* 手機版在原本 1.8 倍的基礎上再放大 1.2 倍，這裡再整體放大 1.3 倍：桌機/平板維持原本大小不變，只調整這個 breakpoint 底下的高度區間
       ↓再整體縮小約 0.9 倍（使用者反應手機版飄動物件偏大，縮小一點點），區間三個數字等比例乘上 0.9
       ↓使用者反應手機版還是偏大一點，再整體縮小約 0.9 倍（區間三個數字在上一輪 0.9 倍的基礎上再乘 0.9，
       等於相對最早的基準縮小到約 0.81 倍），維持同一套等比例縮放的做法，不影響其他任何邏輯 */
    .dvd-bounce-img{
      /* 同上面基礎規則一樣乘上 --dvd-area-scale，手機版跟著桌機版一起再放大約 1.1 倍，維持原本手機相對桌機的放大比例 */
      height: calc(clamp(181.18px, 43.49vw, 531.45px) * var(--dvd-area-scale, 1));
    }
  }
  /* 平板縮小成桌機版的 0.85 倍。原本用「寬度介於 641~1100px 之間」來判斷
     平板，但這只適用於平板螢幕小到會切到 3 欄版面的情況；螢幕夠大（或
     橫放）的平板，寬度會超過 1100px、跟桌機一樣顯示 5 欄版面，寬度上完全
     看不出跟桌機的差別，這個縮小規則就套用不到——這正是「我的平板也是
     五欄位版本」這個回報的成因。
     改用 (hover: none) and (pointer: coarse) 判斷：這抓的是「主要輸入裝置
     是觸控、且沒有滑鼠懸停能力」這個特性本身，不管平板當下顯示 3 欄還是
     5 欄、螢幕多寬多窄都一樣抓得到；再加上 min-width:641px 排除掉手機
     （手機已經有自己上面那條規則），確保跟手機版互不衝突。桌機/筆電因為
     有滑鼠（hover:hover、pointer:fine）完全不會命中這個規則，維持原本大小
     不變。 */
  @media (hover: none) and (pointer: coarse) and (min-width: 641px){
    .dvd-bounce-img{
      /* 使用者反應平板版飄動物件偏小，整體再放大約 1.3 倍（只調整這個
         平板專屬 breakpoint 底下的高度區間三個數字，桌機/手機版的規則
         完全沒有動，彼此互不影響）。
         同上面基礎規則一樣乘上 --dvd-area-scale，平板版跟著桌機版一起再放大約 1.1 倍，維持原本平板相對桌機縮小 0.85 倍的比例 */
      height: calc(clamp(79.5px, 19.07vw, 233.17px) * var(--dvd-area-scale, 1));
    }
  }

  /* preview 頁開啟時：文字轉白色（配合上面 color 的 transition，會平滑
     淡過去，不是瞬間切換），並讓點擊直接穿透到底下的 preview-page（由它
     負責處理「點任何地方都跳回首頁」）。
     字重不再跟著切換成 260：字重改變會讓文字的實際渲染寬度跟著變，
     header-preview / header-right 這些用 JS 精準對齊照片邊緣的元素，一旦
     寬度變了就要重新算一次偏移量，而 --preview-nudge 這類變數故意沒有加
     transition（原因見上面該處註解），重新算完是瞬間套用新值，看起來就是
     文字「動了一下」。字重全站統一維持 350、不再有 preview 專屬的 260，
     這些元素在首頁／preview 之間切換就不會再有寬度變化，也就不需要重新
     對齊，位置全程完全不動，感覺上真的是同一個物件持續待在原地，只有
     顏色隨著轉場平滑改變。 */
  body.preview-active .fixed-header,
  body.preview-active .fixed-header *{
    pointer-events:none !important;
  }
  /* 文字轉白色改成獨立的 body.preview-header-white class，不再跟
     preview-active 綁在一起。原本兩者同時在按下 PREVIEW 那一瞬間加上，
     但桌機/平板「整塊照片從正上方蓋下來」的轉場，照片實際開始位移是在
     按下之後晚了兩個影格才觸發，而且滑動用的是前段慢、後段加速的速度
     曲線，開始移動後也還要一段時間才會真正經過 header 那一排——這整段
     時間差裡文字已經在首頁的白色背景上開始淡成白色、看起來像整排字先
     消失，過一小段時間畫面才真的被照片蓋過去，兩件事對不上時間。改成
     讓 JS 動態量測照片實際滑動到的位置，等它真正蓋過 header 那一整排
     時才加上這個 class（見 openPreviewPage() 內 checkCoverProgress 的
     完整說明），文字要淡白之前底下一定已經是蓋過來的照片，不會再出現
     「先消失在白底上」的畫面。手機版淡入跟「進站瞬間自動開啟」這兩種
     情境沒有這個時間差問題（兩者都是同一瞬間觸發、沒有額外延遲），維持
     原本立即加上。 */
  body.preview-header-white .fixed-header,
  body.preview-header-white .fixed-header *{
    color:#ffffff !important;
  }

  .hidden{ display:none !important; }

  /* ---------- 飄動字雙擊觸發的「照片物理掉落堆疊」模式 ----------
     整個舞台是一個 position:fixed、四邊貼齊視窗（inset:0）的容器，內部
     每一張掉落的照片都用 position:absolute + top:0/left:0 為基準、靠 JS
     每一影格寫入 transform:translate(x,y) rotate(deg) 來定位——inset:0
     的容器本身就是視窗座標系，容器內 absolute 元素的 top:0/left:0 因此
     跟「視窗像素座標」完全等價，跟物理引擎裡（Matter.js）body 的世界座標
     可以直接 1:1 對應，不需要再另外做座標轉換。平常（非這個模式）維持
     display:none，不佔用任何 layout / 合成成本。 */
  .photo-fall-stage{
    position:fixed;
    inset:0;
    z-index:950; /* 蓋在首頁格子（無明確 z-index，預設 0）跟時鐘（900）之上，但在 fixed-header（1000）之下，
                     不會擋住上排的標題／Preview／Collab 文字 */
    overflow:hidden;
    pointer-events:none; /* idle（display:none）狀態下容器本身不擋首頁任何事件；
                             真正進入 active 狀態時，下面 .active 規則會把 pointer-events
                             改回 auto——Matter.Mouse 是直接把原生 mousedown/mousemove/mouseup
                             監聽器掛在這個容器元素上（見 JS startPhotoFallEngine()），元素
                             若是 pointer-events:none，瀏覽器在 hit-test 時會整個跳過它、
                             事件直接穿透到底下的元素，連原生事件都收不到，並非「只擋 CSS
                             效果、不影響 JS 監聽器」；這正是原本「堆疊照片沒辦法用滑鼠移動」
                             的成因——Matter.Mouse 從頭到尾沒收到任何一次 mousedown。 */
    display:none;
    cursor:grab;
  }
  .photo-fall-stage.active{ display:block; pointer-events:auto; }
  .photo-fall-stage.grabbing{ cursor:grabbing; }

  /* ---------- 堆疊模式期間按下 Preview：整組堆疊（含飄動的 e）暫時蓋在 preview 之下 ----------
     見 JS openPreviewPage() 內對 photoFallModeActive 的特例判斷、
     resumeDvdFloatAfterPhotoFallCover()、以及 closePreviewPage() 內
     dropDvdBackIntoPhotoFall() 的完整說明。
     只要 preview 頁是「從堆疊模式底下打開」的，body 就會同時擁有
     photo-fall-active 跟 preview-active 這兩個 class（平常兩者互斥，只有
     這個特例情境才會同時出現）——這裡把 15 張堆疊照片所在的
     .photo-fall-stage 整段暫時降到 preview-page（z-index:900）之下，讓
     preview 蓋下來的照片能真正蓋住它們，而不是像原本那樣因為
     .photo-fall-stage 的 z-index(950) 比 preview-page(900) 還高，蓋下來的
     照片反而被堆疊照片擋在下面、看起來「堆疊頁面還留著」。 */
  body.photo-fall-active.preview-active .photo-fall-stage{
    z-index: 890;
  }
  /* ---------- 堆疊模式期間點照片進到照片詳細頁：整組堆疊要退到 detail-page 之下 ----------
     openDetailFromPhotoFallItem() 只暫停了 Matter 物理引擎（pfRunner），從沒
     把 .photo-fall-stage 本身藏起來或降到最上層之下——這個容器平常的
     z-index(950) 比 detail-page(50) 高出一大截，而且 .active 狀態下
     pointer-events 是 auto，兩件事疊在一起，變成使用者看到的畫面是：
       1) 15 張堆疊照片（連同飄動的 e，已經被凍結在雙擊那一刻的隨機位置，
          看起來像「全部疊/跌在一起」）依然蓋在 detail-page 的白底、大圖、
          上一頁箭頭（z-index:55）之上，完全沒有「消失」。
       2) 因為堆疊容器的 z-index 比那些按鈕還高，滑鼠/手指點擊全部先被
          它攔截，detail-page 上的按鈕因此看起來「都失效了」。
     跟上面 preview-active 那條規則完全同樣的手法：只要 body 同時帶有
     photo-fall-active 跟 detail-active（openDetailFromPhotoFallItem() 期間
     一定會這樣），就把整個堆疊舞台的 z-index 壓到 detail-page(50) 之下，
     並關掉 pointer-events，讓底下凍結的堆疊照片完全被 detail-page 的白底
     蓋住、也不再攔截任何點擊。等使用者按上一頁、closeDetail()/
     finishCloseDetail() 的 detailFromPhotoFall 分支把 body 上的
     detail-active 拿掉、同時恢復 pfRunner，這條規則自然失效，堆疊畫面
     瞬間跳回原本的 z-index(950)、pointer-events:auto，跟離開前一模一樣，
     可以繼續拖曳/單擊。 */
  body.photo-fall-active.detail-active .photo-fall-stage{
    z-index: 40;
    pointer-events: none;
  }
  /* 飄動的 e 平常是全站最高的 z-index(99999)，蓋下來的動畫播放期間額外加上
     pf-dvd-covering 這個 class（見 JS 說明），把它也一併壓到 preview 之下，
     跟其他堆疊照片一起「原地」被蓋住、等待；等 preview 的照片真的蓋滿整個
     畫面、動畫播完，JS 會拿掉這個 class 並讓 e 脫離物理世界恢復飄動狀態，
     z-index 立刻回到預設的 99999，跟一般 preview 頁的手感一樣重新浮到最
     上層。 */
  body.pf-dvd-covering .dvd-bounce{
    z-index: 890;
  }
  .photo-fall-item{
    position:absolute;
    top:0; left:0;
    overflow:visible;
    /* 原本這裡是 background:#f4f4f4，給「一般不透明相片」在真正載入完成前
       當一塊淺灰色的載入骨架用——相片本身是滿版矩形，載入完成後 <img>
       會完全蓋住這塊底色，使用者從頭到尾看不到它。改成掉落「漂浮物件
       圖片庫」的去背 PNG 之後，圖片本身四周、鏤空處都是透明的，這塊底色
       會直接從透明區域透出來，變成每個物件背後多一塊灰色矩形卡片——這正
       是「怎麼每個物件後面都有一塊灰底、彼此完全不能像去背圖那樣互相
       貼合」的成因。已經不需要靠這塊底色當載入骨架（見下面 img 內 opacity
       淡入、以及 .pf-pending 把整格連同底色一起隱藏的機制，兩者都不依賴
       這裡的顏色），直接拿掉即可：整個 .photo-fall-item 保持完全透明，
       只有 <img> 本身去背後「真正有顏色的那塊形狀」看得見，物件與物件
       之間、邊緣縫隙都能像圖片庫原本的去背圖一樣互相貼合、露出後面的
       白色頁面（或彼此疊在上面的其他物件），不會再卡著一塊多餘的灰色
       矩形。overflow 也從 hidden 改成 visible：hidden 對「填滿整個方塊」
       的相片沒有影響，但去背圖旋轉時，物件實際可見的形狀（例如伸長的
       觸角、藤蔓）常常會些微超出它自己這個依「面積」概算出來的矩形框，
       hidden 會把這些邊緣尖角切掉一角，改成 visible 才能完整顯示整個
       去背形狀，不會被自己的容器裁邊。 */
    will-change: transform;
  }
  .photo-fall-item img{
    width:100%;
    height:100%;
    /* 原本是 object-fit:cover：相片是滿版矩形，cover 保證填滿整個容器、
       裁掉多餘的邊。去背 PNG 改用 object-fit:contain——這格的寬高是依
       「面積＋長寬比」概算出來的，長寬比超出 PHOTO_FALL_ASPECT_MIN/MAX
       時會被夾住、跟圖片實際比例會有些微落差，用 cover 會把去背圖案邊緣
       (例如細長的腳、觸角) 裁掉一截；contain 保證整張去背圖完整顯示、
       絕不裁切，落差最多就是容器裡多一點透明留白，反正容器本身已經是
       透明的，這圈留白使用者完全看不出來。 */
    object-fit:contain;
    display:block;
    pointer-events:none;
    -webkit-user-drag:none;
    -webkit-touch-callout:none;
    /* 預設隱藏，等真正的像素（decode 完成）準備好才淡入——見 JS
       spawnFallingPhotos() 內的說明。這是最後一道保險：正常情況下這批
       照片早就被 warmFallBatch() 提前預熱過，這裡的淡入幾乎不會被使用者
       感知到（一格畫面之內就完成）；只有極端網路狀況、預熱還沒完成的
       少數情況，才會看到這段 .22s 的淡入——不管哪種情況，畫面上都不會
       再出現「半成品的淺灰／白色方塊愣在那裡」這種看起來像當機的畫面。 */
    opacity:0;
    transition: opacity .22s ease;
  }
  .photo-fall-item img.loaded{ opacity:1; }
  /* 還在等圖片真的下載＋decode 完成、還沒被允許掉落的照片（見 JS
     spawnFallingPhotos() 內 markLoadedAndDrop() 的說明）：整格隱藏，不只
     是裡面的 <img>。因為這格這時根本還沒有對應的物理 body、也不在
     pfItems 裡，不會有任何一影格幫它同步 transform 位置，若只藏 <img>
     不藏整個方塊，雖然現在 .photo-fall-item 本身已經沒有底色（見上面
     說明，已改成完全透明），但這格的邊框範圍仍然會卡在版面左上角
     （CSS 預設的 top:0/left:0）動也不動，一樣不該讓使用者看到——opacity:0
     完全隱藏，等真正建立物理 body、加進畫面同步的那一刻才拿掉這個
     class，使用者看到的就是這張圖「一準備好，馬上從畫面外開始掉落」，
     不會有任何中間卡住不動的空殼。 */
  .photo-fall-item.pf-pending{
    opacity: 0;
    pointer-events: none;
  }
  /* 首頁格子在這個模式期間本身還在 DOM 裡（只是被縮小＋淡出到看不見），
     加這條規則確保滑鼠事件不會被它攔截、穿透到底下真正該接收事件的東西。 */
  body.photo-fall-active #photoGrid{ pointer-events:none; }

  /* ---------- 堆疊頁面長按：擷取目前畫面當「桌布」的預覽彈窗 ----------
     長按本身完全不顯示任何提示（沒有進度條、沒有閃光），直到真的擷取
     完成才跳出這個預覽。改用 opacity/visibility 而不是 display:none 來
     控制顯示，是為了讓「跳出預覽」跟「按關閉退回堆疊頁面」這兩段過場
     都能有淡入/淡出動畫——display:none 沒辦法做 transition（要嘛整個
     消失、要嘛整個出現，中間沒有過渡狀態）。visibility:hidden 則能保證
     平常完全不佔用互動層（不會被點到、也不會攔截底下 Matter/pfPhotoTap
     那組 pointer 事件），跟原本 display:none 想要的效果一致，只差在多了
     淡入淡出這段動畫期間。 */
  .wallpaper-preview-overlay{
    position:fixed;
    inset:0;
    z-index:999999; /* 蓋過全站所有東西，包含飄動的 e (99999) 跟 fixed-header (1000) */
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:18px;
    background:rgba(255,255,255,0.96);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    padding:24px;
    box-sizing:border-box;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    /* 淡出：opacity 先過渡完，visibility 才切成 hidden（用 transition-delay
       卡在 opacity 動畫結束的那一刻），避免動畫途中就先被 visibility:hidden
       整個瞬間隱藏、看起來像沒有淡出效果。 */
    transition: opacity 180ms ease, visibility 0s linear 180ms;
  }
  .wallpaper-preview-overlay.active{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
    /* 淡入：visibility 立刻切成 visible（0s 延遲），opacity 才開始過渡，
       跟淡出剛好相反的順序。 */
    transition: opacity 180ms ease, visibility 0s linear 0s;
  }
  .wallpaper-preview-img{
    max-width:min(86vw, 480px);
    max-height:70vh;
    object-fit:contain;
    box-shadow:0 12px 40px rgba(0,0,0,0.18);
    border-radius:4px;
    background:#fff;
  }
  .wallpaper-preview-actions{
    display:flex;
    gap:14px;
    align-items:center;
  }
  .wallpaper-preview-btn{
    font-family:inherit;
    font-size:14px;
    letter-spacing:0.02em;
    padding:10px 22px;
    border-radius:999px;
    border:1px solid #111;
    background:#111;
    color:#fff;
    cursor:pointer;
    text-decoration:none;
    line-height:1.2;
  }
  .wallpaper-preview-btn.secondary{
    background:transparent;
    color:#111;
  }

  ::selection{ background:#000; color:#fff; }
</style>
</head>
<body class="preview-active initial-reveal-pending">

       .initial-load-overlay 那段。刻意放在 body 最前面、DOM 順序最上層，
       跟 z-index:2147483647 一起確保蓋住畫面上所有東西（包含飄動的

  <div class="initial-load-overlay" id="initialLoadOverlay" aria-hidden="true"></div>

  <div class="dvd-bounce dvd-image-pending" id="dvdBounce" draggable="false"><img class="dvd-bounce-img" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" alt="" draggable="false"></div>

  <header class="fixed-header">
    <div class="header-left" id="backHome">Photobook by edenchen</div>
    <div class="header-preview" id="previewLabel">Preview</div>
    <div class="header-right">Collab at<br class="collab-line-break"> edenchenworks@<wbr>gmail.com<br><span class="collab-line3">@edench3n</span></div>
    <!-- 專門給 JS 量測用的隱形分身：跟真正顯示的 header-right 共用同一份
         CSS class（字級、letter-spacing 都會自動套用同一顆變數），文字內容
         也完全一樣，但額外套用 .collab-measure 這個 class 讓它變成

  //
  // scheduleIdle() 在真的有這個 API 時，行為完全不變（原封不動轉呼叫
  // requestIdleCallback，各自的 timeout 數值也照樣傳進去，包含呼叫端
  // 依賴的 deadline 參數，例如 renderGrid() 的 processChunk()，一樣會

  // 「先等這一影格真的畫完（requestAnimationFrame），再排到下一輪巨集
  // 任務才執行」——雖然仍然沒辦法像原生 API 一樣精準量出「現在到底有
  // 多閒」，但至少能保證不會搶在畫面剛畫完的那一刻之前卡住主執行緒，
  // 是沒有這個瀏覽器功能之下能做到的最佳近似。各呼叫端原本個別調校過

  // fallbackDelay 傳進來，行為不變，只是多了「先等一幀畫完」這一層。
  function scheduleIdle(fn, opts){
    const hasTimeout = opts && typeof opts.timeout === 'number';
    const fallbackDelay = (opts && typeof opts.fallbackDelay === 'number') ? opts.fallbackDelay : 0;

      return hasTimeout ? requestIdleCallback(fn, { timeout: opts.timeout }) : requestIdleCallback(fn);

  function revealInitialChrome(){

    // 賦值完成——revealInitialChrome() 只會在 startPreviewCycle() 內、

  // 保底逾時：萬一 Google Drive 圖片清單完全抓取失敗、或兩組序列剛好都是

  // `if(!previewOddPhotos.length || !previewEvenPhotos.length) return;`），
  // startPreviewCycle() 根本不會被呼叫到，上面那個真正該觸發淡入的時機

  // 沒有任何東西可以互動。這裡設一個安全逾時，不管照片流程順不順利，最晚
  // 也一定會在這個時間點強制放行一次，不會讓整個網站卡死在一片空白。
  const INITIAL_REVEAL_FALLBACK_MS = 4000;

  // ---------- 進站第一次載入：讓「飄動物件」真的跟 preview 起始照片同一刻
  // 一起出現 ----------
  // 原本 revealInitialChrome() 只要 preview 起始兩張照片準備好就會馬上

  // 出現」的成因：不是沒放行，是兩邊各自獨立放行、時間點對不齊。
  // 修法：兩邊準備好時都只是先舉手（設下面這兩個旗標），真正呼叫
  // revealInitialChrome() 統一交給 attemptInitialReveal() 判斷——兩者都

  // （例如那個資料夾網路比較慢），額外多等 DVD_REVEAL_GRACE_MS 這麼一小段
  // 緩衝時間讓它趕上，緩衝時間到了還沒準備好，才不再等、先放行照片／

  let previewReadyForInitialReveal = false;
  let dvdReadyForInitialReveal = false;
  let initialRevealGraceTimer = null;

  // ---------- 全白遮罩加上之後，額外多拖一點載入時間 ----------
  // 成因：飄動的 e 一開站雖然已經有 dvdEImages[0]（見 markDvdRealImageReady()

  // DVD_E_IMAGE_NO_REPEAT_COUNT+4 張）是背景平行下載＋decode，不保證
  // dvdReadyForInitialReveal 剛設成 true 那一刻就已經全部到位；如果使用者
  // 剛進站、遮罩一放行就立刻撞到牆，cycleDvdEImage() 裡「候選數量不足

  // 完全沒反應、沒換圖——這正是使用者反應的「第一次撞擊不會切照片」。
  // 修法：preview 照片／飄動的 e 兩邊都舉手完成後，不要立刻放行，而是

  // 遮罩本身還在畫面上擋著，這段等待使用者感覺不到「卡住」，只會覺得

  const INITIAL_REVEAL_EXTRA_BUFFER_MS = 450;
  let initialRevealExtraBufferTimer = null;
  function attemptInitialReveal(){
    if(initialChromeRevealed) return;
    if(previewReadyForInitialReveal && dvdReadyForInitialReveal){
      clearTimeout(initialRevealGraceTimer);
      initialRevealGraceTimer = null;
      if(!initialRevealExtraBufferTimer){
        initialRevealExtraBufferTimer = setTimeout(() => {
          initialRevealExtraBufferTimer = null;
          revealInitialChrome();
        }, INITIAL_REVEAL_EXTRA_BUFFER_MS);
      }
      return;
    }
    if(previewReadyForInitialReveal && !initialRevealGraceTimer){
      initialRevealGraceTimer = setTimeout(() => {
        initialRevealGraceTimer = null;
        // 緩衝時間到了，飄動的 e 那邊還沒舉手，就不再等它——直接放行，
        // 不额外再疊加 INITIAL_REVEAL_EXTRA_BUFFER_MS，避免使用者對著
        // 全白遮罩等更久（這種情況本來就已經比一般情況慢了）。
        revealInitialChrome();
      }, DVD_REVEAL_GRACE_MS);
    }
  }

  // 照片編號：直接顯示實際數字，不補零（例如第 7 張顯示「7」，不是「007」）。
  function formatPhotoIndex(n){ return String(n); }

  // 左右箭頭原本用 top:50% + transform:translateY(-50%) 置中，
  // 這種「百分比 + transform」的組合在手機 Safari 雙指縮放時，
  // WebKit 不會即時重算百分比位置，導致縮放過程中箭頭跟著漂移。
  // 改成用 JS 算好的固定像素 top（跟不會漂移的返回鍵按鈕做法一致），
  // 縮放中就不會有東西需要重新計算，自然不會飄動。
  function positionNavArrows(){
    [prevBtn, nextBtn].forEach(btn => {
      const h = btn.getBoundingClientRect().height || 64;
      const top = Math.round((window.innerHeight - h) / 2);
      btn.style.top = top + 'px';
      btn.style.transform = 'none';
    });
  }

  // 返回鍵（左上角「上一頁」箭頭）
  // ---- 桌機／平板（>640px）----
  // 現在跟上排大標題同一條水平線、右側固定貼齊 var(--edge)（跟
  // detail-title 共用同一個右邊界）這件事純粹用 CSS 的 calc + 
  // translateY(-50%) 就能算好（見 .nav-back 在 min-width:641px 那條
  // 規則），不需要 JS 介入，這裡只要清掉手機版可能殘留的 inline style
  // 讓 CSS 生效即可。
  // ---- 手機（≤640px）----
  // 改成跟 detail-info（畫面左下角「003 / 標題」那排文字）同一個高度，
  // 垂直置中對齊那排文字的中心；水平方向則讓箭頭「圖示」本身（扣掉按鈕
  // 自己的 20px padding，理由跟 positionNavHorizontal() 裡的說明一樣，
  // 對齊的是圖示不是透明熱區）貼齊 header-preview（"Preview" 字樣）的
  // 最左側，不再跟 header-left（大標題）同一條基準線。

  // top）排在這個函式之前執行，讀到的一定是最新的位置，不用自己重算。
  function positionBackButton(){
    if(!backArrowBtn) return;

    if(window.innerWidth > 640){
      backArrowBtn.style.top = '';
      backArrowBtn.style.left = '';
      backArrowBtn.style.right = '';
      backArrowBtn.style.transform = '';
      return;
    }

    // 手機版箭頭現在跟「編號+標題」文字合併成同一排整體來定位（見
    // positionDetailInfoMobile 說明），這裡優先呼叫它；只有在大圖/拉簾
    // 這一刻還沒有實際尺寸、算不出正確位置時，才退回原本「貼在 Preview
    // 標籤左側」的舊邏輯當保底。
    if(positionDetailInfoMobile()) return;

    backArrowBtn.style.right = 'auto';

    if(detailInfo){
      const infoRect = detailInfo.getBoundingClientRect();
      const btnH = backArrowBtn.getBoundingClientRect().height || 64;
      const infoCenter = infoRect.top + infoRect.height / 2;
      backArrowBtn.style.top = Math.round(infoCenter - btnH / 2) + 'px';

  }

  // 同樣道理：detail-info 文字原本用 bottom:40px 定位，改成 JS 算好的
  // 固定像素 top，跟左邊對齊 header 的邏輯一起做，縮放時就不會飄動。
  function syncDetailInfoAlignment(){
    // 手機版優先用新的「文字+箭頭整組置中在大圖下緣／拉簾上緣之間」邏輯
    // （見 positionDetailInfoMobile 說明）；大圖/拉簾這一刻還沒有實際尺寸
    // （例如頁面剛載入的第一輪）時它會回傳 false，這裡才退回原本貼著拉簾

    if(isDetailMobile() && positionDetailInfoMobile()) return;

    const rect = headerRight.getBoundingClientRect();
    document.documentElement.style.setProperty('--detail-info-left', rect.left + 'px');

    if(detailInfo){
      const infoH = detailInfo.getBoundingClientRect().height || 0;
      // 手機版拉簾現在常駐在畫面下緣（見 layoutFilmstripZone() 的橫式版本），
      // 001/標題這排文字如果還照原本 40px 的底部留白，會被拉簾蓋住或疊在
      // 一起。這裡在拉簾已經初始化好時，額外把它佔用的高度＋一段間距一起
      // 算進留白，讓文字穩穩留在拉簾正上方；桌機／平板的拉簾在右側不佔
      // 用底部空間，這段永遠是 0，行為跟原本完全一樣。
      const filmstripClearance = (isDetailMobile() && fsReady) ? (fsZoneHeight + FS_MOBILE_BOTTOM_GAP + 16) : 0;
      const bottomMargin = 40 + filmstripClearance;
      const top = window.innerHeight - bottomMargin - infoH;
      document.documentElement.style.setProperty('--detail-info-top', Math.round(top) + 'px');
