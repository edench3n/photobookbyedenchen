  // "preview" 標籤對齊 002、"collab" 區塊（header-right）對齊 004，做法完全一樣，
  // 所以抽成同一個函式重複用：對齊下方指定照片實際渲染出來的左邊緣（縮圖是置中
  // 顯示在格子裡的，跟格子本身的邊緣不一樣，所以格子對齊還不夠準）。
  //
  // 在桌機滿版 5 欄範圍內「持續即時追蹤」目標照片實際渲染出來的位置——拖曳寬度
  // 時，照片的位置本身就是連續、按比例在變化的（欄寬隨容器寬度平滑縮放），
  // 每一幀都重新量測、對齊，標籤自然就會跟著它一起連續、按比例地滑動，效果
  // 就是「拉動時自由按比例縮放」。
  //
  // （曾經試過「只在最大寬度量一次、之後凍結成固定偏移量疊加在 flex 自然位置
  // 上」，但 flex 用 justify-content:space-between 算出來的中間項位置，本來就
  // 跟下面照片格子的欄位邊界是兩套完全無關的邏輯，固定偏移量疊加在跟照片無關的
  // 位置上，整段拖曳過程都會對不準，不只是斷點那一下——所以改回這個持續追蹤的
  // 版本，才是真正跟著照片格子按比例移動的做法。）
  //
  // 唯一無法避免的：5→3 欄的斷點本身，是照片格子「整數欄數」瞬間切換造成的
  // 結構性跳動——目標照片自己在那一刻就會被搬到完全不同的欄位寬度（不是連續
  // 縮放，是離散跳動），不是「拖曳中持續追蹤」這個做法造成的問題；只要還要求
  // 兩側都精準對齊該照片，這一下跳動就無法用 JS 消除，除非放棄其中一側的精準
  // 對齊。
  const DESKTOP_BREAKPOINT = 1100; // 與 CSS 中 .grid 從 5 欄變 3 欄的 media query 門檻一致
  // minGapEl：這個標籤左邊緊鄰的上一個 header 元素（例如 previewLabel 的
  // minGapEl 是 backHome，headerRight 的 minGapEl 是 previewLabel）。
  //
  // 問題成因：每個標籤都是「持續即時追蹤目標照片左邊緣」（見上面說明），但
  // 照片欄位寬度是隨容器寬度連續、按比例縮小的，標題文字寬度卻不是照同一個
  // 比例縮小（字級用另一條 clamp 曲線縮放，縮小速度跟欄寬不同步）。在滿版 5
  // 欄斷點（1100px）之前的某一段寬度，目標照片的左邊緣會比「上一個標籤實際
  // 佔用到的右邊緣」還要更左，兩者的文字就會疊在一起——這正是「preview 快
  // 撞到 edenchen 標題」的成因，純粹追蹤照片位置本身無法避免。
  //
  // 成熟的處理方式：不是特例判斷某個寬度該不該對齊，而是幫每個標籤設一個
  // 「不能比上一個元素的右邊緣 + 最小間距還要靠左」的下限，用 Math.max 跟原本
  // 追蹤照片算出來的目標位置取比較靠右的那個。寬度還夠時，目標位置本來就在
  // 下限右邊，跟以前行為完全一樣；寬度縮小到快要重疊的那一刻，下限開始生效，
  // 標籤改成穩定貼齊上一個元素右邊、留一個固定間距，之後隨寬度縮小自然一起
  // 往左走（因為上一個元素本身也會變窄），全程沒有跳動、也保證兩者不會疊在
  // 一起，直到真正進入 3 欄斷點、改用手機版那一整排 flex-wrap 版型為止。
  // 量測目標縮圖「沒有被放大」時的原始邊界，不能直接用
  // targetImg.getBoundingClientRect()——桌機滑鼠「引力放大」特效（見下面
  // magnetFrame()）會即時把圖片 transform:scale() 到某個放大倍率，如果
  // 使用者點擊的剛好就是 001／002／004 這幾張對齊用的照片本身（例如直接
  // 點第一、第二張進入照片頁），點擊那一刻滑鼠正停在照片附近，圖片可能
  // 正在被放大（甚至放大到一半、還在連續變化中），這時候量到的位置會被
  // 那段 transform 影響，算出來的 nudge 就會跟著忽大忽小——這正是「點照片
  // 進去，preview / photobook by edenchen 常常橫移一下」的成因。
  // offsetWidth / offsetHeight 是排版尺寸，不受 CSS transform 影響；縮圖
  // 用 flex 置中顯示在 .thumb-wrap 裡（見該 class 的 align-items/
  // justify-content:center），用「容器矩形置中反推」就能拿到跟目前放大到
  // 多少倍、動畫播到哪一格完全無關、永遠一致的原始邊界。
  function getStableImgRect(img){
    const wrap = img.parentElement;
    const w = img.offsetWidth;
    const h = img.offsetHeight;
    if(!wrap || !w || !h) return img.getBoundingClientRect();
    const wrapRect = wrap.getBoundingClientRect();
    return {
      left: wrapRect.left + (wrapRect.width - w) / 2,
      top: wrapRect.top + (wrapRect.height - h) / 2,
      width: w,
      height: h
    };
  }

  function syncEdgeAlignment(el, cssVar, targetDataIndex, minGapEl){
    if(!el || !grid) return;

    // 修正手機版「一打開網頁、還在 preview 頁面、照片都還沒載入出來時，
    // 首頁最上排那排黑色文字（Photobook by edenchen / Preview / Collab...）
    // 就先短暫跑出來」的問題。成因：init() 一開始（照片都還沒抓回來、
    // previewPage 也還沒真的蓋滿畫面）就會呼叫一次 syncFixedChrome()，
    // 手機版下面這段判斷式因為不需要對齊照片邊緣，會直接無條件加上
    // .positioned、讓文字瞬間變成可見——但這時 body.preview-header-white
    // 這個「文字轉白色」的 class 要等 openPreviewPage() 真正把 previewPage
    // 蓋滿畫面之後才會加上，中間這段空檔文字就維持預設的黑色，看起來像
    // 黑色文字先閃了一下才變白。
    // 做法跟 syncClockAlignment() 內完全相同的判斷式一樣：preview-active
    // 這個 class 從進站起就在 body 上，但只有 previewPage 真的加上 .active
    // （代表已經真的蓋滿畫面、文字也已經同一時間被切成白色）才放行往下算
    // 位置、顯示文字；不在 preview 狀態（例如已經回到首頁或照片詳細頁）
    // 則完全不受影響，正常往下執行。
    if(document.body.classList.contains('preview-active') && !previewPage.classList.contains('active')) return;

    if(window.innerWidth <= DESKTOP_BREAKPOINT){
      document.documentElement.style.setProperty(cssVar, '0px');
      // 窄螢幕不需要精準對齊照片，目前這個位置（0 偏移）本來就已經是最終位置，
      // 直接顯示出來，不會有「先跑到錯誤位置」的問題
      el.classList.add('positioned');
      return;
    }

    const targetImg = grid.querySelector(`.grid-item[data-index="${targetDataIndex}"] img`);
    if(!targetImg) return; // 目標照片還沒渲染出來，先不顯示這個標籤，等它真的渲染出來再算
    const imgRect = getStableImgRect(targetImg); // 用「未 hover 放大」的原始邊界，見上面說明
    if(!imgRect.width) return; // 圖片還沒渲染出寬度，先不調，等 load 事件再算一次

    // 讀回目前已經套用的偏移量，還原出「沒有微調時」原本的左邊界，再算出新的
    // 偏移量——因為對應元素的 left 沒有 CSS transition（見 CSS 註解），這裡讀到
    // 的永遠是瀏覽器已經套用完成的實際值，不會有動畫插值中的數值跟目標值對不上、
    // 導致越算越偏的問題。
    const elRect = el.getBoundingClientRect();
    const currentNudge = parseFloat(getComputedStyle(document.documentElement).getPropertyValue(cssVar)) || 0;
    const baseLeft = elRect.left - currentNudge;

    let targetLeft = imgRect.left;
    if(minGapEl){
      const gapPx = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap')) || 0;
      const minLeft = minGapEl.getBoundingClientRect().right + gapPx;
      targetLeft = Math.max(targetLeft, minLeft);
    }

    const nudge = Math.round(targetLeft - baseLeft);
    document.documentElement.style.setProperty(cssVar, nudge + 'px');
    // 算出真正精準的位置後才顯示（見 CSS 的 opacity:0 / .positioned 規則），
    // 這是「進頁面/重新整理時標籤會先跑到錯誤位置再跳回來」這個 bug 的修法：
    // 與其讓它先出現在錯誤（預設 0 偏移）的位置、算完再跳過去，不如乾脆讓它
    // 在還沒算出正確位置之前保持隱藏，算完直接在正確位置出現，使用者就不會
    // 看到那個「跳」的過程。
    el.classList.add('positioned');
  }
  function syncPreviewAlignment(){
    syncEdgeAlignment(previewLabel, '--preview-nudge', 1, backHome); // 002 = data-index "1"，下限對齊上一個元素 backHome（標題）
  }
  function syncHeaderRightAlignment(){
    syncEdgeAlignment(headerRight, '--header-right-nudge', 3, previewLabel); // 004 = data-index "3"，下限對齊上一個元素 previewLabel
  }
  function syncHeaderLeftAlignment(){
    syncEdgeAlignment(backHome, '--header-left-nudge', 0); // 001 = data-index "0"，最左邊沒有上一個元素，不需要下限
  }

  // 首頁時鐘的對齊，依螢幕寬度分兩套基準（跟 CSS 的 max-width:640px 斷點
  // 一致，手機版 header-right 會換行變成單獨一整排，不再適合當基準）：
  //   - 桌機／平板（>640px）：三塊同一高度排開，由左到右分別對齊
  //     header-left（標題）、header-preview（"Preview" 字樣）、
  //     header-right（"Collab..." 那排字）的左邊緣。
  //   - 手機（≤640px）：時間對齊 header-left（標題）左邊緣，年份＋月份
  //     日期疊成兩行、對齊 header-preview（"Preview" 字樣）左邊緣
  //     （年份的垂直位置、跟月份日期共用同一個 left，都交給 CSS 的
  //     max-width:640px media query 處理，這裡只需要算出水平位置）。
  // 讀的都是 getBoundingClientRect().left，不像 syncEdgeAlignment 需要
  // 額外處理「上一次已套用的 nudge」——時鐘本身不會回頭影響 header 文字的
  // 位置，讀到的永遠就是目標值本身，不用反推。
  function syncClockAlignment(){
    if(!pageClock) return;

    // 修正「preview 頁還沒真正蓋滿畫面前，首頁時鐘就先跑出來」的閃爍：
    // 時鐘之所以在 preview 關閉時能「一揭開就看到」，靠的是它從頭到尾都
    // 已經定位好、只是被 z-index 較高、後渲染的 preview-page 蓋住（見上面
    // body.detail-active .page-clock 那條規則旁的說明）。但這個機制有個
    // 前提：preview-page 必須已經真的蓋住畫面。網站一進來，preview 用的
    // 兩張照片要等 Google Drive API 回應才會準備好，這段等待期間
    // body 雖然已經帶著 preview-active class，但 previewPage 本身還沒被
    // 加上 .active（尚未真正覆蓋畫面），如果這裡照樣把時鐘定位、顯示出來，
    // 使用者就會看到時鐘先浮現在（還是透明的）preview 之上。這裡先擋住，
    // 等 openPreviewPage() 真正讓 previewPage 蓋滿畫面之後，會再手動呼叫
    // 一次這個函式（見該處），到時候這個判斷式就會通過，時鐘才會被定位、
    // 準備好給接下來關閉 preview 時「揭開即見」的效果。
    if(document.body.classList.contains('preview-active') && !previewPage.classList.contains('active')) return;

    if(window.innerWidth <= 640){
      if(!backHome || !previewLabel) return;
      const homeRect = backHome.getBoundingClientRect();
      const previewRect = previewLabel.getBoundingClientRect();
      if(!homeRect.width || !previewRect.width) return; // 還沒渲染出寬度，先不調，等下一次 sync 再算

      document.documentElement.style.setProperty('--clock-time-left', Math.round(homeRect.left) + 'px');
      document.documentElement.style.setProperty('--clock-monthday-left', Math.round(previewRect.left) + 'px');
      pageClock.classList.add('positioned');
      return;
    }

    // 桌機／平板：header-left / header-preview / header-right 彼此之間
    // 已經有 syncEdgeAlignment 內建的 minGap 機制防止疊在一起，但我們自己
    // 另外畫出來的年份、月份日期文字寬度不一定跟它們對應的 header 文字一樣
    // 寬——視窗變窄、header 文字彼此靠近時，前一塊時鐘文字有可能比下一塊
    // 的目標位置更靠右，蓋到後面。這裡額外依序量出「年份」「月份日期」
    // 目前實際渲染出來的寬度，用跟 syncEdgeAlignment 同一套「Math.max
    // 最小間距」做法由左到右逐一鏈接：後面那一塊的最終位置一定不會比
    // 「前一塊左邊界 + 前一塊寬度 + 最小間距」更靠左，空間不夠時自動往右
    // 讓開，而不是被前一塊蓋住，響應式拉窄時三塊全程不會互相疊到或跑位。
    if(!backHome || !previewLabel || !headerRight) return;
    const homeRect = backHome.getBoundingClientRect();
    const previewRect = previewLabel.getBoundingClientRect();
    const collabRect = headerRight.getBoundingClientRect();
    if(!homeRect.width || !previewRect.width || !collabRect.width) return;

    const gapPx = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap')) || 0;

    const yearLeft = homeRect.left;
    document.documentElement.style.setProperty('--clock-year-left', Math.round(yearLeft) + 'px');

    const yearWidth = pageClockYear.getBoundingClientRect().width || 0;
    const minMonthDayLeft = yearLeft + yearWidth + gapPx;
    const monthDayLeft = Math.max(previewRect.left, minMonthDayLeft);
    document.documentElement.style.setProperty('--clock-monthday-left', Math.round(monthDayLeft) + 'px');

    const monthDayWidth = pageClockMonthDay.getBoundingClientRect().width || 0;
    const minTimeLeft = monthDayLeft + monthDayWidth + gapPx;
    const timeLeft = Math.max(collabRect.left, minTimeLeft);
    document.documentElement.style.setProperty('--clock-time-left', Math.round(timeLeft) + 'px');

    pageClock.classList.add('positioned');
  }

  const CLOCK_MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function updateClockDisplay(){
    if(!pageClockTime || !pageClockYear || !pageClockMonthDay) return;
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    const ss = String(now.getSeconds()).padStart(2, '0');
    pageClockTime.textContent = `${hh} ${mm} ${ss}`;
    pageClockYear.textContent = `${now.getFullYear()}`;
    pageClockMonthDay.textContent = `${CLOCK_MONTH_ABBR[now.getMonth()]} ${now.getDate()}`;
  }
  // 用「每次都算好離下一個整秒還有幾毫秒」的遞迴 setTimeout，而不是單純的
  // setInterval(fn, 1000)：setInterval 是從呼叫的那一刻開始累計 1000ms，
  // 跟真正的系統時鐘整秒邊界對不上，長時間下來還會因為分頁被瀏覽器節流
  // （background tab throttling）等因素慢慢產生累積誤差、跳動不均勻。
  // 這裡每次更新完當下秒數後，才用當下的 now.getMilliseconds() 重新算出
  // 離下一個整秒的精準剩餘時間，確保每一次跳動都精準落在整秒邊界上，
  // 秒數看起來才會又穩又流暢，不會忽快忽慢。
  let pageClockTickTimer = null;
  function scheduleClockTick(){
    updateClockDisplay();
    if(pageClockTickTimer) clearTimeout(pageClockTickTimer);
    const msToNextSecond = 1000 - new Date().getMilliseconds();
    pageClockTickTimer = setTimeout(scheduleClockTick, msToNextSecond);
  }

  // 左上角「↑」返回鍵、「←」上一張箭頭，原本用寫死的 CSS
  // left: calc(var(--edge) - 20px)，也就是直接貼齊頁面基礎留白 --edge。
  // 但桌機滿版時，「photobook by edenchen」這排字（header-left）並不是貼在
  // --edge，而是被上面 syncHeaderLeftAlignment() 精準微調過，對齊的是
  // 001 照片實際渲染出來的左邊緣（縮圖是置中顯示在格子裡的，比格子本身的
  // 留白要再往右一些）——這正是螢幕截圖裡箭頭明顯落在文字左邊、對不齊的
  // 原因：箭頭用的是「頁面留白」，文字用的是「照片邊緣」，兩者本來就是
  // 不同的基準線。
  // 修法：改成箭頭也用同一個基準——直接讀 header-left 這一刻真正渲染出來的
  // 左邊緣，再扣掉按鈕本身的 20px padding（讓箭頭「圖示」本身、不是按鈕的
  // 透明熱區，對齊到文字左邊緣）。右側箭頭則依對稱性，套用同一個內縮值、
  // 從畫面右邊界往內推，讓左右留白維持對稱（不是分別各算各的）。
  // 手機／平板（DESKTOP_BREAKPOINT 以下）header-left 本來就沒有精準對齊
  // 微調（nudge 固定是 0px），這裡算出來的值會自然跟原本 var(--edge)-20px
  // 一致，所以這個改動不影響手機版的既有位置。
  function positionNavHorizontal(){
    if(!backHome) return;
    const rect = backHome.getBoundingClientRect();
    if(!rect.width && !rect.height) return; // header-left 還沒渲染出實際位置，先不調，等下一次 sync 再算
    const navLeft = Math.round(rect.left - 20);
    // backArrowBtn（左上角「↑」返回鍵）只在手機／平板（≤640px）沿用這裡的
    // 「跟 header-left 同一基準」邏輯；桌機（>640px）它已經被 CSS 的
    // .nav-back media query 改成貼齊畫面右側、跟大標題同一條水平線（見
    // positionBackButton() 的說明），這裡如果不分寬度、一律把它也塞進跟
    // prevBtn 同一組左側定位，會用 inline style（優先度必定蓋過 CSS）
    // 把桌機版剛設定好的右側位置整個蓋掉——這正是「桌機版箭頭有時候會
    // 跑位」的成因：這個函式跟 positionBackButton() 互相搶著設定同一個
    // 按鈕的位置，誰後執行誰贏，兩邊的呼叫順序在不同觸發路徑下不一致，
    // 結果就是位置忽左忽右、看起來像隨機跑掉。
    // 修法：桌機寬度時，這裡完全不碰 backArrowBtn，把它整個交給
    // positionBackButton() 一個函式獨家負責，不再有兩邊互搶的情況。
    // backArrowBtn（左上角「返回」箭頭）的水平位置現在一律交給
    // positionBackButton() 獨家負責（手機版對齊 header-preview 的
    // "Preview" 字樣、桌機版對齊 detail-title），這裡不管螢幕寬度，
    // 都不再碰 backArrowBtn，避免兩個函式互搶同一個按鈕的位置。
    const leftBtns = [prevBtn];
    leftBtns.forEach(btn => {
      if(!btn) return;
      btn.style.left = navLeft + 'px';
      btn.style.right = 'auto';
    });
    if(nextBtn){
      nextBtn.style.right = navLeft + 'px';
      nextBtn.style.left = 'auto';
    }
  }

  // 手機版：Collab 那塊（header-right）整塊等比放大／縮小，讓最長的那一行
  // （「edenchenworks@gmail.com」）的最右側字元，精準對齊上面「Photobook by
  // edenchen」（header-left）最後一個字元「n」的最右側。兩者本來就是從
  // .fixed-header 同一個起始點（padding-left）開始排版，所以只要把
  // Collab 那一行的「寬度」調整成跟標題的寬度完全一樣，右邊自然就會跟著
  // 對齊，不用另外處理右邊界。
  //
  // 做法：量測「Collab 最長一行」目前的自然寬度，用它跟 header-left 目前
  // 實際渲染出來的寬度算出縮放比例，直接把這個比例乘上字級寫回去。
  //
  // 這裡故意不直接量測顯示中的 header-right——它是 flex item，且套用了
  // flex-basis:100%（見手機版 media query），就算暫時切成 inline-block，
  // 瀏覽器對 flex item 一律先「blockify」，flex-basis 依然會把它撐滿整排
  // 寬度，量出來的其實是「畫面可用寬度」而不是文字真正需要的寬度，算出來的
  // 縮放比例會嚴重失準。改成量測旁邊那個專門準備的隱形分身 #collabMeasure：
  // 它是 position:absolute（見上面 CSS 的 .collab-measure 規則），完全脫離
  // flex 版面，寬度用瀏覽器原生的 shrink-to-fit 演算法自動收縮成「這個字級
  // 下、最長一行」真正需要的自然寬度，不受任何容器寬度影響，量到的數字才
  // 準確可靠。因為它從頭到尾都沒被 JS 動過字級，隨時都是可信賴的基準值，
  // 不需要每次重算前先重設。
  //
  // 算出新字級之後只套用在「真正顯示的」header-right 上，#collabMeasure
  // 本身維持原始字級不變，繼續當下一次計算的基準。因為 line-height 是無
  // 單位的 1.5 倍率，字級改變時行距會自動等比例跟著縮放，不用另外處理。
  function fitCollabWidth(){
    if(!headerRight || !backHome || !collabMeasure) return;

    if(window.innerWidth > 640){
      // 桌機不需要縮放，還原成 CSS 預設字級（跟著 --header-font-size 走）
      headerRight.style.fontSize = '';
      return;
    }

    const naturalWidth = collabMeasure.getBoundingClientRect().width;
    const targetWidth = backHome.getBoundingClientRect().width;
    if(!naturalWidth || !targetWidth) return;

    const baseFontSize = parseFloat(getComputedStyle(collabMeasure).fontSize);
    if(!baseFontSize) return;

    const ratio = targetWidth / naturalWidth;
    headerRight.style.fontSize = (baseFontSize * ratio) + 'px';
  }

  // 統一入口：視窗/版面真正穩定下來時（不是縮放中）才呼叫，
  // 一次把左右箭頭、detail-info 文字、header-left、preview 標籤、collab 區塊
  // 都重新定位好。
  function syncFixedChrome(){
    syncDetailInfoAlignment();
    positionNavArrows();
    positionBackButton();
    syncHeaderLeftAlignment();
    positionNavHorizontal(); // 必須排在 syncHeaderLeftAlignment() 之後，才能讀到這一輪算好的最新位置
    syncPreviewAlignment();
    syncHeaderRightAlignment();
    fitCollabWidth(); // 必須排在最後：要讀到 header-left 這一輪最終的寬度才能算準縮放比例
    syncClockAlignment(); // 需要 header-left / header-preview 這一輪最終位置，排在它們之後算
    resizeAllGridImages(); // 格子寬度改變後，重新依面積算每張縮圖的顯示大小，必須排在 positionAllGridIdx() 之前，讓後者量到的是這一輪最新的照片尺寸
    positionAllGridIdx(); // 視窗尺寸/欄數改變後，重新把每張照片的編號貼回「照片本身」的右下角
  }

  // 照片的 001/002/003... 順序：不是照檔名排序，而是用一個「固定的隨機順序」。
  // 做法是拿每張照片在 Google Drive 裡永遠不變的 file.id，混合下面這個
  // RANDOM_ORDER_SALT 種子字串，跑一個固定的雜湊函式算出一個數字，再照這個
  // 數字排序——同一個 file.id + 同一個種子字串，每次算出來的數字都完全一樣，
  // 所以不管重新整理幾次網頁、什麼時候打開，順序永遠一致，不會每次都變。
  // 新增照片時：新照片的 file.id 也會算出一個固定數字，插進現有順序中間
  // 看起來像隨機的某個位置，但完全不影響其他既有照片彼此之間的相對順序。
  // 如果哪天想「換一組新的固定隨機順序」，只要把 RANDOM_ORDER_SALT 改成
  // 別的字串（例如加個版本號），全部照片就會照新種子重新洗牌成另一組、
  // 同樣固定不變的新順序。
  const RANDOM_ORDER_SALT = 'edenchen-photobook-order-v1';
  function hashStringToInt(str){
    // FNV-1a 32-bit 雜湊：純數學運算、不含任何跟時間/亂數相關的成分，
    // 同樣的輸入字串永遠得到同樣的輸出數字。
    let h = 0x811c9dc5;
    for(let i = 0; i < str.length; i++){
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return h >>> 0;
  }

  // ---------- Drive API 回應快取（同分頁內有效） ----------
  // 這支 API 呼叫是整個網站「第一張照片出現前」最前面、會卡住後面所有事
  // 的關鍵請求（見上面 preconnect 該處的說明）。使用者在同一個分頁內
  // 上一頁/下一頁、或重新整理，其實九成情況下拿到的照片清單跟剛剛一模
  // 一樣，卻要整個網站重新等一次這個請求的往返時間，才能開始下載第一張
  // 照片——這段等待其實完全可以省略。
  // 用 sessionStorage 存一份「最近一次成功拿到的清單」，並附上時間戳記：
  //   - 同一個分頁只要在 CACHE_TTL_MS 之內再次進站，直接用快取的清單，
  //     完全跳過這次網路請求，第一張照片幾乎瞬間開始下載。
  //   - 超過 TTL（代表使用者可能真的隔了一段時間才回來，Drive 資料夾內容
  //     也可能已經更新過），照舊重新打一次 API，維持資料新鮮度。
  //   - 只用 sessionStorage（分頁關閉即清空）不用 localStorage：避免使用者
  //     隔了很多天再打開時，還在用已經過期很久、可能早就跟 Drive 現況對
  //     不上的舊清單；同時也不會有跨分頁互相汙染快取的問題。
  //   - 存的是「處理過後、已經算好每個尺寸網址」的完整結果（不是原始 API
  //     回應），下次命中快取時連 .map() 的計算都一起省下來，是真正意義上
  //     的「直接可用」。
  //   - 任何一步（讀取/解析/寫入 sessionStorage）失敗都直接忽略，不影響
  //     原本的網路請求流程——快取只是錦上添花，絕不能變成新的失敗點。
  function readDriveCache(){
    try{
      const raw = sessionStorage.getItem(DRIVE_CACHE_KEY);
      if(!raw) return null;
      const parsed = JSON.parse(raw);
      if(!parsed || !Array.isArray(parsed.photos) || typeof parsed.savedAt !== 'number') return null;
      if(Date.now() - parsed.savedAt > DRIVE_CACHE_TTL_MS) return null;
      return parsed.photos;
    }catch(err){ return null; }
  }
  function writeDriveCache(photosList){
    try{
      sessionStorage.setItem(DRIVE_CACHE_KEY, JSON.stringify({ savedAt: Date.now(), photos: photosList }));
    }catch(err){ /* 私密瀏覽模式、儲存空間已滿等狀況，忽略即可，不影響正常運作 */ }
  }

  async function fetchDriveImages(){
    if(!GOOGLE_API_KEY || GOOGLE_API_KEY === 'YOUR_API_KEY' ||
       !GOOGLE_DRIVE_FOLDER_ID || GOOGLE_DRIVE_FOLDER_ID === 'YOUR_FOLDER_ID'){
      return demoPhotos;
    }

    const cached = readDriveCache();
    if(cached) return cached;

    try{
      const q = encodeURIComponent(`'${GOOGLE_DRIVE_FOLDER_ID}' in parents and mimeType contains 'image/' and trashed = false`);
      // imageMediaMetadata(width,height)：Google Drive 針對圖片檔案本來就會
      // 回傳的原始像素尺寸，額外多要這兩個欄位，才能算出每張照片「實際的
      // 長寬比」——這個比例後面給照片物理堆疊模式（spawnFallingPhotos()）
      // 用，讓掉落的每一張照片畫成它本來的形狀，不是統一的正方形。
      // 原本這裡還多要了一個 createdTime 欄位，但整份程式碼從頭到尾都沒有
      // 任何地方真的用到它（排序用的是 orderBy=name，不是建立時間）——
      // 純粹是每一張照片都要多帶一段沒人看的時間字串回來，資料夾照片一多，
      // 這筆多餘的資料量會跟著線性增加，也要多花一點時間解析。拿掉之後
      // 對外沒有任何行為變化，回應本身變小、解析也快一點點，純粹是清掉
      // 死重量，不影響任何顯示畫質。
      const fields = encodeURIComponent('files(id,name,thumbnailLink,imageMediaMetadata(width,height))');
      const url = `https://www.googleapis.com/drive/v3/files?q=${q}&fields=${fields}&orderBy=name&key=${GOOGLE_API_KEY}`;

      // 保底逾時：原本沒有設定 fetch 的逾時，網路狀況不好（例如訊號時有時無、
      // 請求卡在半路沒有明確失敗也沒有回應）時，這個 await 可能會無限期
      // 掛著，使用者會一直卡在空白畫面、什麼都看不到，也沒有任何備援。
      // 用 AbortController 設一個 8 秒的保底：超過就主動中斷這次請求，
      // 直接落到下面 catch 區塊，退回使用 demoPhotos，至少讓使用者能看到
      // 內容，而不是永遠卡住的白畫面。8 秒對正常網路來說綽綽有餘，不會
      // 誤傷任何一次「只是稍微慢一點」的正常請求。
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000);
      let res;
      try{
        // priority:'high'：這是整個網站「preview 頁第一批照片出現之前」
        // 最前面、會卡住後面所有事情的一個網路請求（見上面 photosPromise
        // 宣告處的完整說明），理當拿到瀏覽器能給的最高網路優先度。支援
        // Priority Hints 的瀏覽器（目前主要是 Chromium 系）會因此把頻寬
        // 優先分配給這個請求，比同時間發出的其他次要請求（例如字體、
        // 縮圖預連線）更早拿到回應；不支援這個選項的瀏覽器會直接忽略它，
        // 行為等同沒有這個屬性，不會出錯、也不會變慢，純粹是「有支援就
        // 賺到、沒支援也不會更差」的安全加分項。
        res = await fetch(url, { signal: controller.signal, priority: 'high' });
      } finally {
        clearTimeout(timeoutId);
      }
      if(!res.ok) throw new Error('Drive API request failed: ' + res.status);
      const data = await res.json();

      if(!data.files || data.files.length === 0) return demoPhotos;

      const result = data.files
        .sort((a,b) => hashStringToInt(a.id + RANDOM_ORDER_SALT) - hashStringToInt(b.id + RANDOM_ORDER_SALT))
        .map(file => {
          // thumbnailLink 是 Google 圖片 CDN 產生的、已經縮圖過的版本（速度快、
          // 全球都有快取節點，也比較不會像 uc?export=view 那樣在檔案較大時
          // 被擋掉或跳出「無法掃描病毒」的中介頁面）。網格縮圖只是小圖，
          // 用 800px 的版本畫質完全足夠；點開大圖看細節時才用原始全尺寸檔案，
          // 畫質不受任何影響。
          const thumbBase = file.thumbnailLink ? file.thumbnailLink.replace(/=s\d+$/, '') : '';
          // 照片實際的寬高比（寬/高）：來自 Drive 回傳的 imageMediaMetadata，
          // 是這張圖片檔案本身真正的像素尺寸，不是任何一種縮圖／顯示尺寸。
          // 部分檔案（例如非標準圖片格式）Drive 可能沒有回傳這個欄位，量不到
          // 就退回 1（正方形），至少不會整個壞掉，只是那一張退回舊行為。
          const meta = file.imageMediaMetadata;
          const aspect = (meta && meta.width && meta.height) ? (meta.width / meta.height) : 1;
          return {
            title: file.name.replace(/\.[^/.]+$/, ''),
            aspect,
            url: `https://drive.google.com/uc?export=view&id=${file.id}`, // 原始全尺寸檔案：畫質最高，但走 drive.google.com/uc，
                                                                            // 不是 CDN，檔案大時常常要等好幾秒才回應，甚至偶爾被
                                                                            // 導去「無法掃描病毒」的中介頁面——這是白屏拖很久的主因
            // detailUrl：大圖頁真正優先使用的來源。一樣是 thumbnailLink 這個
            // Google 圖片 CDN（全球節點、速度快很多），只是把尺寸從網格用的
            // 800px 拉到 2000px——一般螢幕（含 Retina）全螢幕顯示都綽綽有餘，
            // 肉眼幾乎看不出跟原始檔案的差異，但下載速度是原本 uc?export=view
            // 的好幾倍快，白屏時間大幅縮短。
            detailUrl: thumbBase ? (thumbBase + '=s2000') : '',
            // detailUrlMobile：只給手機版大圖頁用的縮小版本。手機螢幕的可視
            // 寬度（扣掉左右箭頭留白後）通常落在 250~300px 左右，就算是
            // Retina/3x 螢幕，實際需要的像素寬度也大概落在 900px 上下，
            // 2000px 對手機來說是遠超過肉眼看得出差異的大小，卻要多花好幾倍
            // 的下載時間。改用 1200px：畫質在手機螢幕上跟 2000px 幾乎沒有
            // 分別，但檔案小很多、下載快很多，這樣切換照片時大機率能直接
            // 一次到位顯示正確畫面，不需要再靠縮圖墊場、事後校正這些額外的
            // 過場處理。只在觸控裝置套用，桌機版不受影響，仍然用 2000px。
            detailUrlMobile: (supportsTouch && thumbBase) ? (thumbBase + '=s1200') : '',
            thumbUrl: thumbBase ? (thumbBase + '=s750') : `https://drive.google.com/uc?export=view&id=${file.id}`, // hover 大圖預覽專用：上一輪速度優化從 800 調到 700，這次使用者反應整體看起來偏小／偏糊，往回調到 750——介於兩者之間，畫質比 700 明顯提升，仍然比原本的 800 省一點下載量，維持優化的方向不變。
            // gridUrl：首頁網格縮圖實際顯示用的尺寸。網格每張圖片最終渲染出來
            // 頂多幾十到一百多 px 寬（.grid-item img { max-width:52% } 疊在
            // 本來就不大的欄位裡），用 800px 明顯是殺雞用牛刀，檔案大小是真正
            // 需要的好幾倍，這正是「首頁小圖載入速度太慢」的主因。改用 400px，
            // 即使是 Retina 螢幕也綽綽有餘，肉眼幾乎看不出差異，但檔案大小明顯
            // 縮小、下載更快。注意：hover 滑鼠跳出來的大圖預覽刻意還是用上面
            // 那個沒被縮小的 thumbUrl，不會被這次調整影響到。
            //
            // ---- 這一輪速度優化 ----
            // 這是整個網格畫面裡「用量最大」的一個尺寸——網格裡每一張照片
            // 都要載入一份，張數一多，光是這個尺寸的總下載量就決定了首頁
            // 整體跑出來的快慢。原本從 400px 微調到 340px（約再小 15%，換算
            // 面積／檔案大小大約再省三成）省下不少下載量，但使用者後來反應
            // 整體圖片看起來偏小、優化得太過頭，這裡再往回調到 380px——
            // 幅度只回補一半左右，畫質比 340px 明顯好一截，但仍然比最早的
            // 400px 小、維持著優化的方向，不是整個復原。跟 thumbUrl／
            // tinyUrl／previewUrl 這幾個同一批調整的尺寸一樣，detailUrl／
            // detailUrlMobile（大圖詳細頁，使用者真正會放大細看的地方）
            // 刻意完全不動，把畫質預算留在使用者真的會盯著看的地方。
            gridUrl: thumbBase ? (thumbBase + '=s380') : `https://drive.google.com/uc?export=view&id=${file.id}`,
            fallbackUrl: thumbBase ? (thumbBase + '=s1600') : '', // 縮圖／原圖都失敗時的備援
            // tinyUrl：專門給 preview 頁「飄動的 e 撞到上/下邊界」觸發跳轉、但撞擊
            // 太快或連續撞擊、且連 thumbUrl（現在是 750px）都還沒被瀏覽器快取到時
            // 使用的最後備援圖。原本是 60px，檔案極小、瞬間就能顯示，但撞太快
            // 時整個畫面幾乎全是這張圖，60px 拉滿半個螢幕肉眼一看就是馬賽克，
            // 畫質完全不能看；後來改成 320px、再提升到 480px，清晰度明顯提升，
            // 即使是它被顯示出來的少數情況，看起來也不會再一眼就覺得「畫質
            // 很差」。上一輪微調到 420px，這次跟其他幾個尺寸一起往回補一點，
            // 調到 450px：出現的情境依舊是「畫面正在快速跳轉的過渡瞬間」，
            // 肉眼原本就來不及細看，但整體都補一點之後看起來更一致，不會
            // 這張特別小。
            tinyUrl: thumbBase ? (thumbBase + '=s450') : `https://drive.google.com/uc?export=view&id=${file.id}`,
            // previewUrl：preview 跳轉頁（一打開網站看到的那個左右／上下交錯
            // 全版跳轉畫面）專用。這裡的照片撞牆就換、停留時間很短，肉眼幾乎
            // 來不及看清細節，卻要求跟大圖詳細頁一樣載 2000px 原始尺寸的
            // thumbnail，這正是「一打開網站，preview 畫面第一批照片跑出來
            // 明顯慢一拍」的主因——不只手機，桌機同樣受影響。
            // 手機（supportsTouch）原本是 900px，上一輪調到 800px；這次跟
            // 其他尺寸一起往回補一點，調到 850px——介於兩者之間，肉眼可辨
            // 的畫質比 800px 好一點，仍然比最早的 900px 省一些下載量。
            // 桌機／平板原本完全沒有專屬的 previewUrl，會直接落到下面
            // fallback 清單的下一個候選 detailUrl（=s2000），等於用「大圖
            // 詳細頁在看細節」才需要的尺寸，去餵一個只佔螢幕一半寬、而且
            // 隨時會被下一張蓋過去的跳動畫面，白白多下載、多等好幾倍的資料量。
            // 補上桌機專屬的尺寸，原本是 1600px，上一輪調到 1400px，這次
            // 同樣往回補一點到 1500px：欄寬是 50vw，即使是 Retina/2x 螢幕，
            // 1500px 仍然遠超過那個寬度實際需要的像素，這裡的取捨原則跟上面
            // gridUrl／tinyUrl 一致：畫面停留短、使用者來不及細看的地方，
            // 優化的方向維持不變，只是這次把幅度往回收一些。
            previewUrl: thumbBase ? (thumbBase + (supportsTouch ? '=s850' : '=s1500')) : ''
          };
        });

      writeDriveCache(result); // 存一份快取，下次同分頁再進站可以直接跳過這次 API 往返
      return result;
    }catch(err){
      return demoPhotos;
    }
  }

  // ---------- 讀取「e」圖片庫（撞牆換圖用）的快取 ----------
  // 邏輯跟上面 readDriveCache()/writeDriveCache() 完全一樣，只是換一組
  // key／TTL，兩份快取彼此獨立，互不覆蓋。
  function readDvdECache(){
    try{
      const raw = sessionStorage.getItem(EDEN_E_CACHE_KEY);
      if(!raw) return null;
      const parsed = JSON.parse(raw);
      if(!parsed || !Array.isArray(parsed.urls) || typeof parsed.savedAt !== 'number') return null;
      if(Date.now() - parsed.savedAt > EDEN_E_CACHE_TTL_MS) return null;
      return parsed.urls;
    }catch(err){ return null; }
  }
  function writeDvdECache(urls){
    try{
      sessionStorage.setItem(EDEN_E_CACHE_KEY, JSON.stringify({ savedAt: Date.now(), urls: urls }));
    }catch(err){ /* 私密瀏覽模式等情況，忽略即可 */ }
  }

  // 抓「e」圖片庫資料夾內所有 PNG／圖片檔案，回傳一組可以直接拿來當
  // <img src> 用的網址陣列。刻意跟上面照片牆的 fetchDriveImages() 分開
  // 寫成兩個獨立函式：這裡只需要「網址」，不需要標題、長寬比這些照片牆
  // 才要用到的欄位，保持簡單。
  //
  // 沒有設定 EDEN_E_FOLDER_ID、資料夾是空的、或任何一個環節失敗，一律
  // 回傳空陣列——呼叫端（cycleDvdEImage）看到空陣列就會直接放棄換圖，
  // 維持原本內建的那張圖片，不會讓整個網站因為這個額外功能而壞掉。
  async function fetchDvdEImages(){
    if(!GOOGLE_API_KEY || GOOGLE_API_KEY === 'YOUR_API_KEY' ||
       !EDEN_E_FOLDER_ID || EDEN_E_FOLDER_ID === 'YOUR_E_FOLDER_ID'){
      return [];
    }

    const cached = readDvdECache();
    if(cached) return cached;

    try{
      const q = encodeURIComponent(`'${EDEN_E_FOLDER_ID}' in parents and mimeType contains 'image/' and trashed = false`);
      // 這裡只需要 id（沒有 thumbnailLink 時的備援網址要用）跟 thumbnailLink
      // 本身，不需要 name——原本多要的 name 欄位從頭到尾沒有任何地方用到
      // （下面 map 只讀 thumbnailLink／id），純粹是白白多讓 Google 多傳一段
      // 檔名回來、也要多花一點點時間解析，拿掉之後行為完全不變，只是
      // 回應變小一點、快一點。
      const fields = encodeURIComponent('files(id,thumbnailLink)');
      const url = `https://www.googleapis.com/drive/v3/files?q=${q}&fields=${fields}&orderBy=name&key=${GOOGLE_API_KEY}`;

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000);
      let res;
      try{
        // priority:'low'：這個資料夾的圖片只有撞牆換圖時才用得到，不是
        // 使用者這一刻馬上要看到的關鍵內容（真正關鍵的是上面 photosPromise
        // 那個請求，見那裡的 priority:'high' 說明）。明確標成低優先度，
        // 讓支援 Priority Hints 的瀏覽器把頻寬優先讓給更重要的那個請求，
        // 這個請求晚一點點拿到回應也不影響使用者馬上看到的畫面——反而
        // 間接讓「真正的照片庫」更快出現，這才是使用者感受到的「圖片庫
        // 抓取變快」。不支援這個選項的瀏覽器會直接忽略，不影響原本行為。
        res = await fetch(url, { signal: controller.signal, priority: 'low' });
      } finally {
        clearTimeout(timeoutId);
      }
      if(!res.ok) throw new Error('Drive API request failed: ' + res.status);
      const data = await res.json();
      if(!data.files || data.files.length === 0) return [];

      // 「e」在畫面上實際顯示的高度：原本落在 40~119px 之間時，240px 高的
      // 來源圖就算是 Retina/3x 螢幕也綽綽有餘，所以先前一路維持 240 這個
      // 尺寸沒有跟著調整。後來這個元素整體放大過好幾輪，桌機/平板目前
      // 最大可以到 315px、手機更到 656px，240px 的來源圖被拉伸到這個尺寸
      // 早就遠遠超出取樣範圍，使用者反應「都糊掉了」正是這個原因——不是
      // 裁切／編碼過程壓縮造成的（下面裁切完是用 canvas.toDataURL('image/png')
      // 輸出，PNG 是無損格式，不會額外損失畫質），純粹是來源圖本身解析度
      // 不夠、被瀏覽器放大顯示時內插模糊。
      // 改成 1600px：即使是手機版最大 656px 高、疊上 3x Retina 螢幕
      // （656 × 3 ≈ 1968px）也已經非常接近「幾乎不需要再放大」的程度，
      // 桌機/平板最大 315px 更是綽綽有餘；同時 1600 仍然遠小於原始檔案，
      // 不是完全不設限，下載/裁切速度不會變得跟原圖一樣慢。用
      // thumbnailLink 這個 Google 圖片 CDN 版本，比原始檔案
      // （drive.google.com/uc?export=view）快很多、也不會被導去「無法
      // 掃描病毒」中介頁面。沒有 thumbnailLink 的檔案（極少數情況）退回
      // uc?export=view 當備援（原始檔案本身沒有這個尺寸限制問題）。
      //
      // ---------- 再往下修一點點：1600px → 1400px ----------
      // trimLoadedImage() 裡真正花時間的幾步（drawImage 畫進 canvas、
      // 最後 toDataURL('image/png') 編碼輸出）運算量是跟著來源圖的像素
      // 總量线性增加的，1600px 改 1400px，像素量少了大約 24%
      // （1400²/1600² ≈ 0.766），這幾步對應也會快上約兩到三成，網路
      // 下載/解碼的時間同樣受惠。找邊界用的取樣（SCAN_MAX_DIM，見下面
      // trimLoadedImage() 的說明）本來就已經統一縮到 400px 掃描，不受
      // 來源解析度影響，所以這裡調整完全不影響「找留白邊界」的準確度。
      // 只小幅下修（-12.5%），不是打回舊的 240px：1400px 疊上手機版
      // 最大 656px 高、3x Retina（656 × 3 ≈ 1968px）雖然不像 1600px
      // 那樣幾乎不用再放大，但仍然遠遠超出 240px 那次讓使用者反應「都
      // 糊掉了」的程度，肉眼幾乎分辨不出跟 1600px 的差異，只有在「手機
      // 版飄動物件剛好放到最大、又剛好是 3x 螢幕」這種最極端的情況下，
      // 才有極輕微、幾乎看不出來的差距。
      //
      // ---------- 手機版再往下修一截：1400px → 1000px ----------
      // 承上面「手機版剛進站，撞沒幾次就又看到同一張照片」那輪修正
      // （見 trimDvdEImagesStaggered() 內 scheduleNext() 的完整說明）：
      // 那輪只收緊了排程的「等待間隔」，但每一張圖真正要花的下載時間、
      // 以及 trimLoadedImage() 內 drawImage／getImageData／toDataURL 這幾步

      // 這一塊——這正是使用者反應「剛進站頭幾次撞擊、飄動物件依然完全
      // 不會換圖」在收緊排程間隔之後仍然存在的原因：真正的硬傷是這幾步
      // 運算本身要花的時間，不是排隊排太久。
      // 修法：比照專案裡其他地方（見 supportsTouch 判斷各處：detailUrlMobile
      // 用 =s1200、previewUrl 手機用 =s850）已經在用的「手機版用較小尺寸」
      // 做法，這批「e」圖片庫也一樣，手機改抓 =s1000（桌機維持 1400 不變）。
      // 1000²/1400² ≈ 0.51，下載量、以及 trimLoadedImage() 這幾步運算量
      // 都減少約一半，直接讓已就緒池在手機上長大快將近一倍，是使用者

      // 差異不算明顯，換來的是進站頭幾秒撞牆就能正常換圖。
      //
      // ---------- 桌機/平板再往下修一點點：1400px → 1000px ----------
      // 上面手機版已經改用 1000px，這裡桌機/平板原本維持 1400px 沒動；
      // 但桌機/平板這顆飄動物件顯示的最大高度其實只有 315px（見上面這段

      // 尺寸參數，也讓兩邊的行為更一致、好維護。刻意不比照手機版再往下修
      // （手機版 1000px 疊上最大 656px、3x Retina 已經算是取捨後的下限，
      // 見上面該段完整說明），這裡的 1000px 純粹是桌機/平板這邊「原本明顯
      // 超額」的部分被修掉，不是同一種取捨。
      const urls = data.files.map(file => {
        const thumbBase = file.thumbnailLink ? file.thumbnailLink.replace(/=s\d+$/, '') : '';

      });

      writeDvdECache(urls);
      return urls;
    }catch(err){
      return [];
    }
  }

  // 首頁網格最前面這幾張縮圖，不管手機螢幕多高，幾乎都是「一打開就看得到」
  // 的第一畫面內容；原本手機版（supportsTouch）不分青紅皂白全部縮圖都套用
  // loading="lazy"，包括這些明明馬上就要顯示的圖片——lazy 是設計給「捲動
  // 到才需要看到」的內容用的，套在第一畫面內容上，瀏覽器不會把它們當成
  // 高優先度資源，反而會延後、降低它們的下載優先順序，這正是「一開始都
  // 還是全白幕」的主因之一。這裡改成：前面這幾張明確給 eager + 高優先度，
  // 讓瀏覽器把頻寬優先用在使用者馬上就會看到的圖片上；再往後（真的要捲動
  // 才會看到）的縮圖才繼續用 lazy，省流量、不影響第一畫面出現的速度。
  // 10 張足夠涵蓋手機 2 欄、平板 3 欄、桌機 5 欄各種版面下的第一畫面，
  // 多留一點餘裕也不會造成明顯負擔（縮圖檔案本身已經很小)。
  const GRID_EAGER_COUNT = 10;

  // 把單一 .grid-item 裡的編號（.idx）貼在「照片本身」實際渲染出來的
  // 位置：水平（left）對齊照片實際的最左側，垂直（top）貼在照片實際
  // 下緣「往下一點點」的位置——不是整個正方形格子（.thumb-wrap）的邊緣。
  // 縮圖用 max-width:52%/max-height:52% + object-fit:contain 置中顯示，
  // 不同照片的長寬比會讓照片本身在格子裡的實際大小、位置都不一樣，只有
  // 用 getBoundingClientRect() 量出這一刻真正渲染出來的邊界，才能準確算出
  // 正確的 left / top，讓編號永遠貼著照片實際的邊緣，不是格子的邊緣。
  //
  // 這裡量到的 imgRect，現在已經一定是照片「這一影格」實際渲染出來的最終
  // 邊界——不管當下有沒有被滑鼠引力放大特效放大、放大到多少倍，都已經
  // 反映在 getBoundingClientRect() 量到的結果裡了（放大是直接寫在
  // img.style.transform 上的，getBoundingClientRect() 本來就會把 transform
  // 計算進去）。所以不需要再另外預留、換算「放大之後會多撐出多少」這件
  // 事：只要單純用量到的實際邊界 + 固定的 GRID_IDX_GAP 間距，編號就會

  // 放大、放大到多少倍，每一影格都會重新貼齊一次，天然保持同步、不會被
  // 蓋到，也不需要額外的 CSS transform / transition 來補一段位移動畫。
  const GRID_IDX_GAP = 14; // 編號跟照片（含放大狀態）下緣之間留的間距（px）——使用者要求再往下多留一些
  // 首頁縮圖「放大進場」動畫（見下面 prepareGridRevealState() / playGridRevealAnimation()）
  // 期間，照片本身正在用 CSS transition 從 scale(0.04) 一路長大到 scale(1)——
  // 這段時間 img 的 getBoundingClientRect() 量到的是「動畫播到一半、還沒
  // 長大完成」的暫時尺寸，不是照片真正的大小。如果這段期間有任何其他呼叫
  // （例如視窗 resize、或 closePreviewPage()／finishClosePreviewPage() 裡
  // 保底重算對齊用的 syncFixedChrome()）意外呼叫到 positionGridIdxItem()，
  // 用這個暫時、偏小的尺寸重新算出來的編號位置就會整個縮到照片中央附近，
  // 看起來像「編號蓋到照片上面」。
  // 用這個旗標把「進場動畫播放期間」整段標記起來，期間內 positionGridIdxItem()
  // 一律跳過不動——編號正確的位置在動畫開始前（prepareGridRevealState()）
  // 就已經量好、寫進 left/top 了，動畫期間本來就不需要、也不應該重算。
  let gridRevealInFlight = false;
  // 放大進場動畫播放期間，飄動的 e 拿來當撞牆對象用的「目標矩形」快取——
  // key 是每張縮圖的 img 元素，value 是那張圖片動畫播放前（scale(1)、
  // 未套用任何 transform）當下用 getBoundingClientRect() 量到的原始矩形。
  // 見 getObstacleRects() 內的說明，這裡只是共用的儲存空間。
  const gridRevealTargetRectMap = new WeakMap();
  // 「放大進場」動畫播完、gridRevealInFlight 剛變回 false 的那一刻要呼叫的
  // 收尾函式：把桌機滑鼠「引力放大」特效（magnetFrame()，見下面 supportsHover
  // 區塊）內部各張照片自己追蹤的「目前縮放值」統一重設回 1。
  //
  // 為什麼需要這個：magnetFrame() 在 gridRevealInFlight 為 true 期間完全
  // 跳過、不寫入 img.style.transform（見 magnetFrame() 內的判斷），但它自己
  // 記錄「目前縮放值」的 magnetScaleState 這份資料在凍結期間並不會被同步
  // 更新或歸零——如果使用者在切換頁面之前，滑鼠正好停在某張縮圖上、那張
  // 縮圖的引力縮放值凍結在一個大於 1 的數字（例如 1.3），接著整段凍結期間
  // （放大進場動畫播放中）magnetScaleState 完全沒有機會被重新算過。
  // 進場動畫播完的那一刻，畫面上每張照片的「實際」大小一定都會落在 CSS
  // 預設的 scale(1)（playGridRevealAnimation() 收尾時會把 inline transform
  // 清空、交還這個預設值），但如果沒有這個重設，magnetFrame() 下一次恢復
  // 運作時，會直接從那個凍結前殘留的舊數字（1.3）當作「目前值」去追新算出
  // 來的目標值——如果剛好新算出的目標值也接近 1.3（例如滑鼠這段期間完全沒
  // 移動，還停在同一張縮圖上方），magnetFrame() 會判定「目前值」已經非常
  // 接近「目標值」，幾乎不需要再過渡，直接把 img.style.transform 寫成
  // scale(1.3)——畫面上就會是「進場動畫剛把照片放到 scale(1)，下一影格立刻
  // 無過渡地跳成 scale(1.3)」，正是使用者回報的「引力在放大時卡住，然後
  // 突然跳一下放大」。
  //
  // 修法分兩層：① 進場動畫真正播完的這一刻，強制把每張照片的「目前縮放
  // 值」重設成 1（跟畫面上此刻真正的大小一致），並把 magnetLastFrameTime
  // 也重設成 null（比照分頁切回前景時的處理，見 visibilitychange 監聽）；
  // ② 光是「目前值」歸位還不夠——如果滑鼠這時候剛好已經停在某張縮圖正
  // 上方，引力算出來的「目標值」在第一影格就已經是接近滿倍率，配合原本
  // 「貼手」的追蹤速度，短短 300~400ms 內還是會衝到頂，感覺像「一放大完
  // 馬上又被引力猛拉一下」。所以同時啟動一段「引力強度」的爬升期（見

  // 兩者合起來，效果就是「等照片都放大完成之後，引力才用一個成熟、物理
  // 流暢的慢速從無到有生效」。
  // 預設是空函式；真正的實作在下面 supportsHover 區塊內才會覆寫（觸控裝置
  // 完全沒有 magnetFrame()，維持空函式、呼叫了也不會有任何效果）。
  let resetMagnetScaleForReveal = function(){};
  // ---------- 首頁縮圖：依「面積」而不是「寬度」決定每張照片的顯示大小 ----------
  // 原本靠 CSS 的 .grid-item img{ max-width:52%; max-height:52% } 讓瀏覽器
  // 自己算——理論上這應該是以面積為準的等比例縮放，但手機瀏覽器在「img 的
  // max-height 百分比，對應到一個靠 aspect-ratio:1/1 撐出高度的容器
  // （.thumb-wrap）」這個組合上，常常沒辦法正確解析（百分比高度需要容器
  // 有「明確」高度，aspect-ratio 撐出來的高度在不少手機瀏覽器的實作裡不
  // 算數），導致實際只有 max-width 這條真的生效——變成單純「以寬度為準」
  // 縮放：橫式照片（寬>高）本來寬度就比較「滿」，被這個上限壓得更扁、
  // 換算下來的可視面積偏小；直式照片（高>寬）寬度本來就窄，同一個寬度
  // 上限反而讓它們的高度可以拉得很高（.thumb-wrap 本身還設了
  // overflow:visible，允許超出正方形格子），畫面上就是「直式很大、橫式
  // 很小」，這正是回報的成因。
  // 改成由 JS 直接依「目標面積」反推每張照片的寬高，不再依賴瀏覽器對
  // max-width/max-height 百分比的解析：先用跟原本 CSS 同一個比例
  // （52%）算出「正方形照片會有的面積」當基準面積，再依這張照片實際的
  // 寬高比（photo.aspect，來自 fetchDriveImages() 從 Google Drive
  // imageMediaMetadata 算出來的值）反推寬、高——這樣不管照片是橫的、
  // 直的、還是正方的，理論上佔的可視面積都會被拉到差不多大小，不會再有
  // 橫式明顯小、直式明顯大的落差。長寬比極端的照片（例如很長的全景照）
  // 會夾在 0.4~2.5 之間，避免被拉成一條極細的長條。
  const GRID_IMG_BOX_RATIO = 0.42; // 首頁縮圖整體再縮小一點：原本沿用舊版 CSS 的 0.52，
                                     // 使用者反應想要整體再縮小，調低這個比例即可讓每張
                                     // 照片的目標面積一起等比縮小（面積跟這個比例的平方成
                                     // 正比），不影響上面「依真實長寬比分配寬高」的邏輯。
  const GRID_IMG_ASPECT_MIN = 0.4;
  const GRID_IMG_ASPECT_MAX = 2.5;
  function applyGridItemImageSize(item, cellSide){
    if(!item || !cellSide) return; // 格子還沒有版面尺寸（例如尚未實際渲染），先不動，等下一次觸發再算
    const thumbWrap = item.querySelector('.thumb-wrap');
    const img = thumbWrap ? thumbWrap.querySelector('img') : null;
    if(!thumbWrap || !img) return;
    const photo = photos[Number(item.dataset.index)];
    const rawAspect = (photo && photo.aspect) ? photo.aspect : 1; // 沒有量到寬高比就退回正方形，維持原本行為
    const aspect = Math.min(GRID_IMG_ASPECT_MAX, Math.max(GRID_IMG_ASPECT_MIN, rawAspect));
    const boxSide = cellSide * GRID_IMG_BOX_RATIO;
    const targetArea = boxSide * boxSide; // 以「正方形照片會佔的面積」當成每張照片共同的目標面積
    // area = w*h，aspect = w/h → h = sqrt(area/aspect)，w = h*aspect
    const h = Math.sqrt(targetArea / aspect);
    const w = h * aspect;
    img.style.width = w + 'px';
    img.style.height = h + 'px';
  }

  // 單一格子場合使用（量這個格子自己的寬度、套用到自己身上）。renderGrid()
  // 現在改成批次處理、只量一次寬度套用到全部格子（見該函式的完整說明），
  // 不會再逐一呼叫這個函式；這裡保留給單一格子需要重新計算尺寸的情境用
  // （例如某張照片的寬高比事後才補齊、只需要更新那一個格子）。
  function sizeGridItemImage(item){
    if(!item) return;
    const thumbWrap = item.querySelector('.thumb-wrap');
    if(!thumbWrap) return;
    const cellSide = thumbWrap.getBoundingClientRect().width; // 正方形格子，寬=高，量寬即可
    applyGridItemImageSize(item, cellSide);
  }

  // 視窗尺寸改變（換欄數、橫直切換、雙指縮放結束…）會讓每張照片的格子
  // 寬度跟著變，所有已經渲染出來的縮圖尺寸都要一起重新算一次，理由同上。
  // 跟 positionAllGridIdx() 一樣掛在 syncFixedChrome() 這個共用入口，不用
  // 另外自己接 resize / orientationchange 事件。
  // 同樣道理：所有格子還是同一組等寬欄位分出來的，量一次「第一個」格子
  // 的寬度就對全部格子都準，不需要每個格子各自呼叫一次
  // getBoundingClientRect()、造成 resize 時的強制重排（理由見上面
  // renderGrid() 裡的完整說明）。
  function resizeAllGridImages(){
    if(!grid) return;
    const items = grid.querySelectorAll('.grid-item');
    if(!items.length) return;
    const firstWrap = items[0].querySelector('.thumb-wrap');
    const cellSide = firstWrap ? firstWrap.getBoundingClientRect().width : 0;
    items.forEach(item => applyGridItemImageSize(item, cellSide));
  }

  function positionGridIdxItem(item){
    if(!item) return;
    if(gridRevealInFlight) return; // 放大進場動畫播放中，照片尺寸暫時不可靠，見上面說明
    const thumbWrap = item.querySelector('.thumb-wrap');
    const img = thumbWrap ? thumbWrap.querySelector('img') : null;
    const idx = item.querySelector('.idx');
    if(!thumbWrap || !img || !idx) return;
    if(!img.classList.contains('loaded')) return; // 圖片還沒真正載入完成，尺寸不可靠，先不動、等 load 事件再算
    const wrapRect = thumbWrap.getBoundingClientRect();
    const imgRect = img.getBoundingClientRect();
    if(!imgRect.width || !imgRect.height) return; // 極端情況（例如剛好被隱藏）保底不動，維持原本的 0
    const left = Math.max(0, Math.round(imgRect.left - wrapRect.left));
    const top = Math.max(0, Math.round(imgRect.bottom - wrapRect.top)) + GRID_IDX_GAP;
    idx.style.left = left + 'px';
    idx.style.top = top + 'px';
  }

  // ---------- 修正「頭幾秒，飄動物件三不五時卡一下」的另一個成因：每張
  // 照片各自的 load 事件也會造成 layout thrashing ---------- 上面
  // positionAllGridIdx() 那次「保底補一次」的批次呼叫已經修好了（先全部
  // 讀完，再全部寫），但每一張照片「正常」載入完成時，img 的 load 事件
  // 監聽器（見下面 buildGridItem()）是直接呼叫 positionGridIdxItem(item)——
  // 這是「單一格子」版本，本身就是「讀（thumbWrap/img 各一次
  // getBoundingClientRect()）→寫（idx.style.left/top）」。單獨看一張圖片
  // 觸發一次，成本很小；但照片庫的圖片並不是一張一張間隔很久才載入完成，
  // 常常是一小串幾乎同時（例如同時從瀏覽器快取命中、或同一批網路請求前後
  // 腳完成）——每一張圖片自己的 load 事件都各自立刻做一次「讀→寫」，
  // 這一張的「寫」會讓下一張緊接著的「讀」必須先同步跑一次完整重排才拿得
  // 到正確數字，變成跟 renderGrid()／positionAllGridIdx() 原本那個問題一模
  // 一樣的 layout thrashing，只是這次是被「一連串幾乎同時觸發的 load
  // 事件」而不是「一次性的 forEach 迴圈」引發的——實際錄製 Performance
  // 效能紀錄可以看到，這正是「頭幾秒」這段時間內，一個一個接連出現、
  // 每次都要 40~76 毫秒的 load 事件長任務，飄動物件的 requestAnimationFrame
  // 迴圈被這些長任務一個接一個排在後面，肉眼看到的就是一陣一陣的卡頓。
  // 修法：不要在每張圖片的 load 事件裡「立刻」呼叫 positionGridIdxItem()，
  // 改成把這張圖片先丟進一個待處理清單，用 requestAnimationFrame 排一次
  // （如果已經排過就不重複排）——同一影格內、幾乎同時觸發的好幾個 load
  // 事件，都只會被塞進同一份待處理清單，等到這一影格真的要畫出來之前，
  // 才一次性地「先把清單裡全部的圖片都讀完版面尺寸，再一次性全部寫入」，
  // 這樣不管同時有幾張圖片剛好在同一小段時間內載入完成，一整批只會觸發
  // 最多一次強制重排，不會再隨載入圖片的數量線性增加。
  const pendingGridIdxPositionItems = new Set();
  let pendingGridIdxPositionRAF = null;
  function flushPendingGridIdxPositions(){
    pendingGridIdxPositionRAF = null;
    if(gridRevealInFlight){
      // 放大進場動畫還在播，尺寸暫時不可靠（理由同 positionGridIdxItem()
      // 內的判斷）——先不清空待處理清單，排到下一影格再檢查一次，動畫
      // 播完之後這裡自然就會補上；真正的「動畫播完保底補一次」仍然是
      // flushPendingGridIdxAfterReveal() 負責，這裡只是避免清單被誤清空。
      pendingGridIdxPositionRAF = requestAnimationFrame(flushPendingGridIdxPositions);
      return;
    }
    const items = Array.from(pendingGridIdxPositionItems);
    pendingGridIdxPositionItems.clear();
    const updates = [];
    items.forEach(item => {
      const thumbWrap = item.querySelector('.thumb-wrap');
      const img = thumbWrap ? thumbWrap.querySelector('img') : null;
      const idx = item.querySelector('.idx');
      if(!thumbWrap || !img || !idx) return;
      if(!img.classList.contains('loaded')) return;
      const wrapRect = thumbWrap.getBoundingClientRect();
      const imgRect = img.getBoundingClientRect();
      if(!imgRect.width || !imgRect.height) return;
      const left = Math.max(0, Math.round(imgRect.left - wrapRect.left));
      const top = Math.max(0, Math.round(imgRect.bottom - wrapRect.top)) + GRID_IDX_GAP;
      updates.push({ idx, left, top });
    });
    updates.forEach(({ idx, left, top }) => {
      idx.style.left = left + 'px';
      idx.style.top = top + 'px';
    });
  }
  function scheduleGridIdxPosition(item){
    if(!item) return;
    pendingGridIdxPositionItems.add(item);
    if(pendingGridIdxPositionRAF !== null) return; // 已經排過下一影格要處理，這張圖片搭同一班車就好，不用再排一次
    pendingGridIdxPositionRAF = requestAnimationFrame(flushPendingGridIdxPositions);
  }

  // 視窗尺寸改變（換欄數、橫直切換、雙指縮放結束…）會讓每張照片重新排版、
  // 實際渲染大小也會跟著變，所有已經渲染出來的編號都要一起重新算一次位置。
  // 這個函式會被排進跟其他版面對齊邏輯同一個入口 syncFixedChrome()（見下方），
  // 不需要另外自己接 resize / orientationchange 事件。
  // ---------- 修正「剛進站，飄動物件卡住不動很久，之後才又開始動」 ----------
  // 成因：這裡原本直接 grid.querySelectorAll('.grid-item').forEach(positionGridIdxItem)——
  // positionGridIdxItem() 每個格子都會先「讀」（thumbWrap/img 各呼叫一次
  // getBoundingClientRect()），緊接著「寫」（idx.style.left/top）。上百個
  // 格子這樣一路讀、寫、讀、寫地交替下去，每一次「寫」都會讓瀏覽器上一輪
  // 量到的版面資訊失效，逼得緊接在後面的「讀」必須先同步跑一次完整的頁面
  // 重新排版（forced synchronous layout）才拿得到正確數字——這就是經典的
  // 「layout thrashing」，整個網格跑一輪要付出的代價，不是「量一次版面」
  // 的成本，而是「量一次版面 × 格子數量」，網格照片一多（上百張），這一輪
  // forEach 可能要跑到幾百毫秒甚至更久。
  // 這一段是 renderGrid() 全部批次都建置完成後、透過 onComplete 呼叫的
  // 「保底補一次」動作（見上面呼叫端的說明），换句話說會在使用者剛進站
  // 沒多久、網格分批建置完的那一刻，一次性地整段同步執行——這段同步 JS
  // 執行期間，瀏覽器沒有機會畫出下一影格，飄動的 e 那套
  // requestAnimationFrame 迴圈（stepDvdBounce）雖然照常在背景排隊，但要
  // 等這整段跑完才輪得到它，肉眼看到的就是「飄動物件忽然卡住不動一段
  // 時間」；等這段終於跑完，飄動迴圈才終於接手繼續畫，看起來像「卡住很久
  // 之後又開始動了」——這正是這次回報的成因，跟碰撞判斷、圖片庫本身都
  // 無關，純粹是這裡的讀寫交替方式太貴。
  // 修法：跟 renderGrid() 同一批次內「先組好、一次 appendChild」的精神一樣，
  // 把「讀」跟「寫」拆成兩輪各自集中處理——先用一輪 forEach 把每個格子
  // 需要的 wrapRect/imgRect 全部讀完、算好 left/top 存進陣列，讀的這一輪
  // 完全不寫任何 style，版面不會被中途弄髒，瀏覽器只需要在第一次讀取前
  // 排版一次；讀完之後才用第二輪 forEach 把算好的數字一次寫進去，寫的這
  // 一輪不再讀任何版面資訊，也不會觸發強制重排。總運算量（讀幾次、寫幾次）
  // 完全沒變，純粹是把「讀寫交替」改成「先全部讀、再全部寫」，強制重排的
  // 次數就從「格子數量」降到最多 1 次，這一輪保底補位不再是main thread的
  // 卡點。
  function positionAllGridIdx(){
    if(!grid) return;
    if(gridRevealInFlight) return; // 理由同 positionGridIdxItem() 內的同一個判斷
    const items = grid.querySelectorAll('.grid-item');
    const updates = [];
    items.forEach(item => {
      const thumbWrap = item.querySelector('.thumb-wrap');
      const img = thumbWrap ? thumbWrap.querySelector('img') : null;
      const idx = item.querySelector('.idx');
      if(!thumbWrap || !img || !idx) return;
      if(!img.classList.contains('loaded')) return; // 理由同 positionGridIdxItem()：圖片還沒真正載入完成，尺寸不可靠
      const wrapRect = thumbWrap.getBoundingClientRect();
      const imgRect = img.getBoundingClientRect();
      if(!imgRect.width || !imgRect.height) return;
      const left = Math.max(0, Math.round(imgRect.left - wrapRect.left));
      const top = Math.max(0, Math.round(imgRect.bottom - wrapRect.top)) + GRID_IDX_GAP;
      updates.push({ idx, left, top });
    });
    updates.forEach(({ idx, left, top }) => {
      idx.style.left = left + 'px';
      idx.style.top = top + 'px';
    });
  }

  // ---------- 首頁「滑鼠引力放大」特效（桌機版） ----------
  // 原本是二元式的 CSS :hover：滑鼠移到某一張照片上，只有那一張會瞬間
  // 跳到 1.12 倍。現在改成「滑鼠本身像有引力」：不管游標落在網頁空間的
  // 哪個位置，都會持續影響它附近所有照片——距離游標越近的照片放大得越多
  // （上限見下面 MAGNET_MAX_SCALE），越遠越接近原始大小，超出有效
  // 範圍（MAGNET_RADIUS）就完全不受影響；可以同時有好幾張照片一起、各自
  // 依照跟游標的距離做出不同程度的反應。
  //
  // 每一張照片各自維護一個「目前縮放值」跟「目標縮放值」，每個
  // requestAnimationFrame 影格都用 exponential smoothing（跟實際經過的
  // 時間差掛勾，不是固定寫死的比例，畫面更新頻率不同也不會跑出不一樣的
  // 手感）把「目前值」平滑地追向「目標值」，才真的寫進 img.style.transform——
  // 不是每次滑鼠移動就直接跳到目標值，也不是交給 CSS transition 處理
  // （CSS transition 只認「這一次」的起點/終點，滑鼠連續移動時目標值一直
  // 在變，會疊出一段一段的生硬轉折，感覺不出「流體」的重量感）。這樣放大／
  // 縮小才會有一種被慣性、阻尼拖住的物理流暢感，而不是機械式的線性跟隨。
  //
  // 編號（.idx）貼齊照片實際邊緣的邏輯完全沿用 positionGridIdxItem()——
  // 只是現在每一影格都重新呼叫一次，讓它跟著連續變化的縮放同步移動，
  // 天然保持「編號永遠貼著照片這一刻實際的左邊緣、下緣」，跟改版前的
  // 對齊邏輯本身沒有任何不同。
  //
  // 只在真正支援滑鼠 hover 的桌機環境（supportsHover）啟用；觸控裝置沒有
  // 游標懸停這件事，維持原本點擊直接進入詳細頁的行為，完全不受影響。
  if(supportsHover && grid){
    // 半徑刻意加大到「四張照片交界處的空白區域」都還在有效範圍內：桌機
    // 5 欄版面下，兩張相鄰照片中心之間的間距（欄寬 + var(--gap)）大約落在
    // 250~340px 之間，四張照片交界的角落到每張照片中心的距離，大約是這個
    // 間距的 0.7 倍（對角線的一半）；600px 的半徑留了充足的餘裕，滑鼠停在
    // 任何四張照片中間的空白角落時，四張都還在放大範圍內，會一起被引力
    // 稍微拉大，不會有「明明離四張都很近、卻一張都沒反應」的死角。
    const MAGNET_RADIUS = 600;   // px，游標「引力」的有效範圍半徑，超出這個距離的照片維持原始大小
    const MAGNET_MAX_SCALE = 1.35; // 游標正中心那一點的最大放大倍率——比原本二元式 hover
                                    // 的 1.12 明顯更有份量，讓「被引力吸住」的視覺效果更清楚
    const MAGNET_RESPONSE_MS = 140; // 追向目標縮放值的反應時間常數（越小追得越快、
                                     // 越貼手；越大越有「拖著慢慢跟上」的重量感）
    const MAGNET_SETTLE_EPS = 0.0008; // 目前值/目標值都幾乎等於原始大小時，視為已完全
                                       // 靜止，停止繼續寫入 style、省不必要的重繪

    // 首頁縮圖「放大進場」動畫播完的那一刻，引力「強度」（不是縮放值本身）
    // 從 0 緩慢爬升到 100% 所花的時間。原本只把 magnetScaleState 重設回 1
    // （見 resetMagnetScaleForReveal），但那只解決了「用到凍結前殘留舊數字」
    // 的問題——如果使用者這時候滑鼠剛好已經停在某張縮圖正上方，
    // magnetFalloff() 在第一影格就會算出接近 MAGNET_MAX_SCALE 的目標值，
    // current 雖然是從 1 開始追，但追的目標本身一開始就已經是滿的，配合
    // MAGNET_RESPONSE_MS=140 這種「貼手」的反應速度，整個過程仍會在
    // 300~400ms 內衝到頂，感覺還是像「一放大完，馬上又被引力猛拉一下」，
    // 不是使用者想要的「緩慢、從沒有到有」的啟動手感。
    // 真正的修法是讓「引力強度」本身也有一段爬升期：這段期間內，不管滑鼠
    // 離哪張縮圖多近，目標縮放值都只能拿到 magnetFalloff() 算出來的「完整
    // 引力效果」乘上一個從 0 慢慢爬到 1 的係數（見下面 magnetFrame() 裡的
    // rampFactor），這樣不管滑鼠停在哪裡，引力都會像剛通電、慢慢暖機一樣
    // 溫和地長出來，而不是一開始就用滿力去追。900ms 刻意跟放大進場動畫的
    // 900ms 同一個量級，讓「照片長大」跟「引力甦醒」感覺起來是同一套節奏的
    // 兩個階段，不是兩件互相搶戲的動畫。
    const MAGNET_REVEAL_RAMP_MS = 900;

    let magnetMouseX = 0;
    let magnetMouseY = 0;
    let magnetActive = false;   // 滑鼠目前是否在視窗內、有提供有效座標
    let magnetLastFrameTime = null;
    const magnetScaleState = new WeakMap(); // item -> 目前實際套用的縮放值
    // null = 引力目前是滿強度（平常狀態，一般 hover 時都是這樣）；非 null
    // 時代表「引力強度」還在爬升中，值是爬升起點的時間戳，跟 rAF 傳進
    // magnetFrame() 的 now 用同一個時間基準（都是 performance.now()），
    // 兩者可以直接相減算經過的時間。由 resetMagnetScaleForReveal() 在放大
    // 進場動畫播完那一刻設定成當下時間，啟動這段爬升。
    let magnetRevealRampStart = null;

    // 效能優化：grid.querySelectorAll('.grid-item') 以及每張照片內的
    // querySelector('.thumb-wrap img') 原本是「每一個 rAF 影格」都重新查詢
    // 一次 DOM——這個迴圈只要頁面開著就會以 60fps 永久跑下去（不只滑鼠
    // 移動時才跑，見下面 magnetFrame() 開頭無條件 requestAnimationFrame
    // 自我排程），等於任何時候（包含滑鼠完全沒動、甚至使用者正在
    // preview/detail 頁而看不到網格）都在白白重複查詢一次完整的 DOM 樹。
    // renderGrid() 整個網站生命週期只會呼叫一次（進站時），之後這批
    // .grid-item 元素不會再被替換或新增，所以在這裡快取一份對照表
    // （item / thumbWrap / img 三者的參照）完全安全，之後每一影格直接
    // 走陣列即可，不用再付一次 DOM 查詢的成本；行為（哪些照片受影響、
    // 縮放的數值與時機）完全不變，純粹是換一種更便宜的方式拿到同樣的
    // 元素參照。
    let magnetItemsCache = null;
    function getMagnetItems(){
      if(!magnetItemsCache){
        const nodeList = grid.querySelectorAll('.grid-item');
        if(nodeList.length){
          magnetItemsCache = Array.from(nodeList).map(item => {
            const thumbWrap = item.querySelector('.thumb-wrap');
            const idx = item.querySelector('.idx');
            return { item, thumbWrap, img: thumbWrap ? thumbWrap.querySelector('img') : null, idx };
          });
        }
      }
      return magnetItemsCache || [];
    }

    // 距離 → 目標縮放倍率：游標正上方（距離 0）是放大倍率上限，隨距離
    // 拉開用 smoothstep 曲線（3t²-2t³）平滑衰減到 1（原始大小），超出
    // MAGNET_RADIUS 一律是 1。smoothstep 讓「剛開始被拉近」跟「快要恢復
    // 原狀」這兩端的變化速度都比較和緩，只有中段變化較快，比單純線性衰減
    // 更接近真實世界引力場那種柔和、有機的手感；半徑加大後，同一時間會有
    // 更多張照片落在衰減曲線的「前段」（輕微放大），中間游標正下方那一張
    // 才會吃到接近滿倍率的放大，層次感比小半徑時更明顯。
    function magnetFalloff(distance){
      if(distance >= MAGNET_RADIUS) return 1;
      const t = 1 - (distance / MAGNET_RADIUS);
      const smooth = t * t * (3 - 2 * t);
      return 1 + (MAGNET_MAX_SCALE - 1) * smooth;
    }

    function magnetFrame(now){
      requestAnimationFrame(magnetFrame);

      // 首頁縮圖「放大進場」動畫播放期間，img.style.transform 由那段動畫
      // 自己接管（見 gridRevealInFlight），這裡整輪跳過，避免兩邊互搶
      // 同一個 style 屬性、打架出詭異的閃爍或跳動。
      if(gridRevealInFlight){ magnetLastFrameTime = now; return; }

      // 照片物理堆疊模式（entering/active/exiting）期間，首頁縮圖被
      // shrinkHomeForPhotoFall() 收起、整個格子畫面理當是「凍結」的靜止
      // 狀態，不該再受滑鼠移動影響——但這個模式全程只有 gridRevealInFlight
      // 曾經被檢查，magnetFrame() 完全不認得堆疊模式自己的旗標
      // photoFallModeActive，導致堆疊模式期間只要滑鼠靠近某張縮圖原本
      // 所在的位置，這裡還是會繼續每一影格改寫那張縮圖的 img.style.transform
      // （直接蓋掉 shrinkHomeForPhotoFall() 設定的 scale(0) 收起效果）並
      // 呼叫 positionGridIdxItem() 重新定位編號，兩者都用「引力縮放後」的
      // 錯誤數值——等退出堆疊模式、prepareGridRevealState() 量測時，這些
      // 被引力持續影響過的照片，編號位置就會跟其他正常照片不一致，也就是
      // 「只有滑鼠附近的照片編號會錯位」的成因。這裡補上跟 gridRevealInFlight
      // 一樣的提早跳出，讓整個堆疊模式期間引力效果完全靜止、不碰任何首頁
      // 縮圖或編號，退出後再由 resetMagnetScaleForReveal() 的爬升期讓引力
      // 從沒有到有、慢慢重新生效。
      if(photoFallModeActive){ magnetLastFrameTime = now; return; }

      // ---------- 修正：這個磁吸迴圈原本不管使用者在哪一頁都会以 60fps
      // 永久跑下去（見上面 magnetItemsCache 那段註解也承認了這個浪費，
      // 但當時只解決了「重複查詢 DOM」，沒有解決「preview／detail 頁完全
      // 看不到網格，卻還在每一影格對著全部縮圖跑迴圈」這件事本身）。
      // 這個迴圈跟飄動物件的 stepDvdBounce()、fsTick() 等其他 RAF 迴圈是
      // 同一個主執行緒、同一輪 requestAnimationFrame 批次一起執行的——
      // 網格縮圖一多（上百張），每一影格白白多跑這一輪 forEach，會墊高
      // 這一整輪 RAF 的執行時間，容易造成掉幀；掉幀之後下一次 stepDvdBounce()
      // 拿到的 dt（影格間隔）會變大，飄動的 e 一次移動的距離也跟著變大，
      // 肉眼看起來就像「忽然跳了一段」——這正是「preview 頁還會跟著一起
      // 卡頓／飄動物件不定時跳一下」的成因之一，跟碰撞判斷本身無關，
      // 純粹是背景多跑了一個沒必要的迴圈拖慢了整體幀率。
      // 修法：只有真的在首頁格子畫面（gallery）時才需要跑這個磁吸效果，
      // preview／detail 頁完全用不到、也看不到網格，直接提早跳出，不做
      // 任何 forEach／getBoundingClientRect／style 寫入，把這一輪 RAF 的
      // 執行時間還給其他真正需要跑的迴圈。
      if(previewPage.classList.contains('active') || detailPage.classList.contains('active')){
        magnetLastFrameTime = now;
        return;
      }

      if(magnetLastFrameTime == null) magnetLastFrameTime = now;
      const dt = Math.min(64, now - magnetLastFrameTime); // 上限 64ms：分頁切走再切回來、
                                                            // 或掉幀時，不要讓追趕的那一步跳太大
      magnetLastFrameTime = now;
      const smoothFactor = 1 - Math.exp(-dt / MAGNET_RESPONSE_MS);

      // 「引力強度」爬升係數：0 代表這一刻引力完全不生效（不管滑鼠多近，
      // 目標值都固定是 1，等同原始大小），1 代表引力已經是平常的滿強度。
      // 只在 magnetRevealRampStart 有值（爬升進行中）時才需要計算，並在
      // 爬滿之後把旗標清掉、之後每一影格都直接視為滿強度、不再多做這段
      // 判斷，避免長期在收斂狀態下也要重複算这個。用跟 magnetFalloff()
      // 一樣的 smoothstep 曲線（3t²-2t³）：爬升的頭尾都慢、中段快，跟
      // 「引力場慢慢甦醒」的物理直覺更接近，而不是等速的機械爬升。
      let rampFactor = 1;
      if(magnetRevealRampStart != null){
        const elapsed = now - magnetRevealRampStart;
        if(elapsed >= MAGNET_REVEAL_RAMP_MS){
          magnetRevealRampStart = null;
        } else {
          const rt = Math.max(0, elapsed) / MAGNET_REVEAL_RAMP_MS;
          rampFactor = rt * rt * (3 - 2 * rt);
        }
      }

      // ---------- 修正：「飄動物件移動中偶爾還會小小卡lag一下」 ----------
      // 原本這裡是單一個 forEach，對每張照片依序做「讀 wrapRect（算跟滑鼠
      // 的距離）→ 寫 img.style.transform → 呼叫 positionGridIdxItem()（裡面
      // 又是讀 wrapRect/imgRect → 寫 idx.style.left/top）」——一張接一張，
      // 讀、寫、讀、寫交替下去。上百張照片這樣跑，每一次「寫」都會讓瀏覽器
      // 上一輪量到的版面資訊失效，逼得緊接在後面的「讀」必須先同步跑一次
      // 完整的頁面重新排版（forced synchronous layout）才拿得到正確數字，
      // 這正是經典的「layout thrashing」——跟上面 positionAllGridIdx() 當初
      // 那次「剛進站，飄動物件卡住不動很久」修的是同一種成因，只是這裡是
      // magnetFrame() 這個永遠跟著滑鼠移動、以 60fps 常態在跑的迴圈，不是
      // 只跑一次的保底補位，所以只要滑鼠停在首頁格子上移動，這筆 layout
      // thrashing 的成本就會每一影格重複發生一次。這個迴圈跟飄動的 e 那套
      // stepDvdBounce() 是同一個主執行緒、同一輪 requestAnimationFrame 批次
      // 一起跑的，這裡多花的時間會直接墊高整輪 RAF 的執行時間、容易掉幀，
      // 掉幀之後 stepDvdBounce() 拿到的 dt 變大，飄動的 e 一次移動的距離
      // 也跟著變大，肉眼看起來就是「移動中偶爾小小卡一下、跳一下」。
      // 修法：跟 positionAllGridIdx() 同一個精神，把「讀」跟「寫」拆開集中
      // 處理，不要讓它們在同一輪迴圈裡逐張穿插：
      //   1) 第一輪只讀 wrapRect（算跟滑鼠的距離）、算出新的縮放值，不寫
      //      任何 style，版面全程不會被弄髒。
      //   2) 第二輪把所有照片的 img.style.transform 一次寫完（含歸零）。
      //   3) 第三輪：idx 編號要貼齊的是「縮放後」的實際邊緣，所以一定要
      //      等上面的 transform 真的寫進去才讀得到正確數字——這裡才需要
      //      再讀一次 wrapRect/imgRect，但集中在同一輪讀完，不會再跟寫
      //      交替。
      //   4) 第四輪把算好的 idx left/top 一次寫完。
      // 總共只需要「一次寫→一次讀」這一個交界會觸發一次強制重排，不管
      // 網格有幾百張照片，強制重排的次數都固定是 1 次，不會再隨照片數量
      // 線性增加。
      const magnetPending = [];
      getMagnetItems().forEach(({ item, thumbWrap, img, idx }) => {
        if(!img || !img.classList.contains('loaded')) return;

        let target = 1;
        if(magnetActive && thumbWrap){
          const wrapRect = thumbWrap.getBoundingClientRect();
          const cx = wrapRect.left + wrapRect.width / 2;
          const cy = wrapRect.top + wrapRect.height / 2;
          const dx = magnetMouseX - cx;
          const dy = magnetMouseY - cy;
          const fullTarget = magnetFalloff(Math.sqrt(dx * dx + dy * dy));
          // 引力還在爬升期間：只給「完整效果」的 rampFactor 比例，其餘
          // 部分視為還沒生效，這樣不管滑鼠這一刻離哪張縮圖多近，都不會
          // 讓爬升期的目標值突然衝滿，達到「從沒有到有，慢慢長出引力」
          // 的效果。爬滿之後 rampFactor 恆為 1，跟原本行為完全相同。
          target = 1 + (fullTarget - 1) * rampFactor;
        }

        let current = magnetScaleState.get(item);
        if(current == null) current = 1;
        current += (target - current) * smoothFactor;

        const settled = Math.abs(current - target) < MAGNET_SETTLE_EPS && Math.abs(target - 1) < MAGNET_SETTLE_EPS;
        // hadTransform：這張照片「這一影格開始前」是不是還帶著 inline
        // transform——settled 情況下只有原本還有 transform 才需要真的寫一次
        // 歸零並重新貼齊編號，已經是原始大小、且本來就沒有 inline transform
        // 的照片，維持原本「不用每影格都碰它」的省電行為，不放進待處理清單。
        const hadTransform = !!img.style.transform;
        if(settled && !hadTransform) return;
        magnetPending.push({ item, thumbWrap, img, idx, current, settled });
      });

      // 寫階段：先把這一輪所有照片的 transform（含歸零）一次寫完，這一輪
      // 完全不讀取任何版面資訊，不會被上面已經讀好的 wrapRect 弄髒。
      magnetPending.forEach(({ item, img, current, settled }) => {
        if(settled){
          img.style.transform = '';
          magnetScaleState.set(item, 1);
        } else {
          magnetScaleState.set(item, current);
          img.style.transform = `scale(${current.toFixed(4)})`;
        }
      });

      // 讀階段：上面這輪 transform 寫完之後，每張照片的編號位置才可能
      // 真的變了（idx 貼齊的是縮放後的實際邊緣），這裡才需要重新讀一次
      // wrapRect/imgRect——集中在同一輪讀完，不會再跟上面的寫穿插。
      const idxUpdates = [];
      magnetPending.forEach(({ thumbWrap, img, idx }) => {
        if(!thumbWrap || !img || !idx) return;
        const wrapRect = thumbWrap.getBoundingClientRect();
        const imgRect = img.getBoundingClientRect();
        if(!imgRect.width || !imgRect.height) return; // 極端情況（例如剛好被隱藏）保底不動
        const left = Math.max(0, Math.round(imgRect.left - wrapRect.left));
        const top = Math.max(0, Math.round(imgRect.bottom - wrapRect.top)) + GRID_IDX_GAP;
        idxUpdates.push({ idx, left, top });
      });

      // 寫階段：idx 的 left/top 也集中在最後一次寫完。
      idxUpdates.forEach(({ idx, left, top }) => {
        idx.style.left = left + 'px';
        idx.style.top = top + 'px';
      });
    }

    window.addEventListener('mousemove', (e) => {
      magnetMouseX = e.clientX;
      magnetMouseY = e.clientY;
      magnetActive = true;
    }, { passive: true });

    // 滑鼠離開整個瀏覽器視窗（例如移到網址列、切到別的視窗）：引力來源
    // 消失，所有照片自然平滑地收斂回原始大小，不會卡在放大狀態。
    window.addEventListener('mouseout', (e) => {
      if(!e.relatedTarget && !e.toElement) magnetActive = false;
    });
    window.addEventListener('blur', () => { magnetActive = false; });

    // 分頁切到背景時，rAF 本來就會被瀏覽器自動節流；切回來的那一刻把
    // 「上一影格時間」重設掉，避免拿背景期間累積的超長 dt 一次追趕跳動。
    document.addEventListener('visibilitychange', () => {
      if(!document.hidden) magnetLastFrameTime = null;
    });

    requestAnimationFrame(magnetFrame);

    // 覆寫外層預設的空函式，接上真正的重設實作（見上面
    // resetMagnetScaleForReveal 宣告處的完整說明）：把每張照片的
    // magnetScaleState 都設回 1、magnetLastFrameTime 歸零，並啟動
    // 「引力強度」的爬升期（magnetRevealRampStart = 這一刻的時間戳），讓
    // playGridRevealAnimation() 收尾時可以呼叫這個函式，確保「放大進場」
    // 動畫播完的那一刻，magnetFrame() 不只是從跟畫面實際大小一致的 1
    // 重新開始追，追的目標本身也會先從 0 強度開始、花 MAGNET_REVEAL_RAMP_MS
    // 慢慢暖機到滿強度——整體效果就是「照片都放大完成之後，引力才用一個
    // 成熟、物理流暢的慢速開始生效」，不會有任何無過渡的瞬間跳動。
    resetMagnetScaleForReveal = function(){
      getMagnetItems().forEach(({ item }) => {
        magnetScaleState.set(item, 1);
      });
      magnetLastFrameTime = null;
      magnetRevealRampStart = performance.now();
    };
  }

  // 圖片載入完成時，如果編號正處於「待補」狀態（見 prepareGridRevealState()
  // 內對 dataset.revealPending 的完整說明：放大進場動畫觸發時這張圖片還沒
  // 載入完成，編號被延後處理），這裡負責把編號真正定位、淡入補上。
  //
  // 這裡特別處理一種時間差：如果圖片剛好是在放大進場動畫「播放期間」才
  // 真正載入完成（gridRevealInFlight 仍是 true），此時 positionGridIdxItem()
  // 會被自己的保護機制跳過（照片這一刻還在動畫中間、尺寸不可靠，見該函式
  // 說明），沒辦法量出正確位置——這裡先不處理，只是先不清掉
  // revealPending 這個標記，等動畫真正播完（gridRevealInFlight 變回
  // false）之後，由 playGridRevealAnimation() 的收尾流程統一補一次
  // （見下面 flushPendingGridIdxAfterReveal()），確保一定會用「動畫結束後
  // 的最終尺寸」來定位，不會有一半機率抓到動畫中間的暫時尺寸。
  function catchUpPendingGridIdx(item){
    if(!item) return;
    const idx = item.querySelector('.idx');
    if(!idx || idx.dataset.revealPending !== '1') return;
    if(gridRevealInFlight) return; // 動畫還在播，稍後由 flushPendingGridIdxAfterReveal() 統一補上
    positionGridIdxItem(item);
    delete idx.dataset.revealPending;
    idx.style.transition = 'none';
    idx.style.transform = 'translateX(0)';
    void idx.offsetWidth; // 強制 reflow，確保上面「瞬間歸位」先套用一次，才接上淡入
    idx.style.transition = `opacity ${GRID_REVEAL_MS}ms ${GRID_REVEAL_EASE}`;
    requestAnimationFrame(() => { idx.style.opacity = '1'; });
    clearTimeout(idx._revealCatchupTimer);
    idx._revealCatchupTimer = setTimeout(() => {
      idx.style.transition = '';
      idx.style.opacity = '';
    }, GRID_REVEAL_MS + 60);
  }

  // 放大進場動畫真正播完（gridRevealInFlight 剛變回 false）之後呼叫一次：
  // 掃過所有還標記著「待補」的編號，這時候如果對應的圖片其實已經載入
  // 完成（只是載入完成的時間點剛好卡在動畫播放中間，被 catchUpPendingGridIdx()
  // 延後了），現在動畫已經結束、照片尺寸已經穩定在最終大小，可以放心量測、
  // 補上正確位置並淡入了。
  function flushPendingGridIdxAfterReveal(){
    if(!grid) return;
    grid.querySelectorAll('.grid-item').forEach(item => {
      const img = item.querySelector('.thumb-wrap img');
      const idx = item.querySelector('.idx');
      if(idx && idx.dataset.revealPending === '1' && img && img.classList.contains('loaded')){
        catchUpPendingGridIdx(item);
      }
    });
  }

  // 建立單一個 .grid-item（DOM 節點＋所有事件監聽器），純粹組資料、不做
  // 任何讀取版面尺寸的動作——維持跟原本完全一樣的行為，只是抽成獨立函式，
  // 讓下面 renderGrid() 可以分批呼叫它。
  function buildGridItem(photo, i){
    const item = document.createElement('div');
    item.className = 'grid-item';
    item.dataset.index = i;

    const thumbWrap = document.createElement('div');
    thumbWrap.className = 'thumb-wrap';

    const img = document.createElement('img');
    img.alt = photo.title;
    img.draggable = false;
    img.decoding = 'async'; // 解碼不卡主執行緒，捲動/縮放更順
    // 手機沒有 hover 預覽功能，用瀏覽器原生 lazy loading 讓非畫面內的縮圖
    // 延後下載，省流量、加快第一批可見縮圖出現的速度；桌機保留即時載入，
    // 確保滑鼠移過去的當下大圖預覽完全不用等。
    // 但前 GRID_EAGER_COUNT 張是「一打開就看得到」的第一畫面內容，不管
    // 手機還是桌機都明確設成 eager + 高優先度，不要被當成可以延後的資源。
    if(i < GRID_EAGER_COUNT){
      img.loading = 'eager';
      try { img.fetchPriority = 'high'; } catch(e){} // 不支援的瀏覽器就當作沒設定，不影響原本行為
    } else if(supportsTouch){
      img.loading = 'lazy';
    }
    img.addEventListener('load', () => {
      img.classList.add('loaded');
      // 圖片這一刻才真正知道自己渲染出來的實際大小／位置，載入完成後
      // 要把這張照片對應的編號（.idx）重新定位到「照片本身」的右下角，
      // 見上面 positionGridIdxItem()（放大進場動畫播放中會被該函式自己的
      // gridRevealInFlight 保護跳過，見下面 catchUpPendingGridIdx() 的
      // 說明）。改用 scheduleGridIdxPosition() 排隊＋批次處理（見該函式
      // 上方的完整說明），不要在這裡直接呼叫 positionGridIdxItem()：一
      // 連串幾乎同時載入完成的照片，各自立刻讀寫版面尺寸會造成 layout
      // thrashing，這正是「頭幾秒飄動物件一陣一陣卡頓」的成因之一。
      scheduleGridIdxPosition(item);
      catchUpPendingGridIdx(item);
    });
    if(i === 0 || i === 1 || i === 3){
      // "photobook by edenchen"（header-left）對齊 001、"preview" 標籤對齊
      // 002、"collab" 區塊（header-right）對齊 004，三張圖片各自要等自己
      // 真的渲染出寬度才能算準對齊，所以各自掛一個 load 監聽器。
      //
      // 這裡原本各自只呼叫自己需要的那幾個函式（例如 001 只呼叫
      // syncHeaderLeftAlignment/positionNavHorizontal/fitCollabWidth，
      // 002 只呼叫 syncPreviewAlignment），而不是完整的 syncFixedChrome()
      // ——這正是「點一下照片，上面 photo／preview 標題有時候會閃一下或
      // 跳一下」的成因：001/002/004 這三張縮圖不一定同時載入完成，如果
      // 使用者剛好在其中一張還沒 load 完的時候點擊照片，會發生兩批呼叫
      // 互相插隊——openDetail() 自己那次 syncFixedChrome() 是「完整、
      // 依照固定順序」重算一輪（順序見該函式的說明，例如
      // positionNavHorizontal 一定要在 syncHeaderLeftAlignment 之後），
      // 但這裡各張圖片的 load 監聽器卻是「只算其中一部分」、且觸發時間點
      // 完全獨立於那個順序之外，兩邊各自用不同的中間狀態算出來的位置可能
      // 對不上，畫面上就是「標題先對齊到一半、下一刻又被另一邊蓋過去」
      // 這種閃一下/跳一下的感覺。
      //
      // 修法：不管哪一張圖片 load 完成，一律呼叫同一個完整、順序固定的
      // syncFixedChrome()（跟 openDetail()／openPreviewPage() 用的是同一個
      // 入口），這樣不管觸發順序、時間點怎麼交錯，每一次重算都是根據當下
      // 最新狀態、用同一套順序算出全部數字，不會再有「只算了一半」的
      // 中間狀態被畫出來。
      img.addEventListener('load', syncFixedChrome);
    }
    img.onerror = () => {
      // 縮圖失敗 → 換大一點的備援縮圖 → 最後才退回原始全尺寸檔案
      if(photo.gridUrl && img.src !== photo.gridUrl){
        // 理論上不會走到這裡（第一次就是設成 gridUrl），保留只是防呆
        img.src = photo.gridUrl;
      } else if(photo.thumbUrl && img.src !== photo.thumbUrl){
        img.src = photo.thumbUrl;
      } else if(photo.fallbackUrl && img.src !== photo.fallbackUrl){
        img.src = photo.fallbackUrl;
      } else if(img.src !== photo.url){
        img.src = photo.url;
      }
    };
    img.src = photo.gridUrl || photo.thumbUrl || photo.url; // 網格用最小的縮圖，快很多；大圖頁另外載入原始檔

    thumbWrap.appendChild(img);

    const idx = document.createElement('div');
    idx.className = 'idx';
    idx.textContent = formatPhotoIndex(i + 1);

    item.appendChild(thumbWrap);
    item.appendChild(idx);

    item.addEventListener('click', () => openDetail(i, img));
    // click 事件要等「按下＋放開」都完成才會觸發，pointerdown 只要手指／
    // 滑鼠一按下去就會先觸發（滑鼠通常領先 click 幾十到一百多毫秒，觸控
    // 領先得更多，因為還要再等放開）。這裡搶在 click 之前，先把這張照片
    // 的高畫質版本（大圖頁 renderDetailFull() 實際會用到的同一批來源）
    // 送出下載請求——等真正觸發 openDetail() 時，高畫質很有機會已經下載
    // 完成或接近完成，暖場縮圖跟高畫質之間「先顯示低畫質、再無聲換成高
    // 畫質」這段過渡窗口會被縮短，甚至完全感覺不到有替換這件事。
    // prefetchOne() 內建 prefetchedUrls 去重，就算之後 renderDetailFull()
    // 或背景預抓又對同一個網址呼叫一次，也不會重複發出請求。
    item.addEventListener('pointerdown', () => {
      prefetchOne(photo.detailUrlMobile || photo.detailUrl || photo.fallbackUrl || photo.url);
      // 手機版縮圖用 loading="lazy"（見上面），如果使用者剛好在縮圖
      // 都還沒下載完的當下就點下去，openDetail() 裡的 canFlip 檢查會
      // 因為 img 還沒 complete 而失敗，整個「縮圖放大飛到大圖」的
      // FLIP 動畫就會被跳過、改用陽春的淡入，看起來像是「彈出來」而
      // 不是像桌機版那樣物理、線性地放大移動出來。搶在 click 觸發之前
      // （pointerdown 領先 click 一段時間，見上方註解）把這張縮圖從
      // lazy 切成 eager，讓瀏覽器提早開始下載，盡量讓它在 click 真正
      // 觸發、openDetail() 判斷 canFlip 的那一刻已經讀完，兩個平台的
      // 開場動畫才會一致。
      if(img.loading === 'lazy') img.loading = 'eager';
    }, { passive: true });
    if(supportsHover){
      img.addEventListener('mouseenter', () => showHoverPreview(photo, img));
      img.addEventListener('mouseleave', hideHoverPreview);
    }
    return item;
  }

  // ---------- 修正「頭幾秒還是會lag」剩下的主因：renderGrid() 本身還是
  // 一整段連續同步工作 ----------
  // 上一輪修法（見下面保留的說明）已經解決了「組 DOM／量尺寸交替讀寫」
  // 造成的強制重排，但沒解決另一件事：不管有沒有 layout thrashing，「幫
  // 上百張照片各自 createElement／掛好幾個事件監聽器」這件事本身，就是
  // 一段要花真實時間跑完的 JS——這整段又是包在單一次 requestIdleCallback
  // 裡一次做完（見下面呼叫端 buildGridDeferred() 的說明），瀏覽器只要
  // 認定「閒下來了」（或逾時到了）就會整批一次執行到底，不會主動中斷。
  // 執行的這段時間裡，主執行緒被這一整批 DOM 建置工作獨佔，飄動的 e
  // 那套 requestAnimationFrame 迴圈、preview 頁的觸控／點擊，全部都要
  // 排在後面等——這正是使用者形容「剛進站頭幾秒還是會卡一下」剩下的
  // 主要成因：不是網路慢，也不是裁切圖片的運算，是「網格建置」這件事
  // 本身還沒被拆開，一次執行時間可能就有幾十到上百毫秒，恰好落在使用者
  // 剛進站、還在看飄動物件的這幾秒之內。
  // 修法：跟上面 trimDvdEImagesStaggered() 用同一套「切成小批、每批之間
  // 讓出主執行緒」的手法——改成一次只組 GRID_RENDER_CHUNK_SIZE 張，
  // appendChild 進真正的 grid（同一批內部沒有交替讀寫，維持不觸發多次
  // 重排這個優點），排到下一次 requestIdleCallback 才繼續組下一批，直到
  // 全部照片都處理完。「量第一個格子寬度、套用到全部格子」這件事只需要
  // 做一次（見下面 cellSide 變數），第一批處理完、量出寬度之後，直接
  // 沿用同一個數字套用到後面每一批新建立的格子，不用每批都重新量一次。
  const GRID_RENDER_CHUNK_SIZE = 15; // 每一批處理的照片張數（只有沒有真正 requestIdleCallback 的裝置才會用到這個保底上限，見上面完整說明）：數字越小，單批卡住主執行緒的時間越短，但要更多批次才能建完整個網格
  // onComplete：所有批次都建置完成才會呼叫一次（選填）。因為現在
  // renderGrid() 本身變成分批、非同步完成，呼叫端原本緊接在 renderGrid()
  // 後面做的「補一次全網格的動作」（例如下面 positionAllGridIdx() 那個
  // 保底呼叫）不能再假設「這一行執行完網格就已經全部建好」，改用這個
  // callback 在真正全部完成的那一刻才觸發，行為跟原本一次性完成時等價。
  function renderGrid(onComplete){
    grid.innerHTML = '';
    let cursor = 0;
    let cellSide = null; // null 代表還沒量過；量過一次之後就固定沿用同一個數字

    // ---------- 修正：「頭幾秒還是會lag」真正剩下的主因 ----------
    // 上面幾輪已經把 renderGrid() 拆成一批批（GRID_RENDER_CHUNK_SIZE 張）
    // 排進 requestIdleCallback，理論上「應該」只在瀏覽器真的閒下來時才做——
    // 但這裡原本的 processChunk() 沒有實際去讀 requestIdleCallback 回傳的
    // deadline 參數，不管這一次瀏覽器實際給了多少閒置時間，一律固定做滿
    // GRID_RENDER_CHUNK_SIZE（40）張的 createElement／掛事件監聽器才交還
    // 主執行緒。照片一多，這一批本身要花的時間很容易就超過瀏覽器單次真正
    // 閒置的額度，等於「掛著 requestIdleCallback 的外皮，實際上還是會一次
    // 卡住主執行緒一段肉眼看得到的時間」；加上原本 { timeout: 300 } 這個
    // 保底，只要 300ms 內沒被判定為閒置，也會被強制執行，進一步失去「只
    // 在真的空閒時做」的意義。這正是使用者形容「剛進站頭幾秒還是會卡一下」
    // 剩下沒堵到的漏洞——時間點剛好就是網格在背景建置、飄動的 e 的 RAF
    // 迴圈、字體 swap 重排等好幾件事一起搶主執行緒的那幾秒。
    // 修法：processChunk 改成真的接住 deadline，每建完「一張」就檢查一次
    // deadline.timeRemaining()，低於安全門檻（3ms，留一點緩衝給瀏覽器自己
    // 排的其他工作）就立刻停手、把剩下的排進下一次 requestIdleCallback，
    // 不再假設「一定做得完 40 張」；同時拿掉 timeout（改成不設逾時，真的
    // 等到閒置才做——沒有 deadline 物件的環境，例如退回 setTimeout 那條路，
    // 才維持原本固定小批次的保底行為，確保沒有這個 API 的瀏覽器至少還是
    // 分批執行，不會整批同步跑完）。每批至少處理 1 張，避免 deadline 一
    // 開始就幾乎見底時卡住不前進。
    const GRID_IDLE_TIME_MARGIN_MS = 3;

    function processChunk(deadline){
      const fragment = document.createDocumentFragment();
      const batchItems = [];
      while(cursor < photos.length){
        const item = buildGridItem(photos[cursor], cursor);
        fragment.appendChild(item); // 先放進記憶體中的 fragment，這一批內部讀寫都不會觸發版面重排
        batchItems.push(item);
        cursor++;
        // 沒有 deadline（不支援 requestIdleCallback、走 setTimeout 那條退場
        // 路徑）時，維持原本固定小批次的行為，用 GRID_RENDER_CHUNK_SIZE 當
        // 批次大小上限；有 deadline 時，改成動態依實際剩餘閒置時間決定，
        // 不再受這個常數限制（但也不會無限做下去，见下面的 timeRemaining 檢查）。
        if(!deadline){
          if(batchItems.length >= GRID_RENDER_CHUNK_SIZE) break;
        } else if(batchItems.length >= 1 && deadline.timeRemaining() < GRID_IDLE_TIME_MARGIN_MS){
          break; // 閒置時間快用完了，先停手，剩下的排到下一次 idle callback
        }
      }
      grid.appendChild(fragment); // 這一批一次加進真正的 DOM，只觸發一次版面重排

      if(batchItems.length){
        // 網格是用 grid-template-columns 分出等寬欄位（見上面 .grid 的
        // CSS），所有格子理論上完全一樣寬，只需要在「第一批」量一次「第
        // 一個」格子的寬度，之後每一批都直接沿用，不用每批各自重新量測。
        if(cellSide === null){
          const firstWrap = batchItems[0].querySelector('.thumb-wrap');
          cellSide = firstWrap ? firstWrap.getBoundingClientRect().width : 0;
        }
        batchItems.forEach(item => applyGridItemImageSize(item, cellSide));
      }

      if(cursor < photos.length){
        scheduleIdle(processChunk, { fallbackDelay: 16 }); // 不設 timeout，真的等到閒置才做，不再被強制提早執行
        return;
      }
      if(typeof onComplete === 'function') onComplete();
    }

    if('requestIdleCallback' in window){
      requestIdleCallback(processChunk);
    } else {
      processChunk();
    }
  }

  function computeSafeRandomPosition(excludeRect, boxW, boxH){
    const margin = 24;
    const buffer = 16;
    const safeExclude = {
      left: excludeRect.left - buffer,
      top: excludeRect.top - buffer,
      right: excludeRect.right + buffer,
      bottom: excludeRect.bottom + buffer
    };

    const maxLeft = Math.max(margin, window.innerWidth - boxW - margin);
    const maxTop = Math.max(margin, window.innerHeight - boxH - margin);

    let best = null;

    for(let attempt = 0; attempt < 40; attempt++){
      const left = margin + Math.random() * (maxLeft - margin);
      const top = margin + Math.random() * (maxTop - margin);
      const rect = { left, top, right: left + boxW, bottom: top + boxH };

      const overlapsCursorArea =
        rect.left < safeExclude.right && rect.right > safeExclude.left &&
        rect.top < safeExclude.bottom && rect.bottom > safeExclude.top;

      if(!overlapsCursorArea){
        best = rect;
        break;
      }
    }

    if(!best){
      const roomRight = window.innerWidth - safeExclude.right;
      const roomLeft = safeExclude.left;
      const roomBottom = window.innerHeight - safeExclude.bottom;
      const roomTop = safeExclude.top;
      const maxRoom = Math.max(roomRight, roomLeft, roomBottom, roomTop);

      let left, top;
      if(maxRoom === roomRight){
        left = Math.min(window.innerWidth - boxW - margin, safeExclude.right + margin);
        top = Math.min(Math.max(margin, excludeRect.top), window.innerHeight - boxH - margin);
      } else if(maxRoom === roomLeft){
        left = Math.max(margin, safeExclude.left - boxW - margin);
        top = Math.min(Math.max(margin, excludeRect.top), window.innerHeight - boxH - margin);
      } else if(maxRoom === roomBottom){
        top = Math.min(window.innerHeight - boxH - margin, safeExclude.bottom + margin);
        left = Math.min(Math.max(margin, excludeRect.left), window.innerWidth - boxW - margin);
      } else {
        top = Math.max(margin, safeExclude.top - boxH - margin);
        left = Math.min(Math.max(margin, excludeRect.left), window.innerWidth - boxW - margin);
      }
      best = { left: Math.max(margin, left), top: Math.max(margin, top) };
    }

    return best;
  }

  // hover 大圖預覽要用的快取：key 是 photo.thumbUrl，value 是已經 decode 完成、
  // 保證可以立即顯示的 <img> 元素。桌機一進頁面就會在背景把所有照片的
  // thumbUrl 都預先跑過一輪（見 prefetchHoverThumbsInBackground），
  // 所以使用者實際 hover 到的當下，這裡幾乎都已經有現成的了。
  const hoverPreviewCache = new Map();

  function showHoverPreview(photo, itemEl){
    // 手機板首頁不需要 hover 大圖預覽：即使 supportsHover 誤判為 true
    // （例如用滑鼠把視窗縮到手機寬度測試），也在這裡擋掉，不建立/顯示
    // 任何大圖預覽。CSS 那邊 .hover-preview 在同一個斷點下也強制
    // display:none，這裡是雙重保險。
    if(window.innerWidth <= 640) return;
    if(!photo || !photo.thumbUrl){
      // 沒有 hover 專用的縮圖網址（極端情況，例如 demo 資料不完整），
      // 退回原本「複製網格縮圖」的舊行為，至少還有東西可以看
      if(itemEl.complete && itemEl.naturalWidth){
        hoverPreview.innerHTML = '';
        const bigImg = itemEl.cloneNode();
        bigImg.removeAttribute('loading');
        bigImg.draggable = false;
        hoverPreview.appendChild(bigImg);
        placeAndReveal(itemEl);
      }
      return;
    }

    const cached = hoverPreviewCache.get(photo.thumbUrl);
    // guard: 這張 hover 用的圖片還沒載完＋解碼完成，就先等，不要把還沒完整
    // 的畫面塞進去（跟先前修 preview 頁「兩段式」黑幕是同一個道理：一定要
    // 整張圖都準備好了才顯示，不會有半張的中間態）
    if(!cached){
      const loader = new Image();
      loader.src = photo.thumbUrl;
      const onReady = () => {
        const finish = () => {
          hoverPreviewCache.set(photo.thumbUrl, loader);
          if(itemEl.matches(':hover')) showHoverPreview(photo, itemEl);
        };
        // decode() 失敗代表這張圖其實沒有真的載入成功（跟堆疊頁面
        // warmFallBatch() 那個 bug 同一個成因），不能照樣 finish() 把它
        // 當成「已經暖好」塞進 hoverPreviewCache——那樣下次 hover 到會
        // 直接顯示一張永遠壞掉的圖。失敗就讓它保持未快取，下次 hover 到
        // 時會自然重新走一次全新的載入嘗試。
        if(loader.decode){ loader.decode().then(finish, () => {}); }
        else { finish(); }
      };
      if(loader.complete && loader.naturalWidth) onReady();
      else loader.onload = onReady;
      return;
    }

    // 已經預先載好＋解碼完成，直接顯示，不會閃爍、也不會有中間態
    hoverPreview.innerHTML = '';
    const bigImg = cached.cloneNode();
    bigImg.removeAttribute('loading');
    bigImg.draggable = false;
    bigImg.onerror = () => { if(photo.fallbackUrl) bigImg.src = photo.fallbackUrl; };
    hoverPreview.appendChild(bigImg);

    placeAndReveal(itemEl);
  }

  function placeAndReveal(itemEl){
    const boxW = hoverPreview.getBoundingClientRect().width || Math.min(window.innerWidth * 0.45, 650);
    const ratio = (itemEl.naturalHeight && itemEl.naturalWidth)
      ? itemEl.naturalHeight / itemEl.naturalWidth
      : 1;
    const boxH = boxW * ratio;

    const excludeRect = itemEl.getBoundingClientRect();
    const pos = computeSafeRandomPosition(excludeRect, boxW, boxH);

    hoverPreview.style.left = pos.left + 'px';
    hoverPreview.style.top = pos.top + 'px';
    hoverPreview.classList.add('show');
  }

  function hideHoverPreview(){
    hoverPreview.classList.remove('show');
  }

  let detailToken = 0;
  let lastNaturalW = 0, lastNaturalH = 0;
  // 修正「進到照片頁後，過一下子照片忽然跳一下（位置也移動了）、畫質也跟著
  // 跳」的 bug：renderDetailLight() 如果已經用網格縮圖（gridUrl，跟真正照片
  // 同比例、只是縮小）把 wrap 的大小/位置定位好了，renderDetailFull() 的
  // 高畫質版本載入完成後就不應該再用它自己量到的 naturalWidth/Height 重新
  // 呼叫一次 positionDetailImage()——兩次量到的比例理論上該一樣，但難免有
  // 極細微的捨入差異，多算這一次除了沒有必要，還會讓使用者在畫面已經穩定
  // 顯示之後，忽然看到 wrap 尺寸/位置又無聲跳動一次。這裡用一個旗標記錄
  // 「這一次 renderDetailLight() 是否已經用暖場縮圖定位過」，有的話
  // renderDetailFull() 就只換圖、不再重新定位。
  let detailLightPositioned = false;

  // 修正「點縮圖放大移動出來、剛進照片頁時畫面閃動錯位一下」的 bug：
  // 分身飛行動畫（runGridToDetailTransition）播放期間（約 460ms + 保底
  // 緩衝），如果剛好有 resize／雙指縮放結束／橫直切換這些事件觸發
  // positionDetailImage() 重新算一次大圖容器的位置，會讓「真正的」
  // detailImageWrap 在飛行途中被悄悄搬到新位置——分身動畫本身仍然飛去
  // 舊的 endRect（動畫開始那一刻量到的終點），兩者對不上，動畫播完、
  // 分身收起來、真正的大圖現身的瞬間就會看到明顯的一下跳動／錯位。
  // 用這個旗標把飛行期間的 positionDetailImage() 呼叫整個暫停，等飛行
  // 完全結束（finish()）才放行，確保分身飛去的終點永遠跟大圖容器真正
  // 落腳的位置完全一致。
  let flipInFlight = false;
  // 分身飛行途中，高畫質版本正巧同時在背景載入——這裡改成只用「真正的」
  // 注意：分身在飛行途中「刻意不」跟著 renderDetailFull() 換高畫質 src
  // （這點跟早期版本不同，見下面 activeFlipClone 賦值處的說明）。原因：
  // 分身起跳時用的是網格縮圖（photo.gridUrl，通常是裁成正方形的版本），
  // 跟最終大圖用的 detailUrl／detailUrlMobile 很多時候長寬比不一樣（原圖
  // 不是正方形的話尤其明顯）。分身的 <img> 是用固定的 width/height（起點
  // 矩形的排版尺寸）+ CSS transform:scale 做飛行動畫，object-fit:cover
  // 的裁切範圍是瀏覽器根據「當下設定的 src 的原始長寬比」對著這組固定
  // width/height 即時算出來的——飛行途中如果中途把 src 換成長寬比不同的
  // 高畫質版本，瀏覽器會立刻用新的長寬比重新計算 cover 裁切位置，畫面上
  // 看起來就是「同一個框裡的照片內容自己跳了一下」（不是分身在移動，
  // 是框內的裁切範圍瞬間變了），這正是這個轉場曾經出現過的視覺瑕疵。
  // 改成分身全程只顯示起跳當下那張縮圖（裁切範圍全程不變，只有 transform
  // 在飛），畫質交接完全交給下面 finish() 那一刻——那時分身已經移除、
  // 真正的 detailImageWrap（早就在背景載入好高畫質版本了）直接無縫現身，
  // 使用者不會看到裁切跳動，最多只是飛行最後一小段畫質稍微沒那麼銳利，
  // 這在快速位移的動畫途中幾乎不會被注意到，遠比裁切跳動不明顯。
  let activeFlipClone = null;

  function isDetailMobile(){ return window.innerWidth <= 640; }

  /* =========================================================
     DETAIL PAGE — 右側拉簾 (filmstrip)，桌機／平板專用
     ---------------------------------------------------------
     核心概念：
     - fsPos 是一個「連續、不做 wrap」的浮點虛擬索引（可以是負數、可以超過
       photos.length），代表拉簾目前捲動到的中心位置。實際要顯示第幾張照片
       永遠用 mod(Math.round(off), photos.length) 換算，這樣拖曳/滾輪可以
       無限往同一方向捲，視覺上自然循環，不需要處理邊界特例。
     - 每個可見的「格子」用它的整數虛擬位移 off（不是照片 index）當 DOM
       key，因為照片數量少時同一張照片可能同時出現在多個位移上（例如往同
       方向捲超過一輪），用 off 當 key 才不會撞在一起。
     - 每張縮圖的縮放、垂直位移都是「連續函數」（不是離散的 7 個檔位），
       捲動中途（fsPos 帶小數）一樣能算出平滑的中間值，滾輪/拖曳才會看起來
       流暢而不是一格一格跳。位移用「縮放函數的定積分」反推，確保任何時刻
       相鄰兩張縮圖之間的間距都等於「兩張圖各自當下的高度」+ 固定間隙，
       不會互相重疊、也不會忽近忽遠。
     - 點擊縮圖／滾輪／拖曳放開，三種操作全部只改一個目標值 fsTarget，
       實際「怎麼動過去」統一交給同一顆臨界阻尼彈簧（SmoothDamp，見下面
       fsSmoothDamp）去追，每一幀都自動算出平滑的中間值——不管哪一種
       操作觸發，加速／減速的曲線手感永遠一致，這就是所謂成熟、統一的
       motion graphic 動態做法，細節說明見 fsTick 上方那段。
  ========================================================= */
  let fsReady = false;                 // 拉簾這次是否已經初始化好、可以互動
  let fsPos = 0;                       // 目前實際畫面上的位置（連續浮點虛擬索引）
  let fsTarget = 0;                    // 目前要追的目標位置——點擊/滾輪/拖曳放開，
                                        // 全部只改這個數字，實際怎麼「動過去」統一交給
                                        // 下面同一顆 spring 負責，三種操作因此共用同一條
                                        // 加速→減速曲線，手感永遠一致。
  const fsVel = { v: 0 };              // spring 目前的速度狀態（虛擬索引／秒）
  let fsRAFId = null;
  let fsLastFrameT = 0;
  let fsLastSyncedIndex = null;        // 上一次同步給左側大圖的實際照片 index
  let fsEntering = false;              // 拉簾目前是否正在播放「開場拉入」這段彈簧動畫——
                                        // 為 true 的這段期間，fsPos 會依序掠過中間好幾個
                                        // 整數格，但那只是開場動畫本身的位移，不代表使用者
                                        // 在切換照片，fsSyncCurrentIndex() 期間要整段跳過
                                        // （見該函式內的說明），避免左側大圖跟著開場動畫
                                        // 誤閃過中間那幾張鄰居照片。
  let fsClosing = false;               // 拉簾目前是否正在播放「退場拉出」這段彈簧動畫——

    // 的極小邊界，算出來的編號位置就會整個縮到照片正中央附近（也就是
    // 「編號跑到照片上去了」的成因）。兩輪動作拆開、先量後縮，才能量到
    // 正確的原始尺寸。
    //
    // 量測前先清空 img 的 inline transform：這裡假設「量測當下」img 就是
    // 正常 scale(1) 大小，但這個假設不一定成立——例如從照片物理堆疊模式
    // 退場回首頁時（見 shrinkHomeForPhotoFall()），img 身上還留著進場時
    // 設定的 transform:scale(0)，從未被重設回正常大小就直接被這裡量測，
    // 量到的是幾乎縮成 0 的邊界，算出來的編號位置整個是錯的，要等到之後
    // 某次版面重算（例如 resize/orientation）用正確尺寸重新算一次，編號
    // 才會「跳」回對的位置——這正是「編號位置一開始錯了，後來才跳回對的
    // 位置」的成因。同樣道理也適用於滑鼠引力效果（magnetFrame()）當下
    // 殘留的放大值。這裡統一清空 transform 再量測，確保每次都是量到
    // 「動畫最終會停在」的 scale(1) 基準大小，不受量測當下殘留了什麼
    // transform 影響。
    items.forEach(item => {
      const img = item.querySelector('.thumb-wrap img');
      const idx = item.querySelector('.idx');
      if(idx && img && img.classList.contains('loaded')){
        img.style.transform = '';
        positionGridIdxItem(item);
      }
      // 趁這一刻（img 還沒被下面第二輪縮小、transform 剛被清空成 scale(1)
      // 的「最終」大小）順手把它的矩形也量起來、存進 gridRevealTargetRectMap——
      // 見 getObstacleRects() 內的說明：放大進場動畫播放期間，飄動的 e 會
      // 拿這份「動畫結束時應該停在哪」的目標矩形當撞牆對象，而不是乾脆整段
      // 期間都不撞、或去撞正在縮小途中、位置對不上的暫時矩形。
      if(img && img.classList.contains('loaded')){
        const r = img.getBoundingClientRect();
        if(r.width > 0 && r.height > 0) gridRevealTargetRectMap.set(img, r);
      }
    });

    // 從這裡開始，照片即將被縮小、接著整段動畫期間尺寸都不可靠（見
    // positionGridIdxItem() 內 gridRevealInFlight 的說明）——標記起來，
    // 直到 playGridRevealAnimation() 的收尾流程把它改回 false 為止。
    gridRevealInFlight = true;

    items.forEach(item => {
      const img = item.querySelector('.thumb-wrap img');
      const idx = item.querySelector('.idx');
      if(img){
        img.style.transition = 'none';
        img.style.transform = `scale(${GRID_REVEAL_START_SCALE})`;
        // 清掉可能殘留的 inline opacity：這裡的放大進場動畫系統原本假設
        // opacity 永遠交給 CSS 的 .grid-item img.loaded{ opacity:1 } 這條
        // 規則控制，自己只處理 transform。但照片物理堆疊模式進場時
        // （shrinkHomeForPhotoFall()）會直接用 inline style 把 opacity
        // 設成 0（inline 優先權比 class 規則高），退場流程如果沒有把這個
        // inline 值清掉，縮圖就會永久卡在看不見的狀態——這正是「退出堆疊
        // 模式後首頁縮圖只剩編號、照片區塊全白」的成因。這裡統一在每次
        // 準備進場動畫時清空 inline opacity，交還給 CSS 規則，之後不管
        // 是哪個入口呼叫這個函式都不會再受這個殘留值影響。
        img.style.opacity = '';
      }
      if(idx){
        const imgLoaded = img && img.classList.contains('loaded');
        if(imgLoaded){
          delete idx.dataset.revealPending;
          idx.style.transition = 'none';
          idx.style.opacity = '0';
          idx.style.transform = `translateX(${GRID_IDX_REVEAL_OFFSET_X}px)`;
        } else {
          // 圖片這一刻還沒載入完成：left/top 目前還停在 CSS 預設值 0
          // （格子左上角），不是照片實際的位置。如果這裡照樣套用「放大
          // 進場」的位移動畫，使用者會先看到編號從錯誤的左上角滑進畫面、
          // 等圖片真正載入完成、positionGridIdxItem() 算出正確位置後才
          // 「跳」過去——這正是「編號先定位在錯誤的位置」的成因（只會在
          // 進站當下第一次從 preview 頁回首頁才可能發生：那是使用者第一次
          // 真正看到首頁格子，部分縮圖這時候可能還沒載完；點進單張照片再
          // 關閉回首頁不會有這個問題，因為那之前使用者一定已經看過、也
          // 等到首頁縮圖載入完成過一次了）。這裡先讓編號維持完全透明、
          // 不套用位移動畫，標記成「待補」，改由 renderGrid() 裡圖片的
          // load 事件負責——那時位置已經正確，用一個簡單的淡入補上就
          // 不會再有跳動。
          idx.dataset.revealPending = '1';
          idx.style.transition = 'none';
          idx.style.opacity = '0';
          idx.style.transform = 'translateX(0)';
        }
      }
    });
    void grid.offsetHeight; // 強制 reflow，確保上面「縮成一個點」先真的套用一次
  }

  let gridRevealCleanupTimer = null;
  let gridRevealPreviewDelayTimer = null; // 見下面 closePreviewPage() 裡的呼叫說明
  // 真正播放「放大＋編號歸位淡入」的動畫。呼叫時機：畫面已經（或即將）
  // 露出首頁格子的那一刻——與 prepareGridRevealState() 分成兩個函式、
  // 分兩個時間點呼叫，中間留給「瞬間縮小」那一幀先被瀏覽器繪製過一次，
  // 才會被當成一次真正的過渡，而不是被合併成同一次繪製。
  function playGridRevealAnimation(){
    if(!grid) return;
    const items = grid.querySelectorAll('.grid-item');
    items.forEach(item => {
      const img = item.querySelector('.thumb-wrap img');
      const idx = item.querySelector('.idx');
      if(img){
        img.style.transition = `transform ${GRID_REVEAL_MS}ms ${GRID_REVEAL_EASE}`;
        img.style.transform = 'scale(1)';
      }
      if(idx && idx.dataset.revealPending !== '1'){
        // opacity／transform 用同一條曲線、同一個時長，讓編號「淡入」跟
        // 「由右往左移回定位」是同一個節奏的兩個面向，不是分開的兩段動畫。
        // 標記成「待補」（dataset.revealPending==='1'）的編號代表這一刻
        // 圖片還沒載入完成、位置還不正確，這裡跳過不處理，改由圖片自己的
        // load 事件（見 renderGrid()）在位置算好之後才補一段淡入，避免
        // 套用這段位移動畫時用到還沒校正過的錯誤位置。
        idx.style.transition = `opacity ${GRID_REVEAL_MS}ms ${GRID_REVEAL_EASE}, transform ${GRID_REVEAL_MS}ms ${GRID_REVEAL_EASE}`;
        idx.style.opacity = '1';
        idx.style.transform = 'translateX(0)';
      }
    });
    // 動畫播完之後把這些內聯樣式清乾淨，交還給 CSS 原本的規則（.grid-item img
    // 平常的 transform:scale(1) / hover 的 scale(1.12)，.idx 平常的
    // transform:translateX(0) / hover 的位移），避免殘留的內聯樣式意外蓋掉
    // 之後 hover 放大或編號位移這些原本就有的互動效果。「待補」的編號不在
    // 這裡清除，它們的內聯樣式改由自己的淡入計時器負責清除（見 renderGrid()
    // 內圖片 load 事件裡的說明）。
    clearTimeout(gridRevealCleanupTimer);
    gridRevealCleanupTimer = setTimeout(() => {
      items.forEach(item => {
        const img = item.querySelector('.thumb-wrap img');
        const idx = item.querySelector('.idx');
        if(img){ img.style.transition = ''; img.style.transform = ''; }
        if(idx && idx.dataset.revealPending !== '1'){ idx.style.transition = ''; idx.style.opacity = ''; idx.style.transform = ''; }
      });
      // 動畫真正播完，照片尺寸已經穩定回最終大小，這裡才能放心解除
      // gridRevealInFlight（見 positionGridIdxItem() 內的說明）。
      //
      // 在解除凍結之前，先呼叫 resetMagnetScaleForReveal()：
      // ① 把桌機滑鼠「引力放大」特效內部每張照片自己追蹤的「目前縮放值」
      // 統一重設回 1（跟這一刻畫面上剛清空 inline transform、回到 CSS
