<script>
  // =====================================================================
  // 優化重點 1：FastDOM 讀寫分離機制 (消除 Layout Thrashing)
  // =====================================================================

  // 1.1 批次定位所有縮圖編號（讀寫分離）
  function positionAllGridIdx() {
    if (!grid || gridRevealInFlight) return;

    const items = grid.querySelectorAll('.grid-item');
    const readResults = [];

    // 第一階段：純讀取 (Read Phase)
    // 集中讀取版面尺寸，期間絕不寫入任何 style，避免觸發全頁 Layout Reflow
    for (let i = 0; i < items.length; i++) {
      const item = items[i];
      const thumbWrap = item.querySelector('.thumb-wrap');
      const img = thumbWrap ? thumbWrap.querySelector('img') : null;
      const idx = item.querySelector('.idx');

      if (!thumbWrap || !img || !idx || !img.classList.contains('loaded')) continue;

      const wrapRect = thumbWrap.getBoundingClientRect();
      const imgRect = img.getBoundingClientRect();
      if (!imgRect.width || !imgRect.height) continue;

      const left = Math.max(0, Math.round(imgRect.left - wrapRect.left));
      const top = Math.max(0, Math.round(imgRect.bottom - wrapRect.top)) + GRID_IDX_GAP;

      readResults.push({ idx, left, top });
    }

    // 第二階段：集中寫入 (Write Phase)
    // 一次性套用 CSS 樣式，瀏覽器只需計算一次 Layout
    requestAnimationFrame(() => {
      for (let i = 0; i < readResults.length; i++) {
        const { idx, left, top } = readResults[i];
        idx.style.left = left + 'px';
        idx.style.top = top + 'px';
      }
    });
  }

  // 1.2 滑鼠磁吸引力特效優化 (高效能影格更新)
  if (supportsHover && grid) {
    const MAGNET_RADIUS = 600;
    const MAGNET_MAX_SCALE = 1.35;
    const MAGNET_RESPONSE_MS = 140;
    const MAGNET_SETTLE_EPS = 0.0008;

    let magnetMouseX = 0;
    let magnetMouseY = 0;
    let magnetActive = false;
    let magnetLastFrameTime = null;
    const magnetScaleState = new WeakMap();

    function magnetFrame(now) {
      requestAnimationFrame(magnetFrame);

      // 子頁面/背景隱藏時，完全關閉磁吸運算，避免白白浪費 60 FPS 主執行緒效能
      if (gridRevealInFlight || photoFallModeActive) {
        magnetLastFrameTime = now;
        return;
      }
      if (previewPage.classList.contains('active') || detailPage.classList.contains('active')) {
        magnetLastFrameTime = now;
        return;
      }

      if (magnetLastFrameTime == null) magnetLastFrameTime = now;
      const dt = Math.min(64, now - magnetLastFrameTime);
      magnetLastFrameTime = now;
      const smoothFactor = 1 - Math.exp(-dt / MAGNET_RESPONSE_MS);

      const itemsCache = getMagnetItems();
      const pendingUpdates = [];

      // [階段 A] 純讀取與物理權重計算
      for (let i = 0; i < itemsCache.length; i++) {
        const { item, thumbWrap, img, idx } = itemsCache[i];
        if (!img || !img.classList.contains('loaded')) continue;

        let target = 1;
        if (magnetActive && thumbWrap) {
          const wrapRect = thumbWrap.getBoundingClientRect();
          const cx = wrapRect.left + wrapRect.width / 2;
          const cy = wrapRect.top + wrapRect.height / 2;
          const dx = magnetMouseX - cx;
          const dy = magnetMouseY - cy;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < MAGNET_RADIUS) {
            const t = 1 - (dist / MAGNET_RADIUS);
            const smooth = t * t * (3 - 2 * t);
            target = 1 + (MAGNET_MAX_SCALE - 1) * smooth;
          }
        }

        let current = magnetScaleState.get(item) || 1;
        current += (target - current) * smoothFactor;

        const settled = Math.abs(current - target) < MAGNET_SETTLE_EPS && Math.abs(target - 1) < MAGNET_SETTLE_EPS;
        const hadTransform = !!img.style.transform;

        if (settled && !hadTransform) continue;
        pendingUpdates.push({ item, thumbWrap, img, idx, current, settled });
      }

      // [階段 B] 集中寫入圖片 transform 縮放
      for (let i = 0; i < pendingUpdates.length; i++) {
        const { item, img, current, settled } = pendingUpdates[i];
        if (settled) {
          img.style.transform = '';
          magnetScaleState.set(item, 1);
        } else {
          magnetScaleState.set(item, current);
          img.style.transform = `scale(${current.toFixed(4)})`;
        }
      }

      // [階段 C] 重新計算受影響編號的位置 (讀) 與寫入 (寫)
      const idxUpdates = [];
      for (let i = 0; i < pendingUpdates.length; i++) {
        const { thumbWrap, img, idx } = pendingUpdates[i];
        if (!thumbWrap || !img || !idx) continue;
        const wrapRect = thumbWrap.getBoundingClientRect();
        const imgRect = img.getBoundingClientRect();
        if (!imgRect.width || !imgRect.height) continue;

        const left = Math.max(0, Math.round(imgRect.left - wrapRect.left));
        const top = Math.max(0, Math.round(imgRect.bottom - wrapRect.top)) + GRID_IDX_GAP;
        idxUpdates.push({ idx, left, top });
      }

      for (let i = 0; i < idxUpdates.length; i++) {
        const { idx, left, top } = idxUpdates[i];
        idx.style.left = left + 'px';
        idx.style.top = top + 'px';
      }
    }
  }

  // =====================================================================
  // 優化重點 2：分批分線程渲染網格 (Chunked DOM Building)
  // =====================================================================
  function renderGrid(onComplete) {
    grid.innerHTML = '';
    let cursor = 0;
    let cellSide = null;

    function processChunk(deadline) {
      const fragment = document.createDocumentFragment();
      const batchItems = [];

      while (cursor < photos.length) {
        const item = buildGridItem(photos[cursor], cursor);
        fragment.appendChild(item);
        batchItems.push(item);
        cursor++;

        // 利用 requestIdleCallback 的剩餘時間判斷是否暫停，讓出 Main Thread
        if (deadline && deadline.timeRemaining() < 3) {
          break;
        }
      }

      grid.appendChild(fragment);

      if (batchItems.length) {
        if (cellSide === null) {
          const firstWrap = batchItems[0].querySelector('.thumb-wrap');
          cellSide = firstWrap ? firstWrap.getBoundingClientRect().width : 0;
        }
        for (let i = 0; i < batchItems.length; i++) {
          applyGridItemImageSize(batchItems[i], cellSide);
        }
      }

      if (cursor < photos.length) {
        scheduleIdle(processChunk, { fallbackDelay: 16 });
      } else if (typeof onComplete === 'function') {
        onComplete();
      }
    }

    scheduleIdle(processChunk);
  }
</script>
