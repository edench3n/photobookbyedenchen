<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>photobook by edenchen</title>

<!-- 🌟 1. 設定瀏覽器分頁圖示 (Favicon) 🌟 -->
<link rel="icon" href="https://raw.githubusercontent.com/edench3n/photobookbyedenchen/main/EDEN.png" type="image/png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 照片放在 Google Drive / Google 圖片 CDN，先建立連線可以讓第一批照片更快開始下載 -->
<link rel="preconnect" href="https://drive.google.com">
<link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --header-h: 120px;
    --gap: 18px;
    --edge: 48px;
    --header-font-size: clamp(11px, 9.2px + 0.53vw, 15px); /* 桌機滿版 15px、縮到窄螢幕連續按比例縮小 */
  }
  *{ box-sizing: border-box; }

  /* ---------- 全站文字/元件不可被選取，行動裝置點擊不出現灰色高亮方塊 ---------- */
  html, body, *{
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- CUSTOM CURSOR: solid #66ff74 circle, desktop / mouse only ---------- */
  *{
    cursor: none !important;
  }
  #custom-cursor{
    position:fixed;
    top:0; left:0;
    width:40px;
    height:40px;
    pointer-events:none; /* critical: lets clicks pass straight through to the page */
    z-index:99999;
    will-change: transform;
    opacity:0;
    transition: opacity .15s ease;
  }
  #custom-cursor img{
    width:100%;
    height:100%;
    display:block;
  }
  #custom-cursor.show{ opacity:1; }

  /* touch devices: restore the normal cursor, hide the custom circle */
  @media (pointer: coarse){
    #custom-cursor{ display:none !important; }
    *{
      cursor: auto !important;
    }
  }
  
  /* 🌟 2. 將網頁滑鼠指標替換為 EDEN.png (支援 32x32 渲染) 🌟 */
  html, body {
    margin:0; padding:0;
    background:#ffffff;
    color:#000000;
    font-family:'DM Sans', sans-serif;
    font-weight:500;
    -webkit-font-smoothing: antialiased;
    overflow-x:hidden;
    touch-action: manipulation; /* allow scrolling + pinch-zoom, block double-tap-zoom */
  }

  a, button, .grid-item, .header-left, .nav-arrow {
    font-family:inherit;
    font-weight:inherit;
  }

  /* ---------- FIXED HEADER (always on top, always black, never covered) ---------- */
  /* 原本用 CSS Grid「五等分欄位」排版：header-left / header-preview / header-right
     各佔固定的 1/5 欄寬。問題是欄寬只跟總寬度成比例，跟文字實際需要多寬完全無關——
     螢幕變窄到某個程度（大約 700~1000px 之間，並非任何一個明確的 breakpoint），
     "photobook by edenchen" 這行字會比它所在的欄位還寬，被迫換行，看起來就是
     「文字忽然跳行」。改成 Flexbox：每個區塊只佔用文字實際需要的寬度
     （flex-shrink:0 + white-space:nowrap 鎖住 header-left 不被硬擠壓換行），
     彼此靠 justify-content:space-between 撐開版面。這樣同一套排版可以套用在所有
     寬度，不需要再切換 grid/flex，也不會再有那個模式切換造成的額外跳動。 */
  .fixed-header{
    position:fixed;
    top:0; left:0; right:0;
    z-index:1000;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap: var(--gap);
    padding: 36px var(--edge) 0 var(--edge);
    pointer-events:none;
  }
  .fixed-header .header-left,
  .fixed-header .header-preview,
  .fixed-header .header-right{
    color:#000000;
    /* 字級隨螢幕寬度連續、按比例縮小（不是斷點式的一次性跳動）：桌機滿版
       （≥1100px）維持 15px 不變，窄到手機縮小，中間用 vw 連續內插。line-height
       維持 unitless 的 1.5 倍率，會自動跟著 font-size 等比例縮放，不用另外
       處理；letter-spacing 改用 em（相對字級的比例單位）也是同樣道理，字級
       縮小時會自動等比例縮小，不會維持固定像素值變得不成比例。
       這樣做主要是為了避免 header-left / header-preview / header-right 三塊文字
       加起來的總寬度，在窄螢幕下超出螢幕，把 collab 那塊擠出右側畫面。
       數值抽成 --header-font-size 這個 CSS 變數（定義在 :root），detail-info
       （點進照片後下面的說明文字）會直接沿用同一個變數，確保兩邊字級/行距
       永遠一致，不用兩處分別調整、維護。 */
    font-size: var(--header-font-size);
    line-height:1.5;
    pointer-events:auto;
    white-space:pre-line;
  }
  .fixed-header .header-left{
    letter-spacing:0.014em;
    white-space:nowrap; /* 這行字沒有預期的換行點，鎖住不換行，避免中等寬度時被硬擠成兩行 */
    flex-shrink:0;
    position:relative;
    left: var(--header-left-nudge, 0px); /* 桌機滿版 5 欄時，JS 會把這個微調成精準對齊 001 照片左邊緣的偏移量，做法跟 header-preview 對齊 002 完全一樣；手機版這個變數固定是 0，位置不受影響 */
    opacity:0; /* 原因跟 header-preview / header-right 一樣：等 001 圖片載入、
                  算出精準位置後才顯示，避免進頁面/重新整理時「先跑到錯誤位置
                  再跳回來」 */
    transition: opacity .2s ease;
  }
  .fixed-header .header-left.positioned{ opacity:1; }
  .fixed-header .header-preview{
    letter-spacing:0.014em;
    white-space:nowrap;
    flex-shrink:0;
    position:relative;
    left: var(--preview-nudge, 0px); /* 桌機滿版 5 欄時，JS 會把這個微調成精準對齊 002 照片左邊緣的偏移量 */
    opacity:0; /* 進頁面/重新整理的瞬間，precise 對齊還沒算出來（要等 002 圖片載入），
                  在算出正確位置之前先不顯示，避免使用者看到它先出現在錯誤位置、
                  再「跳」到正確位置；JS 算完準確位置後會加上 .positioned 類別
                  才顯示出來（見下面 .positioned 規則） */
    transition: opacity .2s ease;
    /* 注意：這裡故意不對 left 加 transition。JS 每一幀都會用
       getBoundingClientRect() 讀「當下實際渲染出來的位置」回推下一次要設定的
       nudge 值；如果 left 有 transition，瀏覽器會在動畫過程中間插值，但 JS
       讀到的 --preview-nudge（CSS 變數）卻是已經設定好的「最終目標值」而不是
       插值中的當下值，兩者對不上，算出來的新 nudge 就會偏掉，且在連續拖曳、
       每一幀都重算的情況下持續放大誤差，畫面上就是「左右亂飛」。拿掉 transition
       後，每次讀到的都是瀏覽器已經套用完成的實際值，才不會有這個誤差累積問題。 */
  }
  .fixed-header .header-preview.positioned{ opacity:1; }
  @media (hover: hover){
    /* :hover 只在滑鼠這種真的有「懸停」概念的裝置上生效；觸控裝置點擊時
       瀏覽器常會把 tap 模擬成短暫的 :hover，導致手機上點按鈕會看到變淡一下
       這個不想要的效果，用 (hover: hover) 把這條規則限制在滑鼠裝置上即可。 */
    .fixed-header .header-preview.positioned:hover{ opacity:0.5; }
  }
  .fixed-header .header-right{
    text-align:left;
    letter-spacing:0.014em;
    flex-shrink:0;
    position:relative;
    left: var(--header-right-nudge, 0px); /* 桌機滿版 5 欄時，JS 會把這個微調成精準對齊 004 照片左邊緣的偏移量，做法跟 header-preview 對齊 002 完全一樣 */
    opacity:0; /* 原因跟 header-preview 一樣：等 004 圖片載入、算出精準位置後
                  才顯示，避免進頁面/重新整理時「先跑到錯誤位置再跳回來」 */
    transition: opacity .2s ease;
  }
  .fixed-header .header-right.positioned{ opacity:1; }

  /* ---------- GALLERY PAGE ---------- */
  #galleryPage{
    position:relative;
    min-height:100vh;
    padding: calc(var(--header-h)) var(--edge) 140px var(--edge);
    transition: opacity .5s ease, filter .5s ease;
  }
  .grid{
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap: var(--gap) var(--gap);
    row-gap: 56px;
  }
  .grid-item{
    position:relative;
    touch-action: manipulation;
  }
  .grid-item .thumb-wrap{
    width:100%;
    aspect-ratio: 1 / 1;
    overflow:visible;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .grid-item img{
    max-width:52%;
    max-height:52%;
    width:auto;
    height:auto;
    object-fit:contain;
    display:block;
    transform: scale(1);
    transition: opacity .3s ease, transform .45s cubic-bezier(.16,1,.3,1);
    will-change: transform;
    -webkit-user-drag:none;
    -webkit-touch-callout:none;
    opacity:0; /* hidden (plain white) until fully loaded — no broken-image icon flash */
  }
  .grid-item img.loaded{
    opacity:1;
  }
  .grid-item:hover img{
    transform: scale(1.12);
  }
  .grid-item .idx{
    margin-top:4px;
    font-size:9px;
    letter-spacing:0.5px;
    color:#000;
    text-align:center;
  }

  /* 照片欄數：5 欄（桌機滿版）→ 3 欄 → 2 欄。header 現在固定用 Flexbox（見上），
     不會再跟著這兩個 breakpoint 切換排版模式，兩者互不影響。 */
  @media (max-width: 1100px){
    .grid{ grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 640px){
    .grid{ grid-template-columns: repeat(2, 1fr); }
    :root{ --header-h: 140px; --edge: 20px; }

    /* 手機版維持橫向一排（跟桌機同一套排版邏輯），只讓 collab 那塊
       （header-right）可以在自己的欄位裡自然換行，而不是被固定寬度硬撐出
       螢幕外：拿掉 flex-shrink:0、加上 min-width:0，它就能在空間不夠時
       正常換行。
       光這樣還不夠：「edenchenworks@gmail.com」中間沒有空白，瀏覽器預設只會
       在空白處換行，遇到這種一整串不可斷開的文字，就算容器縮小了，文字本身
       還是會把容器撐開、超出螢幕——這正是「collab 還是被推擠出去」的真正原因。
       加上 overflow-wrap / word-break，允許瀏覽器在真的塞不下時，於文字中間
       斷行，才能確保它一定會被限制在容器寬度內，不會再溢出螢幕。 */
    .fixed-header .header-right{
      flex-shrink:1;
      min-width:0;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    /* 用連續、按比例縮放的字級（跟桌機那條 clamp 同樣做法），螢幕越窄字級
       跟著越小，多一層安全邊界，確保在最窄的手機上也能完整容納。
       這裡把最大值從 13px 再調小到 12px——原本 13px 時「edenchenworks@gmail.com」
       换行換到最後一個「m」單獨被擠到下一行，稍微縮小整體字級後，這一行就能
       完整塞下，不會再有孤字跑到下一行的狀況。改寫成覆蓋 --header-font-size
       這個變數，detail-info 會自動跟著一起變小，不用另外處理。 */
    :root{ --header-font-size: clamp(10px, 8px + 0.625vw, 12px); }
  }

  /* ---------- HOVER PREVIEW ---------- */
  .hover-preview{
    position:fixed;
    z-index:60;
    width: 45vw;
    max-width: 650px;
    pointer-events:none;
    opacity:0;
    transition: none;
  }
  .hover-preview.show{
    opacity:1;
  }
  .hover-preview img{
    width:100%;
    height:auto;
    display:block;
    box-shadow: 0 30px 60px rgba(0,0,0,0.18);
    background:#111;
    -webkit-user-drag:none;
    -webkit-touch-callout:none;
  }

  /* ---------- DETAIL PAGE ---------- */
  .detail-page{
    position:fixed;
    inset:0;
    z-index:50;
    background:#ffffff;
    opacity:0;
    pointer-events:none;
    /* 注意：這裡故意不對 opacity 加 transition。這片純白背景如果本身也用
       淡出/淡入動畫，在它還是半透明的那零點幾秒之間，底下的照片格子會透出來，
       使用者看到的就是「畫面下方閃過一下首頁縮圖」，而不是乾淨地淡入照片——
       這正是「前幾次點進去會閃過小圖」這個 bug 的成因。改成瞬間出現（不透明、
       完全蓋住底下的格子），真正的淡入效果交給下面 .detail-image-wrap 自己的
       0.25s opacity transition 負責（照片本身在純白背景之上淡入），這樣使用者
       看到的就是乾淨地淡入照片，不會有格子透出來的問題。 */
    touch-action: pinch-zoom; /* 擋掉單指上下滑動捲動，但保留雙指縮放的手勢 */
    overflow:hidden;
  }
  .detail-page.active{
    opacity:1;
    pointer-events:auto;
  }
  .detail-image-wrap{
    position:absolute;
    transition: opacity .25s ease;
    opacity:0;
  }
  .detail-image-wrap.show{ opacity:1; }
  .detail-image-wrap img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    -webkit-user-drag:none;
    -webkit-touch-callout:none;
  }

  .nav-arrow{
    position:fixed;
    top:50%;
    transform: translateY(-50%);
    background:none;
    border:none;
    color:#000;
    z-index:55;
    padding:20px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: opacity .2s ease;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .nav-arrow svg{
    width:22px;
    height:22px;
    display:block;
  }
  .nav-left{ left: calc(var(--edge) - 20px); }
  .nav-right{ right: calc(var(--edge) - 20px); }
  .nav-left svg{ transform: scaleX(-1); }
  @media (hover: hover){
    /* 觸控裝置點擊常被瀏覽器模擬成短暫的 :hover，導致手機上點按鈕會看到
       變淡一下這個不想要的效果；限制在真正有滑鼠懸停能力的裝置才生效 */
    .nav-arrow:hover{ opacity:0.5; }
  }

  .nav-back{
    position:fixed;
    top:170px;
    left: calc(var(--edge) - 20px);
    transform:none;
  }
  .nav-back svg{ transform: rotate(-90deg); }
  @media (hover: hover){
    .nav-back:hover{ opacity:0.5; }
  }

  .detail-info{
    position:fixed;
    left: var(--detail-info-left, var(--edge));
    top: var(--detail-info-top, auto);
    bottom: 40px; /* fallback before JS computes --detail-info-top; ignored once top is set */
    z-index:55;
    text-align:left;
    /* 字級、行距直接沿用 header 那排標題用的同一個變數/比例，兩邊永遠一致，
       header 變小（例如手機版）這裡就跟著一起變小，不用兩處分別調整 */
    font-size: var(--header-font-size);
    line-height:1.5;
    /* 手機版 header 是橫向一排、用 space-between 排版，"collab" 常常被推到很
       靠右的地方，如果 detail-info 從那個 x 座標開始還維持不換行的單行文字，
       絕大部分內容會直接超出螢幕右側被裁掉、整段看起來就像「不見了」。
       這裡限制寬度為「從目前這個 left 位置到螢幕右側邊界（扣掉 edge）」剩下的
       空間，超過就自動換行，確保不管 left 落在螢幕哪個位置，文字都完整留在
       可視範圍內，同時仍然維持「對齊 collab 左側」這個位置關係。 */
    max-width: calc(100vw - var(--detail-info-left, var(--edge)) - var(--edge));
    overflow-wrap: break-word;
  }
  .detail-info .detail-number{ color:#000; }
  .detail-info .detail-title{ color:#000; }

  /* "preview" 標籤現在是 .fixed-header 裡的一般欄位（跟 header-left / header-right
     用同一套 grid/flex 排版），樣式定義已合併到上面的 .fixed-header 規則，
     不再需要獨立的 position:fixed + JS 算像素位置 + opacity 淡入技巧 —— 這樣它
     一定跟另外兩塊文字同時、立刻出現，畫面變窄時也會跟著同一套 grid/flex 換行，
     不會被推出螢幕外。 */

  /* ---------- PREVIEW PAGE（左右交錯全版跳轉） ---------- */
  .preview-page{
    position:fixed;
    inset:0;
    z-index:900;
    display:flex; /* 一律保持 flex 版面，用 opacity+visibility 做淡入淡出，
                     不再用 display 直接切換（那樣完全沒有轉場、是瞬間跳出來） */
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    /* 進場：opacity 立刻開始淡入，visibility 也立刻變 visible（delay:0s），
       不然還沒淡入就先被 visibility 卡住看不到。
       退場交給 .active 被移除時，下面沒有 .active 的這條規則接手（見下）。 */
    transition: opacity .15s ease, visibility 0s linear 0s;
    touch-action:none; /* 這個頁面不能捲動/縮放 */
  }
  .preview-page.active{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
  }
  .preview-page:not(.active){
    /* 退場：opacity 淡出的這 0.15s 期間，visibility 還要維持 visible，
       等淡出動畫真正跑完（transition-delay 跟 opacity 的時長對齊）才切成
       hidden，不然畫面會在還沒淡完就被 visibility 直接切掉、變成一半淡出
       一半瞬間消失的怪異效果 */
    transition: opacity .15s ease, visibility 0s linear .15s;
  }
  .preview-col{
    position:relative;
    width:50%;
    height:100%;
    overflow:hidden;
    background:#000;
  }
  .preview-col img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover; /* 剛好填滿區域、不留白，也不會過度放大 */
    display:block;
    -webkit-user-drag:none;
    -webkit-touch-callout:none;
  }

  /* 手機：左右兩欄改成上下兩欄。只改排版方向跟每欄的寬高比例，跳轉的時機/節奏
     （JS 那邊完全沒動）跟每張照片的填滿方式（object-fit:cover）都維持不變。 */
  @media (max-width: 640px){
    .preview-page.active{
      flex-direction: column;
    }
    .preview-col{
      width:100%;
      height:50%;
    }
  }

  /* DVD 螢幕保護程式風格的彈跳圖示：只在手機版的 preview 頁面顯示。用
     position:absolute + transform 定位（JS 算好 x/y 直接寫 transform，
     不动 top/left，效能比較好），z-index 拉到最高蓋過頁面裡所有東西
     （包含左右兩張照片）。
     pointer-events 預設 none（跟原本一樣，桌機/非手機寬度時它本來就
     display:none，不會收到任何事件）；只有在手機版 preview 頁面顯示的
     那條 media query 裡才打開 pointer-events:auto，讓使用者可以用手指抓取、
     甩動它——其餘情況點在它所在的位置一樣會直接穿透、關閉 preview 頁面。 */
  .dvd-bounce{
    position:absolute;
    top:0; left:0;
    width:70px;
    height:auto;
    z-index:9999;
    pointer-events:none;
    display:none;

  const demoDims = [
    { w: 900,  h: 1200 }, { w: 1000, h: 1000 }, { w: 1300, h: 900  },

  ];

  const demoColors = ['#1a1a1a','#242424','#151515','#2c2c2c','#1e1e1e'];

  function makePlaceholder(w, h, color, label){
    const fontSize = Math.round(w * 0.08);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`
      + `<rect width="100%" height="100%" fill="${color}"/>`
      + `<text x="50%" y="50%" fill="#ffffff" fill-opacity="0.85" font-family="sans-serif" `
      + `font-size="${fontSize}" text-anchor="middle" dominant-baseline="middle">${label}</text>`
      + `</svg>`;
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  }

  const demoPhotos = demoFileNames.map((name, i) => {
    const dims = demoDims[i % demoDims.length];
    const color = demoColors[i % demoColors.length];
    const placeholderUrl = makePlaceholder(dims.w, dims.h, color, String(i + 1).padStart(3, '0'));
    return {
      title: name.replace(/\.[^/.]+$/, ''),
      url: placeholderUrl,
      thumbUrl: placeholderUrl
    };
  });

  // 左右箭頭原本用 top:50% + transform:translateY(-50%) 置中，
  // 這種「百分比 + transform」的組合在手機 Safari 雙指縮放時，
  // WebKit 不會即時重算百分比位置，導致縮放過程中箭頭跟著漂移。
  // 改成用 JS 算好的固定像素 top（跟不會漂移的返回鍵按鈕做法一致），
  // 縮放中就不會有東西需要重新計算，自然不會飄動。
  function positionNavArrows(){
    [prevBtn, nextBtn].forEach(btn => {
      const h = btn.getBoundingClientRect().height || 64;
      const top = Math.round((window.innerHeight - h) / 2);
      btn.style.top = top + 'px';
      btn.style.transform = 'none';
    });
  }

  function syncDetailInfoAlignment(){
    const rect = headerRight.getBoundingClientRect();
    document.documentElement.style.setProperty('--detail-info-left', rect.left + 'px');

    if(detailInfo){
      const infoH = detailInfo.getBoundingClientRect().height || 0;

      document.documentElement.style.setProperty('--detail-info-top', Math.round(top) + 'px');
    }
  }

  // "preview" 標籤對齊 002、"collab" 區塊（header-right）對齊 004，做法完全一樣，
  // 所以抽成同一個函式重複用：對齊下方指定照片實際渲染出來的左邊緣（縮圖是置中
  // 顯示在格子裡的，跟格子本身的邊緣不一樣，所以格子對齊還不夠準）。
  //
  // 在桌機滿版 5 欄範圍內「持續即時追蹤」目標照片實際渲染出來的位置——拖曳寬度
  // 時，照片的位置本身就是連續、按比例在變化的（欄寬隨容器寬度平滑縮放），
  // 每一幀都重新量測、對齊，標籤自然就會跟著它一起連續、按比例地滑動，效果
  // 就是「拉動時自由按比例縮放」。
  //
  // （曾經試過「只在最大寬度量一次、之後凍結成固定偏移量疊加在 flex 自然位置
  // 上」，但 flex 用 justify-content:space-between 算出來的中間項位置，本來就
  // 跟下面照片格子的欄位邊界是兩套完全無關的邏輯，固定偏移量疊加在跟照片無關的
  // 位置上，整段拖曳過程都會對不準，不只是斷點那一下——所以改回這個持續追蹤的
  // 版本，才是真正跟著照片格子按比例移動的做法。）
  //
  // 唯一無法避免的：5→3 欄的斷點本身，是照片格子「整數欄數」瞬間切換造成的
  // 結構性跳動——目標照片自己在那一刻就會被搬到完全不同的欄位寬度（不是連續
  // 縮放，是離散跳動），不是「拖曳中持續追蹤」這個做法造成的問題；只要還要求
  // 兩側都精準對齊該照片，這一下跳動就無法用 JS 消除，除非放棄其中一側的精準
  // 對齊。
  const DESKTOP_BREAKPOINT = 1100; // 與 CSS 中 .grid 從 5 欄變 3 欄的 media query 門檻一致
  function syncEdgeAlignment(el, cssVar, targetDataIndex){
    if(!el || !grid) return;

    if(window.innerWidth <= DESKTOP_BREAKPOINT){
      document.documentElement.style.setProperty(cssVar, '0px');
      // 窄螢幕不需要精準對齊照片，目前這個位置（0 偏移）本來就已經是最終位置，
      // 直接顯示出來，不會有「先跑到錯誤位置」的問題
      el.classList.add('positioned');
      return;
    }

    const targetImg = grid.querySelector(`.grid-item[data-index="${targetDataIndex}"] img`);
    if(!targetImg) return; // 目標照片還沒渲染出來，先不顯示這個標籤，等它真的渲染出來再算
    const imgRect = targetImg.getBoundingClientRect();
    if(!imgRect.width) return; // 圖片還沒渲染出寬度，先不調，等 load 事件再算一次

    // 讀回目前已經套用的偏移量，還原出「沒有微調時」原本的左邊界，再算出新的
    // 偏移量——因為對應元素的 left 沒有 CSS transition（見 CSS 註解），這裡讀到
    // 的永遠是瀏覽器已經套用完成的實際值，不會有動畫插值中的數值跟目標值對不上、
    // 導致越算越偏的問題。
    const elRect = el.getBoundingClientRect();
    const currentNudge = parseFloat(getComputedStyle(document.documentElement).getPropertyValue(cssVar)) || 0;
    const baseLeft = elRect.left - currentNudge;
    const nudge = Math.round(imgRect.left - baseLeft);
    document.documentElement.style.setProperty(cssVar, nudge + 'px');
    // 算出真正精準的位置後才顯示（見 CSS 的 opacity:0 / .positioned 規則），
    // 這是「進頁面/重新整理時標籤會先跑到錯誤位置再跳回來」這個 bug 的修法：
    // 與其讓它先出現在錯誤（預設 0 偏移）的位置、算完再跳過去，不如乾脆讓它
    // 在還沒算出正確位置之前保持隱藏，算完直接在正確位置出現，使用者就不會
    // 看到那個「跳」的過程。
    el.classList.add('positioned');
  }
  function syncPreviewAlignment(){
    syncEdgeAlignment(previewLabel, '--preview-nudge', 1); // 002 = data-index "1"
  }
  function syncHeaderRightAlignment(){
    syncEdgeAlignment(headerRight, '--header-right-nudge', 3); // 004 = data-index "3"
  }
  function syncHeaderLeftAlignment(){
    syncEdgeAlignment(backHome, '--header-left-nudge', 0); // 001 = data-index "0"
  }

  // 統一入口：視窗/版面真正穩定下來時（不是縮放中）才呼叫，
  // 一次把左右箭頭、detail-info 文字、header-left、preview 標籤、collab 區塊
  // 都重新定位好。
  function syncFixedChrome(){
    syncDetailInfoAlignment();
    positionNavArrows();
    syncHeaderLeftAlignment();
    syncPreviewAlignment();
    syncHeaderRightAlignment();
  }

  async function fetchDriveImages(){
    if(!GOOGLE_API_KEY || GOOGLE_API_KEY === 'YOUR_API_KEY' ||
       !GOOGLE_DRIVE_FOLDER_ID || GOOGLE_DRIVE_FOLDER_ID === 'YOUR_FOLDER_ID'){
      return demoPhotos;
    }

    try{
      const q = encodeURIComponent(`'${GOOGLE_DRIVE_FOLDER_ID}' in parents and mimeType contains 'image/' and trashed = false`);
      const fields = encodeURIComponent('files(id,name,createdTime,thumbnailLink)');
      const url = `https://www.googleapis.com/drive/v3/files?q=${q}&fields=${fields}&orderBy=name&key=${GOOGLE_API_KEY}`;

      const res = await fetch(url);
      if(!res.ok) throw new Error('Drive API request failed: ' + res.status);
      const data = await res.json();

      if(!data.files || data.files.length === 0) return demoPhotos;

      return data.files
        .sort((a,b) => a.name.localeCompare(b.name))
        .map(file => {
          // thumbnailLink 是 Google 圖片 CDN 產生的、已經縮圖過的版本（速度快、
          // 全球都有快取節點，也比較不會像 uc?export=view 那樣在檔案較大時
          // 被擋掉或跳出「無法掃描病毒」的中介頁面）。網格縮圖只是小圖，
          // 用 800px 的版本畫質完全足夠；點開大圖看細節時才用原始全尺寸檔案，
          // 畫質不受任何影響。
          const thumbBase = file.thumbnailLink ? file.thumbnailLink.replace(/=s\d+$/, '') : '';
          return {
            title: file.name.replace(/\.[^/.]+$/, ''),
            url: `https://drive.google.com/uc?export=view&id=${file.id}`, // 原始全尺寸檔案：畫質最高，但走 drive.google.com/uc，
                                                                            // 不是 CDN，檔案大時常常要等好幾秒才回應，甚至偶爾被
                                                                            // 導去「無法掃描病毒」的中介頁面——這是白屏拖很久的主因
            // detailUrl：大圖頁真正優先使用的來源。一樣是 thumbnailLink 這個
            // Google 圖片 CDN（全球節點、速度快很多），只是把尺寸從網格用的
            // 800px 拉到 2000px——一般螢幕（含 Retina）全螢幕顯示都綽綽有餘，
            // 肉眼幾乎看不出跟原始檔案的差異，但下載速度是原本 uc?export=view
            // 的好幾倍快，白屏時間大幅縮短。
            detailUrl: thumbBase ? (thumbBase + '=s2000') : '',
            thumbUrl: thumbBase ? (thumbBase + '=s800') : `https://drive.google.com/uc?export=view&id=${file.id}`, // 網格縮圖：小、快
            fallbackUrl: thumbBase ? (thumbBase + '=s1600') : '' // 縮圖／原圖都失敗時的備援
          };
        });
    }catch(err){
      return demoPhotos;
    }
  }

  function renderGrid(){
    grid.innerHTML = '';
    photos.forEach((photo, i) => {
      const item = document.createElement('div');
      item.className = 'grid-item';
      item.dataset.index = i;

      const thumbWrap = document.createElement('div');
      thumbWrap.className = 'thumb-wrap';

      const img = document.createElement('img');
      img.alt = photo.title;
      img.draggable = false;
      img.decoding = 'async'; // 解碼不卡主執行緒，捲動/縮放更順
      // 手機沒有 hover 預覽功能，用瀏覽器原生 lazy loading 讓非畫面內的縮圖
      // 延後下載，省流量、加快第一批可見縮圖出現的速度；桌機保留即時載入，
      // 確保滑鼠移過去的當下大圖預覽完全不用等。
      if(supportsTouch) img.loading = 'lazy';
      img.addEventListener('load', () => img.classList.add('loaded'));
      if(i === 0){
        // "photobook by edenchen"（header-left）對齊 001，同樣要等這張圖片真的
        // 渲染出寬度才能算準
        img.addEventListener('load', syncHeaderLeftAlignment);
      }
      if(i === 1){
        // "preview" 標籤的精準桌機對齊要用這張圖片實際渲染出來的寬度才能算，
        // 圖片載入完成（知道真正尺寸）後再嘗試量測一次（如果之前還沒量過）
        img.addEventListener('load', syncPreviewAlignment);
      }
      if(i === 3){
        // "collab" 區塊（header-right）對齊 004，同樣要等這張圖片真的渲染出
        // 寬度才能算準
        img.addEventListener('load', syncHeaderRightAlignment);
      }
      img.onerror = () => {
        // 縮圖失敗 → 換大一點的備援縮圖 → 最後才退回原始全尺寸檔案
        if(photo.fallbackUrl && img.src !== photo.fallbackUrl){
          img.src = photo.fallbackUrl;
        } else if(img.src !== photo.url){
          img.src = photo.url;
        }
      };
      img.src = photo.thumbUrl || photo.url; // 網格用小圖，快很多；大圖頁另外載入原始檔

      thumbWrap.appendChild(img);

      const idx = document.createElement('div');
      idx.className = 'idx';
      idx.textContent = pad3(i + 1);

      item.appendChild(thumbWrap);
      item.appendChild(idx);
      grid.appendChild(item);

      item.addEventListener('click', () => openDetail(i));
      if(supportsHover){
        img.addEventListener('mouseenter', () => showHoverPreview(photo, img));
        img.addEventListener('mouseleave', hideHoverPreview);
      }
    });
  }

  function computeSafeRandomPosition(excludeRect, boxW, boxH){
    const margin = 24;
    const buffer = 16;
    const safeExclude = {
      left: excludeRect.left - buffer,
      top: excludeRect.top - buffer,
      right: excludeRect.right + buffer,
      bottom: excludeRect.bottom + buffer
    };

    const maxLeft = Math.max(margin, window.innerWidth - boxW - margin);
    const maxTop = Math.max(margin, window.innerHeight - boxH - margin);

    let best = null;

    for(let attempt = 0; attempt < 40; attempt++){
      const left = margin + Math.random() * (maxLeft - margin);
      const top = margin + Math.random() * (maxTop - margin);
      const rect = { left, top, right: left + boxW, bottom: top + boxH };

      const overlapsCursorArea =
        rect.left < safeExclude.right && rect.right > safeExclude.left &&
        rect.top < safeExclude.bottom && rect.bottom > safeExclude.top;

      if(!overlapsCursorArea){
        best = rect;
        break;
      }
    }

    if(!best){
      const roomRight = window.innerWidth - safeExclude.right;
      const roomLeft = safeExclude.left;
      const roomBottom = window.innerHeight - safeExclude.bottom;
      const roomTop = safeExclude.top;
      const maxRoom = Math.max(roomRight, roomLeft, roomBottom, roomTop);

      let left, top;
      if(maxRoom === roomRight){
        left = Math.min(window.innerWidth - boxW - margin, safeExclude.right + margin);
        top = Math.min(Math.max(margin, excludeRect.top), window.innerHeight - boxH - margin);
      } else if(maxRoom === roomLeft){
        left = Math.max(margin, safeExclude.left - boxW - margin);
        top = Math.min(Math.max(margin, excludeRect.top), window.innerHeight - boxH - margin);
      } else if(maxRoom === roomBottom){
        top = Math.min(window.innerHeight - boxH - margin, safeExclude.bottom + margin);
        left = Math.min(Math.max(margin, excludeRect.left), window.innerWidth - boxW - margin);
      } else {
        top = Math.max(margin, safeExclude.top - boxH - margin);
        left = Math.min(Math.max(margin, excludeRect.left), window.innerWidth - boxW - margin);
      }
      best = { left: Math.max(margin, left), top: Math.max(margin, top) };
    }

    return best;
  }

  function showHoverPreview(photo, itemEl){
    // guard: on the rare chance this thumbnail hasn't finished loading yet,
    // wait for it — cloning an incomplete image is what caused the flicker
    if(!(itemEl.complete && itemEl.naturalWidth)){
      const onReady = () => {
        itemEl.removeEventListener('load', onReady);
        if(itemEl.matches(':hover')) showHoverPreview(photo, itemEl);
      };
      itemEl.addEventListener('load', onReady);
      return;
    }

    // clone the thumbnail that's already loaded & decoded on screen — this
    // guarantees the preview shows THIS photo immediately, with no stale
    // frame from whichever photo was hovered previously
    hoverPreview.innerHTML = '';
    const bigImg = itemEl.cloneNode();
    bigImg.removeAttribute('loading');
    bigImg.draggable = false;
    bigImg.onerror = () => { if(photo.fallbackUrl) bigImg.src = photo.fallbackUrl; };
    hoverPreview.appendChild(bigImg);

    placeAndReveal(itemEl); // itemEl is the on-screen thumbnail, already loaded: no waiting needed
  }

  function placeAndReveal(itemEl){
    const boxW = hoverPreview.getBoundingClientRect().width || Math.min(window.innerWidth * 0.45, 650);
    const ratio = (itemEl.naturalHeight && itemEl.naturalWidth)
      ? itemEl.naturalHeight / itemEl.naturalWidth
      : 1;
    const boxH = boxW * ratio;

    const excludeRect = itemEl.getBoundingClientRect();
    const pos = computeSafeRandomPosition(excludeRect, boxW, boxH);

    hoverPreview.style.left = pos.left + 'px';
    hoverPreview.style.top = pos.top + 'px';
    hoverPreview.classList.add('show');
  }

  function hideHoverPreview(){
    hoverPreview.classList.remove('show');
  }

  let detailToken = 0;
  let lastNaturalW = 0, lastNaturalH = 0;

  function positionDetailImage(naturalW, naturalH){
    const ratio = (naturalW && naturalH) ? naturalW / naturalH : 1;

    const isMobile = window.innerWidth <= 640;

    // clear the arrows / back button / bottom-right info on any viewport;
    // desktop keeps its original clearance, mobile gets a much tighter one
    // (just enough to clear the arrow buttons) so the photo can go near-max size
    const horizontalClearance = isMobile ? 130 : 220;
    const verticalClearance = isMobile ? 190 : 260;

    const availW = Math.max(120, window.innerWidth - horizontalClearance);
    const availH = Math.max(120, window.innerHeight - verticalClearance);

    let w = availW;
    let h = w / ratio;
    if(h > availH){
      h = availH;
      w = h * ratio;
    }

    detailImageWrap.style.width = w + 'px';
    detailImageWrap.style.height = h + 'px';

    const left = (window.innerWidth - w) / 2;
    const top = (window.innerHeight - h) / 2;

    detailImageWrap.style.left = left + 'px';
    detailImageWrap.style.top = top + 'px';
  }

  function renderDetail(){
    const token = ++detailToken;
    const photo = photos[currentIndex];

    detailNumber.textContent = pad3(currentIndex + 1);
    detailTitle.textContent = photo.title;
    syncDetailInfoAlignment(); // 標題長度不同，高度可能改變，重新算一次 top

    // fade out immediately — this is the instant visible feedback on click
    detailImageWrap.classList.remove('show');

    // ---- 先用已經在畫面上、瀏覽器早就快取好的網格縮圖「暖場」----
    // 這是白屏拖很久的主要對策：與其整段時間都空白，先把網格那張已經解碼完成
    // 的縮圖（800px，使用者剛剛就是看著它點進來的）立刻放進大圖區顯示出來，
    // 讓畫面在點擊的瞬間就有內容；等下面真正的高畫質版本載入完成，再無縫換成
    // 那張圖。縮圖本身畫質不受影響——使用者最終看到的還是高畫質版本，這裡只是
    // 拿它來墊過渡的空窗期。
    const gridItemImg = document.querySelector(`.grid-item[data-index="${currentIndex}"] img`);
    const warmSrc = (gridItemImg && gridItemImg.complete && gridItemImg.naturalWidth) ? gridItemImg.src : (photo.thumbUrl || '');
    if(warmSrc){
      const ratio = (gridItemImg && gridItemImg.naturalWidth && gridItemImg.naturalHeight)
        ? gridItemImg.naturalWidth / gridItemImg.naturalHeight : 1;
      lastNaturalW = ratio * 1000;
      lastNaturalH = 1000;
      positionDetailImage(lastNaturalW, lastNaturalH);
      detailImage.src = warmSrc;
      requestAnimationFrame(() => detailImageWrap.classList.add('show'));
    }

    const loader = new Image();

    const commit = () => {
      if(token !== detailToken) return;
      lastNaturalW = loader.naturalWidth || 1;
      lastNaturalH = loader.naturalHeight || 1;
      positionDetailImage(lastNaturalW, lastNaturalH);
      detailImage.src = loader.src;
      requestAnimationFrame(() => detailImageWrap.classList.add('show'));
    };

    // 依序嘗試：detailUrl（Google 圖片 CDN、2000px，又快畫質又好，優先用）→
    // fallbackUrl（同一個 CDN 但 1600px，備援）→ url（原始全尺寸檔案，走
    // drive.google.com/uc，最慢，留到真的都失敗才用）→ thumbUrl（保底）
    const sources = [photo.detailUrl, photo.fallbackUrl, photo.url, photo.thumbUrl].filter(Boolean);
    let srcIdx = 0;
    function tryNext(){
      if(srcIdx >= sources.length) return;
      loader.src = sources[srcIdx++];
    }
    loader.onload = commit;
    loader.onerror = tryNext;
    tryNext();

    // already cached — 'load' may not fire again, handle synchronously
    if(loader.complete && loader.naturalWidth){
      commit();
    }

    prefetchNeighbors(currentIndex);
  }

  // 靜默預先下載鄰近的照片（左右各 2 張），這樣按下一張/上一張箭頭時
  // 圖片幾乎都已經在瀏覽器快取裡，可以立即無延遲切換
  const prefetchedUrls = new Set();
  function prefetchOne(url){
    if(!url || prefetchedUrls.has(url)) return;
    prefetchedUrls.add(url);
    const im = new Image();
    im.src = url;
  }
  function prefetchNeighbors(index){
    const n = photos.length;
    if(!n) return;
    for(let d = 1; d <= 2; d++){
      const next = photos[(index + d) % n];
      const prev = photos[(index - d + n) % n];
      prefetchOne(next.detailUrl || next.url);
      prefetchOne(prev.detailUrl || prev.url);
    }
  }

  function openDetail(index){
    currentIndex = index;
    hideHoverPreview();
    detailPage.classList.add('active');
    document.body.style.overflow = 'hidden';
    syncFixedChrome();
    renderDetail();
  }

  function closeDetail(){
    detailPage.classList.remove('active');
    detailImageWrap.classList.remove('show'); // 立刻清空，避免下次打開時先閃一下舊照片
    document.body.style.overflow = '';
  }

  /* =========================================================
     PREVIEW PAGE：左右交錯全版跳轉
  ========================================================= */

  // 在等待期間先把「下一張」的圖片載入 + 解碼好（不只是下載，是連畫面像素都準備好），
  // 這樣真正切換的那一刻只是換一個已經解碼完成的 src，瀏覽器可以直接上屏，
  // 不會因為臨時解碼大圖而卡頓、看起來像是有轉場。
  //
  // 這裡同時修正黑屏問題：photo.url 是 Google Drive 的 uc?export=view 連結，
  // 在某些情況下（例如檔案較大時 Google 會回傳「無法掃描病毒」的中介頁面，
  // 而不是圖片本身）會直接載入失敗；原本失敗後沒有任何備援，img 就一直是空的，
  // 底下 .preview-col 的黑色背景就會整片露出來。現在依序嘗試
  // 原始大圖 → 高解析度縮圖(fallbackUrl) → 一般縮圖(thumbUrl)，
  // 只要任何一個能載入成功就使用它。
  function loadWithFallback(photo){
    return new Promise((resolve) => {
      const candidates = [photo && photo.detailUrl, photo && photo.fallbackUrl, photo && photo.url, photo && photo.thumbUrl].filter(Boolean);
      if(!candidates.length){ resolve(''); return; }

      let i = 0;
      const img = new Image();

      function finish(url){
        if(img.decode){
          img.decode().then(() => resolve(url)).catch(() => resolve(url));
        } else {
          resolve(url);
        }
      }

      function tryNext(){
        if(i >= candidates.length){ resolve(''); return; }
        const url = candidates[i++];
        img.onload = () => finish(url);
        img.onerror = tryNext;
        img.src = url;
      }

      tryNext();
    });
  }

  // ---- 序列與起始張：
  // 右側＝單數編號（001, 003, 005...），從最前面第一張開始，往後遞增播放
  // 左側＝雙數編號（002, 004, 006...），從最後一張開始，往前遞減播放
  // 這樣左右像是「從兩端往中間跑」，方向剛好相反、不會混在一起
  let previewOddPhotos = [];   // 右側序列
  let previewEvenPhotos = [];  // 左側序列
  let previewLeftIdx = 0;
  let previewRightIdx = 0;
  let previewActive = false;
  let previewTurn = 'left';
  let previewTimer = null;
  const previewResolvedLeft = [];
  const previewResolvedRight = [];

  function resolvePreviewImage(photo, cache, idx){
    if(cache[idx]) return cache[idx];
    const p = loadWithFallback(photo);
    cache[idx] = p;
    return p;
  }

  // 把當前這一側該顯示的那張圖，重新（提早）暖機一次：
  // 先觸發載入 + decode，讓瀏覽器準備好像素，之後真正要顯示時幾乎是瞬間的
  //
  // 注意：這裡故意「不」清空 previewResolvedLeft / previewResolvedRight 快取。
  // 每次點進 preview 頁面的起始索引永遠是同一組固定值（左：最後一張／右：
  // 第一張），如果每次都把快取清空重來，等於把 preparePreviewSequences() 在
  // 網頁一開始就先做好的預熱結果整個丟掉，使用者點進來時又要重新等一次載入，
  // 這正是「剛點進去偶爾全黑」的原因。保留快取，resolvePreviewImage() 內建的
  // `if(cache[idx]) return cache[idx];` 判斷就會直接沿用已經載入好（或正在
  // 載入中）的同一個 promise，不會重複下載、也不會重新等待。
  function warmPreviewStart(){
    previewLeftIdx = previewEvenPhotos.length ? previewEvenPhotos.length - 1 : 0; // 左側：最後一張
    previewRightIdx = 0; // 右側：第一張
    if(previewEvenPhotos.length) resolvePreviewImage(previewEvenPhotos[previewLeftIdx], previewResolvedLeft, previewLeftIdx);
    if(previewOddPhotos.length) resolvePreviewImage(previewOddPhotos[previewRightIdx], previewResolvedRight, previewRightIdx);

    // 同時把「進頁面後第一次切換」會用到的下一張也先預熱。原本只暖機起始畫面，
    // 下一張要等真正切換到那一刻（stepPreviewSide 觸發時）才開始下載——如果
    // 那時候使用者剛好進頁面沒多久、圖片還在載入中，第一輪的切換就會等圖片
    // 載完才真正換畫面，使得開頭幾次切換的間隔時間長短不一（不規則跳動），
    // 要等這個「提前一步」的暖機追上進度後才會穩定成固定的 0.5 秒節奏。
    // 這裡提前暖機，讓它從使用者一點進頁面（甚至更早，preparePreviewSequences
    // 在照片清單一到手就會呼叫這個函式）就開始下載，通常會有遠超過 0.5 秒的
    // 提前量，等真正切換到它時多半早就已經載完。
    if(previewEvenPhotos.length > 1){
      const nextLeftIdx = (previewLeftIdx - 1 + previewEvenPhotos.length) % previewEvenPhotos.length;
      resolvePreviewImage(previewEvenPhotos[nextLeftIdx], previewResolvedLeft, nextLeftIdx);
    }
    if(previewOddPhotos.length > 1){
      const nextRightIdx = (previewRightIdx + 1) % previewOddPhotos.length;
      resolvePreviewImage(previewOddPhotos[nextRightIdx], previewResolvedRight, nextRightIdx);
    }
  }

  // 照片清單一到手就準備好 preview 用的兩組序列，並且立刻開始暖機第一張，
  // 這樣不管使用者何時點下 preview，兩張起始畫面大機率早就載入/解碼完成，
  // 點進去馬上就能看到照片，不會有黑屏的空檔
  function preparePreviewSequences(){
    previewOddPhotos = photos.filter((_, i) => i % 2 === 0);
    previewEvenPhotos = photos.filter((_, i) => i % 2 === 1);
    warmPreviewStart();
  }

  async function applyPreviewSide(side){
    const seq = side === 'left' ? previewEvenPhotos : previewOddPhotos;
    const cache = side === 'left' ? previewResolvedLeft : previewResolvedRight;
    const imgEl = side === 'left' ? previewLeftImg : previewRightImg;
    if(!seq.length) return;
    const idx = side === 'left' ? previewLeftIdx : previewRightIdx;
    const url = await resolvePreviewImage(seq[idx], cache, idx);
    if(!previewActive) return;
    const stillCurrent = (side === 'left' ? previewLeftIdx : previewRightIdx) === idx;
    if(stillCurrent && url) imgEl.src = url;
  }

  function stepPreviewSide(side){
    if(side === 'left'){
      if(!previewEvenPhotos.length) return;
      previewLeftIdx = (previewLeftIdx - 1 + previewEvenPhotos.length) % previewEvenPhotos.length; // 左側往前遞減
    } else {
      if(!previewOddPhotos.length) return;
      previewRightIdx = (previewRightIdx + 1) % previewOddPhotos.length; // 右側往後遞增
    }
    // 順便預先暖機下一輪那一側會用到的圖片
    const nextSeq = side === 'left' ? previewEvenPhotos : previewOddPhotos;
    const nextCache = side === 'left' ? previewResolvedLeft : previewResolvedRight;
    const nextIdx = side === 'left'
      ? (previewLeftIdx - 1 + previewEvenPhotos.length) % previewEvenPhotos.length
      : (previewRightIdx + 1) % previewOddPhotos.length;
    if(nextSeq.length) resolvePreviewImage(nextSeq[nextIdx], nextCache, nextIdx);
    applyPreviewSide(side);
  }

  // 左右交錯的單一計時器：固定每 0.5 秒切換一次，輪流換左邊、換右邊，
  // 第一次一定先換左邊，之後左右交替，順序永遠不會亂掉
  function schedulePreviewStep(){
    previewTimer = setTimeout(() => {
      if(!previewActive) return;
      stepPreviewSide(previewTurn);
      previewTurn = (previewTurn === 'left') ? 'right' : 'left';
      schedulePreviewStep();
    }, 500);
  }

  function startPreviewCycle(){
    previewActive = true;
    previewTurn = 'left'; // 下一次（0.5 秒後）換的是左邊，符合「左側先跳轉」
    clearTimeout(previewTimer);

    // 起始畫面（暖機過的那張）先顯示出來，等兩張都真的顯示完成後，才開始排程
    // 0.5 秒後的第一次切換——如果不等，計時器可能在圖片還沒載入完成前就先到，
    // 把索引往前推進，導致原本那次載入完成時比對「已經不是目前這張」而被跳過，
    // 畫面看起來就是一開始亂跳、要等載入追上進度後才恢復正常節奏。
    Promise.all([ applyPreviewSide('left'), applyPreviewSide('right') ]).then(() => {
      if(!previewActive) return; // 等待載入的過程中，使用者可能已經把 preview 頁面關掉了
      schedulePreviewStep();
    });
  }

  function stopPreviewCycle(){
    previewActive = false;
    clearTimeout(previewTimer);
  }

  // pushHistory=false 用在「因為網址本來就是 #preview（例如重新整理、上一頁/下一頁）
  // 才開啟這個頁面」的情境，這種情況不需要再往歷史紀錄多推一筆，否則會造成
  // 網址狀態跟瀏覽器上一頁/下一頁按鈕的行為對不起來。
  // ---------- DVD 彈跳圖示（只在手機版 preview 頁面顯示） ----------
  const dvdBounce = document.getElementById('dvdBounce');
  const DVD_SIZE = 70; // 要跟 CSS 裡 .dvd-bounce 的寬度一致，用來算反彈邊界
  const DVD_SPEED = 210; // px/秒，平常巡迴的固定速度，也是甩出去之後最終會回穩到的速度
  const DVD_DECAY_MS = 4000; // 撞牆後，從當下的高速「慢慢地」線性衰減回 210 要花多久——這段
                              // 才是使用者要拉長的部分；維持在高速不變的那段時間不是這個變數
                              // 控制的，是由「甩出去後多久撞到第一面牆」這個物理碰撞決定的
  let dvdRAF = null;
  let dvdLastTime = null;
  let dvdX = 0, dvdY = 0;
  // 用「方向（單位向量）＋速度純量」拆開存，而不是直接存 dx/dy：撞牆只需要翻轉
  // 方向、甩出去的衰減只需要調整速度純量，兩件事互相獨立、不會打架
  let dvdDirX = 1, dvdDirY = 0;
  let dvdSpeed = DVD_SPEED;
  let dvdOverspeedActive = false; // 這次甩出去的速度是否高於 210（要等下一次撞牆才開始衰減）
  let dvdDecaying = false;
  let dvdDecayStartTime = 0;
  let dvdDecayStartSpeed = DVD_SPEED;

  function isMobileDvdActive(){
    return window.innerWidth <= 640 && previewPage.classList.contains('active');
  }

  function setDvdDirection(angle){
    dvdDirX = Math.cos(angle);
    dvdDirY = Math.sin(angle);
    // 避免角度太接近純水平/純垂直，看起來會像卡在一條線上來回
    if(Math.abs(dvdDirX) < 0.25) dvdDirX = dvdDirX < 0 ? -0.25 : 0.25;
    if(Math.abs(dvdDirY) < 0.25) dvdDirY = dvdDirY < 0 ? -0.25 : 0.25;
    const len = Math.hypot(dvdDirX, dvdDirY);
    dvdDirX /= len; dvdDirY /= len;
  }

  function resetDvdBounce(){
    const maxX = Math.max(1, window.innerWidth - DVD_SIZE);
    const maxY = Math.max(1, window.innerHeight - DVD_SIZE);
    dvdX = Math.random() * maxX;
    dvdY = Math.random() * maxY;
    setDvdDirection(Math.random() * Math.PI * 2); // 隨機挑一個方向出發，360 度都有機會
    dvdSpeed = DVD_SPEED;
    dvdOverspeedActive = false;
    dvdDecaying = false;
    dvdBounce.style.transform = `translate(${dvdX}px, ${dvdY}px)`;
  }

  function stepDvdBounce(timestamp){
    if(!isMobileDvdActive() || dvdDragging){
      dvdRAF = null;
      dvdLastTime = null;
      return;
    }
    if(dvdLastTime === null) dvdLastTime = timestamp;
    // 限制單幀最大時間差，避免分頁切到背景、幾秒後切回來時，圖示瞬間跳一大段
    const dt = Math.min(48, timestamp - dvdLastTime) / 1000;
    dvdLastTime = timestamp;

    // 甩出去的速度如果高於 210，撞到第一次牆之前維持原速度不變；真正的「慢慢
    // 衰減」是撞牆那一刻才開始計時（見下面 collided 判斷），這裡只是持續套用
    // 目前已經在衰減中的進度
    if(dvdDecaying){
      const progress = Math.min(1, (timestamp - dvdDecayStartTime) / DVD_DECAY_MS);
      dvdSpeed = dvdDecayStartSpeed + (DVD_SPEED - dvdDecayStartSpeed) * progress;
      if(progress >= 1){ dvdSpeed = DVD_SPEED; dvdDecaying = false; }
    }

    const maxX = window.innerWidth - DVD_SIZE;
    const maxY = window.innerHeight - DVD_SIZE;

    dvdX += dvdDirX * dvdSpeed * dt;
    dvdY += dvdDirY * dvdSpeed * dt;

    // 撞到邊緣就反彈：把座標夾回邊界內、水平或垂直方向的分量直接翻轉方向
    let collided = false;
    if(dvdX <= 0){ dvdX = 0; dvdDirX = Math.abs(dvdDirX); collided = true; }
    else if(dvdX >= maxX){ dvdX = maxX; dvdDirX = -Math.abs(dvdDirX); collided = true; }
    if(dvdY <= 0){ dvdY = 0; dvdDirY = Math.abs(dvdDirY); collided = true; }
    else if(dvdY >= maxY){ dvdY = maxY; dvdDirY = -Math.abs(dvdDirY); collided = true; }

    // 高於 210 甩出去的這次，撞到第一面牆之後才開始「慢慢地」衰減回 210，
    // 一旦開始衰減就不會被之後的其他撞牆重新觸發（用 dvdOverspeedActive 當開關）
    if(collided && dvdOverspeedActive){
      dvdOverspeedActive = false;
      dvdDecaying = true;
      dvdDecayStartTime = timestamp;
      dvdDecayStartSpeed = dvdSpeed;
    }

    dvdBounce.style.transform = `translate(${dvdX}px, ${dvdY}px)`;
    dvdRAF = requestAnimationFrame(stepDvdBounce);
  }

  function startDvdBounce(){
    if(dvdRAF || dvdDragging) return; // 已經在跑了，或正被手指抓著（放開再接手）
    if(!isMobileDvdActive()) return; // 不是手機版或頁面沒開，不啟動
    resetDvdBounce();
    dvdLastTime = null;
    dvdRAF = requestAnimationFrame(stepDvdBounce);
  }

  function stopDvdBounce(){
    if(dvdRAF){ cancelAnimationFrame(dvdRAF); dvdRAF = null; }
    dvdLastTime = null;
  }

  // ---------- 手指抓取 / 甩出去 ----------
  // 用 Pointer Events（觸控、滑鼠通用）：手指按下＝抓取（暫停自動彈跳、圖示
  // 跟著手指跑），放開＝根據放開前最近一小段時間的移動速度計算「甩出去」的
  // 方向跟速度，再接回原本的彈跳邏輯繼續跑。
  let dvdDragging = false;
  let dvdPointerId = null;
  let dvdGrabOffsetX = 0, dvdGrabOffsetY = 0; // 抓取當下，手指位置跟圖示左上角的距離，維持抓取點不跳動
  let dvdMoveSamples = []; // 最近的 {t, x, y} 取樣，放開時用來算「甩動當下」的瞬時速度

  function clampDvd(v, max){ return v < 0 ? 0 : (v > max ? max : v); }

  function dvdPointerDown(e){
    if(!isMobileDvdActive()) return;
    e.preventDefault();
    stopDvdBounce();
    dvdDragging = true;
    dvdPointerId = e.pointerId;
    try{ dvdBounce.setPointerCapture(e.pointerId); }catch(err){}

    const rect = dvdBounce.getBoundingClientRect();
    dvdGrabOffsetX = e.clientX - rect.left;
    dvdGrabOffsetY = e.clientY - rect.top;
    dvdX = rect.left;
    dvdY = rect.top;
    dvdMoveSamples = [{ t: performance.now(), x: dvdX, y: dvdY }];
    dvdBounce.style.transform = `translate(${dvdX}px, ${dvdY}px)`;
  }

  function dvdPointerMove(e){
    if(!dvdDragging || e.pointerId !== dvdPointerId) return;
    e.preventDefault();
    const maxX = window.innerWidth - DVD_SIZE;
    const maxY = window.innerHeight - DVD_SIZE;
    dvdX = clampDvd(e.clientX - dvdGrabOffsetX, maxX);
    dvdY = clampDvd(e.clientY - dvdGrabOffsetY, maxY);
    dvdBounce.style.transform = `translate(${dvdX}px, ${dvdY}px)`;

    const now = performance.now();
    dvdMoveSamples.push({ t: now, x: dvdX, y: dvdY });
    // 只留最近 ~100ms 的取樣，讓算出來的是「放開前那一瞬間甩動」的速度，
    // 不會被拖曳一開始比較慢的移動拉低平均值
    while(dvdMoveSamples.length > 2 && now - dvdMoveSamples[0].t > 100){
      dvdMoveSamples.shift();
    }
  }

  function dvdPointerUp(e){
    if(!dvdDragging || e.pointerId !== dvdPointerId) return;
    dvdDragging = false;
    try{ dvdBounce.releasePointerCapture(e.pointerId); }catch(err){}

    const now = performance.now();
    const first = dvdMoveSamples[0];
    const last = dvdMoveSamples[dvdMoveSamples.length - 1];
    const dt = Math.max(16, now - first.t) / 1000;
    let vx = (last.x - first.x) / dt;
    let vy = (last.y - first.y) / dt;
    let flingSpeed = Math.hypot(vx, vy);

    // 有偵測到方向才更新方向；幾乎沒有移動（flingSpeed 趨近 0）就維持原本
    // 抓取前的方向不變，反正接下來速度也趨近 0，方向本來就看不太出來
    if(flingSpeed > 0.5) setDvdDirection(Math.atan2(vy, vx));

    // 完全依偵測到的甩動速度決定之後的跑動速度，不再有最低 210px/秒的下限：
    // 甩得越輕就跑得越慢，幾乎沒移動、放開後就直接停在原地不動也可以
    dvdSpeed = flingSpeed;
    if(flingSpeed > DVD_SPEED){
      dvdOverspeedActive = true; // 高於 210，等下一次撞牆才開始慢慢衰減回 210
    } else {
      dvdOverspeedActive = false; // 210 以下（含靜止）不會自動變化，維持原速度
    }
    dvdDecaying = false;

    dvdLastTime = null;
    if(!dvdRAF) dvdRAF = requestAnimationFrame(stepDvdBounce);
  }

  dvdBounce.addEventListener('pointerdown', dvdPointerDown);
  dvdBounce.addEventListener('pointermove', dvdPointerMove);
  dvdBounce.addEventListener('pointerup', dvdPointerUp);
  dvdBounce.addEventListener('pointercancel', dvdPointerUp);
  // 不管是單純點一下、還是抓住甩出去，放開後瀏覽器都會在圖示上補一個 click
  // 事件，這個事件預設會往上冒泡到 previewPage、觸發「點擊畫面關閉」的邏輯，
  // 導致抓著圖示甩一甩放開，人卻被跳回首頁。點在圖示上不該有這個效果，
  // 只有點在圖示以外的地方才要關閉頁面，所以在這裡把冒泡擋掉。
  dvdBounce.addEventListener('click', (e) => e.stopPropagation());

  // 螢幕寬度跨過手機／桌機的斷點時（例如手機轉橫向、或桌機瀏覽器拖曳寬度），
  // 即時開始或停止彈跳，不用等使用者重新進出 preview 頁面
  window.addEventListener('resize', () => {
    if(isMobileDvdActive()) startDvdBounce(); else stopDvdBounce();
  });

  function openPreviewPage(pushHistory){
    if(pushHistory === undefined) pushHistory = true;
    if(!previewOddPhotos.length || !previewEvenPhotos.length) return;

    if(detailPage.classList.contains('active')) closeDetail();
    hideHoverPreview();

    document.body.classList.add('preview-active');
    document.body.style.overflow = 'hidden';
    previewPage.classList.add('active');

    // 把目前網址記錄成 #preview，這樣重新整理頁面時才知道要留在這頁，
    // 而不是每次都跳回首頁
    if(pushHistory && location.hash !== '#preview'){
      history.pushState({ page: 'preview' }, '', '#preview');
    }

    // 每次重新進入都從固定的起始張重新開始（左：最後一張／右：第一張），
    // 並確保起始畫面已經暖機好，這裡如果先前已經暖過就直接沿用快取，幾乎不用等
    warmPreviewStart();
    startPreviewCycle();

    // 每次重新進來都強制重新開始 DVD 圖示，不管上一次是怎麼結束的——包括抓著
    // 圖示甩到一半、手指還沒放開頁面就被關掉這種極端情況（某些手機瀏覽器在
    // 這種情況下不一定會確實觸發 pointerup/pointercancel，導致 dvdDragging
    // 卡在 true，afterwards startDvdBounce() 的保護判斷就一直誤判成「還在
    // 拖曳中」而拒絕重新啟動——這正是「第二次進來圖示就不動了」的成因）。
    // 這裡先強制歸零拖曳狀態、停掉任何殘留的動畫迴圈，再重新開始，
    // 確保一定是乾淨的初始狀態，以 210 px/秒重新起跑。
    dvdDragging = false;
    stopDvdBounce();
    startDvdBounce();
  }

  function closePreviewPage(pushHistory){
    if(pushHistory === undefined) pushHistory = true;
    previewPage.classList.remove('active');
    document.body.classList.remove('preview-active');
    document.body.style.overflow = '';
    stopPreviewCycle();
    dvdDragging = false; // 保險：萬一頁面在拖曳圖示的過程中被關掉，確保狀態不會卡住
    stopDvdBounce();

    if(pushHistory && location.hash === '#preview'){
      history.pushState({ page: 'home' }, '', location.pathname + location.search);
    }
  }

  previewLabel.addEventListener('click', () => openPreviewPage());
  // 這個頁面點任何地方都直接跳回首頁；頁面開啟時 header 會把 pointer-events
  // 關掉，讓點擊直接穿透到這裡，所以點在標題文字上也一樣會回首頁
  previewPage.addEventListener('click', () => closePreviewPage());
  // overflow:hidden 已經擋住捲動了，這裡再擋一次滾輪事件保險
  previewPage.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });
  // detail-page（點進去單張照片的頁面）同樣道理：body overflow:hidden + CSS
  // touch-action:none 已經擋住大部分捲動，這裡再擋一次滑鼠滾輪事件保險，
  // 確保電腦上滾輪也不會把底下的頁面捲動
  detailPage.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });

  // 支援瀏覽器「上一頁 / 下一頁」按鈕，跟網址列的 #preview 狀態保持同步
  window.addEventListener('popstate', () => {
    if(location.hash === '#preview'){
      openPreviewPage(false);
    } else if(previewPage.classList.contains('active')){
      closePreviewPage(false);
    }
  });

  function nextPhoto(){
    currentIndex = (currentIndex + 1) % photos.length;
    renderDetail();
  }
  function prevPhoto(){
    currentIndex = (currentIndex - 1 + photos.length) % photos.length;
    renderDetail();
  }

  prevBtn.addEventListener('click', prevPhoto);
  nextBtn.addEventListener('click', nextPhoto);
  backHome.addEventListener('click', closeDetail);
  backArrowBtn.addEventListener('click', closeDetail);

  document.addEventListener('keydown', (e) => {
    if(!detailPage.classList.contains('active')) return;
    if(e.key === 'ArrowRight') nextPhoto();
    if(e.key === 'ArrowLeft') prevPhoto();
    if(e.key === 'Escape') closeDetail();
  });

  // 縮放（pinch-zoom）在某些行動瀏覽器上會連帶觸發 resize 事件，
  // 但此時 window.innerWidth/innerHeight 可能回報的是「縮放後」的數值，
  // 若照樣重新定位，大圖就會瞬間跳位、變得極小。
  //
  // 原本的做法：resize 事件「一觸發當下」先判斷是否還在縮放，沒有縮放才排一個
  // 120ms 後執行的 timeout。問題是使用者放開兩指後，縮放比例通常還會再微調
  // 好幾次才真正穩定到 1，這些微調也會觸發 resize；如果剛好某一次判斷時 scale
  // 已經很接近 1（但還沒完全穩定），就會排入 timeout，等 120ms 後才執行——但那時
  // 版面可能還沒真正定案，所以會先用「還沒穩定」的尺寸重新定位一次（歸到偏掉的
  // 位置），等下一次 resize 事件抓到真正穩定的狀態才又修正一次，看起來就是
  // 「先跳到錯誤位置、才瞬間修正」。
  //
  // 修正方式：判斷「是否還在縮放」要放在 timeout 真正執行的當下重新檢查一次，
  // 而不是相信事件剛觸發時的舊狀態；還沒穩定就直接跳過，等下一次 resize 事件
  // 再重新排一次，這樣只有在真正確定縮放已經結束時才會定位，不會有中途跳動。
  let viewportSettleDebounce = null;
  function scheduleViewportSettle(){
    clearTimeout(viewportSettleDebounce);
    viewportSettleDebounce = setTimeout(() => {
      const stillZoomed = window.visualViewport && Math.abs(window.visualViewport.scale - 1) > 0.01;
      if(stillZoomed) return; // 縮放還沒穩定，先不動，等下一次 resize 事件再判斷

      if(detailPage.classList.contains('active')){
        positionDetailImage(lastNaturalW, lastNaturalH);
      }
      // 縮放期間 syncFixedChromeLive 全程跳過沒有更新（見下方），縮放真正結束、
      // 穩定下來的這一刻，順便補一次正確的重新定位，不用等使用者手動觸發
      // 下一次 resize 事件才修正回來
      syncFixedChrome();
    }, 150);
  }

  // syncFixedChrome()（header 的 preview 對齊 / detail-info / 左右箭頭定位）原本
  // 認為只用 getBoundingClientRect() 讀「當下實際渲染位置」，不像 positionDetailImage
  // 依賴 innerWidth/innerHeight，所以不需要等縮放穩定——但這個假設漏算了一種情況：
  // detail-info 的直式定位（syncDetailInfoAlignment）本身就有用到 window.innerHeight
  // 去算 top，雙指縮放中途這個值一樣不可靠，算出來的位置可能整個飛出畫面外，
  // 而且因為縮放結束後沒有任何後續事件會再重新校正它（不像 resize 那樣持續觸發），
  // 這個錯誤的偏移量會一直卡住，直到重新整理頁面、CSS 變數被重置才會消失——
  // 這正是「雙指縮放後 001 那排字飛不見，切換照片、不重整都救不回來」的成因。
  // 修法：縮放進行中（scale 明顯不是 1）就直接跳過整次 live 更新，等縮放真的
  // 結束（下一次 resize/visualViewport resize 事件時 scale 已經穩定）才繼續算。
  let fixedChromeRAF = null;
  function syncFixedChromeLive(){
    if(fixedChromeRAF) return;
    fixedChromeRAF = requestAnimationFrame(() => {
      fixedChromeRAF = null;
      const stillZoomed = window.visualViewport && Math.abs(window.visualViewport.scale - 1) > 0.01;
      if(stillZoomed) return; // 縮放中途座標不可靠，先不要算，避免把 detail-info 之類的定位帶偏
      syncFixedChrome();
    });
  }

  window.addEventListener('resize', scheduleViewportSettle);
  window.addEventListener('resize', syncFixedChromeLive);
  // visualViewport 的 resize 事件在雙指縮放時觸發得比 window resize 更即時、更頻繁，
  // 一起監聽可以更快抓到「縮放剛結束」的那個時間點。
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', scheduleViewportSettle);
    window.visualViewport.addEventListener('resize', syncFixedChromeLive);
  }

  async function init(){
    syncFixedChrome();
    photos = await fetchDriveImages();
    renderGrid();
    prefetchAllInBackground();

    // 照片一到手就準備好 preview 頁要用的兩組序列並暖機起始畫面，
    // 這樣不管使用者多快點下 preview，第一眼幾乎都是照片，不會先黑一下
    preparePreviewSequences();

    if(location.hash === '#preview'){
      openPreviewPage(false);
    }
  }

  // 禁止右鍵選單、禁止拖曳圖片（防止另存新檔 / 長按儲存）
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('dragstart', (e) => {
    if(e.target.tagName === 'IMG') e.preventDefault();
  });

  // 只擋雙擊縮放，不影響雙指縮放（pinch-zoom 保持可用）
  // 用 isMultiTouch 標記排除「雙指放開手指」被誤判成雙擊的狀況
  let lastTouchEnd = 0;
  let isMultiTouch = false;
  document.addEventListener('touchstart', (e) => {
    if(e.touches.length > 1) isMultiTouch = true;
  }, { passive: true });
  document.addEventListener('touchend', (e) => {
    if(e.touches.length > 0) return; // 還有手指沒放開，先不判斷
    if(isMultiTouch){
      isMultiTouch = false;
      lastTouchEnd = Date.now();
      return; // 這是縮放手勢放開，不是雙擊，不攔截
    }
    const now = Date.now();
    if(now - lastTouchEnd <= 300) e.preventDefault(); // 300ms 內連續兩次點擊視為雙擊，擋掉
    lastTouchEnd = now;
  }, { passive: false });

  // 背景慢慢把所有照片都預先下載一次（不搶主要資源），
  // 這樣使用者不管點開哪一張、往哪個方向連續切換，都大機率已經有快取
  function prefetchAllInBackground(){
    let i = 0;
    function step(){
      if(i >= photos.length) return;
      prefetchOne(photos[i].detailUrl || photos[i].url);
      i++;
      if('requestIdleCallback' in window){
        requestIdleCallback(step, { timeout: 800 });
      } else {
        setTimeout(step, 120);
      }
    }
    step();
  }

  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(syncFixedChrome);
  }

  init();

  /* =========================================================
     自訂圓形滑鼠（只在支援 hover 的滑鼠裝置上啟用）
  ========================================================= */
  if(supportsHover){
    const cursorEl = document.getElementById('custom-cursor');
    window.addEventListener('mousemove', (e) => {
      const x = e.clientX - cursorEl.offsetWidth / 2;
      const y = e.clientY - cursorEl.offsetHeight / 2;
      cursorEl.style.transform = `translate3d(${x}px, ${y}px, 0)`;
      cursorEl.classList.add('show');
    });
    document.addEventListener('mouseleave', () => cursorEl.classList.remove('show'));
  }

})();
</script>
</body>
</html>
