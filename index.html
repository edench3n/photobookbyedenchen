      // 用」：原本這裡完全不認得 'reshuffling' 這個狀態，直接落到最後的
      // 「動畫進行中，忽略這次雙擊」那條路——但換批（單擊觸發）跟
      // 收場（雙擊觸發）明明是兩個不同的使用者意圖，使用者在換批動畫
      // 播放途中改變心意、雙擊要直接收起整個堆疊，理當是雙擊優先接手，
      // 不該被前一個單擊排的隊硬擋住。改成呼叫 interruptReshuffleForExit()
      // 直接把換批中斷、無縫接續到收場流程（完整原因見該函式旁的說明）。
      interruptReshuffleForExit();
    }
    // 'entering' / 'exiting'：動畫正在進行中，這次雙擊先忽略，等目前這段播完
    // 使用者自然還能再點一次，不需要特別排隊處理。
  }

  // ---------- 單擊飄動的 e：換一批隨機照片 ----------
  // 只在已經身處堆疊模式、畫面上正顯示著照片的當下（photoFallState ===
  // 'active'）才有意義；其餘任何情況（首頁、preview、照片詳情頁、或
  // entering/exiting/reshuffling 這些動畫正在播放的過渡狀態）單擊一律
  // 不做任何事，維持原本「單擊沒有特別功能、只用來判斷是不是雙擊」的
  // 行為不變。
  function handleDvdSingleClick(){
    if(photoFallState !== 'active') return;
    reshufflePhotoFallBatch();
  }

  // ---------- 進場：首頁縮圖／編號縮小至消失，時鐘快速淡出 ----------
  function shrinkHomeForPhotoFall(){
    gridRevealInFlight = true; // 借用既有的「首頁縮圖尺寸暫時不可靠」旗標，
                                // 讓 positionGridIdxItem() / magnetFrame() 這段期間自動跳過、不插手
    const items = grid.querySelectorAll('.grid-item');

    // 效能修正（「一開始」雙擊觸發堆疊模式那一刻最容易感覺 fps 掉很低的
    // 另一個成因）：原本不分畫面內外，把「整個網格」裡每一張縮圖（可能
    // 是幾十張、甚至上百張，取決於相簿照片總數，不是只有畫面上看得到的
    // 那幾張）全部同時套用 0.42 秒的 transform/opacity CSS transition。
    // 每張縮圖本身在 CSS 就已經是 will-change:transform（獨立合成圖層），
    // 等於同一瞬間要求瀏覽器的合成執行緒同時跑幾十、上百個圖層的位移／
    // 淡出動畫——這批動畫播完的同時（見 enterPhotoFallMode() 裡
    // remaining 的計算），spawnFallingPhotos() 又緊接著開始建立堆疊照片、
    // 啟動 Matter.js 物理世界，兩批負擔在時間上疊在一起，正是「一開始」
    // 那幾百毫秒感覺特別卡的主因之一——但畫面捲動範圍以外、使用者這一刻
    // 根本看不到的縮圖，讓它們也播一次完整的收起動畫，除了徒增合成負擔，
    // 沒有任何看得到的效果。
    // 改成先一次性讀完所有需要的位置（getBoundingClientRect，一次讀完、
    // 不穿插寫入，避免逐一讀寫造成的強制同步重排／layout thrashing），
    // 只有目前落在「視窗上下各抓一點緩衝範圍」內、使用者看得到（或即將
    // 捲動進來看到）的縮圖才套用完整的 transition 動畫；範圍外看不到的
    // 縮圖直接跳過 transition、瞬間套用「動畫播完之後」的最終狀態
    // （scale(0)/opacity:0），視覺上完全等價（反正使用者本來就看不到它
    // 播放的過程），但完全不佔用合成執行緒的動畫預算，讓真正看得到的
    // 那一批動畫、以及緊接著開始的堆疊物理運算，能拿到更多效能餘裕。
    const viewportBuffer = window.innerHeight; // 上下各留一個螢幕高度的緩衝，捲動中的縮圖也不會被瞬間跳掉、顯得突兀
    const vh = window.innerHeight;
    const rects = [];
    items.forEach(item => { rects.push(item.getBoundingClientRect()); });

    items.forEach((item, i) => {
      const rect = rects[i];
      const isNearViewport = rect.bottom > -viewportBuffer && rect.top < vh + viewportBuffer;
      const img = item.querySelector('.thumb-wrap img');
      const idx = item.querySelector('.idx');
      if(img){
        img.style.transition = isNearViewport
          ? `transform ${PHOTO_FALL_SHRINK_MS}ms cubic-bezier(.4,0,1,1), opacity ${PHOTO_FALL_SHRINK_MS}ms ease`
          : 'none';
        img.style.transform = 'scale(0)';
        img.style.opacity = '0';
      }
      if(idx){
        idx.style.transition = isNearViewport
          ? `opacity ${PHOTO_FALL_IDX_FADE_MS}ms ease, transform ${PHOTO_FALL_IDX_FADE_MS}ms ease`
          : 'none';
        idx.style.opacity = '0';
        idx.style.transform = 'scale(0.6)';
      }
    });
    pageClock.style.transition = `opacity ${PHOTO_FALL_CLOCK_FADE_MS}ms ease`;
    pageClock.style.opacity = '0';
  }

  function enterPhotoFallMode(){
    photoFallState = 'entering';
    photoFallModeActive = true;
    document.body.classList.add('photo-fall-active');
    shrinkHomeForPhotoFall();

    // 飄動字的迴圈立刻停下來（不再繼續彈跳），但完全不搬動它的位置、也不
    // 隱藏它——維持在雙擊當下所在的畫面位置不動。它要的效果是「原地忽然
    // 出現重力」，不是像其他 15 張照片那樣從畫面外掉進來，所以全程都留在
    // 使用者看得到的地方，讓下面的物理世界一準備好就直接接手、原地開始
    // 下墜。
    if(dvdRAF){ cancelAnimationFrame(dvdRAF); dvdRAF = null; }
    dvdDragging = false;
    dvdBounce.classList.remove('dvd-grabbing');
    // 保險：萬一雙擊觸發堆疊模式那一刻，剛好還有兩指旋轉手勢殘留在進行中
    // （理論上雙擊本身要求原地沒有明顯位移才會判定成立，機率極低，但這裡
    // 不假設一定不會發生），強制結束掉，避免遺留的 pointerId 之後繼續收到
    // 事件、跟物理堆疊模式的 transform 控制權互搶。
    if(dvdRotatePointerId !== null) endDvdRotateGesture(dvdRotatePointerId);
    if(dvdDragRotRAF){ cancelAnimationFrame(dvdDragRotRAF); dvdDragRotRAF = null; }

    // 原本 e 是等首頁縮圖收起的 PHOTO_FALL_SHRINK_MS（420ms）過完，才跟 15
    // 張照片一起被丟進物理世界，這段空檔它已經停止飄動、卻還沒開始受重力，
    // 看起來像「頓了一下才掉下去」。
    // 改成雙擊當下就立刻開始載入 Matter.js（不用等縮圖收起），一載入完成
    // 就馬上呼叫 startPhotoFallEngine() 讓 e 原地開始受重力掉落——中間唯一
    // 的延遲只剩「第一次真的需要連網下載 Matter.js」這件事本身（之後每次
    // 雙擊都是瞬間，因為已經快取在記憶體裡），感覺就像雙擊那一刻「重力
    // 突然打開」。15 張堆疊照片則仍然沿用原本的節奏，等首頁縮圖真的收起
    // （視覺上不會互相干擾）之後才 spawn 進同一個已經在跑的物理世界——
    // 兩者用同一個 pfEngine，e 只是比照片更早入場而已，物理邏輯（重力、
    // 碰撞、可拖曳）從頭到尾完全共用同一套規則。
    const enterAt = performance.now();
    // 提早算出這一批會是哪幾張、立刻背景暖機（完整原因見 warmFallBatch()
    // 旁的說明），讓它們有機會在真正 spawnFallingPhotos() 之前就先準備好，
    // 掉下來時不會露出空白的淺灰／白色方塊。
    const fallBatch = pickInitialFallBatch();
    const fallWarm = warmFallBatch(fallBatch); // { promise, cache }——cache 裡已經暖好的 Image 元素會直接被 spawnFallingPhotos() 拿去用，不用等 promise

    // e 本身不受暖機影響：Matter.js 一載入完成就讓它原地開始受重力掉落，
    // 維持原本「雙擊那一刻重力突然打開」的即時感。
    //
    // 15 張堆疊照片的 spawn 時機維持原本的節奏（首頁縮圖收起的
    // PHOTO_FALL_SHRINK_MS 一到就 spawn），完全不等暖機——雙擊之後應該多快
    // 掉下來就多快掉下來，不能為了等圖片而讓整批延遲。真正解決「白色方塊」
    // 的方法不是延後 spawn 的時間，而是讓 spawnFallingPhotos() 直接使用
    // fallWarm.cache 裡「已經真的暖好」的 Image 元素（見該函式內的說明）：
    // 暖機時間夠的張數會直接零延遲顯示，極少數沒趕上的張數才會走原本的
    // 淡入安全網，兩者互不拖累，整批出場的節奏完全不受影響。
    loadMatterJS().then(() => {
      startPhotoFallEngine();
      const elapsed = performance.now() - enterAt;
      const remaining = Math.max(0, PHOTO_FALL_SHRINK_MS - elapsed);
      setTimeout(() => spawnFallingPhotos(fallBatch, fallWarm.cache), remaining);
    }).catch(() => {
      // Matter.js 載入失敗（例如離線）：直接復原，不留在半成品狀態
      photoFallState = 'idle';
      photoFallModeActive = false;
      document.body.classList.remove('photo-fall-active');
      prepareGridRevealState();
      void grid.offsetWidth;
      pageClock.style.transition = `opacity ${HOME_REVEAL_MS}ms ease`;
      requestAnimationFrame(() => { pageClock.style.opacity = '1'; });
      playGridRevealAnimation();
      startDvdBounce();
    });
  }

  // ---------- 建立物理世界：先讓飄動的 e 原地受重力掉落、可拖曳 ----------
  // 15 張堆疊照片還沒進來之前，這個物理世界已經先跑起來、e 已經是裡面
  // 唯一的物件，拖曳／牆壁碰撞都已經生效；等 spawnFallingPhotos() 把照片
  // 陸續加進同一個 pfEngine.world，e 就會跟它們用同一套規則互相碰撞、
  // 堆疊在一起。
  function startPhotoFallEngine(){
    const Matter = window.Matter;
    const { Engine, Runner, Bodies, Composite, Mouse, MouseConstraint, Events } = Matter;

    const vw = window.innerWidth;
    const vh = window.innerHeight;

    // 效能修正（「一開始」堆疊照片瀑布落下、彼此碰撞堆疊的那幾秒最容易
    // 感覺 fps 很低的根本成因之一）：Matter.js 的 Engine.create() 預設
    // positionIterations:6／velocityIterations:4——這兩個數字決定每推進
    // 一步物理世界時，要花多少輪次去解算「多顆物體疊在一起、同時碰撞」
    // 這種複雜狀況，數字越高解得越精準，但每一步的運算量也跟著等比例
    // 變重。手機掉落／堆疊的張數雖然比桌機少（8 張 vs 15 張），但手機
    // CPU 本身效能就弱得多，剛進場那幾秒（8~15 個物體同時落下、互相
    // 擠壓、找位置堆好）正是整段體驗裡物理碰撞最密集、最需要這兩個
    // 迭代次數的時刻，也就是最容易把單一影格的運算時間拖過 16ms（60fps
    // 預算）甚至更多的時刻。這裡把迭代次數調低（手機再更低一點），用
    // 稍微犧牲一點點物理精準度（肉眼幾乎看不出差異——反正照片本來就是
    // 隨機亂疊、沒有精準物理正確性的需求），換取剛進場那幾秒每一步運算
    // 量明顯下降。
    // 同時加開 enableSleeping:true：Matter.js 預設不會讓靜止不動的物體
    // 「睡眠」，即使 15 張照片全部已經疊好、完全靜止不再移動，引擎每一步
    // 還是照樣把它們全部重新計算一次速度／位置／碰撞，等於堆疊完成之後
    // 仍持續消耗效能，跟畫面看起來「已經沒在動」完全不成比例。開啟睡眠
    // 後，靜止超過一小段時間的物體會被引擎跳過計算，直到被拖曳／新照片
    // 撞到才會自動醒過來（Matter.js 內建行為，MouseConstraint 抓取、
    // 新物體碰撞都會自動喚醒），使用者手感完全不受影響，堆疊「定住」之後
    // 的持續效能負擔幾乎歸零。
    // ---------- 修正：拖曳照片去撞其他照片時，會先「滑」進去再慢慢彈開 ----------
    // 使用者反應：手動抓著一張照片去頂另一張，兩張圖會先明顯疊在一起（像
    // 沒有真的撞到、直接滑進去），過一會兒才慢慢被推開分離，而不是一碰到
    // 邊界就立刻擋住。這跟上面 pfBoxCenter() 修的「畫面位置對不齊」是兩個
    // 不同的成因：這裡碰撞體的位置本身其實是對的，問題出在 Matter.js
    // 「解算」這個重疊要花幾步才能修正完。
    // 上面這兩個迭代次數原本為了手機效能刻意調低（見這段程式碼原本的說明：
    // positionIterations 從內建預設 6 調成 3~5、velocityIterations 從內建
    // 預設 4 調成 2~3）——調低沒錯，代價是每一步物理世界只能把「兩個物體
    // 疊在一起」這件事修正一部分，沒辦法一步到位完全推開，要靠好幾個影格
    // 慢慢疊加修正量，才會慢慢分離乾淨；平常照片只是自由落下、疊起來，這個
    // 「要花幾影格才收斂」肉眼幾乎感覺不到。但使用者主動用滑鼠／手指去拖
    // 一張照片，等於持續用外力硬把它往別張照片裡塞（拖曳的彈簧一直在補力），
    // 跟位置修正互相拉扯，修正速度跟不上外力灌入的速度，才會看起來像「滑
    // 進去、才慢慢彈開」。
    // 另外一個放大這個問題的因素：上面 PF_BODY_GRID_MAX 為了讓碰撞邊界更
    // 貼合真實輪廓，已經把每張圖拆成更多小矩形（複合物體 part 數變多）——
    // 同時間要解算的碰撞接觸點也跟著變多，同樣的迭代次數，收斂速度自然
    // 比以前更慢，兩個問題疊加在一起，才會覺得這次拖曳手感特別滑。
    // 修法：把這兩個迭代次數調回比 Matter.js 內建預設更高（不是只調回
    // 預設值，因為現在的碰撞接觸點數量已經比預設場景多很多，要用更高的
    // 迭代次數才能在拖曳這種持續外力的狀況下，重疊還是能在一兩影格內就
    // 收斂完畢，感覺起來才會像「撞到硬牆立刻擋住」而不是「慢慢被推開」）；
    // 手機維持比桌機低一階，仍是效能與精準度之間的折衷，但整體都比原本
    // 的數字高上不少。額外加開 constraintIterations（Matter 內建預設是
    // 2）：這個數字管的是拖曳用的 MouseConstraint 這條「彈簧」本身解算得
    // 多準，調高可以讓抓著的照片更緊跟著滑鼠／手指本身的位置，減少因為
    // 彈簧本身沒解準、疊加出額外一層晃動或穿透感。
    const pfMobile = isDetailMobile();
    pfEngine = Engine.create({
      positionIterations: pfMobile ? 8 : 14,
      velocityIterations: pfMobile ? 5 : 8,
      constraintIterations: pfMobile ? 3 : 4,
      enableSleeping: true,
    });
    pfEngine.gravity.y = PHOTO_FALL_GRAVITY;

    // 地板／左右牆：邊緣就是網頁邊界本身，貼齊視窗左右兩側跟底部，讓掉落的
    // 照片「撞到視窗邊界」的感覺等同撞到真正的網頁邊緣，不是縮在中間某個
    // 虛擬框裡。牆壁本身用比視窗更厚、更寬的靜態矩形，避免高速穿透。
    const wallThickness = 200;
    pfGroundBody = Bodies.rectangle(vw / 2, vh + wallThickness / 2, vw * 2, wallThickness, { isStatic: true, label: 'pfGround', friction: 0.7 });
    pfLeftWall = Bodies.rectangle(-wallThickness / 2, vh / 2, wallThickness, vh * 4, { isStatic: true, label: 'pfLeftWall' });
    pfRightWall = Bodies.rectangle(vw + wallThickness / 2, vh / 2, wallThickness, vh * 4, { isStatic: true, label: 'pfRightWall' });
    Composite.add(pfEngine.world, [pfGroundBody, pfLeftWall, pfRightWall]);

    // 飄動的 e：不建立新元素，直接把現有的 #dvdBounce 接進物理世界，body
    // 就生在它雙擊當下所在的畫面位置（dvdX/dvdY，上面 enterPhotoFallMode()
    // 停下飄動迴圈時最後讀到的座標），不給任何初始速度——單純交給重力，
    // 效果就是原地忽然開始往下掉，不是從畫面外飛進來、也不是延續原本
    // 飄動的速度方向。跟其他照片共用完全相同的物理參數（restitution／
    // friction／frictionAir），落下、碰撞、拖曳的手感一致，只有起始位置跟
    // 起始時間不同。
    // 碰撞形狀改用跟掉落照片同一套 buildFallItemBody()（完整說明見該函式
    // 上方的註解）：e 本身也是去背異形圖（可能是內建的 EDEN 預設圖，也可能
    // 是使用者換到圖片庫裡的某一張），一樣用它目前顯示中這張圖（見
    // dvdActiveImgSrc）已經建立好的 alpha 遮罩，拆成貼合實際形狀的複合
    // 物體，不再是整張外框矩形——這是「飄動物件本身沒有實際邊緣碰到」的
    // 修正。遮罩還沒就緒時一樣優雅退回矩形，行為不受影響。
    measureDvdSize();
    const dvdMaskEntry = dvdActiveImgSrc ? getCachedAlphaMask(dvdActiveImgSrc) : null;
    const dvdBody = buildFallItemBody(Matter, dvdMaskEntry, dvdX + dvdW / 2, dvdY + dvdH / 2, dvdW, dvdH, {
      // 修正「雙擊那一刻，飄動的 e 會先瞬間轉正成 0 度、才開始掉落」：
      // buildFallItemBody() 原本沒收到 angle 時，內部 Body.setAngle 完全
      // 不會被呼叫，新建的物理 body 就會停在 Matter.js 的預設角度（0）。
      // 但 e 雙擊當下畫面上顯示的角度其實是 dvdRotationDeg（飄動狀態下
      // 撞牆累積的小幅度旋轉，見 dvdRotationDeg／dvdTransformString()），
      // 兩者對不上，物理世界一接手，畫面就會看到 e 從目前角度「跳」回
      // 0 度、才開始受重力下墜，變成很突兀的一下瞬間轉正。
      // 這裡把 dvdRotationDeg（度）換算成弧度傳進去，body 建立時就直接
      // 帶著雙擊當下那一刻的角度，畫面上感覺就是「維持原本傾斜的樣子，
      // 直接自然地往下掉」，跟其他掉落照片一樣沒有瞬間跳動。
      angle: dvdRotationDeg * Math.PI / 180,
      restitution: 0.3, // 0.8 太接近全彈跳，多顆疊在一起的照片互相碰撞時會一直小幅度來回彈、看起來在抖動；調低到 0.3，還有一點回彈感，但不會抖個不停
      friction: 0.55,
      frictionAir: 0.012,
      density: 0.0026,
      // category 標成 PF_CATEGORY_DVD（mask 維持預設 0xFFFFFFFF，照樣跟
      // 牆壁／照片／地板正常碰撞，不影響原本任何互動）：單擊換批照片時
      // （見 reshufflePhotoFallBatch()）需要靠這個分類，讓專屬給 e 的
      // 那塊地板只擋得住 e、擋不住一般照片。這個 filter 會跟著傳進
      // buildFallItemBody() 內每一個組成複合物體的小矩形 part，確保
      // 不管碰撞體被拆成幾塊，分類判斷都還是一致的。
      collisionFilter: { category: PF_CATEGORY_DVD },
    });
    Composite.add(pfEngine.world, dvdBody);
    pfDvdItem = { body: dvdBody, w: dvdW, h: dvdH };
    dvdBounce.style.transition = 'none';

    // 拖曳：Matter.Mouse 直接綁在舞台容器上接收滑鼠事件，命中判斷（哪個
    // body 被點到）完全由 Matter 自己用世界座標計算，不受個別 DOM 元素的
    // pointer-events 影響——跟舞台容器本身 inset:0 的視窗座標系剛好 1:1
    // 對應，不需要額外轉換滑鼠座標。之後不管拖的是 e 還是照片，都是同一個
    // MouseConstraint，彼此之間的碰撞完全由 Matter 內建的物理引擎處理，
    // 不需要另外寫任何 e／照片專屬的判斷。
    // stiffness/damping 原本是 0.18/0.15：這條「彈簧」把抓著的照片拉向
    // 滑鼠／手指目前的位置，數字越低彈簧越軟，代表照片跟指標之間允許的
    // 「落差」越大——使用者主動把照片往另一張裡面推的時候，這段落差正好
    // 讓照片可以先明顯陷進鄰居裡面一段距離，彈簧才慢慢把它拉回來，跟上面
    // 調高的迭代次數放在一起看，就是「先滑進去、才慢慢彈開」的另一半成因
    // （迭代次數不夠決定了「解重疊解得慢」，彈簧太軟則決定了「一開始允許
    // 陷進去的量本來就比較大」）。調高到 0.5，讓抓著的照片更緊跟著指標
    // 目前的位置，指標一旦被鄰居擋住，照片也會幾乎同時被擋住，而不是先
    // 讓出一段緩衝空間才慢慢跟上；同時把 damping 一起調高到 0.25，避免
    // 彈簧變硬之後，鬆手瞬間或撞到障礙物彈開時的殘餘速度沒被吸收乾淨，
    // 看起來抖動或过衝。這兩個值都還遠低於 1（完全剛性、容易連鎖不穩定），
    // 是「手感夠扎實」跟「不會抖動」之間留了餘裕的折衷。
    pfMouse = Mouse.create(photoFallStage);
    pfMouseConstraint = MouseConstraint.create(pfEngine, {
      mouse: pfMouse,
      constraint: { stiffness: 0.5, damping: 0.25, render: { visible: false } },
    });
    Composite.add(pfEngine.world, pfMouseConstraint);
    Events.on(pfMouseConstraint, 'startdrag', () => { photoFallStage.classList.add('grabbing'); pfDragging = true; });
    Events.on(pfMouseConstraint, 'enddrag', () => { photoFallStage.classList.remove('grabbing'); pfDragging = false; });

    // ---------- 修正：「抓起來拖曳時會怪怪地往上飄，重力感覺跑掉」----------
    // 成因：拖曳中的照片同時受兩股力：重力（一直往下拉）、MouseConstraint
    // 這條彈簧（一直把它拉向游標）。Matter.js 每一步是先把重力加進
    // body.force，才 integrate 出下一步位置，最後才輪到彈簧依 stiffness/
    // damping 去修正位置／速度——重力造成的下墜速度，跟彈簧修正的量，兩者
    // 是分開疊加的，密度（density: 0.0026）壓得很輕，一點點重力就會讓
    // body 累積出不小的下墜速度，彈簧再去追、修正時難免 overshoot，兩股
    // 力互相打架，看起來就是抓著的照片一下子被重力扯低、一下子被彈簧扯回
    // 來甚至衝過頭，感覺像在飄、重力方向亂跑。首頁縮圖的拖曳完全沒有物理
    // 引擎、沒有重力，單純讓元素跟著游標，所以才會感覺「正常、不會動」。
    // 修法：只要目前有物件被抓著（pfMouseConstraint.body 非 null），在每一步
    // 物理世界真正套用重力之前（beforeUpdate 觸發時機正好在 Engine.update()
    // 內部套用重力那一步之前），主動施加一股跟這一步即將加上去的重力大小
    // 完全相等、方向相反的力，兩者加總後這顆 body 這一步收到的淨重力等於
    // 零——效果等同「被抓著的這段期間，這顆物件暫時不受重力影響」，只單純
    // 被彈簧拉著跟游標走，行為就跟首頁縮圖一樣「不會自己飄」。放開之後這股
    // 抵銷力就不會再套用，物件立刻恢復正常重力掉落，手感跟原本完全一樣，
    // 也完全不影響其他沒被抓著的照片。
    Events.on(pfEngine, 'beforeUpdate', () => {
      const draggedBody = pfMouseConstraint.body;
      if(!draggedBody) return;
      Matter.Body.applyForce(draggedBody, draggedBody.position, {
        x: -draggedBody.mass * pfEngine.gravity.x * pfEngine.gravity.scale,
        y: -draggedBody.mass * pfEngine.gravity.y * pfEngine.gravity.scale,
      });
    });

    // ---------- 修正：「拖著物件移出視窗，回來時明明已經放開，卻還卡在
    // 抓著的狀態」----------
    // 成因：Matter.Mouse 綁的 mouseup 監聽器，只有在滑鼠指標還停留在
    // 瀏覽器視窗「裡面」放開時才會收到事件——這是瀏覽器原生行為，指標
    // 一旦移出整個瀏覽器視窗範圍，視窗完全不會收到任何滑鼠事件，包含
    // 放開這個動作本身。使用者抓著物件把指標拖出視窗邊界、在視窗外面
    // 才放開滑鼠，這個「放開」的訊號從頭到尾沒有機會傳進網頁——等指標
    // 移回視窗裡面、mousemove 事件重新開始送達，Matter 內部記錄的按鍵
    // 狀態仍然停在「還按著」，物件因此持續被拖曳彈簧拉著跑，即使使用者
    // 這時手指／滑鼠鍵早就已經放開了。
    // 修法：不去猜「指標離開視窗那一刻」使用者是放開還是繼續按著（沒辦法
    // 從網頁這端得知），而是利用瀏覽器原生 MouseEvent 物件的 `buttons`
    // 屬性——不管游標剛剛去了哪裡、瀏覽器有沒有收到中間那些事件，只要
    // 指標「這一刻」重新回到視窗、送出下一個 mousemove，這個事件當下的
    // `buttons` 一定會如實反映滑鼠鍵「現在」真正的按壓狀態（0 代表所有
    // 鍵都沒按著）。額外掛一個 document 層級的 mousemove 監聽器，只要
    // 偵測到「Matter 這邊還認為正在拖曳，但這一刻 buttons 已經是 0」，
    // 就代表放開的動作確實發生過（只是發生在視窗外、網頁沒收到通知），
    // 立刻手動觸發跟真正放開滑鼠完全等效的收尾：清空 pfMouseConstraint.body
    // 讓引擎不再對這顆物體施加拖曳彈簧力、把 Matter 內部的按鍵狀態同步
    // 改回「沒按」、拿掉 grabbing 樣式、pfDragging 設回 false——效果等同
    // 使用者在視窗內正常放開滑鼠，物件會照原本的物理規則自然掉落，不會
    // 無故被清除或跳動。
    // 使用者如果是「按著不放、把指標移出去又移回來」（真的還在拖曳中），
    // 這個判斷不會誤觸發：只要滑鼠鍵確實還按著，重新進入視窗的 mousemove
    // 事件 `buttons` 就會正確回報非 0，跟原本「按著就抓住」的手感完全
    // 不受影響，只有「已經放開」這一種情況會被這裡補上正確的收尾。
    // 掛在 document（不是 photoFallStage）上，是因為指標從視窗外移回來，
    // 第一個收到的 mousemove 位置不保證還在 photoFallStage 範圍內，掛在
    // document 才能確保一定收得到這個訊號。
    pfMouseButtonGuard = (e) => {
      if(pfMouseConstraint && pfMouseConstraint.body && e.buttons === 0){
        pfMouseConstraint.body = null;
        if(pfMouseConstraint.mouse) pfMouseConstraint.mouse.button = -1;
        photoFallStage.classList.remove('grabbing');
        pfDragging = false;
      }
    };
    document.addEventListener('mousemove', pfMouseButtonGuard);

    // ---------- 修正：「拖著物件去撞網頁邊界，會被拖穿過去」----------
    // 成因：左右牆／地板都是靜態物體，正常掉落、堆疊時確實擋得住；但
    // MouseConstraint 拖曳本質上是一條彈簧，每一步物理世界都在用外力
    // 把抓著的物體「硬拉」向滑鼠/手指目前的位置。拖曳速度夠快、彈簧
    // 硬度（上面調高到 0.5）加上去，牆壁的碰撞解算有時候來不及在同一
    // 個時間步內完全擋下這股外力，物體的位置就會被彈簧拉到牆壁的另一
    // 側去——等於用蠻力把它拖「穿」過牆，而不是真的被牆彈開。這不是牆
    // 本身沒建好，是 Matter.js 用彈簧模擬拖曳時，外力跟碰撞解算互相
    // 拉扯、偶爾碰撞這邊會輸的已知限制。
    // 修法：不去跟這場拉扯搏鬥，而是在物理引擎每算完一步之後
    // （afterUpdate），額外多一道跟牆壁完全無關、絕對不會被彈簧力道
    // 蓋過去的「事後檢查」——只針對「目前正被抓著的那顆物體」
    // （pfMouseConstraint.body，沒有人在拖曳時這裡是 null，不影響一般
    // 掉落／堆疊的物體），如果它的位置已經超出視窗邊界（拿它自己的
    // 包圍盒算出的半寬/半高當作安全距離），就直接用 Body.setPosition()
    // 把它拉回邊界內、Body.setVelocity() 把撞牆方向的速度歸零——這一步
    // 是直接覆寫位置，不受彈簧硬度或碰撞解算精細度影響，物理上等同
    // 「這裡真的有一堵絕對過不去的牆」。只处理拖曳中的物體，其餘掉落／
    // 堆疊中的照片完全不受影響，撞牆手感、彈開效果都維持原樣不變。
    Events.on(pfEngine, 'afterUpdate', () => {
      const draggedBody = pfMouseConstraint.body;
      if(!draggedBody) return;
      const viewportW = window.innerWidth;
      const viewportH = window.innerHeight;
      const halfW = (draggedBody.bounds.max.x - draggedBody.bounds.min.x) / 2;
      const halfH = (draggedBody.bounds.max.y - draggedBody.bounds.min.y) / 2;
      const minX = halfW, maxX = Math.max(halfW, viewportW - halfW);
      const minY = halfH, maxY = Math.max(halfH, viewportH - halfH);
      const pos = draggedBody.position;
      const clampedX = Math.min(Math.max(pos.x, minX), maxX);
      const clampedY = Math.min(Math.max(pos.y, minY), maxY);
      if(clampedX !== pos.x || clampedY !== pos.y){
        Matter.Body.setPosition(draggedBody, { x: clampedX, y: clampedY });
        const vel = draggedBody.velocity;
        Matter.Body.setVelocity(draggedBody, {
          x: clampedX !== pos.x ? 0 : vel.x,
          y: clampedY !== pos.y ? 0 : vel.y,
        });
      }
    });

    // ---------- 修正「拖曳、或從 preview 頁回來時，PNG 剛好疊在一起就永遠
    // 黏在一起、不會自動彈開」----------
    // 成因：上面已經把 positionIterations/velocityIterations 調高（見該處
    // 完整說明），理論上只要物理世界還在正常運算，Matter.js 自己的位置
    // 解算就會把重疊的兩個 body 慢慢推開，不需要另外寫任何邏輯。但這裡
    // 同時開著 enableSleeping:true（省效能用，見 startPhotoFallEngine()
    // 開頭那段完整說明）——Matter.js 判斷「該不該睡著」用的是 body 的
    // 瞬時速度／角速度，跟位置解算的重疊修正是兩件事：拖曳放開的瞬間、
    // 或使用者從 preview 頁關閉回到堆疊畫面那一刻，兩張照片剛好卡在
    // 重疊的位置、但彼此的速度都已經趨近於零，Matter.js 判定「這兩顆都
    // 靜止了」，於是讓它們雙雙進入睡眠——一旦兩顆都睡著，睡著的 body
    // 每一步都會被引擎整個跳過（見上面「加開 enableSleeping」那段的完整
    // 說明），包含負責把重疊推開的位置解算在內，等於「還沒真的分開，就
    // 已經被引擎當成不需要再處理」，兩張照片因此永久卡在重疊的畫面上，
    // 不管再等多久都不會自己彈開——這正是「疊在一起」的根本成因，不是
    // 碰撞判斷本身失準，是「還沒解完就先睡著」。
    //
    // 這裡原本的修法是每一步比對「所有物件兩兩之間的外接矩形（AABB）是否
    // 還相交」，只要相交、且至少一顆在睡，就整組叫醒——但這正是後來發現
    // 的「堆疊靜止後仍持續在抖動」的根本原因：這批照片本身帶著隨機旋轉
    // 角度，一張旋轉過的照片，它「歪斜的實際外形」跟「跟座標軸對齊的外接
    // 矩形」兩者範圍差很多，矩形通常比實際圖案大一圈；只要照片是斜著靠在
    // 一起（這正是堆疊照片最常見、最正常的樣子），旁邊兩張的外接矩形幾乎
    // 一定會相交，即使兩張照片其實只是穩穩貼著、根本没有真的疊到。結果是
    // 只要兩顆一睡著，下一步 AABB 檢查幾乎必定判定「還疊著」，立刻又叫醒；
    // 叫醒後角動量/速度隨即又降回閾值以下、幾影格內再次睡著，然後下一步
    // 又被同一組 AABB 判定叫醒——如此一睡就醒、一醒就睡的迴圈，每次「醒來」
    // 引擎都會重新對它套用碰撞解算跟些微的回彈（restitution），肉眼看起來
    // 就是「明明已經靜止的堆疊，卻一直在細微發抖」，成因不是真的還在碰撞
    // 摩擦，是這段「防呆」邏輯自己不斷把已經穩定的照片重新叫醒。
    // 修法：不再用粗略的 AABB 相交去猜「可能疊到」，改成直接讀 Matter.js
    // 每一步算完、正確判斷過的實際碰撞資訊（pfEngine.pairs.list——每一對
    // 目前真的有碰撞關係的 body，都帶著 SAT 算出來的精確穿透深度
    // collision.depth）。兩顆物體只是穩穩貼著、彼此擋住對方不再移動的
    // 正常靜止接觸，這個深度會非常接近 0（Matter 的位置解算本來就會把
    // 「正在解算中」的重疊收斂到幾乎為零才讓它睡著）；只有真的「還沒解完
    // 就先睡著」那種明顯陷在一起的情況，深度才會超出這個範圍。只在深度
    // 超過 PF_STUCK_OVERLAP_DEPTH 這個門檻時才叫醒，等於只挑出「真的還卡著
    // 沒分開」的候選，跳過所有單純貼著、沒有實際卡住的正常靜止接觸，堆疊
    // 完全靜止後就不會再被這段邏輯無故吵醒，也就不會再看到細微抖動；原本
    // 要防的「PNG 疊在一起永遠黏住不會彈開」的情況一樣會被抓到、正常喚醒
    // 分開。用引擎本來就會算好的 pairs.list，比原本兩兩 AABB 迴圈更準也
    // 更省——不用自己重新跑一輪比對。
    const PF_STUCK_OVERLAP_DEPTH = 4; // px，超過這個穿透深度才視為「真的卡住疊在一起」，一般貼合的靜止接觸深度趨近 0，遠低於這個門檻
    Events.on(pfEngine, 'afterUpdate', () => {
      const pairs = pfEngine.pairs.list;
      for(let i = 0; i < pairs.length; i++){
        const pair = pairs[i];
        if(!pair.isActive) continue;
        const a = pair.bodyA, b = pair.bodyB;
        if(!a.isSleeping && !b.isSleeping) continue; // 兩顆都醒著，本來就會被正常解算處理，不需要介入
        if(pair.collision.depth < PF_STUCK_OVERLAP_DEPTH) continue; // 只是貼著的正常靜止接觸，不是真的卡住，不要叫醒
        if(a.isSleeping) Matter.Sleeping.set(a, false);
        if(b.isSleeping) Matter.Sleeping.set(b, false);
      }
    });

    photoFallStage.classList.add('active');
    document.body.style.overflow = 'hidden';

    pfItems = [];
    pfSyncHandler = () => {
      pfItems.forEach(({ body, el, w, h }) => {
        const c = pfBoxCenter(body);
        el.style.transform = `translate(${c.x - w / 2}px, ${c.y - h / 2}px) rotate(${body.angle}rad)`;
      });
      if(pfDvdItem){
        const { body, w, h } = pfDvdItem;
        const c = pfBoxCenter(body);
        dvdBounce.style.transform = `translate(${c.x - w / 2}px, ${c.y - h / 2}px) rotate(${body.angle}rad)`;
      }
    };
    // 效能修正（手機版堆疊頁面 lag／fps 掉很低的根本成因）：原本這裡是
    // Events.on(pfEngine, 'afterUpdate', pfSyncHandler)，把 DOM 同步掛在
    // Matter 引擎的 afterUpdate 事件上——但 afterUpdate 是「每呼叫一次
    // Engine.update() 就觸發一次」，不是「每個畫面影格觸發一次」。手機效能
    // 不夠、單一 rAF 影格追不上時，下面 pfLoopTick() 的累加器迴圈會在同一個
    // 影格裡連續補呼叫好幾次 Engine.update()（最多 PF_MAX_SUBSTEPS=5 次），
    // 等於這一個影格裡，15 張堆疊照片的 style.transform 被整批重寫了 5 次，
    // 而畫面實際上一影格只會繪製最後一次的結果——前面幾次全是白白付出
    // 的重排／合成成本，卻沒有任何看得到的效果。裝置越吃力、越需要補步，
    // 這筆浪費的成本反而越大，形成「越卡、DOM 寫越多次、更卡」的惡性循環，
    // 正是「手機開堆疊頁面 fps 感覺特別低」的主因。
    // 改成不掛在 afterUpdate 上，而是在 pfLoopTick() 每次真正跑完一個影格
    // 該補的所有物理步進之後，只手動呼叫一次 pfSyncHandler()——不管這個
    // 影格內部物理世界被推進了幾步，DOM 永遠只依照這一影格最終的結果被
    // 寫入一次，跟螢幕更新率對齊，不再有任何一次多餘、看不見效果的寫入。

    // 原本這裡用 Matter.js 內建 Runner 的 isFixed:true 模式（取代預設「跟著
    // 實際影格間隔變動」的步進方式，解決不同電腦／螢幕更新率上重力速度不
    // 一致的問題）。但後來發現 isFixed:true 其實沒有真的做「累加器補步」：
    // 它每次 requestAnimationFrame 被呼叫到，不管距離上一次實際經過多少
    // 真實時間，一律只推進固定一份（1000/60ms）模擬時間——手機處理 15 張
    // 照片的陰影／變形加上物理運算負擔重，實際更新頻率常掉到 30fps 甚至
    // 更低，一秒內只被呼叫 30 次左右，物理世界一秒卻只推進了
    // 30×(1000/60)＝500ms 的模擬時間，等於用半速慢動作在跑，這正是「手機版
    // 重力比桌機超級慢」的成因。改成自己寫的固定時間步＋真累加器迴圈（見
    // pfStartLoop()／pfLoopTick() 的完整說明），不再依賴 Matter.js 內建
    // Runner：不管 requestAnimationFrame 一秒鐘實際被呼叫幾次，物理世界每
    // 秒總共被推進的模擬時間都固定等於真實經過的時間，手機、桌機播放速度
    // 從此一致，同時原本「不同電腦重力速度不一樣」那個問題（固定時間步
    // 本身就解決了那個問題，累加器只是把它做對）也仍然維持修好的狀態。
    pfRunner = true; // 不再是真正的 Matter.Runner 實例，只當作「目前是不是有一個迴圈存在」的旗標用，配合 pfRunnerPaused 給其他地方的 if(pfRunner) 判斷式繼續使用
    pfStartLoop();
    pfRunnerPaused = false;


    photoFallState = 'active';
  }

  // ---------- 堆疊照片：初次進場（等首頁縮圖真的收起後）或換批（見
  // reshufflePhotoFallBatch()）時，陸續掉進同一個已經在跑的物理世界 ----------
  // photoBatch：要掉落的照片陣列，長度應為 photoFallCount()。省略時
  // （初次進場的原本呼叫方式）沿用原本行為，直接把全部照片洗牌後當作
  // 這一批；換批時則由 pickReshuffleBatch() 先選好、排除目前這批的
  // 結果傳進來。
  // warmCache：url → 已經暖好（下載＋decode 完成）的 Image 元素，來自
  // warmFallBatch()（見該函式旁的完整說明）。沒有傳入、或某張照片剛好不在
  // 裡面（極少數沒趕上暖機時間的情況），就退回原本「建立全新 <img>、
  // decode 完成才淡入」的安全網寫法，行為不變。
  function spawnFallingPhotos(photoBatch, warmCache){
    if(!pfEngine) return; // 保險：使用者可能在照片還沒掉進來之前就已經雙擊提早收掉整個模式
    const Matter = window.Matter;
    const { Composite, Body } = Matter;
    pfSpawnGeneration += 1;
    const mySpawnGeneration = pfSpawnGeneration; // 見上面 pfSpawnGeneration 宣告處的完整說明

    const vw = window.innerWidth;

    // 照片尺寸沿用首頁格子「這一刻」實際渲染出來的大小（就算已經縮小到看
    // 不見，getBoundingClientRect 量到的還是格子本身未縮放前的版面尺寸，
    // 因為縮小用的是 transform，不影響版面盒子），量不到時退回一個保守值。
    // 注意：量到的是「整個正方形格子」的寬度，但首頁縮圖實際顯示的照片
    // 只佔格子的 52%（見 CSS .grid-item img{ max-width:52%; max-height:52% }，
    // 靠 object-fit:contain 置中），兩者不是同一件事——原本直接拿格子寬度
    // 當掉落照片邊長，導致五欄（格子最寬）版面下掉落的照片比首頁實際縮圖
    // 大上將近一倍。這裡統一乘上同一個 52% 比例，掉落照片才會跟首頁「正常
    // 看到」的縮圖大小一致，不受欄數（5/3/2 欄）影響。
    // 手機版掉落的照片再稍微放大一點（0.52 → 0.60，邊長多一成多）：手機版
    // 現在只掉 12 張（見上面 photoFallCount()），格子數變少，畫面有更多
    // 空間可以塞稍微大一點的照片，看起來更清楚，不會顯得空。桌機／平板
    // 維持原本的 0.52 不變。
    // 手機版整體再縮小一點：維持「格子寬度 × 比例＝掉落照片邊長基準」這條
    // 規則本身不變（下面 tileSize／tileArea／依長寬比反推寬高的整套公式都
    // 完全沒動），單純把手機版原本的比例常數（0.60）調降一點（→0.54），
    // 讓算出來的 tileSize 整體小一成，後續依面積、長寬比反推出的每張照片
    // 寬高也會跟著等比例一起縮小。桌機／平板版（0.52）不受影響。
    const PHOTO_FALL_TILE_RATIO = isDetailMobile() ? 0.54 : 0.52;
    const sampleItem = grid.querySelector('.grid-item');
    const cellSize = sampleItem ? sampleItem.getBoundingClientRect().width : Math.min(vw / 5, 260);
    const tileSize = Math.round(cellSize * PHOTO_FALL_TILE_RATIO);
    // 上面這個 tileSize 原本直接拿來當每張掉落照片「正方形」的邊長，導致不管
    // 照片實際是直的、橫的、還是正方的，全部都被硬擠成同一個正方形——這正是
    // 「堆疊畫面每張照片都是正方形」的成因。改成拿 tileSize*tileSize 這個
    // 「面積」當基準（維持跟原本同一個視覺大小級距，不會因為改用真實形狀
    // 就整批變大或變小），再依每張照片實際的寬高比（photo.aspect，見
    // fetchDriveImages() 裡從 Google Drive imageMediaMetadata 算出來的值）
    // 反推出這張照片專屬的寬、高——長寬比越極端（很長的全景照之類），
    // 面積相同時邊長差距會被拉得更開，這裡夾一個上下限（0.4~2.5）避免
    // 極端比例的照片被拉成一條極細的長條，物理碰撞/視覺觀感也比較合理。
    const PHOTO_FALL_TILE_AREA = tileSize * tileSize;
    const PHOTO_FALL_ASPECT_MIN = 0.4;
    const PHOTO_FALL_ASPECT_MAX = 2.5;

    // 每次掉落，挑 3~5 張（隨機決定張數，也隨機決定是哪幾張）放大顯示，
    // 其餘照片維持原本大小完全不變——只是讓畫面裡混一點大小層次，不是
    // 整批改變原有的視覺級距。用「面積」乘上倍數（而不是直接乘邊長）：
    // 跟下面既有的「面積為基準、再依長寬比反推邊長」算法是同一套邏輯，
    // 這樣不管照片本身是直的、橫的、正方的，放大後仍然維持它自己原本的
    // 長寬比，不會變形。倍數選 3.6（面積），換算邊長大約放大 1.9 倍，
    // 比原本的 2.4（邊長約 1.55 倍）更明顯大一階，一眼就能看出「這幾張
    // 特別大」。手機／桌機共用同一套規則，因為兩邊原本的 tileSize 已經
    // 各自用 PHOTO_FALL_TILE_RATIO 分開校準過，這裡只是在各自原本的大小
    // 基準上再放大，不需要另外分裝置處理。
    const PHOTO_FALL_BIG_AREA_MULTIPLIER = 3.6;
    const PHOTO_FALL_BIG_COUNT_MIN = 3;
    const PHOTO_FALL_BIG_COUNT_MAX = 5;

    // 修正：原本這裡是 pool[i % pool.length]，pool（也就是 photos）的順序
    // 從進站抓回照片清單之後就固定不變，等於每次雙擊進堆疊模式，掉下來的
    // 永遠是陣列最前面那固定 15 張（index 0~14）——這正是「每次看到的都是
    // 同一組照片」的成因。改成每次呼叫這個函式時，先把全部照片洗牌
    // （Fisher–Yates，公平的隨機排列，不偏袒任何一張，見上面共用的
    // shuffled() 說明），再從洗牌後的結果依序取用；照片總數不到 15 張時，
    // 用 % 對洗牌後的陣列長度取餘數繼續循環取用（此時勢必得重複，但重複
    // 的組合每次也不同），照片數 ≥15 張時則保證這 15 張彼此都不重複，且
    // 每次進場的組合都不一樣。換批時（photoBatch 有帶值）則直接使用
    // pickReshuffleBatch() 已經排除過目前這批、選好的結果，不再重新洗牌
    // 全部照片。
    const pool = photoBatch || (dvdEImages.length ? shuffled(dvdEImages) : []);
    const fallCount = photoFallCount();

    // 從這一輪會掉落的 fallCount 張裡面，隨機挑出 3~5 個「位置」（index）
    // 標記成放大版——用跟上面照片洗牌一樣的 Fisher–Yates 手法，對
    // [0, fallCount) 這個位置清單洗牌後取前幾個，保證每次挑到的張數、
    // 挑到的是哪幾張都不重複、不偏袒任何位置。照片總數不到 3 張時
    // （fallCount 比 3 還小），Math.min 會讓放大張數自動跟著減少，
    // 不會超過畫面上實際會出現的照片總數。
    const bigCount = Math.min(
      fallCount,
      PHOTO_FALL_BIG_COUNT_MIN + Math.floor(Math.random() * (PHOTO_FALL_BIG_COUNT_MAX - PHOTO_FALL_BIG_COUNT_MIN + 1))
    );
    const bigIndexSet = new Set(shuffled(Array.from({ length: fallCount }, (_, idx) => idx)).slice(0, bigCount));

    const usedUrls = new Set(); // 這一批實際用到的照片，換下一批時用來排除（見 pfLastBatchUrls）

    // 把「真正把這張照片摔進物理世界、同時讓它在畫面上顯示出來」拆成一個
    // 共用函式：warmed（早就暖好、幾乎零延遲）的照片會在下面迴圈裡立刻
    // 同步呼叫；沒趕上暖機時間、還在等真正載入完成的少數照片，則是要等
    // onload/decode 真的成功觸發之後才呼叫——確保任何一張照片「看起來
    // 已經在畫面上」的那一刻，一定同時是「已經開始物理掉落」且「已經有
    // 真正的圖片內容」，不會再出現空白／淺灰方塊已經掉在地上、卻遲遲沒
    // 補上照片的畫面。
    // mySpawnGeneration／pfEngine 的比對（見上面 pfSpawnGeneration 宣告
    // 處的完整說明）：確保這張照片真正掉落的那一刻，還是屬於「現在這一
    // 批」、物理世界也還存在——避免使用者在圖片載入完成之前就已經換批
    // 或雙擊收掉整個堆疊模式，導致遲到的 body 被誤加進早就作廢的世界裡。
    // ---------- 真正修好「堆疊照片永遠碰不到彼此真實邊緣」的根本成因 ----------
    // 過去這裡的碰撞體（physics body）一律是 Bodies.rectangle(itemW, itemH)——
    // 一個貼齊「整張去背圖裁切後外框」的長方形。問題是這些素材本身是去背異形
    // 照片（章魚的觸手、彎曲的老薑、螺旋狀的金屬條…），實際上色的形狀往往比
    // 它的外框矩形小上一大截、甚至中間還鏤空。物理引擎撞牆判斷比對的是「矩形
    // 邊緣」，兩張照片矩形邊緣真的貼在一起時，兩張照片「看得見的部分」之間
    // 還隔著各自矩形內、實際圖案外面那圈透明留白——這正是「不管怎麼調
    // restitution／friction／chamfer 那些碰撞手感參數，肉眼看永遠隔著一段
    // 空隙，怎麼修都無效」的根本原因：問題從來不在碰撞的「手感」，而在碰撞體
    // 的「形狀」本身就沒有貼合圖案真正的輪廓。
    // 這裡改用 buildFallItemBody()（跟飄動的 e 進場落下那顆 body 共用同一套
    // 邏輯，完整說明見該函式上方的註解）：拿這批圖片早就為了「像素級撞牆
    // 判斷」建立好的 alpha 遮罩，拆成一批貼合實際形狀（含凹陷）的小矩形，
    // 組成複合物體當碰撞體，不再是整張外框矩形。遮罩還沒建立好時，函式內部
    // 會自動優雅退回原本的矩形 body，不會讓功能壞掉。
    const dropItem = (el, itemW, itemH, startX, startY, photo) => {
      if(!pfEngine || pfSpawnGeneration !== mySpawnGeneration){
        if(el.parentNode) el.parentNode.removeChild(el); // 這一批（或整個堆疊模式）已經作廢，別再讓這張照片憑空冒出來
        return;
      }
      const maskEntry = photo && photo.src ? getCachedAlphaMask(photo.src) : null;
      const body = buildFallItemBody(Matter, maskEntry, startX, startY, itemW, itemH, {
        restitution: 0.3, // 0.8 太接近全彈跳，多顆疊在一起的照片互相碰撞時會一直小幅度來回彈、看起來在抖動；調低到 0.3，還有一點回彈感，但不會抖個不停
        friction: 0.55,
        frictionAir: 0.012,
        density: 0.0022,
        angle: (Math.random() - 0.5) * 0.6,
      });
      Body.setAngularVelocity(body, (Math.random() - 0.5) * 0.14);
      Composite.add(pfEngine.world, body);
      // 直接把這張照片對應的 body／尺寸／原始 photo 物件存在 DOM 元素自己
      // 身上（而不是每次點擊都去掃一次 pfItems 陣列找）：下面「單擊照片
      // 開啟詳細頁」的偵測邏輯（見 photoFallStage 的 pointerdown/pointerup
      // 監聽器）需要 O(1) 直接拿到這些資訊來算飛行動畫的起點矩形、以及
      // 這張照片在 photos 陣列裡對應的 index。
      el._pf = { body, w: itemW, h: itemH, photo };
      pfItems.push({ body, el, w: itemW, h: itemH });
    };

    for(let i = 0; i < fallCount; i++){
      // 現在掉落的是「漂浮物件圖片庫」（dvdEImages）裡的去背圖，不是
      // 首頁相片——pool 裡每一項是 {src, scale} 物件。
      const photo = pool.length ? pool[i % pool.length] : null;
      if(photo && photo.src) usedUrls.add(photo.src);
      // 寬高比改查 dvdEImageAspectCache（見該 Map 宣告處的完整說明），
      // 這批圖多半已經在背景暖機階段被量過；查不到就退回正方形，行為
      // 跟原本 photo.aspect 缺值時的退回邏輯一致。
      const rawAspect = (photo && dvdEImageAspectCache.get(photo.src)) || 1;
      const aspect = Math.min(PHOTO_FALL_ASPECT_MAX, Math.max(PHOTO_FALL_ASPECT_MIN, rawAspect));
      const tileArea = bigIndexSet.has(i) ? (PHOTO_FALL_TILE_AREA * PHOTO_FALL_BIG_AREA_MULTIPLIER) : PHOTO_FALL_TILE_AREA;
      // area = w*h，aspect = w/h → h = sqrt(area/aspect)，w = h*aspect
      // 再乘上這張圖自己的 scale（跟飄動的 e 撞牆換圖用的是同一個縮放
      // 倍率，見 computeDvdAreaScales() 的完整說明）：圖片庫裡每張去背圖
      // 實際「有色面積」大小不一，用這個倍率校正過，掉落畫面裡的漂浮
      // 物件才會維持跟撞牆飄動時一致的相對大小感，不會忽大忽小。
      const areaScale = (photo && typeof photo.scale === 'number') ? photo.scale : 1;
      const itemH = Math.round(Math.sqrt(tileArea / aspect) * areaScale);
      const itemW = Math.round(itemH * aspect);

      const el = document.createElement('div');
      el.className = 'photo-fall-item';
      el.style.width = itemW + 'px';
      el.style.height = itemH + 'px';

      const startX = itemW / 2 + Math.random() * Math.max(1, vw - itemW);
      const startY = -(PHOTO_FALL_SPAWN_BASE_PX + i * PHOTO_FALL_SPAWN_STAGGER_PX + Math.random() * PHOTO_FALL_SPAWN_JITTER_PX);

      // 修正「照片掉落中途突然閃動一下」的根本成因：這個 div 平常只有
      // width/height 被設定，transform 完全沒設過——CSS 預設的
      // position:absolute + top:0/left:0，等於它「還沒被同步到正確位置
      // 之前」的初始狀態，其實是釘在舞台（視窗）的最左上角（座標
      // (0,0)），而不是預期中畫面上緣以外、看不到的 startX/startY。
      // 真正把它搬到 startX/startY 這個正確的起始位置，原本要等到
      // dropItem() 把物理 body 加進世界、下一次 pfLoopTick() 的
      // pfSyncHandler() 執行時才會發生——中間這一小段空檔（元素已經
      // appendChild 進 DOM、但 style.transform 還沒被寫入）如果剛好被
      // 瀏覽器畫出一影格，使用者看到的就是這張照片先在畫面左上角／頂端
      // 閃了一下、才「跳」去它真正該在的位置開始往下掉——暖機好、立刻
      // 顯示的照片（opacity 直接是 1，見下面 warmedImg 分支）最容易被
      // 看到這一閃，因為它從第一影格就是完全不透明的。
      // 修法：div 一建立、還沒插進 DOM 之前，就先同步把 transform 設成
      // startX/startY 對應的位置（跟 pfSyncHandler 每影格寫入的公式完全
      // 一致：translate(startX - w/2, startY - h/2)）。這樣不管接下來是哪
      // 個分支、appendChild 什麼時候發生，瀏覽器第一次真正畫出這個元素
      // 時，看到的就已經是正確的起始位置，不會再有任何一影格停留在
      // (0,0) 這個錯誤位置。
      el.style.transform = `translate(${startX - itemW / 2}px, ${startY - itemH / 2}px)`;

      if(photo){
        // dvdEImages 裡每一項只有單一畫質的 src（本地已裁切好的
        // data:/blob: URL），不像原本相片還分 gridUrl/thumbUrl 兩種尺寸，
        // 放大版跟一般版都直接沿用同一個 src。
        const srcUrl = photo.src;
        const warmedImg = warmCache && warmCache.get(srcUrl);
        let img;
        if(warmedImg){
          // 這張圖片已經被 warmFallBatch() 真正下載＋decode 完成——直接把
          // 這個「像素早就準備好」的 Image 元素複製一份塞進畫面，不用再
          // 建立一顆從零開始的新 <img> 重新觸發一次載入／decode，也不用
          // 走 CSS 那段 opacity:0 →「decode 完成才淡入」的 0.22s 淡入。
          // 用 cloneNode() 而不是直接搬動原始元素：同一個 url 有可能在
          // 同一批裡被用到不只一次（例如照片總數不到 fallCount 張、
          // pickInitialFallBatch() 循環取用時會重複），若直接搬動原始
          // DOM 節點，後面重複用到同一張圖的位置會把前面那格的 <img> 
          // 「偷走」，導致前面那格瞬間變空——cloneNode() 保證每個位置
          // 都拿到獨立的節點，瀏覽器對同一個 url 本來就有解碼快取，
          // clone 出來的這份一樣是幾乎零延遲顯示，不會重新真的走一次
          // 網路下載。
          img = warmedImg.cloneNode();
          img.classList.add('loaded'); // 在真正插入畫面之前就先加上，瀏覽器第一次繪製就是 opacity:1，不會有任何淡入過程
          // 極端保險：cache 裡存的雖然已經確定是真正成功載入過的圖片（見
          // warmFallBatch() 內的修正說明），但複製出來的這份元素理論上還是
          // 有極小機率在真正插入畫面、瀏覽器要重新繪製時失敗（例如瀏覽器
          // 自己把圖片記憶體快取回收掉——手機同時處理多張大圖、記憶體
          // 壓力大時更容易發生）。這裡補一個 onerror：真的發生時退回全新
          // 載入一次，不要讓這格維持一張確定壞掉的圖。
          // 修正「掉落中途出現奇怪的閃動」的另一個成因：原本這裡是直接
          // img.classList.remove('loaded')，而 .photo-fall-item img 本身
          // 一直掛著 0.22s 的 opacity transition——移除 loaded 會讓瀏覽器
          // 把這 0.22s 的「淡出」也播出來，使用者看到的就是這張已經在
          // 半空中掉落的照片先淡出消失、重新載入完成後才又淡入回來，一來
          // 一回正是「奇怪的閃動」。改成先把 transition 暫時關掉再隱藏
          // （瞬間消失，不播放淡出），只在重新載入成功、真的要淡入回來
          // 的那一刻才把 transition 接回去——使用者感受到的變成單純一次
          // 乾淨的淡入，不會有先淡出再淡入這種來回閃爍的觀感。
          img.onerror = () => {
            img.onerror = null;
            img.style.transition = 'none';
            img.classList.remove('loaded');
            void img.offsetWidth; // 強制套用上面 transition:none，確保下面的隱藏是瞬間的，不會被舊的 transition 排進動畫佇列
            img.src = srcUrl;
            const retryMarkLoaded = () => {
              img.style.transition = ''; // 交還給 CSS 預設的 0.22s opacity transition，讓這次重新出現走正常的單次淡入
              img.classList.add('loaded');
            };
            if(img.decode){ img.decode().then(retryMarkLoaded).catch(retryMarkLoaded); }
            else { img.onload = retryMarkLoaded; }
          };
          img.alt = '';
          img.draggable = false;
          el.appendChild(img);
          photoFallStage.appendChild(el);
          dropItem(el, itemW, itemH, startX, startY, photo); // 已經暖好：跟原本行為一致，立刻掉落
        } else {
          // 沒趕上暖機時間的少數照片：這裡不再像原本那樣先無條件摔一顆
          // body 下去、只靠 <img> 自己的 opacity 淡入來「補」畫面——那樣
          // 只要圖片還沒真的載入完成，使用者看到的就是一塊已經在地上的
          // 灰色方塊，正是這次要修的問題本身。
          // 改成：先把整格用 pf-pending 藏起來（見上面 CSS 的說明），完全
          // 不建立物理 body、也不加進 pfItems——這一刻它在畫面上「根本
          // 不存在」，不是「存在但空白」。等 onload → decode 真的成功、
          // 確定像素已經準備好，才在 markLoadedAndDrop() 裡把「拿掉隱藏」
          // 跟「呼叫 dropItem() 開始掉落」這兩件事同一刻一起做，使用者
          // 看到的就是這張照片「一準備好，立刻從畫面外開始掉落」，跟其他
          // 提早暖好的照片視覺語言一致，只是掉落的時間點稍微晚一點點。
          img = document.createElement('img');
          img.alt = '';
          img.draggable = false;
          el.appendChild(img);
          el.classList.add('pf-pending');
          // 修正「掉落的照片有點不順暢，有時候會停住一下才掉下去」：極少數
          // 照片可能因為短時間內對圖片服務發出大量並發請求，被暫時性延遲
          // （常見成因見上面 warmFallBatch() 的說明），遲遲沒有觸發 onload。
          // 原本這裡完全沒有時間上限，這張照片就會一路停在「畫面上還看不到」
          // 的 pf-pending 狀態，等到它終於載入完成才突然掉下來——這時其他
          // 張早就落地、甚至已經停住，看起來就是「這一張特別頓了一下才掉
          // 下來」，整批的掉落節奏因此不順暢。
          // 拆成兩件各自獨立的事：「開始掉落」（dropItem，決定物理／時間點）
          // 跟「顯示真實圖片」（加上 .loaded，決定畫面內容）不再綁死在同一刻
          // 才能發生——加一個保底逾時，不管圖片載入好了沒，最多等
          // PHOTO_FALL_LOAD_MAX_WAIT_MS 就先讓它跟其他張一起開始掉落（逾時
          // 當下圖片內容可能還是空的，但一落地／掉落中，只要 onload／decode
          // 真的完成，revealImage() 還是會自然淡入，不影響最終一定會顯示
          // 真實照片這件事，只是不再讓單一一張慢的照片拖累、跟其他張脫節）。
          let dropped = false;
          let forceDropTimer = null; // 先宣告成 null：下面 img.complete 命中快取時可能同一行就同步呼叫 startFalling()，早於下面真正排入 setTimeout 那一行，這裡要先有變數可以安全參照
          const startFalling = () => {
            if(dropped) return;
            dropped = true;
            if(forceDropTimer !== null) clearTimeout(forceDropTimer);
            el.classList.remove('pf-pending');
            dropItem(el, itemW, itemH, startX, startY, photo);
          };
          const markLoadedAndDrop = () => {
            img.classList.add('loaded');
            startFalling();
          };
          img.onload = () => {
            if(img.decode){ img.decode().then(markLoadedAndDrop).catch(markLoadedAndDrop); }
            else { markLoadedAndDrop(); }
          };
          // 萬一這張圖真的載入失敗（常見成因：短時間內對圖片服務發出
          // 太多並發請求，被暫時性拒絕/逾時——不是這張圖真的不存在），
          // 先別急著死心：帶一點隨機延遲（避開所有失敗的圖片在同一瞬間
          // 又一起重試、重蹈覆轍撞上同一波併發限制）重新指定一次 src，
          // 給它一次全新的機會。只重試這一次；如果重試也失敗，代表這張
          // 照片這一輪真的沒辦法用——這時如果還沒因為上面的保底逾時開始
          // 掉落，直接把還藏著的 DOM 元素整個移除，這個位置這一批就少一張，
          // 不建立任何物理 body；如果已經先掉落了（逾時保底先觸發），維持
          // 掉落中、只是永遠不會有圖片內容，不會出現「其他張都已經停很久
          // 之後突然又冒出一張圖」的違和感。
          let retried = false;
          img.onerror = () => {
            if(!retried){
              retried = true;
              setTimeout(() => { img.src = srcUrl; }, 300 + Math.random() * 400);
            } else if(!dropped && el.parentNode){
              clearTimeout(forceDropTimer);
              el.parentNode.removeChild(el);
            }
          };
          img.src = srcUrl;
          // 賦值當下就同步檢查一次是不是早就被瀏覽器暖進快取——如果是，
          // 上面的 onload 通常會在下一個 microtask 就觸發，這裡不用特別
          // 処理；但保留這個保底檢查，涵蓋極少數瀏覽器判斷 img.complete
          // 已經是 true 卻可能不會再補觸發 onload 的邊角情況。這裡放在
          // el／img 都已經接好、el 也已經加上 pf-pending 之後才檢查，
          // 即使剛好同步命中，markLoadedAndDrop() 拿掉 pf-pending 的那一刻
          // img 也早就在 el 裡面了，不會有任何一影格是「顯示出來卻還沒
          // 塞圖片」的狀態。
          if(img.complete && img.naturalWidth > 0) markLoadedAndDrop();
          if(!dropped) forceDropTimer = setTimeout(startFalling, PHOTO_FALL_LOAD_MAX_WAIT_MS); // 已經同步命中快取、掉落了就不用再排這個逾時
          photoFallStage.appendChild(el);
        }
      } else {
        // 沒有照片內容可用（例如整份 photos 清單本身是空的）：維持原本
        // 行為，直接掉落一個沒有圖片、只有底色的方塊——這是完全不同的
        // 邊角情況（沒有照片可顯示，不是「照片還沒載入完成」），不受這次
        // 調整影響。
        photoFallStage.appendChild(el);
        dropItem(el, itemW, itemH, startX, startY, photo);
      }
    }
    pfLastBatchUrls = usedUrls;
  }

  // ---------- 單擊／雙擊堆疊頁面畫面上任何地方：跟飄動的 e 一樣的互動 ----------
  // 堆疊裡掉落的每一個物件，現在都是「漂浮物件圖片庫」（dvdEImages）的
  // 去背圖，不再是可以點進去看細節的相片，所以不再用「點一下開啟照片
  // 詳細頁」這套行為；改成套用跟飄動的 e 完全一樣的互動語意：單擊換一批
  // 新的漂浮物件，雙擊直接收起整組堆疊、回到首頁。
  // ---------- 修正：「不限定要點在照片上，點畫面空白處也要算」----------
  // 原本這裡會先用 e.target.closest('.photo-fall-item') 判斷這一下是不是
  // 落在某個掉落物件上，沒點中任何物件（例如點在照片跟照片間的空白縫隙、
  // 或整批物件還沒掉滿畫面時的空白區域）就直接無視，不會觸發換批／收起。
  // 現在改成不管有沒有點中特定物件，只要這一下是落在 #photoFallStage 這個
  // 涵蓋全螢幕的容器範圍內（見 CSS .photo-fall-stage.active 的
  // pointer-events:auto，容器本身在 active 狀態下會撐滿整個視窗），就算一次
  // 有效候選——這裡不再需要記錄「點中的是哪個物件」，純粹只看位置有沒有
  // 明顯位移（拖曳）來分辨「點一下」跟「拖曳」。
  // 堆疊照片同時支援兩種互動：Matter.Mouse（見 startPhotoFallEngine() 內
  // 綁在 photoFallStage 上的原生滑鼠事件）負責物理拖曳／甩動；這裡另外
  // 加一組獨立的 Pointer Events 偵測「單純點一下、沒有拖曳位移」的情況，
  // 判斷方式（pointerdown 記起點、pointerup 比對位移量 PF_PHOTO_TAP_MAX_MOVE）
  // 完全比照上面飄動的 e 那組 dvdTapCandidatePointerId 邏輯；單擊／雙擊
  // 的判斷（用 dvdLastRealClickTime／pfPhotoLastRealClickTime 記錄上一次
  // 有效點擊的時間，兩下間隔夠近才算雙擊）也完全比照同一套寫法——單擊
  // 一律立即觸發，不再等一段觀察期才確認不是雙擊。兩組系統（這裡跟飄動的
  // e 那組）各自獨立運作、互不干擾：這裡完全不呼叫 preventDefault()，
  // Matter 原生的 mousedown/mousemove/mouseup 拖曳照樣正常運作，抓著照片
  // 拖曳、甩動不會被這裡誤判成點擊（拖曳一定會超過 PF_PHOTO_TAP_MAX_MOVE
  // 這個位移門檻）。
  const PF_PHOTO_TAP_MAX_MOVE = 10;
  const PF_PHOTO_DOUBLE_CLICK_MS = 320;
  let pfPhotoTapCandidatePointerId = null;
  let pfPhotoTapStartX = 0, pfPhotoTapStartY = 0;
  let pfPhotoLastRealClickTime = 0;

  // ---------- 長按堆疊畫面：把目前這個瞬間的構圖擷取成「桌布」 ----------
  // 跟上面單擊／雙擊各自獨立一組候選狀態（同一根手指、同一次按下，但
  // 分開追蹤，互不干擾），只看「放開的那一刻，距離按下那一刻經過了多久
  // （真實時間差）」，不用 setTimeout 計時器。
  // ---------- 修正：「手機版剛進入堆疊頁面、第一批照片剛落下時，長按
  // 完全沒有反應」----------
  // 成因：原本的寫法是排一個 setTimeout(..., PF_LONGPRESS_MS)，按住不放
  // 的這段期間如果時間一到就直接觸發擷取。手機剛進場、第一批 8~15 張
  // 照片同時落下、彼此碰撞找位置堆好的那幾秒，正是整段體驗裡物理運算
  // 最吃重的時刻（見上面 startPhotoFallEngine() 內一大段關於手機效能的
  // 說明）——主執行緒被物理計算大量佔用時，setTimeout 的 callback 不保證
  // 準時執行，只保證「不會比排定時間更早」，忙碌期間常常被硬生生延後
  // 好幾百毫秒甚至更久。使用者實際按住的時間明明已經超過 550ms，但這個
  // 延後的 callback 到使用者已經放開手指、pointerup 都觸發過了才輪到
  // 執行——這時候已經太晚，長按因此看起來「完全沒反應」，而且發生機率
  // 剛好就集中在最吃資源的「第一批」，換批之後（世界已經穩定、沒有大量
  // 物理運算搶主執行緒）計時器準時觸發，長按才恢復正常，正是使用者
  // 回報的落差成因。
  // 修法：整段改成不依賴任何計時器——按下時只記錄一個時間戳記
  // （pfLongPressStartTime），真正的判斷延後到放開手指那一刻，直接用
  // 兩個真實時間戳記相減，看這段按住的時間是不是達到 PF_LONGPRESS_MS。
  // pointerdown／pointerup 這兩個事件本身一定會準時送達（跟單擊/雙擊
  // 賴以判斷的機制完全一樣可靠），這個判斷不管中途主執行緒多忙、卡了
  // 多久，都不會受影響——即使物理運算讓畫面掉格，使用者放開手指這個
  // 動作跟事件本身還是會準確被瀏覽器記錄下時間，判斷永遠準確。
  const PF_LONGPRESS_MS = 550;
  let pfLongPressCandidatePointerId = null;
  let pfLongPressStartX = 0, pfLongPressStartY = 0;
  let pfLongPressStartTime = 0;

  photoFallStage.addEventListener('pointerdown', (e) => {
    // ---------- 修正：「雙擊回首頁，點畫面空白處沒反應，只有點在飄動物件
    // 的圖片上才有效」----------
    // 成因：這裡原本是 `if(photoFallState !== 'active') return;`，把
    // entering/exiting/reshuffling 這些過渡狀態全部一起擋掉。問題出在
    // 'reshuffling'：使用者雙擊的「第一下」單擊一落下，下面 pointerup
    // 的邏輯就會立即呼叫 reshufflePhotoFallBatch()，把 photoFallState
    // 從 'active' 改成 'reshuffling'（見該函式開頭）——「第二下」的
    // pointerdown 這時候檢查到的 photoFallState 已經是 'reshuffling'，
    // 被這行直接 return 擋掉，pfPhotoTapCandidatePointerId 完全沒被設
    // 進去，等一下 pointerup 判斷雙擊時開頭就因為 candidate 是 null
    // 直接 return，第二下形同沒發生過，雙擊永遠判斷不成立。飄動的 e
    // （dvdBounce）那組獨立的 pointerdown 監聽器（見上面
    // dvdTapCandidatePointerId 那組）完全沒有這條 photoFallState 限制，
    // 只看是否點在它身上，所以「點在飄動物件的圖片上」雙擊就正常，點
    // 其他空白處雙擊就沒反應——正是使用者回報的落差。修法：單擊/雙擊
    // 的候選記錄放寬成 'active' 或 'reshuffling' 都接受（下面 pointerup
    // 本來就已經完整處理了 reshuffling 時雙擊要呼叫
    // interruptReshuffleForExit() 的分支，只是這個候選記錄一直沒機會
    // 走到那裡），只有真正的 entering/exiting 這兩個動畫過渡狀態才繼續
    // 忽略，避免點到即將被清掉的舊物件。
    if(photoFallState === 'active' || photoFallState === 'reshuffling'){
      pfPhotoTapCandidatePointerId = e.pointerId;
      pfPhotoTapStartX = e.clientX;
      pfPhotoTapStartY = e.clientY;
    }

    // 長按候選獨立追蹤，用比單擊/雙擊更寬鬆的門檻：只要不是 'idle'
    // （根本沒有堆疊模式）或 'exiting'（正在整批飛出畫面），連 'entering'
    // 這個過渡狀態也照樣先記下按下的時間——使用者剛雙擊完 dvdBounce
    // 進入堆疊模式，很可能緊接著就長按，這一下按下的當下 photoFallState
    // 極可能還停在 'entering'（要等 Matter.js 真的載入完成才會翻成
    // 'active'，見 startPhotoFallEngine() 開頭說明）。等放開手指、真的要
    // 判斷是否成立長按時（見下面 pointerup），使用者這時已經按住超過
    // 550ms，'entering' 幾乎一定早就轉成 'active'；真的還沒轉成的極端
    // 情況，下面判斷式也會因為要求當下必須是 'active' 才觸發擷取而自然
    // 放棄，不會擷取到一張空白或半成品的畫面。
    if(photoFallState !== 'idle' && photoFallState !== 'exiting'){
      pfLongPressCandidatePointerId = e.pointerId;
      pfLongPressStartX = e.clientX;
      pfLongPressStartY = e.clientY;
      pfLongPressStartTime = Date.now();
    }
  });
  window.addEventListener('pointerup', (e) => {
    // 長按候選優先判斷：命中就直接處理完畢，不落到下面單擊/雙擊那組邏輯，
    // 避免這次放開同時被算成一次點擊。
    if(pfLongPressCandidatePointerId !== null && e.pointerId === pfLongPressCandidatePointerId){
      pfLongPressCandidatePointerId = null;
      const ldx = e.clientX - pfLongPressStartX, ldy = e.clientY - pfLongPressStartY;
      const heldMs = Date.now() - pfLongPressStartTime;
      const isStillish = Math.hypot(ldx, ldy) <= PF_PHOTO_TAP_MAX_MOVE; // 明顯位移＝拖曳/甩動，不算長按
      const noOverlay = !document.body.classList.contains('detail-active') && !document.body.classList.contains('preview-active');
      if(isStillish && heldMs >= PF_LONGPRESS_MS && noOverlay){
        pfPhotoTapCandidatePointerId = null; // 避免下面單擊/雙擊邏輯又把這次放開重複處理一次
        if(photoFallState === 'active') capturePhotoFallWallpaper();
        return;
      }
    }
    if(pfPhotoTapCandidatePointerId === null || e.pointerId !== pfPhotoTapCandidatePointerId) return;
    pfPhotoTapCandidatePointerId = null;
    const dx = e.clientX - pfPhotoTapStartX, dy = e.clientY - pfPhotoTapStartY;
    if(Math.hypot(dx, dy) > PF_PHOTO_TAP_MAX_MOVE) return; // 明顯位移＝拖曳，不算點擊
    if(document.body.classList.contains('detail-active') || document.body.classList.contains('preview-active')) return;
    // ---------- 修正：「堆疊頁面單擊照片掉下去，感覺慢了一拍才反應」 ----------
    // 跟上面飄動的 e 那組（見 pointerup 監聽器內的完整說明）是同一個成因、
    // 同一套修法：原本第一下點擊永遠先不做事，只當「雙擊候選」，開一個
    // PF_PHOTO_DOUBLE_CLICK_MS（320ms）計時器空等，確定沒有等到第二下
    // 才真的呼叫 reshufflePhotoFallBatch()——單擊反應永遠被這段觀察期
    // 拖慢。改成點下去當下立即呼叫 reshufflePhotoFallBatch()（該函式內部
    // 本來就有 photoFallState!=='active' 時直接 no-op 的保護，其餘狀態
    // 呼叫不會有副作用）；如果緊接著真的等到第二下判定成雙擊，這時
    // photoFallState 已經因為上面提前觸發變成 'reshuffling'，一樣會走
    // 下面已經寫好、專門處理「換批途中被雙擊打斷」的 interruptReshuffleForExit()
    // 分支，無縫接上收場流程，行為不受影響。
    const nowClick = Date.now();
    if(nowClick - pfPhotoLastRealClickTime <= PF_PHOTO_DOUBLE_CLICK_MS){
      // 判定成雙擊：直接收起整組堆疊——跟 handleDvdDoubleClick() 的邏輯
      // 完全一致，含「換批動畫進行中又被雙擊打斷」的處理
      // （interruptReshuffleForExit()）。
      pfPhotoLastRealClickTime = 0;
      if(photoFallState === 'active'){
        exitPhotoFallMode();
      } else if(photoFallState === 'reshuffling'){
        interruptReshuffleForExit();
      }
    } else {
      pfPhotoLastRealClickTime = nowClick;
      if(photoFallState === 'active') reshufflePhotoFallBatch(); // 立即觸發，不再等待觀察期（見上方完整說明）
    }
  });
  window.addEventListener('pointercancel', (e) => {
    if(pfPhotoTapCandidatePointerId === e.pointerId){ pfPhotoTapCandidatePointerId = null; }
    if(pfLongPressCandidatePointerId === e.pointerId){ pfLongPressCandidatePointerId = null; }
  });

  // ---------- 長按擷取：把堆疊畫面目前的構圖畫成「桌布」 ----------
  // 這裡不是呼叫瀏覽器的螢幕截圖 API（網頁本身沒有這個權限），而是把
  // 目前每個漂浮物件在 Matter 物理世界裡的實際位置（pfBoxCenter）、角度
  // （body.angle）、跟畫面上呈現用的尺寸，原封不動地用 <canvas> 重畫一次，
  // 重現使用者長按那一刻眼睛看到的構圖——純白底、只有這些去背 PNG，不含
  // 任何標題文字、按鈕、時鐘等版面元素（因為根本沒有把它們畫進 canvas）。
  //
  // 三種輸出比例（手機直式 9:19.5／平板 3:4／桌機橫式 16:9）沿用全站
  // 既有的裝置寬度斷點（DESKTOP_BREAKPOINT、640px，見上面宣告處），不再
  // 另外發明一套判斷。構圖本身的寬高比很少剛好等於輸出比例，所以用
  // 「等比例縮放＋置中」（跟 CSS object-fit:contain 同樣的精神）讓構圖
  // 貼齊輸出畫布其中一組邊，另一軸留白，絕對不會裁掉任何一個物件的
  // 一部分。
  function pfWallpaperContainFit(boxW, boxH, natW, natH){
    if(!natW || !natH) return { w: boxW, h: boxH };
    const boxRatio = boxW / boxH, natRatio = natW / natH;
    // 跟 CSS object-fit:contain 完全同一個公式：圖片自己的長寬比比容器
    // 「更寬」就以寬度為準縮，否則以高度為準縮，維持圖片原始比例、
    // 絕不變形、也絕不超出容器範圍。
    return natRatio > boxRatio
      ? { w: boxW, h: boxW / natRatio }
      : { w: boxH * natRatio, h: boxH };
  }

  function capturePhotoFallWallpaper(){
    try{
      if(!pfItems.length && !pfDvdItem) return; // 畫面上什麼都沒有，沒什麼好擷取的

      // 收集目前每個「已經真的載入完成、看得到」的物件：圖片元素本身
      // （直接沿用畫面上現有的 <img>，不重新下載）、物理世界目前的中心點
      // 跟角度、以及顯示用的 box 尺寸（用來換算 object-fit:contain 之後
      // 圖片實際佔的大小，而不是整個可能留白的 box）。
      const entries = [];
      pfItems.forEach(({ body, el, w, h }) => {
        const img = el.querySelector('img');
        if(!img || !img.complete || !img.naturalWidth) return; // 還在 pf-pending（尚未載入完成）的跳過，避免擷取到空白
        const c = pfBoxCenter(body);
        entries.push({ img, cx: c.x, cy: c.y, angle: body.angle, boxW: w, boxH: h });
      });
      if(pfDvdItem && dvdBounceImgEl && dvdBounceImgEl.complete && dvdBounceImgEl.naturalWidth){
        const c = pfBoxCenter(pfDvdItem.body);
        entries.push({ img: dvdBounceImgEl, cx: c.x, cy: c.y, angle: pfDvdItem.body.angle, boxW: pfDvdItem.w, boxH: pfDvdItem.h });
      }
      if(!entries.length) return;

      // 算出每個物件旋轉後的四個角落座標，彙整成整批構圖的外接邊界——
      // 這個邊界之後會被整批等比例縮放去貼齊輸出畫布，邊界的極值點自然
      // 就會落在畫布邊緣上，也就是「PNG 邊緣精準靠齊照片邊界」的由來。
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      entries.forEach(entry => {
        const fit = pfWallpaperContainFit(entry.boxW, entry.boxH, entry.img.naturalWidth, entry.img.naturalHeight);
        entry.drawW = fit.w; entry.drawH = fit.h;
        const hw = fit.w / 2, hh = fit.h / 2;
        const cos = Math.cos(entry.angle), sin = Math.sin(entry.angle);
        // (lx,ly) 是物件自己座標系裡的四個角落，套用跟畫面上 CSS
        // `rotate(angle)` 同一個旋轉方向，再平移回物件中心，換算成世界座標。
        [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]].forEach(([lx, ly]) => {
          const wx = entry.cx + lx * cos - ly * sin;
          const wy = entry.cy + lx * sin + ly * cos;
          if(wx < minX) minX = wx; if(wx > maxX) maxX = wx;
          if(wy < minY) minY = wy; if(wy > maxY) maxY = wy;
        });
      });
      const contentW = maxX - minX, contentH = maxY - minY;
      if(!(contentW > 0) || !(contentH > 0)) return;

      // 手機／平板／桌機三組固定輸出解析度，跟全站既有的裝置寬度斷點
      // （DESKTOP_BREAKPOINT=1100、640）保持一致，不另外發明新的判斷。
      // 這裡故意用比裝置螢幕更高一階的解析度（大致是常見手機/平板/桌機
      // 螢幕實際像素密度的 2 倍），畫質可以撐得住當作桌布放大檢視、甚至
      // 印出來也不會糊，跟 JPEG 品質（見下面 canvas.toBlob 那行）一起
      // 兩邊都調高。
      const vw = window.innerWidth;
      let canvasW, canvasH;
      if(vw <= 640){ canvasW = 2160; canvasH = 4680; } // 9:19.5，手機直式
      else if(vw <= DESKTOP_BREAKPOINT){ canvasW = 3072; canvasH = 4096; } // 3:4，平板
      else { canvasW = 3840; canvasH = 2160; } // 16:9，桌機橫式（4K）

      const canvas = document.createElement('canvas');
      canvas.width = canvasW;
      canvas.height = canvasH;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvasW, canvasH);

      // ---------- 對齊方式：左、右、下三邊都精準貼齊，只有上方可能留白 ----------
      // 原本這裡是「整批置中＋兩軸都留白」（跟 CSS object-fit:contain 一樣
      // 的置中手法）。改成優先用「寬度」決定縮放比例：整批構圖的寬度直接
      // 撐滿畫布寬度，左右兩側因此一定精準貼齊；縮放後的高度如果小於等於
      // 畫布高度（絕大多數情況——手機直式輸出通常比實際視窗畫面更高、更窄，
      // 構圖高度本來就撐不滿），就把整批構圖貼齊畫布下緣（照片本來就是
      // 從上面掉下來、堆在下半部，貼齊下緣最符合視覺直覺），只有上方留白，
      // 完全符合「左、右、下三邊都精準對齊」的需求。
      // 極端情況（構圖高度按這個縮放比例算出來反而超過畫布高度，貼滿寬度
      // 會讓上緣被裁掉一截）才退回改用高度為準縮放、水平置中——這種退回
      // 完全是為了信守「絕不裁切任何物件」這個更高優先的原則，一般使用
      // 情境幾乎不會踩到。
      const scaleByWidth = canvasW / contentW;
      let scale, offsetX, offsetY;
      if(contentH * scaleByWidth <= canvasH){
        scale = scaleByWidth;
        offsetX = -minX * scale;           // 左緣精準貼齊 x=0
        offsetY = canvasH - maxY * scale;  // 下緣精準貼齊 y=canvasH，上方留白
      } else {
        scale = canvasH / contentH;
        offsetX = (canvasW - contentW * scale) / 2 - minX * scale; // 貼滿高度時改成水平置中，避免裁切
        offsetY = canvasH - maxY * scale;
      }

      entries.forEach(entry => {
        ctx.save();
        ctx.translate(entry.cx * scale + offsetX, entry.cy * scale + offsetY);
        ctx.rotate(entry.angle);
        ctx.drawImage(
          entry.img,
          -entry.drawW * scale / 2, -entry.drawH * scale / 2,
          entry.drawW * scale, entry.drawH * scale
        );
        ctx.restore();
      });

      // 輸出成 JPEG：因為畫布本身一開始就已經鋪滿白色底色（見上面
      // ctx.fillRect），JPEG 不支援透明度也完全不受影響，畫面上看到的
      // 白底不會變成黑底或其他顏色。品質從 0.92 調到 0.97——檔案會大一點，
      // 但堆疊照片本身邊緣線條、細節較多，0.92 在放大檢視時偶爾看得出
      // 壓縮的色塊感，0.97 幾乎跟原圖無異，換來的檔案大小增加在現在的
      // 解析度下仍在合理範圍。
      canvas.toBlob((blob) => {
        if(!blob) return;
        showWallpaperPreview(URL.createObjectURL(blob));
      }, 'image/jpeg', 0.97);
    } catch(err){
      // 擷取失敗（例如圖片解碼中途被瀏覽器某些安全限制擋下）就靜靜放棄，
      // 不影響堆疊模式本身任何既有功能，使用者大不了再長按一次。
      console.warn('擷取堆疊畫面失敗：', err);
    }
  }

  const wallpaperPreviewOverlay = document.getElementById('wallpaperPreviewOverlay');
  const wallpaperPreviewImg = document.getElementById('wallpaperPreviewImg');
  const wallpaperDownloadBtn = document.getElementById('wallpaperDownloadBtn');
  const wallpaperCloseBtn = document.getElementById('wallpaperCloseBtn');
  let wallpaperPreviewObjectUrl = null; // 目前這張預覽圖的 blob URL，關閉時要釋放，避免累積記憶體
  const WALLPAPER_FADE_MS = 180; // 跟上面 CSS .wallpaper-preview-overlay 的 transition 時間保持一致
  let wallpaperHideCleanupTimer = null; // 淡出動畫播完之後才真正清掉 src／釋放 blob URL 的計時器

  function showWallpaperPreview(objectUrl){
    if(!wallpaperPreviewOverlay || !wallpaperPreviewImg) { URL.revokeObjectURL(objectUrl); return; }
    // 如果上一張的淡出動畫還沒播完使用者就又長按了一次，先取消那個排定中的
    // 清理，直接沿用下面「換成新圖」的流程，不要讓舊的計時器之後跑出來把
    // 這張新圖的 src 也清掉。
    if(wallpaperHideCleanupTimer){ clearTimeout(wallpaperHideCleanupTimer); wallpaperHideCleanupTimer = null; }
    if(wallpaperPreviewObjectUrl) URL.revokeObjectURL(wallpaperPreviewObjectUrl); // 上一張還沒被使用者關掉就長按了下一次，先把上一張釋放掉
    wallpaperPreviewObjectUrl = objectUrl;
    wallpaperPreviewImg.src = objectUrl;
    if(wallpaperDownloadBtn) wallpaperDownloadBtn.href = objectUrl;
    wallpaperPreviewOverlay.classList.add('active'); // CSS transition 負責淡入
    wallpaperPreviewOverlay.setAttribute('aria-hidden', 'false');
  }
  function hideWallpaperPreview(){
    if(!wallpaperPreviewOverlay) return;
    wallpaperPreviewOverlay.classList.remove('active'); // CSS transition 負責淡出
    wallpaperPreviewOverlay.setAttribute('aria-hidden', 'true');
    // 立刻清 src／釋放 blob URL 的話，圖片會在淡出動畫「播到一半」的時候
    // 就整個消失，等於看不到淡出效果。改成等 CSS transition 的時間過完
    // （WALLPAPER_FADE_MS，跟上面 CSS 的 180ms 對齊）才真的清理，畫面上
    // 看到的就是完整的淡出，動畫結束後才悄悄回收資源，使用者不會察覺。
    if(wallpaperHideCleanupTimer) clearTimeout(wallpaperHideCleanupTimer);
    wallpaperHideCleanupTimer = setTimeout(() => {
      wallpaperHideCleanupTimer = null;
      if(wallpaperPreviewObjectUrl){ URL.revokeObjectURL(wallpaperPreviewObjectUrl); wallpaperPreviewObjectUrl = null; }
      if(wallpaperPreviewImg) wallpaperPreviewImg.src = '';
    }, WALLPAPER_FADE_MS);
  }
  if(wallpaperCloseBtn) wallpaperCloseBtn.addEventListener('click', hideWallpaperPreview);
  // 點背景（不是點在圖片或按鈕上）也能直接關閉，跟其他全站彈窗手感一致。
  if(wallpaperPreviewOverlay) wallpaperPreviewOverlay.addEventListener('click', (e) => {
    if(e.target === wallpaperPreviewOverlay) hideWallpaperPreview();
  });

  // ---------- 手機／觸控：堆疊頁面裡抓著的漂浮物件，補上第二根手指可以旋轉它 ----------
  // 跟上面飄動的 e 那一整組（見 startDvdRotateGesture()／applyDvdTwoFingerRotation()
  // 上方的完整說明）互相呼應的需求：使用者用一根手指抓著堆疊裡的某個漂浮
  // 物件（已經走 Matter.Mouse／MouseConstraint 那套物理拖曳，見
  // startPhotoFallEngine() 內 pfMouseConstraint 的建立）之後，再補上第二根
  // 手指，兩指像轉盤子一樣繞著轉，這個物件的角度要跟著即時旋轉；放開旋轉
  // 手指時如果還帶著轉動的角速度，要像甩出去一樣讓它自己繼續轉一段、自然
  // 衰減停下來。
  //
  // 做法上跟飄動的 e 有一個關鍵差異：飄動的 e 完全脫離 Matter.js（自己手刻
  // dvdRotationDeg／dvdRotationVel／stepDvdRotation() 那一套角度＋角速度＋
  // 摩擦力衰減），這裡的物件則是貨真價實活在 Matter 物理世界裡的 body——
  // 角度本身就是 body.angle，衰減、碰撞、跟鄰居互相推擠這些事，物理引擎
  // 早就會做，不需要另外寫一套衰減動畫；旋轉手勢進行中直接呼叫
  // Matter.Body.setAngle() 寫入角度，放開時改成呼叫
  // Matter.Body.setAngularVelocity() 把最後一小段時間換算出的角速度交還
  // 給引擎，之後就完全比照物理世界本來的規則自然運作。
  //
  // 核心難題：Matter.Mouse 直接綁 touchstart/touchmove/touchend 在
  // photoFallStage 上把觸控當滑鼠處理，而且完全不分辨「哪一根手指」——
  // 每次都直接讀 event.changedTouches[0] 當成滑鼠目前的位置（見
  // startPhotoFallEngine() 內 pfMouse = Mouse.create(photoFallStage) 附近的
  // 完整說明）。放任第二根（旋轉用）手指的觸控事件也傳到 Matter 手上，會：
  //   1) 第二指按下的瞬間，Matter 把這一刻的滑鼠位置「跳」到第二指剛按下
  //      的座標，抓著的物件跟著瞬間抖一下；
  //   2) 第二指移動時，Matter 也會把它的位置誤當成主要拖曳手指的最新位置，
  //      物件會跟著錯誤的手指亂飄；
  //   3) 第二指放開時，Matter 的 touchend 處理一律把 mouse.button 設回
  //      -1（等同「使用者放開了」），會讓主要手指明明還按著，卻被誤判成
  //      整條拖曳直接結束、物件被瞬間丟下。
  // 解法：在 document 上用「捕獲階段」（{capture:true}）攔截這些原生
  // TouchEvent——捕獲階段一定比 Matter 掛在 photoFallStage 本身（屬於
  // target 階段）的監聽器更早收到事件，只要命中旋轉手指就呼叫
  // stopPropagation()，讓事件在往下傳到 photoFallStage、被 Matter 收到
  // 之前就被攔下來，Matter 完全不會知道這根旋轉手指的存在；主要拖曳手指
  // 的觸控事件完全不攔截，繼續正常流到 Matter 手上，拖曳手感不受任何影響。
  let pfRotateTouchId = null;   // 目前負責旋轉手勢的第二根手指 identifier；null 代表沒有在做旋轉手勢
  let pfPrimaryTouchId = null;  // 目前負責拖曳位置（已經被 Matter 抓住）的那根手指 identifier
  let pfPrimaryTouchX = 0, pfPrimaryTouchY = 0; // 兩指連線的兩個端點座標，算法跟
  let pfRotateTouchX = 0, pfRotateTouchY = 0;   // dvdPrimaryTouchX/dvdRotateTouchX 完全同一套精神（見上方飄動的 e 那組）
  let pfRotateLastAngle = 0;    // 上一次量到的「兩指連線」角度（弧度），逐影格算差值累加，理由同 dvdRotateLastAngle
  let pfRotateBody = null;      // 目前正在被兩指旋轉的物理 body（堆疊照片或飄動的 e 共用同一套）
  let pfRotateSamples = [];     // 最近的 {t, angle} 取樣，放開時用來算甩轉的瞬時角速度，寫法比照 dvdRotateSamples
  const PF_ROTATE_FLING_WINDOW_MS = 80; // 跟 DVD_ROTATE_FLING_WINDOW_MS 同一個概念、同一個時長
  const PF_ROTATE_HIT_PADDING = 30; // px，第二指落下時的命中容錯。堆疊照片通常比飄動的 e
    // 小一圈，兩指要同時準確落在同一張小照片上更難操作，容錯比 DVD_GRAB_PADDING_TOUCH 再留寬一點。
  const PF_ROTATE_MAX_ANGULAR_VEL = 0.6; // rad/影格，甩轉放開時角速度的保底夾限，避免觸控座標量測雜訊在極端情況下轉出離譜的轉速

  // 找出目前這顆 body 對應的 DOM 元素：堆疊照片（pfItems）或飄動的 e
  // （pfDvdItem，共用既有的 #dvdBounce 元素）共用同一套查找。
  function pfFindItemEl(body){
    if(pfDvdItem && pfDvdItem.body === body) return dvdBounce;
    const found = pfItems.find(it => it.body === body);
    return found ? found.el : null;
  }

  // 跟 applyDvdTwoFingerRotation() 完全同一套精神：不管是主要拖曳手指、還是
  // 旋轉手指移動，都重新算一次「兩指連線」角度、跟上一次記下的角度取差值
  // 累加到 body.angle 上，角度基準值永遠跟著這一影格兩指的即時位置同步，
  // 才不會有轉動軸心跟著拖曳方向跑偏的問題（原理、成因跟
  // applyDvdTwoFingerRotation() 上方的完整說明一致，這裡不重複）。
  function applyPfTwoFingerRotation(){
    if(pfRotateTouchId === null || !pfRotateBody) return;
    const Matter = window.Matter;
    if(!Matter) return;
    const angle = Math.atan2(pfRotateTouchY - pfPrimaryTouchY, pfRotateTouchX - pfPrimaryTouchX);
    let deltaRad = angle - pfRotateLastAngle;
    // 正規化到 -PI ~ PI：兩指連線角度剛好跨過 180° 那一瞬間，直接相減會
    // 從接近 +PI 瞬間跳到接近 -PI（或反過來），修正回「這一影格實際轉動
    // 的最短角度」，物件才不會在那一刻無故瞬間轉一大圈，理由同
    // applyDvdTwoFingerRotation()。
    while(deltaRad > Math.PI) deltaRad -= Math.PI * 2;
    while(deltaRad < -Math.PI) deltaRad += Math.PI * 2;
    pfRotateLastAngle = angle;
    Matter.Body.setAngle(pfRotateBody, pfRotateBody.angle + deltaRad);
    // 手動控制角度期間，順手把角速度歸零：避免物理引擎自己（例如還在跟
    // 鄰居解重疊）疊加的角速度，跟這裡手動寫入的角度互相打架、抖動。
    Matter.Body.setAngularVelocity(pfRotateBody, 0);

    const now = performance.now();
    pfRotateSamples.push({ t: now, angle: pfRotateBody.angle });
    while(pfRotateSamples.length > 2 && now - pfRotateSamples[0].t > PF_ROTATE_FLING_WINDOW_MS){
      pfRotateSamples.shift();
    }
  }

  // 放開旋轉手指：把最後一小段時間的角度變化換算成放開當下的角速度，直接
  // 寫回物理引擎（Matter.Body.setAngularVelocity），之後就完全交給 Matter
  // 自己的角動量／frictionAir／碰撞接手，不需要另外寫一套衰減動畫——這正是
  // 「活在物理世界裡的物件」跟飄動的 e（完全脫離 Matter，見
  // finalizeDvdRotateVelocity()）最大的不同之處。
  function finalizePfRotateVelocity(){
    if(!pfRotateBody) return;
    const now = performance.now();
    pfRotateSamples.push({ t: now, angle: pfRotateBody.angle });
    while(pfRotateSamples.length > 1 && now - pfRotateSamples[0].t > PF_ROTATE_FLING_WINDOW_MS){
      pfRotateSamples.shift();
    }
    const first = pfRotateSamples[0];
    const last = pfRotateSamples[pfRotateSamples.length - 1];
    const dt = Math.max(1, last.t - first.t) / 1000;
    // Matter.Body.angularVelocity 的單位是「每一次 Engine.update() 增加的
    // 弧度」（見 pfLoopTick() 內固定用 PF_FIXED_STEP_MS 呼叫
    // Matter.Engine.update() 那一套，一步固定對應 PF_FIXED_STEP_MS 這麼多
    // 真實時間），不是「每秒」——這裡先算出真正的角速度（弧度／秒），再依
    // 這個固定步長換算回「每一步」的單位，跟 Matter 內部自己因碰撞算出來
    // 的 angularVelocity 是同一套單位、可以直接相容銜接，放開後的旋轉／
    // 碰撞手感才會跟原本的物理世界一致，不會突然轉速對不上。
    const angularVelPerSecond = (last.angle - first.angle) / dt;
    const angularVelPerStep = angularVelPerSecond * (PF_FIXED_STEP_MS / 1000);
    const clamped = Math.max(-PF_ROTATE_MAX_ANGULAR_VEL, Math.min(PF_ROTATE_MAX_ANGULAR_VEL, angularVelPerStep));
    const Matter = window.Matter;
    if(Matter) Matter.Body.setAngularVelocity(pfRotateBody, clamped);
  }

  function endPfRotateGesture(){
    if(pfRotateTouchId === null) return;
    finalizePfRotateVelocity();
    pfRotateTouchId = null;
    pfRotateBody = null;
    pfRotateSamples = [];
  }

  // 第二根手指落下、確定要開始兩指旋轉手勢：只有目前確實有物件被抓著
  // （pfMouseConstraint.body 非 null）、且還沒有另一根手指在做旋轉手勢時，
  // 才需要判斷這一下是不是命中了那個正被抓著的物件（含它的觸控容錯範圍）。
  document.addEventListener('touchstart', (e) => {
    if(!pfMouseConstraint || !pfMouseConstraint.body || pfRotateTouchId !== null) return;
    const draggedBody = pfMouseConstraint.body;
    const el = pfFindItemEl(draggedBody);
    if(!el) return;
    const newTouch = e.changedTouches && e.changedTouches[0];
    if(!newTouch) return;
    // 這一刻 event.touches 裡，扣掉剛剛新落下的這一根，剩下的就是正在
    // 拖曳位置的那根手指——不需要另外追蹤「哪根手指是主要拖曳手指」，
    // 因為能走到這裡代表已經有物件被抓著，e.touches 裡除了這根新手指
    // 之外的其他手指，必然就是那根正在拖曳的手指。
    const primaryTouch = Array.prototype.find.call(e.touches, (t) => t.identifier !== newTouch.identifier);
    if(!primaryTouch) return; // 理論上不會發生（代表根本沒有第二根手指），保底放行
    const rect = el.getBoundingClientRect();
    if(!dvdHitTest(rect, newTouch.clientX, newTouch.clientY, PF_ROTATE_HIT_PADDING)) return;

    pfRotateTouchId = newTouch.identifier;
    pfPrimaryTouchId = primaryTouch.identifier;
    pfPrimaryTouchX = primaryTouch.clientX;
    pfPrimaryTouchY = primaryTouch.clientY;
    pfRotateTouchX = newTouch.clientX;
    pfRotateTouchY = newTouch.clientY;
    pfRotateBody = draggedBody;
    pfRotateLastAngle = Math.atan2(pfRotateTouchY - pfPrimaryTouchY, pfRotateTouchX - pfPrimaryTouchX);
    pfRotateSamples = [{ t: performance.now(), angle: draggedBody.angle }];
    // 開始手動旋轉的當下，先把殘留的物理角速度（例如剛撞完鄰居還沒轉完）
    // 歸零，避免手勢控制跟碰撞殘留互相疊加，理由同 startDvdRotateGesture()。
    const Matter = window.Matter;
    if(Matter) Matter.Body.setAngularVelocity(draggedBody, 0);

    e.stopPropagation(); // 攔下來，不讓 Matter 收到這根手指的 touchstart（見上方完整說明）
    e.preventDefault();
  }, { capture: true, passive: false });

  document.addEventListener('touchmove', (e) => {
    if(pfRotateTouchId === null) return;
    for(let i = 0; i < e.changedTouches.length; i++){
      const t = e.changedTouches[i];
      if(t.identifier === pfRotateTouchId){
        pfRotateTouchX = t.clientX;
        pfRotateTouchY = t.clientY;
        applyPfTwoFingerRotation();
        e.stopPropagation(); // 旋轉手指的移動絕對不能讓 Matter 收到，見上方完整說明
        e.preventDefault();
        return;
      }
      if(t.identifier === pfPrimaryTouchId){
        // 主要拖曳手指移動：不攔截、正常放行給 Matter 處理拖曳，這裡只是
        // 順便同步一份座標，讓旋轉的角度基準跟著這一影格的最新位置更新
        // （跟 applyDvdTwoFingerRotation() 為什麼要吃兩種手指移動的理由
        // 完全一樣，見該處完整說明），避免轉動軸心跟著拖曳方向跑偏。
        pfPrimaryTouchX = t.clientX;
        pfPrimaryTouchY = t.clientY;
        applyPfTwoFingerRotation();
      }
    }
  }, { capture: true, passive: false });

  function pfHandleRotateTouchEnd(e){
    if(pfRotateTouchId === null) return;
    for(let i = 0; i < e.changedTouches.length; i++){
      const t = e.changedTouches[i];
      if(t.identifier === pfRotateTouchId){
        endPfRotateGesture();
        // 放開旋轉手指這個訊號也不能讓 Matter 收到——Matter 的 touchend
        // 處理完全不分辨是哪根手指，一律直接把 mouse.button 設回 -1、
        // 等同「使用者放開了」，會讓主要拖曳手指還按著卻被誤判成整個放開，
        // 正在拖的物件突然被丟下——攔截掉才能確保只有主要手指真的放開時，
        // 拖曳才會跟著結束。
        e.stopPropagation();
        e.preventDefault();
        return;
      }
      if(t.identifier === pfPrimaryTouchId){
        // 主要拖曳手指放開：整個拖曳即將由 Matter 自己收尾（這裡不攔截，
        // 放行讓它正常收到 touchend），旋轉手勢沒有理由繼續留著，一併
        // 結束、把最後一小段角速度寫回物理引擎，不然 pfRotateTouchId 會
        // 一直卡在非 null，之後這根手指的殘影 identifier 也不會再對應到
        // 任何實際存在的觸控。
        endPfRotateGesture();
        pfPrimaryTouchId = null;
      }
    }
  }
  document.addEventListener('touchend', pfHandleRotateTouchEnd, { capture: true, passive: false });
  document.addEventListener('touchcancel', pfHandleRotateTouchEnd, { capture: true, passive: false });

  // ---------- 目前沒有任何地方呼叫這個函式 ----------
  // 掉落的堆疊物件改成漂浮物件圖片庫（去背圖）之後，點一下的行為已經
  // 改成換批、雙擊改成收起堆疊（見上面新的 pointerup 監聽器），不再開啟
  // 照片詳細頁——這個物件本來就不是 photos 陣列裡的相片，也就沒有詳細頁
  // 可以開。保留這個函式只是為了完整記錄原本「點下堆疊裡的某一張照片」
  // 這套轉場邏輯，之後如果想恢復或另作他用可以參考，目前完全是死碼、
  // 不影響任何行為。
  // 點下堆疊裡的某一張照片：跟首頁格子點縮圖一樣的「分身飛到大圖欄位」
  // 轉場（見 openDetail()／runGridToDetailTransition()），差別有三點：
  //   1) 起點矩形直接用物理世界目前的座標反推（見下面的完整說明），不是
  //      量 DOM 的 getBoundingClientRect()。
  //   2) 額外多帶一個 angle（弧度，body 當下的物理旋轉角度）——這樣
  //      runGridToDetailTransition() 才能讓分身「從它當下傾斜的角度」
  //      開始飛，飛行途中同時完成旋轉回正、放大、移動這三件事，而不是
  //      像原本那樣完全丟掉角度、憑空從水平姿態開始（見
  //      rotatedTopLeftForCenterPivot() 的完整說明）。
  //   3) 開啟前先把整個物理世界暫停（pfRunner），確保使用者按上一頁回來
  //      時，堆疊畫面完全是離開前那一刻的樣子——見 detailFromPhotoFall
  //      這個旗標、以及 finishCloseDetail() 裡消耗它的分支。
  function openDetailFromPhotoFallItem(itemEl){
    const info = itemEl._pf;
    if(!info || !info.photo) return;
    const index = photos.indexOf(info.photo);
    if(index === -1) return;
    const imgEl = itemEl.querySelector('img');
    if(!imgEl) return;

    detailFromPhotoFall = true;
    if(window.Matter && pfRunner && !pfRunnerPaused){
      pfStopLoop();
      pfRunnerPaused = true;
    }

    // 物理世界的座標系跟視窗座標系是 1:1 對應（見 startPhotoFallEngine()
    // 的說明），直接拿 body 中心點反推「沒有旋轉」版本的矩形——這張照片
    // 當下多半帶著隨機的碰撞旋轉角度，getBoundingClientRect() 量到的會是
    // 旋轉後被撐大的外接矩形，飛行動畫的起點、尺寸都會偏大、偏移。角度
    // 本身另外用 angle 這個欄位原封不動帶過去，讓分身可以照著這個角度
    // 開始飛（而不是被拿掉旋轉資訊、變成憑空從水平開始）。
    const pfCenter = pfBoxCenter(info.body);
    const rect = {
      left: pfCenter.x - info.w / 2,
      top: pfCenter.y - info.h / 2,
      width: info.w,
      height: info.h,
      angle: info.body.angle,
    };

    openDetail(index, imgEl, rect);
  }

  // ---------- 單擊觸發：換一批隨機照片，e 卡在網頁邊界，不回首頁 ----------
  // 整體流程：拿掉共用地板（跟 exitPhotoFallMode() 一樣，讓目前這批舊
  // 照片一路掉出畫面），但額外給飄動的 e 一個只有它自己會撞到的專屬
  // 地板（見上面 PF_CATEGORY_DVD / PF_CATEGORY_DVD_FLOOR 的說明），卡在
  // 網頁最下緣不讓它掉出去；等舊照片全部掉出畫面（或使用者放開手上還
  // 抓著的照片）之後，拿掉這塊專屬地板、換回一般共用地板，再呼叫
  // spawnFallingPhotos() 掉下新的一批（已經排除掉舊的這批，見
  // pickReshuffleBatch()）。全程都停留在 photoFallState==='active' 這個
  // 大狀態機底下（中途暫時標成 'reshuffling'，只用來擋掉這段期間又被
  // 連續單擊/雙擊打斷的情況），不會觸發回首頁那一整套收尾流程。
  // ---------- 單擊換批動畫進行中，使用者立刻又雙擊：以雙擊為準，直接
  // 無縫接續到收場流程 ----------
  // 換批（reshufflePhotoFallBatch()）進行到一半時，畫面上其實同時有
  // 兩件事在跑：舊的那批照片正在往下掉出畫面，飄動的 e 則被 pfDvdFloor
  // 這個「只擋 e、不擋照片」的專屬地板暫時撐住不動（見該地板宣告處的
  // 完整說明），等舊照片全部真的掉出畫面，finishReshuffleOldBatch() 才會
  // 把新一批照片放出來。這段期間如果直接呼叫一般的 exitPhotoFallMode()，
  // 會漏掉一件事：pfDvdFloor 完全不知道要被清掉，e 會繼續卡在那塊專屬
  // 地板上動彈不得——但 exitPhotoFallMode() 的「全部掉出畫面才收尾」
  // 判斷（checkAllOut()／triggerExitFallback()）裡，e 也算在必須掉出畫面
  // 的名單內，e 卡住不動就永遠不會被判定成「全部掉出畫面」，變成整個
  // 收場流程卡住、雙擊看起來像完全沒有反應——比原本「單純忽略這次雙擊」
  // 還更糟。
  // 修法：先把 pfDvdFloor 從物理世界移除（跟正常換批完成時
  // finishReshuffleOldBatch() 做的事完全一樣），讓 e 不再被那塊專屬地板
  // 撐住、恢復成跟其他照片一樣單純受重力控制，才呼叫 exitPhotoFallMode()。
  // exitPhotoFallMode() 沿用的 pfItems 陣列，這時候還是指向「舊的那批」
  // （新照片這時根本還沒被 spawnFallingPhotos() 真正建立出來，見
  // reshufflePhotoFallBatch() 內 oldItems 的說明）——呼叫下去的效果剛好
  // 就是「讓舊照片＋e 一起繼續往下掉出畫面，直接跳過新的那一批，收場
  // 回首頁」，感覺是雙擊立刻接手、無縫接續，不會有任何停頓或卡住。
  function interruptReshuffleForExit(){
    const Matter = window.Matter;
    if(Matter && pfEngine && pfDvdFloor){
      Matter.Composite.remove(pfEngine.world, pfDvdFloor);
      pfDvdFloor = null;
    }
    exitPhotoFallMode();
  }

  function reshufflePhotoFallBatch(){
    if(!pfEngine || photoFallState !== 'active') return;
    photoFallState = 'reshuffling';
    const Matter = window.Matter;
    const { Bodies, Composite } = Matter;

    if(pfGroundBody){ Composite.remove(pfEngine.world, pfGroundBody); pfGroundBody = null; }

    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const wallThickness = 200;
    pfDvdFloor = Bodies.rectangle(vw / 2, vh + wallThickness / 2, vw * 2, wallThickness, {
      isStatic: true,
      friction: 0.7,
      label: 'pfDvdFloor',
      collisionFilter: { category: PF_CATEGORY_DVD_FLOOR, mask: PF_CATEGORY_DVD }, // 只擋得住 e，見上面完整說明
    });
    Composite.add(pfEngine.world, pfDvdFloor);
    pfEngine.gravity.y = PHOTO_FALL_GRAVITY * PHOTO_FALL_EXIT_GRAVITY_SCALE;

    // 修正「按一下切換時掉落，照片會卡住沒有自動掉下去」的根本成因：
    // 上面 startPhotoFallEngine() 開了 enableSleeping:true（省效能用，見該處
    // 完整說明）——堆疊照片一旦完全靜止一小段時間，Matter.js 會讓它們的
    // body 進入「睡眠」狀態，睡著的 body 每一步物理計算（包含重力）整個被
    // 引擎跳過，只有被「還醒著」的 body 碰撞到才會自動醒過來。這裡只是
    // 拿掉地板、調高重力，對睡著的 body 完全沒有作用——它們不會自己感覺到
    // 「地板不見了」，只能等最上面幾張（原本還醒著、或先被喚醒）先掉下去、
    // 真的「撞」到它們才會醒，堆得越深、要等的碰撞鏈越長，使用者看到的就是
    // 「整批卡在原地不動」甚至「只有最上面幾張掉了，其餘完全沒反應」。
    // 這裡在拿掉地板的同一刻，明確把這一批全部叫醒（Matter.Sleeping.set），
    // 讓它們這一影格就一起開始受重力，不用等碰撞鏈慢慢傳遞過去。
    // 注意：這裡用 pfItems（不是下面才會宣告的 oldItems）——兩者這一刻
    // 指向同一個陣列，pfItems 要等 finishReshuffleOldBatch() 真正清乾淨
    // 舊照片之後才會被重新指派，此時此刻用哪一個變數名稱效果完全相同。
    if(Matter.Sleeping){
      pfItems.forEach(({ body }) => { Matter.Sleeping.set(body, false); });
    }

    // 注意：這裡「不能」馬上把 pfItems 清空——每一影格負責把物理世界的
    // 位置同步寫進畫面 transform 的 pfSyncHandler（見 startPhotoFallEngine()
    // 內的定義）讀的正是 pfItems 這個變數，若在舊照片還在掉落的當下就先
    // 清空，舊照片的物理 body 依然會繼續正常掉落（checkOldOut() 之後還是
    // 能正確偵測到它們掉出畫面），但畫面上的 DOM 元素會從這一刻起不再被
    // 更新位置，等於整批瞬間「凍結」在原地不動；等偵測到掉出畫面、
    // finishReshuffleOldBatch() 把它們的 DOM 元素移除時，使用者看到的就是
    // 「卡住不動，然後直接消失」，而不是預期中「一路掉出畫面」的動畫——
    // 這正是先前這個版本的成因。改成先保留 pfItems 原封不動（讓
    // pfSyncHandler 全程持續同步這批舊照片的位置），只用一個獨立變數
    // oldItems 指向同一個陣列，供下面 checkOldOut() 判斷「是否全部掉出
    // 畫面」用；真正的 pfItems = [] 清空動作，挪到 finishReshuffleOldBatch()
    // 裡——這批舊照片已經真的被移除乾淨、即將要塞入新一批之前才做，全程
    // 不會有「有 body 在物理世界裡卻沒有東西同步畫面」的空窗期。
    const oldItems = pfItems;

    // 提早選好「下一批」要換上的照片、立刻背景暖機（原因、機制見
    // warmFallBatch() 旁的說明）：這裡到真正 spawnFallingPhotos() 之間，
    // 還有「等這批舊照片全部掉出畫面」這段時間可以利用（通常有好幾百
    // 毫秒、最多到 PHOTO_FALL_EXIT_MAX_WAIT_MS 保底逾時），足夠讓新照片
    // 的縮圖提前準備好。注意這裡只能算一次、之後全程沿用同一份結果——
    // pickReshuffleBatch() 內部有隨機洗牌，若之後收尾時（見
    // finishReshuffleOldBatch()）重新呼叫一次，會洗出完全不同的另一批，
    // 跟這裡已經暖好的那批對不起來，暖機就白做了。
    // ---------- 多留一個名額給「下一批」專屬的飄動物件 ----------
    // 使用者反應：單擊換一批之後，原本從首頁進來的飄動物件（e）應該要
    // 繼續留在畫面上，而且從這一批開始，飄動物件本身也該是這批新照片
    // 裡真正的一張，不是一路沿用舊圖、跟這批新照片完全無關的另一個
    // 獨立東西。這裡多要一張（+1），第 0 個名額固定保留給下面
    // finishReshuffleOldBatch() 內的 promoteBatchPhotoToDvd()：那一張
    // 不會被 spawnFallingPhotos() 當一般照片摔下去，而是直接接手成為
    // 飄動物件顯示的圖案／碰撞形狀，其餘 photoFallCount() 張才是真正
    // 掉落堆疊的一般照片，兩邊內容互斥、不會重複。
    const nextBatch = pickReshuffleBatch(photoFallCount() + 1);
    const nextWarm = warmFallBatch(nextBatch); // { promise, cache }——原因同 enterPhotoFallMode()，spawn 時機不等它，只借用 cache 裡已經暖好的 Image 元素（現在也包含保留給飄動物件用的那一張，一併預熱）

    // 修正：checkOldOut()（80ms 輪詢）跟下面 triggerReshuffleFallback()
    // （1700ms 保底逾時）是兩條各自獨立的計時器鏈，理論上都可能觀察到
    // 「這一批舊照片已經全部掉出畫面」而各自嘗試收尾。原本只有 checkOldOut()
    // 那邊在判定完成時會把兩個計時器都清掉，triggerReshuffleFallback() 那邊
    // 收尾時卻忘了順手清掉還在跑的 pfExitPollTimer——只要舊照片掉出畫面的
    // 時間點剛好接近 1700ms 那個保底逾時，兩條路徑就可能前後腳都判定完成、
    // 各自呼叫一次 finishReshuffleOldBatch(oldItems)：第一次呼叫已經把
    // pfItems 清空、spawn 出新的一批，緊接著第二次呼叫又把 pfItems 清空一次
    // （新照片瞬間失去位置同步、凍結在原地不動）、再疊加 spawn 一次——這正是
    // 「單擊換批後畫面卡住、疊出多餘照片」的成因。改用 settleOnce() 包一層，
    // 用旗標保證同一輪換批的收尾動作只會真正執行一次，不管是哪條路徑先
    // 判定完成。
    let reshuffleSettled = false;
    const settleOnce = () => {
      if(reshuffleSettled) return;
      reshuffleSettled = true;
      clearTimeout(pfExitFallbackTimer);
      clearTimeout(pfExitPollTimer);
      finishReshuffleOldBatch(oldItems, nextBatch, nextWarm.cache);
    };

    const checkOldOut = () => {
      const allOut = oldItems.every(({ body, h }) => pfBoxCenter(body).y - h / 2 > vh + 40);
      if(allOut){
        settleOnce();
      } else {
        pfExitPollTimer = setTimeout(checkOldOut, 80);
      }
    };
    clearTimeout(pfExitFallbackTimer);
    clearTimeout(pfExitPollTimer);
    // 跟 exitPhotoFallMode() 同樣的保底邏輯（見該處完整說明）：使用者這
    // 一刻可能正抓著某張「舊」照片懸在半空還沒放開，不能強制清掉這一批、
    // 提早讓新照片掉下來，要等放手之後才繼續。這裡直接複用同一組
    // pfExitFallbackTimer / pfExitPollTimer 變數——跟真正的
    // exitPhotoFallMode() 不會同時發生（兩者都要求 photoFallState 是
    // 'active' 才能啟動，啟動當下都會立刻改成別的狀態，互相排斥），共用
    // 沒有衝突風險。
    //
    // 修正：這裡原本只要「使用者沒有正在拖曳」就會強制收尾，完全不管
    // oldItems 是不是真的已經全部掉出畫面——這正是「單擊換批時，只要有
    // 一張照片剛好卡在半空中飛久一點（起始位置較高、跟其他照片或牆壁多
    // 彈了幾下）超過 1700ms，就會被保底逾時提早打斷、整批（含還沒掉出
    // 視窗的那幾張）直接從畫面上移除」的成因，看起來像照片卡住之後憑空
    // 消失，而不是使用者要的「一定要等這一批全部真的掉出視窗，下一批才
    // 會從上面掉下來」。
    // 改成這裡也重新檢查一次 allOut：只要還有照片沒掉出視窗（不管使用者
    // 是不是正在拖曳），一律不收尾、把保底逾時繼續往後延，讓 checkOldOut()
    // 的輪詢有機會等到它們真正掉出去再收尾。這個計時器因此退回原本設計的
    // 本意——單純當作「萬一輪詢那條路徑意外沒被觸發」的備援，而不是一個
    // 會提早打斷掉落動畫、讓照片憑空消失的強制關卡。
    const triggerReshuffleFallback = () => {
      const allOut = oldItems.every(({ body, h }) => pfBoxCenter(body).y - h / 2 > vh + 40);
      if(pfDragging || !allOut){
        pfExitFallbackTimer = setTimeout(triggerReshuffleFallback, PHOTO_FALL_EXIT_MAX_WAIT_MS);
        return;
      }
      settleOnce();
    };
    pfExitFallbackTimer = setTimeout(triggerReshuffleFallback, PHOTO_FALL_EXIT_MAX_WAIT_MS);
    pfExitPollTimer = setTimeout(checkOldOut, 80);
  }

  // 換批的收尾：清掉舊照片、把地板還給一般樣式，讓新的一批掉下來
  // nextBatch：reshufflePhotoFallBatch() 一開始就選好、也已經提前暖機過的
  // 下一批照片（見該處 pickReshuffleBatch() 呼叫旁的說明）。這裡直接沿用
  // 同一份結果傳給 spawnFallingPhotos()，不再重新呼叫 pickReshuffleBatch()
  // 重算一次——重算會洗出不同的隨機組合，等於讓前面辛苦提前暖好的那批
  // 白暖，新照片又會回到「掉下來才臨時載入」的空白狀態。
  // nextWarmCache：pickReshuffleBatch() 選好新一批的同時就立刻呼叫的
  // warmFallBatch() 所回傳的 cache（url → 已經暖好的 Image 元素，見上面
  // 呼叫端與 warmFallBatch() 內的完整說明）。這裡清乾淨舊照片、重建地板
  // 之後就立刻呼叫 spawnFallingPhotos()，不等任何 Promise、不拖慢換批的
  // 節奏——真正解決「空白方塊」的方法是把這個 cache 傳給
  // spawnFallingPhotos()，讓它對每一張照片先查有沒有已經暖好的版本可以
  // 直接用，而不是靠延後整批的出場時間去換。
  // ---------- 換批時：讓新一批裡的其中一張圖片接手成為「飄動物件」本身 ----------
  // 修正「單擊換一批 png 圖片之後，原本從首頁進來的飄動物件掉下去了」：
  // 飄動的 e 這顆物理 body 其實全程都沒有離開過畫面（見上面 pfDvdFloor
  // 的完整說明，換批期間它一直穩穩待在專屬地板上、不會跟著舊照片一起
  // 掉出去），但它顯示的圖案原本從頭到尾都是同一張（雙擊進場那一刻，
  // 首頁飄動物件當下正在顯示的那張），完全不會隨著每次換批更新——這裡
  // 改成每次換批，都讓 reshufflePhotoFallBatch() 多留給飄動物件的那一張
  // （見該處、以及 finishReshuffleOldBatch() 內 dvdPhoto 的完整說明）
  // 接手，讓「每一批 png 都有一個飄動物件在裡面」，而不是飄動物件遊離在
  // 這批新照片之外、感覺像是另一個不相干的東西。
  //
  // 作法：先讀出目前這顆 body 的中心點座標、旋轉角度（跟其他掉落照片
  // 換批時一樣，全程停在原地，不會有瞬間跳位），把舊 body 從物理世界
  // 移除、pfDvdItem 先設回 null（pfSyncHandler 已經有 null 檢查，這段
  // 空窗期最多一格畫面，不會出錯），再呼叫 setDvdBounceImageSrc() 把
  // 畫面上看得見的 <img> 換成新圖案——這個函式內部本來就會先在畫面外
  // decode 完成才真正套用（見該函式旁「無縫直接切換」的完整說明），這裡
  // 傳進來的 photo 早就被 warmFallBatch() 預熱過，幾乎必定立即 resolve。
  // 圖片真正套用、measureDvdSize() 量出新的 dvdW/dvdH 之後，才用
  // buildFallItemBody()（跟其他掉落照片、e 進場落下用的是同一套邏輯）
  // 在剛剛記錄的同一個座標、同一個角度重建一顆貼合新圖案形狀的物理
  // body，視覺上就是「原本那個飄動物件，身上的圖案換成了新一批裡的
  // 某一張」，不是憑空多一個、也不會被新照片取代掉。
  // 這裡完全不用另外處理「按 Preview 之後，飄動物件要在當下位置直接
  // 變成 preview 頁飄動規則飄起來」這件事——dvdBounce／dvdActiveImgSrc
  // 從頭到尾都是全站共用同一份（見 resumeDvdFloatAfterPhotoFallCover()
  // 的完整說明，恢復飄動時本來就是直接沿用「凍結那一刻」的座標、跟
  // 目前顯示中的圖案），這裡只是換了它現在顯示、碰撞用的是哪一張圖，
  // 進到 preview 頁時自然就是「這張換上來的新圖，從它當下的位置」開始
  // 飄動，不需要另外銜接。
  function promoteBatchPhotoToDvd(photo){
    if(!photo || !photo.src) return;
    const Matter = window.Matter;
    let centerX = null, centerY = null, angle = 0;
    if(Matter && pfEngine && pfDvdItem){
      const c = pfBoxCenter(pfDvdItem.body);
      centerX = c.x; centerY = c.y; angle = pfDvdItem.body.angle;
      Matter.Composite.remove(pfEngine.world, pfDvdItem.body);
    }
    pfDvdItem = null;
    const mySpawnGeneration = pfSpawnGeneration; // 沿用跟 spawnFallingPhotos() 一樣的世代比對，避免下面 decode 完成時，其實已經是另一輪換批或整個堆疊模式都結束了
    setDvdBounceImageSrc(photo.src, photo.scale).then(() => {
      const M = window.Matter;
      // 保險：decode 這段期間，使用者可能已經雙擊收掉整個堆疊模式
      // （pfEngine 被清空），或是又緊接著點了下一次換批（世代不對）——
      // 兩種情況都不該再把這顆遲到的 body 加進一個已經作廢的物理世界。
      if(!M || !pfEngine || pfSpawnGeneration !== mySpawnGeneration) return;
      measureDvdSize();
      const cx = centerX !== null ? centerX : (dvdX + dvdW / 2);
      const cy = centerY !== null ? centerY : (dvdY + dvdH / 2);
      const dvdMaskEntry = getCachedAlphaMask(photo.src);
      const dvdBody = buildFallItemBody(M, dvdMaskEntry, cx, cy, dvdW, dvdH, {
        angle,
        restitution: 0.3, // 跟其他掉落照片／e 進場落下用同一組手感參數，見 startPhotoFallEngine() 內同一段的完整說明
        friction: 0.55,
        frictionAir: 0.012,
        density: 0.0026,
        collisionFilter: { category: PF_CATEGORY_DVD }, // 見 startPhotoFallEngine() 內同一個屬性的完整說明
      });
      M.Composite.add(pfEngine.world, dvdBody);
      pfDvdItem = { body: dvdBody, w: dvdW, h: dvdH };
      dvdBounce.style.transition = 'none';
      if(M.Sleeping) M.Sleeping.set(dvdBody, false); // 保險：確保新 body 從這一影格就正常受重力／碰撞影響，不會意外一開始就被引擎判定成睡眠
    });
  }

  function finishReshuffleOldBatch(oldItems, nextBatch, nextWarmCache){
    const Matter = window.Matter;
    if(Matter && pfEngine){
      const { Composite } = Matter;
      oldItems.forEach(({ body, el }) => {
        Composite.remove(pfEngine.world, body);
        if(el && el.parentNode) el.parentNode.removeChild(el);
      });
      if(pfDvdFloor){ Composite.remove(pfEngine.world, pfDvdFloor); pfDvdFloor = null; }
    }

    if(!pfEngine){
      // 保險：清理這批舊照片的過程中，使用者可能已經用雙擊把整個堆疊
      // 模式關掉了（exitPhotoFallMode()／finishExitPhotoFallMode() 已經
      // 把 pfEngine 設回 null）——這種情況下不用再換新照片，狀態機也已經
      // 被 finishExitPhotoFallMode() 收尾成 'idle'，這裡不用重複處理。
      return;
    }

    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const wallThickness = 200;
    pfGroundBody = Matter.Bodies.rectangle(vw / 2, vh + wallThickness / 2, vw * 2, wallThickness, { isStatic: true, label: 'pfGround', friction: 0.7 });
    Matter.Composite.add(pfEngine.world, pfGroundBody);
    pfEngine.gravity.y = PHOTO_FALL_GRAVITY;

    // 舊的這一批這時已經真的從物理世界／畫面上移除乾淨了，這裡才把
    // pfItems 清空——清空之後緊接著呼叫 spawnFallingPhotos()，新照片會
    // 一張一張 push 進這個乾淨的陣列，pfSyncHandler 從下一影格開始同步
    // 的就是新的這一批，不會有任何一刻是「陣列已經空了，但舊照片其實
    // 還沒清乾淨」的空窗期。
    pfItems = [];

    photoFallState = 'active';

    // ---------- 這批（nextBatch）第 0 個名額保留給飄動物件本身 ----------
    // 呼叫端 reshufflePhotoFallBatch() 已經多要了一張（見該處呼叫
    // pickReshuffleBatch() 旁的完整說明），這裡把它切成兩份：dvdPhoto
    // （第 0 個，接手變成飄動物件顯示的圖案）跟 ordinaryBatch（其餘才是
    // 真正掉落堆疊的一般照片，張數剛好等於 photoFallCount()，不會有
    // spawnFallingPhotos() 內部拿不滿、要靠 % 循環重複取用的情況）。
    const dvdPhoto = nextBatch && nextBatch.length ? nextBatch[0] : null;
    const ordinaryBatch = nextBatch && nextBatch.length > 1 ? nextBatch.slice(1) : [];
    spawnFallingPhotos(ordinaryBatch, nextWarmCache);
    // spawnFallingPhotos() 剛剛已經把 pfLastBatchUrls 覆寫成 ordinaryBatch
    // 這些 url——這裡把保留給飄動物件的這張也一併補進去，下一輪
    // pickReshuffleBatch() 才會知道這張最近才剛用過，不會馬上又選到
    // 一模一樣的圖案當下一批的飄動物件或掉落照片。
    if(dvdPhoto){
      promoteBatchPhotoToDvd(dvdPhoto);
      if(dvdPhoto.src) pfLastBatchUrls.add(dvdPhoto.src);
    }
  }

  // ---------- 收場：拿掉地板，所有照片＋e 一路物理掉出畫面下緣，回到首頁 ----------
  function exitPhotoFallMode(){
    if(!pfEngine) return;
    photoFallState = 'exiting';
    const Matter = window.Matter;
    const { Composite } = Matter;

    // 「像網頁下面突然沒邊界一樣」：只拿掉地板，左右牆留著，掉落過程維持
    // 在畫面寬度內垂直掉出，不會東飄西飄失控亂噴。
    if(pfGroundBody){ Composite.remove(pfEngine.world, pfGroundBody); pfGroundBody = null; }
    pfEngine.gravity.y = PHOTO_FALL_GRAVITY * PHOTO_FALL_EXIT_GRAVITY_SCALE;

    // 修正「掉落的照片有點不順暢，有時候會停住一下才掉下去」的其中一個
    // 成因：跟 reshufflePhotoFallBatch() 同一個道理（見該處完整說明）——
    // 已經堆好、靜止一陣子的照片會因為 enableSleeping:true 而睡著，拿掉
    // 地板／調高重力對睡著的 body 不會有任何作用，只能等醒著的 body（通常
    // 是最上面那幾張）掉下去、真的撞到才會一張一張醒過來，形成「一部分先
    // 掉、其餘停頓一下才跟著掉」的不順暢感。這裡在拿掉地板的同一刻，明確
    // 把整批（含飄動的 e）都叫醒，讓大家從同一影格開始一起真正受重力。
    if(Matter.Sleeping){
      pfItems.forEach(({ body }) => { Matter.Sleeping.set(body, false); });
      if(pfDvdItem) Matter.Sleeping.set(pfDvdItem.body, false);
    }

    const vh = window.innerHeight;
    const checkAllOut = () => {
      const allOut = pfItems.every(({ body, h }) => pfBoxCenter(body).y - h / 2 > vh + 40)
        && (!pfDvdItem || pfBoxCenter(pfDvdItem.body).y - pfDvdItem.h / 2 > vh + 40);
      if(allOut){
        clearTimeout(pfExitFallbackTimer);
        clearTimeout(pfExitPollTimer);
        finishExitPhotoFallMode();
      } else {
        pfExitPollTimer = setTimeout(checkAllOut, 80);
      }
    };
    // 保底逾時跟輪詢兩個計時器分開存放各自的變數，不能共用同一個——原本
    // 兩者共用 pfExitWatchTimer 一個變數，輪詢迴圈每次重新排程時會把這個
    // 變數「覆寫」成輪詢自己最新一次的計時器 ID，等於把最一開始設定好的
    // 保底逾時計時器 ID 弄丟了。等真的偵測到「全部掉出畫面」、呼叫
    // clearTimeout(pfExitWatchTimer) 時，清掉的其實是輪詢自己的計時器，
    // 保底逾時那個從頭到尾沒被清掉，會在原訂的 1700ms 準時觸發，第二次
    // 呼叫 finishExitPhotoFallMode()——而 pfFinished 這個防重複旗標在第一
    // 次收尾流程最後又被重設回 false（是設計給「下一輪」堆疊模式重新使用
    // 的），沒能擋下這第二次呼叫，導致首頁縮圖／編號的放大進場動畫被多播
    // 一次，也就是「回到首頁時縮放出場多了一次」的成因。分成兩個變數後，
    // 不管是「輪詢偵測到全部掉出畫面」還是「保底逾時」哪一條路徑先觸發，
    // 都會把另一條路徑的計時器一併清掉，確保 finishExitPhotoFallMode()
    // 只會被呼叫一次。
    clearTimeout(pfExitFallbackTimer);
    clearTimeout(pfExitPollTimer);
    // 保底逾時觸發時，如果使用者這一刻正抓著一張照片（或飄動的 e）懸在
    // 半空還沒放開（pfDragging，見該旗標的完整說明），不能直接強制收尾、
    // 把畫面推進到下一步——那樣會變成照片還吊在使用者手指/游標底下、
    // 畫面卻已經跳走的突兀狀態。這種情況下改成把保底逾時重新排程、繼續
    // 往後延，直到使用者真的放手為止；一旦放手，該張照片會照正常物理
    // 掉落，之後不管是輪詢偵測到全部掉出畫面、還是下一次保底逾時觸發，
    // 都會正常收尾，不會無限期卡住（使用者放手後最多只會再多等一次
    // 1700ms，不是真的卡死）。
    // 修正：跟 reshufflePhotoFallBatch() 裡 triggerReshuffleFallback() 同一個
    // 問題（見該處完整說明）——原本只要沒在拖曳就強制收尾，不管照片是不是
    // 真的已經全部掉出畫面，會讓卡在半空久一點的照片被提早清掉、憑空消失。
    // 這裡同樣補上 allOut 檢查，只有真的全部掉出畫面（或使用者放手後
    // checkAllOut 輪詢先偵測到）才收尾，其餘情況一律繼續往後延。
    const triggerExitFallback = () => {
      const allOut = pfItems.every(({ body, h }) => pfBoxCenter(body).y - h / 2 > vh + 40)
        && (!pfDvdItem || pfBoxCenter(pfDvdItem.body).y - pfDvdItem.h / 2 > vh + 40);
      if(pfDragging || !allOut){
        pfExitFallbackTimer = setTimeout(triggerExitFallback, PHOTO_FALL_EXIT_MAX_WAIT_MS);
        return;
      }
      finishExitPhotoFallMode();
    };
    pfExitFallbackTimer = setTimeout(triggerExitFallback, PHOTO_FALL_EXIT_MAX_WAIT_MS); // 保底逾時
    pfExitPollTimer = setTimeout(checkAllOut, 80);
  }

  // 使用者可能在雙擊收起堆疊（exitPhotoFallMode() 進入 'exiting'）之後、
  // 整批照片還沒真正掉出畫面前，緊接著又按了 Preview——這種情況下堆疊的
  // 收場流程會在 preview 蓋住畫面的這段時間裡自己跑完，這裡（見下面
  // finishExitPhotoFallMode()）就已經把首頁縮圖放大進場的動畫播過一次，
  // 只是使用者當下被完全不透明的 preview 蓋住看不到。等使用者之後關閉
  // preview 時，closePreviewPage() 原本會依「這次是不是從堆疊模式打開的」
  // 再判斷一次要不要播放首頁進場動畫——如果不知道這裡已經播過一次，會
  // 重複再播一次，讓使用者看到縮圖「已經正常顯示，卻忽然又縮小消失、
  // 重新放大」的多餘閃爍。這個旗標讓 closePreviewPage() 知道「這次不用
  // 再播一次」，用一次就消耗掉（見該處說明），不影響下一次真正需要播放
  // 的時機。
  let photoFallGridAlreadyRevealed = false;

  let pfFinished = false;
  function finishExitPhotoFallMode(){
