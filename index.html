    // 照片物理堆疊模式期間（entering/active/exiting），完全不要跑這套舊版
    // 手動拖曳邏輯：直接 return，讓這次 pointerdown 原生地繼續往下傳給
    // #photoFallStage，交給 Matter.Mouse／MouseConstraint 接手判斷「抓到
    // 的是飄動的 e 還是某張照片」、以及拖曳中途的物理碰撞。
    //
    // 這是「拖曳飄動的 e、卻跟照片完全沒有物理互動，一放開又馬上飄走」
    // 的根本成因：這個函式原本不分模式一律搶著跑——一進來就呼叫
    // e.preventDefault()，等於直接吃掉這次 pointerdown，瀏覽器後續不會
    // 再補發 Matter.Mouse 賴以判斷「使用者按下了滑鼠」的原生 mousedown，
    // Matter 那邊從頭到尾沒收到任何抓取事件；同時這裡自己接管的
    // dvdPointerMove() 又是直接、逐次改寫 dvdBounce.style.transform（只
    // 跟視窗邊界比對，完全不知道 Matter 物理世界裡其他照片在哪），跟物理
    // 引擎每影格的位置同步（見 pfSyncHandler）同時搶著寫同一個 transform；
    // 放開時 dvdPointerUp() 更進一步把 dvdRAF 重新指回舊版 stepDvdBounce()
    // 飄動迴圈——等於「表面上還在堆疊模式，實際上舊版飄動系統已經在背後
    // 重新接管」，這正是放開瞬間立刻飄走、且全程沒有一絲物理碰撞感的
    // 由來。加這一行 guard 之後，拖曳／放開的所有手感（含物理碰撞、堆疊、
    // 放開後的動量）完全交給 Matter 這一套系統，不會再有兩套邏輯互搶。
    //
    // 這裡不能只看 photoFallModeActive：從堆疊模式按 Preview 進來、等
    // preview 的照片蓋滿畫面之後，飄動的 e 會脫離物理世界、恢復成一般
    // 飄動狀態（見 resumeDvdFloatAfterPhotoFallCover()），這時 pfDvdItem
    // 會變成 null，但 photoFallModeActive 仍然是 true（整段堆疊模式其實
    // 還沒真正結束，只是被 preview 蓋住、暫停而已）——如果這裡還是只看
    // photoFallModeActive，會誤判成「還在堆疊模式」而繼續擋掉這次
    // pointerdown，變成「在 preview 頁飄動的 e 沒辦法用滑鼠/觸控抓取」。
    // 改成同時檢查 pfDvdItem：只有 e 真的還在 Matter 物理世界裡（還沒被
    // 放開接管）才需要讓開給 Matter.Mouse 處理；一旦 e 已經脫離物理世界
    // （pfDvdItem 是 null），不管 photoFallModeActive 是不是還留著 true，
    // 都應該正常走這套一般的拖曳邏輯。
    if(photoFallModeActive && pfDvdItem) return;
    e.preventDefault();
    if(dvdRAF){ cancelAnimationFrame(dvdRAF); dvdRAF = null; }
    dvdLastTime = null;
    dvdDragging = true;
    dvdBounce.classList.add('dvd-grabbing'); // 觸發內層圖片的縮小 transition（見上面 CSS 說明）
    dvdEscaping = false; // 抓取當下若剛好正在滑出動畫途中，直接取消，位置維持抓取的當下值即可
    dvdPointerId = e.pointerId;
    try{ dvdBounce.setPointerCapture(e.pointerId); }catch(err){}

    const rect = dvdBounce.getBoundingClientRect();
    dvdGrabOffsetX = e.clientX - rect.left;
    dvdGrabOffsetY = e.clientY - rect.top;
    dvdX = rect.left;
    dvdY = rect.top;
    dvdMoveSamples = [{ t: performance.now(), x: dvdX, y: dvdY }];
    dvdBounce.style.transform = `translate(${dvdX}px, ${dvdY}px)`;
  }

  // ⚠️ 保護區段開始：dvdPointerMove() + dvdPointerUp() 裡的末速度計算，
  // 已經跟使用者確認過是正確、要保留的行為，其他需求不要順手改到這裡
  // （細節見上面 DVD_FLING_WINDOW_MS 那段常數註解的說明）。
  function dvdPointerMove(e){
    if(!dvdDragging || e.pointerId !== dvdPointerId) return;
    e.preventDefault();
    const minX = dvdBoundMinX(), minY = dvdBoundMinY();
    const maxX = dvdBoundMaxX(), maxY = dvdBoundMaxY();
    dvdX = clampDvd(e.clientX - dvdGrabOffsetX, minX, maxX);
    dvdY = clampDvd(e.clientY - dvdGrabOffsetY, minY, maxY);
    dvdBounce.style.transform = `translate(${dvdX}px, ${dvdY}px)`;

    const now = performance.now();
    dvdMoveSamples.push({ t: now, x: dvdX, y: dvdY });
    // 只留最近 ~DVD_FLING_WINDOW_MS 的取樣：這裡的裁切是相對「這一次
    // pointermove 觸發的時間」回推，只是先做初步瘦身、避免長時間拖曳時
    // 陣列無限長大；真正決定「放開那一刻算出來的末速度」的裁切，改成在
    // dvdPointerUp() 裡相對「放開當下」重新做一次（見該處說明），這裡
    // 不需要做到跟那邊完全一致。
    while(dvdMoveSamples.length > 2 && now - dvdMoveSamples[0].t > DVD_FLING_WINDOW_MS){
      dvdMoveSamples.shift();
    }
  }

  function dvdPointerUp(e){
    if(!dvdDragging || e.pointerId !== dvdPointerId) return;
    dvdDragging = false;
    dvdBounce.classList.remove('dvd-grabbing'); // 放開，觸發同一段 transition 平滑放大回原尺寸
    try{ dvdBounce.releasePointerCapture(e.pointerId); }catch(err){}

    const now = performance.now();

    // ---- 更精確地算出「放開那一刻」的末速度 ----
    // 舊算法：直接拿 dvdMoveSamples 裡最舊、最新兩筆算 (last.x-first.x)/(now-first.t)。
    // 問題出在「快速拖曳→停住→瞬間放開」這個情境：使用者停住之後、真正
    // 放開之前，座標完全沒變，瀏覽器根本不會再送出新的 pointermove 事件，
    // 所以 dvdMoveSamples 裡最新的那一筆，其實還停在「停住之前」那一瞬間
    // 的高速移動上，沒有任何一筆資料反映「已經停住」這段時間——分母雖然
    // 因為 now（放開當下）變大而拉長，但分子（位移）沒有跟著變小，算出
    // 來的還是一個接近停下來前的高速平均值，跟使用者放開當下「其實已經
    // 靜止」的真實狀態完全對不上，這正是「明明已經停住、放開卻還是被
    // 噴出去」的成因。
    //
    // 修法：放開的當下，先把「這一刻」的位置也補進取樣（座標就是目前的
    // dvdX/dvdY——如果使用者真的沒在動，這個座標會跟最後一筆移動紀錄
    // 完全相同），再用 DVD_FLING_WINDOW_MS 這個窗口、相對「放開當下」
    // （而不是相對上一次真的觸發 pointermove 的時間）重新裁掉太舊的取樣。
    // 這樣不管停住多久才放開：停住時間一旦超過這個窗口，窗口內就只剩下
    // 「停住期間、位置沒有變化」的取樣，頭尾位置相同，算出來的速度自然
    // 趨近 0；停住時間很短、還在窗口內的話，會混到一些停住前的移動取樣，
    // 算出來的是那段「正在減速中」的真實平均速度，一樣合理，不會低估
    // 真正快速甩出去的情況。
    dvdMoveSamples.push({ t: now, x: dvdX, y: dvdY });
    while(dvdMoveSamples.length > 1 && now - dvdMoveSamples[0].t > DVD_FLING_WINDOW_MS){
      dvdMoveSamples.shift();
    }

    const first = dvdMoveSamples[0];
    const last = dvdMoveSamples[dvdMoveSamples.length - 1]; // 就是剛剛補上的「放開當下」那一筆
    // 分母不再套一個 16ms 的下限：那個下限是為了避免除以 0，但套在真正
    // 「幾乎同時按下又放開」的瞬間點擊上，會把本來就該趨近 0 的速度硬是
    // 稀釋成一個非零值。改成只用一個極小的 1ms 地板單純防止除以 0，
    // 窗口內如果只剩下這一筆「放開當下」的取樣（first === last，位移為
    // 0），算出來的速度自然就是精準的 0，不需要另外特判。
    const dt = Math.max(1, last.t - first.t) / 1000;
    let vx = (last.x - first.x) / dt;
    let vy = (last.y - first.y) / dt;
    let flingSpeed = Math.hypot(vx, vy);

    // 有偵測到方向才更新方向；幾乎沒有移動（flingSpeed 趨近 0）就維持原本
    // 抓取前的方向不變，反正接下來速度也趨近 0，方向本來就看不太出來
    if(flingSpeed > 0.5) setDvdDirection(Math.atan2(vy, vx));

    // 甩出去的速度規則：只有「甩得比定速快」才需要自動修正——放開後從
    // 當下的高速開始，慢慢地（DVD_DECAY_MS，很長、很細膩）衰減回定速，
    // 這是原本就要的「回穩」效果，維持不變。
    // 「甩得比定速慢」（含幾乎沒動、原地放開）則完全不做任何自動修正：
    // 直接照偵測到的速度繼續飄，不會被拉回定速——這才是這顆彈跳字原本
    // 設計要的規則，«低於定速就照偵測到的速度跑»，不管那個速度有多慢。
    // dvdDecaying 只在「高於定速」這個分支打開，之後的每一影格
    // （stepDvdBounce 裡的 if(dvdDecaying)）才會去跑那段朝定速收斂的
    // 指數衰減；低於定速時 dvdDecaying 維持 false，dvdSpeed 就照這裡
    // 設定的偵測值一路用下去，不會再被任何邏輯動態調整。
    dvdSpeed = flingSpeed;
    if(flingSpeed > DVD_SPEED){
      dvdDecaying = true;
      dvdDecayStartTime = now;
      dvdDecayStartSpeed = flingSpeed;
      dvdDecayDurationMs = DVD_DECAY_MS;
    } else {
      dvdDecaying = false;
    }
    dvdWasCollidedLastFrame = false; // 放開的瞬間視為全新一輪，即使正好放在邊界上也能正確判斷成一次新的撞牆
    dvdWasScreenEdgeCollidedLastFrame = false;

    dvdLastTime = null;
    if(!dvdRAF) dvdRAF = requestAnimationFrame(stepDvdBounce);
  }
  // ⚠️ 保護區段結束（見 dvdPointerMove 前面的說明）。

  dvdBounce.addEventListener('pointermove', dvdPointerMove);
  dvdBounce.addEventListener('pointerup', dvdPointerUp);
  dvdBounce.addEventListener('pointercancel', dvdPointerUp);
  // 額外保險：桌機／平板用滑鼠拖曳時，比手機觸控更容易發生「放開的那一刻
  // 事件根本沒送達」的情況——例如把滑鼠拖出瀏覽器視窗範圍外才放開按鍵、
  // 切換分頁／視窗（alt-tab）、或瀏覽器基於某些理由自己收回了 pointer
  // capture。手機觸控天生被螢幕邊界約束住，手指不可能滑出「畫面」之外，
  // 這一類事件從頭到尾都會確實送達，所以原本只綁 pointerup/pointercancel
  // 在手機上幾乎不會出事；但桌機滑鼠一旦真的發生這種情況，dvdPointerUp()
  // 永遠不會被呼叫，dvdDragging 就會卡在 true、stepDvdBounce() 每一幀都會
  // 因為「if(dvdDragging){ dvdRAF=null; return; }」直接跳過，等於整個動畫
  // 迴圈被永久卡住——這也是「桌機/平板飄動的 e 完全不動」的另一個可能
  // 成因，這裡額外多接住這兩種情況、視同放開處理，確保不會卡死：
  //   1) lostpointercapture：瀏覽器自己收回了 capture（不管是什麼原因）
  //   2) 分頁/視窗失去焦點（blur）：使用者切走了，理論上滑鼠按鍵狀態
  //      已經跟目前的頁面無關，一律當作已經放開處理
  dvdBounce.addEventListener('lostpointercapture', (e) => {
    if(dvdDragging) dvdPointerUp(e);
  });
  window.addEventListener('blur', () => {
    if(dvdDragging) dvdPointerUp({ pointerId: dvdPointerId });
  });
  // pointerdown 不再直接綁在 dvdBounce 上——這個元素現在是 pointer-events:none
  // （見上面 CSS 的說明），本來就不會是任何事件的 hit-test 目標，綁了也不會
  // 觸發。改成在 window 這一層，用「當下實際渲染出來的矩形範圍」跟按下的
  // 座標比對：落在範圍內才視為抓住了飄動字，其餘一律放行，讓事件正常往下
  // 傳給底下真正被點到的照片／頁面元素。
  // pointermove / pointerup / pointercancel 維持原本綁在 dvdBounce 本身：
  // dvdPointerDown 裡呼叫的 setPointerCapture() 會讓同一個 pointerId 之後的
  // 事件全部直接指定送給這個元素，不再經過一般的 hit-test，所以 pointer-events
  // 就算是 none，只要曾經被 capture 過，後續 move/up/cancel 依然收得到。
  //
  // 使用者回報：飄動字在移動中時很難準確按到/點到，範圍太貼合圖形本身、
  // 沒有留任何容錯空間。原本 .dvd-bounce 的 CSS padding 就是 0（見上面
  // CSS 該處註解：故意拿掉，讓「撞牆物理」用的矩形精準貼合圖形邊緣，
  // 這件事不能改，改了牆壁碰撞的判定範圍也會跟著跑掉），所以不能直接在
  // CSS 上加大這個元素的框——這裡改成只在「判斷這一下有沒有抓到飄動字」
  // 這件事情上，用一個額外的容錯 padding 往外擴一圈虛擬熱區，不影響
  // dvdBounce 元素本身的實際大小、也不影響撞牆物理算的矩形（那邊還是另外
  // 各自呼叫 getBoundingClientRect() 量到原本大小）。
  // 觸控（手指）本來就比滑鼠游標準度低，容錯留寬一點；滑鼠是精準指標，
  // 容錯可以窄一些，兩邊都各自「稍微放大一點點」，不要放太多以免不小心
  // 蓋到旁邊的縮圖、影響照片本身的點擊／hover。
  const DVD_GRAB_PADDING_DESKTOP = 16; // px，桌機滑鼠額外可命中的邊界寬度
  const DVD_GRAB_PADDING_TOUCH = 26;   // px，觸控手指額外可命中的邊界寬度（比滑鼠寬一些）
  function dvdHitTest(rect, x, y, padding){
    return !(x < rect.left - padding || x > rect.right + padding || y < rect.top - padding || y > rect.bottom + padding);
  }
  // 手機觸控版修正：.dvd-bounce 本身是 pointer-events:none（見上面 CSS
  // 該處的完整說明），所以手指實際落下時，瀏覽器 hit-test 抓到的一路都是
  // 「底下」那個真正可以互動的元素（例如首頁的 .grid-item 照片，
  // touch-action:manipulation，允許整頁捲動）。下面 window 的 pointerdown
  // 監聽器雖然也會 e.preventDefault()，但那是給「滑鼠」用的：滑鼠按下、
  // 移動本來就不會觸發瀏覽器原生的捲動手勢，所以桌機/滑鼠拖曳飄動字完全
  // 沒問題。觸控則不同——手機瀏覽器（尤其 iOS Safari）決定「這次觸控要不
  // 要開始捲動頁面」，看的是實際被摸到那個元素的 touch-action、而且這個
  // 判斷做得很早，不保證會等到、或理會 pointerdown 事件處理常式裡才呼叫
  // 的 preventDefault()——所以使用者一碰到飄動的 E，手指稍微一動，
  // 瀏覽器直接把這次觸控當成「捲動首頁」處理掉，飄動字完全抓不到，這正是
  // 「手機版在首頁沒辦法觸控抓取飄動的 E」的成因。
  // 修法：另外加一個掛在 touchstart、且明確不是 passive（{passive:false}）
  // 的監聽器，用跟下面 pointerdown 一樣的座標比對法（含上面的容錯 padding）
  // 判斷「這一下是不是按在飄動字（含容錯熱區）上」；只要是，就在這裡同步
  // 呼叫 preventDefault()——非 passive 的 touchstart 呼叫 preventDefault()
  // 是瀏覽器公認、保證有效取消原生捲動的寫法，不像 pointerdown 那樣看瀏覽器
  // 實作而定。只在命中飄動字範圍內才擋，其餘一律放行，不影響首頁正常的
  // 捲動、照片點擊、hover 等其他功能。這裡固定用觸控的容錯值（本來就只有
  // 觸控事件才會走到這個監聽器），確保跟下面 pointerdown 判斷的範圍一致，
  // 不會發生「這裡覺得沒按到、放行捲動，但 pointerdown 那邊卻覺得按到了」
  // 這種不一致、導致抓取途中被瀏覽器搶走變成捲動頁面的情況。
  window.addEventListener('touchstart', (e) => {
    // 修正手機版照片詳細頁「返回上一頁」箭頭偶爾失靈的成因：飄動的 e
    // 進到照片詳細頁時只是用 CSS（見 .dvd-bounce.dvd-hidden 的完整說明）
    // 把「內層圖片」縮小到看不見＋淡出，外層 .dvd-bounce 容器本身的
    // 版面大小、以及它最後停留的位置都原封不動，getBoundingClientRect()
    // 量到的還是一個跟原本一樣大、只是隱形的矩形，飄到哪就停在哪（隨機、
    // 不固定）。這裡的 touchstart 監聽器沒有先檢查它是不是處於隱藏狀態，
    // 只要這個隱形矩形剛好疊到畫面上其他可互動的元素（例如手機版返回
    // 箭頭現在會移到左下角、桌機版在右上角，兩者都有機會被飄到），
    // 使用者點下去的這一下就會先被這裡攔截、呼叫 preventDefault()——
    // 一旦觸控序列中有任何一次被 preventDefault()，瀏覽器規範規定不會
    // 再補送 click 等相容滑鼠事件，返回箭頭的 click 監聽器因此完全不會
    // 被觸發，看起來就是「按了沒反應」，而且是不是失靈全看飄動字當下
    // 停在哪，才會是「有時候」這種不規律的症狀。
    // 加上這個判斷：飄動的 e 目前是隱藏狀態（dvd-hidden，例如正在照片
    // 詳細頁）時，直接放行、完全不做命中判斷，觸控事件正常穿透到底下
    // 真正看得到、可以互動的元素；只有飄動的 e 真的顯示在畫面上时，才
    // 需要攔截、判斷是不是要抓取它，跟原本手機版「抓不到飄動字」那個
    // 問題的修法互不影響。
    if(dvdBounce.classList.contains('dvd-hidden')) return;
    const touch = e.touches && e.touches[0];
    if(!touch) return;
    const rect = dvdBounce.getBoundingClientRect();
    if(!dvdHitTest(rect, touch.clientX, touch.clientY, DVD_GRAB_PADDING_TOUCH)) return;
    e.preventDefault();
  }, { passive: false });

  let dvdSuppressNextClick = false; // 抓住飄動字的那次按下／放開，不該連帶
                                     // 觸發底下那張照片的 click（打開詳情頁）
  let dvdSuppressClickTimer = null; // 保底逾時：見下面 pointerdown 監聽器內的說明
  // 雙擊判斷改成直接看 pointerup（見下面說明），這裡只需要記住「命中飄動字
  // 的這次按下」是哪個 pointerId、按下當下的座標在哪，pointerup 時才能比對
  // 是不是同一次觸控、中途有沒有明顯位移。
  let dvdTapCandidatePointerId = null;
  let dvdTapStartX = 0, dvdTapStartY = 0;
  const DVD_TAP_MAX_MOVE = 10; // px，pointerdown→pointerup 之間位移在這個範圍內才算「原地點一下」，拖曳／甩出去不算
  window.addEventListener('pointerdown', (e) => {
    // 跟上面 touchstart 監聽器同樣的理由（見該處完整說明）：飄動的 e
    // 隱藏狀態（dvd-hidden）時，它的邊界框只是停在最後位置的「隱形」
    // 矩形，不該繼續攔截落在它範圍內的點擊/觸控，直接放行。
    if(dvdBounce.classList.contains('dvd-hidden')) return;
    const rect = dvdBounce.getBoundingClientRect();
    // 滑鼠（pointerType === 'mouse'）用比較窄的桌機容錯；觸控／筆這類準度
    // 較低的輸入方式一律用比較寬的觸控容錯，跟上面 touchstart 監聽器判斷
    // 的範圍保持一致（見該處說明）。
    const padding = e.pointerType === 'mouse' ? DVD_GRAB_PADDING_DESKTOP : DVD_GRAB_PADDING_TOUCH;
    if(!dvdHitTest(rect, e.clientX, e.clientY, padding)) return;
    dvdSuppressNextClick = true;
    dvdTapCandidatePointerId = e.pointerId;
    dvdTapStartX = e.clientX;
    dvdTapStartY = e.clientY;
    dvdPointerDown(e);
    // 保底逾時：只用來清 dvdSuppressNextClick（見下面 click 監聽器的說明），
    // 跟雙擊判斷本身無關。
    clearTimeout(dvdSuppressClickTimer);
    dvdSuppressClickTimer = setTimeout(() => { dvdSuppressNextClick = false; }, 400);
  });
  // ---------- 「抓住飄動的 e、點兩下」觸發照片物理堆疊模式 ----------
  // 原本這裡是靠瀏覽器在 pointerdown→pointerup 之後、中途幾乎沒有位移時
  // 補發的合成 click 事件來判斷雙擊。這在滑鼠環境（含大部分桌面瀏覽器的
  // 觸控模擬預覽）完全正常，換到手機真機卻整個失效、雙擊毫無反應——
  // 成因是上面 touchstart 監聽器（見該處說明）跟 dvdPointerDown() 內部
  // 都會對命中飄動字的這次觸控呼叫 e.preventDefault()，而 Touch Events
  // 規範規定：一次觸控序列裡只要有任何一個 touchstart/touchmove/touchend
  // 被 preventDefault()，瀏覽器就完全不會再補送「相容滑鼠事件」
  // （mousedown/mouseup/click），包含 click 在內——不是「延遲」或「機率
  // 性漏掉」，是規範明文規定「不會再送」。滑鼠環境的 click 是瀏覽器對
  // 「真實滑鼠按鍵按下放開」直接產生的原生事件，不受這條規則影響，這正是
  // 「預覽點兩下正常、手機真機上架後完全沒反應」這個落差的根本原因。
  // 修法：雙擊判斷改成直接在 pointerup 做，不再依賴 click 事件——pointerup
  // 不管滑鼠還是觸控都保證會送達（除非整個手勢被系統取消，那種情況交給
  // pointercancel 兜底清掉候選狀態即可）。只要這次 pointerup 的 pointerId
  // 跟上面 pointerdown 記錄的 dvdTapCandidatePointerId 相同，且位移沒有
  // 超過 DVD_TAP_MAX_MOVE（代表是原地點一下、不是拖曳／甩出去），就算一次
  // 有效點擊；跟上一次有效點擊的時間差在 DVD_DOUBLE_CLICK_MS 內就視為雙擊，
  // 呼叫 handleDvdDoubleClick() 進場／收場。滑鼠與觸控從此共用同一套判斷。
  let dvdLastRealClickTime = 0;
  const DVD_DOUBLE_CLICK_MS = 320;
  let dvdSingleClickTimer = null; // 等這段時間內沒有等到第二下，才確定這一下是「單擊」，見下面說明
  window.addEventListener('pointerup', (e) => {
    if(dvdTapCandidatePointerId === null || e.pointerId !== dvdTapCandidatePointerId) return;
    dvdTapCandidatePointerId = null;
    const dx = e.clientX - dvdTapStartX;
    const dy = e.clientY - dvdTapStartY;
    if(Math.hypot(dx, dy) > DVD_TAP_MAX_MOVE) return; // 明顯位移＝拖曳／甩出去，不算一次點擊
    const nowClick = Date.now();
    if(nowClick - dvdLastRealClickTime <= DVD_DOUBLE_CLICK_MS){
      dvdLastRealClickTime = 0;
      // 這次判定成雙擊：上一下當時掛起、還在等第二下的「單擊候選」計時器
      // 要一併取消，不然等一下時間到了會誤把這次雙擊也算成一次單擊，
      // 變成雙擊之後緊接著又觸發一次單擊的動作。
      clearTimeout(dvdSingleClickTimer);
      handleDvdDoubleClick();
    } else {
      dvdLastRealClickTime = nowClick;
      // 這一下暫時只是「雙擊候選的第一下」，先不做任何事；只有在
      // DVD_DOUBLE_CLICK_MS 內真的沒有等到第二下、確定不是雙擊之後，
      // 才算數成一次單擊，呼叫 handleDvdSingleClick()（見該函式說明，
      // 目前只有「已經在堆疊模式裡」時才會真的有動作）。
      clearTimeout(dvdSingleClickTimer);
      dvdSingleClickTimer = setTimeout(() => {
        dvdLastRealClickTime = 0;
        handleDvdSingleClick();
      }, DVD_DOUBLE_CLICK_MS);
    }
  });
  window.addEventListener('pointercancel', (e) => {
    if(dvdTapCandidatePointerId === e.pointerId) dvdTapCandidatePointerId = null;
  });
  // click 監聽器現在只保留一個工作：吃掉這次點擊，不讓它連帶觸發底下那張
  // 照片的 click（openDetail）。雙擊判斷已經搬到上面的 pointerup，這裡不再
  // 重複判斷——不然滑鼠使用者同一下點擊會被 pointerup／click 各算一次，
  // 雙擊會被誤判成要點四下才觸發。用 capture 階段攔截，搶在照片自己的
  // click 監聽器執行之前擋下來。手機真機上因為 click 根本不會被送達（見
  // 上面說明），這個監聽器在觸控情境下形同虛設，但也因此不會有任何副作用。
  window.addEventListener('click', (e) => {
    if(!dvdSuppressNextClick) return;
    dvdSuppressNextClick = false;
    clearTimeout(dvdSuppressClickTimer);
    e.stopPropagation();
    e.preventDefault();
  }, true);

  window.addEventListener('resize', clampDvdIntoViewport);
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', clampDvdIntoViewport);
  }

  // ================= 照片物理掉落堆疊模式（雙擊飄動的 e 觸發／收起） =================
  //
  // 整體流程分四段：
  //   idle → entering（縮圖／編號／時鐘先收起）→ active（15 張照片＋飄動的 e
  //   一起用 Matter.js 物理掉落、堆疊、可拖曳）→ exiting（拿掉地板，全部
  //   物理掉出畫面下緣）→ 收尾回到 idle，首頁縮圖用原本「放大進場」動畫
  //   重新出現。photoFallState 這個狀態機用來擋掉動畫進行中又被連續雙擊
  //   打斷的情況；photoFallModeActive 是給上面 dvd 飄動迴圈（clampDvdIntoViewport／
  //   startDvdBounce／watchdog）看的旗標，確保這段期間飄動字的 transform
  //   完全交給物理迴圈接管，不會被原本那套邊界檢查搶回去。
  //
  // 物理引擎選用 Matter.js（成熟、廣泛使用的 2D 剛體物理函式庫），只在
  // 使用者第一次觸發這個模式時才動態載入（CDN），不影響一般瀏覽網站的
  // 首次載入效能；載入一次後常駐，之後每次進出模式不用重新載入。
  // 目前只做桌機／滑鼠版本（Matter.Mouse 只處理滑鼠事件），符合這一版
  // 「先改電腦版就好」的範圍；手機觸控版之後可以再用 Matter.Mouse 搭配
  // touch-to-mouse 轉接或改寫成 Pointer Events 版本另外實作。

  let photoFallState = 'idle'; // 'idle' | 'entering' | 'active' | 'exiting' | 'reshuffling'（單擊換批，見 reshufflePhotoFallBatch()）
  let photoFallModeActive = false; // entering/active/exiting 這整段期間都是 true
  const photoFallStage = document.getElementById('photoFallStage');

  // 掉落張數：手機版縮圖／版面本來就比桌機窄，塞太多張容易太擠、堆疊起來
  // 每張都很小，所以手機版改成只掉 8 張，桌機／平板維持原本的 15 張。用
  // isDetailMobile()（window.innerWidth<=640）判斷，跟全站手機/桌機分流
  // 的斷點保持一致；改成函式（而非固定常數）是因為進場當下才需要判斷
  // 「現在」是不是手機版面，不用在頁面一載入就先算好、之後也不會因為
  // 轉橫向、拉伸視窗寬度而跟著變（掉落張數只在雙擊、真正進場那一刻決定
  // 一次，中途改變視窗寬度不會讓「已經掉下來的照片數量」跟著增減）。
  function photoFallCount(){ return isDetailMobile() ? 8 : 15; }
  const PHOTO_FALL_SHRINK_MS = 420;      // 縮圖＋編號收起（縮小至消失）的時長
  const PHOTO_FALL_IDX_FADE_MS = 260;    // 編號淡出比縮圖快一點，兩者收起節奏才有層次，不是死板同步
  const PHOTO_FALL_CLOCK_FADE_MS = 200;  // 下方時鐘「快速」淡出，明顯比縮圖收起更短促
  const PHOTO_FALL_SPAWN_STAGGER_PX = 130; // 15 張照片起始 y 座標依序往上錯開多少 px，製造「一張接一張掉落」的瀑布感，不是整疊一次砸下來
  const PHOTO_FALL_SPAWN_BASE_PX = 160;    // 第一張的起始 y（視窗上緣再往上的距離）
  const PHOTO_FALL_SPAWN_JITTER_PX = 90;   // 每張再疊加一點隨機值，避免看起來太機械式整齊
  const PHOTO_FALL_GRAVITY = 1.8; // 進場掉落＋堆疊期間的基礎重力，微調自 1.2
  const PHOTO_FALL_EXIT_GRAVITY_SCALE = 1.9; // 收起時（地板拿掉）在 PHOTO_FALL_GRAVITY 之上再額外加重的重力倍率，讓「掉出畫面」這段明顯比平常堆疊時更快、更乾脆，維持跟基礎重力之間原本的相對比例不變
  const PHOTO_FALL_EXIT_MAX_WAIT_MS = 1700;  // 保底：不管有沒有偵測到全部掉出畫面，最多等這麼久就強制收尾，避免極端情況卡住

  let matterLoadPromise = null;
  function loadMatterJS(){
    if(window.Matter) return Promise.resolve();
    if(matterLoadPromise) return matterLoadPromise;
    matterLoadPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js';
      s.async = true;
      s.onload = () => resolve();
      s.onerror = () => { matterLoadPromise = null; reject(new Error('Matter.js load failed')); };
      document.head.appendChild(s);
    });
    return matterLoadPromise;
  }

  let pfEngine = null, pfRunner = null, pfMouse = null, pfMouseConstraint = null;
  // pfRunner 目前是不是真的處於「停止」狀態——重複呼叫「啟動迴圈」如果對一個
  // 「已經在跑」的迴圈重複呼叫，會疊加出第二個 requestAnimationFrame 迴圈
  // （「停止迴圈」只會取消最後一次記錄到的那個迴圈 id，先前疊加的迴圈不會
  // 被真的清掉），造成模擬速度變兩倍甚至更快這種不容易發現的 bug。
  // 原本因為「一按 Preview 就立刻凍結」，迴圈在整段 preview 開啟期間保證
  // 一定是停著的，dropDvdBackIntoPhotoFall() 呼叫「啟動迴圈」之前不需要
  // 另外檢查。現在改成「蓋滿畫面那一刻才停」（見
  // resumeDvdFloatAfterPhotoFallCover()），使用者有可能在蓋滿之前就提早
  // 關閉 preview，這時迴圈其實根本還沒被停過——用這個旗標明確記錄
  // 「目前是不是真的停著」，該重新啟動時才知道要不要真的呼叫「啟動迴圈」，
  // 避免踩到上面那個疊加迴圈的陷阱。
  let pfRunnerPaused = false;

  // ---------- 自訂固定時間步＋累加器的物理迴圈 ----------
  // 取代原本直接用的 Matter.js 內建 Runner（isFixed:true 模式）。
  // 修正「手機版重力比桌機超級慢」：isFixed:true 模式下，Runner 每次
  // requestAnimationFrame 被呼叫到，不管距離上一次呼叫實際經過了多少真實
  // 時間，都只推進「固定一份」（1000/60 毫秒）的模擬時間——也就是說，物理
  // 世界一秒鐘總共被推進多少模擬時間，取決於 requestAnimationFrame 這一秒
  // 內實際被呼叫幾次，不是取決於真實經過了多少時間。桌機通常能穩定跑滿
  // 60fps，兩者剛好一致、感覺不出問題；手機要同時處理 15 張照片的陰影／
  // 變形加上物理運算，實際能跑到的畫面更新頻率常常掉到只剩 30 甚至更低，
  // 這時候一秒內只被呼叫 30 次左右，物理世界一秒卻只被推進
  // 30×(1000/60)＝500 毫秒的模擬時間，等於整個世界用「慢動作」（實際播放
  // 速度只剩一半甚至更低）在跑，這正是手機版重力感覺超級慢的成因——跟
  // PHOTO_FALL_GRAVITY 這個數值本身、或畫面尺寸完全無關，上一次改成依視窗
  // 高度縮放重力（pfGravityScale()）並沒有對到真正的病灶，所以完全沒感覺，
  // 這裡直接拿掉那個縮放，改成從根本解決時間步進的問題。
  // 改成自己寫累加器（accumulator）迴圈：每一次 requestAnimationFrame，量出
  // 「這一幀距離上一幀實際經過了多少真實時間」，累加進 pfAccumulatorMs；
  // 只要累加器裡還有超過一份 PF_FIXED_STEP_MS 的量，就呼叫一次
  // Engine.update() 消耗掉一份，需要的話一次補推進好幾步（最多
  // PF_MAX_SUBSTEPS 步，避免分頁被切到背景很久之後切回來，累積了巨量真實
  // 時間差，一次全部補完造成畫面瞬間卡死）——不管 requestAnimationFrame
  // 一秒鐘實際被呼叫幾次（60、30、甚至更低），物理世界每秒鐘總共被推進的
  // 模擬時間都固定等於真實經過的時間，手機、桌機播放速度從此完全一致，
  // 不再因為裝置效能高低而跑出「慢動作」。
  const PF_FIXED_STEP_MS = 1000 / 60;
  const PF_MAX_SUBSTEPS = 5; // 一幀最多補幾步，超過的落後時間直接捨棄，不追了，避免長時間分頁在背景之後回來瞬間卡死
  let pfLoopRafId = null;
  let pfLoopLastTime = null;
  let pfAccumulatorMs = 0;

  function pfLoopTick(now){
    pfLoopRafId = requestAnimationFrame(pfLoopTick);
    if(pfLoopLastTime === null){ pfLoopLastTime = now; return; } // 第一幀還沒有「上一幀」可以算真實經過時間，先跳過，下一幀開始正常累加
    let frameMs = now - pfLoopLastTime;
    pfLoopLastTime = now;
    if(frameMs > 250) frameMs = 250; // 分頁切到背景很久才切回來：真實經過時間可能長達數秒甚至數分鐘，夾住上限，避免下面 while 迴圈瞬間跑出天文數字的補步
    pfAccumulatorMs += frameMs;
    let steps = 0;
    while(pfAccumulatorMs >= PF_FIXED_STEP_MS && steps < PF_MAX_SUBSTEPS){
      window.Matter.Engine.update(pfEngine, PF_FIXED_STEP_MS);
      pfAccumulatorMs -= PF_FIXED_STEP_MS;
      steps++;
    }
    if(steps >= PF_MAX_SUBSTEPS) pfAccumulatorMs = 0; // 真的追不上（例如裝置效能長期跟不上），與其繼續攢著、之後某一幀忽然爆發式補一大串步造成瞬間卡頓，不如直接捨棄多餘的落後量，讓它從這一幀重新開始正常累積
    // DOM 同步移到這裡、迴圈外面，只在這一影格「真的有物理進展」時呼叫一次
    // （見上面 startPhotoFallEngine() 裡 pfSyncHandler 宣告處的完整說明）：
    // 不管這一影格裡上面的 while 迴圈補跑了 1 步還是 5 步，畫面只需要反映
    // 最終結果，style.transform 只寫一次，不再隨補步次數等比例放大 DOM
    // 寫入量。steps===0（這一影格時間還沒攢滿一整步）時完全不用重寫，
    // 位置本來就沒變。
    if(steps > 0 && pfSyncHandler) pfSyncHandler();
  }

  function pfStartLoop(){
    if(pfLoopRafId !== null) return; // 已經在跑，不重複疊加迴圈（跟原本 Matter.Runner 那個疊加迴圈的陷阱同一個道理，見上面 pfRunnerPaused 旁的說明）
    pfLoopLastTime = null;
    pfAccumulatorMs = 0;
    pfLoopRafId = requestAnimationFrame(pfLoopTick);
  }

  function pfStopLoop(){
    if(pfLoopRafId !== null){ cancelAnimationFrame(pfLoopRafId); pfLoopRafId = null; }
  }

  let pfGroundBody = null, pfLeftWall = null, pfRightWall = null;
  let pfItems = []; // { body, el } 一般掉落照片
  // 每呼叫一次 spawnFallingPhotos() 就遞增一次的世代編號。配合下面
  // spawnFallingPhotos() 內「延後到圖片真的載入完成才建立物理 body」的
  // 機制使用：某幾張圖片還在等待載入的這段時間，使用者完全有可能已經
  // 換批（reshufflePhotoFallBatch）或直接雙擊收掉整個堆疊模式
  // （exitPhotoFallMode）。如果沒有這個世代編號，遲到的載入完成 callback
  // 觸發時，會誤把一顆物理 body 加進「早就不是這一批」甚至「早就不存在」
  // 的物理世界／畫面裡，出現使用者已經看不到、也點不到，卻仍然存在、
  // 平白佔用效能的殭屍照片。每次呼叫都拿到獨一無二的編號、closure 記住
  // 「自己是哪一代」，載入完成時只要拿當下最新的 pfSpawnGeneration 一比對，
  // 不相符就代表這批早就作廢，直接跳過、順手把還留在畫面上的隱藏
  // DOM 節點清掉即可。
  let pfSpawnGeneration = 0;
  let pfDvdItem = null; // { body } 飄動的 e，共用既有的 #dvdBounce 元素，不另外建立分身
  let pfSyncHandler = null;
  let pfExitFallbackTimer = null; // 保底逾時計時器（不管有沒有偵測到全部掉出畫面，最多等這麼久強制收尾）
  let pfExitPollTimer = null;     // 輪詢「是否全部掉出畫面」的計時器，跟上面那個分開存放，理由見 exitPhotoFallMode() 內的說明
  // 使用者這一刻是不是正用滑鼠／觸控抓著某張照片（或飄動的 e）——見下面
  // MouseConstraint 的 startdrag/enddrag 監聽器同步更新。用途見
  // exitPhotoFallMode() 內保底逾時計時器那段說明：使用者可能在畫面收場、
  // 準備進到下一步的這段期間，正好抓著一張照片懸在半空不放，這種情況下
  // 不該讓保底逾時強制把畫面推進到下一步（那樣會變成照片還吊在半空、
  // 畫面卻已經跳走的突兀狀態），要等使用者真的放手、照片掉出網頁之後才
  // 繼續。
  let pfDragging = false;

  // ---------- 單擊飄動的 e：換一批隨機照片（不進出堆疊模式，維持在 active）----------
  // Matter.js 的 collisionFilter：預設每個 body 的 category=0x0001、
  // mask=0xFFFFFFFF（跟任何東西都會碰撞）。換批照片時，舊的一批要整批
  // 掉出畫面（跟 exitPhotoFallMode() 一樣拿掉共用地板），但飄動的 e 這次
  // 不是要離場，希望它掉到網頁邊界就卡住、留在畫面上等新照片——如果照舊
  // 用同一塊共用地板，e 會跟著舊照片一起被拿掉地板、一路掉出畫面。這裡
  // 額外給 e 一個「只有它自己會撞到」的專屬地板：把 e 標記成
  // PF_CATEGORY_DVD 分類，專屬地板的 mask 只允許跟這個分類碰撞，一般
  // 照片維持預設分類，跟這塊地板不會產生碰撞判定、直接穿過去，兩者互不
  // 影響。
  const PF_CATEGORY_DVD = 0x0002;
  const PF_CATEGORY_DVD_FLOOR = 0x0004;
  let pfDvdFloor = null; // 換批照片期間，只擋飄動的 e、不擋照片的專屬地板（見上面說明）
  // 目前畫面上這一批掉落照片的 url 集合，換下一批時用來排除，確保新一批
  // 不會跟現在這批完全重複（見 pickReshuffleBatch() 的完整說明）。初次
  // 進場（spawnFallingPhotos 沒有指定 photoBatch）跟每次換批之後都會
  // 更新這個集合。
  let pfLastBatchUrls = new Set();
  // Fisher–Yates 洗牌，公平的隨機排列，不偏袒任何一項——spawnFallingPhotos()
  // 決定初次進場的隨機順序、pickReshuffleBatch() 決定換批時的隨機順序，
  // 兩處共用同一份實作，不重複寫兩次。
  function shuffled(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ---------- 堆疊照片：提前預熱這一批會用到的圖檔，避免掉落時出現空白 ----------
  // 首頁縮圖用 loading="lazy"（見 GRID_EAGER_COUNT 旁的說明），一打開網站
  // 只有前幾張是真的載入好的，其餘要捲到附近才會觸發載入——使用者不需要
  // 先把整個網格捲過一遍就能雙擊進堆疊模式，這批隨機洗出來的照片裡，
  // 難免混著幾張「gridUrl 還沒被瀏覽器真的載入過」的縮圖。原本
  // spawnFallingPhotos() 是建立 DOM 元素的同一刻才直接賦值 img.src，
  // 完全沒有預留任何緩衝，遇到這種還沒載過的縮圖，畫面上就會看到
  // .photo-fall-item 那格淺灰／近白底色的方塊愣在那裡一下下，等圖真的
  // 下載完成才「補」跳出來——這正是「偶爾幾張白色的圖片」的成因。
  // 修法：只要確定這一批會是哪幾張（進場、或單擊換批），就立刻在背景把
  // gridUrl／thumbUrl 都先請瀏覽器下載＋decode 一次，讓它們真正顯示出來
  // 之前，多半已經有充裕的提前量（進場：Matter.js 載入＋首頁縮圖收起的
  // 這段時間；換批：舊照片全部掉出畫面的這段時間，見呼叫端的說明）。
  // 兩種畫質都先暖：gridUrl（400px）是一般大小照片會用到的，thumbUrl
  // （800px）是隨機挑中的「放大版」會用到的——這裡不知道等一下哪幾張
  // 會被抽中放大，乾脆兩種都暖，反正都是很小的縮圖，多暖幾張的頻寬成本
  // 可以忽略不計。
  // 原本這裡是「射後不理」：發出下載/decode 請求就結束，暖好的 Image
  // 物件用完即丟；真正顯示時 spawnFallingPhotos() 還是另外建立一個全新的
  // <img> 重新指定 src，而且畫面上這顆全新的 <img> 一律固定從 opacity:0
  // 開始、等 decode 完成的 callback 觸發才淡入（見 CSS .photo-fall-item
  // img 的 opacity/.loaded 規則）——這段 0.22s 的淡入是「每一張都一定會
  // 播」，跟這張圖到底有沒有真的暖好完全無關，這正是即使暖機函式已經呼叫
  // 過，畫面上還是能看到一瞬間空白/淺灰方塊、感覺像是「延遲」的根本原因。
  // 也曾經試過「等這個 Promise resolve 才 spawn」，但那樣反而是犧牲了
  // 「雙擊馬上全部掉下來」的即時感去換照片完整度，這不是我們要的方向。
  //
  // 真正的解法：改成回傳 { promise, cache }，cache 是 url → 已經暖好
  // （下載＋decode 完成）的 Image 元素本身。spawnFallingPhotos() 真的要
  // 顯示這張照片時，直接複製這個「已經準備好像素」的元素塞進畫面，不需要
  // 再建立一個從零開始的新 <img>、也不需要再等一次 decode／CSS 淡入——
  // 這才是真正的「零延遲」，用的是「東西早就準備好了，直接拿來用」，
  // 而不是靠等待或猜測時間。promise 仍然保留，resolve 代表這批圖全部暖機
  // 完成（或個別失敗），但呼叫端不再需要靠它來決定何時 spawn，spawn 的
  // 時機完全不受暖機影響、該多快就多快；沒趕上暖機的極少數幾張，交給
  // spawnFallingPhotos() 裡原本就有的「淡入」安全網頂著，不會因為個別幾張
  // 慢，就拖累其他張、拖累整批的出場節奏。
  // 原本這裡不管成功失敗都會呼叫 store() 把 Image 元素塞進 cache——
  // decode() 失敗（.catch(store)）、onerror 觸發（onerror = finish，
  // finish() 內一樣呼叫 store()）都照樣快取。問題是「失敗」代表這張圖片
  // 根本沒有真的載入成功（常見成因：15 張照片 × 2 種尺寸，同時對 Google
  // Drive 縮圖服務發出將近 30 個並發請求，偶爾會被暫時性拒絕/逾時），
  // 快取進去的其實是一個沒有像素資料的「破圖」Image 物件。
  // spawnFallingPhotos() 看到 cache 裡有這個 url 就直接信任它「已經暖好」，
  // cloneNode() 複製、立刻標上 .loaded 顯示出來——結果就是一塊灰色方塊
  // （.photo-fall-item 的底色）永久卡在畫面上：因為它從頭到尾沒有走過
  // 任何「重新嘗試載入」的路徑，暖機那次的失敗就是它唯一、也是最後一次
  // 的機會。
  // 修法：store() 只在真正成功時呼叫，失敗時單純什麼都不做（連
  // resolve/整批 Promise 還是要 resolve，不能讓一張圖片失敗卡住整批暖機
  // 的完成判斷，但「快取」這件事不能發生）。這樣暖機失敗的圖片，url 不會
  // 出現在 cache 裡，spawnFallingPhotos() 查快取查不到，會自動退回下面
  // 「建立全新 <img>」那條路——那條路本身也補上了失敗自動重試一次的
  // 邏輯（見下方 spawnFallingPhotos() 內的說明），等於暖機失敗之後還有
  // 兩次全新的機會，而不是直接卡死。
  function warmFallBatch(batch){
    const cache = new Map();
    if(!batch) return { promise: Promise.resolve(), cache };
    const tasks = [];
    batch.forEach((photo) => {
      if(!photo) return;
      [photo.gridUrl, photo.thumbUrl].forEach((url) => {
        if(!url || cache.has(url)) return;
        const im = new Image();
        im.src = url;
        const store = () => cache.set(url, im);
        if(im.decode){
          tasks.push(im.decode().then(store, () => {})); // 失敗不快取，見上方說明
        } else {
          tasks.push(new Promise((resolve) => {
            if(im.complete && im.naturalWidth > 0){ store(); resolve(); return; }
            im.onload = () => { store(); resolve(); };
            im.onerror = () => resolve(); // 失敗不快取，見上方說明
          }));
        }
      });
    });
    return { promise: Promise.all(tasks), cache };
  }

  // 進場（第一次雙擊）用的批次挑選，公式跟 spawnFallingPhotos() 內原本
  // 「沒有帶 photoBatch 參數」時的邏輯完全一致（先把全部照片洗牌，再依
  // index 對洗牌結果取餘數循環取用）——這裡提早算一次，讓 enterPhotoFallMode()
  // 可以在照片真的掉下來之前，就先知道會是哪幾張、進而提前暖機；算出來的
  // 結果直接傳給 spawnFallingPhotos()，那邊就不用也不會再重算一次（重算會
  // 洗出不同的隨機結果，跟已經暖好的那批對不起來）。
  function pickInitialFallBatch(){
    const fallCount = photoFallCount();
    const pool = photos.length ? shuffled(photos) : [];
    const batch = [];
    for(let i = 0; i < fallCount; i++){
      batch.push(pool.length ? pool[i % pool.length] : null);
    }
    return batch;
  }

  // 換批時挑下一批照片：優先從「目前這批以外」的照片裡挑，確保新一批
  // 跟現在畫面上這批不會完全重複；扣掉現在這批之後剩下的照片不夠湊滿
  // count 張時（例如照片總數本來就不多、又換過幾輪），用完整照片池洗牌
  // 補滿剩下的名額——這種情況下沒辦法保證「完全沒有一張跟現在這批重複」，
  // 但至少會儘量優先用還沒出現在這一批的照片，且一定跟「現在這批」的
  // 組合整體不同（除非照片總數少到 count 都湊不滿，那種極端情況下退回
  // 盡力而為，不會整個壞掉或卡住）。
  function pickReshuffleBatch(count){
    if(!photos.length) return [];
    const fresh = shuffled(photos.filter(p => !pfLastBatchUrls.has(p.url)));
    if(fresh.length >= count) return fresh.slice(0, count);
    const filler = shuffled(photos);
    const result = fresh.slice();
    for(let i = 0; result.length < count && i < filler.length; i++){
      result.push(filler[i]);
    }
    return result;
  }

  function handleDvdDoubleClick(){
    // 只在單純的首頁格子畫面上生效，preview／照片詳情頁開著時不理會，
    // 避免雙擊飄動字時剛好疊加另一層轉場動畫、互相打架。
    if(document.body.classList.contains('detail-active')) return;
    if(document.body.classList.contains('preview-active')) return;
    if(photoFallState === 'idle'){
      enterPhotoFallMode();
    } else if(photoFallState === 'active'){
      exitPhotoFallMode();
    }
    // 'entering' / 'exiting'：動畫正在進行中，這次雙擊先忽略，等目前這段播完
    // 使用者自然還能再點一次，不需要特別排隊處理。
  }

  // ---------- 單擊飄動的 e：換一批隨機照片 ----------
  // 只在已經身處堆疊模式、畫面上正顯示著照片的當下（photoFallState ===
  // 'active'）才有意義；其餘任何情況（首頁、preview、照片詳情頁、或
  // entering/exiting/reshuffling 這些動畫正在播放的過渡狀態）單擊一律
  // 不做任何事，維持原本「單擊沒有特別功能、只用來判斷是不是雙擊」的
  // 行為不變。
  function handleDvdSingleClick(){
    if(photoFallState !== 'active') return;
    reshufflePhotoFallBatch();
  }

  // ---------- 進場：首頁縮圖／編號縮小至消失，時鐘快速淡出 ----------
  function shrinkHomeForPhotoFall(){
    gridRevealInFlight = true; // 借用既有的「首頁縮圖尺寸暫時不可靠」旗標，
                                // 讓 positionGridIdxItem() / magnetFrame() 這段期間自動跳過、不插手
    const items = grid.querySelectorAll('.grid-item');
    items.forEach(item => {
      const img = item.querySelector('.thumb-wrap img');
      const idx = item.querySelector('.idx');
      if(img){
        img.style.transition = `transform ${PHOTO_FALL_SHRINK_MS}ms cubic-bezier(.4,0,1,1), opacity ${PHOTO_FALL_SHRINK_MS}ms ease`;
        img.style.transform = 'scale(0)';
        img.style.opacity = '0';
      }
      if(idx){
        idx.style.transition = `opacity ${PHOTO_FALL_IDX_FADE_MS}ms ease, transform ${PHOTO_FALL_IDX_FADE_MS}ms ease`;
        idx.style.opacity = '0';
        idx.style.transform = 'scale(0.6)';
      }
    });
    pageClock.style.transition = `opacity ${PHOTO_FALL_CLOCK_FADE_MS}ms ease`;
    pageClock.style.opacity = '0';
  }

  function enterPhotoFallMode(){
    photoFallState = 'entering';
    photoFallModeActive = true;
    document.body.classList.add('photo-fall-active');
    shrinkHomeForPhotoFall();

    // 飄動字的迴圈立刻停下來（不再繼續彈跳），但完全不搬動它的位置、也不
    // 隱藏它——維持在雙擊當下所在的畫面位置不動。它要的效果是「原地忽然
    // 出現重力」，不是像其他 15 張照片那樣從畫面外掉進來，所以全程都留在
    // 使用者看得到的地方，讓下面的物理世界一準備好就直接接手、原地開始
    // 下墜。
    if(dvdRAF){ cancelAnimationFrame(dvdRAF); dvdRAF = null; }
    dvdDragging = false;
    dvdBounce.classList.remove('dvd-grabbing');

    // 原本 e 是等首頁縮圖收起的 PHOTO_FALL_SHRINK_MS（420ms）過完，才跟 15
    // 張照片一起被丟進物理世界，這段空檔它已經停止飄動、卻還沒開始受重力，
    // 看起來像「頓了一下才掉下去」。
    // 改成雙擊當下就立刻開始載入 Matter.js（不用等縮圖收起），一載入完成
    // 就馬上呼叫 startPhotoFallEngine() 讓 e 原地開始受重力掉落——中間唯一
    // 的延遲只剩「第一次真的需要連網下載 Matter.js」這件事本身（之後每次
    // 雙擊都是瞬間，因為已經快取在記憶體裡），感覺就像雙擊那一刻「重力
    // 突然打開」。15 張堆疊照片則仍然沿用原本的節奏，等首頁縮圖真的收起
    // （視覺上不會互相干擾）之後才 spawn 進同一個已經在跑的物理世界——
    // 兩者用同一個 pfEngine，e 只是比照片更早入場而已，物理邏輯（重力、
    // 碰撞、可拖曳）從頭到尾完全共用同一套規則。
    const enterAt = performance.now();
    // 提早算出這一批會是哪幾張、立刻背景暖機（完整原因見 warmFallBatch()
    // 旁的說明），讓它們有機會在真正 spawnFallingPhotos() 之前就先準備好，
    // 掉下來時不會露出空白的淺灰／白色方塊。
    const fallBatch = pickInitialFallBatch();
    const fallWarm = warmFallBatch(fallBatch); // { promise, cache }——cache 裡已經暖好的 Image 元素會直接被 spawnFallingPhotos() 拿去用，不用等 promise

    // e 本身不受暖機影響：Matter.js 一載入完成就讓它原地開始受重力掉落，
    // 維持原本「雙擊那一刻重力突然打開」的即時感。
    //
    // 15 張堆疊照片的 spawn 時機維持原本的節奏（首頁縮圖收起的
    // PHOTO_FALL_SHRINK_MS 一到就 spawn），完全不等暖機——雙擊之後應該多快
    // 掉下來就多快掉下來，不能為了等圖片而讓整批延遲。真正解決「白色方塊」
    // 的方法不是延後 spawn 的時間，而是讓 spawnFallingPhotos() 直接使用
    // fallWarm.cache 裡「已經真的暖好」的 Image 元素（見該函式內的說明）：
    // 暖機時間夠的張數會直接零延遲顯示，極少數沒趕上的張數才會走原本的
    // 淡入安全網，兩者互不拖累，整批出場的節奏完全不受影響。
    loadMatterJS().then(() => {
      startPhotoFallEngine();
      const elapsed = performance.now() - enterAt;
      const remaining = Math.max(0, PHOTO_FALL_SHRINK_MS - elapsed);
      setTimeout(() => spawnFallingPhotos(fallBatch, fallWarm.cache), remaining);
    }).catch(() => {
      // Matter.js 載入失敗（例如離線）：直接復原，不留在半成品狀態
      photoFallState = 'idle';
      photoFallModeActive = false;
      document.body.classList.remove('photo-fall-active');
      prepareGridRevealState();
      void grid.offsetWidth;
      pageClock.style.transition = `opacity ${HOME_REVEAL_MS}ms ease`;
      requestAnimationFrame(() => { pageClock.style.opacity = '1'; });
      playGridRevealAnimation();
      startDvdBounce();
    });
  }

  // ---------- 建立物理世界：先讓飄動的 e 原地受重力掉落、可拖曳 ----------
  // 15 張堆疊照片還沒進來之前，這個物理世界已經先跑起來、e 已經是裡面
  // 唯一的物件，拖曳／牆壁碰撞都已經生效；等 spawnFallingPhotos() 把照片
  // 陸續加進同一個 pfEngine.world，e 就會跟它們用同一套規則互相碰撞、
  // 堆疊在一起。
  function startPhotoFallEngine(){
    const Matter = window.Matter;
    const { Engine, Runner, Bodies, Composite, Mouse, MouseConstraint, Events } = Matter;

    const vw = window.innerWidth;
    const vh = window.innerHeight;

    pfEngine = Engine.create();
    pfEngine.gravity.y = PHOTO_FALL_GRAVITY;

    // 地板／左右牆：邊緣就是網頁邊界本身，貼齊視窗左右兩側跟底部，讓掉落的
    // 照片「撞到視窗邊界」的感覺等同撞到真正的網頁邊緣，不是縮在中間某個
    // 虛擬框裡。牆壁本身用比視窗更厚、更寬的靜態矩形，避免高速穿透。
    const wallThickness = 200;
    pfGroundBody = Bodies.rectangle(vw / 2, vh + wallThickness / 2, vw * 2, wallThickness, { isStatic: true, label: 'pfGround', friction: 0.7 });
    pfLeftWall = Bodies.rectangle(-wallThickness / 2, vh / 2, wallThickness, vh * 4, { isStatic: true, label: 'pfLeftWall' });
    pfRightWall = Bodies.rectangle(vw + wallThickness / 2, vh / 2, wallThickness, vh * 4, { isStatic: true, label: 'pfRightWall' });
    Composite.add(pfEngine.world, [pfGroundBody, pfLeftWall, pfRightWall]);

    // 飄動的 e：不建立新元素，直接把現有的 #dvdBounce 接進物理世界，body
    // 就生在它雙擊當下所在的畫面位置（dvdX/dvdY，上面 enterPhotoFallMode()
    // 停下飄動迴圈時最後讀到的座標），不給任何初始速度——單純交給重力，
    // 效果就是原地忽然開始往下掉，不是從畫面外飛進來、也不是延續原本
    // 飄動的速度方向。跟其他照片共用完全相同的物理參數（restitution／
    // friction／frictionAir／chamfer），落下、碰撞、拖曳的手感一致，只有
    // 起始位置跟起始時間不同。
    measureDvdSize();
    const dvdBody = Bodies.rectangle(dvdX + dvdW / 2, dvdY + dvdH / 2, dvdW, dvdH, {
      restitution: 0.3, // 0.8 太接近全彈跳，多顆疊在一起的照片互相碰撞時會一直小幅度來回彈、看起來在抖動；調低到 0.3，還有一點回彈感，但不會抖個不停
      friction: 0.55,
      frictionAir: 0.012,
      density: 0.0026,
      chamfer: { radius: 4 },
      // category 標成 PF_CATEGORY_DVD（mask 維持預設 0xFFFFFFFF，照樣跟
      // 牆壁／照片／地板正常碰撞，不影響原本任何互動）：單擊換批照片時
      // （見 reshufflePhotoFallBatch()）需要靠這個分類，讓專屬給 e 的
      // 那塊地板只擋得住 e、擋不住一般照片。
      collisionFilter: { category: PF_CATEGORY_DVD },
    });
    Composite.add(pfEngine.world, dvdBody);
    pfDvdItem = { body: dvdBody, w: dvdW, h: dvdH };
    dvdBounce.style.transition = 'none';

    // 拖曳：Matter.Mouse 直接綁在舞台容器上接收滑鼠事件，命中判斷（哪個
    // body 被點到）完全由 Matter 自己用世界座標計算，不受個別 DOM 元素的
    // pointer-events 影響——跟舞台容器本身 inset:0 的視窗座標系剛好 1:1
    // 對應，不需要額外轉換滑鼠座標。之後不管拖的是 e 還是照片，都是同一個
    // MouseConstraint，彼此之間的碰撞完全由 Matter 內建的物理引擎處理，
    // 不需要另外寫任何 e／照片專屬的判斷。
    pfMouse = Mouse.create(photoFallStage);
    pfMouseConstraint = MouseConstraint.create(pfEngine, {
      mouse: pfMouse,
      constraint: { stiffness: 0.18, damping: 0.15, render: { visible: false } },
    });
    Composite.add(pfEngine.world, pfMouseConstraint);
    Events.on(pfMouseConstraint, 'startdrag', () => { photoFallStage.classList.add('grabbing'); pfDragging = true; });
    Events.on(pfMouseConstraint, 'enddrag', () => { photoFallStage.classList.remove('grabbing'); pfDragging = false; });

    photoFallStage.classList.add('active');
    document.body.style.overflow = 'hidden';

    pfItems = [];
    pfSyncHandler = () => {
      pfItems.forEach(({ body, el, w, h }) => {
        el.style.transform = `translate(${body.position.x - w / 2}px, ${body.position.y - h / 2}px) rotate(${body.angle}rad)`;
      });
      if(pfDvdItem){
        const { body, w, h } = pfDvdItem;
        dvdBounce.style.transform = `translate(${body.position.x - w / 2}px, ${body.position.y - h / 2}px) rotate(${body.angle}rad)`;
      }
    };
    // 效能修正（手機版堆疊頁面 lag／fps 掉很低的根本成因）：原本這裡是
    // Events.on(pfEngine, 'afterUpdate', pfSyncHandler)，把 DOM 同步掛在
    // Matter 引擎的 afterUpdate 事件上——但 afterUpdate 是「每呼叫一次
    // Engine.update() 就觸發一次」，不是「每個畫面影格觸發一次」。手機效能
    // 不夠、單一 rAF 影格追不上時，下面 pfLoopTick() 的累加器迴圈會在同一個
    // 影格裡連續補呼叫好幾次 Engine.update()（最多 PF_MAX_SUBSTEPS=5 次），
    // 等於這一個影格裡，15 張堆疊照片的 style.transform 被整批重寫了 5 次，
    // 而畫面實際上一影格只會繪製最後一次的結果——前面幾次全是白白付出
    // 的重排／合成成本，卻沒有任何看得到的效果。裝置越吃力、越需要補步，
    // 這筆浪費的成本反而越大，形成「越卡、DOM 寫越多次、更卡」的惡性循環，
    // 正是「手機開堆疊頁面 fps 感覺特別低」的主因。
    // 改成不掛在 afterUpdate 上，而是在 pfLoopTick() 每次真正跑完一個影格
    // 該補的所有物理步進之後，只手動呼叫一次 pfSyncHandler()——不管這個
    // 影格內部物理世界被推進了幾步，DOM 永遠只依照這一影格最終的結果被
    // 寫入一次，跟螢幕更新率對齊，不再有任何一次多餘、看不見效果的寫入。

    // 原本這裡用 Matter.js 內建 Runner 的 isFixed:true 模式（取代預設「跟著
    // 實際影格間隔變動」的步進方式，解決不同電腦／螢幕更新率上重力速度不
    // 一致的問題）。但後來發現 isFixed:true 其實沒有真的做「累加器補步」：
    // 它每次 requestAnimationFrame 被呼叫到，不管距離上一次實際經過多少
    // 真實時間，一律只推進固定一份（1000/60ms）模擬時間——手機處理 15 張
    // 照片的陰影／變形加上物理運算負擔重，實際更新頻率常掉到 30fps 甚至
    // 更低，一秒內只被呼叫 30 次左右，物理世界一秒卻只推進了
    // 30×(1000/60)＝500ms 的模擬時間，等於用半速慢動作在跑，這正是「手機版
    // 重力比桌機超級慢」的成因。改成自己寫的固定時間步＋真累加器迴圈（見
    // pfStartLoop()／pfLoopTick() 的完整說明），不再依賴 Matter.js 內建
    // Runner：不管 requestAnimationFrame 一秒鐘實際被呼叫幾次，物理世界每
    // 秒總共被推進的模擬時間都固定等於真實經過的時間，手機、桌機播放速度
    // 從此一致，同時原本「不同電腦重力速度不一樣」那個問題（固定時間步
    // 本身就解決了那個問題，累加器只是把它做對）也仍然維持修好的狀態。
    pfRunner = true; // 不再是真正的 Matter.Runner 實例，只當作「目前是不是有一個迴圈存在」的旗標用，配合 pfRunnerPaused 給其他地方的 if(pfRunner) 判斷式繼續使用
    pfStartLoop();
    pfRunnerPaused = false;


    photoFallState = 'active';
  }

  // ---------- 堆疊照片：初次進場（等首頁縮圖真的收起後）或換批（見
  // reshufflePhotoFallBatch()）時，陸續掉進同一個已經在跑的物理世界 ----------
  // photoBatch：要掉落的照片陣列，長度應為 photoFallCount()。省略時
  // （初次進場的原本呼叫方式）沿用原本行為，直接把全部照片洗牌後當作
  // 這一批；換批時則由 pickReshuffleBatch() 先選好、排除目前這批的
  // 結果傳進來。
  // warmCache：url → 已經暖好（下載＋decode 完成）的 Image 元素，來自
  // warmFallBatch()（見該函式旁的完整說明）。沒有傳入、或某張照片剛好不在
  // 裡面（極少數沒趕上暖機時間的情況），就退回原本「建立全新 <img>、
  // decode 完成才淡入」的安全網寫法，行為不變。
  function spawnFallingPhotos(photoBatch, warmCache){
    if(!pfEngine) return; // 保險：使用者可能在照片還沒掉進來之前就已經雙擊提早收掉整個模式
    const Matter = window.Matter;
    const { Bodies, Composite, Body } = Matter;
    pfSpawnGeneration += 1;
    const mySpawnGeneration = pfSpawnGeneration; // 見上面 pfSpawnGeneration 宣告處的完整說明

    const vw = window.innerWidth;

    // 照片尺寸沿用首頁格子「這一刻」實際渲染出來的大小（就算已經縮小到看
    // 不見，getBoundingClientRect 量到的還是格子本身未縮放前的版面尺寸，
    // 因為縮小用的是 transform，不影響版面盒子），量不到時退回一個保守值。
    // 注意：量到的是「整個正方形格子」的寬度，但首頁縮圖實際顯示的照片
    // 只佔格子的 52%（見 CSS .grid-item img{ max-width:52%; max-height:52% }，
    // 靠 object-fit:contain 置中），兩者不是同一件事——原本直接拿格子寬度
    // 當掉落照片邊長，導致五欄（格子最寬）版面下掉落的照片比首頁實際縮圖
    // 大上將近一倍。這裡統一乘上同一個 52% 比例，掉落照片才會跟首頁「正常
    // 看到」的縮圖大小一致，不受欄數（5/3/2 欄）影響。
    // 手機版掉落的照片再稍微放大一點（0.52 → 0.60，邊長多一成多）：手機版
    // 現在只掉 12 張（見上面 photoFallCount()），格子數變少，畫面有更多
    // 空間可以塞稍微大一點的照片，看起來更清楚，不會顯得空。桌機／平板
    // 維持原本的 0.52 不變。
    const PHOTO_FALL_TILE_RATIO = isDetailMobile() ? 0.60 : 0.52;
    const sampleItem = grid.querySelector('.grid-item');
    const cellSize = sampleItem ? sampleItem.getBoundingClientRect().width : Math.min(vw / 5, 260);
    const tileSize = Math.round(cellSize * PHOTO_FALL_TILE_RATIO);
    // 上面這個 tileSize 原本直接拿來當每張掉落照片「正方形」的邊長，導致不管
    // 照片實際是直的、橫的、還是正方的，全部都被硬擠成同一個正方形——這正是
    // 「堆疊畫面每張照片都是正方形」的成因。改成拿 tileSize*tileSize 這個
    // 「面積」當基準（維持跟原本同一個視覺大小級距，不會因為改用真實形狀
    // 就整批變大或變小），再依每張照片實際的寬高比（photo.aspect，見
    // fetchDriveImages() 裡從 Google Drive imageMediaMetadata 算出來的值）
    // 反推出這張照片專屬的寬、高——長寬比越極端（很長的全景照之類），
    // 面積相同時邊長差距會被拉得更開，這裡夾一個上下限（0.4~2.5）避免
    // 極端比例的照片被拉成一條極細的長條，物理碰撞/視覺觀感也比較合理。
    const PHOTO_FALL_TILE_AREA = tileSize * tileSize;
    const PHOTO_FALL_ASPECT_MIN = 0.4;
    const PHOTO_FALL_ASPECT_MAX = 2.5;

    // 每次掉落，挑 3~5 張（隨機決定張數，也隨機決定是哪幾張）放大顯示，
    // 其餘照片維持原本大小完全不變——只是讓畫面裡混一點大小層次，不是
    // 整批改變原有的視覺級距。用「面積」乘上倍數（而不是直接乘邊長）：
    // 跟下面既有的「面積為基準、再依長寬比反推邊長」算法是同一套邏輯，
    // 這樣不管照片本身是直的、橫的、正方的，放大後仍然維持它自己原本的
    // 長寬比，不會變形。倍數選 2.4（面積），換算邊長大約放大 1.55 倍，
    // 在畫面上一眼就能看出「這幾張比較大」，但還不到誇張到蓋住太多其他
    // 照片、或讓物理碰撞看起來突兀的程度。手機／桌機共用同一套規則，
    // 因為兩邊原本的 tileSize 已經各自用 PHOTO_FALL_TILE_RATIO 分開校準過，
    // 這裡只是在各自原本的大小基準上再放大，不需要另外分裝置處理。
    const PHOTO_FALL_BIG_AREA_MULTIPLIER = 2.4;
    const PHOTO_FALL_BIG_COUNT_MIN = 3;
    const PHOTO_FALL_BIG_COUNT_MAX = 5;

    // 修正：原本這裡是 pool[i % pool.length]，pool（也就是 photos）的順序
    // 從進站抓回照片清單之後就固定不變，等於每次雙擊進堆疊模式，掉下來的
    // 永遠是陣列最前面那固定 15 張（index 0~14）——這正是「每次看到的都是
    // 同一組照片」的成因。改成每次呼叫這個函式時，先把全部照片洗牌
    // （Fisher–Yates，公平的隨機排列，不偏袒任何一張，見上面共用的
    // shuffled() 說明），再從洗牌後的結果依序取用；照片總數不到 15 張時，
    // 用 % 對洗牌後的陣列長度取餘數繼續循環取用（此時勢必得重複，但重複
    // 的組合每次也不同），照片數 ≥15 張時則保證這 15 張彼此都不重複，且
    // 每次進場的組合都不一樣。換批時（photoBatch 有帶值）則直接使用
    // pickReshuffleBatch() 已經排除過目前這批、選好的結果，不再重新洗牌
    // 全部照片。
    const pool = photoBatch || (photos.length ? shuffled(photos) : []);
    const fallCount = photoFallCount();

    // 從這一輪會掉落的 fallCount 張裡面，隨機挑出 3~5 個「位置」（index）
    // 標記成放大版——用跟上面照片洗牌一樣的 Fisher–Yates 手法，對
    // [0, fallCount) 這個位置清單洗牌後取前幾個，保證每次挑到的張數、
    // 挑到的是哪幾張都不重複、不偏袒任何位置。照片總數不到 3 張時
    // （fallCount 比 3 還小），Math.min 會讓放大張數自動跟著減少，
    // 不會超過畫面上實際會出現的照片總數。
    const bigCount = Math.min(
      fallCount,
      PHOTO_FALL_BIG_COUNT_MIN + Math.floor(Math.random() * (PHOTO_FALL_BIG_COUNT_MAX - PHOTO_FALL_BIG_COUNT_MIN + 1))
    );
    const bigIndexSet = new Set(shuffled(Array.from({ length: fallCount }, (_, idx) => idx)).slice(0, bigCount));

    const usedUrls = new Set(); // 這一批實際用到的照片，換下一批時用來排除（見 pfLastBatchUrls）

    // 把「真正把這張照片摔進物理世界、同時讓它在畫面上顯示出來」拆成一個
    // 共用函式：warmed（早就暖好、幾乎零延遲）的照片會在下面迴圈裡立刻
    // 同步呼叫；沒趕上暖機時間、還在等真正載入完成的少數照片，則是要等
    // onload/decode 真的成功觸發之後才呼叫——確保任何一張照片「看起來
    // 已經在畫面上」的那一刻，一定同時是「已經開始物理掉落」且「已經有
    // 真正的圖片內容」，不會再出現空白／淺灰方塊已經掉在地上、卻遲遲沒
    // 補上照片的畫面。
    // mySpawnGeneration／pfEngine 的比對（見上面 pfSpawnGeneration 宣告
    // 處的完整說明）：確保這張照片真正掉落的那一刻，還是屬於「現在這一
    // 批」、物理世界也還存在——避免使用者在圖片載入完成之前就已經換批
    // 或雙擊收掉整個堆疊模式，導致遲到的 body 被誤加進早就作廢的世界裡。
    const dropItem = (el, itemW, itemH, startX, startY, photo) => {
      if(!pfEngine || pfSpawnGeneration !== mySpawnGeneration){
        if(el.parentNode) el.parentNode.removeChild(el); // 這一批（或整個堆疊模式）已經作廢，別再讓這張照片憑空冒出來
        return;
      }
      const body = Bodies.rectangle(startX, startY, itemW, itemH, {
        restitution: 0.3, // 0.8 太接近全彈跳，多顆疊在一起的照片互相碰撞時會一直小幅度來回彈、看起來在抖動；調低到 0.3，還有一點回彈感，但不會抖個不停
        friction: 0.55,
        frictionAir: 0.012,
        density: 0.0022,
        chamfer: { radius: 3 },
        angle: (Math.random() - 0.5) * 0.6,
      });
      Body.setAngularVelocity(body, (Math.random() - 0.5) * 0.14);
      Composite.add(pfEngine.world, body);
      // 直接把這張照片對應的 body／尺寸／原始 photo 物件存在 DOM 元素自己
      // 身上（而不是每次點擊都去掃一次 pfItems 陣列找）：下面「單擊照片
      // 開啟詳細頁」的偵測邏輯（見 photoFallStage 的 pointerdown/pointerup
      // 監聽器）需要 O(1) 直接拿到這些資訊來算飛行動畫的起點矩形、以及
      // 這張照片在 photos 陣列裡對應的 index。
      el._pf = { body, w: itemW, h: itemH, photo };
      pfItems.push({ body, el, w: itemW, h: itemH });
    };

    for(let i = 0; i < fallCount; i++){
      const photo = pool.length ? pool[i % pool.length] : null;
      if(photo && photo.url) usedUrls.add(photo.url);
      const rawAspect = (photo && photo.aspect) ? photo.aspect : 1; // 沒有量到寬高比（見上面 fetchDriveImages 的說明）就退回正方形
      const aspect = Math.min(PHOTO_FALL_ASPECT_MAX, Math.max(PHOTO_FALL_ASPECT_MIN, rawAspect));
      const tileArea = bigIndexSet.has(i) ? (PHOTO_FALL_TILE_AREA * PHOTO_FALL_BIG_AREA_MULTIPLIER) : PHOTO_FALL_TILE_AREA;
      // area = w*h，aspect = w/h → h = sqrt(area/aspect)，w = h*aspect
      const itemH = Math.round(Math.sqrt(tileArea / aspect));
      const itemW = Math.round(itemH * aspect);

      const el = document.createElement('div');
      el.className = 'photo-fall-item';
      el.style.width = itemW + 'px';
      el.style.height = itemH + 'px';

      const startX = itemW / 2 + Math.random() * Math.max(1, vw - itemW);
      const startY = -(PHOTO_FALL_SPAWN_BASE_PX + i * PHOTO_FALL_SPAWN_STAGGER_PX + Math.random() * PHOTO_FALL_SPAWN_JITTER_PX);

      if(photo){
        // 一般大小的照片沿用原本的 gridUrl（400px）就夠清楚；放大版
        // （bigIndexSet 裡的位置）邊長多了約 1.55 倍，繼續套用同一張
        // 400px 來源、被拉伸顯示的話會比其他張明顯偏糊，反而讓「放大」
        // 看起來像「畫質變差」。這裡放大版改用 thumbUrl（800px），
        // 尺寸依然遠小於原始檔案、下載跟解碼負擔很小，但足以撐住多出來
        // 的顯示面積，維持銳利。
        const srcUrl = (bigIndexSet.has(i) ? (photo.thumbUrl || photo.gridUrl) : photo.gridUrl) || photo.thumbUrl || photo.url;
        const warmedImg = warmCache && warmCache.get(srcUrl);
        let img;
        if(warmedImg){
          // 這張圖片已經被 warmFallBatch() 真正下載＋decode 完成——直接把
          // 這個「像素早就準備好」的 Image 元素複製一份塞進畫面，不用再
          // 建立一顆從零開始的新 <img> 重新觸發一次載入／decode，也不用
          // 走 CSS 那段 opacity:0 →「decode 完成才淡入」的 0.22s 淡入。
          // 用 cloneNode() 而不是直接搬動原始元素：同一個 url 有可能在
          // 同一批裡被用到不只一次（例如照片總數不到 fallCount 張、
          // pickInitialFallBatch() 循環取用時會重複），若直接搬動原始
          // DOM 節點，後面重複用到同一張圖的位置會把前面那格的 <img> 
          // 「偷走」，導致前面那格瞬間變空——cloneNode() 保證每個位置
          // 都拿到獨立的節點，瀏覽器對同一個 url 本來就有解碼快取，
          // clone 出來的這份一樣是幾乎零延遲顯示，不會重新真的走一次
          // 網路下載。
          img = warmedImg.cloneNode();
          img.classList.add('loaded'); // 在真正插入畫面之前就先加上，瀏覽器第一次繪製就是 opacity:1，不會有任何淡入過程
          // 極端保險：cache 裡存的雖然已經確定是真正成功載入過的圖片（見
          // warmFallBatch() 內的修正說明），但複製出來的這份元素理論上還是
          // 有極小機率在真正插入畫面、瀏覽器要重新繪製時失敗（例如瀏覽器
          // 自己把圖片記憶體快取回收掉）。這裡補一個 onerror：真的發生時
          // 退回全新載入一次，不要讓這格維持一張確定壞掉的圖。
          img.onerror = () => {
            img.onerror = null;
            img.classList.remove('loaded');
            img.src = srcUrl;
            const retryMarkLoaded = () => img.classList.add('loaded');
            if(img.decode){ img.decode().then(retryMarkLoaded).catch(retryMarkLoaded); }
            else { img.onload = retryMarkLoaded; }
          };
          img.alt = photo.title || '';
          img.draggable = false;
          el.appendChild(img);
          photoFallStage.appendChild(el);
          dropItem(el, itemW, itemH, startX, startY, photo); // 已經暖好：跟原本行為一致，立刻掉落
        } else {
          // 沒趕上暖機時間的少數照片：這裡不再像原本那樣先無條件摔一顆
          // body 下去、只靠 <img> 自己的 opacity 淡入來「補」畫面——那樣
          // 只要圖片還沒真的載入完成，使用者看到的就是一塊已經在地上的
          // 灰色方塊，正是這次要修的問題本身。
          // 改成：先把整格用 pf-pending 藏起來（見上面 CSS 的說明），完全
          // 不建立物理 body、也不加進 pfItems——這一刻它在畫面上「根本
          // 不存在」，不是「存在但空白」。等 onload → decode 真的成功、
          // 確定像素已經準備好，才在 markLoadedAndDrop() 裡把「拿掉隱藏」
          // 跟「呼叫 dropItem() 開始掉落」這兩件事同一刻一起做，使用者
          // 看到的就是這張照片「一準備好，立刻從畫面外開始掉落」，跟其他
          // 提早暖好的照片視覺語言一致，只是掉落的時間點稍微晚一點點。
          img = document.createElement('img');
          img.alt = photo.title || '';
          img.draggable = false;
          el.appendChild(img);
          el.classList.add('pf-pending');
          const markLoadedAndDrop = () => {
            img.classList.add('loaded');
            el.classList.remove('pf-pending');
            dropItem(el, itemW, itemH, startX, startY, photo);
          };
          img.onload = () => {
            if(img.decode){ img.decode().then(markLoadedAndDrop).catch(markLoadedAndDrop); }
            else { markLoadedAndDrop(); }
          };
          // 萬一這張圖真的載入失敗（常見成因：短時間內對圖片服務發出
          // 太多並發請求，被暫時性拒絕/逾時——不是這張圖真的不存在），
          // 先別急著死心：帶一點隨機延遲（避開所有失敗的圖片在同一瞬間
          // 又一起重試、重蹈覆轍撞上同一波併發限制）重新指定一次 src，
          // 給它一次全新的機會。只重試這一次；如果重試也失敗，代表這張
          // 照片這一輪真的沒辦法用——直接把還藏著的 DOM 元素整個移除，
          // 這個位置這一批就少一張，不建立任何物理 body，畫面上不會留下
          // 任何殘影，不像原本那樣退而求其次顯示一塊永久的灰色方塊。
          let retried = false;
          img.onerror = () => {
            if(!retried){
              retried = true;
              setTimeout(() => { img.src = srcUrl; }, 300 + Math.random() * 400);
            } else if(el.parentNode){
              el.parentNode.removeChild(el);
            }
          };
          img.src = srcUrl;
          // 賦值當下就同步檢查一次是不是早就被瀏覽器暖進快取——如果是，
          // 上面的 onload 通常會在下一個 microtask 就觸發，這裡不用特別
          // 処理；但保留這個保底檢查，涵蓋極少數瀏覽器判斷 img.complete
          // 已經是 true 卻可能不會再補觸發 onload 的邊角情況。這裡放在
          // el／img 都已經接好、el 也已經加上 pf-pending 之後才檢查，
          // 即使剛好同步命中，markLoadedAndDrop() 拿掉 pf-pending 的那一刻
          // img 也早就在 el 裡面了，不會有任何一影格是「顯示出來卻還沒
          // 塞圖片」的狀態。
          if(img.complete && img.naturalWidth > 0) markLoadedAndDrop();
          photoFallStage.appendChild(el);
        }
      } else {
        // 沒有照片內容可用（例如整份 photos 清單本身是空的）：維持原本
        // 行為，直接掉落一個沒有圖片、只有底色的方塊——這是完全不同的
        // 邊角情況（沒有照片可顯示，不是「照片還沒載入完成」），不受這次
        // 調整影響。
        photoFallStage.appendChild(el);
        dropItem(el, itemW, itemH, startX, startY, photo);
      }
    }
    pfLastBatchUrls = usedUrls;
  }

  // ---------- 單擊堆疊照片：跟首頁格子點縮圖一樣開啟照片詳細頁 ----------
  // 堆疊照片同時支援兩種互動：Matter.Mouse（見 startPhotoFallEngine() 內
  // 綁在 photoFallStage 上的原生滑鼠事件）負責物理拖曳／甩動；這裡另外
  // 加一組獨立的 Pointer Events 偵測「單純點一下、沒有拖曳位移」的情況，
  // 判斷方式（pointerdown 記起點、pointerup 比對位移量 PF_PHOTO_TAP_MAX_MOVE）
  // 完全比照上面飄動的 e 那組 dvdTapCandidatePointerId 邏輯。兩組系統各自
  // 獨立運作、互不干擾：這裡完全不呼叫 preventDefault()，Matter 原生的
  // mousedown/mousemove/mouseup 拖曳照樣正常運作。
  const PF_PHOTO_TAP_MAX_MOVE = 10;
  let pfPhotoTapCandidateEl = null;
  let pfPhotoTapCandidatePointerId = null;
  let pfPhotoTapStartX = 0, pfPhotoTapStartY = 0;
  photoFallStage.addEventListener('pointerdown', (e) => {
    if(photoFallState !== 'active') return; // entering/exiting/reshuffling 這些過渡狀態不處理，避免點到即將被清掉的舊照片
    const itemEl = e.target && e.target.closest ? e.target.closest('.photo-fall-item') : null;
    if(!itemEl || !itemEl._pf) return;
    pfPhotoTapCandidateEl = itemEl;
    pfPhotoTapCandidatePointerId = e.pointerId;
    pfPhotoTapStartX = e.clientX;
    pfPhotoTapStartY = e.clientY;
  });
  window.addEventListener('pointerup', (e) => {
    if(pfPhotoTapCandidatePointerId === null || e.pointerId !== pfPhotoTapCandidatePointerId) return;
    const itemEl = pfPhotoTapCandidateEl;
    pfPhotoTapCandidatePointerId = null;
    pfPhotoTapCandidateEl = null;
    if(!itemEl || !itemEl.isConnected) return; // 這次手勢途中，照片可能剛好被換批清掉了
    const dx = e.clientX - pfPhotoTapStartX, dy = e.clientY - pfPhotoTapStartY;
    if(Math.hypot(dx, dy) > PF_PHOTO_TAP_MAX_MOVE) return; // 明顯位移＝拖曳，不算點擊
    if(photoFallState !== 'active') return;
    if(document.body.classList.contains('detail-active') || document.body.classList.contains('preview-active')) return;
    openDetailFromPhotoFallItem(itemEl);
  });
  window.addEventListener('pointercancel', (e) => {
    if(pfPhotoTapCandidatePointerId === e.pointerId){ pfPhotoTapCandidatePointerId = null; pfPhotoTapCandidateEl = null; }
  });

  // 點下堆疊裡的某一張照片：跟首頁格子點縮圖一樣的「分身飛到大圖欄位」
  // 轉場（見 openDetail()／runGridToDetailTransition()），差別有三點：
  //   1) 起點矩形直接用物理世界目前的座標反推（見下面的完整說明），不是
  //      量 DOM 的 getBoundingClientRect()。
  //   2) 額外多帶一個 angle（弧度，body 當下的物理旋轉角度）——這樣
  //      runGridToDetailTransition() 才能讓分身「從它當下傾斜的角度」
  //      開始飛，飛行途中同時完成旋轉回正、放大、移動這三件事，而不是
  //      像原本那樣完全丟掉角度、憑空從水平姿態開始（見
  //      rotatedTopLeftForCenterPivot() 的完整說明）。
  //   3) 開啟前先把整個物理世界暫停（pfRunner），確保使用者按上一頁回來
  //      時，堆疊畫面完全是離開前那一刻的樣子——見 detailFromPhotoFall
  //      這個旗標、以及 finishCloseDetail() 裡消耗它的分支。
  function openDetailFromPhotoFallItem(itemEl){
    const info = itemEl._pf;
    if(!info || !info.photo) return;
    const index = photos.indexOf(info.photo);
    if(index === -1) return;
    const imgEl = itemEl.querySelector('img');
    if(!imgEl) return;

    detailFromPhotoFall = true;
    if(window.Matter && pfRunner && !pfRunnerPaused){
      pfStopLoop();
      pfRunnerPaused = true;
    }

    // 物理世界的座標系跟視窗座標系是 1:1 對應（見 startPhotoFallEngine()
    // 的說明），直接拿 body 中心點反推「沒有旋轉」版本的矩形——這張照片
    // 當下多半帶著隨機的碰撞旋轉角度，getBoundingClientRect() 量到的會是
    // 旋轉後被撐大的外接矩形，飛行動畫的起點、尺寸都會偏大、偏移。角度
    // 本身另外用 angle 這個欄位原封不動帶過去，讓分身可以照著這個角度
    // 開始飛（而不是被拿掉旋轉資訊、變成憑空從水平開始）。
    const rect = {
      left: info.body.position.x - info.w / 2,
      top: info.body.position.y - info.h / 2,
      width: info.w,
      height: info.h,
      angle: info.body.angle,
    };

    openDetail(index, imgEl, rect);
  }

  // ---------- 單擊觸發：換一批隨機照片，e 卡在網頁邊界，不回首頁 ----------
  // 整體流程：拿掉共用地板（跟 exitPhotoFallMode() 一樣，讓目前這批舊
  // 照片一路掉出畫面），但額外給飄動的 e 一個只有它自己會撞到的專屬
  // 地板（見上面 PF_CATEGORY_DVD / PF_CATEGORY_DVD_FLOOR 的說明），卡在
  // 網頁最下緣不讓它掉出去；等舊照片全部掉出畫面（或使用者放開手上還
  // 抓著的照片）之後，拿掉這塊專屬地板、換回一般共用地板，再呼叫
  // spawnFallingPhotos() 掉下新的一批（已經排除掉舊的這批，見
  // pickReshuffleBatch()）。全程都停留在 photoFallState==='active' 這個
  // 大狀態機底下（中途暫時標成 'reshuffling'，只用來擋掉這段期間又被
  // 連續單擊/雙擊打斷的情況），不會觸發回首頁那一整套收尾流程。
  function reshufflePhotoFallBatch(){
    if(!pfEngine || photoFallState !== 'active') return;
    photoFallState = 'reshuffling';
    const Matter = window.Matter;
    const { Bodies, Composite } = Matter;

    if(pfGroundBody){ Composite.remove(pfEngine.world, pfGroundBody); pfGroundBody = null; }

    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const wallThickness = 200;
    pfDvdFloor = Bodies.rectangle(vw / 2, vh + wallThickness / 2, vw * 2, wallThickness, {
      isStatic: true,
      friction: 0.7,
      label: 'pfDvdFloor',
      collisionFilter: { category: PF_CATEGORY_DVD_FLOOR, mask: PF_CATEGORY_DVD }, // 只擋得住 e，見上面完整說明
    });
    Composite.add(pfEngine.world, pfDvdFloor);
    pfEngine.gravity.y = PHOTO_FALL_GRAVITY * PHOTO_FALL_EXIT_GRAVITY_SCALE;

    // 注意：這裡「不能」馬上把 pfItems 清空——每一影格負責把物理世界的
    // 位置同步寫進畫面 transform 的 pfSyncHandler（見 startPhotoFallEngine()
    // 內的定義）讀的正是 pfItems 這個變數，若在舊照片還在掉落的當下就先
    // 清空，舊照片的物理 body 依然會繼續正常掉落（checkOldOut() 之後還是
    // 能正確偵測到它們掉出畫面），但畫面上的 DOM 元素會從這一刻起不再被
    // 更新位置，等於整批瞬間「凍結」在原地不動；等偵測到掉出畫面、
    // finishReshuffleOldBatch() 把它們的 DOM 元素移除時，使用者看到的就是
    // 「卡住不動，然後直接消失」，而不是預期中「一路掉出畫面」的動畫——
    // 這正是先前這個版本的成因。改成先保留 pfItems 原封不動（讓
    // pfSyncHandler 全程持續同步這批舊照片的位置），只用一個獨立變數
    // oldItems 指向同一個陣列，供下面 checkOldOut() 判斷「是否全部掉出
    // 畫面」用；真正的 pfItems = [] 清空動作，挪到 finishReshuffleOldBatch()
    // 裡——這批舊照片已經真的被移除乾淨、即將要塞入新一批之前才做，全程
    // 不會有「有 body 在物理世界裡卻沒有東西同步畫面」的空窗期。
    const oldItems = pfItems;

    // 提早選好「下一批」要換上的照片、立刻背景暖機（原因、機制見
    // warmFallBatch() 旁的說明）：這裡到真正 spawnFallingPhotos() 之間，
    // 還有「等這批舊照片全部掉出畫面」這段時間可以利用（通常有好幾百
    // 毫秒、最多到 PHOTO_FALL_EXIT_MAX_WAIT_MS 保底逾時），足夠讓新照片
    // 的縮圖提前準備好。注意這裡只能算一次、之後全程沿用同一份結果——
    // pickReshuffleBatch() 內部有隨機洗牌，若之後收尾時（見
    // finishReshuffleOldBatch()）重新呼叫一次，會洗出完全不同的另一批，
    // 跟這裡已經暖好的那批對不起來，暖機就白做了。
    const nextBatch = pickReshuffleBatch(photoFallCount());
    const nextWarm = warmFallBatch(nextBatch); // { promise, cache }——原因同 enterPhotoFallMode()，spawn 時機不等它，只借用 cache 裡已經暖好的 Image 元素

    // 修正：checkOldOut()（80ms 輪詢）跟下面 triggerReshuffleFallback()
    // （1700ms 保底逾時）是兩條各自獨立的計時器鏈，理論上都可能觀察到
    // 「這一批舊照片已經全部掉出畫面」而各自嘗試收尾。原本只有 checkOldOut()
    // 那邊在判定完成時會把兩個計時器都清掉，triggerReshuffleFallback() 那邊
    // 收尾時卻忘了順手清掉還在跑的 pfExitPollTimer——只要舊照片掉出畫面的
    // 時間點剛好接近 1700ms 那個保底逾時，兩條路徑就可能前後腳都判定完成、
    // 各自呼叫一次 finishReshuffleOldBatch(oldItems)：第一次呼叫已經把
    // pfItems 清空、spawn 出新的一批，緊接著第二次呼叫又把 pfItems 清空一次
    // （新照片瞬間失去位置同步、凍結在原地不動）、再疊加 spawn 一次——這正是
    // 「單擊換批後畫面卡住、疊出多餘照片」的成因。改用 settleOnce() 包一層，
    // 用旗標保證同一輪換批的收尾動作只會真正執行一次，不管是哪條路徑先
    // 判定完成。
    let reshuffleSettled = false;
    const settleOnce = () => {
      if(reshuffleSettled) return;
      reshuffleSettled = true;
      clearTimeout(pfExitFallbackTimer);
      clearTimeout(pfExitPollTimer);
      finishReshuffleOldBatch(oldItems, nextBatch, nextWarm.cache);
    };

    const checkOldOut = () => {
      const allOut = oldItems.every(({ body, h }) => body.position.y - h / 2 > vh + 40);
      if(allOut){
        settleOnce();
      } else {
        pfExitPollTimer = setTimeout(checkOldOut, 80);
      }
    };
    clearTimeout(pfExitFallbackTimer);
    clearTimeout(pfExitPollTimer);
    // 跟 exitPhotoFallMode() 同樣的保底邏輯（見該處完整說明）：使用者這
    // 一刻可能正抓著某張「舊」照片懸在半空還沒放開，不能強制清掉這一批、
    // 提早讓新照片掉下來，要等放手之後才繼續。這裡直接複用同一組
    // pfExitFallbackTimer / pfExitPollTimer 變數——跟真正的
    // exitPhotoFallMode() 不會同時發生（兩者都要求 photoFallState 是
    // 'active' 才能啟動，啟動當下都會立刻改成別的狀態，互相排斥），共用
    // 沒有衝突風險。
    //
    // 修正：這裡原本只要「使用者沒有正在拖曳」就會強制收尾，完全不管
    // oldItems 是不是真的已經全部掉出畫面——這正是「單擊換批時，只要有
    // 一張照片剛好卡在半空中飛久一點（起始位置較高、跟其他照片或牆壁多
    // 彈了幾下）超過 1700ms，就會被保底逾時提早打斷、整批（含還沒掉出
    // 視窗的那幾張）直接從畫面上移除」的成因，看起來像照片卡住之後憑空
    // 消失，而不是使用者要的「一定要等這一批全部真的掉出視窗，下一批才
    // 會從上面掉下來」。
    // 改成這裡也重新檢查一次 allOut：只要還有照片沒掉出視窗（不管使用者
    // 是不是正在拖曳），一律不收尾、把保底逾時繼續往後延，讓 checkOldOut()
    // 的輪詢有機會等到它們真正掉出去再收尾。這個計時器因此退回原本設計的
    // 本意——單純當作「萬一輪詢那條路徑意外沒被觸發」的備援，而不是一個
    // 會提早打斷掉落動畫、讓照片憑空消失的強制關卡。
    const triggerReshuffleFallback = () => {
      const allOut = oldItems.every(({ body, h }) => body.position.y - h / 2 > vh + 40);
      if(pfDragging || !allOut){
        pfExitFallbackTimer = setTimeout(triggerReshuffleFallback, PHOTO_FALL_EXIT_MAX_WAIT_MS);
        return;
      }
      settleOnce();
    };
    pfExitFallbackTimer = setTimeout(triggerReshuffleFallback, PHOTO_FALL_EXIT_MAX_WAIT_MS);
    pfExitPollTimer = setTimeout(checkOldOut, 80);
  }

  // 換批的收尾：清掉舊照片、把地板還給一般樣式，讓新的一批掉下來
  // nextBatch：reshufflePhotoFallBatch() 一開始就選好、也已經提前暖機過的
  // 下一批照片（見該處 pickReshuffleBatch() 呼叫旁的說明）。這裡直接沿用
  // 同一份結果傳給 spawnFallingPhotos()，不再重新呼叫 pickReshuffleBatch()
  // 重算一次——重算會洗出不同的隨機組合，等於讓前面辛苦提前暖好的那批
  // 白暖，新照片又會回到「掉下來才臨時載入」的空白狀態。
  // nextWarmCache：pickReshuffleBatch() 選好新一批的同時就立刻呼叫的
  // warmFallBatch() 所回傳的 cache（url → 已經暖好的 Image 元素，見上面
  // 呼叫端與 warmFallBatch() 內的完整說明）。這裡清乾淨舊照片、重建地板
  // 之後就立刻呼叫 spawnFallingPhotos()，不等任何 Promise、不拖慢換批的
  // 節奏——真正解決「空白方塊」的方法是把這個 cache 傳給
  // spawnFallingPhotos()，讓它對每一張照片先查有沒有已經暖好的版本可以
  // 直接用，而不是靠延後整批的出場時間去換。
  function finishReshuffleOldBatch(oldItems, nextBatch, nextWarmCache){
    const Matter = window.Matter;
    if(Matter && pfEngine){
      const { Composite } = Matter;
      oldItems.forEach(({ body, el }) => {
        Composite.remove(pfEngine.world, body);
        if(el && el.parentNode) el.parentNode.removeChild(el);
      });
      if(pfDvdFloor){ Composite.remove(pfEngine.world, pfDvdFloor); pfDvdFloor = null; }
    }

    if(!pfEngine){
      // 保險：清理這批舊照片的過程中，使用者可能已經用雙擊把整個堆疊
      // 模式關掉了（exitPhotoFallMode()／finishExitPhotoFallMode() 已經
      // 把 pfEngine 設回 null）——這種情況下不用再換新照片，狀態機也已經
      // 被 finishExitPhotoFallMode() 收尾成 'idle'，這裡不用重複處理。
      return;
    }

    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const wallThickness = 200;
    pfGroundBody = Matter.Bodies.rectangle(vw / 2, vh + wallThickness / 2, vw * 2, wallThickness, { isStatic: true, label: 'pfGround', friction: 0.7 });
    Matter.Composite.add(pfEngine.world, pfGroundBody);
    pfEngine.gravity.y = PHOTO_FALL_GRAVITY;

    // 舊的這一批這時已經真的從物理世界／畫面上移除乾淨了，這裡才把
    // pfItems 清空——清空之後緊接著呼叫 spawnFallingPhotos()，新照片會
    // 一張一張 push 進這個乾淨的陣列，pfSyncHandler 從下一影格開始同步
    // 的就是新的這一批，不會有任何一刻是「陣列已經空了，但舊照片其實
    // 還沒清乾淨」的空窗期。
    pfItems = [];

    photoFallState = 'active';
    spawnFallingPhotos(nextBatch, nextWarmCache);
  }

  // ---------- 收場：拿掉地板，所有照片＋e 一路物理掉出畫面下緣，回到首頁 ----------
  function exitPhotoFallMode(){
    if(!pfEngine) return;
    photoFallState = 'exiting';
    const Matter = window.Matter;
    const { Composite } = Matter;

    // 「像網頁下面突然沒邊界一樣」：只拿掉地板，左右牆留著，掉落過程維持
    // 在畫面寬度內垂直掉出，不會東飄西飄失控亂噴。
    if(pfGroundBody){ Composite.remove(pfEngine.world, pfGroundBody); pfGroundBody = null; }
    pfEngine.gravity.y = PHOTO_FALL_GRAVITY * PHOTO_FALL_EXIT_GRAVITY_SCALE;

    const vh = window.innerHeight;
    const checkAllOut = () => {
      const allOut = pfItems.every(({ body, h }) => body.position.y - h / 2 > vh + 40)
        && (!pfDvdItem || pfDvdItem.body.position.y - pfDvdItem.h / 2 > vh + 40);
      if(allOut){
        clearTimeout(pfExitFallbackTimer);
        clearTimeout(pfExitPollTimer);
        finishExitPhotoFallMode();
      } else {
        pfExitPollTimer = setTimeout(checkAllOut, 80);
      }
    };
    // 保底逾時跟輪詢兩個計時器分開存放各自的變數，不能共用同一個——原本
    // 兩者共用 pfExitWatchTimer 一個變數，輪詢迴圈每次重新排程時會把這個
    // 變數「覆寫」成輪詢自己最新一次的計時器 ID，等於把最一開始設定好的
    // 保底逾時計時器 ID 弄丟了。等真的偵測到「全部掉出畫面」、呼叫
    // clearTimeout(pfExitWatchTimer) 時，清掉的其實是輪詢自己的計時器，
    // 保底逾時那個從頭到尾沒被清掉，會在原訂的 1700ms 準時觸發，第二次
    // 呼叫 finishExitPhotoFallMode()——而 pfFinished 這個防重複旗標在第一
    // 次收尾流程最後又被重設回 false（是設計給「下一輪」堆疊模式重新使用
    // 的），沒能擋下這第二次呼叫，導致首頁縮圖／編號的放大進場動畫被多播
    // 一次，也就是「回到首頁時縮放出場多了一次」的成因。分成兩個變數後，
    // 不管是「輪詢偵測到全部掉出畫面」還是「保底逾時」哪一條路徑先觸發，
    // 都會把另一條路徑的計時器一併清掉，確保 finishExitPhotoFallMode()
    // 只會被呼叫一次。
    clearTimeout(pfExitFallbackTimer);
    clearTimeout(pfExitPollTimer);
    // 保底逾時觸發時，如果使用者這一刻正抓著一張照片（或飄動的 e）懸在
    // 半空還沒放開（pfDragging，見該旗標的完整說明），不能直接強制收尾、
    // 把畫面推進到下一步——那樣會變成照片還吊在使用者手指/游標底下、
    // 畫面卻已經跳走的突兀狀態。這種情況下改成把保底逾時重新排程、繼續
    // 往後延，直到使用者真的放手為止；一旦放手，該張照片會照正常物理
    // 掉落，之後不管是輪詢偵測到全部掉出畫面、還是下一次保底逾時觸發，
    // 都會正常收尾，不會無限期卡住（使用者放手後最多只會再多等一次
    // 1700ms，不是真的卡死）。
    // 修正：跟 reshufflePhotoFallBatch() 裡 triggerReshuffleFallback() 同一個
    // 問題（見該處完整說明）——原本只要沒在拖曳就強制收尾，不管照片是不是
    // 真的已經全部掉出畫面，會讓卡在半空久一點的照片被提早清掉、憑空消失。
    // 這裡同樣補上 allOut 檢查，只有真的全部掉出畫面（或使用者放手後
    // checkAllOut 輪詢先偵測到）才收尾，其餘情況一律繼續往後延。
    const triggerExitFallback = () => {
      const allOut = pfItems.every(({ body, h }) => body.position.y - h / 2 > vh + 40)
        && (!pfDvdItem || pfDvdItem.body.position.y - pfDvdItem.h / 2 > vh + 40);
      if(pfDragging || !allOut){
        pfExitFallbackTimer = setTimeout(triggerExitFallback, PHOTO_FALL_EXIT_MAX_WAIT_MS);
        return;
      }
      finishExitPhotoFallMode();
    };
    pfExitFallbackTimer = setTimeout(triggerExitFallback, PHOTO_FALL_EXIT_MAX_WAIT_MS); // 保底逾時
    pfExitPollTimer = setTimeout(checkAllOut, 80);
  }

  // 使用者可能在雙擊收起堆疊（exitPhotoFallMode() 進入 'exiting'）之後、
  // 整批照片還沒真正掉出畫面前，緊接著又按了 Preview——這種情況下堆疊的
  // 收場流程會在 preview 蓋住畫面的這段時間裡自己跑完，這裡（見下面
  // finishExitPhotoFallMode()）就已經把首頁縮圖放大進場的動畫播過一次，
  // 只是使用者當下被完全不透明的 preview 蓋住看不到。等使用者之後關閉
  // preview 時，closePreviewPage() 原本會依「這次是不是從堆疊模式打開的」
  // 再判斷一次要不要播放首頁進場動畫——如果不知道這裡已經播過一次，會
  // 重複再播一次，讓使用者看到縮圖「已經正常顯示，卻忽然又縮小消失、
  // 重新放大」的多餘閃爍。這個旗標讓 closePreviewPage() 知道「這次不用
  // 再播一次」，用一次就消耗掉（見該處說明），不影響下一次真正需要播放
  // 的時機。
  let photoFallGridAlreadyRevealed = false;

  let pfFinished = false;
  function finishExitPhotoFallMode(){
    if(pfFinished) return; // 保底逾時跟「全部掉出畫面」偵測可能幾乎同時觸發，只收尾一次
    pfFinished = true;
    clearTimeout(pfExitFallbackTimer);
    clearTimeout(pfExitPollTimer);

    const Matter = window.Matter;
    if(Matter && pfEngine){
      const { Runner, Composite } = Matter;
      // pfSyncHandler 現在已經不是掛在 Matter 的 afterUpdate 事件上（見
      // startPhotoFallEngine() 內的說明，改由 pfLoopTick() 每影格手動呼叫
      // 一次），這裡不用再 Events.off 解除訂閱；下面把 pfLoopTick 停掉、
      // pfSyncHandler 設回 null，自然就不會再有任何後續呼叫。
      if(pfRunner) pfStopLoop();
      pfRunnerPaused = true;
      Composite.clear(pfEngine.world, false);
      Matter.Engine.clear(pfEngine);
    }
    pfEngine = null; pfRunner = null; pfMouse = null; pfMouseConstraint = null;
    pfGroundBody = null; pfLeftWall = null; pfRightWall = null;
    pfDragging = false; // 這一輪徹底收尾了，重設乾淨，避免殘留的 true 影響下一輪堆疊模式
    pfDvdFloor = null; pfLastBatchUrls = new Set(); // 換批用的狀態一併重設，避免殘留影響下一輪堆疊模式
    pfDvdItem = null; pfSyncHandler = null; pfFinished = false;

    photoFallStage.classList.remove('active', 'grabbing');
    photoFallStage.innerHTML = '';
    pfItems = [];

    document.body.classList.remove('photo-fall-active');
    document.body.style.overflow = '';

    // 飄動的 e：清掉物理迴圈留下的 inline transition，交還給原本的拖曳／
    // 彈跳系統，resetDvdBounce() 會給它一個全新的隨機位置＋方向重新出發，
    // 跟平常「放開甩出去之後」的手感一致。
    //
    // 修正：物理迴圈（pfSyncHandler）每一影格寫入的是
    // `translate(...) rotate(body.angle)`，帶著旋轉角度——上面只清掉了
    // transition，沒有清掉這個殘留的 transform，rotate() 還留在元素身上。
    // 緊接著 startDvdBounce() → resetDvdBounce() 會先呼叫 measureDvdSize()
    // 量測 e 的實際寬高才決定新的撞牆邊界；measureDvdSize() 是用
    // getBoundingClientRect() 量，這支 API 算的是「套用當下 CSS transform
    // 之後」的軸對齊外接矩形——元素還帶著旋轉角度時，量到的外接矩形會比
    // 圖片實際的視覺大小更大（旋轉的矩形，四個角會撐開外接框）。後面整套
    // 撞牆物理（dvdW/dvdH、dvdBoundMaxX/MaxY、resolveDvdObstacleCollision）
    // 全部沿用這個被撐大的錯誤尺寸判斷碰撞，跟畫面上實際看到的圖片邊緣
    // 對不齊——這正是「點開堆疊頁面、回到首頁後，飄動的 e 撞在不是實際
    // 照片邊界的地方」的成因：物理判定用的碰撞框比看得到的圖片範圍還大
    // 一圈，肉眼看起來「還沒碰到照片」就先觸發了碰撞。
    // 這裡先把 transform 一併清空，讓 measureDvdSize() 量到的是乾淨、
    // 沒有殘留旋轉的原始尺寸；resetDvdBounce() 稍後會用正確的新位置重新
    // 寫入乾淨的 translate(...)，不會有瞬間跳位或閃爍。
    dvdBounce.style.transition = '';
    dvdBounce.style.transform = '';
    photoFallModeActive = false; // 一定要在呼叫 startDvdBounce()／resetDvdBounce() 之前解除，否則會被上面那組 guard 擋下
    startDvdBounce();

    // 首頁縮圖／編號：直接重用「照片詳情頁關閉回首頁」同一套放大進場動畫
    // （prepareGridRevealState + playGridRevealAnimation），確保視覺效果
    // 跟使用者已經熟悉的首頁進場完全一致，不是另外做一套新的。
    prepareGridRevealState();
    pageClock.style.transition = 'none';
    pageClock.style.opacity = '0';
    void grid.offsetWidth; // 強制 reflow，確保上面「瞬間切到起始值」先套用過一次
    pageClock.style.transition = `opacity ${HOME_REVEAL_MS}ms ease`;
    requestAnimationFrame(() => { pageClock.style.opacity = '1'; });
    playGridRevealAnimation();
    photoFallGridAlreadyRevealed = true; // 見該旗標宣告處的完整說明：告訴 closePreviewPage() 這輪不用再播一次
    clearTimeout(homeRevealCleanupTimer);
    homeRevealCleanupTimer = setTimeout(() => {
      pageClock.style.transition = '';
      pageClock.style.opacity = '';
    }, HOME_REVEAL_MS + 60);

    photoFallState = 'idle';
  }

  // ================= 堆疊模式期間按 Preview：飄動的 e 暫停等待／恢復飄動／掉回堆疊 =================
  // 使用者可能在堆疊模式（photoFallState === 'active'）期間直接點 Preview
  // 標籤：見 openPreviewPage() 內對 photoFallModeActive 的特例判斷（負責
  // 觸發下面的凍結）、useSlideCover 分支內 settleAfterCover()（preview 的
  // 照片真正蓋滿畫面那一刻，呼叫下面的 resumeDvdFloatAfterPhotoFallCover()）、
  // 以及 closePreviewPage() 內的 closingBackToPhotoFall（使用者點一下關閉
  // preview、要回到堆疊頁面那一刻，呼叫下面的 dropDvdBackIntoPhotoFall()）。
  let previewFromPhotoFall = false; // 記錄這次開啟的 preview 是不是從堆疊模式底下打開的

  // ---------- Preview 的照片真正蓋滿畫面後：e 脫離物理世界，恢復成一般飄動狀態 ----------
  function resumeDvdFloatAfterPhotoFallCover(){
    if(!previewFromPhotoFall) return; // 使用者可能在蓋下來的動畫播完之前就已經按了關閉
                                       // （見 dropDvdBackIntoPhotoFall()），那種情況已經處理過了，這裡不用再重複做一次
    document.body.classList.remove('pf-dvd-covering');

    // 修正：openPreviewPage() 現在改成只要 photoFallModeActive 就認定是
    // 「從堆疊模式底下打開」（見該處完整說明），這也包含使用者剛好在雙擊
    // 收起堆疊（exitPhotoFallMode() 進入 'exiting'）之後、整批照片還沒真正
    // 掉出畫面前，緊接著又按了 Preview 的情況。這種情況下，蓋下來的這段
    // 時間裡，原本的堆疊收場流程可能已經自己跑完了（exitPhotoFallMode()
    // 的輪詢偵測到全部掉出畫面、呼叫 finishExitPhotoFallMode()）——它已經
    // 負責把 photoFallModeActive 設回 false、把飄動的 e 恢復成正常飄動
    // （重新呼叫 startDvdBounce()）、也已經觸發首頁縮圖重新放大進場的
    // 動畫。這裡如果不判斷、照樣往下走完整套「讓 e 脫離物理世界、恢復
    // 飄動」的邏輯，會在 finishExitPhotoFallMode() 已經處理好的飄動狀態上
    // 再蓋一次隨機方向／位置，讓 e 出現不該有的跳動；如果使用者關閉
    // preview 時又誤判成要「掉回堆疊」，堆疊其實已經不存在了，也會出錯。
    // photoFallModeActive 在這裡如果已經是 false，代表就是這種「已經自己
    // 收尾完畢」的情況——不需要（也不應該）再重複處理，直接結束即可。
    if(!photoFallModeActive) return;

    const Matter = window.Matter;
    if(Matter && pfEngine && pfDvdItem){
      Matter.Composite.remove(pfEngine.world, pfDvdItem.body);
    }
    pfDvdItem = null;
    // 從按下 Preview 到這一刻蓋滿畫面為止，整個物理世界（飄動的 e＋底下
    // 堆疊照片）都持續正常運作、沒有被提早凍結（見 openPreviewPage() 內
    // 的說明），這裡才是真正該讓它停下來的時間點：preview 已經完全蓋住
    // 畫面，不管停不停使用者都看不出差異，純粹是省下沒必要的運算，也讓
    // dropDvdBackIntoPhotoFall() 之後重新 Runner.run() 的行為跟原本設計
    // 一致（那邊預期的是「進來時停、關閉時才重新啟動」）。
    if(Matter && pfRunner){ pfStopLoop(); pfRunnerPaused = true; }
    // e 目前畫面上的位置（物理世界凍結那一刻停在哪裡）就是它恢復飄動的
    // 起始位置，讀出目前的 transform 換算回 dvdX/dvdY，接上飄動迴圈的座標
    // 系統，才不會有瞬間跳位。
    measureDvdSize();
    const rect = dvdBounce.getBoundingClientRect();
    dvdX = rect.left;
    dvdY = rect.top;
    dvdBounce.style.transition = '';
    dvdBounce.style.transform = `translate(${dvdX}px, ${dvdY}px)`;
    setDvdDirection(Math.random() * Math.PI * 2); // 從靜止的堆疊狀態重新出發，隨機挑一個飄動方向
    dvdSpeed = DVD_SPEED;
    dvdDecaying = false;
    if(!dvdDragging && !dvdRAF){
      dvdLastTime = null;
      dvdRAF = requestAnimationFrame(stepDvdBounce);
    }
  }

  // ---------- 使用者關閉 preview、回到堆疊頁面：e 立刻恢復重力，原地掉回堆疊 ----------
  function dropDvdBackIntoPhotoFall(){
    previewFromPhotoFall = false;
    document.body.classList.remove('pf-dvd-covering'); // 保險：蓋下來的動畫可能還沒播完就被使用者提早關閉
    if(dvdRAF){ cancelAnimationFrame(dvdRAF); dvdRAF = null; }
    dvdDragging = false;
    dvdBounce.classList.remove('dvd-grabbing');
    const Matter = window.Matter;
    if(Matter && pfEngine){
      if(!pfDvdItem){
        // e 已經恢復飄動過（蓋下來的動畫已經播完），這裡要重新建立一個新的
        // 物理 body，把它目前飄動到的座標帶回物理世界，才能接上重力掉回
        // 堆疊；如果蓋下來的動畫還沒播完就被關閉，pfDvdItem 這時其實還在
        // 如果蓋下來的動畫還沒播完就被關閉，pfDvdItem 這時其實還在
        // 世界裡正常運作中（現在改成蓋滿畫面那一刻才凍結，見
        // openPreviewPage() 內的說明），不需要重建，直接跳過這一段。
        measureDvdSize();
        const dvdBody = Matter.Bodies.rectangle(dvdX + dvdW / 2, dvdY + dvdH / 2, dvdW, dvdH, {
          restitution: 0.3, // 0.8 太接近全彈跳，多顆疊在一起的照片互相碰撞時會一直小幅度來回彈、看起來在抖動；調低到 0.3，還有一點回彈感，但不會抖個不停
          friction: 0.55,
          frictionAir: 0.012,
          density: 0.0026,
          chamfer: { radius: 4 },
          collisionFilter: { category: PF_CATEGORY_DVD }, // 見 startPhotoFallEngine() 內同一個屬性的說明
        });
        Matter.Composite.add(pfEngine.world, dvdBody);
        pfDvdItem = { body: dvdBody, w: dvdW, h: dvdH };
        dvdBounce.style.transition = 'none';
      }
      // 只有在物理世界真的已經被停下來的情況下（pfRunnerPaused，見該旗標
      // 的完整說明）才需要重新呼叫 Runner.run()：使用者如果是在蓋滿畫面
      // 之前就提早關閉 preview，runner 這段期間其實從頭到尾沒被停過，
      // 這裡就不能再呼叫一次 Runner.run()，否則會疊加出第二個
      // requestAnimationFrame 迴圈，讓物理模擬速度變兩倍。
      if(pfRunner && pfRunnerPaused){ pfStartLoop(); pfRunnerPaused = false; }
    }
  }

  // ---------- preview ↔ 首頁：「整塊滑動」轉場的共用設定 ----------
  // 原本這套「整塊從正上方蓋下來 / 往上滑走」的轉場只套用在桌機／平板，
  // 手機版另外走一套純 opacity 淡入淡出。使用者要求手機版改成跟桌機版
  // 完全同一種形式——一樣是整塊從畫面正上方蓋下來/滑走，一樣的時長、
  // 一樣的速度曲線（不要手機另外套一條「線性」或其他曲線，物理感要
  // 完全一致）——所以拿掉原本依螢幕寬度切換兩套轉場的判斷，統一全裝置
  // 都走這一套滑動轉場；下面 --preview-slide-duration / --preview-slide-ease
  // 這兩個變數本來就定義在 :root（不分螢幕寬度），現在全裝置共用同一份，
  // 天生保證「同樣的加速度、同樣流暢」，不需要另外同步兩處數字。
  const PREVIEW_SLIDE_DURATION_MS = 420; // 跟 CSS 的 --preview-slide-duration（.42s）保持同一個數字
  const PREVIEW_SLIDE_FALLBACK_MS = PREVIEW_SLIDE_DURATION_MS + 130; // 保底逾時：萬一某些瀏覽器邊界情況下 transitionend 沒有觸發，最多等動畫時長再加一點緩衝就強制收尾，不要讓頁面卡在滑一半的狀態

  let previewClosing = false; // 「往上滑走」轉場進行中的旗標，避免重複觸發疊加動畫
  let previewOpening = false; // 「往下蓋下來」轉場進行中的旗標，避免重複觸發疊加動畫

  function openPreviewPage(pushHistory, instant){
    if(pushHistory === undefined) pushHistory = true;
    if(!previewOddPhotos.length || !previewEvenPhotos.length) return;

    // ---------- 從照片物理堆疊模式按 Preview 進來的特例 ----------
    // 使用者可能在堆疊模式期間直接點 Preview 標籤：飄動的 e（以及底下已經
    // 落地不動的堆疊照片）這裡「不」立刻凍結物理世界——讓它們照常繼續
    // 運作，飄動的 e 會維持正常的碰撞／彈跳動作，直到下面 useSlideCover
    // 分支內 settleAfterCover() 偵測到 preview 的照片真正蓋滿整個畫面那一
    // 刻，才在 resumeDvdFloatAfterPhotoFallCover() 裡把整個物理世界的時鐘
    // 停下來、同時讓飄動的 e 脫離物理世界、恢復成一般的飄動狀態（那時已經
    // 被 preview 完全蓋住，畫面上不會看到任何切換的痕跡）。
    // pf-dvd-covering 這個 class 純粹是疊圖順序的處理：把飄動字（原本
    // z-index:99999，全站最高）暫時壓到 preview-page（900）之下，讓
    // preview 蓋下來的照片能真的視覺上蓋過它，不會穿幫地浮在最上層；
    // 15 張堆疊照片本身則是靠 CSS body.photo-fall-active.preview-active
    // 這條規則自動被蓋住（見該處說明），不需要另外用 JS 處理，也跟物理
    // 世界要不要繼續運作無關。
    //
    // 修正：這裡原本只認 photoFallState === 'active' 這一種狀態，'entering'
    // （15 張照片還在陸續掉進來）、'exiting'（雙擊收起、整批正在掉出畫面）、
    // 'reshuffling'（單擊換批、舊照片正在掉出畫面）這三種過渡狀態按下
    // Preview 完全不會被這裡認出來——不會加上 pf-dvd-covering、
    // previewFromPhotoFall 也維持 false。結果是：飄動的 e／堆疊照片其實
    // 還照常在物理世界裡運作，蓋下來的 preview 卻完全不知道自己是從堆疊
    // 模式底下打開的；使用者關閉 preview 時，closePreviewPage() 因為讀到
    // previewFromPhotoFall 是 false，會誤判成「要回到首頁格子」，提早把
    // 首頁縮圖的放大進場動畫播出來——這正是「堆疊照片在前面、後面是正常
    // 首頁」同時並存的成因之一：首頁格子其實已經被重新顯示，只是暫時被
    // 還沒收乾淨的堆疊畫面擋在前面。
    // 改成只要 photoFallModeActive 是 true（entering／active／exiting／
    // reshuffling 這整段期間都是 true，見該旗標的定義），不管當下是哪一個
    // 細部狀態，一律視為「這次 Preview 是從堆疊頁面底下打開的」，讓後續
    // 蓋下來、關閉的整套邏輯都能正確辨識、正確收尾，不會再有堆疊畫面跟
    // 首頁格子同時出現的情況。
    if(!previewFromPhotoFall && photoFallModeActive){
      previewFromPhotoFall = true;
      document.body.classList.add('pf-dvd-covering');
      // 每次重新開始一輪「從堆疊模式底下打開 preview」都要重設成 false：
      // 這個旗標只該反映「這一輪蓋住畫面期間，堆疊是不是自己在背後跑完
      // 收場流程」（見 finishExitPhotoFallMode() 內設成 true 的地方、
      // closePreviewPage() 內消耗它的說明）。如果不在這裡歸零，萬一
      // 上一次是「單純在首頁雙擊收起堆疊、完全沒有經過 preview」的正常
      // 流程，finishExitPhotoFallMode() 一樣會把它設成 true，但那次根本
      // 沒有任何地方會去消耗它——這個「過期的 true」會一路殘留，直到這
      // 一輪才被誤判成「這次也已經播過了」，害這次真正需要播放的首頁進場
      // 動畫被平白跳過。
      photoFallGridAlreadyRevealed = false;
    }

    // 不管使用者當下是在首頁網格還是照片詳細頁進來（後者代表是從詳細頁
    // 按 Preview，底下留著 detail-active，見下面的說明），preview 頁本身
    // 都該看得到飄動的 e——先把 openDetail() 可能加上的 dvd-hidden 拿掉，
    // 讓它照 CSS 那條帶回彈的 transition 快速放大＋淡入出現。就算目前
    // 根本沒有這個 class（例如本來就是從首頁開的），classList.remove 對
    // 沒有這個 class 的元素也是無害的重複操作。
    dvdBounce.classList.remove('dvd-hidden');
    // 如果剛剛是從「preview 關閉、退回詳細頁」那條路徑暫停掉物理迴圈
    // （見 closePreviewPage() 內 closingBackToDetail 的說明），這裡重新
    // 打開 preview 時要記得接回去，飄動的 e 才不會停在原地不動；直接從
    // 暫停當下的 dvdX/dvdY 繼續飄，不重新隨機取位置/方向。
    if(!photoFallModeActive && !dvdDragging && !dvdRAF){
      dvdLastTime = null;
      dvdRAF = requestAnimationFrame(stepDvdBounce);
    }

    // 不管使用者當下是在首頁網格還是照片詳細頁，這裡都不主動關閉/清空
    // 詳細頁的狀態，讓它原封不動留在 preview 底下——因為 preview-page
    // 的 z-index（900）本來就比 detail-page（50）高、蓋起來時又是完全
    // 不透明的白底，兩者疊在一起使用者也看不出底下是首頁還是詳細頁。
    // 好處是等使用者關閉 preview 時（見 closePreviewPage()），只要保留
    // 原本就在的東西不去動它，自然就會「回到剛剛蓋下來之前所在的那個
    // 畫面」——是首頁網格就留在首頁，是照片詳細頁就留在同一張照片，
    // 不會被強制導回首頁。
    hideHoverPreview();

    if(previewClosing){
      // 使用者在「往上滑走」轉場還沒播完時就又要開啟：立刻打斷關閉動畫，
      // 不要讓兩個方向的滑動轉場疊在一起互相打架
      previewPage.classList.remove('preview-slide-exit', 'no-fade');
      // 上面關閉動畫如果正在讓 collab 同步淡出（見 closePreviewPage() 內
      // collab-slide-exit 的說明），這裡也要一併打斷、拿掉，不然 collab
      // 會卡在被強制 opacity:0 的狀態——重新開啟 preview 後，collab 應該
      // 跟一般「從照片詳細頁按 Preview」一樣正常顯示（見 CSS 中
      // body.detail-active:not(.preview-active) 那條規則旁的完整說明）。
      document.body.classList.remove('collab-slide-exit');
      previewClosing = false;
    }

    document.body.classList.add('preview-active');
    // 注意：這裡不再連帶加上 preview-header-white（文字轉白色的 class）。
    // 下面 useSlideCover 分支（現在涵蓋所有裝置寬度）會改成動態量測照片
    // 實際滑動到的位置，等真的蓋過 header 那一整排才加上（見該分支內
    // checkCoverProgress 的完整說明）；instant（進站當下瞬間開啟）這種
    // 情境沒有這個時間差問題，該分支裡會立刻加上，效果跟原本一樣。字重維持
    // 全站統一的 350、不再有 preview 專屬的 260，所以不會再有「切換
    // preview 瞬間文字寬度跟著變、對齊偏移量對不準」的問題。這裡呼叫
    // syncFixedChrome() 純粹是保底：確保進入 preview 前 header 的對齊都
    // 是最新狀態，不影響任何視覺切換時機。
    syncFixedChrome();
    document.body.style.overflow = 'hidden';

    const useSlideCover = !instant; // 現在不分裝置寬度，全部走同一套滑動蓋下來轉場，只有「進站當下瞬間開啟」這個特例不需要動畫

    if(instant){
      // 進站當下第一次自動開啟：先關掉淡入動畫再切成 active，讓 opacity
      // 直接一步到位變成 1，不會有中間值讓底下的首頁網格透出來；下一個
      // 影格再把這個 class 拿掉，之後使用者手動開關 preview 都還是原本
      // 平滑的轉場。
      previewPage.classList.add('no-fade');
      void previewPage.offsetHeight; // 強制 reflow，確保上面這行先生效
      previewPage.classList.add('active');
      // 進站當下這一步是瞬間切成完全不透明，沒有前面提到的那段時間差
      // 問題，文字可以跟著同一刻直接轉白，不需要額外延後。
      document.body.classList.add('preview-header-white');
      // preview 現在真的蓋滿畫面了，補呼叫一次把時鐘定位、準備好（見
      // syncClockAlignment() 內的說明）——這一刻時鐘仍然被不透明的
      // previewPage 蓋住、使用者看不到，純粹是先把位置算好、備妥。
      syncFixedChrome();
      requestAnimationFrame(() => requestAnimationFrame(() => {
        previewPage.classList.remove('no-fade');
      }));
    } else if(useSlideCover){
      previewOpening = true;
      // 整塊從畫面正上方「蓋下來」，不分手機／平板／桌機，全部共用同一套
      // 時長／速度曲線（見 CSS 的 --preview-slide-duration /
      // --preview-slide-ease），物理感完全一致。
      // 先用 no-fade + preview-slide-start 把 opacity/visibility/transform
      // 一次到位「瞬間」定位到畫面正上方（不透明、但整塊在畫面外），下一
      // 影格才拿掉 no-fade、換成 preview-slide-cover，讓瀏覽器真的先畫出
      // 「在畫面正上方」這一幀，接下來的 transform 變化才會被當成一段可以
      // 播放的轉場，而不是被瀏覽器合併成一次跳過中間過程的瞬間變化。
      previewPage.classList.add('no-fade');
      previewPage.classList.add('preview-slide-start');
      void previewPage.offsetHeight;
      previewPage.classList.add('active');
      void previewPage.offsetHeight;

      requestAnimationFrame(() => requestAnimationFrame(() => {
        previewPage.classList.remove('no-fade');
        previewPage.classList.remove('preview-slide-start');
        previewPage.classList.add('preview-slide-cover');
        // 照片從畫面正上方往下蓋的 transform 從這一刻才真正開始播放
        // （前面 preview-slide-start 只是把它瞬間定位到畫面外，沒有任何
        // 移動）。
        // 滑動用的是 easeInQuart 系速度曲線（--preview-slide-ease：前段
        // 明顯較慢、後段才加速），如果只用「動畫開始的同一刻」或「總時長
        // 的固定比例」去估算「什麼時候真的蓋過上排大標題」都會不準——
        // 前段慢代表照片其實還要花一段時間才會真正經過 header 那一整排。
        // 改成每一影格直接讀瀏覽器算出來的即時位置：previewPage 套用
        // transform 後 getBoundingClientRect().bottom 就是「照片目前蓋到
        // 畫面上的哪一條線」，等這條線的位置超過 .fixed-header 本身的下緣
        // （代表照片這一刻已經整片蓋過標題那一排），才在這一刻加上
        // preview-header-white、讓文字轉白色的 0.22s transition 從這裡才
        // 開始播放。這樣不管速度曲線前段多慢，永遠是跟畫面上真正發生的
        // 進度同步，而不是用時間去猜測。
        let colorTriggered = false;
        const fixedHeaderEl = document.querySelector('.fixed-header');
        const headerBottomY = fixedHeaderEl
          ? fixedHeaderEl.getBoundingClientRect().bottom
          : 0;
        const triggerHeaderColor = () => {
          if(colorTriggered || !previewOpening) return;
          colorTriggered = true;
          document.body.classList.add('preview-header-white');
        };
        const checkCoverProgress = () => {
          if(colorTriggered || !previewOpening) return;
          if(previewPage.getBoundingClientRect().bottom >= headerBottomY){
            triggerHeaderColor();
            return;
          }
          requestAnimationFrame(checkCoverProgress);
        };
        requestAnimationFrame(checkCoverProgress);
        // 保底：極端情況下（例如量測異常、或滑動被中途打斷後又立刻恢復）
        // 最多等到滑動動畫的保底逾時時間就強制轉白，避免文字卡在黑色
        // 永遠不會轉過去。
        setTimeout(triggerHeaderColor, PREVIEW_SLIDE_FALLBACK_MS);

        let settled = false;
        const settleAfterCover = () => {
          if(settled) return;
          settled = true;
          previewPage.removeEventListener('transitionend', onCoverEnd);
          // 蓋下來的動畫已經跑完，整塊回到正常覆蓋畫面的位置，這裡把
          // preview-slide-cover 拿掉純粹是回收 class（transform 的目標值
          // 本來就是 translate3d(0,0,0)，跟 .preview-page 預設的
          // translateZ(0) 視覺上是同一個位置，拿掉不會有任何跳動）。
          previewPage.classList.remove('preview-slide-cover');
          previewOpening = false;
          // 動畫已經結束，保底一定要轉白（正常情況下這時 colorTriggered
          // 早就是 true 了，這裡純粹是防呆：萬一上面量測到最後一刻都沒有
          // 觸發，收尾時強制補上，不留下文字停在黑色的邊界情況）。
          triggerHeaderColor();
          // preview 的照片這一刻已經真正蓋滿整個畫面：如果這次是從堆疊模式
          // 底下打開的（見上面 openPreviewPage() 內的說明），輪到飄動的 e
          // 脫離物理世界、恢復成一般飄動狀態的時候了。
          resumeDvdFloatAfterPhotoFallCover();
        };
        const onCoverEnd = (e) => {
          if(e.target !== previewPage || e.propertyName !== 'transform') return;
          settleAfterCover();
        };
        previewPage.addEventListener('transitionend', onCoverEnd);
        setTimeout(settleAfterCover, PREVIEW_SLIDE_FALLBACK_MS);
      }));
    }

    // 把目前網址記錄成 #preview，這樣重新整理頁面時才知道要留在這頁，
    // 而不是每次都跳回首頁
    if(pushHistory && location.hash !== '#preview'){
      history.pushState({ page: 'preview' }, '', '#preview');
    }

    // 每次重新進入都重新隨機挑一張起始張（見 warmPreviewStart 內的說明），
    // 並確保起始畫面已經暖機好，這裡如果先前已經暖過就直接沿用快取，幾乎不用等
    warmPreviewStart();
    startPreviewCycle();

    // 注意：EDEN 飄動字現在是貫穿全站的元素，從進站那一刻就開始跑，
    // 進出 preview 頁面完全不需要（也不應該）重新啟動或重新定位它——
    // 這正是「切換頁面不會有任何震動」的原因。
  }

  // 「首頁網格已經準備好、不會是白的」的判斷：只看一開啟就在第一畫面內、
  // 會被立刻看到的前 GRID_EAGER_COUNT 張縮圖是否都已經真的載入完成（帶有
  // .loaded class——這個 class 是 renderGrid() 裡每張圖片的 load 事件加上
  // 的，見上面）。往上滑開的動態轉場裡，畫面下緣會最先露出網格、上緣（含
  // header 那一整排）最後才露出，這批 eager 縮圖涵蓋的正是「首次進站會看到
  // 的第一畫面」，跟滑動轉場實際會露出來的範圍一致，不需要另外算捲動位置。
  function isHomeGridVisuallyReady(){
    if(!grid) return true;
    const items = grid.querySelectorAll('.grid-item');
    if(!items.length) return false;
    const eagerCount = Math.min(GRID_EAGER_COUNT, items.length);
    for(let i = 0; i < eagerCount; i++){
      const img = items[i].querySelector('img');
      if(!img || !img.classList.contains('loaded')) return false;
    }
    return true;
  }

  // 用 requestAnimationFrame 輪詢代替另外掛一整排 load 事件監聽器：每一影格
  // 檢查一次是否全部就緒，一就緒立刻執行轉場；設一個 600ms 的保底上限，
  // 避免極端情況下（例如某張圖片遲遲載入失敗、onerror 還在重試備援網址）
  // 使用者點了卻卡住看不到任何反應——寧可讓極少數情況下還是看到一瞬間沒
  // 載完的縮圖，也不要讓轉場整個卡住不會發生。
  function whenHomeGridReady(callback){
    if(isHomeGridVisuallyReady()){ callback(); return; }
    const maxWaitMs = 600;
    const startedAt = performance.now();
    const poll = () => {
      if(isHomeGridVisuallyReady() || (performance.now() - startedAt) >= maxWaitMs){
        callback();
        return;
      }
      requestAnimationFrame(poll);
    };
    requestAnimationFrame(poll);
  }

  // 兩種關閉路徑（手機淡出 / 桌機滑開）收尾要做的事完全一樣：body class、
  // 對齊重算、恢復捲動、preview 自動循環停止、網址列同步，拆成共用函式，
