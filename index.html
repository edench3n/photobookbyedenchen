    const now = performance.now();
    dvdRotateSamples.push({ t: now, deg: dvdRotationDeg });
    while(dvdRotateSamples.length > 1 && now - dvdRotateSamples[0].t > DVD_ROTATE_FLING_WINDOW_MS){
      dvdRotateSamples.shift();
    }
    const first = dvdRotateSamples[0];
    const last = dvdRotateSamples[dvdRotateSamples.length - 1];
    const dt = Math.max(1, last.t - first.t) / 1000;
    const angularVel = (last.deg - first.deg) / dt;
    // 上限抓寬鬆一點（DVD_ROTATION_MAX_VEL 的兩倍）：撞牆的旋轉衝量本來
    // 就是很輕巧的力道，兩指旋轉是使用者主動、明確的手勢，容許轉得更快，
    // 純粹保底避免觸控座標量測雜訊在極端情況下算出離譜的數值。
    dvdRotationVel = Math.max(-DVD_ROTATION_MAX_VEL * 2, Math.min(DVD_ROTATION_MAX_VEL * 2, angularVel));
  }

  // 拖曳位置期間，旋轉手指放開後如果還留有角速度，起這個小迴圈接手讓它
  // 自然衰減；一旦真的放開整個拖曳、或使用者重新按上旋轉手指，就讓出
  // 控制權（見下面 guard），不會跟主迴圈或手動旋轉互相打架。
  function startDvdDragRotationDecay(){
    if(dvdDragRotRAF) return; // 已經在跑了
    dvdDragRotLastTime = null;
    dvdDragRotRAF = requestAnimationFrame(stepDvdDragRotationDecay);
  }
  function stepDvdDragRotationDecay(timestamp){
    if(!dvdDragging || dvdRotatePointerId !== null){
      // 已經放開整個拖曳（交給主迴圈 stepDvdBounce 接手）、或又重新按上
      // 旋轉手指（角度改由手勢直接控制，不需要這裡的自動衰減）：停止。
      dvdDragRotRAF = null;
      dvdDragRotLastTime = null;
      return;
    }
    if(dvdDragRotLastTime === null) dvdDragRotLastTime = timestamp;
    const dt = Math.min(48, timestamp - dvdDragRotLastTime) / 1000;
    dvdDragRotLastTime = timestamp;
    stepDvdRotation(dt);
    dvdBounce.style.transform = dvdTransformString(dvdX, dvdY);
    if(dvdRotationVel === 0){
      // 已經自然衰減到 0，不用繼續空轉這個迴圈，等下一次真的又有新的旋轉
      // 動作（重新抓旋轉手指、或再放開一次）才會重新啟動。
      dvdDragRotRAF = null;
      dvdDragRotLastTime = null;
      return;
    }
    dvdDragRotRAF = requestAnimationFrame(stepDvdDragRotationDecay);
  }

  // 第二根手指落下、確定要開始兩指旋轉手勢：記錄基準角度（跟第一根手指
  // 目前位置連線的角度），之後 dvdRotatePointerMove() 只需要逐影格算跟
  // 上一次的差值疊加上去即可（見上面 dvdRotateLastAngle 的完整說明）。
  let dvdRotateTouchX = 0, dvdRotateTouchY = 0; // 目前負責旋轉手勢的第二根手指最新的螢幕座標，
    // 跟 dvdPrimaryTouchX/dvdPrimaryTouchY 是同一種「兩指連線」端點，只是這根換成旋轉手指。
    // 拆成獨立、隨時更新的變數（而不是只在旋轉手指自己的 pointermove 裡臨時用區域變數算），
    // 是修正下面「拖曳中軸心跑偏」那個 bug 的關鍵，見 applyDvdTwoFingerRotation() 的說明。

  function startDvdRotateGesture(e){
    dvdRotatePointerId = e.pointerId;
    try{ dvdBounce.setPointerCapture(e.pointerId); }catch(err){}
    // 開始手動旋轉的當下，先把殘留的物理旋轉角速度（例如剛撞完牆還沒轉完）
    // 歸零，改成完全交給手勢直接控制角度，避免兩者疊加造成轉速異常、或者
    // 手一放開又混雜了撞牆殘留的角速度，跟使用者這一下的手勢完全對不上。
    dvdRotationVel = 0;
    dvdRotateTouchX = e.clientX;
    dvdRotateTouchY = e.clientY;
    dvdRotateLastAngle = Math.atan2(dvdRotateTouchY - dvdPrimaryTouchY, dvdRotateTouchX - dvdPrimaryTouchX);
    dvdRotateSamples = [{ t: performance.now(), deg: dvdRotationDeg }];
  }

  // 修正「兩指旋轉時軸心跑偏」：不管是負責拖曳位置的主要手指動了、還是負責
  // 旋轉的手指動了，都要呼叫這支函式，用「兩指目前各自最新的座標」重新算一次
  // 「兩指連線」的角度、跟上一次記下的角度取差值來累加旋轉角度——這是市面上
  // 兩指旋轉手勢（例如 Google 地圖雙指扭轉指北針、Photoshop／Procreate 的兩指
  // 旋轉）共通的標準做法：角度基準永遠跟著「這一影格兩指的即時位置」同步更新，
  // 不會只綁在其中一根手指的移動事件上。
  //
  // 原本的 bug：只有旋轉手指的 pointermove（原本的 dvdRotatePointerMove）會
  // 重新算角度、更新 dvdRotateLastAngle 這個基準值；負責拖曳位置的主要手指
  // 移動時（dvdPointerMove）只更新了 dvdPrimaryTouchX/Y，卻沒有同步更新
  // dvdRotateLastAngle。於是「兩指連線」這個向量其實已經因為主要手指被拖著
  // 移動而悄悄轉了一個角度，但基準值沒跟上；下一次旋轉手指再觸發 pointermove
  // 時，算出來的 deltaRad 就會把「這段期間單純因為拖曳、主要手指位置改變」
  // 也一起誤算成使用者主動做的旋轉手勢，看起來就像轉動的軸心跟著拖曳方向跑偏、
  // 轉起來的角度跟手指實際轉的幅度對不上。
  // 修法：兩根手指共用同一支函式，任何一根手指移動都立刻重新算一次角度並套用
  // 差值，角度基準值永遠跟最新一影格同步，就不會再有這種累積誤差。
  function applyDvdTwoFingerRotation(){
    if(dvdRotatePointerId === null) return; // 目前沒有兩指旋轉手勢在進行，不用算
    const angle = Math.atan2(dvdRotateTouchY - dvdPrimaryTouchY, dvdRotateTouchX - dvdPrimaryTouchX);
    let deltaRad = angle - dvdRotateLastAngle;
    // 正規化到 -PI ~ PI：兩指連線角度剛好跨過 180° 那一瞬間，直接相減會
    // 從接近 +PI 瞬間跳到接近 -PI（或反過來），這裡修正回「這一影格實際
    // 轉動的最短角度」，物件才不會在那一刻無故瞬間轉一大圈。
    while(deltaRad > Math.PI) deltaRad -= Math.PI * 2;
    while(deltaRad < -Math.PI) deltaRad += Math.PI * 2;
    dvdRotateLastAngle = angle;
    dvdRotationDeg += deltaRad * 180 / Math.PI;
    dvdBounce.style.transform = dvdTransformString(dvdX, dvdY);

    const now = performance.now();
    dvdRotateSamples.push({ t: now, deg: dvdRotationDeg });
    while(dvdRotateSamples.length > 2 && now - dvdRotateSamples[0].t > DVD_ROTATE_FLING_WINDOW_MS){
      dvdRotateSamples.shift();
    }
  }

  function dvdRotatePointerMove(e){
    if(e.pointerId !== dvdRotatePointerId) return;
    e.preventDefault();
    dvdRotateTouchX = e.clientX;
    dvdRotateTouchY = e.clientY;
    applyDvdTwoFingerRotation();
  }

  // 結束旋轉手勢（放開手指、手勢被系統取消、或主要拖曳手指先放開）共用
  // 的收尾：算出甩轉的角速度、釋放 pointer capture，並視情況啟動上面的
  // 拖曳期間自動衰減小迴圈。
  function endDvdRotateGesture(pointerId){
    if(dvdRotatePointerId === null || pointerId !== dvdRotatePointerId) return;
    try{ dvdBounce.releasePointerCapture(dvdRotatePointerId); }catch(err){}
    dvdRotatePointerId = null;
    finalizeDvdRotateVelocity();
    startDvdDragRotationDecay();
  }

  function dvdRotatePointerUp(e){
    if(e.pointerId !== dvdRotatePointerId) return;
    endDvdRotateGesture(e.pointerId);
  }

  // ---------- 飄動的「e」撞擊時的旋轉 ----------
  // 每次真的撞到東西（螢幕邊界或頁面內的圖片）就給一個角速度衝量，之後
  // 不是瞬間停掉，而是跟現有的風力／甩動系統（dvdNudgeVY）同一種寫法：
  // 用指數衰減自然地把角速度慢慢磨掉——撞完那一刻角速度最高，之後持續
  // 旋轉、速度逐格慢慢變小，直到自然停下來，是一段連續的過程，不是「撞了
  // 動一下就停」的瞬間跳動。角度本身連續累加、靠 requestAnimationFrame
  // 每影格更新，視覺上完全平滑。
  let dvdRotationDeg = 0; // 目前角度（度），連續累加，不需要 mod 360，CSS rotate() 本來就吃得下任意大小的角度
  let dvdRotationVel = 0; // 目前角速度（度／秒），每影格自然衰減
  // 撞擊疊加的角速度衝量，依據撞擊當下速度在「牆面切線方向」上的分量比例
  // 決定力道——這是真實世界裡球體撞牆會轉的物理成因：讓球轉起來的是切線
  // 方向（貼著牆面）的滑動摩擦，不是撞擊有多正面。貼著牆面滑過去、擦邊撞
  // （切線分量大）摩擦帶來的旋轉也大；幾乎垂直正面撞上去（切線分量趨近 0，
  // 力幾乎全部沿法線方向），現實中反而幾乎不轉。
  const DVD_ROTATION_KICK_MIN_DEG_PER_SEC = 16; // 切線分量趨近 0（幾乎正面撞上）時的下限衝量——調小過，撞擊帶來的角度影響整體再收斂一點
  const DVD_ROTATION_KICK_MAX_DEG_PER_SEC = 95; // 切線分量趨近 1（貼著牆面擦邊滑過）時的上限衝量——同樣調小過
  const DVD_ROTATION_SPEED_FACTOR_MIN = 0.65; // 當下移動速度偏慢時，力道再往下修正的下限倍率——撞得輕，轉得也該輕一點
  const DVD_ROTATION_SPEED_FACTOR_MAX = 1.35;  // 當下移動速度偏快（例如甩出去的瞬間）時，力道再往上放大的上限倍率，跟著整體調小一點，避免高速撞擊時角度變化還是偏大
  const DVD_ROTATION_MAX_VEL = 150; // 角速度上限（度／秒）：短時間內連續撞好幾下、衝量疊加太多時的保底夾限，跟著整體力道範圍一起調小
  // 衰減係數大幅調低（原本 3.2 太大，撞一下大概 1 秒內就磨完，看起來像
  // 「抖一下」而不是持續旋轉）。現在 0.85 的半衰期大約 0.8 秒，一次中等
  // 力道的撞擊要花 3~5 秒才會慢慢磨到看不出來，感覺是「撞了之後真的轉了
  // 一段時間，然後慢慢停下來」，比較貼近真實世界裡帶著角動量轉動、靠
  // 空氣阻力慢慢消耗掉的手感。
  const DVD_ROTATION_FRICTION_PER_SEC = 0.85;
  // 平滑曲線（smoothstep）：0~1 之間，兩端變化平緩、中段變化較快，比純
  // 線性內插更貼近眼睛對「力道漸強」的自然感受，避免力道隨切線分量線性
  // 變化時，觀感上顯得生硬、機械。
  function smoothstep01(t){
    const c = Math.max(0, Math.min(1, t));
    return c * c * (3 - 2 * c);
  }
  // 把目前累積的角速度換算成這一影格的角度變化量，並依 dt 做指數衰減——
  // 跟 dvdNudgeVY 那段風力衰減是同一套寫法，過程永遠是平滑曲線。
  function stepDvdRotation(dt){
    if(dvdRotationVel === 0) return;
    dvdRotationDeg += dvdRotationVel * dt;
    dvdRotationVel *= Math.exp(-DVD_ROTATION_FRICTION_PER_SEC * dt);
    if(Math.abs(dvdRotationVel) < 0.3) dvdRotationVel = 0; // 小到看不出差異時直接歸零收尾，不留無窮小的殘留值一直跑下去（門檻跟著衰減係數一起調低，避免尾韻被提早切斷）
  }
  // 撞擊那一刻呼叫：疊加一次角速度衝量。turnSign 決定往哪個方向轉，magnitude
  // 是呼叫端已經算好、貼合這一下實際撞擊物理的最終力道（度／秒），這裡只
  // 負責疊加＋夾限，不重複做任何換算。
  function kickDvdRotation(turnSign, magnitude){
    dvdRotationVel += turnSign * magnitude;
    dvdRotationVel = Math.max(-DVD_ROTATION_MAX_VEL, Math.min(DVD_ROTATION_MAX_VEL, dvdRotationVel));
  }
  // 統一組出目前這一影格該用的 transform 字串（位置＋角度），所有更新
  // dvdBounce.style.transform 的地方都呼叫這個，角度永遠一起帶上，不會有
  // 某個分支忘記帶、看起來瞬間轉回 0 度的情況。
  function dvdTransformString(x, y){
    return `translate(${x}px, ${y}px) rotate(${dvdRotationDeg}deg)`;
  }

  // 元素目前實際渲染出來的視覺尺寸（現在等於圖片本身的實際大小，容器已經
  // 拿掉多餘的按鍵熱區 padding）——撞牆邊界用這個算，不再像舊版那樣寫死
  // 一個固定像素值；圖片大小（clamp 隨視窗寬度連續縮放、手機版另外放大
  // 1.8 倍）改變時，這個尺寸也會跟著變，量測一次存起來，之後每次撞牆
  // 判斷都直接讀這個值，不用每一影格都重新觸發一次 layout。
  let dvdW = 0, dvdH = 0;
  // 這裡刻意不能用 dvdBounce.getBoundingClientRect()：.dvd-bounce 本身的
  // transform 就是 translate(x,y) rotate(dvdRotationDeg)（見上面
  // dvdTransformString()），只要呼叫這支函式的當下角度不是 0（例如剛撞牆、
  // 旋轉衝量還沒衰減完；或撞牆換圖時 setDvdBounceImageSrc()→decode()
  // 是非同步的，decode 真正 resolve、觸發 remeasure() 的那一刻，物件很可能
  // 已經因為同一次撞擊在轉了——見下面 cycleDvdEImage() 呼叫點的説明），
  // getBoundingClientRect() 量到的會是「旋轉後」被撐大的外接矩形（旋轉
  // 45 度時，正方形的外接矩形邊長會變成約 1.41 倍），不是圖片本身真正的
  // 未旋轉尺寸。這個被撐大的 dvdW/dvdH 之後會拿去算螢幕邊界、也拿去把
  // 撞牆取樣點換算回像素遮罩的 0~1 本地座標（見 pixelShapesOverlap()／
  // computeDvdPixelInsets()）——一旦量錯，等於整套「像素級撞牆」判斷都
  // 是拿錯誤的框在算，撞牆感覺起來就會變回「隔著一圈空白才撞到」，這正是
  // 使用者回報「撞擊依舊是用周圍空白在撞擊邊界」在像素遮罩已經到位之後
  // 還是沒改善的實際成因。
  // 改用 offsetWidth／offsetHeight：排版尺寸，完全不受 CSS transform（含
  // 旋轉）影響，不管當下轉到幾度，量到的永遠是圖片未旋轉時的真實寬高——
  // 跟上面 getStableImgRect() 為了同一類「transform 造成量測失真」問題
  // 採用的做法一致（該函式的完整說明見其上方註解）。
  function measureDvdSize(){
    const w = dvdBounce.offsetWidth;
    const h = dvdBounce.offsetHeight;
    if(w > 0) dvdW = w;
    if(h > 0) dvdH = h;
  }

  // 目前顯示在 <img> 上的圖片來源，供下面 computeDvdPixelInsets() 查詢
  // 對應的像素遮罩用；每次換圖（見 setDvdBounceImageSrc()）都會同步更新。
  let dvdActiveImgSrc = '';

  // ---------- 撞螢幕邊界也改用「實際圖案像素」判斷，不是外框的空白 ----------
  // 上面 requestAlphaMask()／pixelShapesOverlap() 那套「像素遮罩 vs 像素
  // 遮罩」原本只用在飄動物件跟頁面內照片（首頁縮圖／詳情頁大圖）的碰撞
  // 判斷；跟螢幕四個邊界的撞牆，原本仍然單純拿「整個裁切後的矩形外框」去
  // 判斷——去背裁切只保證外框本身沒有多餘的四周留白，外框「內部」（尤其
  // 是圖案本身是異形、鏤空造型，或飄動時帶有旋轉角度）仍然可能留有大片
  // 透明區域，造成「肉眼看到的圖案明明還沒真的碰到螢幕邊緣，就已經反彈」
  // 的落差感——這正是「撞擊依舊是用周圍空白在撞擊邊界」這個回報的成因。
  //
  // 這裡補上：沿用同一份已經在算物件間碰撞用的像素遮罩，取出圖案的
  // 「輪廓像素」（見 buildAlphaMaskFromSource() 裡新增的 boundary 說明），
  // 套用目前這一影格的旋轉角度，算出圖案本身實際的上下左右最外緣，相對
  // 外框邊緣各自內縮了多少距離（inset）。撞牆邊界檢查時，把這個內縮距離
  // 加回允許的活動範圍——外框可以比原本多飄出螢幕 inset 這麼多，直到
  // 圖案本身的像素真的碰到螢幕邊緣，才會觸發反彈，不再是外框一碰到就彈開。
  // 每一影格重新算一次，是因為飄動物件會持續旋轉（見 dvdRotationDeg／
  // stepDvdRotation()），最外緣的位置會隨旋轉角度即時改變，沒辦法只算
  // 一次就沿用。運算量只跟圖案「輪廓」的像素數量成正比（見上面 boundary
  // 的說明，遠小於整張遮罩的面積），每影格重算一次不會造成效能負擔。
  // 遮罩還沒準備好（例如剛換上新圖，requestAlphaMask() 是非同步的、還沒
  // 跑完）就傳回全 0 的 inset，等同暫時退回原本「矩形外框」的行為，不會
  // 等待、也不會讓撞牆判斷暫時失靈。
  function computeDvdPixelInsets(){
    const entry = getCachedAlphaMask(dvdActiveImgSrc);
    if(!entry || !entry.boundary || !entry.boundary.length || !dvdW || !dvdH){
      return { left: 0, right: 0, top: 0, bottom: 0 };
    }
    const pts = entry.boundary;
    const theta = dvdRotationDeg * Math.PI / 180; // 跟 CSS rotate() 同方向，直接拿本地座標旋轉即可換算成目前螢幕方向下的偏移
    const cosT = Math.cos(theta), sinT = Math.sin(theta);
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for(let i = 0; i < pts.length; i += 2){
      const lx = (pts[i] - 0.5) * dvdW; // 相對外框中心點的本地座標（尚未旋轉）
      const ly = (pts[i + 1] - 0.5) * dvdH;
      const rx = lx * cosT - ly * sinT; // 旋轉之後，相對外框中心點的座標
      const ry = lx * sinT + ly * cosT;
      if(rx < minX) minX = rx;
      if(rx > maxX) maxX = rx;
      if(ry < minY) minY = ry;
      if(ry > maxY) maxY = ry;
    }
    if(minX > maxX || minY > maxY){
      return { left: 0, right: 0, top: 0, bottom: 0 };
    }
    // 換算成「外框四邊各自內縮了多少距離」。
    //
    // ---------- 修正：「圖片已經跑出邊界才有反彈」的真正殘餘成因 ----------
    // 這裡原本用 Math.max(0, …) 把結果強制夾成不小於 0，理由寫的是「旋轉
    // 不會讓圖案的像素跑到外框範圍以外」——這句話只有在「外框」指的是
    // getBoundingClientRect() 那種隨旋轉一起撐大的外接矩形時才成立；但這裡
    // minX/maxX 是拿 dvdW/dvdH（offsetWidth/offsetHeight，永遠是未旋轉的
    // 原始寬高，理由見 measureDvdSize() 的說明）當半寬高在換算 inset，兩者
    // 不是同一個框。圖案的可視像素只要夠靠近去背後的四個角（絕大多數照片
    // 裁切完都會有像素貼到至少某個角落附近），旋轉 45 度左右時，那個角上
    // 的像素離中心的距離會比 halfW/halfH 更遠——也就是 minX 真的可能小於
    // -halfW（或 maxX 大於 halfW），算出來的 inset 本來就應該是負的：
    // 代表圖案此刻的實際輪廓，比「未旋轉時的框邊」還要更往外凸出。
    // 把這種負值夾成 0，等於告訴下面 stepDvdBounce()「框邊碰到螢幕邊界時
    // 才反彈就好」，但實際上圖案的像素在框邊碰到之前，就已經先一步凸出
    // 螢幕外了——這正是「圖片已經跑出邊界才有反彈」在像素遮罩上線之後
    // 依然存在的根本原因：問題不是遮罩不準，而是這裡把「應該更早反彈」
    // 的負值訊號整個丟棄了。
    // 修法：不再夾成 0，讓 inset 可以是負值，交給下面 stepDvdBounce()／
    // clampDvdIntoViewport() 的 minX/maxX 算式自然把允許的活動範圍收緊
    // （負的 inset 會讓邊界往內縮，逼反彈提早在框邊碰到螢幕邊界之前觸發，
    // 跟圖案肉眼看到的實際邊緣同步）。極端浮點數誤差可能讓數值出現微小的
    // 正負抖動，這裡不用特別處理，量級遠小於一個像素，不影響觀感。
    const halfW = dvdW / 2, halfH = dvdH / 2;
    return {
      left: minX + halfW,
      right: halfW - maxX,
      top: minY + halfH,
      bottom: halfH - maxY
    };
  }

  // ---------- 撞牆震動 ----------
  // 只在支援 navigator.vibrate 的裝置上生效（實務上就是觸控裝置）；桌機
  // 瀏覽器本來就沒有這支 API，下面的 feature-check 會自動跳過，不需要
  // 再另外判斷「是不是手機」「是不是在哪個頁面」。
  // dvdWasCollidedLastFrame：用「邊緣觸發」而不是「只要正在撞牆就震」——
  // 撞牆瞬間 dvdX/dvdY 會被夾在邊界上（見下面 collided 判斷），如果那一幀
  // 剛好速度極慢（例如使用者用極小力道甩出去、或速度衰減到接近 0），
  // 元素可能連續好幾影格都貼在同一個邊界值上，若每一影格都判斷「有沒有
  // 貼著邊界」就震，會變成「卡住那段時間瘋狂連續震動」。改成只在「上一影格
  // 沒有貼著邊界、這一影格才剛貼上」的那個瞬間震一次，之後只要還貼著同一
  // 個邊，就不會重複觸發，直到它離開邊界、之後又撞上另一次才會再震一次。
  let dvdWasCollidedLastFrame = false;
  // 專門給 preview 頁「撞到螢幕邊界跳照片」用的邊緣觸發旗標——不分是撞到
  // 上/下/左/右哪一邊，只要是撞到螢幕邊界（跟撞到頁面內圖片的 collided
  // 分開算）就算一次候選，實際要換哪一側照片再由撞擊當下 e 落在畫面上半/
  // 下半決定（見 stepDvdBounce 裡的判斷）。
  let dvdWasScreenEdgeCollidedLastFrame = false;
  // dvdLastVibrateTime + DVD_VIBRATE_COOLDOWN_MS：再加一層保險用的最短間隔，
  // 防止某些極端情況（例如同一影格 x、y 兩個方向同時撞到角落，或裝置效能
  // 不穩定造成判斷抖動）短時間內觸發不只一次震動。
  let dvdLastVibrateTime = 0;
  const DVD_VIBRATE_COOLDOWN_MS = 120;
  function triggerDvdEdgeVibration(){
    if(!('vibrate' in navigator)) return;
    const now = performance.now();
    if(now - dvdLastVibrateTime < DVD_VIBRATE_COOLDOWN_MS) return; // 冷卻時間內，先不重複觸發
    dvdLastVibrateTime = now;
    try{ navigator.vibrate(8); }catch(err){} // 8ms：非常短、力道很輕的一次震動
  }

  // dvdX/dvdY 存的就是元素本身（border-box，現在等於圖片邊緣）左上角的
  // 位置，不再另外疊一圈抓取熱區 padding——圖片本身已經夠大、夠好點了，
  // 不需要額外的透明熱區，撞牆判斷也因此精準貼合圖片實際邊緣而不是熱區。
  function dvdBoundMinX(){ return 0; }
  function dvdBoundMinY(){ return 0; }
  // ---------- 修正：「手機版剛進站，飄動物件撞邊界卻不會切換照片」 ----------
  // 成因：這兩個函式原本直接讀 window.innerWidth/innerHeight，每一影格都
  // 是「當下這一刻」的即時視窗尺寸。手機瀏覽器（尤其 iOS/Android 上的
  // Safari／各種 App 內建 WebView）在頁面剛載入的頭 1~2 秒，網址列收合／
  // 展開的排版動畫幾乎必然會讓 innerWidth/innerHeight 連續變動好幾次——
  // 桌機完全沒有這個現象，這正是「手機版特別明顯、桌機偶爾也有（字體
  // swap 造成的一次性 reflow）、但都只發生在剛進站那幾秒」的成因。
  // 下面 stepDvdBounce() 原本有一段「這一影格視窗尺寸如果跟上一影格不同，
  // 就當成外部原因造成邊界縮小，靜默夾回、不觸發撞牆」的保護邏輯（是為了
  // 修另一個問題：手機網址列收合造成的假撞牆）——但這段邏輯只看「尺寸
  // 有沒有變」，沒辦法分辨「這是瀏覽器 UI 自己在收合動畫」還是「球這一
  // 影格真的自己飄過去撞上邊界，剛好跟視窗尺寸變動同一影格發生」，剛進站
  // 那幾秒兩者幾乎必然疊在一起，導致第一次撞擊被誤判成外部原因而整個
  // 吞掉、不切照片，等 chrome 動畫穩定下來才恢復正常——完全對上回報的
  // 症狀。
  // 修法：撞牆邊界不再逐影格直接讀即時視窗尺寸，改成永遠讀一份「已穩定」
  // 的快照（dvdSettledViewportW/H）；這份快照只在下面 scheduleDvdViewportSettle()
  // 判定視窗尺寸真的穩定下來之後才更新一次（並透過 clampDvdIntoViewport()
  // 把目前位置安靜地夾回新邊界，不觸發撞牆、不隨機重新定位）。這樣一來，
  // 剛進站那幾秒 chrome 還在抖動的期間，物理迴圈看到的邊界完全不變，球
  // 自己飄過去撞上「穩定邊界」照樣正常觸發撞牆換圖，不會再被第一次的
  // 視窗抖動吞掉；等 chrome 真的穩定，才會有一次邊界更新，行為模式跟
  // 現有的橫直轉向／視窗拖曳處理一致。
  let dvdSettledViewportW = window.visualViewport ? window.visualViewport.width : window.innerWidth;
  let dvdSettledViewportH = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  function dvdBoundMaxX(){ return Math.max(0, dvdSettledViewportW - dvdW); }
  function dvdBoundMaxY(){ return Math.max(0, dvdSettledViewportH - dvdH); }
  // resize／visualViewport resize 事件觸發後，等一段時間沒有再變化才真的
  // 更新上面的「已穩定」快照——跟 scheduleViewportSettle()（見該函式旁的
  // 完整說明，這裡是同一套 debounce 手法，用在飄動物件的撞牆邊界上）是
  // 同一個道理，故意抓比它的 150ms 略長一點（180ms）：飄動物件邊界的
  // 正確性優先於反應速度，寧可多等一點點，也不要在瀏覽器 UI 動畫還沒
  // 收尾前就提早採信一個過渡態的尺寸。
  let dvdViewportSettleDebounce = null;
  const DVD_VIEWPORT_SETTLE_MS = 180;
  function scheduleDvdViewportSettle(){
    clearTimeout(dvdViewportSettleDebounce);
    dvdViewportSettleDebounce = setTimeout(() => {
      // 雙指縮放中途 visualViewport.width/height 反映的是縮放後的畫面，
      // 不是真正的版面尺寸，這裡沿用 scheduleViewportSettle() 同一套
      // 「還在縮放就先不採信、等下一次 resize 事件再判斷」的判斷式。
      const stillZoomed = window.visualViewport && Math.abs(window.visualViewport.scale - 1) > 0.01;
      if(stillZoomed) return;
      clampDvdIntoViewport(); // 內部會把 dvdSettledViewportW/H 同步成當下最新尺寸，並把位置安靜地夾回新邊界
    }, DVD_VIEWPORT_SETTLE_MS);
  }

  function clampDvd(v, min, max){ return v < min ? min : (v > max ? max : v); }

  // ---------- 頁面內的「圖片」也當成撞牆單位 ----------
  // 除了螢幕邊界，飄動的 e 現在還會跟首頁縮圖照片、或詳情頁那張置中大圖
  // 的實際邊緣互撞反彈——preview 頁刻意排除在外，維持原本只跟螢幕邊界
  // 碰撞的行為。回傳的是目前這一刻所有要拿來當「牆」的矩形（viewport
  // 座標，跟 getBoundingClientRect() 一致，也跟 dvd 自己的定位方式一致，
  // 不用另外換算捲動位移）。
  function getObstacleRects(){
    if(previewPage.classList.contains('active')) return [];

    if(detailPage.classList.contains('active')){
      if(!detailImageWrap.classList.contains('show')) return [];
      const r = detailImageWrap.getBoundingClientRect();
      if(r.width <= 0 || r.height <= 0) return [];
      // 詳情頁大圖本身也可能是「去背過的異形照片」，撞牆才需要用上它實際
      // 的像素遮罩，不是矩形——idempotent，遮罩已經在建立中或已經就緒都
      // 不會重複觸發（見上面 requestAlphaMask() 的完整說明）。
      requestAlphaMask(detailImage.src, detailImage);
      return [{ rect: r, mask: getCachedAlphaMask(detailImage.src) }];
    }

    // 首頁格子頁：飄動的 e 在首頁不跟任何縮圖硬碰撞，行為比照 preview 頁
    // （見上面 previewPage.classList.contains('active') 那個分支）——只跟
    // 螢幕邊界碰撞，可以直接跟照片重疊、穿過去，回傳空陣列即可。詳情頁
    // （上面 detailPage 那個分支）維持原本會跟大圖碰撞的行為，不受這裡影響。
    // 首頁改用下面 applyGridScrollNudge() 提供「捲動經過時輕輕撥動一下」的
    // 效果，跟這裡的硬碰撞判斷是兩套完全獨立的機制，見該函式的說明。
    return [];
  }

  // ---------- 上下捲動／拖曳頁面時，飄動的 e 有種「被風吹到、輕輕吹動」的
  // 物理手感 ----------
  // 原本這個效果是「捲動時，經過的縮圖劃過 e 所在範圍才觸發」，跟照片的
  // 位置／有沒有重疊綁在一起；使用者要求改成完全跟照片無關，單純只看
  // 「使用者上下捲動／拖曳了多少」——不管飄動的 e 當下飄到畫面上哪裡、
  // 有沒有疊到任何照片，只要頁面在上下捲動，就會有一致、平滑的風吹手感，
  // 不再需要每一影格去查詢、量測畫面上所有縮圖的位置做重疊判斷。
  //
  // 物理模型維持不變：捲動只負責疊加一筆瞬時「風速」（dvdNudgeVY，單位
  // px/s），不直接動位置；真正的位移在 stepDvdBounce() 主迴圈裡，每一
  // 影格都用這個殘留風速乘上 dt 疊進去，風速本身按 dt 為基準指數衰減慢慢
  // 歸零（DVD_SCROLL_NUDGE_DECAY_PER_SEC）——不管當下這一影格捲動量有多
  // 突然，位移都會被攤平成一段平滑的曲線，像風真的吹過去、然後慢慢停
  // 下來，不會有任何單一影格暴衝的瞬間跳動。
  let dvdLastScrollY = window.scrollY;
  let dvdNudgeVY = 0; // 目前累積的「風速」殘留值（px/s），每影格自然衰減，見 stepDvdBounce() 內的套用處
  const DVD_SCROLL_NUDGE_IMPULSE = 2.4;      // 捲動量轉換成風速的比例
  const DVD_SCROLL_NUDGE_MAX_IMPULSE = 220;  // 單次疊加的風速上限 (px/s)
  const DVD_SCROLL_NUDGE_DECAY_PER_SEC = 6.5; // 風速衰減係數：數字越大，風停下來的速度越快、尾韻越短
  function applyGridScrollNudge(){
    const scrollY = window.scrollY;
    const scrollDelta = scrollY - dvdLastScrollY;
    dvdLastScrollY = scrollY;
    if(scrollDelta === 0) return; // 這一影格沒有捲動，不需要疊加任何風力

    // 往下捲（scrollY 變大）時，頁面內容在螢幕上其實是往「上」移動——這裡
    // 取負號，讓風向跟頁面內容捲動的實際視覺方向一致（往下捲、內容往上
    // 滑，就順著把 e 也往上吹一點點；往上捲則反過來往下吹），單純依據
    // 捲動方向與速度決定風向風速，完全不查詢、不判斷任何照片的位置。
    const impulse = Math.max(-DVD_SCROLL_NUDGE_MAX_IMPULSE, Math.min(DVD_SCROLL_NUDGE_MAX_IMPULSE, -scrollDelta * DVD_SCROLL_NUDGE_IMPULSE));
    dvdNudgeVY += impulse;
  }

  // 修正距離在這個範圍內（正常貼著邊緣移動時，每影格的重疊量本來就只有
  // 幾 px），維持原本「直接貼齊」的做法——距離小到肉眼根本看不出差別，
  // 用不著額外處理，也不會拖慢反應。只有修正距離超過這個門檻（例如：
  // 直接把 e 拖進一張圖片中間才放開、或視窗縮放讓圖片瞬間移動到 e 原本
  // 站的位置，讓它整個被嵌進圖片裡）才會啟動下面的平滑滑出效果，避免
  // 那種情況下整顆 e 瞬間傳送過去。
  const DVD_ESCAPE_MIN_DIST = 14;
  let dvdEscaping = false;
  let dvdEscapeFromX = 0, dvdEscapeFromY = 0, dvdEscapeToX = 0, dvdEscapeToY = 0;
  let dvdEscapeStartTime = 0, dvdEscapeDurationMs = 0;

  // AABB 對 AABB 的簡單彈跳判斷：用「重疊面積較淺的那個軸」當作碰撞發生的
  // 方向（撞到左右邊 vs 撞到上下邊），再用兩者中心點的相對位置決定要把
  // dvd 往哪邊推出去、哪個方向分量要翻轉。跟撞螢幕邊界共用同一套視覺/震動/
  // 衰減效果，只是牆壁換成圖片的實際邊緣。
  //
  // o 現在是 { rect, mask } —— rect 是矩形（廣義相位，快速排除完全沒交集
  // 的情況、也用來算推出去的方向跟距離），mask 是這張圖去背後的實際像素
  // 遮罩（窄義相位，見上面 pixelShapesOverlap() 的完整說明）。矩形重疊只是
  // 「有可能撞到」的候選，還要再確認兩邊真正不透明的像素有沒有真的疊在一起，
  // 沒有疊到就直接放行，不觸發下面的反彈／推出邏輯，讓 dvd 可以自由穿過
  // 兩邊圖案的透明區域，只有真的碰到圖案本身才會彈開。
  function resolveDvdObstacleCollision(o, timestamp){
    const rect = o.rect;
    const dvdLeft = dvdX, dvdRight = dvdX + dvdW, dvdTop = dvdY, dvdBottom = dvdY + dvdH;
    const overlapX = Math.min(dvdRight, rect.right) - Math.max(dvdLeft, rect.left);
    const overlapY = Math.min(dvdBottom, rect.bottom) - Math.max(dvdTop, rect.top);
    if(overlapX <= 0 || overlapY <= 0) return false;

    const dvdMaskEntry = getCachedAlphaMask(dvdBounceImgEl && dvdBounceImgEl.src);
    if(!pixelShapesOverlap(dvdLeft, dvdTop, dvdW, dvdH, dvdRotationDeg, dvdMaskEntry, rect.left, rect.top, rect.width, rect.height, o.mask)){
      return false; // 矩形雖然重疊，但兩邊實際去背過的圖案本身還沒真的碰到，不算撞牆
    }

    const dvdCenterX = dvdX + dvdW / 2, dvdCenterY = dvdY + dvdH / 2;
    const oCenterX = (rect.left + rect.right) / 2, oCenterY = (rect.top + rect.bottom) / 2;

    // 方向一律馬上翻好（不等滑動效果跑完），這樣不管接下來是直接貼齊還是
    // 要跑滑出動畫，離開這個函式的當下方向就已經是正確的、之後的物理
    // 迴圈可以直接沿用，不用另外等狀態同步。
    let targetX = dvdX, targetY = dvdY;
    if(overlapX < overlapY){
      if(dvdCenterX < oCenterX){ targetX = rect.left - dvdW; dvdDirX = -Math.abs(dvdDirX); }
      else{ targetX = rect.right; dvdDirX = Math.abs(dvdDirX); }
    } else {
      if(dvdCenterY < oCenterY){ targetY = rect.top - dvdH; dvdDirY = -Math.abs(dvdDirY); }
      else{ targetY = rect.bottom; dvdDirY = Math.abs(dvdDirY); }
    }

    const dist = Math.hypot(targetX - dvdX, targetY - dvdY);
    if(dist <= DVD_ESCAPE_MIN_DIST){
      // 差距很小，維持原本「直接貼齊」，跟修正前的行為一樣、肉眼看不出差別
      dvdX = targetX; dvdY = targetY;
    } else {
      // 差距很大：不瞬間傳送，改成很快地滑過去。滑動的速度用「目前的移動
      // 速度（含甩出去當下的高速）再放大」來決定，不是寫死一個固定時間，
      // 這樣不管甩得多用力，滑出去的速度都至少跟得上、甚至略快於接下來
      // 要接手的正常速度，銜接處才不會有「先慢慢滑、放開後又忽然加速」
      // 這種不協調的落差感；同時夾在 60ms~260ms 之間，確保無論距離多近
      // 多遠，看起來都又快又順、不會拖泥帶水，也不會像瞬移一樣一格跳過去。
      const escapeSpeed = Math.max(dvdSpeed * 1.8, DVD_SPEED * 2);
      dvdEscapeDurationMs = Math.min(260, Math.max(60, (dist / escapeSpeed) * 1000));
      dvdEscapeFromX = dvdX; dvdEscapeFromY = dvdY;
      dvdEscapeToX = targetX; dvdEscapeToY = targetY;
      dvdEscapeStartTime = timestamp;
      dvdEscaping = true;
    }
    return true;
  }

  function setDvdDirection(angle){
    dvdDirX = Math.cos(angle);
    dvdDirY = Math.sin(angle);
    // 避免角度太接近純水平/純垂直，看起來會像卡在一條線上來回
    if(Math.abs(dvdDirX) < 0.25) dvdDirX = dvdDirX < 0 ? -0.25 : 0.25;
    if(Math.abs(dvdDirY) < 0.25) dvdDirY = dvdDirY < 0 ? -0.25 : 0.25;
    const len = Math.hypot(dvdDirX, dvdDirY);
    dvdDirX /= len; dvdDirY /= len;
  }

  function resetDvdBounce(){
    measureDvdSize();
    const minX = dvdBoundMinX(), minY = dvdBoundMinY();
    const maxX = Math.max(minX + 1, dvdBoundMaxX());
    const maxY = Math.max(minY + 1, dvdBoundMaxY());
    dvdX = minX + Math.random() * (maxX - minX);
    dvdY = minY + Math.random() * (maxY - minY);
    setDvdDirection(Math.random() * Math.PI * 2); // 隨機挑一個方向出發，360 度都有機會
    dvdSpeed = DVD_SPEED;
    dvdDecaying = false;
    dvdWasCollidedLastFrame = false;
    dvdWasScreenEdgeCollidedLastFrame = false;
    dvdEscaping = false;
    dvdRotationDeg = 0;
    dvdRotationVel = 0;
    dvdBounce.style.transform = dvdTransformString(dvdX, dvdY);
  }

  function stepDvdBounce(timestamp){
    // dvdDragging 在被指標（手指／滑鼠）抓著的時候會是 true——這種情況
    // 元素位置是直接被對應的 pointer 事件寫 transform 控制，物理迴圈本來
    // 就該整個暫停，抓住的當下已經取消過動畫影格，這裡多一層 guard 只是
    // 保險。放開的那一刻（dvdPointerUp）才會重新把 RAF 排回來。
    if(dvdDragging){
      dvdRAF = null;
      dvdLastTime = null;
      return;
    }

    // ---------- 修正：「初次進入網頁時飄動物件還是會有點卡頓，漸漸的就
    // 不會了」----------
    // 成因：startDvdBounce() 在 init() 一開始就呼叫，這套 RAF 物理迴圈
    // 因此從第一影格就開始跑——但這個階段畫面上飄動物件其實整個被
    // body.initial-reveal-pending 這層遮罩蓋住（opacity:0 / scale(0)，
    // 見上面 CSS 那段說明），使用者完全看不到它，直到 revealInitialChrome()
    // 真正放行才會拿掉這個 class。也就是說，這幾秒使用者看不到的期間，
    // 底下卻完整跑著每一影格的碰撞判斷（getObstacleRects／
    // resolveDvdObstacleCollision）、撞牆換圖（cycleDvdEImage → 觸發
    // 新圖的 alpha mask 建立排程）、computeDvdPixelInsets() 逐點旋轉
    // 運算等一整套「肉眼看不到、卻還是要吃主執行緒時間」的工作——而這幾秒
    // 剛好也是 renderGrid() 分批建置網格 DOM、字體換裝、preview 起始
    // 照片解碼等其他初始化工作最密集搶主執行緒的時間點。多個「使用者
    // 這一刻其實看不到」的工作疊在一起競爭同一條主執行緒，就是「剛
    // 進站還會卡頓一下，等這些背景工作都做完（網格建好、字體穩定）才
    // 漸漸不會」的成因，跟前面幾輪已經修過的「同步運算太重」是不同來源
    // 的同一類症狀。
    // 修法：只要 body 還帶著 initial-reveal-pending（代表這個元素這一刻
    // 對使用者來說根本不存在），就跳過整套移動／撞牆／旋轉運算，只保留
    // RAF 鏈不中斷——把這幾影格能省下來的主執行緒時間，讓給使用者真正
    // 看得到的首屏渲染工作。dvdLastTime 順便清成 null，等真的被放行看得
    // 見的那一刻，第一影格的 dt 會重新從 0 起算，不會因為這段跳過期間
    // 沒有更新 dvdLastTime，一放行就補一大段位移、瞬間跳一下。
    if(document.body.classList.contains('initial-reveal-pending')){
      dvdLastTime = null;
      dvdRAF = requestAnimationFrame(stepDvdBounce);
      return;
    }

    // ---------- 修正：「低效能裝置上，飄動物件圖片還沒準備好，卻已經在
    // 隱形撞牆、默默切換 preview 頁照片」----------
    // 成因：上面那組 initial-reveal-pending 只管「header／照片／飄動物件」
    // 這一整組東西該不該一起淡入，跟飄動物件『自己的圖片庫』（來自
    // EDEN_E_FOLDER_ID）有沒有抓回來、裁切好完全是兩件事（見上面 CSS
    // .dvd-bounce.dvd-image-pending 那段完整說明）——放行 initial-reveal-
    // pending 只代表「preview 起始照片／header 準備好了」，不代表飄動物件
    // 的圖片庫也準備好了；在效能較弱的裝置上，圖片庫的抓取／裁切／decode
    // 明顯比 preview 照片慢，這中間會有一段時間：body 已經放行
    // initial-reveal-pending，但 .dvd-bounce 元素身上還留著
    // dvd-image-pending（opacity:0，肉眼完全看不到）。問題是這段迴圈本身
    // 只看 initial-reveal-pending，沒有另外檢查 dvd-image-pending，於是
    // 這段「使用者什麼都看不到」的空窗期裡，移動／撞牆判斷全部正常繼續
    // 跑，一撞到螢幕上下邊界就照常呼叫 handleDvdPreviewEdgeHit() 切換
    // preview 頁的照片——使用者看到的就是 preview 圖片自己莫名其妙跳來
    // 跳去、完全找不到原因是什麼在觸發，跟鬧鬼一樣。
    // 修法：比照 initial-reveal-pending 那組已經驗證過的做法，這裡多檢查
    // 一次 dvd-image-pending 這個獨立開關，只要飄動物件自己的圖片還沒
    // 準備好（不管 initial-reveal-pending 那組是否已經放行），一律跳過
    // 整套移動／撞牆／旋轉運算、也就不會有任何機會呼叫到
    // handleDvdPreviewEdgeHit()／cycleDvdEImage()，只保留 RAF 鏈不中斷，
    // 等 markDvdRealImageReady() 真正拿掉 dvd-image-pending 那一刻，飄動
    // 物件才會「準備好圖片、才出場、才開始撞牆觸發其他功能」，不會再有
    // 隱形觸發的空窗期。dvdLastTime 一樣清成 null，避免放行那一刻因為
    // 累積的 dt 而瞬間跳一大段位移。
    if(dvdBounce && dvdBounce.classList.contains('dvd-image-pending')){
      dvdLastTime = null;
      dvdRAF = requestAnimationFrame(stepDvdBounce);
      return;
    }

    if(dvdLastTime === null) dvdLastTime = timestamp;
    // 限制單幀最大時間差，避免分頁切到背景、幾秒後切回來時，元素瞬間跳一大段
    const dt = Math.min(48, timestamp - dvdLastTime) / 1000;
    dvdLastTime = timestamp;

    // ---------- 修正「照片已經延伸出去邊界才有撞擊」 ----------
    // dvdW/dvdH 原本只在少數幾個時間點（換圖、resize、抓放結束……見上面
    // measureDvdSize() 呼叫點）重新量測一次，量到之後就快取著，之後每一
    // 影格的撞牆／邊界判斷都直接沿用那個快取值。問題是 .dvd-bounce-img
    // 的 height 現在有一條 .32s 的 CSS transition（見上面 CSS 該條規則的
    // 完整說明）——撞牆換上新一張圖時，圖片的「實際顯示大小」會在接下來
    // 這 0.32 秒內連續變化（從舊圖的高度平滑滑到新圖依 --dvd-area-scale
    // 算出來的目標高度），但 measureDvdSize() 只在換圖那一瞬間量了一次，
    // 量到的通常還是動畫「起點」附近的大小，接下來這 0.32 秒畫面上圖片
    // 明明還在繼續放大／縮小，撞牆用的 dvdW/dvdH 卻整段時間都凍結在那個
    // 起點值不動——這正是「圖片肉眼看起來已經超出邊界了，卻還沒被判定成
    // 撞牆」（新圖比起點大，視覺尺寸領先撞牆框）、或反過來「明明看起來
    // 還沒碰到，卻已經撞牆」（新圖比起點小，撞牆框比視覺尺寸領先）這兩種
    // 症狀共同的成因：只要換圖，接下來 0.32 秒內撞牆判斷用的框，跟畫面上
    // 真正看得到的圖片邊緣就是兩個不同、對不起來的尺寸。
    // 修法：每一影格都重新呼叫 measureDvdSize()，讓 dvdW/dvdH 隨時貼著
    // offsetWidth/offsetHeight 當下（不管有沒有正在過渡中）的即時排版
    // 尺寸——跟上面 computeDvdPixelInsets() 因為物件持續旋轉、選擇「每一
    // 影格重新算一次」是同一個道理。offsetWidth/offsetHeight 不受
    // transform（旋轉、抓取縮放）影響（見 measureDvdSize() 上方原本的
    // 說明），只會反映 height 這條 transition 當下真正算出來的排版高度，
    // 所以這裡逐影格重新量測，量到的就是動畫過程中「這一瞬間」真正的
    // 顯示尺寸，撞牆框全程跟畫面上的圖片邊緣同步，不會再有這段追不上的
    // 空窗期。
    measureDvdSize();

    // 正在快速滑出障礙物（見 resolveDvdObstacleCollision 裡修正距離太大的
    // 分支）：這幾影格單純沿著滑出的軌跡跑到目標位置，不疊加下面一般的
    // 速度位移／撞牆判斷，避免兩套位移邏輯同時作用、互相打架。方向已經在
    // resolveDvdObstacleCollision 裡先翻好了、速度也完全沒被這段動過，
    // 滑完（progress 到 1）交還控制權給下面一般的物理迴圈時，會直接無縫
    // 接上原本要飛出去的方向和速度，不會有忽快忽慢的落差感。
    if(dvdEscaping){
      const progress = Math.min(1, (timestamp - dvdEscapeStartTime) / dvdEscapeDurationMs);
      const eased = 1 - Math.pow(1 - progress, 3); // easeOutCubic：起手快、收尾平滑，看起來像俐落地滑過去而不是硬煞車
      dvdX = dvdEscapeFromX + (dvdEscapeToX - dvdEscapeFromX) * eased;
      dvdY = dvdEscapeFromY + (dvdEscapeToY - dvdEscapeFromY) * eased;
      if(progress >= 1) dvdEscaping = false;
      stepDvdRotation(dt); // 滑出障礙物的這幾影格，累積的旋轉衝量還是要繼續平滑衰減，不能卡住
      dvdBounce.style.transform = dvdTransformString(dvdX, dvdY);
      dvdRAF = requestAnimationFrame(stepDvdBounce);
      return;
    }

    // 甩出去的速度如果高於定速，放開的那一刻就直接開始「慢慢地」往定速衰減
    // （見 dvdPointerUp），不再等第一次撞牆才起算——撞牆才開始減速的話，
    // 高速維持的時間長短完全看運氣（丟到哪裡才撞到東西），現在放開就立刻
    // 起算，維持高速的時間反而更短、更可控。這裡用貼近真實摩擦力的指數
    // 衰減（先快後慢，越接近終速變化越平緩），取代原本等速切線的線性
    // 內插，過程更長也更細膩，不會有機械式的僵硬感。
    if(dvdDecaying){
      const progress = Math.min(1, (timestamp - dvdDecayStartTime) / dvdDecayDurationMs);
      const eased = 1 - Math.exp(-DVD_DECAY_EASE * progress);
      dvdSpeed = dvdDecayStartSpeed + (DVD_SPEED - dvdDecayStartSpeed) * eased;
      if(progress >= 1){ dvdSpeed = DVD_SPEED; dvdDecaying = false; }
    }

    // 撞螢幕邊界改用「實際圖案像素」的最外緣，不是外框本身（見上面
    // computeDvdPixelInsets() 的完整說明）：每一影格重新算一次，是因為
    // 飄動物件會持續旋轉，圖案最外緣的位置會跟著即時改變。
    const dvdPixelInsets = computeDvdPixelInsets();
    let minX = dvdBoundMinX() - dvdPixelInsets.left, minY = dvdBoundMinY() - dvdPixelInsets.top;
    let maxX = dvdBoundMaxX() + dvdPixelInsets.right, maxY = dvdBoundMaxY() + dvdPixelInsets.bottom;
    // insets 現在可能是負值（見 computeDvdPixelInsets() 上方的修正說明），
    // 理論上正常情況下 min 不會超過 max，這裡純粹保底：極窄視窗疊加極端
    // 旋轉角度、insets 兩邊都很大的負值時，避免 min > max 讓後面的
    // clampDvd／碰撞判斷出現無意義的區間，直接退回成一個點（區間中點）。
    if(minX > maxX){ const mid = (minX + maxX) / 2; minX = maxX = mid; }
    if(minY > maxY){ const mid = (minY + maxY) / 2; minY = maxY = mid; }

    // 視窗尺寸如果剛好在這個時間點縮小（例如手機網址列從收起變成重新展開、
    // 或者鎖住捲動之後瀏覽器介面重新排版——這在剛點進 preview 頁、body 被
    // 加上 overflow:hidden 的那一刻特別容易發生），邊界會在球本身完全沒有
    // 移動的情況下，憑空往內縮到球原本停留的位置外面。如果直接沿用下面
    // 「移動後檢查邊界」的邏輯，這一影格會被誤判成「球剛好撞到邊界」，
    // 觸發一次跟使用者操作、跟球的實際移動都完全無關的假撞牆，preview
    // 照片因此莫名其妙跳了一張——這正是「preview 頁剛點進去，偶爾沒有
    // 撞擊就會跳照片」的成因。這裡先判斷「這一影格移動之前」球是否已經
    // 落在新邊界外面：如果是，代表邊界是外部原因縮小的，不是球自己的
    // 速度移動撞上去的，這一影格只靜靜地把座標夾回邊界內，不觸發撞擊、
    // 不跳圖；真正由球自己這一影格的移動撞到邊界，才會進到下面正常的
    // 撞牆流程。
    //
    // 這個判斷式原本只考慮「視窗尺寸變小」這一種外部原因，但上面
    // computeDvdPixelInsets() 現在會逐影格重新算，只要物件還在旋轉，
    // 內縮值本身就會持續變動——完全沒有視窗縮小、只是這一影格剛好轉到
    // 內縮值變小，也會讓「球停在邊界上的舊位置」瞬間變成落在新邊界外面，
    // 觸發這裡的「靜默夾回＋不移動」分支。跟真正的視窗縮小不一樣的是：
    // 下一影格內縮值可能又變大、球又暫時落回邊界內，接著又因為繼續旋轉
    // 再次縮小……每一次觸發這個分支都完全不移動（下面 dvdX += 那一行
    // 這一影格根本沒執行到），肉眼看起來就是「撞到邊界之後卡住、瞬間
    // 不太會動」——這正是這次回報的成因，只有旋轉剛好轉到內縮值變大、
    // 讓球重新落回邊界內的那一刻，才會恢復正常移動，看起來像「黏了一下
    // 又放開」。
    // 修法：只有「視窗尺寸真的變了」才算外部原因、才允許這個靜默分支
    // 生效；純粹因為旋轉造成的內縮值變動，不能再觸發這個分支——直接讓
    // 它落到下面正常的移動＋撞牆流程處理，該撞牆就正常撞牆、該繼續飄就
    // 繼續飄，不會有任何一影格被跳過不動。
    //
    // ---------- 後續修正：這個判斷本身在手機版剛進站時反而誤傷正常撞擊
    // ----------
    // 上面兩段成因說明都成立，但「逐影格比較 window.innerWidth/innerHeight」
    // 這個判斷式有個更根本的副作用：手機瀏覽器剛載入頁面的頭 1~2 秒，
    // 網址列收合／展開的排版動畫幾乎必然會讓 innerWidth/innerHeight 連續
    // 變動好幾影格，這段期間只要球剛好自己飄過去撞上邊界，也會被這裡
    // 一併誤判成「外部原因」而靜默吸收、不觸發撞牆換圖——這正是「手機版
    // 剛進站，撞邊界卻不會切照片，頂多發生一次、之後就正常」的成因（桌機
    // 沒有網址列收合動畫，只有字體 swap 那一次性的 reflow 會偶爾觸發，
    // 出現機率低很多）。
    // 真正的修法是從源頭讓 dvdBoundMaxX()/dvdBoundMaxY() 不要再逐影格
    // 直接讀即時視窗尺寸，改成讀一份只在真正穩定下來才更新的快照（見上面
    // dvdBoundMaxX() 旁 dvdSettledViewportW/H 的完整說明）——邊界因此不會
    // 再被 chrome 收合動畫這種「跟球的移動完全無關」的抖動牽動，這裡原本
    // 「視窗尺寸變了就靜默夾回」的判斷式也就不再需要：邊界只有在
    // clampDvdIntoViewport() 被明確呼叫時才會變（debounce 確定穩定後，或
    // 橫直轉向輪詢），而那個函式本來就會自己直接把位置夾回新邊界、不會
    // 經過這裡，兩者不會互相干擾。留著這段判斷反而會繼續誤傷手機版剛
    // 進站那幾秒的正常撞擊，這裡整段拿掉，直接落到下面一般的移動＋撞牆
    // 流程處理。
    // ---------- 修正：「撞到邊界後偶爾會黏住、不會反彈」 ----------
    // 這裡原本還留著一段「dvdX/dvdY 落在邊界外就靜默夾回＋直接 return，
    // 跳過下面移動＋撞牆反彈流程」的判斷式（舊註解仍保留在上面，記錄
    // 這段的完整歷史成因）。上面的說明其實已經講清楚：改成讀
    // dvdSettledViewportW/H 這份快照之後，這個判斷式唯一還會被觸發的
    // 原因只剩「物件持續旋轉，導致 computeDvdPixelInsets() 逐影格算出
    // 的內縮值跟著抖動」——這跟真正的視窗縮放已經無關。物件貼在邊界附近
    // 又還在旋轉時，這段會每影格反覆觸發、每次都直接 return，完整跳過
    // 下面「移動→撞牆→翻轉方向→觸發反彈」的程式碼，畫面上就是「撞到牆
    // 之後卡住不動」，只有某一影格內縮值剛好變動方向對了才會鬆開——這正
    // 是「偶爾黏在牆壁上不會反彈」的成因。
    // 修法：如同上面舊註解最後那段結論，把這個判斷式整段拿掉（先前只
    // 改了說明文字、沒有真的刪掉程式碼），直接落到
    // 下面正常的「移動→撞牆判斷」流程即可——就算這一影格開始前球剛好落在
    // 新邊界外一點點，下面的撞牆判斷本來就會用同一組 minX/maxX/minY/maxY
    // 正常抓到、正常夾回、該反彈就反彈，不需要另外搶在前面處理，也不會
    // 跳過這一影格的移動。

    dvdX += dvdDirX * dvdSpeed * dt;
    dvdY += dvdDirY * dvdSpeed * dt;

    // 首頁捲動撥動效果：只在首頁格子畫面生效（preview／詳情頁沒有可以捲動
    // 經過的縮圖，也用不到）。applyGridScrollNudge() 只負責疊加風速
    // （dvdNudgeVY），不直接動位置；這裡接著把目前累積的風速換算成這一
    // 影格的位移量疊進去，並讓風速依 dt 做指數衰減——不管風力是不是這一
    // 影格才剛疊加的，套用到位置上的過程永遠是平滑曲線，不會有單一影格
    // 位移暴衝的撞擊感。刻意排在撞牆判斷之前——這樣風力帶來的位移如果
    // 剛好把 e 推出螢幕邊界，會自然被底下緊接著的撞牆／夾回邊界邏輯接住，
    // 不會露出邊界外。
    if(!previewPage.classList.contains('active') && !detailPage.classList.contains('active')){
      applyGridScrollNudge();
    }
    if(dvdNudgeVY !== 0){
      dvdY += dvdNudgeVY * dt;
      dvdNudgeVY *= Math.exp(-DVD_SCROLL_NUDGE_DECAY_PER_SEC * dt);
      if(Math.abs(dvdNudgeVY) < 0.5) dvdNudgeVY = 0; // 小到看不出差異時直接歸零收尾，不留無窮小的殘留值一直跑下去
    }

    // 撞到邊緣就反彈：把座標夾回邊界內、水平或垂直方向的分量直接翻轉方向
    // 先記錄「這一影格移動所用的方向」（碰撞翻轉之前），等下面撞牆／撞
    // 障礙物都處理完之後，拿來跟最終方向算外積，決定旋轉要往哪邊轉——
    // 這樣轉向感是貼著這一下實際怎麼彈開來的，不是憑空亂轉。
    const dvdDirXBeforeHit = dvdDirX, dvdDirYBeforeHit = dvdDirY;
    let collided = false;
    let hitScreenEdge = false; // 上下左右四個螢幕邊界，撞到任何一個都算
    if(dvdX <= minX){ dvdX = minX; dvdDirX = Math.abs(dvdDirX); collided = true; hitScreenEdge = true; }
    else if(dvdX >= maxX){ dvdX = maxX; dvdDirX = -Math.abs(dvdDirX); collided = true; hitScreenEdge = true; }
    if(dvdY <= minY){ dvdY = minY; dvdDirY = Math.abs(dvdDirY); collided = true; hitScreenEdge = true; }
    else if(dvdY >= maxY){ dvdY = maxY; dvdDirY = -Math.abs(dvdDirY); collided = true; hitScreenEdge = true; }

    // 撞到螢幕邊界（上下左右四邊都算，不限定是哪一邊）的那一瞬間（邊緣觸發，
    // 不是每一影格貼著都觸發），觸發 preview 頁跳轉。
    //
    // 注意：.preview-left / .preview-right 在桌機和手機是「不同方向」的版面——
    // 桌機是左右並排（見 .preview-col 預設 CSS），手機（≤640px）則會透過
    // media query 改成上下堆疊（.preview-left 在上、.preview-right 在下，見
    // 上方 CSS 的 640px breakpoint）。原本這裡不分版面，一律只看撞擊當下的
    // 垂直位置落在螢幕上半還是下半來決定切左邊還是右邊的照片——這在手機的
    // 上下堆疊版面下是對的，但在桌機的左右並排版面下完全對不上：撞在畫面
    // 右側，只要那一瞬間垂直位置剛好落在螢幕上半，就會被誤判成「左側」，
    // 切到左邊的圖，這正是「明明撞右邊、卻是左邊圖片跳了」的成因。
    // 修法：判斷方向要跟著版面走——手機用垂直位置（上半/下半），桌機改用
    // 水平位置（左半/右半），跟 640px 這個 breakpoint 保持一致。
    if(hitScreenEdge && !dvdWasScreenEdgeCollidedLastFrame){
      const isStackedPreviewLayout = window.innerWidth <= 640; // 對齊 CSS 手機版 preview-col 改成上下堆疊的 breakpoint
      let side;
      if(isStackedPreviewLayout){
        const screenMidY = window.innerHeight / 2;
        const dvdCenterY = dvdY + dvdH / 2;
        side = dvdCenterY < screenMidY ? 'left' : 'right';
      } else {
        const screenMidX = window.innerWidth / 2;
        const dvdCenterX = dvdX + dvdW / 2;
        side = dvdCenterX < screenMidX ? 'left' : 'right';
      }
      handleDvdPreviewEdgeHit(side);
      // 「e」本身撞到螢幕邊界（不限 preview 頁，任何頁面都算）就換一張圖，
      // 跟上面 preview 頁切照片是兩件互不干擾的事：這裡管的是「e」貼在
      // 畫面上顯示的那張圖本身，來自 EDEN_E_FOLDER_ID 那個獨立圖片庫。
      cycleDvdEImage();
    }
    dvdWasScreenEdgeCollidedLastFrame = hitScreenEdge;

    // 再檢查跟頁面內圖片（首頁縮圖 / 詳情頁大圖）的碰撞，同一顆球，只是牆壁
    // 換成這些圖片的實際邊緣；同一影格理論上最多只會真的疊到一張圖，用 some
    // 找到第一個真的重疊的矩形即可，不需要每張都硬套一次。
    const obstacles = getObstacleRects();
    for(let i = 0; i < obstacles.length; i++){
      if(resolveDvdObstacleCollision(obstacles[i], timestamp)){ collided = true; break; }
    }

    // 只在「這一影格才剛撞上」時震動一次（見 dvdWasCollidedLastFrame 上面的說明），
    // 不是「只要正貼著邊界」就震——這樣元素卡在邊緣不動時不會連續狂震
    if(collided && !dvdWasCollidedLastFrame){
      triggerDvdEdgeVibration();
      // 撞擊那一刻順便給旋轉一個衝量，力道依「撞擊當下速度在牆面切線方向
      // 上的分量比例」決定（見上面常數區塊的物理說明：切線滑動才是現實中
      // 撞牆會轉的成因）。碰撞法線方向不用另外判斷是撞到哪一面牆——反射
      // 只會讓「法線方向」的速度分量翻轉、「切線方向」的分量維持不變，
      // 所以撞擊前後方向向量的差（after - before）必然剛好落在法線方向上，
      // 直接拿這個差向量正規化，就是這一下真正的碰撞法線，不用另外對
      // 「撞到螢幕邊界」「撞到頁面內圖片」寫兩套判斷。
      const beforeX = dvdDirXBeforeHit, beforeY = dvdDirYBeforeHit;
      const afterX = dvdDirX, afterY = dvdDirY;
      const diffX = afterX - beforeX, diffY = afterY - beforeY;
      const diffLen = Math.hypot(diffX, diffY);
      let turnSign, tangentialRatio;
      if(diffLen < 1e-6){
        // 撞擊前後方向幾乎沒變化，理論上極少見（例如同一影格內已經是
        // 反彈後方向又剛好撞回同一面牆）——法線方向算不出來，退回中等
        // 力道＋隨機方向，確保視覺上還是有旋轉反應，但不會异常突兀。
        turnSign = Math.random() < 0.5 ? -1 : 1;
        tangentialRatio = 0.5;
      } else {
        const nx = diffX / diffLen, ny = diffY / diffLen; // 碰撞法線（單位向量）
        const tx = -ny, ty = nx; // 法線轉 90 度，就是牆面的切線方向（固定同一個轉向，跟撞哪一面牆無關，方向定義因此永遠一致）
        const tangentialComponent = beforeX * tx + beforeY * ty; // 撞擊前速度在切線方向上的分量，before 本身是單位向量，這個分量天然落在 -1~1
        tangentialRatio = Math.min(1, Math.abs(tangentialComponent));
        // 方向直接用這個切線分量的正負號決定，不再用「撞前 × 撞後方向」的
        // 外積——外積在切線分量大（擦邊撞擊，也就是現在力道最強的那種撞擊）
        // 的情況下，代表撞擊前後方向幾乎沒變化（before≈after），外積會趨近
        // 0，正負號幾乎完全被浮點數誤差決定，等於是隨機的，這正是先前
        // 「感覺轉錯邊」的成因——偏偏發生在最明顯、力道最大的那種撞擊上。
        // 改用切線分量本身：它在擦邊撞擊時數值明確、很大，方向穩定；在
        // 接近正面撞擊時趨近 0，這時候方向本來就不重要（力道也很小，見上面
        // magnitude 的算法），兩者剛好互相呼應，不會有「小撞擊卻轉錯邊」
        // 這種違和感。
        turnSign = tangentialComponent !== 0 ? Math.sign(tangentialComponent) : (Math.random() < 0.5 ? -1 : 1);
      }
      // 力道曲線用 smoothstep 而不是線性內插，兩端變化平緩、中段變化較快，
      // 觀感上比線性更順、更不生硬；再依「撞擊當下的實際移動速度」相對
      // 平常巡迴速度（DVD_SPEED）的比例，多乘一個倍率——撞得越用力（例如
      // 剛甩出去、速度還在高檔），這一下轉動的手感也該越明顯，不是不管
      // 撞多快都同一個力道。
      const eased = smoothstep01(tangentialRatio);
      const speedRatio = dvdSpeed / DVD_SPEED;
      const speedFactor = Math.max(DVD_ROTATION_SPEED_FACTOR_MIN, Math.min(DVD_ROTATION_SPEED_FACTOR_MAX, speedRatio));
      const magnitude = (DVD_ROTATION_KICK_MIN_DEG_PER_SEC + (DVD_ROTATION_KICK_MAX_DEG_PER_SEC - DVD_ROTATION_KICK_MIN_DEG_PER_SEC) * eased) * speedFactor;
      kickDvdRotation(turnSign, magnitude);
    }
    dvdWasCollidedLastFrame = collided;

    stepDvdRotation(dt);
    dvdBounce.style.transform = dvdTransformString(dvdX, dvdY);
    dvdRAF = requestAnimationFrame(stepDvdBounce);
  }

  function startDvdBounce(){
    // 這裡不能只看 photoFallModeActive：從堆疊模式按 Preview 之後，飄動的 e
    // 有可能已經脫離物理世界、恢復成一般飄動狀態（見
    // resumeDvdFloatAfterPhotoFallCover()），這時 pfDvdItem 會是 null，
    // photoFallModeActive 卻仍然是 true（整段堆疊模式還沒真正結束，只是
    // 被 preview 蓋住）——這種情況不該被這裡擋下來。只有 e 真的還在物理
    // 世界裡（pfDvdItem 非 null）才需要讓物理迴圈自己接手，這裡先讓開。
    if(photoFallModeActive && pfDvdItem) return; // 物理堆疊模式期間（含結束後的重新啟動由 exitPhotoFallMode 自己呼叫），不要在這裡搶跑
    if(dvdRAF || dvdDragging) return; // 已經在跑了，或正被抓著（放開再接手）
    resetDvdBounce();
    dvdLastTime = null;
    dvdRAF = requestAnimationFrame(stepDvdBounce);
  }

  // ---------- 保底自癒機制 ----------
  // 上面已經修掉目前找得到、會讓動畫迴圈永久卡死的幾個成因（放開時速度
  // 沒有下限、pointerup 事件可能沒送達），但飄動字全站只有這一個實體、
  // 一旦卡住使用者會立刻察覺，值得再加一層保底：每隔一段時間檢查一次
  // 「現在不是正被抓著、但動畫迴圈卻沒在跑」這個不該發生的狀態，一旦
  // 發生就直接視同放開，走跟 dvdPointerUp() 一樣的「朝定速回穩」路徑
  // 重新接手，不需要使用者自己重新整理頁面才能恢復。跟只在特定事件
  // 發生時才觸發的修法不同，這一層完全不假設成因是什麼，任何未來還沒
  // 想到的邊界情況（例如瀏覽器本身某個事件沒有如預期觸發）都會在最多
  // 幾秒內被這裡自動偵測、自動修復。
  const DVD_WATCHDOG_INTERVAL_MS = 2000;
  setInterval(() => {
    // 理由同 startDvdBounce() 內的說明：只有 e 真的還在物理世界裡
    // （pfDvdItem 非 null）才代表迴圈本來就該是停的；e 若已經因為
    // resumeDvdFloatAfterPhotoFallCover() 脫離物理世界、恢復飄動，這裡就
    // 該正常運作，不能被 photoFallModeActive 這個「整段堆疊模式還沒結束」
    // 的旗標誤擋。
    if(photoFallModeActive && pfDvdItem) return; // 物理堆疊模式期間，飄動字的迴圈本來就該是停的，不要被保底機制誤判成卡死而重新啟動
    if(dvdDragging || dvdRAF) return; // 正常狀態：要嘛正被抓著、要嘛迴圈本來就在跑，什麼都不用做
    dvdSpeed = Math.max(dvdSpeed, 0);
    // ⚠️ 跟 dvdPointerUp() 同一套已確認規則，不要改：只有目前速度高於
    // 定速才需要朝定速衰減，低於（或等於）定速就直接照現有速度重新啟動
    // 迴圈，不強行拉回定速。
    if(dvdSpeed > DVD_SPEED){
      dvdDecaying = true;
      dvdDecayStartTime = performance.now();
      dvdDecayStartSpeed = dvdSpeed;
      dvdDecayDurationMs = DVD_DECAY_MS;
    } else {
      dvdDecaying = false;
    }
    dvdLastTime = null;
    dvdRAF = requestAnimationFrame(stepDvdBounce);
  }, DVD_WATCHDOG_INTERVAL_MS);

  // 視窗尺寸改變時（轉橫向、桌機拖曳視窗寬度）只重新量測尺寸、把目前位置
  // 夾回新的邊界內，不隨機換位置、不重新啟動——避免使用者感覺「畫面一動
  // 元素就跳掉」，這正是「切換頁面／改變視窗不會有任何震動」的關鍵。
  function clampDvdIntoViewport(){
    // 理由同上：只有 e 真的還在物理世界裡（pfDvdItem 非 null）時，transform
    // 才是由物理迴圈接管；已經脫離物理世界、恢復飄動的狀態下，視窗尺寸
    // 改變還是要正常夾回新的邊界內，不能被 photoFallModeActive 擋住。
    if(photoFallModeActive && pfDvdItem) return; // 物理堆疊模式期間，飄動字的 transform 改由物理迴圈接管，這裡不能插手覆寫
    // 這個函式代表呼叫端已經確定「現在該用最新的視窗尺寸了」（不管是
    // debounce 判定穩定、還是橫直轉向輪詢的每一步），所以在這裡把上面
    // dvdBoundMaxX()/dvdBoundMaxY() 依賴的 dvdSettledViewportW/H 同步成
    // 當下真正的視窗尺寸，下面算出來的邊界才會是最新的；stepDvdBounce()
    // 逐影格的撞牆判斷則完全不會走到這裡，繼續沿用同一份快照，兩者互不
    // 干擾。
    dvdSettledViewportW = window.visualViewport ? window.visualViewport.width : window.innerWidth;
    dvdSettledViewportH = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    measureDvdSize();
    dvdEscaping = false; // 視窗尺寸一變，舊的滑出目標位置可能已經不對，直接取消，改用下面重新夾回邊界的結果
    // 跟 stepDvdBounce()／dvdPointerMove() 用同一套像素級邊界（見
    // computeDvdPixelInsets() 的完整說明），resize 時才不會把物件多夾回來
    // 一圈去背後的空白，或反過來允許圖案的像素露在視窗外面。
    const dvdResizePixelInsets = computeDvdPixelInsets();
    const rawMinX = dvdBoundMinX() - dvdResizePixelInsets.left, rawMinY = dvdBoundMinY() - dvdResizePixelInsets.top;
    const rawMaxX = dvdBoundMaxX() + dvdResizePixelInsets.right, rawMaxY = dvdBoundMaxY() + dvdResizePixelInsets.bottom;
    const minX = Math.min(rawMinX, rawMaxX), maxX = Math.max(rawMinX, rawMaxX);
    const minY = Math.min(rawMinY, rawMaxY), maxY = Math.max(rawMinY, rawMaxY);
    dvdX = clampDvd(dvdX, minX, maxX);
    dvdY = clampDvd(dvdY, minY, maxY);
    dvdBounce.style.transform = dvdTransformString(dvdX, dvdY);
  }

  // ---------- 抓取／甩出去（手指、滑鼠共用同一套 Pointer Events，
  // 桌機不再需要長按才能抓，跟手機版一樣直接按著拖就能抓住） ----------
  function dvdPointerDown(e){
    // 照片物理堆疊模式期間（entering/active/exiting），完全不要跑這套舊版
    // 手動拖曳邏輯：直接 return，讓這次 pointerdown 原生地繼續往下傳給
    // #photoFallStage，交給 Matter.Mouse／MouseConstraint 接手判斷「抓到
    // 的是飄動的 e 還是某張照片」、以及拖曳中途的物理碰撞。
    //
    // 這是「拖曳飄動的 e、卻跟照片完全沒有物理互動，一放開又馬上飄走」
    // 的根本成因：這個函式原本不分模式一律搶著跑——一進來就呼叫
    // e.preventDefault()，等於直接吃掉這次 pointerdown，瀏覽器後續不會
    // 再補發 Matter.Mouse 賴以判斷「使用者按下了滑鼠」的原生 mousedown，
    // Matter 那邊從頭到尾沒收到任何抓取事件；同時這裡自己接管的
    // dvdPointerMove() 又是直接、逐次改寫 dvdBounce.style.transform（只
    // 跟視窗邊界比對，完全不知道 Matter 物理世界裡其他照片在哪），跟物理
    // 引擎每影格的位置同步（見 pfSyncHandler）同時搶著寫同一個 transform；
    // 放開時 dvdPointerUp() 更進一步把 dvdRAF 重新指回舊版 stepDvdBounce()
    // 飄動迴圈——等於「表面上還在堆疊模式，實際上舊版飄動系統已經在背後
    // 重新接管」，這正是放開瞬間立刻飄走、且全程沒有一絲物理碰撞感的
    // 由來。加這一行 guard 之後，拖曳／放開的所有手感（含物理碰撞、堆疊、
    // 放開後的動量）完全交給 Matter 這一套系統，不會再有兩套邏輯互搶。
    //
    // 這裡不能只看 photoFallModeActive：從堆疊模式按 Preview 進來、等
    // preview 的照片蓋滿畫面之後，飄動的 e 會脫離物理世界、恢復成一般
    // 飄動狀態（見 resumeDvdFloatAfterPhotoFallCover()），這時 pfDvdItem
    // 會變成 null，但 photoFallModeActive 仍然是 true（整段堆疊模式其實
    // 還沒真正結束，只是被 preview 蓋住、暫停而已）——如果這裡還是只看
    // photoFallModeActive，會誤判成「還在堆疊模式」而繼續擋掉這次
    // pointerdown，變成「在 preview 頁飄動的 e 沒辦法用滑鼠/觸控抓取」。
    // 改成同時檢查 pfDvdItem：只有 e 真的還在 Matter 物理世界裡（還沒被
    // 放開接管）才需要讓開給 Matter.Mouse 處理；一旦 e 已經脫離物理世界
    // （pfDvdItem 是 null），不管 photoFallModeActive 是不是還留著 true，
    // 都應該正常走這套一般的拖曳邏輯。
    if(photoFallModeActive && pfDvdItem) return;
    e.preventDefault();
    try{ dvdBounce.setPointerCapture(e.pointerId); }catch(err){}

    // 修正「雙擊飄動的 e 時，它的位置會跟著移動、跳兩下」：原本這裡不管
    // 這一下最後會不會變成拖曳，一律立刻停掉飄動迴圈、套用抓取縮小效果、
    // 並以「這次按下的座標」重新定位元素（dvdX = rect.left／dvdY = rect.top，
    // 看似沒動，但緊接著放開時 dvdPointerUp() 又會用這次點擊量到的極小
    // 位移重新起算飄動速度、重新排入動畫）。雙擊本質上是兩次獨立的
    // 「按下→放開」，兩次點擊的座標幾乎不可能完全落在同一個像素上（觸控
    // 手指尤其明顯），每一次按下/放開都會讓元素的位置、飄動速度被重新
    // 對齊一次，兩次點擊各對齊一次，看起來就是「跳兩下」。
    // 改成按下的當下只記錄「候選」資訊（座標、pointerId），完全不去動
    // 飄動字目前的位置、也不停掉它原本的飄動迴圈；只有在 dvdPointerMove()
    // 裡偵測到位移真的超過 DVD_TAP_MAX_MOVE（代表這是一次真正的拖曳，
    // 不是點擊／雙擊）才會呼叫 commitDvdDrag() 真正「抓起來」。單純點一下
    // （不管是單擊還是雙擊的其中一下）因此完全不會牽動飄動字的位置或飄動
    // 狀態，滿足「雙擊時維持原地不動」的需求。
    dvdDragCandidatePointerId = e.pointerId;
    dvdDragCandidateStartX = e.clientX;
    dvdDragCandidateStartY = e.clientY;
  }

  // ---------- 確定是真正的拖曳（見上面 dvdPointerDown() 的完整說明）才會
  // 被呼叫到：這裡才是原本「抓取」那一段邏輯本身，只是延後到真的偵測到
  // 位移之後才執行 ----------
  function commitDvdDrag(e){
    if(dvdRAF){ cancelAnimationFrame(dvdRAF); dvdRAF = null; }
    dvdLastTime = null;
    dvdDragging = true;
    dvdBounce.classList.add('dvd-grabbing'); // 觸發內層圖片的縮小 transition（見上面 CSS 說明）
    dvdEscaping = false; // 抓取當下若剛好正在滑出動畫途中，直接取消，位置維持抓取的當下值即可
    // 抓住的當下順便把殘留的旋轉角速度歸零：原本這裡沒有清掉 dvdRotationVel，
    // 抓取只是暫停了 RAF（旋轉當然也跟著暫停，因為 stepDvdRotation() 沒機會
    // 被呼叫到），但角速度這個數值本身還留著沒清——放開之後 stepDvdBounce()
    // 重新排入 RAF，stepDvdRotation() 接著就拿這筆「抓取前」殘留的舊角速度
    // 繼續轉，看起來像「一放開又自己轉了起來」，跟使用者要的「已經被抓住、
    // 就不該再帶著抓取前的旋轉慣性」不符。這裡歸零之後，放開只會讓它照甩出
    // 去的方向／速度飄走，角度維持抓取當下的樣子不再變化，要等它真的撞到
    // 東西（見 kickDvdRotation() 的呼叫處）才會重新開始旋轉。
    dvdRotationVel = 0;
    dvdPointerId = e.pointerId;
    // 偏移量在「真正確定拖曳」的這一刻、用這一刻的座標／矩形重新計算
    // （而不是沿用按下當下算好的舊值）：按下之後到真正確定拖曳之間，飄動
    // 字可能因為原本的飄動迴圈繼續跑了幾影格而已經移動了一點位置，這裡
    // 用「當下」的矩形／座標算偏移，才能保證接手的這一刻元素位置完全不變，
    // 之後 dvdPointerMove() 才會跟著指標／手指自然移動，不會有任何一影格
    // 突然跳去別的位置。
    //
    // 修正「用滑鼠抓住飄動物件時，會位移跳一下」：這裡原本直接拿
    // dvdBounce.getBoundingClientRect() 的 rect.left/rect.top 當作
    // dvdX/dvdY。問題是 .dvd-bounce 的 transform 是
    // translate(dvdX,dvdY) rotate(dvdRotationDeg)（見 dvdTransformString()），
    // 飄動物件撞牆後有好幾秒的旋轉衰減期（見 dvdRotationDeg／
    // stepDvdRotation() 那段），角度多半不是剛好 0——getBoundingClientRect()
    // 量到的是「旋轉後」的外接矩形，旋轉不會移動元素的中心點，但外接矩形
    // 的四個邊界會被撐大／偏移，rect.left/rect.top 因此不等於真正未旋轉
    // 狀態下的左上角（下面 measureDvdSize() 那段註解對同一個現象有更完整
    // 的說明）。抓取當下如果角度剛好不是 0，dvdX/dvdY 就會被賦成這個偏移
    // 過的錯誤值，下一影格照這個錯誤座標＋原本角度重繪 transform，元素的
    // 真正中心點就會瞬間位移，看起來像「一抓住就跳一下」，角度剛好轉得越
    // 大，跳動越明顯。
    // 修法：改用矩形的「中心點」反推真正未旋轉的左上角——旋轉是繞元素中心
    // 進行，中心點在旋轉前後永遠不變；這裡拿 rect 算出中心點，再用
    // measureDvdSize() 量到的、完全不受旋轉影響的 dvdW/dvdH（offsetWidth／
    // offsetHeight，原理見該函式的完整說明）換算回真正的 dvdX/dvdY，這樣
    // 算出來的位置跟目前的旋轉角度完全無關，抓取當下元素的視覺位置／角度
    // 保證原地不動，不會再有任何偏移。
    measureDvdSize();
    const rect = dvdBounce.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    dvdX = centerX - dvdW / 2;
    dvdY = centerY - dvdH / 2;
    dvdGrabOffsetX = e.clientX - dvdX;
    dvdGrabOffsetY = e.clientY - dvdY;
    dvdMoveSamples = [{ t: performance.now(), x: dvdX, y: dvdY }];
    // 記下這根手指目前的座標，供之後補第二根手指做兩指旋轉時，拿來當
    // 「兩指連線」的其中一個端點（見上面 startDvdRotateGesture() 的說明）。
    dvdPrimaryTouchX = e.clientX;
    dvdPrimaryTouchY = e.clientY;
    dvdBounce.style.transform = dvdTransformString(dvdX, dvdY);
  }

  // ⚠️ 保護區段開始：dvdPointerMove() + dvdPointerUp() 裡的末速度計算，
  // 已經跟使用者確認過是正確、要保留的行為，其他需求不要順手改到這裡
  // （細節見上面 DVD_FLING_WINDOW_MS 那段常數註解的說明）。
  function dvdPointerMove(e){
    if(!dvdDragging){
      // 還沒確定是拖曳：只有記錄在案的候選 pointerId 才需要繼續判斷（見
      // dvdPointerDown() 的完整說明），其餘一律忽略。
      if(e.pointerId !== dvdDragCandidatePointerId) return;
      const dx0 = e.clientX - dvdDragCandidateStartX;
      const dy0 = e.clientY - dvdDragCandidateStartY;
      if(Math.hypot(dx0, dy0) <= DVD_TAP_MAX_MOVE) return; // 位移還在「點一下」的容許範圍內，先不當作拖曳，維持飄動字原本的位置／飄動狀態不變
      commitDvdDrag(e); // 真的確定是拖曳了，這裡才第一次接手位置／停掉飄動迴圈
    }
    if(!dvdDragging || e.pointerId !== dvdPointerId) return;
    e.preventDefault();
    // ---------- 修正：「用滑鼠／觸控拖曳時，卡在一個空白區域邊界，而不是
    // 實際去背後邊界」----------
    // 這裡原本只拿 dvdBoundMinX()/dvdBoundMaxX() 這組「未去背裁切、單純
    // 矩形外框」的邊界去 clamp 拖曳座標——跟 stepDvdBounce() 那套飄動／
    // 撞牆物理迴圈不是同一組邊界：後者早就有 computeDvdPixelInsets() 算出
    // 的像素級 inset（見該函式的完整說明），拖曳這裡卻完全沒有套用，等於
    // 放開手指飄走時用的是「圖案實際邊緣」，用手指／滑鼠拖曳時卻仍然被
    // 矩形外框卡住——這正是使用者回報「拖曳到網頁邊界時，被一個空白的
    // 區域邊界卡住，而不是實際去背後邊界」的成因：矩形外框比圖案實際可視
    // 範圍多留了一圈透明空白，拖曳時手還沒真的把圖案本身的像素拖到螢幕
    // 邊緣，就已經被這圈空白卡住、拖不動了。
    // 修法：拖曳時也套用同一套 computeDvdPixelInsets()，跟飄動物理迴圈用
    // 完全相同的一組邊界，讓拖曳能一路拖到圖案本身的像素貼齊螢幕邊緣為止，
    // 不會再被外框的透明留白提前卡住。旋轉角度在拖曳全程本來就是抓取當下
    // 的固定值（見 commitDvdDrag() 裡把 dvdRotationVel 歸零的說明），這裡
    // 不需要額外處理旋轉變化，直接呼叫即可。
    const dvdDragPixelInsets = computeDvdPixelInsets();
    const minX = dvdBoundMinX() - dvdDragPixelInsets.left, minY = dvdBoundMinY() - dvdDragPixelInsets.top;
    const maxX = dvdBoundMaxX() + dvdDragPixelInsets.right, maxY = dvdBoundMaxY() + dvdDragPixelInsets.bottom;
    dvdX = clampDvd(e.clientX - dvdGrabOffsetX, Math.min(minX, maxX), Math.max(minX, maxX));
    dvdY = clampDvd(e.clientY - dvdGrabOffsetY, Math.min(minY, maxY), Math.max(minY, maxY));
    // 隨時更新這根手指目前的座標，讓正在進行中的兩指旋轉手勢（如果有）
    // 拿到的「連線角度」永遠是相對這根手指最新位置算出來的，位置拖曳跟
    // 兩指旋轉可以同時進行，不會互相干擾。
    dvdPrimaryTouchX = e.clientX;
    dvdPrimaryTouchY = e.clientY;
    // 主要手指的位置一改變，「兩指連線」的角度其實也跟著變了——如果兩指
    // 旋轉手勢正在進行中，這裡要立刻重新算一次角度並套用差值（跟旋轉手指
    // 自己移動時是同一套邏輯，見 applyDvdTwoFingerRotation() 的完整說明），
    // 角度基準值才不會因為只有拖曳手指動、旋轉手指沒動而漏掉這段變化，
    // 累積到下一次旋轉手指移動時才一次爆發出來，造成軸心跑偏。
    applyDvdTwoFingerRotation();
    dvdBounce.style.transform = dvdTransformString(dvdX, dvdY);

    const now = performance.now();
    dvdMoveSamples.push({ t: now, x: dvdX, y: dvdY });
    // 只留最近 ~DVD_FLING_WINDOW_MS 的取樣：這裡的裁切是相對「這一次
    // pointermove 觸發的時間」回推，只是先做初步瘦身、避免長時間拖曳時
    // 陣列無限長大；真正決定「放開那一刻算出來的末速度」的裁切，改成在
    // dvdPointerUp() 裡相對「放開當下」重新做一次（見該處說明），這裡
    // 不需要做到跟那邊完全一致。
    while(dvdMoveSamples.length > 2 && now - dvdMoveSamples[0].t > DVD_FLING_WINDOW_MS){
      dvdMoveSamples.shift();
    }
  }

  function dvdPointerUp(e){
    if(e.pointerId !== dvdDragCandidatePointerId) return;
    dvdDragCandidatePointerId = null;
    if(!dvdDragging){
      // 純點一下（含雙擊判斷用的兩次點擊）：從頭到尾沒有真的移動超過
      // DVD_TAP_MAX_MOVE，從未呼叫過 commitDvdDrag()，飄動字的位置、飄動
      // 迴圈完全沒被這次點擊動過（迴圈本來就沒被停過，繼續照原本的節奏
      // 跑）。這裡不需要做任何收尾、也不需要重新啟動動畫，維持原地不動。
      try{ dvdBounce.releasePointerCapture(e.pointerId); }catch(err){}
      return;
    }
    if(e.pointerId !== dvdPointerId) return;

    // 主要拖曳手指放開時，如果另一根手指還按著在做兩指旋轉，這根旋轉手指
    // 也一併視為結束：用它「這一刻」的角速度當最終甩轉速度（見
    // endDvdRotateGesture／finalizeDvdRotateVelocity 的說明），跟下面算
    // 位置末速度是同一套「放開當下的瞬時狀態決定甩出去的力道」的精神。
    // 結束後主迴圈 stepDvdBounce()（下面 dvdRAF 重新排入）會自然接手繼續
    // 讓這股角速度衰減，不需要另外處理。
    if(dvdRotatePointerId !== null) endDvdRotateGesture(dvdRotatePointerId);

    dvdDragging = false;
    dvdBounce.classList.remove('dvd-grabbing'); // 放開，觸發同一段 transition 平滑放大回原尺寸
    try{ dvdBounce.releasePointerCapture(e.pointerId); }catch(err){}

    const now = performance.now();

    // ---- 更精確地算出「放開那一刻」的末速度 ----
    // 舊算法：直接拿 dvdMoveSamples 裡最舊、最新兩筆算 (last.x-first.x)/(now-first.t)。
    // 問題出在「快速拖曳→停住→瞬間放開」這個情境：使用者停住之後、真正
    // 放開之前，座標完全沒變，瀏覽器根本不會再送出新的 pointermove 事件，
    // 所以 dvdMoveSamples 裡最新的那一筆，其實還停在「停住之前」那一瞬間
    // 的高速移動上，沒有任何一筆資料反映「已經停住」這段時間——分母雖然
    // 因為 now（放開當下）變大而拉長，但分子（位移）沒有跟著變小，算出
    // 來的還是一個接近停下來前的高速平均值，跟使用者放開當下「其實已經
    // 靜止」的真實狀態完全對不上，這正是「明明已經停住、放開卻還是被
    // 噴出去」的成因。
    //
    // 修法：放開的當下，先把「這一刻」的位置也補進取樣（座標就是目前的
    // dvdX/dvdY——如果使用者真的沒在動，這個座標會跟最後一筆移動紀錄
    // 完全相同），再用 DVD_FLING_WINDOW_MS 這個窗口、相對「放開當下」
    // （而不是相對上一次真的觸發 pointermove 的時間）重新裁掉太舊的取樣。
    // 這樣不管停住多久才放開：停住時間一旦超過這個窗口，窗口內就只剩下
    // 「停住期間、位置沒有變化」的取樣，頭尾位置相同，算出來的速度自然
    // 趨近 0；停住時間很短、還在窗口內的話，會混到一些停住前的移動取樣，
    // 算出來的是那段「正在減速中」的真實平均速度，一樣合理，不會低估
    // 真正快速甩出去的情況。
    dvdMoveSamples.push({ t: now, x: dvdX, y: dvdY });
    while(dvdMoveSamples.length > 1 && now - dvdMoveSamples[0].t > DVD_FLING_WINDOW_MS){
      dvdMoveSamples.shift();
    }

    const first = dvdMoveSamples[0];
    const last = dvdMoveSamples[dvdMoveSamples.length - 1]; // 就是剛剛補上的「放開當下」那一筆
    // 分母不再套一個 16ms 的下限：那個下限是為了避免除以 0，但套在真正
    // 「幾乎同時按下又放開」的瞬間點擊上，會把本來就該趨近 0 的速度硬是
    // 稀釋成一個非零值。改成只用一個極小的 1ms 地板單純防止除以 0，
    // 窗口內如果只剩下這一筆「放開當下」的取樣（first === last，位移為
    // 0），算出來的速度自然就是精準的 0，不需要另外特判。
    const dt = Math.max(1, last.t - first.t) / 1000;
    let vx = (last.x - first.x) / dt;
    let vy = (last.y - first.y) / dt;
    let flingSpeed = Math.hypot(vx, vy);

    // 有偵測到方向才更新方向；幾乎沒有移動（flingSpeed 趨近 0）就維持原本
    // 抓取前的方向不變，反正接下來速度也趨近 0，方向本來就看不太出來
    if(flingSpeed > 0.5) setDvdDirection(Math.atan2(vy, vx));

    // 甩出去的速度規則：只有「甩得比定速快」才需要自動修正——放開後從
    // 當下的高速開始，慢慢地（DVD_DECAY_MS，很長、很細膩）衰減回定速，
    // 這是原本就要的「回穩」效果，維持不變。
    // 「甩得比定速慢」（含幾乎沒動、原地放開）則完全不做任何自動修正：
    // 直接照偵測到的速度繼續飄，不會被拉回定速——這才是這顆彈跳字原本
    // 設計要的規則，«低於定速就照偵測到的速度跑»，不管那個速度有多慢。
    // dvdDecaying 只在「高於定速」這個分支打開，之後的每一影格
    // （stepDvdBounce 裡的 if(dvdDecaying)）才會去跑那段朝定速收斂的
    // 指數衰減；低於定速時 dvdDecaying 維持 false，dvdSpeed 就照這裡
    // 設定的偵測值一路用下去，不會再被任何邏輯動態調整。
    dvdSpeed = flingSpeed;
    if(flingSpeed > DVD_SPEED){
      dvdDecaying = true;
      dvdDecayStartTime = now;
      dvdDecayStartSpeed = flingSpeed;
      dvdDecayDurationMs = DVD_DECAY_MS;
    } else {
      dvdDecaying = false;
    }
    dvdWasCollidedLastFrame = false; // 放開的瞬間視為全新一輪，即使正好放在邊界上也能正確判斷成一次新的撞牆
    dvdWasScreenEdgeCollidedLastFrame = false;

    dvdLastTime = null;
    if(!dvdRAF) dvdRAF = requestAnimationFrame(stepDvdBounce);
  }
  // ⚠️ 保護區段結束（見 dvdPointerMove 前面的說明）。

  dvdBounce.addEventListener('pointermove', dvdPointerMove);
  dvdBounce.addEventListener('pointerup', dvdPointerUp);
  dvdBounce.addEventListener('pointercancel', dvdPointerUp);
  // 兩指旋轉手勢用的第二個 pointerId，寫法比照上面三行：固定綁在 dvdBounce
  // 本身，靠 startDvdRotateGesture() 裡呼叫的 setPointerCapture() 把這個
  // pointerId 之後的事件直接指定送過來，函式內部再各自比對是不是自己在
  // 追蹤的那個 pointerId（見 dvdRotatePointerMove／dvdRotatePointerUp
  // 開頭的判斷），不會跟上面負責位置拖曳的那一組互相干擾。
  dvdBounce.addEventListener('pointermove', dvdRotatePointerMove);
  dvdBounce.addEventListener('pointerup', dvdRotatePointerUp);
  dvdBounce.addEventListener('pointercancel', dvdRotatePointerUp);
  // 額外保險：桌機／平板用滑鼠拖曳時，比手機觸控更容易發生「放開的那一刻
  // 事件根本沒送達」的情況——例如把滑鼠拖出瀏覽器視窗範圍外才放開按鍵、
  // 切換分頁／視窗（alt-tab）、或瀏覽器基於某些理由自己收回了 pointer
  // capture。手機觸控天生被螢幕邊界約束住，手指不可能滑出「畫面」之外，
  // 這一類事件從頭到尾都會確實送達，所以原本只綁 pointerup/pointercancel
  // 在手機上幾乎不會出事；但桌機滑鼠一旦真的發生這種情況，dvdPointerUp()
  // 永遠不會被呼叫，dvdDragging 就會卡在 true、stepDvdBounce() 每一幀都會
  // 因為「if(dvdDragging){ dvdRAF=null; return; }」直接跳過，等於整個動畫
  // 迴圈被永久卡住——這也是「桌機/平板飄動的 e 完全不動」的另一個可能
  // 成因，這裡額外多接住這兩種情況、視同放開處理，確保不會卡死：
  //   1) lostpointercapture：瀏覽器自己收回了 capture（不管是什麼原因）
  //   2) 分頁/視窗失去焦點（blur）：使用者切走了，理論上滑鼠按鍵狀態
  //      已經跟目前的頁面無關，一律當作已經放開處理
  dvdBounce.addEventListener('lostpointercapture', (e) => {
    // 先比對是不是旋轉手指弄丟了 capture（例如系統手勢打斷）：這根手指
    // 跟負責拖曳位置的那根是各自獨立的 pointerId，要各自收尾，不能被下面
    // 「只看 dvdDragging」那個分支誤判、或蓋掉旋轉手指自己的結束流程。
    if(dvdRotatePointerId !== null && e.pointerId === dvdRotatePointerId){
      endDvdRotateGesture(e.pointerId);
      return;
    }
    if(dvdDragging) dvdPointerUp(e);
    else if(dvdDragCandidatePointerId === e.pointerId) dvdDragCandidatePointerId = null;
  });
  window.addEventListener('blur', () => {
    // 分頁／視窗失去焦點：旋轉手指跟拖曳手指都視同已經放開，各自走各自的
    // 收尾流程（順序上先結束旋轉，讓 dvdPointerUp() 裡「主要手指放開時
    // 順便處理還沒放開的旋轉手指」那段判斷維持單純，這裡先處理掉即可）。
    if(dvdRotatePointerId !== null) endDvdRotateGesture(dvdRotatePointerId);
    if(dvdDragging) dvdPointerUp({ pointerId: dvdPointerId });
    else dvdDragCandidatePointerId = null;
  });
  // pointerdown 不再直接綁在 dvdBounce 上——這個元素現在是 pointer-events:none
  // （見上面 CSS 的說明），本來就不會是任何事件的 hit-test 目標，綁了也不會
  // 觸發。改成在 window 這一層，用「當下實際渲染出來的矩形範圍」跟按下的
  // 座標比對：落在範圍內才視為抓住了飄動字，其餘一律放行，讓事件正常往下
  // 傳給底下真正被點到的照片／頁面元素。
  // pointermove / pointerup / pointercancel 維持原本綁在 dvdBounce 本身：
  // dvdPointerDown 裡呼叫的 setPointerCapture() 會讓同一個 pointerId 之後的
  // 事件全部直接指定送給這個元素，不再經過一般的 hit-test，所以 pointer-events
  // 就算是 none，只要曾經被 capture 過，後續 move/up/cancel 依然收得到。
  //
  // 使用者回報：飄動字在移動中時很難準確按到/點到，範圍太貼合圖形本身、
  // 沒有留任何容錯空間。原本 .dvd-bounce 的 CSS padding 就是 0（見上面
  // CSS 該處註解：故意拿掉，讓「撞牆物理」用的矩形精準貼合圖形邊緣，
  // 這件事不能改，改了牆壁碰撞的判定範圍也會跟著跑掉），所以不能直接在
  // CSS 上加大這個元素的框——這裡改成只在「判斷這一下有沒有抓到飄動字」
  // 這件事情上，用一個額外的容錯 padding 往外擴一圈虛擬熱區，不影響
  // dvdBounce 元素本身的實際大小、也不影響撞牆物理算的矩形（那邊還是另外
  // 各自呼叫 getBoundingClientRect() 量到原本大小）。
  // 觸控（手指）本來就比滑鼠游標準度低，容錯留寬一點；滑鼠是精準指標，
  // 容錯可以窄一些，兩邊都各自「稍微放大一點點」，不要放太多以免不小心
  // 蓋到旁邊的縮圖、影響照片本身的點擊／hover。
  const DVD_GRAB_PADDING_DESKTOP = 16; // px，桌機滑鼠額外可命中的邊界寬度
  const DVD_GRAB_PADDING_TOUCH = 26;   // px，觸控手指額外可命中的邊界寬度（比滑鼠寬一些）
  function dvdHitTest(rect, x, y, padding){
    return !(x < rect.left - padding || x > rect.right + padding || y < rect.top - padding || y > rect.bottom + padding);
  }
  // 手機觸控版修正：.dvd-bounce 本身是 pointer-events:none（見上面 CSS
  // 該處的完整說明），所以手指實際落下時，瀏覽器 hit-test 抓到的一路都是
  // 「底下」那個真正可以互動的元素（例如首頁的 .grid-item 照片，
  // touch-action:manipulation，允許整頁捲動）。下面 window 的 pointerdown
  // 監聽器雖然也會 e.preventDefault()，但那是給「滑鼠」用的：滑鼠按下、
  // 移動本來就不會觸發瀏覽器原生的捲動手勢，所以桌機/滑鼠拖曳飄動字完全
  // 沒問題。觸控則不同——手機瀏覽器（尤其 iOS Safari）決定「這次觸控要不
  // 要開始捲動頁面」，看的是實際被摸到那個元素的 touch-action、而且這個
  // 判斷做得很早，不保證會等到、或理會 pointerdown 事件處理常式裡才呼叫
  // 的 preventDefault()——所以使用者一碰到飄動的 E，手指稍微一動，
  // 瀏覽器直接把這次觸控當成「捲動首頁」處理掉，飄動字完全抓不到，這正是
  // 「手機版在首頁沒辦法觸控抓取飄動的 E」的成因。
  // 修法：另外加一個掛在 touchstart、且明確不是 passive（{passive:false}）
  // 的監聽器，用跟下面 pointerdown 一樣的座標比對法（含上面的容錯 padding）
  // 判斷「這一下是不是按在飄動字（含容錯熱區）上」；只要是，就在這裡同步
  // 呼叫 preventDefault()——非 passive 的 touchstart 呼叫 preventDefault()
  // 是瀏覽器公認、保證有效取消原生捲動的寫法，不像 pointerdown 那樣看瀏覽器
  // 實作而定。只在命中飄動字範圍內才擋，其餘一律放行，不影響首頁正常的
  // 捲動、照片點擊、hover 等其他功能。這裡固定用觸控的容錯值（本來就只有
  // 觸控事件才會走到這個監聽器），確保跟下面 pointerdown 判斷的範圍一致，
  // 不會發生「這裡覺得沒按到、放行捲動，但 pointerdown 那邊卻覺得按到了」
  // 這種不一致、導致抓取途中被瀏覽器搶走變成捲動頁面的情況。
  window.addEventListener('touchstart', (e) => {
    // 修正手機版照片詳細頁「返回上一頁」箭頭偶爾失靈的成因：飄動的 e
    // 進到照片詳細頁時只是用 CSS（見 .dvd-bounce.dvd-hidden 的完整說明）
    // 把「內層圖片」縮小到看不見＋淡出，外層 .dvd-bounce 容器本身的
    // 版面大小、以及它最後停留的位置都原封不動，getBoundingClientRect()
    // 量到的還是一個跟原本一樣大、只是隱形的矩形，飄到哪就停在哪（隨機、
    // 不固定）。這裡的 touchstart 監聽器沒有先檢查它是不是處於隱藏狀態，
    // 只要這個隱形矩形剛好疊到畫面上其他可互動的元素（例如手機版返回
    // 箭頭現在會移到左下角、桌機版在右上角，兩者都有機會被飄到），
    // 使用者點下去的這一下就會先被這裡攔截、呼叫 preventDefault()——
    // 一旦觸控序列中有任何一次被 preventDefault()，瀏覽器規範規定不會
    // 再補送 click 等相容滑鼠事件，返回箭頭的 click 監聽器因此完全不會
    // 被觸發，看起來就是「按了沒反應」，而且是不是失靈全看飄動字當下
    // 停在哪，才會是「有時候」這種不規律的症狀。
    // 加上這個判斷：飄動的 e 目前是隱藏狀態（dvd-hidden，例如正在照片
    // 詳細頁）時，直接放行、完全不做命中判斷，觸控事件正常穿透到底下
    // 真正看得到、可以互動的元素；只有飄動的 e 真的顯示在畫面上时，才
    // 需要攔截、判斷是不是要抓取它，跟原本手機版「抓不到飄動字」那個
    // 問題的修法互不影響。
    if(dvdBounce.classList.contains('dvd-hidden')) return;
    const touch = e.touches && e.touches[0];
    if(!touch) return;
    const rect = dvdBounce.getBoundingClientRect();
    if(!dvdHitTest(rect, touch.clientX, touch.clientY, DVD_GRAB_PADDING_TOUCH)) return;
    e.preventDefault();
  }, { passive: false });

  let dvdSuppressNextClick = false; // 抓住飄動字的那次按下／放開，不該連帶
                                     // 觸發底下那張照片的 click（打開詳情頁）
  let dvdSuppressClickTimer = null; // 保底逾時：見下面 pointerdown 監聽器內的說明
  // 雙擊判斷改成直接看 pointerup（見下面說明），這裡只需要記住「命中飄動字
  // 的這次按下」是哪個 pointerId、按下當下的座標在哪，pointerup 時才能比對
  // 是不是同一次觸控、中途有沒有明顯位移。
  let dvdTapCandidatePointerId = null;
  let dvdTapStartX = 0, dvdTapStartY = 0;
  const DVD_TAP_MAX_MOVE = 10; // px，pointerdown→pointerup 之間位移在這個範圍內才算「原地點一下」，拖曳／甩出去不算
  window.addEventListener('pointerdown', (e) => {
    // 跟上面 touchstart 監聽器同樣的理由（見該處完整說明）：飄動的 e
    // 隱藏狀態（dvd-hidden）時，它的邊界框只是停在最後位置的「隱形」
    // 矩形，不該繼續攔截落在它範圍內的點擊/觸控，直接放行。
    if(dvdBounce.classList.contains('dvd-hidden')) return;

    // ---------- 修正：「手機版兩指抓住飄動的 e 一定要先單指抓住、再用
    // 第二指旋轉才行，沒辦法一開始就兩指同時按住直接同步拖曳＋旋轉」
    // ----------
    // 成因：抓取這件事本身是延後 commit 的（見上面 dvdPointerDown() 開頭
    // 的完整說明：按下當下只記錄「候選」pointerId／座標，要等
    // dvdPointerMove() 裡偵測到位移真的超過 DVD_TAP_MAX_MOVE 才會呼叫
    // commitDvdDrag() 正式把 dvdDragging 設成 true）——目的是避免單純點一下
    // 或雙擊也被誤判成一次微小的拖曳。這表示「兩指幾乎同時按下」時，第一
    // 根手指這一刻通常都還停在原地（連候選都還沒滿足位移門檻，更別說正式
    // commit），dvdDragging 仍然是 false。下面緊接著的
    // `if(dvdDragging && e.pointerId !== dvdPointerId)` 這個分支因此完全
    // 不會被吃到，第二根手指的這次按下會直接落到再下面的「一般流程」，
    // 把 dvdDragCandidatePointerId／dvdDragCandidateStartX/Y 整組直接覆寫
    // 成第二根手指自己的資料——等於悄悄丟掉第一根手指原本的候選資格。
    // 結果就是使用者感受到的「一定要先讓其中一指真的滑動一小段、確立成
    // 拖曳之後，才能補上第二指觸發旋轉；如果兩指幾乎同時按下，永遠只會
    // 變成『重新用第二指單指候選』，兩指同時按住完全沒有反應」。
    // 修法：這裡補一個分支，專門處理「還沒 commit、但已經有另一根手指是
    // 候選人」的情況——只要這一下落下的手指也命中飄動字的觸控熱區，就
    // 不必等第一根手指自己動起來，直接：
    //   1) 用第一根手指候選時記下的起點座標（dvdDragCandidateStartX/Y），
    //      比照 commitDvdDrag() 原本會做的事，把它 promote 成正式拖曳
    //      ——因為手指幾乎沒動過，這個座標此刻仍然等同它的實際位置；
    //   2) 這一根手指緊接著直接呼叫 startDvdRotateGesture() 接手旋轉，
    //      跟下面「已經在拖曳」那個既有分支收尾時做的事完全一樣。
    // 這樣兩指幾乎同時按住飄動的 e，會在同一個事件循環裡「一步到位」——
    // 第一指負責位置、第二指立刻開始旋轉，不需要使用者刻意先拖動一小段
    // 才能觸發，也不會影響「先單指拖曳、之後才補第二指」這個原本就正常
    // 的既有路徑（那條路徑這裡完全沒有動到，走的還是下面原本那個分支）。
    if(!dvdDragging && dvdDragCandidatePointerId !== null && e.pointerId !== dvdDragCandidatePointerId && dvdRotatePointerId === null){
      const candRect = dvdBounce.getBoundingClientRect();
      if(dvdHitTest(candRect, e.clientX, e.clientY, DVD_GRAB_PADDING_TOUCH)){
        const firstPointerId = dvdDragCandidatePointerId;
        const firstX = dvdDragCandidateStartX;
        const firstY = dvdDragCandidateStartY;
        // 注意：dvdDragCandidatePointerId 這裡刻意不清空、也不改動——它在
        // 正常流程裡本來就是「從第一根手指按下那一刻起，一路維持到它真的
        // pointerup 才清空」（見 dvdPointerDown()／commitDvdDrag()：後者
        // 完全不會去動這個變數），dvdPointerUp() 開頭正是靠這個值來比對
        // 「這次放開的是不是原本那根拖曳手指」。這裡只是把 commitDvdDrag()
        // 提前呼叫，第一根手指本身的候選狀態／pointerId 不應該有任何變化，
        // 清成 null 會讓它之後真正放開時 dvdPointerUp() 的比對失敗、整段
        // 收尾邏輯被跳過。
        commitDvdDrag({ pointerId: firstPointerId, clientX: firstX, clientY: firstY });
        startDvdRotateGesture(e);
        dvdSuppressNextClick = true;
        return;
      }
    }

    // 已經有一根手指在拖曳飄動的 e（dvdDragging 為 true），這一下如果是
    // 另一根手指落下：不能讓它跟下面一般流程一樣被當成「新的一次拖曳
    // candidate」（那樣會覆蓋掉 dvdDragCandidatePointerId，打斷正在進行
    // 中的拖曳），改成試著接手當「兩指旋轉」的第二根手指。只有還沒有
    // 別的手指在做旋轉手勢（dvdRotatePointerId === null）、且這一下確實
    // 落在飄動字的容錯熱區內，才真的啟動旋轉；不管有沒有命中，這一下都
    // 直接 return，不會落到下面繼續被當一般拖曳／點擊處理。
    if(dvdDragging && e.pointerId !== dvdPointerId){
      if(dvdRotatePointerId === null){
        const rotRect = dvdBounce.getBoundingClientRect();
        if(dvdHitTest(rotRect, e.clientX, e.clientY, DVD_GRAB_PADDING_TOUCH)){
          startDvdRotateGesture(e);
        }
      }
      return;
    }

    const rect = dvdBounce.getBoundingClientRect();
    // 滑鼠（pointerType === 'mouse'）用比較窄的桌機容錯；觸控／筆這類準度
    // 較低的輸入方式一律用比較寬的觸控容錯，跟上面 touchstart 監聽器判斷
    // 的範圍保持一致（見該處說明）。
    const padding = e.pointerType === 'mouse' ? DVD_GRAB_PADDING_DESKTOP : DVD_GRAB_PADDING_TOUCH;
    if(!dvdHitTest(rect, e.clientX, e.clientY, padding)) return;
    dvdSuppressNextClick = true;
    dvdTapCandidatePointerId = e.pointerId;
    dvdTapStartX = e.clientX;
    dvdTapStartY = e.clientY;
    dvdPointerDown(e);
    // 保底逾時：只用來清 dvdSuppressNextClick（見下面 click 監聽器的說明），
    // 跟雙擊判斷本身無關。
    clearTimeout(dvdSuppressClickTimer);
    dvdSuppressClickTimer = setTimeout(() => { dvdSuppressNextClick = false; }, 400);
  });
  // ---------- 「抓住飄動的 e、點兩下」觸發照片物理堆疊模式 ----------
  // 原本這裡是靠瀏覽器在 pointerdown→pointerup 之後、中途幾乎沒有位移時
  // 補發的合成 click 事件來判斷雙擊。這在滑鼠環境（含大部分桌面瀏覽器的
  // 觸控模擬預覽）完全正常，換到手機真機卻整個失效、雙擊毫無反應——
  // 成因是上面 touchstart 監聽器（見該處說明）跟 dvdPointerDown() 內部
  // 都會對命中飄動字的這次觸控呼叫 e.preventDefault()，而 Touch Events
  // 規範規定：一次觸控序列裡只要有任何一個 touchstart/touchmove/touchend
  // 被 preventDefault()，瀏覽器就完全不會再補送「相容滑鼠事件」
  // （mousedown/mouseup/click），包含 click 在內——不是「延遲」或「機率
  // 性漏掉」，是規範明文規定「不會再送」。滑鼠環境的 click 是瀏覽器對
  // 「真實滑鼠按鍵按下放開」直接產生的原生事件，不受這條規則影響，這正是
  // 「預覽點兩下正常、手機真機上架後完全沒反應」這個落差的根本原因。
  // 修法：雙擊判斷改成直接在 pointerup 做，不再依賴 click 事件——pointerup
  // 不管滑鼠還是觸控都保證會送達（除非整個手勢被系統取消，那種情況交給
  // pointercancel 兜底清掉候選狀態即可）。只要這次 pointerup 的 pointerId
  // 跟上面 pointerdown 記錄的 dvdTapCandidatePointerId 相同，且位移沒有
  // 超過 DVD_TAP_MAX_MOVE（代表是原地點一下、不是拖曳／甩出去），就算一次
  // 有效點擊；跟上一次有效點擊的時間差在 DVD_DOUBLE_CLICK_MS 內就視為雙擊，
  // 呼叫 handleDvdDoubleClick() 進場／收場。滑鼠與觸控從此共用同一套判斷。
  let dvdLastRealClickTime = 0;
  const DVD_DOUBLE_CLICK_MS = 320;
  // ---------- 修正：「堆疊頁面單擊照片掉下去，感覺慢了一拍才反應」 ----------
  // 原本這裡是「先等、再決定」：第一下點擊先不做任何事，只記錄成
  // 「雙擊候選的第一下」，開一個 DVD_DOUBLE_CLICK_MS（320ms）的計時器；
  // 只有等這段時間內真的沒有等到第二下、確定不是雙擊之後，才真正呼叫
  // handleDvdSingleClick() 換一批照片掉下去。這代表不管使用者是不是真的
  // 想雙擊，單擊的反應永遠得先扣掉這 320ms 的「觀察期」，這正是使用者
  // 反應的「按了好像等一拍才掉下去」的根本成因——不是效能問題，是刻意
  // 設計成延後執行。
  // 修法：改成「先做、可反悔」——不用等，這一下點擊當下就立刻呼叫
  // handleDvdSingleClick()（該函式內部本來就只在 photoFallState==='active'
  // 時才有動作，其餘狀態呼叫了也是 no-op，不會有副作用）。如果緊接著
  // DVD_DOUBLE_CLICK_MS 內真的又等到第二下、判定成雙擊，才呼叫
  // handleDvdDoubleClick()——這時 photoFallState 已經因為上面提前觸發的
  // handleDvdSingleClick() 變成 'reshuffling'，會自然命中
  // handleDvdDoubleClick() 內本來就已經寫好、專門處理「換批動畫播放途中
  // 又雙擊要收場」這個情境的 interruptReshuffleForExit() 分支（見該函式
  // 內的完整說明），無縫接續到收場流程，不會有任何卡頓或視覺上的異常。
  // 也就是說：這個分支原本就是為了處理「先單擊觸發換批、再雙擊打斷」
  // 這個情境而設計的，現在只是讓每一次單擊都直接、立即走上這條已經驗證
  // 過的路徑，不用再額外等一段觀察期，單擊變得即時反應，雙擊的收場
  // 行為完全不受影響。
  window.addEventListener('pointerup', (e) => {
    if(dvdTapCandidatePointerId === null || e.pointerId !== dvdTapCandidatePointerId) return;
    dvdTapCandidatePointerId = null;
    const dx = e.clientX - dvdTapStartX;
    const dy = e.clientY - dvdTapStartY;
    if(Math.hypot(dx, dy) > DVD_TAP_MAX_MOVE) return; // 明顯位移＝拖曳／甩出去，不算一次點擊
    const nowClick = Date.now();
    if(nowClick - dvdLastRealClickTime <= DVD_DOUBLE_CLICK_MS){
      dvdLastRealClickTime = 0;
      handleDvdDoubleClick();
    } else {
      dvdLastRealClickTime = nowClick;
      handleDvdSingleClick(); // 立即觸發，不再等待觀察期（見上方完整說明）
    }
  });

  });

  // 照片的 click（openDetail）。雙擊判斷已經搬到上面的 pointerup，這裡不再
  // 重複判斷——不然滑鼠使用者同一下點擊會被 pointerup／click 各算一次，
  // 雙擊會被誤判成要點四下才觸發。用 capture 階段攔截，搶在照片自己的
  // click 監聽器執行之前擋下來。手機真機上因為 click 根本不會被送達（見
  // 上面說明），這個監聽器在觸控情境下形同虛設，但也因此不會有任何副作用。
  window.addEventListener('click', (e) => {
    if(!dvdSuppressNextClick) return;
    dvdSuppressNextClick = false;
    clearTimeout(dvdSuppressClickTimer);
    e.stopPropagation();
    e.preventDefault();
  }, true);

  // 這裡原本是直接綁 clampDvdIntoViewport，resize 事件一觸發就立刻拿當下
  // 即時的視窗尺寸重新夾一次邊界——手機版剛進站那幾秒，網址列收合動畫
  // 會連續觸發好幾次 resize，等於連續好幾次都拿「過渡態」的尺寸更新
  // dvdSettledViewportW/H（見上面該變數旁的完整說明），boundary 因此還是
  // 會抖動，跟這裡想解決的問題沒有真正脫鉤。改成綁定 scheduleDvdViewportSettle()：
  // 每次 resize 都重新起算一段等待時間，只有真正停止變化一段時間之後，
  // 才會呼叫一次 clampDvdIntoViewport() 用「這時候」的（已經穩定的）尺寸
  // 更新邊界，中途的過渡態尺寸完全不會被採信。
  window.addEventListener('resize', scheduleDvdViewportSettle);
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', scheduleDvdViewportSettle);
  }

  // ================= 照片物理掉落堆疊模式（雙擊飄動的 e 觸發／收起） =================
  //
  // 整體流程分四段：
  //   idle → entering（縮圖／編號／時鐘先收起）→ active（15 張照片＋飄動的 e
  //   一起用 Matter.js 物理掉落、堆疊、可拖曳）→ exiting（拿掉地板，全部
  //   物理掉出畫面下緣）→ 收尾回到 idle，首頁縮圖用原本「放大進場」動畫
  //   重新出現。photoFallState 這個狀態機用來擋掉動畫進行中又被連續雙擊
  //   打斷的情況；photoFallModeActive 是給上面 dvd 飄動迴圈（clampDvdIntoViewport／

  // 首次載入效能；載入一次後常駐，之後每次進出模式不用重新載入。
  // 目前只做桌機／滑鼠版本（Matter.Mouse 只處理滑鼠事件），符合這一版

  // touch-to-mouse 轉接或改寫成 Pointer Events 版本另外實作。

  let photoFallState = 'idle'; // 'idle' | 'entering' | 'active' | 'exiting' | 'reshuffling'（單擊換批，見 reshufflePhotoFallBatch()）
  let photoFallModeActive = false; // entering/active/exiting 這整段期間都是 true
  const photoFallStage = document.getElementById('photoFallStage');

  // isDetailMobile()（window.innerWidth<=640）判斷，跟全站手機/桌機分流

  function photoFallCount(){ return isDetailMobile() ? 8 : 15; }
  const PHOTO_FALL_SHRINK_MS = 420;      // 縮圖＋編號收起（縮小至消失）的時長
  const PHOTO_FALL_IDX_FADE_MS = 260;    // 編號淡出比縮圖快一點，兩者收起節奏才有層次，不是死板同步
  const PHOTO_FALL_CLOCK_FADE_MS = 200;  // 下方時鐘「快速」淡出，明顯比縮圖收起更短促
  const PHOTO_FALL_SPAWN_STAGGER_PX = 130; // 15 張照片起始 y 座標依序往上錯開多少 px，製造「一張接一張掉落」的瀑布感，不是整疊一次砸下來
  const PHOTO_FALL_SPAWN_BASE_PX = 160;    // 第一張的起始 y（視窗上緣再往上的距離）
  const PHOTO_FALL_SPAWN_JITTER_PX = 90;   // 每張再疊加一點隨機值，避免看起來太機械式整齊
  const PHOTO_FALL_GRAVITY = 1.8; // 進場掉落＋堆疊期間的基礎重力，微調自 1.2
  const PHOTO_FALL_EXIT_GRAVITY_SCALE = 1.9; // 收起時（地板拿掉）在 PHOTO_FALL_GRAVITY 之上再額外加重的重力倍率，讓「掉出畫面」這段明顯比平常堆疊時更快、更乾脆，維持跟基礎重力之間原本的相對比例不變
  const PHOTO_FALL_EXIT_MAX_WAIT_MS = 1700;  // 保底：不管有沒有偵測到全部掉出畫面，最多等這麼久就強制收尾，避免極端情況卡住
  const PHOTO_FALL_LOAD_MAX_WAIT_MS = 650; // 單張照片還沒暖機好時，最多等圖片載入這麼久，逾時就先讓它跟其他張一起開始掉落（見下面 spawnFallingPhotos() 裡的說明），避免單一張慢的照片拖累、跟其他張脫節，看起來像「停頓一下才掉下去」

  let matterLoadPromise = null;
  function loadMatterJS(){
    if(window.Matter) return Promise.resolve();
    if(matterLoadPromise) return matterLoadPromise;
    matterLoadPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js';
      s.async = true;
      s.onload = () => resolve();
      s.onerror = () => { matterLoadPromise = null; reject(new Error('Matter.js load failed')); };
      document.head.appendChild(s);
    });
    return matterLoadPromise;
  }

  let pfEngine = null, pfRunner = null, pfMouse = null, pfMouseConstraint = null;
  // 見下面 startPhotoFallEngine() 內「拖著物件移出視窗，回來時還卡在抓著
  // 狀態」的完整說明——這裡存放掛在 document 上的偵測 listener 參照，
  // 讓 finishExitPhotoFallMode() 收尾時可以正確解除，不會每次進出堆疊
  // 模式就疊加一個新的 listener。
  let pfMouseButtonGuard = null;
  // pfRunner 目前是不是真的處於「停止」狀態——重複呼叫「啟動迴圈」如果對一個
  // 「已經在跑」的迴圈重複呼叫，會疊加出第二個 requestAnimationFrame 迴圈
  // （「停止迴圈」只會取消最後一次記錄到的那個迴圈 id，先前疊加的迴圈不會
  // 被真的清掉），造成模擬速度變兩倍甚至更快這種不容易發現的 bug。
  // 原本因為「一按 Preview 就立刻凍結」，迴圈在整段 preview 開啟期間保證
  // 一定是停著的，dropDvdBackIntoPhotoFall() 呼叫「啟動迴圈」之前不需要
  // 另外檢查。現在改成「蓋滿畫面那一刻才停」（見
  // resumeDvdFloatAfterPhotoFallCover()），使用者有可能在蓋滿之前就提早
  // 關閉 preview，這時迴圈其實根本還沒被停過——用這個旗標明確記錄
  // 「目前是不是真的停著」，該重新啟動時才知道要不要真的呼叫「啟動迴圈」，
  // 避免踩到上面那個疊加迴圈的陷阱。
  let pfRunnerPaused = false;

  // ---------- 自訂固定時間步＋累加器的物理迴圈 ----------
  // 取代原本直接用的 Matter.js 內建 Runner（isFixed:true 模式）。
  // 修正「手機版重力比桌機超級慢」：isFixed:true 模式下，Runner 每次
  // requestAnimationFrame 被呼叫到，不管距離上一次呼叫實際經過了多少真實
  // 時間，都只推進「固定一份」（1000/60 毫秒）的模擬時間——也就是說，物理
  // 世界一秒鐘總共被推進多少模擬時間，取決於 requestAnimationFrame 這一秒
  // 內實際被呼叫幾次，不是取決於真實經過了多少時間。桌機通常能穩定跑滿
  // 60fps，兩者剛好一致、感覺不出問題；手機要同時處理 15 張照片的陰影／
  // 變形加上物理運算，實際能跑到的畫面更新頻率常常掉到只剩 30 甚至更低，
  // 這時候一秒內只被呼叫 30 次左右，物理世界一秒卻只被推進
  // 30×(1000/60)＝500 毫秒的模擬時間，等於整個世界用「慢動作」（實際播放
  // 速度只剩一半甚至更低）在跑，這正是手機版重力感覺超級慢的成因——跟
  // PHOTO_FALL_GRAVITY 這個數值本身、或畫面尺寸完全無關，上一次改成依視窗
  // 高度縮放重力（pfGravityScale()）並沒有對到真正的病灶，所以完全沒感覺，
  // 這裡直接拿掉那個縮放，改成從根本解決時間步進的問題。
  // 改成自己寫累加器（accumulator）迴圈：每一次 requestAnimationFrame，量出
  // 「這一幀距離上一幀實際經過了多少真實時間」，累加進 pfAccumulatorMs；
  // 只要累加器裡還有超過一份 PF_FIXED_STEP_MS 的量，就呼叫一次
  // Engine.update() 消耗掉一份，需要的話一次補推進好幾步（最多
  // PF_MAX_SUBSTEPS 步，避免分頁被切到背景很久之後切回來，累積了巨量真實
  // 時間差，一次全部補完造成畫面瞬間卡死）——不管 requestAnimationFrame
  // 一秒鐘實際被呼叫幾次（60、30、甚至更低），物理世界每秒鐘總共被推進的
  // 模擬時間都固定等於真實經過的時間，手機、桌機播放速度從此完全一致，
  // 不再因為裝置效能高低而跑出「慢動作」。
  const PF_FIXED_STEP_MS = 1000 / 60;
  const PF_MAX_SUBSTEPS = 5; // 一幀最多補幾步，超過的落後時間直接捨棄，不追了，避免長時間分頁在背景之後回來瞬間卡死
  let pfLoopRafId = null;
  let pfLoopLastTime = null;
  let pfAccumulatorMs = 0;

  function pfLoopTick(now){
    pfLoopRafId = requestAnimationFrame(pfLoopTick);
    if(pfLoopLastTime === null){ pfLoopLastTime = now; return; } // 第一幀還沒有「上一幀」可以算真實經過時間，先跳過，下一幀開始正常累加
    let frameMs = now - pfLoopLastTime;
    pfLoopLastTime = now;
    if(frameMs > 250) frameMs = 250; // 分頁切到背景很久才切回來：真實經過時間可能長達數秒甚至數分鐘，夾住上限，避免下面 while 迴圈瞬間跑出天文數字的補步
    pfAccumulatorMs += frameMs;
    let steps = 0;
    while(pfAccumulatorMs >= PF_FIXED_STEP_MS && steps < PF_MAX_SUBSTEPS){
      window.Matter.Engine.update(pfEngine, PF_FIXED_STEP_MS);
      pfAccumulatorMs -= PF_FIXED_STEP_MS;
      steps++;

    if(steps >= PF_MAX_SUBSTEPS) pfAccumulatorMs = 0; // 真的追不上（例如裝置效能長期跟不上），與其繼續攢著、之後某一幀忽然爆發式補一大串步造成瞬間卡頓，不如直接捨棄多餘的落後量，讓它從這一幀重新開始正常累積
    // DOM 同步移到這裡、迴圈外面，只在這一影格「真的有物理進展」時呼叫一次
    // （見上面 startPhotoFallEngine() 裡 pfSyncHandler 宣告處的完整說明）：
    // 不管這一影格裡上面的 while 迴圈補跑了 1 步還是 5 步，畫面只需要反映
    // 最終結果，style.transform 只寫一次，不再隨補步次數等比例放大 DOM
    // 寫入量。steps===0（這一影格時間還沒攢滿一整步）時完全不用重寫，

    if(steps > 0 && pfSyncHandler) pfSyncHandler();
  }

    pfLoopLastTime = null;
    pfAccumulatorMs = 0;
    pfLoopRafId = requestAnimationFrame(pfLoopTick);
  }

  function pfStopLoop(){
    if(pfLoopRafId !== null){ cancelAnimationFrame(pfLoopRafId); pfLoopRafId = null; }
  }

  let pfGroundBody = null, pfLeftWall = null, pfRightWall = null;
  let pfItems = []; // { body, el } 一般掉落照片
  // 每呼叫一次 spawnFallingPhotos() 就遞增一次的世代編號。配合下面
  // spawnFallingPhotos() 內「延後到圖片真的載入完成才建立物理 body」的

  let pfSpawnGeneration = 0;
  let pfDvdItem = null; // { body } 飄動的 e，共用既有的 #dvdBounce 元素，不另外建立分身
  let pfSyncHandler = null;
  let pfExitFallbackTimer = null; // 保底逾時計時器（不管有沒有偵測到全部掉出畫面，最多等這麼久強制收尾）
  let pfExitPollTimer = null;     // 輪詢「是否全部掉出畫面」的計時器，跟上面那個分開存放，理由見 exitPhotoFallMode() 內的說明
  // 使用者這一刻是不是正用滑鼠／觸控抓著某張照片（或飄動的 e）——見下面
  // MouseConstraint 的 startdrag/enddrag 監聽器同步更新。用途見
  // exitPhotoFallMode() 內保底逾時計時器那段說明：使用者可能在畫面收場、
  // 準備進到下一步的這段期間，正好抓著一張照片懸在半空不放，這種情況下
  // 不該讓保底逾時強制把畫面推進到下一步（那樣會變成照片還吊在半空、

  // 繼續。
  let pfDragging = false;

  // ---------- 單擊飄動的 e：換一批隨機照片（不進出堆疊模式，維持在 active）----------
  // Matter.js 的 collisionFilter：預設每個 body 的 category=0x0001、
  // mask=0xFFFFFFFF（跟任何東西都會碰撞）。換批照片時，舊的一批要整批
  // 掉出畫面（跟 exitPhotoFallMode() 一樣拿掉共用地板），但飄動的 e 這次
  // 不是要離場，希望它掉到網頁邊界就卡住、留在畫面上等新照片——如果照舊
  // 用同一塊共用地板，e 會跟著舊照片一起被拿掉地板、一路掉出畫面。這裡
  // 額外給 e 一個「只有它自己會撞到」的專屬地板：把 e 標記成

  // 照片維持預設分類，跟這塊地板不會產生碰撞判定、直接穿過去，兩者互不
  // 影響。
  const PF_CATEGORY_DVD = 0x0002;
  const PF_CATEGORY_DVD_FLOOR = 0x0004;
  let pfDvdFloor = null; // 換批照片期間，只擋飄動的 e、不擋照片的專屬地板（見上面說明）
  // 目前畫面上這一批掉落照片的 url 集合，換下一批時用來排除，確保新一批
  // 不會跟現在這批完全重複（見 pickReshuffleBatch() 的完整說明）。初次
  // 進場（spawnFallingPhotos 沒有指定 photoBatch）跟每次換批之後都會
  // 更新這個集合。
  let pfLastBatchUrls = new Set();
  // Fisher–Yates 洗牌，公平的隨機排列，不偏袒任何一項——spawnFallingPhotos()
  // 決定初次進場的隨機順序、pickReshuffleBatch() 決定換批時的隨機順序，
  // 兩處共用同一份實作，不重複寫兩次。
  function shuffled(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ---------- 堆疊照片：提前預熱這一批會用到的圖檔，避免掉落時出現空白 ----------
  // 首頁縮圖用 loading="lazy"（見 GRID_EAGER_COUNT 旁的說明），一打開網站
  // 只有前幾張是真的載入好的，其餘要捲到附近才會觸發載入——使用者不需要
  // 先把整個網格捲過一遍就能雙擊進堆疊模式，這批隨機洗出來的照片裡，
  // 難免混著幾張「gridUrl 還沒被瀏覽器真的載入過」的縮圖。原本
  // spawnFallingPhotos() 是建立 DOM 元素的同一刻才直接賦值 img.src，
  // 完全沒有預留任何緩衝，遇到這種還沒載過的縮圖，畫面上就會看到
  // .photo-fall-item 那格淺灰／近白底色的方塊愣在那裡一下下，等圖真的
  // 下載完成才「補」跳出來——這正是「偶爾幾張白色的圖片」的成因。
  // 修法：只要確定這一批會是哪幾張（進場、或單擊換批），就立刻在背景把
  // gridUrl／thumbUrl 都先請瀏覽器下載＋decode 一次，讓它們真正顯示出來
  // 之前，多半已經有充裕的提前量（進場：Matter.js 載入＋首頁縮圖收起的
  // 這段時間；換批：舊照片全部掉出畫面的這段時間，見呼叫端的說明）。
  // 兩種畫質都先暖：gridUrl（340px）是一般大小照片會用到的，thumbUrl
  // （700px）是隨機挑中的「放大版」會用到的——這裡不知道等一下哪幾張
  // 會被抽中放大，乾脆兩種都暖，反正都是很小的縮圖，多暖幾張的頻寬成本
  // 可以忽略不計。
  // 原本這裡是「射後不理」：發出下載/decode 請求就結束，暖好的 Image
  // 物件用完即丟；真正顯示時 spawnFallingPhotos() 還是另外建立一個全新的
  // <img> 重新指定 src，而且畫面上這顆全新的 <img> 一律固定從 opacity:0
  // 開始、等 decode 完成的 callback 觸發才淡入（見 CSS .photo-fall-item
  // img 的 opacity/.loaded 規則）——這段 0.22s 的淡入是「每一張都一定會
  // 播」，跟這張圖到底有沒有真的暖好完全無關，這正是即使暖機函式已經呼叫
  // 過，畫面上還是能看到一瞬間空白/淺灰方塊、感覺像是「延遲」的根本原因。
  // 也曾經試過「等這個 Promise resolve 才 spawn」，但那樣反而是犧牲了
  // 「雙擊馬上全部掉下來」的即時感去換照片完整度，這不是我們要的方向。
  //
  // 真正的解法：改成回傳 { promise, cache }，cache 是 url → 已經暖好
  // （下載＋decode 完成）的 Image 元素本身。spawnFallingPhotos() 真的要
  // 顯示這張照片時，直接複製這個「已經準備好像素」的元素塞進畫面，不需要
  // 再建立一個從零開始的新 <img>、也不需要再等一次 decode／CSS 淡入——
  // 這才是真正的「零延遲」，用的是「東西早就準備好了，直接拿來用」，
  // 而不是靠等待或猜測時間。promise 仍然保留，resolve 代表這批圖全部暖機
  // 完成（或個別失敗），但呼叫端不再需要靠它來決定何時 spawn，spawn 的
  // 時機完全不受暖機影響、該多快就多快；沒趕上暖機的極少數幾張，交給
  // spawnFallingPhotos() 裡原本就有的「淡入」安全網頂著，不會因為個別幾張
  // 慢，就拖累其他張、拖累整批的出場節奏。
  // 原本這裡不管成功失敗都會呼叫 store() 把 Image 元素塞進 cache——
  // decode() 失敗（.catch(store)）、onerror 觸發（onerror = finish，
  // finish() 內一樣呼叫 store()）都照樣快取。問題是「失敗」代表這張圖片
  // 根本沒有真的載入成功（常見成因：15 張照片 × 2 種尺寸，同時對 Google
  // Drive 縮圖服務發出將近 30 個並發請求，偶爾會被暫時性拒絕/逾時），
  // 快取進去的其實是一個沒有像素資料的「破圖」Image 物件。
  // spawnFallingPhotos() 看到 cache 裡有這個 url 就直接信任它「已經暖好」，
  // cloneNode() 複製、立刻標上 .loaded 顯示出來——結果就是一塊灰色方塊
  // （.photo-fall-item 的底色）永久卡在畫面上：因為它從頭到尾沒有走過
  // 任何「重新嘗試載入」的路徑，暖機那次的失敗就是它唯一、也是最後一次
  // 的機會。
  // 修法：store() 只在真正成功時呼叫，失敗時單純什麼都不做（連
  // resolve/整批 Promise 還是要 resolve，不能讓一張圖片失敗卡住整批暖機
  // 的完成判斷，但「快取」這件事不能發生）。這樣暖機失敗的圖片，url 不會
  // 出現在 cache 裡，spawnFallingPhotos() 查快取查不到，會自動退回下面
  // 「建立全新 <img>」那條路——那條路本身也補上了失敗自動重試一次的
  // 邏輯（見下方 spawnFallingPhotos() 內的說明），等於暖機失敗之後還有
  // 兩次全新的機會，而不是直接卡死。
  function warmFallBatch(batch){
    const cache = new Map();
    if(!batch) return { promise: Promise.resolve(), cache };
    const tasks = [];
    // 現在每一項是 dvdEImages 的 {src, scale} 物件，只有一種畫質（本來就是
    // 本地已裁切好的 data:/blob: URL，不像原本相片還分 gridUrl/thumbUrl
    // 兩種尺寸），只需要暖這一個 src。
    batch.forEach((entry) => {
      if(!entry || !entry.src || cache.has(entry.src)) return;
      const url = entry.src;
      const im = new Image();
      im.src = url;
      const store = () => cache.set(url, im);
      if(im.decode){
        tasks.push(im.decode().then(store, () => {})); // 失敗不快取，見上方說明
      } else {
        tasks.push(new Promise((resolve) => {
          if(im.complete && im.naturalWidth > 0){ store(); resolve(); return; }
          im.onload = () => { store(); resolve(); };
          im.onerror = () => resolve(); // 失敗不快取，見上方說明
        }));
      }
    });
    return { promise: Promise.all(tasks), cache };
  }

  // 進場（第一次雙擊）用的批次挑選，公式跟 spawnFallingPhotos() 內原本
  // 「沒有帶 photoBatch 參數」時的邏輯完全一致（先把全部照片洗牌，再依
  // index 對洗牌結果取餘數循環取用）——這裡提早算一次，讓 enterPhotoFallMode()
  // 可以在照片真的掉下來之前，就先知道會是哪幾張、進而提前暖機；算出來的
  // 結果直接傳給 spawnFallingPhotos()，那邊就不用也不會再重算一次（重算會
  // 洗出不同的隨機結果，跟已經暖好的那批對不起來）。
  function pickInitialFallBatch(){
    const fallCount = photoFallCount();
    // 改成從「漂浮物件圖片庫」（dvdEImages，飄動的 e 撞牆換圖用的同一批
    // 去背圖）取材，不再從首頁縮圖（photos）取材——掉落堆疊現在顯示的是
    // 去背後的漂浮物件，而不是相片本身。
    // ---------- 修正「掉落堆疊裡混進一張跟飄動的 e 當下一模一樣的照片」 ----------
    // 雙擊當下，飄動的 e 本身也會帶著牠正在顯示的那張圖（dvdActiveImgSrc）
    // 一起變成物理世界裡的一顆 body（見 startPhotoFallEngine() 裡的
    // dvdBody），等於畫面上已經有一張這張圖了；如果掉落的這批（fallBatch）
    // 又剛好抽到同一張，使用者會看到兩張長得一模一樣的照片同時掉在畫面
    // 上，感覺像重複/出錯。這裡先把圖庫裡跟 dvdActiveImgSrc 相同的那一張
    // 濾掉，只從「其餘照片」裡取材；只有整個圖庫就只剩這一張圖可用（極端
    // 情況，例如圖庫只有 1 張圖）時，才退回完整圖庫，不然掉落名額會湊不滿。
    const dvdSrc = dvdActiveImgSrc;
    const excluded = dvdEImages.length ? dvdEImages.filter(p => p && p.src !== dvdSrc) : [];
    const source = excluded.length ? excluded : dvdEImages;
    const pool = source.length ? shuffled(source) : [];
    const batch = [];
    for(let i = 0; i < fallCount; i++){
      batch.push(pool.length ? pool[i % pool.length] : null);
    }
    return batch;
  }

  // 換批時挑下一批照片：優先從「目前這批以外」的照片裡挑，確保新一批
  // 跟現在畫面上這批不會完全重複；扣掉現在這批之後剩下的照片不夠湊滿
  // count 張時（例如照片總數本來就不多、又換過幾輪），用完整照片池洗牌
  // 補滿剩下的名額——這種情況下沒辦法保證「完全沒有一張跟現在這批重複」，
  // 但至少會儘量優先用還沒出現在這一批的照片，且一定跟「現在這批」的
  // 組合整體不同（除非照片總數少到 count 都湊不滿，那種極端情況下退回
  // 盡力而為，不會整個壞掉或卡住）。
  function pickReshuffleBatch(count){
    if(!dvdEImages.length) return [];
    // 同上，改成從 dvdEImages 取材；排除規則沿用原本邏輯，只是比對的欄位
    // 從 photo.url 換成 dvdEImages 每一項的 src。
    // 換批期間飄動的 e 本身那顆 body（dvdActiveImgSrc）全程留在畫面上、
    // 不會跟著換批換掉，所以這裡也跟 pickInitialFallBatch() 一樣，優先
    // 把跟 e 目前這張相同的圖從候選池濾掉，避免換出來的新一批裡又混進一張
    // 跟 e 重複的照片；濾掉後池子還夠湊滿 count 張時才套用，圖庫太小湊不滿
    // 的極端情況就不強求，直接沿用原本（可能含重複）的結果。
    const dvdSrc = dvdActiveImgSrc;
    const withoutDvd = dvdEImages.filter(p => p && p.src !== dvdSrc);
    const sourcePool = withoutDvd.length ? withoutDvd : dvdEImages;
    const fresh = shuffled(sourcePool.filter(p => p && !pfLastBatchUrls.has(p.src)));
    if(fresh.length >= count) return fresh.slice(0, count);
    // ---------- 修正：「堆疊頁面偶爾會出現重複的 PNG 圖片」----------
    // 成因：上面 fresh 湊不滿 count 張的時候（扣掉上一批用過的照片、扣掉
    // 飄動的 e 目前這張之後，剩下的候選不夠），原本直接拿「完整
    // sourcePool 重新洗牌」當作補位來源，一張一張往 result 裡塞，卻沒有
    // 檢查這些補位的照片是不是早就已經在 fresh（也就是已經在 result）裡
    // 選過了——sourcePool 本身跟 fresh 的來源是同一個池子，重新洗牌只是
    // 打亂順序，並不會把已經選過的排除掉，所以補位這幾張很容易又抽中
    // 跟 fresh 裡某一張完全相同的照片，導致同一批掉落畫面上出現兩張一
    // 模一樣的 PNG。這不是每次換批都會發生（fresh 剛好湊滿 count 張的
    // 時候完全不會走到這段補位邏輯），只有 fresh 不夠、需要補位的那幾次
    // 才會踩到，正好符合使用者回報「偶爾」而不是每次都有的描述；圖庫
    // 張數跟 count（8 或 15）愈接近、換批換得愈頻繁，愈容易踩中。
    // 修法：補位來源先排除掉 fresh 裡已經選過的照片（用 usedSrcs 這個
    // Set 追蹤），只從「真正還沒被選進這一批」的照片裡補位；只有連這個
    // 補位來源都不夠（圖庫裡完全不重複的照片總數本來就比 count 少，物理
    // 上湊不出 count 張彼此都不同的組合，例如圖庫總共只有 5 張圖卻要求
    // 掉 15 張）這種真正沒辦法的極端情況，才退回允許重複，並且用「依序
    // 循環」而不是「重新洗牌後盼運氣不中」的方式明確補滿，確保張數一定
    // 正確、不會少算。
    const result = fresh.slice();
    const usedSrcs = new Set(result.map(p => p.src));
    const fillerPool = shuffled(sourcePool.filter(p => p && !usedSrcs.has(p.src)));
    for(let i = 0; result.length < count && i < fillerPool.length; i++){
      result.push(fillerPool[i]);
      usedSrcs.add(fillerPool[i].src);
    }
    if(result.length < count){
      // 真正的極端情況：圖庫裡不重複的照片總數本身就比 count 少，上面
      // 已經把所有不重複的候選都用完了還是湊不滿——只能開始允許重複，
      // 依序循環整個 sourcePool 補滿剩下的名額。
      const lastResortPool = shuffled(sourcePool);
      while(result.length < count && lastResortPool.length){
        result.push(lastResortPool[result.length % lastResortPool.length]);
      }
    }
    return result;
  }

  function handleDvdDoubleClick(){
    // 只在單純的首頁格子畫面上生效，preview／照片詳情頁開著時不理會，
    // 避免雙擊飄動字時剛好疊加另一層轉場動畫、互相打架。
    if(document.body.classList.contains('detail-active')) return;
    if(document.body.classList.contains('preview-active')) return;
    if(photoFallState === 'idle'){
      enterPhotoFallMode();
    } else if(photoFallState === 'active'){
      exitPhotoFallMode();
    } else if(photoFallState === 'reshuffling'){
      // 修正「單擊換批的途中又雙擊，雙擊卻沒反應，要等換批動畫播完才有
