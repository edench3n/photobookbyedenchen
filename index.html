    // Image 去載入高畫質版本＋預抓左右鄰居），拉簾快速滑過去的那幾百毫秒內
    // 就會連續塞進好幾次這種重工作，主執行緒忙著算版面、發網路請求，
    // 沒有餘力畫下一幀，拉簾動畫本身反而卡頓、不再是單一連續的滑動——
    // 這正是使用者說「太卡」的主因，不是動畫曲線本身的問題。
    // 拆成兩段：輕量的 renderDetailLight()（文字、拿現成已解碼的縮圖暖場、
    // 定位）維持每一格都即時同步，滑到哪、左側大圖的號碼/標題/暖場縮圖就
    // 立刻跟到哪；真正吃資源的高畫質載入+預抓鄰居（renderDetailFull()）
    // 則 debounce 到索引真的停留一小段時間（代表使用者已經滑到這張、
    // 不是正飛快掠過）才觸發一次，讓拉簾滾動途中主執行緒隨時都是空的，
    // 一路保持連續、不掉幀的滑動。
    renderDetailLight();
    clearTimeout(fsDetailFullTimer);
    fsDetailFullTimer = setTimeout(renderDetailFull, FS_DETAIL_FULL_DELAY);
  }
  let fsDetailFullTimer = null;
  const FS_DETAIL_FULL_DELAY = 90;

  // 點擊某張縮圖／滾輪停止後吸附／拖曳放開後接續動量，三個入口共用同一個
  // 函式：单纯把目標設好、確保 RAF 在跑，剩下全部交給 fsTick 裡那顆彈簧。
  function fsScrollToOffset(off){
    fsEntering = false; // 點擊縮圖跳轉／拖曳放開接續動量，都是使用者明確的操作意圖，
                         // 開場拉入動畫如果還沒播完，這裡直接視為已經結束
    fsTarget = off;
    startFsRAF();
  }

  function fsTick(t){
    if(!fsLastFrameT) fsLastFrameT = t;
    const dt = Math.min(0.048, Math.max(0.001, (t - fsLastFrameT) / 1000)); // 秒，夾在 1~48ms 之間避免分頁切走再切回時的巨大 dt 讓彈簧暴衝
    fsLastFrameT = t;

    if(fsDragging){
      // 位置在 pointermove 裡面就直接寫進 fsPos 了（1:1 跟手），這裡只需要重新渲染
    } else {
      const smoothTime = (fsEntering || fsClosing) ? FS_ENTRANCE_SMOOTH_TIME : FS_SMOOTH_TIME;
      fsPos = fsSmoothDamp(fsPos, fsTarget, fsVel, smoothTime, dt);
    }

    renderFilmstripFrame();
    fsSyncCurrentIndex();

    const settled = !fsDragging
      && Math.abs(fsPos - fsTarget) < FS_SETTLE_EPS
      && Math.abs(fsVel.v) < FS_SETTLE_EPS;

    if(fsDragging || !settled){
      fsRAFId = requestAnimationFrame(fsTick);
    } else {
      // 收尾對齊：把剩下那一點浮點誤差直接歸零，確保最終畫面精準停在
      // 整數格上，不會留下肉眼看不太出來、但邏輯上沒完全對齊的殘值。
      fsPos = fsTarget;
      fsVel.v = 0;
      fsEntering = false; // 不管這次 settle 是開場彈簧還是一般滾輪/拖曳吸附，到位後
                           // 都確保這個旗標是關閉的，之後的每一次同步都恢復正常判斷
      renderFilmstripFrame();
      fsRAFId = null;
      fsLastFrameT = 0;
    }
  }
  function startFsRAF(){
    if(!fsRAFId) fsRAFId = requestAnimationFrame(fsTick);
  }

  let fsWheelIdleTimer = null;
  const FS_WHEEL_IDLE_MS = 100; // 滾輪停止多久之後視為「使用者結束這次滾動」，把目標吸附到最近整數格

  detailFilmstrip.addEventListener('wheel', (e) => {
    if(!fsReady) return;
    e.preventDefault();
    e.stopPropagation();
    fsEntering = false; // 使用者在開場拉入動畫還沒播完時就主動滾動，視為接手操作，
                         // 立刻恢復正常同步，不要讓開場邏輯繼續蓋掉使用者的操作意圖
    // 直接推動「目標」本身，不是推動速度——不管滾輪事件觸發得多密集或
    // 多疏落、每次 deltaY 忽大忽小，後面追過去的永遠是同一顆彈簧算出的
    // 同一條平滑曲線，不會被滾輪自己的觸發節奏拆成階梯狀的忽快忽慢。
    fsTarget -= e.deltaY * FS_WHEEL_TO_INDEX;
    startFsRAF();

    // 每次滾輪事件都重新起算閒置計時；連續滾動時計時器一直被延後，
    // 只有真正停下來才會觸發，屆時把目標吸附到最近整數格，彈簧自己
    // 用同一條曲線把最後一小段距離平滑補完，不需要另外切換任何邏輯。
    clearTimeout(fsWheelIdleTimer);
    fsWheelIdleTimer = setTimeout(() => {
      if(fsDragging) return; // 這段閒置期間如果使用者改成用拖曳操作，交給拖曳自己的流程處理
      fsTarget = Math.round(fsTarget);
    }, FS_WHEEL_IDLE_MS);
  }, { passive:false });

  // 拖曳統一改用 Pointer Events（取代原本只認滑鼠的 mousedown/mousemove/
  // mouseup）：滑鼠、觸控、觸控筆共用同一套邏輯與手感，桌機直式拖曳跟
  // 手機橫式滑動因此完全同一顆彈簧、同一種「跟手→放開延續動量」的行為，
  // 不用另外寫一套觸控專用的手勢。搭配 setPointerCapture()，拖曳中途
  // 手指/滑鼠移出拉簾範圍也不會斷線，不再需要把 move/up 監聽器掛在
  // window 上才能涵蓋到拉簾外部。
  detailFilmstrip.addEventListener('pointerdown', (e) => {
    if(!fsReady) return;
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    fsEntering = false; // 開場拉入動畫還沒播完就被使用者按住拖曳，同樣視為接手操作
    clearTimeout(fsWheelIdleTimer); // 開始拖曳，取消前一個滾輪閒置計時器，避免它晚一點跳出來搶著另外對齊一次
    fsDragging = true;
    fsSuppressClick = false;
    fsTarget = fsPos; // 目標先貼齊當下位置，拖曳全程由 pointermove 直接寫 fsPos，彈簧不會在旁邊拉扯
    fsVel.v = 0;
    fsDragPointerId = e.pointerId;
    // 桌機直式拉簾追蹤垂直座標(clientY)，手機橫式拉簾改追蹤水平座標(clientX)——
    // 跟手的方向永遠對齊拉簾實際捲動的方向。
    const axisPos = isDetailMobile() ? e.clientX : e.clientY;
    fsDragStartY = axisPos;
    fsDragStartPos = fsPos;
    fsLastMoveY = axisPos;
    fsLastMoveT = performance.now();
    fsDragVelocitySample = 0;
    // 阻力只套用在滑鼠直接按住拖曳（電腦版滑鼠是最容易「稍微一動就衝很遠」
    // 的輸入方式）；觸控/觸控筆維持原本 1:1 跟手，不受影響——手指觸控本來
    // 就是直接接觸螢幕，「跟手」本身就是使用者的預期，不需要額外阻力。
    fsDragResistance = (e.pointerType === 'mouse') ? FS_DRAG_RESISTANCE : 1;
    detailFilmstrip.style.cursor = 'grabbing';
    try{ detailFilmstrip.setPointerCapture(e.pointerId); }catch(err){}
    startFsRAF();
    e.preventDefault();
  });
  detailFilmstrip.addEventListener('pointermove', (e) => {
    if(!fsDragging || e.pointerId !== fsDragPointerId) return;
    const axisPos = isDetailMobile() ? e.clientX : e.clientY;
    const delta = axisPos - fsDragStartY;
    if(Math.abs(delta) > 4) fsSuppressClick = true;
    const unit = fsAxisSize() * 0.9;
    // delta 先乘上 fsDragResistance（滑鼠拖曳時 <1，觸控維持 1）才拿去除以
    // unit：同樣的手指/滑鼠移動距離，阻力越大換算出來的拉簾位移就越少，
    // 拖曳當下會感覺比較「重」、不會一碰就衝出去。
    fsPos = fsDragStartPos - (delta * fsDragResistance) / unit;
    fsTarget = fsPos; // 拖曳全程讓目標跟著手指走，放開的瞬間彈簧才不會從舊目標往回拉扯

    const now = performance.now();
    const dt = now - fsLastMoveT;
    if(dt > 0){
      const stepDelta = axisPos - fsLastMoveY;
      // 注意：速度採樣這裡故意「不」乘上 fsDragResistance，維持用滑鼠/手指
      // 實際移動的原始速度去換算——這跟上面 fsPos 的位移量是刻意分開處理的
      // 兩件事：
      //   - fsPos（拖曳當下跟著手動多少）套阻力，讓「按住慢慢拖」這件事本身
      //     感覺比較重、不會一碰就衝很遠；
      //   - fsDragVelocitySample（放開瞬間要交給彈簧的初速）維持原始速度，
      //     負責「甩」這個動作放開後的動量。
      // 一開始把兩者都乘上同一個阻力係數，結果放開時的初速也被打了折扣，
      // 使用者快速往下甩、手指/滑鼠明明移動得很快，甩出去的動量卻被同步
      // 打折，變成放開後拉簾滑不遠、感覺黏黏的、甩不動——這正是「應該要
      // 流暢地被甩下去，現在卻卡卡的」這個問題的成因。改成只在「跟手位移」
      // 這一步套阻力，「放開初速」維持原始不打折，兩件事互不影響：按住慢慢
      // 拖依然比較重、有阻力；快速一甩放開，動量依然完整、流暢地被甩出去。
      fsDragVelocitySample = (-stepDelta / unit) / dt * 1000; // 換算成「虛擬索引／秒」，跟彈簧的速度單位一致
    }
    fsLastMoveY = axisPos;
    fsLastMoveT = now;
  });
  function endFsDrag(e){
    if(!fsDragging) return;
    if(e && e.pointerId !== fsDragPointerId) return;
    fsDragging = false;
    detailFilmstrip.style.cursor = '';

    // ---- 直接點擊某張縮圖：不依賴原生 click 事件冒泡 ----
    // detailFilmstrip 在 pointerdown 時呼叫了 setPointerCapture()，把這整段
    // 手勢的指標事件都導向自己身上，方便拖曳中途手指/滑鼠移出拉簾範圍也不會
    // 斷線。副作用是：部分瀏覽器在有 pointer capture 的情況下，連帶把之後
    // 合成出來的 click 事件目標也「重新導向」成 detailFilmstrip 本身，而不是
    // 使用者實際按下去的那個 .filmstrip-item——這個 click 永遠不會冒泡經過
    // 縮圖本身，掛在縮圖上的 click 監聽器（見 createFilmstripItem）完全收不到
    // 事件，桌機/平板點擊縮圖因此看起來毫無反應。
    // 修法：不要等瀏覽器幫忙合成、冒泡出正確的 click，改成在這裡（放開的
    // 當下、還沒被 pointer capture 影響座標判讀）直接用放開時的螢幕座標
    // document.elementFromPoint() 反查使用者實際點到的是哪一張縮圖 DOM，
    // 讀出它在 createFilmstripItem() 裡存好的 data-fs-off，直接呼叫
    // fsScrollToOffset() 滑過去——整段判斷完全不經過 click 事件，自然不受
    // 上述重新導向影響。只在「這次沒被判定成拖曳」（fsSuppressClick 沒被
    // pointermove 那邊觸發，也就是移動距離沒超過 4px 閾值）時才當作點擊處理，
    // 真正的拖曳放開仍然走下面原本「帶著放開瞬間的速度繼續滑」那條路徑。
    if(!fsSuppressClick && e && typeof e.clientX === 'number'){
      const hit = document.elementFromPoint(e.clientX, e.clientY);
      const itemEl = hit && hit.closest ? hit.closest('.filmstrip-item') : null;
      const offAttr = itemEl && itemEl.dataset ? itemEl.dataset.fsOff : undefined;
      if(offAttr !== undefined){
        fsVel.v = 0; // 點擊視為直接指定目標，不套用拖曳動量，避免點擊後畫面還多滑一小段
        fsScrollToOffset(parseFloat(offAttr));
        setTimeout(() => { fsSuppressClick = false; }, 50);
        return;
      }
    }

    // 放開的瞬間，把剛剛拖曳量出的速度直接塞進彈簧目前的速度狀態，
    // 再把目標設成「用這個速度推算最可能停在哪一張整數格」——彈簧會
    // 帶著這個非零初速接著滑過去，跟拖曳當下的手感無縫銜接，不會有
    // 「先停一下、才重新啟動一段新動畫」的斷點。這跟滾輪停止、點擊
    // 縮圖用的是同一顆彈簧、同一套追蹤邏輯，三種操作方式因此有完全
    // 一致的加速／減速手感——這正是「非常成熟、統一」的動態做法。
    fsVel.v = fsDragVelocitySample;
    const predicted = Math.round(fsPos + fsVel.v * FS_SMOOTH_TIME);
    fsScrollToOffset(predicted);
    setTimeout(() => { fsSuppressClick = false; }, 50);
  }
  detailFilmstrip.addEventListener('pointerup', endFsDrag);
  detailFilmstrip.addEventListener('pointercancel', endFsDrag);

  function positionDetailImage(naturalW, naturalH){
    const ratio = (naturalW && naturalH) ? naturalW / naturalH : 1;

    const isMobile = isDetailMobile();

    // clear the arrows / back button / bottom-right info on any viewport;
    // desktop keeps its original clearance, mobile gets a much tighter one
    // (just enough to clear the arrow buttons) so the photo can go near-max size
    const horizontalClearance = isMobile ? 130 : 220;
    // 手機版原本 190 這個上方留白，是為了容納「標題 + collab 三行文字」的
    // header 高度。現在照片詳細頁 collab 整塊消失（見 CSS 說明），這裡扣掉
    // DETAIL_MOBILE_LIFT，把多出來的留白收回一部分，讓大圖／拉簾／說明
    // 文字一起往上收；同時把 FS_MOBILE_BOTTOM_GAP 加了同一個量（見該常數
    // 旁的說明），兩邊一減一加互相抵銷，大圖尺寸不會跟著變、只有位置往上
    // 移動（下面另外用 minTop 夾住，確保無論如何都不會頂到標題）。
    const baseVerticalClearance = isMobile ? (190 - DETAIL_MOBILE_LIFT) : 260;

    // 桌機／平板把右側拉簾（含跟大圖之間的間隙）扣掉，手機版則改成把
    // 下方橫式拉簾佔用的高度扣掉——不管哪個方向，大圖永遠只在「扣掉拉簾
    // 之後」剩下的那塊區域內置中，兩邊現在都呼叫同一個 layoutFilmstripZone()，
    // 它自己依 isDetailMobile() 分流去算對應方向的尺寸。
    layoutFilmstripZone();
    // 拉簾右側現在多留了 fsTitleGap 給標題文字，左側也多了編號文字（見
    // .detail-number），大圖可用寬度要把這兩塊都扣掉，不然大圖會算得太寬，
    // 蓋到編號/標題文字。96 是「編號文字寬度＋跟拉簾之間的間距」的粗估值。
    // 手機版沒有這兩塊獨立文字（維持原本疊在左下角的 detail-info），
    // 不需要額外扣寬度。
    const filmstripReserveW = isMobile ? 0 : (getFilmstripZoneWidth() + fsTitleGap + 80);
    // 手機版改成扣「高度」：橫式拉簾貼在畫面下緣，再留一點跟大圖之間的
    // 間隙，大圖才不會整個置中蓋到拉簾上。
    const filmstripReserveH = isMobile ? (fsZoneHeight + FS_MOBILE_BOTTOM_GAP + 20) : 0;
    const verticalClearance = baseVerticalClearance + filmstripReserveH;

    const availW = Math.max(120, window.innerWidth - horizontalClearance - filmstripReserveW);
    let availH = Math.max(120, window.innerHeight - verticalClearance);

    // 手機版「編號+標題」文字＋返回箭頭這組，現在改成固定位置，不再跟著
    // 每一張照片實際算出來的圖片高度上下移動（動態取中間點的做法，換照片
    // 時因為每張照片高度不一定一樣，會讓文字整組跟著跳來跳去）。
    // 固定位置的算法：不看「這張照片」實際多高，而是想像一張「剛好頂滿
    // availH」的直式照片（也就是可用高度被撐到最滿的情況）會落在哪裡，
    // 取它的下緣跟拉簾上緣的中間點，當成這組文字固定的錨點——不管實際
    // 顯示的是哪一張照片，這個錨點只跟視窗尺寸／拉簾大小有關，維持不變。
    let mobileInfoTop = null;
    if(isMobile){
      const maxImgTop = (window.innerHeight - filmstripReserveH - availH) / 2;
      const maxImgBottom = maxImgTop + availH;
      const filmstripTopEstimate = window.innerHeight - FS_MOBILE_BOTTOM_GAP - fsZoneHeight;
      const anchorMid = (maxImgBottom + Math.max(maxImgBottom, filmstripTopEstimate)) / 2;
      const infoH = detailInfo ? (detailInfo.getBoundingClientRect().height || 0) : 0;
      mobileInfoTop = Math.max(8, anchorMid - infoH / 2);

      // 反過來：如果照片本身直式且特別長，撐到 availH 上限時下緣（也就是
      // 上面算出的 maxImgBottom）可能已經頂到、甚至蓋過這組固定文字的位置
      // ——這裡改成限制「這張照片」的高度上限，讓它的下緣停在文字固定
      // 位置往上一點的地方，兩者才不會疊在一起；是「照片自己讓開」，
      // 不是文字被照片推著移動，一般長寬比的照片完全不會被這裡影響
      // （下面算出的 hCap 會比 availH 大，min 之後不生效）。
      const capBottom = mobileInfoTop - 6;
      const hCap = 2 * capBottom - window.innerHeight + filmstripReserveH;
      if(isFinite(hCap) && hCap > 0 && hCap < availH){
        availH = hCap;
      }
    }
    mobileInfoTopPx = mobileInfoTop;

    // 手機版橫式照片（ratio>1，寬>高）另外放大：原本橫式照片也套用跟直式
    // 照片一樣「視窗寬度扣掉左右各 65px」的保守留白，兩側留白比桌機版
    // header 那排文字實際佔用的寬度還多，看起來偏小、兩側浪費不少空間。
    // 這裡改成直接量測「Photobook by edenchen」（backHome）最左側、跟
    // 「Preview」（previewLabel）最右側這一刻真正渲染出來的位置，橫式
    // 照片的可用寬度改用這兩點之間的實際距離，讓照片盡量撐滿到跟上排
    // 標題文字同寬；直式照片（ratio<=1）維持原本邏輯不受影響，因為直式
    // 照片本來就是高度先頂到 availH，寬度早就跟著比例縮小，撐再寬的
    // availW 也不會有視覺差異，沒有必要改動。
    let mobileWideLeft = null;
    let mobileWideAvailW = null;
    if(isMobile && ratio > 1 && backHome && previewLabel){
      const leftRect = backHome.getBoundingClientRect();
      const rightRect = previewLabel.getBoundingClientRect();
      if(leftRect.width && rightRect.width && rightRect.right > leftRect.left){
        mobileWideLeft = leftRect.left;
        mobileWideAvailW = rightRect.right - leftRect.left;
      }
    }

    let w = (mobileWideAvailW != null) ? mobileWideAvailW : availW;
    let h = w / ratio;
    if(h > availH){
      h = availH;
      w = h * ratio;
    }

    detailImageWrap.style.width = w + 'px';
    detailImageWrap.style.height = h + 'px';

    const leftRegionWidth = isMobile ? window.innerWidth : (window.innerWidth - filmstripReserveW);
    // 橫式照片且寬度沒有被高度限制縮回去（w 仍等於量測到的目標寬度）時，
    // 直接把左邊界對齊 backHome 最左側，而不是用置中公式重算一次——這樣
    // 才能保證「最左側對齊 Photobook by edenchen 最左側」，不是碰巧靠近而已；
    // 如果照片本身比例太窄（被 availH 夾住縮小了寬度），就沒辦法兩側同時
    // 貼齊，退回原本置中的邏輯，維持視覺平衡，不會偏向一側貼齊、另一側
    // 露出一大塊不對稱的留白。
    const left = (mobileWideLeft != null && w === mobileWideAvailW)
      ? mobileWideLeft
      : (leftRegionWidth - w) / 2;
    // 手機版大圖要在「扣掉下方拉簾之後」剩下的那塊區域內垂直置中，不是
    // 整個視窗高度置中，不然大圖會偏下、跟拉簾擠在一起或被蓋到。
    let top = (window.innerHeight - filmstripReserveH - h) / 2;

    // 安全夾定：不管上面怎麼算，大圖最上緣都不能超過「標題文字下緣 + 一點
    // 適當間距」——直接量測目前真正顯示出來的標題列（header-left，
    // collab 消失後這才是 header 實際可見的下緣，比整個 .fixed-header 的
    // 量測範圍更準，因為 collab 那塊雖然隱形但沒有從版面裡拿掉，量整個
    // header 會量到那段空白）。
    if(isMobile && backHome){
      const titleBottom = backHome.getBoundingClientRect().bottom;
      if(titleBottom > 0){
        const minTop = titleBottom + DETAIL_MOBILE_MIN_TITLE_GAP;
        top = Math.max(minTop, top);
      }
    }

    detailImageWrap.style.left = left + 'px';
    detailImageWrap.style.top = top + 'px';

    if(fsReady) renderFilmstripFrame();

    // 大圖／拉簾都已經在上面定位完成，這一刻兩者的實際位置最準確，這裡
    // 才呼叫手機版「編號+標題」文字與返回箭頭的整組定位（見該函式說明），
    // 用大圖下緣、拉簾上緣這兩個剛算好的實際位置去取中間點。
    if(isMobile) positionDetailInfoMobile();
  }

  // 手機版照片詳細頁「編號+標題」文字（.detail-info）現在用固定位置
  // （見 positionDetailImage() 裡 mobileInfoTopPx 的算法說明），不再跟著
  // 每張照片實際的圖片高度動態移動；返回箭頭維持原本規則——貼在 Preview
  // 標籤最左側（扣掉按鈕自己的 20px padding，對齊的是圖示本身，不是整個
  // 透明熱區），垂直方向跟文字這組置中對齊。
  // 回傳 true 表示已經套用真正的位置；mobileInfoTopPx 還沒算出來（例如
  // 頁面剛載入、第一輪 positionDetailImage 還沒跑過）時回傳 false，呼叫端
  // （syncDetailInfoAlignment／positionBackButton）會退回各自原本的預設
  // 定位邏輯當保底。
  function positionDetailInfoMobile(){
    if(!detailInfo || !backArrowBtn) return false;

    // 水平位置沿用原本邏輯：貼齊 collab 區塊（header-right）左邊緣，
    // 手機版其他文字/元素都用同一個基準，這裡不用跟著改動。
    if(headerRight){
      const hrRect = headerRight.getBoundingClientRect();
      if(hrRect.width || hrRect.height){
        document.documentElement.style.setProperty('--detail-info-left', hrRect.left + 'px');
      }
    }

    if(mobileInfoTopPx == null) return false;
    document.documentElement.style.setProperty('--detail-info-top', Math.round(mobileInfoTopPx) + 'px');

    // 上面這行改了 CSS 變數後，detailInfo 這一刻的 getBoundingClientRect()
    // 已經反映新位置（瀏覽器在下一次讀取幾何資訊前會先跑完 layout）。
    const infoRect = detailInfo.getBoundingClientRect();
    const btnH = backArrowBtn.getBoundingClientRect().height || 64;
    backArrowBtn.style.right = 'auto';
    if(previewLabel){
      const labelRect = previewLabel.getBoundingClientRect();
      backArrowBtn.style.left = Math.round(labelRect.left - 20) + 'px';
    }
    backArrowBtn.style.top = Math.round(infoRect.top + infoRect.height / 2 - btnH / 2) + 'px';
    backArrowBtn.style.transform = 'none';
    return true;
  }

  // renderDetail() 原本是一整塊：文字/暖場縮圖這種「便宜、純本地」的部分，
  // 跟高畫質載入＋decode＋預抓鄰居這種「貴、會摸網路」的部分焊在一起，
  // 每次呼叫都整包一起做。拉簾捲動時 fsSyncCurrentIndex() 會在index變動的
  // 當下呼叫到這裡，如果還是整包一起做，快速滑過好幾張照片就等於連續塞進
  // 好幾次「貴」的工作，主執行緒被卡住，拉簾動畫本身就跟著掉幀、變得卡頓。
  // 拆成 renderDetailLight()／renderDetailFull() 兩段，各自獨立呼叫；
  // renderDetail() 保留原本「兩段一起做」的行為給一般點擊/左右鍵切換用，
  // 行為完全不變。

  // ---- 便宜的一段：文字、版面定位、拿現成已解碼的縮圖先暖場 ----
  function renderDetailLight(){
    const photo = photos[currentIndex];
    detailLightPositioned = false; // 每次重新渲染都先歸零，下面真的用暖場縮圖定位成功才會設回 true

    detailNumber.textContent = formatPhotoIndex(currentIndex + 1);
    detailTitle.textContent = photo.title;
    syncDetailInfoAlignment(); // 標題長度不同，高度可能改變，重新算一次 top
    positionBackButton(); // 桌機版箭頭要貼齊 detail-title 左邊緣，標題文字內容換了，重新量一次位置

    // ---- 先用已經在畫面上、瀏覽器早就快取好的網格縮圖「暖場」----
    // 這是白屏拖很久的主要對策：與其整段時間都空白，先把網格那張已經解碼完成
    // 的縮圖（800px，使用者剛剛就是看著它點進來的）立刻放進大圖區顯示出來，
    // 讓畫面在點擊的瞬間就有內容；等下面真正的高畫質版本載入完成，再無縫換成
    // 那張圖。縮圖本身畫質不受影響——使用者最終看到的還是高畫質版本，這裡只是
    // 拿它來墊過渡的空窗期。
    //
    // 注意：這裡只有在「網格縮圖真的已經載入完成」（gridReady）時才會拿它
    // 暖場——這時候縮圖的寬高比就是這張照片真正的比例，用它定位容器完全準確，
    // 不會有任何跳動。手機版網格用原生 lazy-loading（見 renderGrid 裡
    // `if(supportsTouch) img.loading = 'lazy'`），左右切換切到的下一張很可能
    // 根本沒捲到過、縮圖還沒載入——這種「不知道真正比例」的情況，故意不再
    // 猜一個比例（不管是硬套正方形，還是拿上一張的比例頂著）來暫時顯示，
    // 因為不管猜的是什麼，只要跟真正的比例不同，之後修正時終究會跳動一次。
    // 既然要簡單、要求的是「直接跳轉」，就不猜、不墊、不用過場動畫校正，
    // 單純保留目前畫面（上一張照片，或空白），一路等到下面真正要顯示的
    // 這張照片本身載入＋解碼完成，用它真正的尺寸一次到位、直接跳出來。
    const gridItemImg = document.querySelector(`.grid-item[data-index="${currentIndex}"] img`);
    let warmImg = (gridItemImg && gridItemImg.complete && gridItemImg.naturalWidth && gridItemImg.naturalHeight)
      ? gridItemImg
      : null;
    // 首頁網格縮圖不一定已經捲到、載入過那張照片（尤其是拉簾滾輪快速滑過去
    // 很多張的情況），這時改抓拉簾自己顯示中的縮圖當暖場來源——使用者剛剛
    // 就是「看著它」捲過來的，幾乎一定已經解碼完成，這樣左側大圖才能真正
    // 做到「不淡出、直接非常快速跟上右邊拉簾」。
    if(!warmImg && fsReady){
      warmImg = getFilmstripWarmImg(currentIndex);
    }
    const gridReady = !!warmImg;

    if(gridReady){
      // 有暖場縮圖可以馬上顯示的情況下，wrap 全程保持「show」，不要 remove 再
      // add——這正是「白幕淡出淡入」的成因：只要 class 被 remove 一次，CSS 的
      // opacity transition 就會把 wrap 淡到 0（露出底下純白背景），再淡回 1，
      // 使用者看到的就是一閃白幕。既然已經有東西可以馬上顯示，就不需要這段
      // 淡出再淡入，直接讓 wrap 保持可見、只換 <img> 的內容即可。
      const ratio = warmImg.naturalWidth / warmImg.naturalHeight;
      lastNaturalW = ratio * 1000;
      lastNaturalH = 1000;
      positionDetailImage(lastNaturalW, lastNaturalH);
      detailLightPositioned = true;
      detailImage.src = warmImg.src;
      detailImageWrap.classList.add('show'); // 直接顯示，不經過淡出/淡入
    }
    // gridReady 為 false 時什麼都不做：保留目前畫面（不管是上一張照片還是
    // 空白），一路等到下面 renderDetailFull() 的 commit() 真正拿到這張照片
    // 的正確尺寸，才顯示出來。
  }

  // ---- 貴的一段：真正的高畫質版本載入＋decode＋預抓左右鄰居 ----
  function renderDetailFull(){
    const token = ++detailToken;
    const photo = photos[currentIndex];
    const loader = new Image();

    // commit 只在「真正的高畫質版本」完全解碼完成（不只是下載完，是連畫面
    // 像素都準備好）之後才把它換上 <img>——這樣瀏覽器可以一次到位地把新畫面
    // 畫出來，不會因為臨時解碼大圖而卡一格空白幀（那格空白幀疊在純白背景上，
    // 看起來就像「又閃了一下白幕」）。已經有暖場圖在顯示的情況下，這裡只換
    // src，完全不動 opacity/class，銜接是無縫的；沒有暖場圖的情況下，這裡
    // 就是這張照片第一次、也是唯一一次直接跳出來，尺寸從一開始就是對的。
    const commit = () => {
      if(token !== detailToken) return;
      lastNaturalW = loader.naturalWidth || 1;
      lastNaturalH = loader.naturalHeight || 1;
      const swap = () => {
        if(token !== detailToken) return;
        // 只有在還沒被暖場縮圖定位過的情況下才需要重新定位——已經定位過的話，
        // 這裡重新算一次只會帶來上面說明的那種細微跳動，沒有任何好處。
        if(!detailLightPositioned) positionDetailImage(lastNaturalW, lastNaturalH);
        detailImage.src = loader.src;
        detailImageWrap.classList.add('show');
        // 注意：這裡刻意「不」把 loader.src 同步套到 activeFlipClone 身上，
        // 即使分身還在飛行途中也一樣。原因見 activeFlipClone 宣告處的完整
        // 說明——分身跟最終大圖的長寬比很多時候不同（分身用的是網格正方形
        // 縮圖），飛行途中換 src 會讓 object-fit:cover 的裁切範圍瞬間改變，
        // 使用者看到的就是「照片在自己的框裡跳一下」。分身全程只顯示起跳
        // 當下那張縮圖，高畫質交接留給 finish() 那一刻的無縫切換。
      };
      if(loader.decode){
        loader.decode().then(swap).catch(swap);
      } else {
        swap();
      }
    };

    // 依序嘗試：detailUrlMobile（手機版專用的縮小版本，畫質在手機螢幕上跟
    // 2000px 沒有分別，但檔案小很多、下載快很多，桌機版沒有這個欄位，直接
    // 跳過）→ detailUrl（Google 圖片 CDN、2000px，又快畫質又好）→
    // fallbackUrl（同一個 CDN 但 1600px，備援）→ url（原始全尺寸檔案，走
    // drive.google.com/uc，最慢，留到真的都失敗才用）→ thumbUrl（保底）
    const sources = [photo.detailUrlMobile, photo.detailUrl, photo.fallbackUrl, photo.url, photo.thumbUrl].filter(Boolean);
    let srcIdx = 0;
    function tryNext(){
      if(srcIdx >= sources.length) return;
      loader.src = sources[srcIdx++];
    }
    loader.onload = commit;
    loader.onerror = tryNext;
    tryNext();

    // already cached — 'load' may not fire again, handle synchronously
    if(loader.complete && loader.naturalWidth){
      commit();
    }

    prefetchNeighbors(currentIndex);
  }

  function renderDetail(){
    renderDetailLight();
    renderDetailFull();
  }

  // 靜默預先下載鄰近的照片（左右各 2 張），這樣按下一張/上一張箭頭時
  // 圖片幾乎都已經在瀏覽器快取裡，可以立即無延遲切換
  const prefetchedUrls = new Set();
  function prefetchOne(url, lowPriority){
    if(!url || prefetchedUrls.has(url)) return;
    prefetchedUrls.add(url);
    const im = new Image();
    // lowPriority 只給「整個相簿慢慢背景預抓」這種完全不急、什麼時候載完
    // 都無所謂的情境用（見 prefetchAllInBackground）；detail 頁瀏覽時
    // 「馬上要用到」的鄰近照片預抓（prefetchNeighbors）維持原本優先度，
    // 不受影響。
    if(lowPriority){ try { im.fetchPriority = 'low'; } catch(e){} }
    im.src = url;
  }
  function prefetchNeighbors(index){
    const n = photos.length;
    if(!n) return;
    for(let d = 1; d <= 2; d++){
      const next = photos[(index + d) % n];
      const prev = photos[(index - d + n) % n];
      // 跟 renderDetail() 實際使用的來源順序保持一致（手機版優先用
      // detailUrlMobile 這個縮小版本），這樣預先下載的才是真的會用到的
      // 那個檔案，切換到鄰近照片時才能確實命中快取、直接跳轉。
      prefetchOne(next.detailUrlMobile || next.detailUrl || next.url);
      prefetchOne(prev.detailUrlMobile || prev.detailUrl || prev.url);
    }
  }

  // 從網格首頁點下去的那張縮圖，快速放大＋移動到照片頁左側大圖欄位——
  // 用一個「分身」<img> 直接掛在 body 下，把它從縮圖當下的螢幕座標，用
  // transform（translate+scale，GPU 合成、不觸發 reflow）動畫到大圖最終
  // 停放的座標，動畫曲線用 cubic-bezier(0.65,0,0.35,1)（對稱的 ease-in-out
  // cubic：起步慢、中段加速到最快、接近終點再平滑減速收斂），比原本的
  // ease-out-expo（一開始就衝到最快、只有後段減速）更接近真實物體被
  // 「推動」之後加速、再靠慣性減速停下的物理感，手機上點縮圖飛出去的
  // 那一下才不會覺得是「一開始就用最高速衝出去」的生硬跳動。配合前面
  // 拉簾/collab 淡入淡出，整體仍是同一個連續的轉場動作，不是分開的兩段
  // 動畫。
  // 從照片物理堆疊模式點進來時，precomputedRect 會多帶一個 angle 欄位
  // （弧度，見 openDetailFromPhotoFallItem()）——那張照片當下多半帶著
  // 隨機的碰撞旋轉角度，這裡要讓分身「從它當下的角度」開始，一路旋轉
  // 回正、同時放大＋移動到大圖欄位，而不是像原本那樣完全忽略角度、
  // 憑空從一個沒有旋轉的姿態開始飛。
  //
  // 麻煩的地方在於 .detail-flip-clone 的 transform-origin 固定在 0 0
  // （左上角，見該 CSS 規則的說明）：這是為了讓 scale() 直接從左上角撐大，
  // 才能跟 startRect/endRect 這種「左上角座標＋寬高」的量測方式直接對應，
  // 不用另外換算。但堆疊照片實際是繞著「自己的中心點」旋轉的（Matter.js
  // 物理世界裡，物體永遠繞質心轉），如果直接把 rotate() 接在同一個以
  // 左上角為支點的 translate 後面，分身會變成繞左上角甩動，跟真正堆疊
  // 照片繞中心旋轉的視覺位置對不上（角度越大，飛行起點看起來偏移越多）。
  //
  // 解法：给定「未旋轉版本」的矩形（rect，也就是呼叫端傳進來、繞同一個
  // 中心點但角度視為 0 的那個矩形）與想要的旋轉角度 angleRad，反推出
  // 「若旋轉支點改成左上角，該把左上角擺在哪裡，才能讓旋轉後的視覺中心
  // 仍然落在原本那個中心點」——也就是拿矩形中心點，減去「半寬半高這個
  // 向量，繞 angleRad 轉過之後」的結果。角度是 0 時（一般從首頁縮圖點
  // 進來的情況），這個函式算出來的結果會直接等於 rect.left/rect.top，
  // 跟原本沒有旋轉概念時的算法完全一致，不影響既有行為。
  // ---------- JS 版三次貝茲緩動：給下面「逐影格手動算 transform」用 ----------
  // 飛行動畫原本單純把 transform 交給 CSS transition，瀏覽器自己用
  // cubic-bezier(0.65,0,0.35,1) 這條 ease-in-out 曲線內插。但下面
  // runGridToDetailTransition() 現在需要在「每一影格」重新計算旋轉支點
  // （見該函式內的完整說明），沒辦法再整段丟給 CSS 處理，只能自己用
  // requestAnimationFrame 一格一格算——這裡另外寫一個 JS 版的貝茲曲線
  // 緩動函式（標準 Newton–Raphson 逼近解法，瀏覽器原生的 CSS
  // cubic-bezier() 內部也是同一套算法），輸入 0~1 的時間進度、輸出 0~1
  // 的完成比例，給同樣四個控制點時，算出來的曲線跟 CSS 版本完全一致，
  // 換成手動逐格計算不會讓飛行的「快慢節奏」跟著變調。
  function makeCubicBezierEase(x1, y1, x2, y2){
    const A = (a1, a2) => 1.0 - 3.0 * a2 + 3.0 * a1;
    const B = (a1, a2) => 3.0 * a2 - 6.0 * a1;
    const C = (a1) => 3.0 * a1;
    const calcBezier = (t, a1, a2) => ((A(a1, a2) * t + B(a1, a2)) * t + C(a1)) * t;
    const getSlope = (t, a1, a2) => 3.0 * A(a1, a2) * t * t + 2.0 * B(a1, a2) * t + C(a1);
    function solveTForX(x){
      let t = x;
      for(let i = 0; i < 8; i++){
        const s = getSlope(t, x1, x2);
        if(Math.abs(s) < 1e-6) break;
        t -= (calcBezier(t, x1, x2) - x) / s;
      }
      return t;
    }
    return (x) => {
      if(x <= 0) return 0;
      if(x >= 1) return 1;
      return calcBezier(solveTForX(x), y1, y2);
    };
  }
  // 跟原本 CSS 用的曲線完全同一組控制點，手感維持一致，只是換成 JS 算。
  const flipFlightEase = makeCubicBezierEase(0.65, 0, 0.35, 1);

  // ---------- 把角度包回「離 0 最短路徑」的等價角度 ----------
  // Matter.js 的 body.angle 是累加角度，不會自動包回 -π~π 這個範圍——一張
  // 照片在堆疊模式裡被碰撞、滾動久了，angle 完全可能累積到遠超過一整圈
  // （例如 10 弧度，相當於轉了一圈半以上）。上面 tickFlight() 是直接把
  // angle 從 startAngle 線性內插到 0，如果 startAngle 本身就是這種「已經
  // 累積了好幾圈」的數字，飛行動畫就會照字面把這好幾圈都轉完，看起來像
  // 甩了好幾圈才定住，而不是俐落地轉正。
  // 這裡先把角度換算成「跟 0 度視覺上完全一樣、但數值最接近 0」的等價角度
  // （包進 -π ~ π 這個範圍）：先用 %(2π) 去掉整數圈數，再視情況加減一圈，
  // 讓結果落在 (-π, π] 之間——這個範圍內的角度，本來就保證是離 0 最短的
  // 那一條路徑（不管往哪個方向轉，圈數都不會超過半圈），飛行動畫因此永遠
  // 走最短的旋轉距離，不會再無謂地多轉好幾圈。
  function normalizeAngleToShortest(angleRad){
    let a = angleRad % (Math.PI * 2);
    if(a > Math.PI) a -= Math.PI * 2;
    else if(a <= -Math.PI) a += Math.PI * 2;
    return a;
  }

  function rotatedTopLeftForCenterPivot(rect, angleRad){
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    if(!angleRad) return { left: rect.left, top: rect.top };
    const cos = Math.cos(angleRad), sin = Math.sin(angleRad);
    const halfW = rect.width / 2, halfH = rect.height / 2;
    const rx = cos * halfW - sin * halfH;
    const ry = sin * halfW + cos * halfH;
    return { left: cx - rx, top: cy - ry };
  }

  function runGridToDetailTransition(originImgEl, index, precomputedRect){
    // 用 getStableImgRect() 而不是直接 getBoundingClientRect()：桌機上
    // 點下去的那一刻，滑鼠引力放大特效（magnetFrame()）很可能正把這張
    // 照片放大到某個倍率，如果剛好在那個瞬間量到矩形，分身飛行的起點會
    // 跟著放大位移，造成起跳位置跳動。getStableImgRect() 量的是排版尺寸
    // （不受 transform 影響），起點永遠跟目前有沒有被放大、放大到多少倍
    // 無關，穩定一致（原本就是為了同一類問題而寫的，見該函式上方的完整
    // 說明）。
    // precomputedRect：從照片物理堆疊模式點進來時（見
    // openDetailFromPhotoFallItem()），呼叫端會直接算好、傳進來一個矩形，
    // 這裡就不再用 getStableImgRect()／getBoundingClientRect() 重新量測——
    // 堆疊照片當下可能帶著隨機的碰撞旋轉角度，getBoundingClientRect() 量到
    // 的會是旋轉後被撐大的外接矩形，飛行起點、尺寸都會偏大、偏移，改用
    // 呼叫端已經用物理世界座標反推好的「未旋轉」矩形，起點才會跟畫面上
    // 這張照片真正的大小、位置一致。
    const startRect = precomputedRect || getStableImgRect(originImgEl);
    const startSrc = originImgEl.currentSrc || originImgEl.src;
    // 只有從堆疊模式點進來時，precomputedRect 才會帶 angle（弧度）；
    // 從首頁縮圖點進來的一般情況下 precomputedRect 是 undefined，這裡
    // 自然落回 0，等同完全沒有旋轉，跟原本行為一致。另外套一層
    // normalizeAngleToShortest()（見該函式的完整說明）：物理世界裡的
    // 角度是累加的，可能早就超過一整圈，這裡先換算成離 0 最短路徑的
    // 等價角度，飛行動畫才不會照字面把好幾圈都轉完。
    const startAngle = normalizeAngleToShortest((precomputedRect && precomputedRect.angle) || 0);

    // 飛行動畫正式開始，見 flipInFlight 旁的說明：整趟飛行期間（含下面
    // 保底的 finish 逾時緩衝）暫停 resize／縮放／橫直切換觸發的
    // positionDetailImage() 重新定位，避免真正的大圖容器在飛行途中被
    // 悄悄搬動，跟分身當下飛去的終點對不上。
    flipInFlight = true;

    const clone = document.createElement('img');
    clone.className = 'detail-flip-clone';
    clone.alt = '';
    clone.src = startSrc;
    clone.style.width = startRect.width + 'px';
    clone.style.height = startRect.height + 'px';
    // 起始 transform：用上面 rotatedTopLeftForCenterPivot() 换算過的左上角
    // 座標（角度為 0 時就是 startRect.left/top，跟原本寫法完全等價），
    // 接著補上 rotate(startAngle) 讓分身一出現就已經是「堆疊照片當下那個
    // 傾斜角度」，不是憑空從水平開始。scale 這裡先明寫成 1（恆等），
    // 純粹是為了讓 transform 函式的「順序、種類」在起點／終點兩邊保持
    // 一致（見下面 requestAnimationFrame 裡的終點 transform）——瀏覽器對
    // 一致結構的 transform list 內插得比較穩定可靠，同時也讓这行本身
    // 讀起來就能看出這是「平移＋旋轉＋縮放」三件事同時在跑的其中一個
    // 快照，不用另外對照下面那行才看得懂。
    const startAdj = rotatedTopLeftForCenterPivot(startRect, startAngle);
    clone.style.transform = `translate(${startAdj.left}px, ${startAdj.top}px) rotate(${startAngle}rad) scale(1, 1)`;
    document.body.appendChild(clone);
    activeFlipClone = clone; // 讓 renderDetailFull() 知道目前有分身正在飛（見它內部
                              // commit() 的說明）：它「不會」把高畫質 src 套到這個分身
                              // 身上（原因見上面 activeFlipClone 宣告處），只是需要
                              // 這個參照，好在飛行結束、finish() 把它設回 null／移除
                              // 分身之前，正確判斷「現在是不是還有分身在飛」。

    // 大圖容器本身先隱藏，等分身飛到終點的那一刻再瞬間切換過去，
    // 避免飛行途中同時看到兩張疊在一起的照片。
    detailImageWrap.style.transition = 'none';
    detailImageWrap.style.opacity = '0';
    renderDetail(); // 先把真正要顯示的內容（含 renderDetailLight 內部的
                     // positionDetailImage 定位、暖場縮圖／高畫質載入）準備好——
                     // 這是這趟轉場「真正、最終」會用到的定位邏輯。

    // 大圖容器這一刻的位置／尺寸已經是 renderDetail() 跑完之後、真正會
    // 停留的最終狀態——現在才量 endRect（而不是在 renderDetail() 之前就
    // 先量一次），確保分身飛過去的終點，跟真正的大圖容器實際落腳的位置
    // 永遠是同一組數字，動畫播完交接的瞬間不會有任何錯位。
    const endRect = detailImageWrap.getBoundingClientRect();

    const startCenter = { x: startRect.left + startRect.width / 2, y: startRect.top + startRect.height / 2 };
    const endCenter = { x: endRect.left + endRect.width / 2, y: endRect.top + endRect.height / 2 };
    const scaleX = endRect.width / startRect.width;
    const scaleY = endRect.height / startRect.height;
    // 稍微拉長一點時間（460→520ms）：ease-in-out 曲線的「慢—快—慢」形狀
    // 需要足夠的時間才會讓人眼真正感覺到「先加速、再減速」這兩段變化，
    // 太短的話跟原本一開始就衝到最快的 ease-out-expo 幾乎沒有分別。
    const DURATION = 520;

    // ---------- 逐影格手動算 transform，取代原本交給 CSS transition 內插 ----------
    // 原本讓瀏覽器直接對 translate/rotate/scale 三個函式的參數各自線性
    // 內插（CSS transition 對「結構相同」的 transform list 就是這樣處理），
    // 乍看合理，但旋轉支點被鎖死在分身左上角（.detail-flip-clone 的
    // transform-origin，見上面的說明）：起點、終點兩個瞬間我們有另外用
    // rotatedTopLeftForCenterPivot() 換算過，視覺中心確實對得上，可是
    // 「中間」每一格，瀏覽器只是各自線性內插 translate 的 x/y、rotate 的
    // 角度、scale 的倍率，沒有人在中途重新做這個換算——中間影格的旋轉
    // 支點其實既不是起點的中心、也不是終點的中心，是一個隨時間漂移、
    // 偏離真正中心的點：角度越大、或者矩形本身長寬比越誇張（半寬半高
    // 離中心越遠），這個偏移就越明顯，看起來像整張照片用力甩了一下、
    // 軌跡繞了一段弧才飛過去，而不是乾脆俐落地繞著自己中心轉正。
    // 修法：不再用 CSS transition 內插 transform，改成用
    // requestAnimationFrame 自己控制每一影格——每一幀都先用同一個 eased
    // 進度值 p 算出「這一刻的中心點在哪、縮放到多少、旋轉多少角度」
    // （三者共用同一個 p，放大／旋轉／位移的加速節奏因此完全同步，不會
    // 各走各的曲線），再用跟 rotatedTopLeftForCenterPivot() 同一套數學，
    // 把「這一刻的中心點＋這一刻的旋轉角度＋這一刻的縮放倍率」換算回
    // 左上角該擺的座標。這樣每一影格的旋轉支點都精確落在該影格自己的
    // 視覺中心上，全程都是乾淨地繞自己中心轉正、放大、移動，不會再有
    // 中途偏移、甩動的感覺，位置偏、比例長的照片也一樣。
    let flightRAF = null;
    const flightStartTime = performance.now();
    function tickFlight(now){
      const t = Math.min(1, (now - flightStartTime) / DURATION);
      const p = flipFlightEase(t);

      const angle = startAngle * (1 - p);
      const sx = 1 + (scaleX - 1) * p;
      const sy = 1 + (scaleY - 1) * p;
      const cx = startCenter.x + (endCenter.x - startCenter.x) * p;
      const cy = startCenter.y + (endCenter.y - startCenter.y) * p;

      const cos = Math.cos(angle), sin = Math.sin(angle);
      const halfW = (sx * startRect.width) / 2, halfH = (sy * startRect.height) / 2;
      const rx = cos * halfW - sin * halfH;
      const ry = sin * halfW + cos * halfH;

      clone.style.transform = `translate(${cx - rx}px, ${cy - ry}px) rotate(${angle}rad) scale(${sx}, ${sy})`;

      if(t < 1){
        flightRAF = requestAnimationFrame(tickFlight);
      } else {
        flightRAF = null;
        finish();
      }
    }
    flightRAF = requestAnimationFrame(tickFlight);

    // 拉簾／collab 的淡入淡出跟飛行動畫同時開始，是同一個轉場的一部分。
    // renderFilmstripFrame() 先畫一次「開場位移」當下的畫面（此時 fsPos 還
    // 停在 index+FS_ENTRANCE_OFFSET，尚未開始收斂），確保 CSS opacity/transform
    // 淡入滑入的那一刻，拉簾裡已經有正確排列好的縮圖可以看，不會先閃一下
    // 空白容器；接著 startFsRAF() 啟動彈簧，讓 fsPos 從這個開場位移平滑拉回
    // fsTarget（目標照片），這才是使用者會看到的「拉簾捲動就位」那個動作。
    requestAnimationFrame(() => {
      renderFilmstripFrame();
      detailFilmstrip.classList.add('ready');
      startFsRAF();
    });

    let done = false;
    const finish = () => {
      if(done) return;
      done = true;
      if(flightRAF){ cancelAnimationFrame(flightRAF); flightRAF = null; } // 保底：萬一是被下面逾時計時器叫進來的，飛行迴圈可能還沒自然跑完，順手停掉
      detailImageWrap.style.transition = 'none';
      detailImageWrap.style.opacity = '1';
      void detailImageWrap.offsetWidth;
      detailImageWrap.style.transition = '';
      if(activeFlipClone === clone) activeFlipClone = null;
      clone.remove();
      // 飛行（含交接）完全結束，才放行 resize 等事件重新定位大圖——
      // 如果飛行途中真的發生過視窗尺寸變化，這裡順便補一次最新的定位，
      // 不會漏掉真正需要重新對齊的情況，只是延後到交接完成之後才做，
      // 不會再跟分身的終點打架。
      flipInFlight = false;
      if(detailPage.classList.contains('active')){
        positionDetailImage(lastNaturalW, lastNaturalH);
      }
    };
    // 保底：改成自己用 rAF 算進度後，正常情況下 tickFlight() 在 t>=1 那一格
    // 就會直接呼叫 finish()，不再需要監聽 CSS 的 transitionend——但還是留著
    // 一個逾時計時器當保險，避免分頁被瀏覽器丟到背景導致 rAF 長時間不觸發、
    // 或任何其他極端情況卡住不放行。
    setTimeout(finish, DURATION + 120);
  }

  function openDetail(index, originImgEl, precomputedRect){
    currentIndex = index;
    hideHoverPreview();

    // 進到照片詳細頁：飄動的 e 不該出現在照片頁面上——加上這個 class，
    // 讓 CSS 那條專屬 transition（見 .dvd-bounce.dvd-hidden 的說明）把它
    // 平滑縮小＋淡出消失。
    // 同時把 dvdRAF 那套飄動／撞牆的物理迴圈直接暫停（跟 dvdPointerDown()
    // 抓取當下的做法一樣）：迴圈一旦繼續在背後跑，外層 .dvd-bounce 的
    // translate(x,y) 每一影格都還在改，縮小動畫因此會「一邊變小、一邊
    // 還在飄」，看起來像帶著位移在消失，不是原地縮小。暫停後 dvdX/dvdY
    // 完全不變，等 finishCloseDetail()／openPreviewPage() 把 dvd-hidden
    // 拿掉時再從原本停下的座標繼續飄動（見那兩處的說明），不會有位置
    // 忽然跳掉的問題，只是縮小的這段時間單純靜止在原地。
    if(dvdRAF){ cancelAnimationFrame(dvdRAF); dvdRAF = null; }
    dvdLastTime = null;
    dvdBounce.classList.add('dvd-hidden');

    detailPage.classList.add('active');
    document.body.classList.add('detail-active'); // 點進照片後把首頁時鐘、桌機／平板版的 Collab 區塊都藏起來
    document.body.style.overflow = 'hidden';
    syncFixedChrome();

    // 拉簾不是直接靜止顯示在目標照片上，而是先擺在「目標再往外數
    // FS_ENTRANCE_OFFSET 格」的位置，fsTarget 才是真正的目標——下面
    // canFlip/else 兩條路徑都會呼叫 startFsRAF() 讓 fsTick 裡的彈簧把
    // fsPos 從這個進場位移拉回 fsTarget，形成「拉出來、最後停在該照片」
    // 的開場動態（詳見 FS_ENTRANCE_OFFSET 的說明）。手機／桌機共用同一套
    // 彈簧邏輯，只差在 CSS／版面計算把堆疊軸換成水平（見上面
    // layoutFilmstripZone() 的說明）——但「往外數的方向」這裡特別對手機版
    // 反過來：桌機／平板維持原本 index+FS_ENTRANCE_OFFSET（沿用原本方向），
    // 手機版改成 index-FS_ENTRANCE_OFFSET，讓 d(=off-fsPos) 開場時是正值、
    // 縮圖從畫面右側進來、往左收斂到定位（原本是從左側進來、往右收斂）。
    // 退場那段（見下面 closeDetail 的 fsTarget 設定）也跟著同步反過來，
    // 延續同一個方向繼續往左捲，最後從畫面左側捲出——手機版開場、退場
    // 現在維持跟桌機／平板一樣「同一條連續軌跡」的設計，只是實際方向
    // 相反（桌機一路往下捲，手機一路往左捲）。
    fsPos = index + (isDetailMobile() ? -FS_ENTRANCE_OFFSET : FS_ENTRANCE_OFFSET);
    fsTarget = index;
    fsVel.v = 0;
    fsLastSyncedIndex = index;
    fsEntering = true;
    filmstripTrack.innerHTML = '';
    fsItemEls.clear();
    layoutFilmstripZone();
    fsReady = true;
    detailFilmstrip.classList.remove('ready');
    detailFilmstrip.classList.remove('closing');

    // 手機版現在跟桌機／平板共用同一套「縮圖飛到大圖欄位」的分身轉場
    // （canFlip 不再排除手機），視覺效果完全比照電腦版。
    const noFlipFallback = () => {
      renderDetail();
      renderFilmstripFrame(); // 先畫一次開場位移當下的畫面，避免淡入/滑入的瞬間拉簾是空的
      requestAnimationFrame(() => {
        detailFilmstrip.classList.add('ready');
        startFsRAF(); // 啟動彈簧，把 fsPos 從開場位移拉回目標照片，見 canFlip 分支同樣的說明
      });
    };

    const canFlipNow = originImgEl && originImgEl.tagName === 'IMG'
      && originImgEl.complete && originImgEl.naturalWidth;

    if(canFlipNow){
      runGridToDetailTransition(originImgEl, index, precomputedRect);
    } else if(originImgEl && originImgEl.tagName === 'IMG'){
      // 縮圖還沒讀完（手機版 lazy-loading 偶爾會跟點擊撞在一起，即使
      // pointerdown 那一刻已經搶先切成 eager，網路夠慢的話還是可能沒讀完）。
      // 與其直接放棄、退回沒有位移／縮放的陽春淡入（那樣看起來就是使用者
      // 描述的「彈出來」），不如短暫等它讀完，讀完後照樣走跟桌機版一模
      // 一樣的 FLIP 飛行動畫；真的等到逾時都還沒讀完，才退回陽春淡入
      // 保底，確保使用者最多只多等這一小段時間、絕不會被卡住。
      if(originImgEl.loading === 'lazy') originImgEl.loading = 'eager';
      let settled = false;
      const proceedWithFlip = () => {
        if(settled) return;
        settled = true;
        if(originImgEl.complete && originImgEl.naturalWidth){
          runGridToDetailTransition(originImgEl, index, precomputedRect);
        } else {
          noFlipFallback();
        }
      };
      originImgEl.addEventListener('load', proceedWithFlip, { once:true });
      originImgEl.addEventListener('error', proceedWithFlip, { once:true });
      setTimeout(proceedWithFlip, 220); // 保底逾時，避免慢網路把使用者卡住太久
    } else {
      noFlipFallback();
    }
  }

  let detailClosing = false;   // 退場動畫播放期間為 true，避免使用者連續按好幾次
                                // 上一頁／Escape，讓 closeDetail() 重複觸發、把計時器越疊越亂
  let detailCloseTimer = null;
  let homeRevealCleanupTimer = null; // 回到首頁那段很短的淡入播完後，清除內聯樣式用的計時器

  // 這次開啟的照片詳細頁是不是從「照片物理堆疊模式」的畫面點進來的——
  // 見 openDetailFromPhotoFallItem() 設成 true、finishCloseDetail() 消耗
  // 並重設回 false 的地方。用來讓 closeDetail() 整條收尾流程知道「上一頁」
  // 該回到哪裡：true 就跳過首頁縮圖的放大進場動畫、改成把堆疊模式的物理
  // 世界重新啟動，讓使用者感覺是回到剛剛那個堆疊畫面，而不是被導回首頁。
  let detailFromPhotoFall = false;

  function closeDetail(){
    if(detailClosing || !detailPage.classList.contains('active')) return;
    detailClosing = true;

    // 左側大圖：柔和淡出（見 DETAIL_EXIT_PHOTO_MS／DETAIL_EXIT_EASE 的說明，
    // 尾段明顯放慢，不是等速消失後硬生生停住）。closeDetail() 只在這三個
    // 地方被呼叫（上一頁按鈕／左上角箭頭／Escape），不影響 nextPhoto/
    // prevPhoto 切換照片時 renderDetail() 用到的同一顆 opacity transition，
    // 兩者互不干擾。
    detailImageWrap.style.transition = `opacity ${DETAIL_EXIT_PHOTO_MS}ms ${DETAIL_EXIT_EASE}`;
    detailImageWrap.style.opacity = '0';

    // 「001」編號／「Tokyo」標題這排文字：跟大圖用同一個時間、同一條曲線
    // 一起淡出——.detail-info 是這兩塊文字共同的父層（桌機版 detail-number/
    // detail-title 雖然各自用 position:fixed 跳脫父層版面，但仍是 DOM 上的
    // 子元素，CSS opacity 對整個子樹生效，設在父層一次就能讓兩塊文字同時
    // 淡出，不用個別處理）。同一個節奏、同時消失，感覺是一組完整的東西一
    // 起離開畫面，而不是照片先不見、文字慢半拍或早一步才跟著消失。
    detailInfo.style.transition = `opacity ${DETAIL_EXIT_PHOTO_MS}ms ${DETAIL_EXIT_EASE}`;
    detailInfo.style.opacity = '0';

    // 拉簾容器：拿掉 .ready 沿用跟開場同一組 CSS transition（.46s，
    // cubic-bezier(0.22,1,0.36,1)）淡出；額外加上 .closing 鎖住水平位移
    // （見該 class 的說明），確保退場只有垂直方向的捲動，沒有水平漂移。
    detailFilmstrip.classList.remove('ready');
    detailFilmstrip.classList.add('closing');

    // 拉簾內部縮圖：不是原地淡出或反彈回去，而是延續開場那個 fsPos 位移
    // 的方向繼續往同一邊捲，讓目前正中間這張繼續捲出畫面邊緣、後面的
    // 鄰居照片從另一側補進來遞補——開場到退場感覺是同一條連續的捲動軌跡
    // （見 FS_EXIT_OFFSET 的說明），而不是開場一個方向、退場又反向倒退。
    // 桌機／平板沿用原本方向（fsPos 持續遞減）；手機版因為 openDetail()
    // 裡把進場方向反過來了（fsPos 持續遞增、縮圖從右側進來），這裡也跟著
    // 反過來延續同一個「遞增」方向，讓退場繼續往右移入的那一邊移，最後從
    // 左側捲出畫面——這樣手機版整段開場到退場才會是同一條連續軌跡，跟
    // 桌機／平板的邏輯一致，只是實際方向相反。
    // fsClosing=true 期間 fsSyncCurrentIndex() 整段跳過，退場途中不會意外
    // 觸發左側大圖切換或多餘的網路請求（此時大圖本來就已經在淡出了）。
    if(fsReady){
      fsClosing = true;
      fsTarget = fsPos + (isDetailMobile() ? FS_EXIT_OFFSET : -FS_EXIT_OFFSET);
      startFsRAF();
    }

    // 上面幾個動畫裡最長的是拉簾的 460ms，等它們都播完、畫面上已經看不到
    // 大圖跟拉簾了，才真正把整個照片頁收掉、露出底下的首頁格子——如果太
    // 早收掉（例如沿用舊版瞬間 remove('active')），使用者會看到動畫播到
    // 一半就被硬生生截斷，瞬間跳回首頁，不流暢。
    clearTimeout(detailCloseTimer);
    detailCloseTimer = setTimeout(finishCloseDetail, DETAIL_EXIT_TOTAL_MS);
  }

  function finishCloseDetail(){
    // 這次是不是從照片物理堆疊模式點進來的，要在下面清掉 detailFromPhotoFall
    // 之前先記住——馬上要用它決定「拿掉 dvd-hidden」的這一下該不該播放彈出
    // 動畫。
    const cameFromPhotoFall = detailFromPhotoFall;

    // 離開照片詳細頁這一刻，把 openDetail() 加上的 dvd-hidden 拿掉：
    //   - 一般情況（從首頁縮圖點進來，回到首頁格子）：讓飄動的 e 用 CSS
    //     那條帶回彈的 transition（見 .dvd-bounce-img 預設的說明）快速
    //     放大＋淡入重新出現，這是原本就有的效果。
    //   - 從照片物理堆疊模式點進來、現在要回到堆疊畫面：e 其實從頭到尾
    //     都還在堆疊畫面裡原地待著（只是被 detail-page 暫時蓋住，見上面
    //     CSS body.photo-fall-active.detail-active .photo-fall-stage 的
    //     說明），不是「消失後重新出現」，這裡不該再播一次放大＋回彈的
    //     進場動畫。改成先加上 dvd-instant（transition:none !important，
    //     見該 class 的說明）瞬間切回原本大小／透明度，下一影格再拿掉
    //     dvd-instant，之後其他情境用到同一顆 dvd-hidden 的地方（例如
    //     再次雙擊進堆疊模式、或從首頁縮圖點進單張照片頁）都不受影響，
    //     維持原本正常帶回彈的動畫手感。
    if(cameFromPhotoFall){
      dvdBounce.classList.add('dvd-instant');
      dvdBounce.classList.remove('dvd-hidden');
      void dvdBounce.offsetWidth; // 強制 reflow，確保上面兩個 class 變動先以「瞬間無 transition」的狀態套用一次
      requestAnimationFrame(() => { dvdBounce.classList.remove('dvd-instant'); });
    } else {
      dvdBounce.classList.remove('dvd-hidden');
    }
    // 同步把 openDetail() 暫停掉的物理飄動迴圈接回去——直接從剛剛停下的
    // dvdX/dvdY 原地繼續飄，不呼叫 resetDvdBounce()（那會隨機挑新位置和
    // 新方向），視覺上就是同一顆 e 縮小消失又原地放大出現，銜接不中斷。
    // photoFallModeActive／dvdDragging 期間（例如關閉詳細頁的同時剛好又
    // 雙擊觸發重力模式，或者當下正被抓著拖曳）不搶著接手，交給各自的
    // 流程自己管理這顆迴圈。
    if(!photoFallModeActive && !dvdDragging && !dvdRAF){
      dvdLastTime = null;
      dvdRAF = requestAnimationFrame(stepDvdBounce);
    }

    detailPage.classList.remove('active');
    document.body.classList.remove('detail-active'); // 回到首頁／堆疊頁面，時鐘、Collab 區塊都恢復顯示
    detailImageWrap.classList.remove('show'); // 立刻清空，避免下次打開時先閃一下舊照片
    detailImageWrap.style.opacity = '';
    detailImageWrap.style.transition = '';
    detailInfo.style.opacity = '';
    detailInfo.style.transition = '';

    // 下方時鐘的內聯樣式先統一清成隱藏——不管等一下要回首頁還是回堆疊
    // 頁面，這一刻都不該看到時鐘（堆疊頁面本來就整段隱藏著時鐘，見
    // shrinkHomeForPhotoFall()）。
    pageClock.style.transition = 'none';
    pageClock.style.opacity = '0';

    if(detailFromPhotoFall){
      // 這次是從照片物理堆疊模式點進來的：不執行下面「回到首頁格子」
      // 專屬的縮圖放大進場動畫（首頁格子本來就還維持著堆疊模式進場時
      // 縮到 0 的隱藏狀態，不該被這裡打擾、平白多播一次進場動畫）。改成
      // 把 openDetailFromPhotoFallItem() 暫停掉的物理世界重新啟動，讓
      // 堆疊照片／飄動的 e 從離開前那一刻的位置繼續運作，感覺就是回到
      // 剛剛那個堆疊畫面，而不是被導回首頁。
      detailFromPhotoFall = false;
      document.body.style.overflow = 'hidden'; // 堆疊模式全程需要鎖住捲動，維持跟 shrinkHomeForPhotoFall()/startPhotoFallEngine() 一致
      if(window.Matter && pfRunner && pfRunnerPaused){
        pfStartLoop();
        pfRunnerPaused = false;
      }
    } else {
      // 首頁格子：不再用「整個 .grid 容器淡入」這種方式出場，改成每張縮圖
      // 自己以正中心為中心點放大＋編號跟著淡入歸位（見上面 GRID_REVEAL_*
      // 那組函式的完整說明）。這裡先呼叫 prepareGridRevealState() 把每張
      // 縮圖／編號瞬間切到「放大進場」的起始狀態——使用者這一刻完全看不到，
      // 因為 detailPage 這時候都還蓋在最上面。
      // 容器本身（.grid）維持原本 CSS 預設的 opacity:1，不用再額外淡入，
      // 「從無到有」的視覺效果完全交給裡面每一張縮圖自己的放大動畫負責。
      prepareGridRevealState();
      document.body.style.overflow = '';

      // 強制 reflow，確保上面「瞬間切到起始值」真的先套用到畫面上一次，
      // 接著才換成有 transition 的版本並改回目標值——不這樣做的話，瀏覽器
      // 很可能會把兩次改動合併成同一次繪製，看不出任何進場過程。
      void grid.offsetWidth;
      pageClock.style.transition = `opacity ${HOME_REVEAL_MS}ms ease`;
      requestAnimationFrame(() => {
        pageClock.style.opacity = '1';
      });
      playGridRevealAnimation(); // 縮圖開始從極小放大到現在的大小，編號跟著淡入歸位

      clearTimeout(homeRevealCleanupTimer);
      homeRevealCleanupTimer = setTimeout(() => {
        // 淡入播完，把時鐘的內聯樣式清掉，交還給 CSS 原本 .positioned 規則
        // 自己的 opacity:1 / transition:.2s ease，避免殘留的內聯樣式意外
        // 蓋掉之後其他地方原本的行為。縮圖／編號的內聯樣式則由
        // playGridRevealAnimation() 自己的計時器負責清除，不用在這裡重複處理。
        pageClock.style.transition = '';
        pageClock.style.opacity = '';
      }, HOME_REVEAL_MS + 60);
    }

    if(fsRAFId){ cancelAnimationFrame(fsRAFId); fsRAFId = null; }
    clearTimeout(fsWheelIdleTimer);
    clearTimeout(fsDetailFullTimer);
    fsVel.v = 0;
    fsDragging = false;
    fsReady = false;
    fsEntering = false;
    fsClosing = false;
    fsLastFrameT = 0;
    detailFilmstrip.classList.remove('ready');
    detailFilmstrip.classList.remove('closing');
    filmstripTrack.innerHTML = '';
    fsItemEls.clear();
    detailClosing = false;
  }

  /* =========================================================
     PREVIEW PAGE：左右交錯全版跳轉
  ========================================================= */

  // 在等待期間先把「下一張」的圖片載入 + 解碼好（不只是下載，是連畫面像素都準備好），
  // 這樣真正切換的那一刻只是換一個已經解碼完成的 src，瀏覽器可以直接上屏，
  // 不會因為臨時解碼大圖而卡頓、看起來像是有轉場。
  //
  // 這裡同時修正黑屏問題：photo.url 是 Google Drive 的 uc?export=view 連結，
  // 在某些情況下（例如檔案較大時 Google 會回傳「無法掃描病毒」的中介頁面，
  // 而不是圖片本身）會直接載入失敗；原本失敗後沒有任何備援，img 就一直是空的，
  // 底下 .preview-col 的黑色背景就會整片露出來。現在依序嘗試
  // 原始大圖 → 高解析度縮圖(fallbackUrl) → 一般縮圖(thumbUrl)，
  // 只要任何一個能載入成功就使用它。
  function loadWithFallback(photo){
    return new Promise((resolve) => {
      const candidates = [photo && photo.previewUrl, photo && photo.detailUrl, photo && photo.fallbackUrl, photo && photo.url, photo && photo.thumbUrl].filter(Boolean);
      if(!candidates.length){ resolve(''); return; }

      let i = 0;
      const img = new Image();
      // preview 頁要顯示的圖片，永遠是使用者「馬上就會看到」的內容
      // （不管是剛進站的第一畫面，還是撞牆跳轉後的下一張），明確標成高優先度，
      // 讓瀏覽器把連線/頻寬優先讓給它，不要跟同時間背景在跑的其他預抓
      // （首頁網格、hover 大圖預抓等）平均分掉。畫質完全不受影響——
      // candidates 清單、選用的檔案大小都跟原本一模一樣，這裡只調整
      // 下載的「優先順序」，不是換成更小的檔案。
      try { img.fetchPriority = 'high'; } catch(e){}

      function finish(url){
        if(img.decode){
          img.decode().then(() => resolve(url)).catch(() => resolve(url));
        } else {
          resolve(url);
        }
      }

      function tryNext(){
        if(i >= candidates.length){ resolve(''); return; }
        const url = candidates[i++];
        img.onload = () => finish(url);
        img.onerror = tryNext;
        img.src = url;
      }

      tryNext();
    });
  }

  // ---- 序列與起始張：
  // 右側＝單數編號（001, 003, 005...），從最前面第一張開始，往後遞增播放
  // 左側＝雙數編號（002, 004, 006...），從最後一張開始，往前遞減播放
  // 這樣左右像是「從兩端往中間跑」，方向剛好相反、不會混在一起
  let previewOddPhotos = [];   // 右側序列
  let previewEvenPhotos = [];  // 左側序列
  let previewLeftIdx = 0;
  let previewRightIdx = 0;
  let previewActive = false;
  const previewResolvedLeft = [];
  const previewResolvedRight = [];
  // 跟 previewResolvedLeft/Right（存 Promise）分開，另外放一份「已經 resolve
  // 完成的網址」，讓 applyPreviewSide 可以同步（不用 await）判斷某一張圖是不是
  // 已經真的準備好了。這是修好「有時候不按照 0.5 秒節奏跳轉、最後整個停住
  // 不動」這個 bug 的關鍵：原本不管暖機好了沒，每一步都無條件重新 await 一次
  // Promise 才能知道結果，如果那一步剛好排到還沒暖機完成的圖，畫面就會呆呆
  // 卡在原地什麼都不做，等到那次 await 真的完成、而且完成時「剛好」還沒被
  // 下一步蓋過去，才會更新——網路稍慢，這個條件很容易一直不成立，看起來就是
  // 「跳轉忽快忽慢，最後乾脆卡住不動」。有了這份同步 cache，就能一開始就
  // 知道要不要直接用高畫質、還是得先墊縮圖，不用每一步都乾等。
  const previewReadyLeft = [];
  const previewReadyRight = [];

  function resolvePreviewImage(photo, cache, readyCache, idx){
    if(cache[idx]) return cache[idx];
    const p = loadWithFallback(photo).then((url) => {
      readyCache[idx] = url; // 用字串（哪怕是空字串）標記「已經有結果了」，跟 undefined（還沒好）區分開來
      return url;
    });
    cache[idx] = p;
    return p;
  }

  // 縮圖版本（gridUrl/thumbUrl）另外先請瀏覽器下載一次暖機，不特別追蹤
  // Promise——只是想讓瀏覽器的 HTTP 快取先有這份資料，之後 applyPreviewSide
  // 裡真的要顯示縮圖時，新建的 Image() 走的是同一個網址，會直接命中快取
  // 瞬間載完，不用臨場現扛一次網路下載。這是修掉「剛點進 preview 頁還是會
  // 白一下」的關鍵：原本只有暖機高畫質版本，縮圖墊場圖完全沒被提前暖機過，
  // 使用者點進來的那一刻，連縮圖都要現下載。
  function warmPreviewPlaceholder(photo){
    // 墊場縮圖優先用 thumbUrl（800px），只有在極少數 thumbUrl 缺失的情況下才
    // 退回 gridUrl（400px，首頁網格縮圖用，preview 頁的畫面遠比網格格子大，
    // 400px 拉滿半個螢幕會偏糊）。這樣不管是撞太快之外的「一般等待墊場」，
    // 看到的畫面也會比較清楚，不會在切換高畫質版本前先糊一下。
    const url = (photo && (photo.thumbUrl || photo.gridUrl)) || '';
    if(url){
      const im = new Image();
      try { im.fetchPriority = 'high'; } catch(e){} // 這張墊場圖也是使用者馬上會看到的東西，同樣不該被其他背景預抓卡住
      im.src = url;
    }
  }

  // 極小備援圖（tinyUrl）另外暖機一次，專門給撞擊太快/連續撞擊時使用——
  // 跟縮圖墊場的暖機邏輯一樣，提前請瀏覽器把它快取好，真正要用的那一刻
  // 才能「同步」瞬間顯示，不用臨場等網路。
  function warmPreviewTiny(photo){
    const url = (photo && photo.tinyUrl) || '';
    if(url){ const im = new Image(); im.src = url; }
  }

  // 把當前這一側該顯示的那張圖，重新（提早）暖機一次：
  // 先觸發載入 + decode，讓瀏覽器準備好像素，之後真正要顯示時幾乎是瞬間的
  //
  // 注意：這裡故意「不」清空 previewResolvedLeft / previewResolvedRight 快取。
  // 每次點進 preview 頁面的起始索引永遠是同一組固定值（左：最後一張／右：
  // 第一張），如果每次都把快取清空重來，等於把 preparePreviewSequences() 在
  // 網頁一開始就先做好的預熱結果整個丟掉，使用者點進來時又要重新等一次載入，
  // 這正是「剛點進去偶爾全黑」的原因。保留快取，resolvePreviewImage() 內建的
  // `if(cache[idx]) return cache[idx];` 判斷就會直接沿用已經載入好（或正在
  // 載入中）的同一個 promise，不會重複下載、也不會重新等待。
  // WARM_AHEAD_COUNT：除了起始那一張，額外預先暖機幾步之後會用到的圖片。
  // 原本只多暖 1 步，使用者如果一進 preview 頁就手速很快地連續跳好幾張
  // （或者剛進首頁沒多久、圖片都還在陸續下載中就馬上點進 preview），
  // 暖機進度很容易被追過，跳到還沒載好的那張又變成一次白幕/黑幕。
  // 多暖 2 步（等於隨時保留 3 張的下載/解碼緩衝）在幾乎不增加多少流量的
  // 前提下，能大幅降低這種「連續切換太快、暖機追不上」的機率。
  const WARM_AHEAD_COUNT = 2;

  function warmPreviewStart(){
    // 起始張不再固定（原本左邊永遠是最後一張、右邊永遠是第一張），改成
    // 每次都在各自那一側的序列裡隨機挑一張當起點——單號／雙號分兩邊的
    // 規則完全不受影響（previewEvenPhotos / previewOddPhotos 這兩個序列
    // 本身怎麼切分，這裡沒有動），只是「從哪一張開始跑」隨機。這個函式
    // 除了頁面第一次載入會呼叫一次，使用者每次重新進入 preview 頁
    // （openPreviewPage）也都會呼叫一次，所以「重新整理」跟「每次點進
    // preview 頁」都會拿到新的隨機起點。
    previewLeftIdx = previewEvenPhotos.length ? Math.floor(Math.random() * previewEvenPhotos.length) : 0;
    previewRightIdx = previewOddPhotos.length ? Math.floor(Math.random() * previewOddPhotos.length) : 0;
    if(previewEvenPhotos.length){
      warmPreviewPlaceholder(previewEvenPhotos[previewLeftIdx]);
      resolvePreviewImage(previewEvenPhotos[previewLeftIdx], previewResolvedLeft, previewReadyLeft, previewLeftIdx);
    }
    if(previewOddPhotos.length){
      warmPreviewPlaceholder(previewOddPhotos[previewRightIdx]);
      resolvePreviewImage(previewOddPhotos[previewRightIdx], previewResolvedRight, previewReadyRight, previewRightIdx);
    }

    // 同時把「進頁面後接下來幾次切換」會用到的圖片也先預熱。原本只暖機起始
    // 畫面，下一張要等真正切換到那一刻（stepPreviewSide 觸發時）才開始下載
    // ——如果那時候使用者剛好進頁面沒多久、圖片還在載入中，第一輪的切換就會
    // 等圖片載完才真正換畫面，使得開頭幾次切換的間隔時間長短不一（不規則
    // 跳動），要等這個「提前幾步」的暖機追上進度後才會穩定成固定的 0.5 秒
    // 節奏。這裡提前暖機，讓它從使用者一點進頁面（甚至更早，
    // preparePreviewSequences 在照片清單一到手就會呼叫這個函式）就開始
    // 下載，通常會有遠超過 0.5 秒的提前量，等真正切換到它時多半早就已經
    // 載完。
    for(let step = 1; step <= WARM_AHEAD_COUNT; step++){
      if(previewEvenPhotos.length > 1){
        const nextLeftIdx = (previewLeftIdx - step + previewEvenPhotos.length * 2) % previewEvenPhotos.length;
        warmPreviewPlaceholder(previewEvenPhotos[nextLeftIdx]);
        resolvePreviewImage(previewEvenPhotos[nextLeftIdx], previewResolvedLeft, previewReadyLeft, nextLeftIdx);
      }
      if(previewOddPhotos.length > 1){
        const nextRightIdx = (previewRightIdx + step) % previewOddPhotos.length;
        warmPreviewPlaceholder(previewOddPhotos[nextRightIdx]);
        resolvePreviewImage(previewOddPhotos[nextRightIdx], previewResolvedRight, previewReadyRight, nextRightIdx);
      }
    }
  }

  // 照片清單一到手就準備好 preview 用的兩組序列，並且立刻開始暖機第一張，
  // 這樣不管使用者何時點下 preview，兩張起始畫面大機率早就載入/解碼完成，
  // 點進去馬上就能看到照片，不會有黑屏的空檔
  function preparePreviewSequences(){
    previewOddPhotos = photos.filter((_, i) => i % 2 === 0);
    previewEvenPhotos = photos.filter((_, i) => i % 2 === 1);
    // 真正「馬上」要用到的，只有起始畫面 + 前面幾步（warmPreviewStart 裡的
    // WARM_AHEAD_COUNT），這裡先同步暖機好，維持原本「點進去/自動開啟
    // preview 馬上就能看到照片」的保證。
    warmPreviewStart();
    // 剩下「兩條序列全部照片」的極小圖（320px），是給撞牆跳轉「撞太快/
    // 連續撞擊」這種次要情境用的保險，不是進站當下就要用的東西。原本這裡
    // 用 forEach 一次性把全部照片的極小圖請求同時發出去，等於是拿這種次要
    // 用途的請求，去跟首頁網格第一畫面的縮圖、preview 起始畫面搶手機有限
    // 的頻寬/連線數——這正是「首頁小圖跑出來變慢、一開始整個全白幕」的
    // 主因之一。改成用 requestIdleCallback 分批、慢慢補齊：等瀏覽器真的
    // 閒下來（代表首屏真正需要的資源都已經發送出去了）才繼續暖下一張，
    // 不影響它原本「隨時能墊上」的保險功能，只是不再搶第一時間的頻寬。
    const allForTiny = previewEvenPhotos.concat(previewOddPhotos);
    let tinyStep = 0;
    function warmTinyStep(){
      if(tinyStep >= allForTiny.length) return;
      warmPreviewTiny(allForTiny[tinyStep]);
      tinyStep++;
      if('requestIdleCallback' in window){
        requestIdleCallback(warmTinyStep, { timeout: 1000 });
      } else {
        setTimeout(warmTinyStep, 80);
      }
    }
    warmTinyStep();
  }

  // ---------- preview 頁「起始那一刻」左右兩張同時出現 ----------
  // 跟上面 applyPreviewSide 的邏輯很像（一樣是先看 readyCache、沒有的話墊縮圖、
  // 縮圖也沒有才等高畫質），差別是這裡「不」直接把結果賦值給 <img>，而是回傳
  // 一個 Promise<url>，讓呼叫端可以用 Promise.all 等左右兩側都準備好同一個
  // 層級（例如都至少有縮圖可用）之後，再同一刻一起賦值——這樣就不會發生「反正
  // 都還沒完全載好，其中一側先跳出來、另一側還維持白幕好一陣子」這種不同步
  // 的狀況：既然兩邊在載入完成前終究都會有一段白幕，不如讓白幕結束的那一刻
  // 兩邊一起結束，觀感上乾脆俐落很多。
  // 只用在「使用者剛進 preview 頁、兩側都還沒有任何畫面」這個起始情境；
  // 之後靠飄動的 e 撞牆觸發的單側切換（stepPreviewSide／applyPreviewSide）
  // 維持原本各自獨立更新，不受影響——那本來就是兩個各自獨立的事件，沒有
  // 「同時出現」的預期。
  function startPreviewSide(side){
    const seq = side === 'left' ? previewEvenPhotos : previewOddPhotos;
    const cache = side === 'left' ? previewResolvedLeft : previewResolvedRight;
    const readyCache = side === 'left' ? previewReadyLeft : previewReadyRight;
    if(!seq.length) return Promise.resolve('');
    const idx = side === 'left' ? previewLeftIdx : previewRightIdx;
    const photo = seq[idx];

    // 高畫質版本已經暖機完成，直接回傳，畫質不受任何影響
    if(typeof readyCache[idx] === 'string'){
      return Promise.resolve(readyCache[idx] || '');
    }

    // 不管縮圖墊場成不成功，高畫質版本都要在背景繼續請求；這裡回傳的只是
    // 一個「resolve 成 url」的 promise，不在這裡附加賦值副作用（img.src 交給
    // 呼叫端的 Promise.all 統一處理，確保起始畫面兩側同時出現）。這個 promise
    // 本身會被 resolvePreviewImage() 快取住，起始畫面亮相之後
    // upgradePreviewSideToHighRes() 會重新取用同一個快取，把縮圖換成真正的
    // 高畫質版本。
    const highResPromise = resolvePreviewImage(photo, cache, readyCache, idx);

    const placeholderUrl = (photo && (photo.thumbUrl || photo.gridUrl)) || '';
    if(!placeholderUrl) return highResPromise; // 沒有縮圖可墊，只能直接等高畫質

    return new Promise((resolve) => {
      const thumb = new Image();
      try { thumb.fetchPriority = 'high'; } catch(e){}
      thumb.onload = () => {
        if(thumb.decode){
          thumb.decode().then(() => resolve(placeholderUrl)).catch(() => resolve(placeholderUrl));
        } else {
          resolve(placeholderUrl);
        }
      };
      thumb.onerror = () => resolve(''); // 縮圖失敗：這一側先不賦值，交給起始畫面同步亮相之後的 upgradePreviewSideToHighRes 接手補上高畫質版本
      thumb.src = placeholderUrl;
    });
  }

  async function applyPreviewSide(side, forceTiny){
    const seq = side === 'left' ? previewEvenPhotos : previewOddPhotos;
    const cache = side === 'left' ? previewResolvedLeft : previewResolvedRight;
    const readyCache = side === 'left' ? previewReadyLeft : previewReadyRight;
    const imgEl = side === 'left' ? previewLeftImg : previewRightImg;
    if(!seq.length) return;
    const idx = side === 'left' ? previewLeftIdx : previewRightIdx;
    const photo = seq[idx];
    const isStillCurrent = () => previewActive && (side === 'left' ? previewLeftIdx : previewRightIdx) === idx;

    // 撞太快／連續撞擊：不要再走下面等縮圖/高畫質的流程（那些流程哪怕已經
    // 暖機過，也還是要等一次 decode 或 Promise resolve，連續撞擊時排隊排
    // 不完，看起來就是圖片一直跑不出來）。這裡改成直接同步賦值成已經整條
    // 序列都提前暖機過的極小圖，瀏覽器幾乎是瞬間就能畫出來，保證每一次撞
    // 都「馬上」看得到東西。高畫質版本還是在背景繼續請求、暖機起來，等
    // 撞擊速度緩下來、之後又切回附近張次時就能直接用上。
    if(forceTiny){
      // 已經暖機好的話，直接一次到位用高畫質，不需要繞去小圖再升級一輪，
      // 維持原本「有暖機就不閃過縮圖」的品質；只有真的還沒暖機完成，才退
      // 而求其次墊一張小圖。
      if(typeof readyCache[idx] === 'string'){
        if(readyCache[idx] && isStillCurrent()) imgEl.src = readyCache[idx];
        return;
      }
      // 墊場圖畫質分兩層：優先試 thumbUrl（800px）——這張圖在正常情況下早就
      // 被 warmPreviewPlaceholder（起始張 + WARM_AHEAD_COUNT 提前兩步）預先
      // 請瀏覽器下載過，用「設定 src 後立刻檢查 complete/naturalWidth」這個
      // 常見手法可以同步判斷瀏覽器是不是已經有這份快取——如果有，直接拿來用，
      // 完全不會比原本的極小圖慢，但畫質好上一大截；只有連 thumbUrl 都還沒
      // 被快取到的少數情況（例如撞擊速度快到追過了兩步的暖機進度），才退回
      // 用背景全部預先暖機過、保證一定已經快取好的極小圖 tinyUrl（320px），
      // 確保「這一撞畫面一定馬上有反應」這個保證不會被打破。
      const thumbCandidate = photo && photo.thumbUrl;
      let placeholder = null;
      if(thumbCandidate){
        const probe = new Image();
        probe.src = thumbCandidate;
        if(probe.complete && probe.naturalWidth > 0) placeholder = thumbCandidate;
      }
      if(!placeholder) placeholder = photo && photo.tinyUrl;
      if(placeholder && isStillCurrent()) imgEl.src = placeholder;
      resolvePreviewImage(photo, cache, readyCache, idx).then((url) => {
        if(url && isStillCurrent()) imgEl.src = url;
      });
      return;
    }

    // 真正的舊 bug 不是「還沒修過縮圖墊場」，而是這個函式以前不管暖機好了沒，
    // 每一步都無條件重新 `await resolvePreviewImage(...)` 一次才知道結果：
    // 90% 的情況下（WARM_AHEAD_COUNT 早就提前暖機好了）這個 await 幾乎瞬間
    // resolve，看起來沒問題；但只要有一步剛好排到「還沒暖機完成」的圖（網路
    // 忽然變慢、或使用者連續切太快追過暖機進度），這一步就會乾等，畫面完全
    // 不動，等 await 真的完成時，往往下一個 0.5 秒的排程又已經把 idx 推進了，
    // `stillCurrent` 判斷失敗、這次更新直接被丟掉——於是這一步「什麼都沒發生
    // 過」，看起來就是跳轉的節奏忽快忽慢；如果網路一直沒追上，之後每一步都會
    // 被同樣的方式丟掉，最終畫面就完全停住不再更新。
    //
    // 修法：先同步（不 await）查 previewReadyLeft/Right 這份 cache，看這張
    // 照片的高畫質版本是不是已經暖機完成——多數情況下答案是「是」，這時直接
    // 一次到位換上高畫質，跟原本一樣完全不會閃過縮圖。只有真的還沒暖機完成
    // 的少數情況，才退而求其次：先墊上（已經在 warmPreviewStart /
    // warmPreviewPlaceholder 裡提前暖機過、幾乎瞬間就能載完的）縮圖，確保
    // 這一步「一定」會讓畫面換成新照片、維持住固定節奏，不會呆呆卡住等高
    // 畫質版本；等高畫質版本真的完成再無縫換上清晰版本。
    if(typeof readyCache[idx] === 'string'){
      if(readyCache[idx] && isStillCurrent()) imgEl.src = readyCache[idx];
      return;
    }

    const placeholderUrl = (photo && (photo.thumbUrl || photo.gridUrl)) || '';
    if(placeholderUrl){
      // 用一顆看不見的 Image() 載入＋decode()，確定「連畫面像素都準備好」
      // 之後才賦值給真正顯示用的 <img>，這樣縮圖出現的那一刻永遠是完整的
      // 一整張，不會有「上半段先出現、下半段還是黑的」這種半成品畫面。
      // 因為 warmPreviewPlaceholder 已經提前請瀏覽器把這個網址快取好，這裡
      // 多半是直接命中快取、幾乎瞬間完成，不會拖累節奏。
      await new Promise((resolve) => {
        const thumb = new Image();
        thumb.onload = () => {
          if(thumb.decode){
            thumb.decode().then(resolve).catch(resolve);
          } else {
            resolve();
          }
        };
        thumb.onerror = resolve; // 縮圖失敗就跳過，直接留給下面的高畫質版本處理
        thumb.src = placeholderUrl;
      });
      // decode 這段等待期間，使用者可能已經很快切到別張、或直接關掉 preview
      // 頁，這裡要重新確認一次「現在真的還是要顯示這張」才賦值，避免把已經
      // 過期的縮圖畫面蓋到更新的畫面上
      if(!isStillCurrent()) return;
      imgEl.src = placeholderUrl;
    }

    const url = await resolvePreviewImage(photo, cache, readyCache, idx);
    if(!isStillCurrent()) return;
    if(url) imgEl.src = url;
  }

  function stepPreviewSide(side, forceTiny){
    if(side === 'left'){
      if(!previewEvenPhotos.length) return;
      previewLeftIdx = (previewLeftIdx - 1 + previewEvenPhotos.length) % previewEvenPhotos.length; // 左側往前遞減
    } else {
      if(!previewOddPhotos.length) return;
      previewRightIdx = (previewRightIdx + 1) % previewOddPhotos.length; // 右側往後遞增
    }
    // 順便預先暖機下一輪那一側會用到的圖片
    const nextSeq = side === 'left' ? previewEvenPhotos : previewOddPhotos;
    const nextCache = side === 'left' ? previewResolvedLeft : previewResolvedRight;
    const nextIdx = side === 'left'
      ? (previewLeftIdx - 1 + previewEvenPhotos.length) % previewEvenPhotos.length
      : (previewRightIdx + 1) % previewOddPhotos.length;
    const nextReadyCache = side === 'left' ? previewReadyLeft : previewReadyRight;
    if(nextSeq.length){
      warmPreviewPlaceholder(nextSeq[nextIdx]);
      resolvePreviewImage(nextSeq[nextIdx], nextCache, nextReadyCache, nextIdx);

    applyPreviewSide(side, forceTiny);

  // ---------- preview 頁的跳轉節奏：改由飄動的 e 撞到螢幕上/下邊界觸發 ----------
  // 不再用固定 0.5 秒的計時器自動輪流換左右兩側；撞到上半部邊界＝上方（左側）
  // 照片跳一張，撞到下半部邊界＝下方（右側）照片跳一張，手機（上下版面）、
  // 桌機（左右版面）都套用同一套「撞上緣/下緣」判斷。
  //
  // 快速連續撞擊的處理：分別記錄「上緣」「下緣」各自上一次「真正觸發切換」的
  // 時間，這一次撞擊如果離上一次真正切換的時間小於 DVD_PREVIEW_RAPID_MS，
  // 就視為同一次連續撞擊的延續，直接略過——不切照片、也不更新計時基準
  // （previewLeftLastHitAt / previewRightLastHitAt 維持原值不動）。這樣不管
  // 在這個時間窗裡實際撞了幾下，最多也只會真的切一次，不會因為撞太快就被
  // 逼著用比預期更快的速度狂跳；要等離「上一次真正切換」的間隔真的超過這個
  // 門檻，下一下撞擊才會被當成新的一次、觸發切換。
  const DVD_PREVIEW_RAPID_MS = 450;
  let previewLeftLastHitAt = 0;
  let previewRightLastHitAt = 0;
  function handleDvdPreviewEdgeHit(side){
    if(!previewActive) return; // 只在 preview 頁生效，其他頁面撞邊界不受影響
    const now = performance.now();
    const lastAt = side === 'left' ? previewLeftLastHitAt : previewRightLastHitAt;
    if((now - lastAt) < DVD_PREVIEW_RAPID_MS){
      return; // 離上一次真正切換太近，當作同一次連續撞擊，忽略、不切換
    }
    if(side === 'left') previewLeftLastHitAt = now; else previewRightLastHitAt = now;
    // 一律用 forceTiny=true：撞邊界觸發的換張，永遠要保證「這一撞畫面馬上
    // 有反應」，不能冒險走原本那條會被 isStillCurrent() 中途丟棄的非同步
    // 流程（見 applyPreviewSide 裡的完整說明——這正是「撞到邊界但照片沒換」
    // 這個 bug 的成因：換張的呼叫從頭到尾都沒有把 forceTiny 傳進去，等於
    // 那條本來就設計好的快速路徑形同虛設，從未真正啟用過）。
    stepPreviewSide(side, true);
  }

  function startPreviewCycle(){
    previewActive = true;
    previewLeftLastHitAt = 0;
    previewRightLastHitAt = 0;

    // 記下這一刻的索引，等兩側都準備好要賦值時，再次確認使用者沒有在等待
    // 期間又切換到別張（理論上起始畫面不會被撞牆事件搶先，但保留這層防呆）
    const startLeftIdx = previewLeftIdx;
    const startRightIdx = previewRightIdx;

    // 起始畫面：左右兩側都準備好（至少縮圖已經 decode 完成）才「同時」賦值
    // 顯示，不再各自各憑本事誰先載完誰先跳出來。之後的跳轉交給飄動的 e
    // 撞到上/下邊界時觸發（見 handleDvdPreviewEdgeHit → stepPreviewSide →
    // applyPreviewSide，各自獨立更新，不受這裡影響），這裡不再自動排程計時器。
    Promise.all([
      startPreviewSide('left'),
      startPreviewSide('right')
    ]).then(([leftUrl, rightUrl]) => {
      if(!previewActive) return; // 使用者可能在等待期間已經離開 preview 頁
      if(leftUrl && previewLeftIdx === startLeftIdx) previewLeftImg.src = leftUrl;
      if(rightUrl && previewRightIdx === startRightIdx) previewRightImg.src = rightUrl;

      // 起始畫面兩側的照片就是在這一刻真正「準備好、要出現在畫面上」——
      // 不管 leftUrl/rightUrl 實際上是不是都拿到值（就算其中一側失敗、
      // 或兩側都空，也不該讓 header／飄動的 e 永遠卡在隱藏狀態），這裡都
      // 一律放行，讓照片、header 文字、飄動的 e 同一刻一起淡入（完整
      // 說明見 CSS body.initial-reveal-pending 那段）。
      revealInitialChrome();

      // 起始畫面兩側這時已經「同時」亮出來了（不管當下亮出來的是縮圖還是
      // 已經是高畫質）。從這一刻開始，兩側是否同步已經不重要了——這裡才
      // 各自獨立把背景一直在跑的真正高畫質版本接上去，把縮圖無縫換成清楚
      // 版本；不會重蹈之前「其中一側自己搶先賦值」的覆轍，因為那個問題
      // 只發生在「兩側都還沒亮出來」的起始瞬間，這裡已經過了那個時間點。
      // 同時也補上「縮圖本身載入失敗」的退路：原本縮圖失敗時完全不會賦值，
      // 這一步會接手把高畫質版本補上去，圖片才不會卡在空白。
      upgradePreviewSideToHighRes('left', startLeftIdx);
      upgradePreviewSideToHighRes('right', startRightIdx);
    });
  }

  // 起始畫面同步亮相之後，各自獨立把已經在背景請求的高畫質版本接上去；
  // 不影響「兩側同時出現」的保證，因為這一步永遠發生在那之後。
  function upgradePreviewSideToHighRes(side, idx){
    const seq = side === 'left' ? previewEvenPhotos : previewOddPhotos;
    const cache = side === 'left' ? previewResolvedLeft : previewResolvedRight;
    const readyCache = side === 'left' ? previewReadyLeft : previewReadyRight;
    const imgEl = side === 'left' ? previewLeftImg : previewRightImg;
    const photo = seq[idx];
    if(!photo) return;
    const isStillCurrent = () => previewActive && (side === 'left' ? previewLeftIdx : previewRightIdx) === idx;
    resolvePreviewImage(photo, cache, readyCache, idx).then((url) => {
      if(url && isStillCurrent() && imgEl.src !== url) imgEl.src = url;
    });
  }

  function stopPreviewCycle(){
    previewActive = false;
  }

  // pushHistory=false 用在「因為網址本來就是 #preview（例如重新整理、上一頁/下一頁）
  // 才開啟這個頁面」的情境，這種情況不需要再往歷史紀錄多推一筆，否則會造成
  // 網址狀態跟瀏覽器上一頁/下一頁按鈕的行為對不起來。
  // ---------- 貫穿全站的飄動英文字（EDEN）----------
  // 不再只在手機版 preview 頁顯示，也不再區分手機/桌機兩種抓取方式——
  // 這顆元素是 <body> 的直接子節點，從進站那一刻就開始跑，切換
  // gallery / preview / detail 頁面完全不會影響它、不會被重新定位、
  // 不會被重新啟動，所以「切頁」不會有任何跳動或震動。
  const dvdBounce = document.getElementById('dvdBounce');
  // =====================================================================
  // ⚠️ 以下這段（末速度偵測 + 定速回穩規則）已經跟使用者來回確認、調到
  // 使用者要的手感，之後任何其他需求的修改都不要動到這幾個常數的數值、
  // 也不要動到 dvdPointerMove() / dvdPointerUp() 裡標注「不要動」的計算
  // 邏輯本身（下面 watchdog 那段的對應規則也算在內）。如果之後有新需求
  // 剛好牽涉到飄動字，先確認是否真的需要改到這一段，不要順手一起調整。
  // 目前經確認的規則（白話版）：
  //   1) 放開時的末速度，只看「放開前 DVD_FLING_WINDOW_MS 毫秒內」的
  //      取樣，而且是相對「放開當下」回推，不是相對上一次 pointermove
  //      觸發的時間——這樣「快速拖曳→停住→瞬間放開」才會正確算出接近
  //      0 的速度，不會被停住前的舊資料誤判成還在高速移動。
  //   2) 甩出去的速度只要不高於 DVD_SPEED（定速），放開後就照偵測到的
  //      速度直接飄，不會有任何自動機制把它拉回定速；只有「高於定速」
  //      才會啟動朝定速回穩的衰減（DVD_DECAY_MS，很長很細膩）。
  // =====================================================================
  const DVD_SPEED = isDetailMobile() ? 240 : 400; // px/秒，平常巡迴的固定速度（桌機加快，手機維持原速 240 不變）
  const DVD_DECAY_MS = 16000; // 甩得比定速快時，放開後從當下的高速慢慢衰減回 240 要花多久——拉得非常長，讓整個降速過程細膩、有餘韻，不是短短幾秒就結束
  // 規則：甩出去的瞬時速度如果高於定速，放開後才需要慢慢衰減回定速
  // （用上面 DVD_DECAY_MS 這個很長、很細膩的時長）；如果低於定速（含
  // 幾乎沒動、原地放開），完全不做任何自動修正，直接照偵測到的那個
  // 速度繼續飄，不會被拉回定速——這是這顆彈跳字本身的規則，不是bug。
  // 詳細判斷見下面 dvdPointerUp() 與 watchdog 那兩處。
  const DVD_DECAY_EASE = 12; // 衰減曲線的陡度：模擬真實摩擦力「先快後慢」的指數衰減，數字越大前段掉速越猛——丟出去沒多久速度就已經掉下來一大截，剩下的時間則是很長、很平緩的尾段慢慢貼近終速，過程依然平滑，不會有斷點或頓挫感
  const DVD_FLING_WINDOW_MS = 80; // 放開時只採用「放開前這麼多毫秒」內的取樣算末速度，且這個窗口
    // 是相對「放開當下」回推，不是相對「上一次真的有觸發 pointermove 的
    // 時間點」回推——這個差異正是修正「快速拖曳→停住→瞬間放開，卻還是
    // 被噴出去」這個問題的關鍵，詳細原因見 dvdPointerUp() 內的說明。


  let dvdRAF = null;
  let dvdLastTime = null;
  let dvdX = 0, dvdY = 0;
  // 用「方向（單位向量）＋速度純量」拆開存，而不是直接存 dx/dy：撞牆只需要翻轉
  // 方向、甩出去的衰減只需要調整速度純量，兩件事互相獨立、不會打架
  let dvdDirX = 1, dvdDirY = 0;
  let dvdSpeed = DVD_SPEED;
  let dvdDecaying = false;
  let dvdDecayStartTime = 0;
  let dvdDecayStartSpeed = DVD_SPEED;
  let dvdDecayDurationMs = DVD_DECAY_MS; // 只有「甩得比定速快」時才會用到，等於 DVD_DECAY_MS；低於定速時 dvdDecaying 直接是 false，這個值不會被套用
  let dvdDragging = false;
  let dvdPointerId = null;
  let dvdGrabOffsetX = 0, dvdGrabOffsetY = 0; // 抓取當下，指標位置跟元素左上角的距離，維持抓取點不跳動
  let dvdMoveSamples = []; // 最近的 {t, x, y} 取樣，放開時用來算「甩動當下」的瞬時速度

  // 元素目前實際渲染出來的視覺尺寸（現在等於圖片本身的實際大小，容器已經
  // 拿掉多餘的按鍵熱區 padding）——撞牆邊界用這個算，不再像舊版那樣寫死
  // 一個固定像素值；圖片大小（clamp 隨視窗寬度連續縮放、手機版另外放大
  // 1.8 倍）改變時，這個尺寸也會跟著變，量測一次存起來，之後每次撞牆
  // 判斷都直接讀這個值，不用每一影格都重新觸發一次 layout。
  let dvdW = 0, dvdH = 0;
  function measureDvdSize(){
    const rect = dvdBounce.getBoundingClientRect();
    if(rect.width > 0) dvdW = rect.width;
    if(rect.height > 0) dvdH = rect.height;
  }

  // ---------- 撞牆震動 ----------
  // 只在支援 navigator.vibrate 的裝置上生效（實務上就是觸控裝置）；桌機
  // 瀏覽器本來就沒有這支 API，下面的 feature-check 會自動跳過，不需要
  // 再另外判斷「是不是手機」「是不是在哪個頁面」。
  // dvdWasCollidedLastFrame：用「邊緣觸發」而不是「只要正在撞牆就震」——
  // 撞牆瞬間 dvdX/dvdY 會被夾在邊界上（見下面 collided 判斷），如果那一幀
  // 剛好速度極慢（例如使用者用極小力道甩出去、或速度衰減到接近 0），
  // 元素可能連續好幾影格都貼在同一個邊界值上，若每一影格都判斷「有沒有
  // 貼著邊界」就震，會變成「卡住那段時間瘋狂連續震動」。改成只在「上一影格
  // 沒有貼著邊界、這一影格才剛貼上」的那個瞬間震一次，之後只要還貼著同一
  // 個邊，就不會重複觸發，直到它離開邊界、之後又撞上另一次才會再震一次。
  let dvdWasCollidedLastFrame = false;
  // 專門給 preview 頁「撞到螢幕邊界跳照片」用的邊緣觸發旗標——不分是撞到
  // 上/下/左/右哪一邊，只要是撞到螢幕邊界（跟撞到頁面內圖片的 collided
  // 分開算）就算一次候選，實際要換哪一側照片再由撞擊當下 e 落在畫面上半/
  // 下半決定（見 stepDvdBounce 裡的判斷）。
  let dvdWasScreenEdgeCollidedLastFrame = false;
  // dvdLastVibrateTime + DVD_VIBRATE_COOLDOWN_MS：再加一層保險用的最短間隔，
  // 防止某些極端情況（例如同一影格 x、y 兩個方向同時撞到角落，或裝置效能
  // 不穩定造成判斷抖動）短時間內觸發不只一次震動。
  let dvdLastVibrateTime = 0;
  const DVD_VIBRATE_COOLDOWN_MS = 120;
  function triggerDvdEdgeVibration(){
    if(!('vibrate' in navigator)) return;
    const now = performance.now();
    if(now - dvdLastVibrateTime < DVD_VIBRATE_COOLDOWN_MS) return; // 冷卻時間內，先不重複觸發
    dvdLastVibrateTime = now;
    try{ navigator.vibrate(8); }catch(err){} // 8ms：非常短、力道很輕的一次震動
  }

  // dvdX/dvdY 存的就是元素本身（border-box，現在等於圖片邊緣）左上角的
  // 位置，不再另外疊一圈抓取熱區 padding——圖片本身已經夠大、夠好點了，
  // 不需要額外的透明熱區，撞牆判斷也因此精準貼合圖片實際邊緣而不是熱區。
  function dvdBoundMinX(){ return 0; }
  function dvdBoundMinY(){ return 0; }
  function dvdBoundMaxX(){ return Math.max(0, window.innerWidth - dvdW); }
  function dvdBoundMaxY(){ return Math.max(0, window.innerHeight - dvdH); }

  function clampDvd(v, min, max){ return v < min ? min : (v > max ? max : v); }

  // ---------- 頁面內的「圖片」也當成撞牆單位 ----------
  // 除了螢幕邊界，飄動的 e 現在還會跟首頁縮圖照片、或詳情頁那張置中大圖
  // 的實際邊緣互撞反彈——preview 頁刻意排除在外，維持原本只跟螢幕邊界
  // 碰撞的行為。回傳的是目前這一刻所有要拿來當「牆」的矩形（viewport
  // 座標，跟 getBoundingClientRect() 一致，也跟 dvd 自己的定位方式一致，
  // 不用另外換算捲動位移）。
  function getObstacleRects(){
    if(previewPage.classList.contains('active')) return [];

    if(detailPage.classList.contains('active')){
      if(!detailImageWrap.classList.contains('show')) return [];
      const r = detailImageWrap.getBoundingClientRect();
      return (r.width > 0 && r.height > 0) ? [r] : [];
    }

    // 首頁格子頁：飄動的 e 在首頁不跟任何縮圖硬碰撞，行為比照 preview 頁
    // （見上面 previewPage.classList.contains('active') 那個分支）——只跟
    // 螢幕邊界碰撞，可以直接跟照片重疊、穿過去，回傳空陣列即可。詳情頁
    // （上面 detailPage 那個分支）維持原本會跟大圖碰撞的行為，不受這裡影響。
    // 首頁改用下面 applyGridScrollNudge() 提供「捲動經過時輕輕撥動一下」的
    // 效果，跟這裡的硬碰撞判斷是兩套完全獨立的機制，見該函式的說明。
    return [];
  }

  // ---------- 首頁捲動時，經過的縮圖對飄動的 e 產生像被風吹到的撥動效果 ----------
  // 需求：e 完全不能被縮圖「卡住」或「擋住」（不能阻止重疊，必須維持能夠
  // 自由疊在照片上面/後面這件事），使用者上下捲動頁面、縮圖劃過 e 所在
  // 範圍的那一瞬間，希望有種「被風吹到、輕輕撥了一下」的流暢手感，不是
  // 硬碰硬的撞擊感。
  //
  // 做法刻意跟 resolveDvdObstacleCollision()（詳情頁大圖用的那套硬碰撞）
  // 完全分開、不共用：那套會算重疊深度、把座標夾到邊緣外、翻轉方向、觸發
  // 邊框震動——目的就是「不能重疊」；這裡要的剛好相反，只需要一個最簡單
  // 的 AABB 是否重疊判斷（有沒有疊到，不用管疊多深），完全不改動
  // dvdDirX/dvdDirY 本身、也不觸發撞牆的震動邏輯——e 該怎麼飄還是怎麼飄，
  // 重疊本身完全不受影響，接下來一樣可以繼續疊在照片上。
  //
  // 第一版做法是重疊時直接在 dvdY 上加一筆瞬間位移——這在快速捲動（例如
  // 滑鼠滾輪一次觸發一大段 scrollY 變化）時，會變成「單一影格內位移量
  // 突然跳一大截」，視覺上就是很生硬的一下「撞擊感」，不是使用者要的
  // 「風吹過去、緩緩撥動」的手感。
  // 改成「風力殘留速度」模型：捲動＋重疊只負責疊加一筆瞬時「風速」
  // （dvdNudgeVY，單位 px/s），不直接動位置；真正的位移改到 stepDvdBounce()
  // 主迴圈裡，每一影格都用這個殘留風速乘上 dt 疊進去，同時讓風速本身按照
  // dt 為基準的指數衰減慢慢歸零（DVD_SCROLL_NUDGE_DECAY_PER_SEC，數字越
  // 大衰減越快）——不管當下這一影格捲動量有多突然，位移都會被攤平成一段
  // 平滑的曲線，像風真的吹過去、然後慢慢停下來，不會有任何單一影格暴衝
  // 的瞬間跳動。
  let dvdLastScrollY = window.scrollY;
  let dvdNudgeVY = 0; // 目前累積的「風速」殘留值（px/s），每影格自然衰減，見 stepDvdBounce() 內的套用處
  const DVD_SCROLL_NUDGE_IMPULSE = 2.4;      // 捲動量轉換成風速的比例（比上一版 1.4 加大）
  const DVD_SCROLL_NUDGE_MAX_IMPULSE = 220;  // 單次疊加的風速上限 (px/s)（比上一版 130 加大）
  const DVD_SCROLL_NUDGE_DECAY_PER_SEC = 6.5; // 風速衰減係數：數字越大，風停下來的速度越快、尾韻越短
  function applyGridScrollNudge(){
    const scrollY = window.scrollY;
    const scrollDelta = scrollY - dvdLastScrollY;
    dvdLastScrollY = scrollY;
    if(scrollDelta === 0) return; // 這一影格沒有捲動，不需要量測任何 DOM、也不需要疊加風力

    const dvdLeft = dvdX, dvdRight = dvdX + dvdW, dvdTop = dvdY, dvdBottom = dvdY + dvdH;
    const imgs = grid.querySelectorAll('.grid-item img.loaded');
    for(let i = 0; i < imgs.length; i++){
      const r = imgs[i].getBoundingClientRect();
      if(r.width <= 0 || r.height <= 0) continue;
      if(dvdRight > r.left && dvdLeft < r.right && dvdBottom > r.top && dvdTop < r.bottom){
        // 往下捲（scrollY 變大）時，頁面內容在螢幕上其實是往「上」移動——
        // 這裡取負號，讓風向跟縮圖劃過螢幕的實際視覺方向一致（縮圖往上滑
        // 過 e，就順著把 e 也往上吹一點點，而不是反方向頂回去）。
        const impulse = Math.max(-DVD_SCROLL_NUDGE_MAX_IMPULSE, Math.min(DVD_SCROLL_NUDGE_MAX_IMPULSE, -scrollDelta * DVD_SCROLL_NUDGE_IMPULSE));
        dvdNudgeVY += impulse;
        break; // 一影格只借用「目前正在重疊的第一張圖」疊加一次風力，疊到好幾張圖也不重複疊加
      }
    }
  }

  // 修正距離在這個範圍內（正常貼著邊緣移動時，每影格的重疊量本來就只有
  // 幾 px），維持原本「直接貼齊」的做法——距離小到肉眼根本看不出差別，
  // 用不著額外處理，也不會拖慢反應。只有修正距離超過這個門檻（例如：
  // 直接把 e 拖進一張圖片中間才放開、或視窗縮放讓圖片瞬間移動到 e 原本
  // 站的位置，讓它整個被嵌進圖片裡）才會啟動下面的平滑滑出效果，避免
  // 那種情況下整顆 e 瞬間傳送過去。
  const DVD_ESCAPE_MIN_DIST = 14;
  let dvdEscaping = false;
  let dvdEscapeFromX = 0, dvdEscapeFromY = 0, dvdEscapeToX = 0, dvdEscapeToY = 0;
  let dvdEscapeStartTime = 0, dvdEscapeDurationMs = 0;

  // AABB 對 AABB 的簡單彈跳判斷：用「重疊面積較淺的那個軸」當作碰撞發生的
  // 方向（撞到左右邊 vs 撞到上下邊），再用兩者中心點的相對位置決定要把
  // dvd 往哪邊推出去、哪個方向分量要翻轉。跟撞螢幕邊界共用同一套視覺/震動/
  // 衰減效果，只是牆壁換成圖片的實際邊緣。
  function resolveDvdObstacleCollision(o, timestamp){
    const dvdLeft = dvdX, dvdRight = dvdX + dvdW, dvdTop = dvdY, dvdBottom = dvdY + dvdH;
    const overlapX = Math.min(dvdRight, o.right) - Math.max(dvdLeft, o.left);
    const overlapY = Math.min(dvdBottom, o.bottom) - Math.max(dvdTop, o.top);
    if(overlapX <= 0 || overlapY <= 0) return false;

    const dvdCenterX = dvdX + dvdW / 2, dvdCenterY = dvdY + dvdH / 2;
    const oCenterX = (o.left + o.right) / 2, oCenterY = (o.top + o.bottom) / 2;

    // 方向一律馬上翻好（不等滑動效果跑完），這樣不管接下來是直接貼齊還是
    // 要跑滑出動畫，離開這個函式的當下方向就已經是正確的、之後的物理
    // 迴圈可以直接沿用，不用另外等狀態同步。
    let targetX = dvdX, targetY = dvdY;
    if(overlapX < overlapY){
      if(dvdCenterX < oCenterX){ targetX = o.left - dvdW; dvdDirX = -Math.abs(dvdDirX); }
      else{ targetX = o.right; dvdDirX = Math.abs(dvdDirX); }
    } else {
      if(dvdCenterY < oCenterY){ targetY = o.top - dvdH; dvdDirY = -Math.abs(dvdDirY); }
      else{ targetY = o.bottom; dvdDirY = Math.abs(dvdDirY); }
    }

    const dist = Math.hypot(targetX - dvdX, targetY - dvdY);
    if(dist <= DVD_ESCAPE_MIN_DIST){
      // 差距很小，維持原本「直接貼齊」，跟修正前的行為一樣、肉眼看不出差別
      dvdX = targetX; dvdY = targetY;
    } else {
      // 差距很大：不瞬間傳送，改成很快地滑過去。滑動的速度用「目前的移動
      // 速度（含甩出去當下的高速）再放大」來決定，不是寫死一個固定時間，
      // 這樣不管甩得多用力，滑出去的速度都至少跟得上、甚至略快於接下來
      // 要接手的正常速度，銜接處才不會有「先慢慢滑、放開後又忽然加速」
      // 這種不協調的落差感；同時夾在 60ms~260ms 之間，確保無論距離多近
      // 多遠，看起來都又快又順、不會拖泥帶水，也不會像瞬移一樣一格跳過去。
      const escapeSpeed = Math.max(dvdSpeed * 1.8, DVD_SPEED * 2);
      dvdEscapeDurationMs = Math.min(260, Math.max(60, (dist / escapeSpeed) * 1000));
      dvdEscapeFromX = dvdX; dvdEscapeFromY = dvdY;
      dvdEscapeToX = targetX; dvdEscapeToY = targetY;
      dvdEscapeStartTime = timestamp;
      dvdEscaping = true;
    }
    return true;
  }

  function setDvdDirection(angle){
    dvdDirX = Math.cos(angle);
    dvdDirY = Math.sin(angle);
    // 避免角度太接近純水平/純垂直，看起來會像卡在一條線上來回
    if(Math.abs(dvdDirX) < 0.25) dvdDirX = dvdDirX < 0 ? -0.25 : 0.25;
    if(Math.abs(dvdDirY) < 0.25) dvdDirY = dvdDirY < 0 ? -0.25 : 0.25;
    const len = Math.hypot(dvdDirX, dvdDirY);
    dvdDirX /= len; dvdDirY /= len;
  }

  function resetDvdBounce(){
    measureDvdSize();
    const minX = dvdBoundMinX(), minY = dvdBoundMinY();
    const maxX = Math.max(minX + 1, dvdBoundMaxX());
    const maxY = Math.max(minY + 1, dvdBoundMaxY());
    dvdX = minX + Math.random() * (maxX - minX);
    dvdY = minY + Math.random() * (maxY - minY);
    setDvdDirection(Math.random() * Math.PI * 2); // 隨機挑一個方向出發，360 度都有機會
    dvdSpeed = DVD_SPEED;
    dvdDecaying = false;
    dvdWasCollidedLastFrame = false;
    dvdWasScreenEdgeCollidedLastFrame = false;
    dvdEscaping = false;
    dvdBounce.style.transform = `translate(${dvdX}px, ${dvdY}px)`;
  }

  function stepDvdBounce(timestamp){
    // dvdDragging 在被指標（手指／滑鼠）抓著的時候會是 true——這種情況
    // 元素位置是直接被對應的 pointer 事件寫 transform 控制，物理迴圈本來
    // 就該整個暫停，抓住的當下已經取消過動畫影格，這裡多一層 guard 只是
    // 保險。放開的那一刻（dvdPointerUp）才會重新把 RAF 排回來。
    if(dvdDragging){
      dvdRAF = null;
      dvdLastTime = null;
      return;
    }

    if(dvdLastTime === null) dvdLastTime = timestamp;
    // 限制單幀最大時間差，避免分頁切到背景、幾秒後切回來時，元素瞬間跳一大段
    const dt = Math.min(48, timestamp - dvdLastTime) / 1000;
    dvdLastTime = timestamp;

    // 正在快速滑出障礙物（見 resolveDvdObstacleCollision 裡修正距離太大的
    // 分支）：這幾影格單純沿著滑出的軌跡跑到目標位置，不疊加下面一般的
    // 速度位移／撞牆判斷，避免兩套位移邏輯同時作用、互相打架。方向已經在
    // resolveDvdObstacleCollision 裡先翻好了、速度也完全沒被這段動過，
    // 滑完（progress 到 1）交還控制權給下面一般的物理迴圈時，會直接無縫
    // 接上原本要飛出去的方向和速度，不會有忽快忽慢的落差感。
    if(dvdEscaping){
      const progress = Math.min(1, (timestamp - dvdEscapeStartTime) / dvdEscapeDurationMs);
      const eased = 1 - Math.pow(1 - progress, 3); // easeOutCubic：起手快、收尾平滑，看起來像俐落地滑過去而不是硬煞車
      dvdX = dvdEscapeFromX + (dvdEscapeToX - dvdEscapeFromX) * eased;
      dvdY = dvdEscapeFromY + (dvdEscapeToY - dvdEscapeFromY) * eased;
      if(progress >= 1) dvdEscaping = false;
      dvdBounce.style.transform = `translate(${dvdX}px, ${dvdY}px)`;
      dvdRAF = requestAnimationFrame(stepDvdBounce);
      return;
    }

    // 甩出去的速度如果高於定速，放開的那一刻就直接開始「慢慢地」往定速衰減
    // （見 dvdPointerUp），不再等第一次撞牆才起算——撞牆才開始減速的話，
    // 高速維持的時間長短完全看運氣（丟到哪裡才撞到東西），現在放開就立刻
    // 起算，維持高速的時間反而更短、更可控。這裡用貼近真實摩擦力的指數
    // 衰減（先快後慢，越接近終速變化越平緩），取代原本等速切線的線性
    // 內插，過程更長也更細膩，不會有機械式的僵硬感。
    if(dvdDecaying){
      const progress = Math.min(1, (timestamp - dvdDecayStartTime) / dvdDecayDurationMs);
      const eased = 1 - Math.exp(-DVD_DECAY_EASE * progress);
      dvdSpeed = dvdDecayStartSpeed + (DVD_SPEED - dvdDecayStartSpeed) * eased;
      if(progress >= 1){ dvdSpeed = DVD_SPEED; dvdDecaying = false; }
    }

    const minX = dvdBoundMinX(), minY = dvdBoundMinY();
    const maxX = dvdBoundMaxX(), maxY = dvdBoundMaxY();

    // 視窗尺寸如果剛好在這個時間點縮小（例如手機網址列從收起變成重新展開、
    // 或者鎖住捲動之後瀏覽器介面重新排版——這在剛點進 preview 頁、body 被
    // 加上 overflow:hidden 的那一刻特別容易發生），邊界會在球本身完全沒有
    // 移動的情況下，憑空往內縮到球原本停留的位置外面。如果直接沿用下面
    // 「移動後檢查邊界」的邏輯，這一影格會被誤判成「球剛好撞到邊界」，
    // 觸發一次跟使用者操作、跟球的實際移動都完全無關的假撞牆，preview
    // 照片因此莫名其妙跳了一張——這正是「preview 頁剛點進去，偶爾沒有
    // 撞擊就會跳照片」的成因。這裡先判斷「這一影格移動之前」球是否已經
    // 落在新邊界外面：如果是，代表邊界是外部原因縮小的，不是球自己的
    // 速度移動撞上去的，這一影格只靜靜地把座標夾回邊界內，不觸發撞擊、
    // 不跳圖；真正由球自己這一影格的移動撞到邊界，才會進到下面正常的
    // 撞牆流程。
    if(dvdX < minX || dvdX > maxX || dvdY < minY || dvdY > maxY){
      dvdX = clampDvd(dvdX, minX, maxX);
      dvdY = clampDvd(dvdY, minY, maxY);
      // 不改動 dvdWasScreenEdgeCollidedLastFrame：維持它原本的值，球下一次
      // 真的用自己的移動撞上邊界時，判斷邏輯才不會被這次的靜默修正干擾。
      dvdBounce.style.transform = `translate(${dvdX}px, ${dvdY}px)`;
      dvdRAF = requestAnimationFrame(stepDvdBounce);
      return;
    }

    dvdX += dvdDirX * dvdSpeed * dt;
    dvdY += dvdDirY * dvdSpeed * dt;

    // 首頁捲動撥動效果：只在首頁格子畫面生效（preview／詳情頁沒有可以捲動
    // 經過的縮圖，也用不到）。applyGridScrollNudge() 只負責疊加風速
    // （dvdNudgeVY），不直接動位置；這裡接著把目前累積的風速換算成這一
    // 影格的位移量疊進去，並讓風速依 dt 做指數衰減——不管風力是不是這一
    // 影格才剛疊加的，套用到位置上的過程永遠是平滑曲線，不會有單一影格
    // 位移暴衝的撞擊感。刻意排在撞牆判斷之前——這樣風力帶來的位移如果
    // 剛好把 e 推出螢幕邊界，會自然被底下緊接著的撞牆／夾回邊界邏輯接住，
    // 不會露出邊界外。
    if(!previewPage.classList.contains('active') && !detailPage.classList.contains('active')){
      applyGridScrollNudge();
    }
    if(dvdNudgeVY !== 0){
      dvdY += dvdNudgeVY * dt;
      dvdNudgeVY *= Math.exp(-DVD_SCROLL_NUDGE_DECAY_PER_SEC * dt);
      if(Math.abs(dvdNudgeVY) < 0.5) dvdNudgeVY = 0; // 小到看不出差異時直接歸零收尾，不留無窮小的殘留值一直跑下去
    }

    // 撞到邊緣就反彈：把座標夾回邊界內、水平或垂直方向的分量直接翻轉方向
    let collided = false;
    let hitScreenEdge = false; // 上下左右四個螢幕邊界，撞到任何一個都算
    if(dvdX <= minX){ dvdX = minX; dvdDirX = Math.abs(dvdDirX); collided = true; hitScreenEdge = true; }
    else if(dvdX >= maxX){ dvdX = maxX; dvdDirX = -Math.abs(dvdDirX); collided = true; hitScreenEdge = true; }
    if(dvdY <= minY){ dvdY = minY; dvdDirY = Math.abs(dvdDirY); collided = true; hitScreenEdge = true; }
    else if(dvdY >= maxY){ dvdY = maxY; dvdDirY = -Math.abs(dvdDirY); collided = true; hitScreenEdge = true; }

    // 撞到螢幕邊界（上下左右四邊都算，不限定是哪一邊）的那一瞬間（邊緣觸發，
    // 不是每一影格貼著都觸發），觸發 preview 頁跳轉。
    //
    // 注意：.preview-left / .preview-right 在桌機和手機是「不同方向」的版面——
    // 桌機是左右並排（見 .preview-col 預設 CSS），手機（≤640px）則會透過
    // media query 改成上下堆疊（.preview-left 在上、.preview-right 在下，見
    // 上方 CSS 的 640px breakpoint）。原本這裡不分版面，一律只看撞擊當下的
    // 垂直位置落在螢幕上半還是下半來決定切左邊還是右邊的照片——這在手機的
    // 上下堆疊版面下是對的，但在桌機的左右並排版面下完全對不上：撞在畫面
    // 右側，只要那一瞬間垂直位置剛好落在螢幕上半，就會被誤判成「左側」，
    // 切到左邊的圖，這正是「明明撞右邊、卻是左邊圖片跳了」的成因。
    // 修法：判斷方向要跟著版面走——手機用垂直位置（上半/下半），桌機改用
    // 水平位置（左半/右半），跟 640px 這個 breakpoint 保持一致。
    if(hitScreenEdge && !dvdWasScreenEdgeCollidedLastFrame){
      const isStackedPreviewLayout = window.innerWidth <= 640; // 對齊 CSS 手機版 preview-col 改成上下堆疊的 breakpoint
      let side;
      if(isStackedPreviewLayout){
        const screenMidY = window.innerHeight / 2;
        const dvdCenterY = dvdY + dvdH / 2;
        side = dvdCenterY < screenMidY ? 'left' : 'right';
      } else {
        const screenMidX = window.innerWidth / 2;
        const dvdCenterX = dvdX + dvdW / 2;
        side = dvdCenterX < screenMidX ? 'left' : 'right';
      }
      handleDvdPreviewEdgeHit(side);
    }
    dvdWasScreenEdgeCollidedLastFrame = hitScreenEdge;

    // 再檢查跟頁面內圖片（首頁縮圖 / 詳情頁大圖）的碰撞，同一顆球，只是牆壁
    // 換成這些圖片的實際邊緣；同一影格理論上最多只會真的疊到一張圖，用 some
    // 找到第一個真的重疊的矩形即可，不需要每張都硬套一次。
    const obstacles = getObstacleRects();
    for(let i = 0; i < obstacles.length; i++){
      if(resolveDvdObstacleCollision(obstacles[i], timestamp)){ collided = true; break; }
    }

    // 只在「這一影格才剛撞上」時震動一次（見 dvdWasCollidedLastFrame 上面的說明），
    // 不是「只要正貼著邊界」就震——這樣元素卡在邊緣不動時不會連續狂震
    if(collided && !dvdWasCollidedLastFrame){
      triggerDvdEdgeVibration();
    }
    dvdWasCollidedLastFrame = collided;

    dvdBounce.style.transform = `translate(${dvdX}px, ${dvdY}px)`;
    dvdRAF = requestAnimationFrame(stepDvdBounce);
  }

  function startDvdBounce(){
    // 這裡不能只看 photoFallModeActive：從堆疊模式按 Preview 之後，飄動的 e
    // 有可能已經脫離物理世界、恢復成一般飄動狀態（見
    // resumeDvdFloatAfterPhotoFallCover()），這時 pfDvdItem 會是 null，
    // photoFallModeActive 卻仍然是 true（整段堆疊模式還沒真正結束，只是
    // 被 preview 蓋住）——這種情況不該被這裡擋下來。只有 e 真的還在物理
    // 世界裡（pfDvdItem 非 null）才需要讓物理迴圈自己接手，這裡先讓開。
    if(photoFallModeActive && pfDvdItem) return; // 物理堆疊模式期間（含結束後的重新啟動由 exitPhotoFallMode 自己呼叫），不要在這裡搶跑
    if(dvdRAF || dvdDragging) return; // 已經在跑了，或正被抓著（放開再接手）
    resetDvdBounce();
    dvdLastTime = null;
    dvdRAF = requestAnimationFrame(stepDvdBounce);
  }

  // ---------- 保底自癒機制 ----------
  // 上面已經修掉目前找得到、會讓動畫迴圈永久卡死的幾個成因（放開時速度
  // 沒有下限、pointerup 事件可能沒送達），但飄動字全站只有這一個實體、
  // 一旦卡住使用者會立刻察覺，值得再加一層保底：每隔一段時間檢查一次
  // 「現在不是正被抓著、但動畫迴圈卻沒在跑」這個不該發生的狀態，一旦
  // 發生就直接視同放開，走跟 dvdPointerUp() 一樣的「朝定速回穩」路徑
  // 重新接手，不需要使用者自己重新整理頁面才能恢復。跟只在特定事件
  // 發生時才觸發的修法不同，這一層完全不假設成因是什麼，任何未來還沒
  // 想到的邊界情況（例如瀏覽器本身某個事件沒有如預期觸發）都會在最多
  // 幾秒內被這裡自動偵測、自動修復。
  const DVD_WATCHDOG_INTERVAL_MS = 2000;
  setInterval(() => {
    // 理由同 startDvdBounce() 內的說明：只有 e 真的還在物理世界裡
    // （pfDvdItem 非 null）才代表迴圈本來就該是停的；e 若已經因為
    // resumeDvdFloatAfterPhotoFallCover() 脫離物理世界、恢復飄動，這裡就
    // 該正常運作，不能被 photoFallModeActive 這個「整段堆疊模式還沒結束」
    // 的旗標誤擋。
    if(photoFallModeActive && pfDvdItem) return; // 物理堆疊模式期間，飄動字的迴圈本來就該是停的，不要被保底機制誤判成卡死而重新啟動
    if(dvdDragging || dvdRAF) return; // 正常狀態：要嘛正被抓著、要嘛迴圈本來就在跑，什麼都不用做
    dvdSpeed = Math.max(dvdSpeed, 0);
    // ⚠️ 跟 dvdPointerUp() 同一套已確認規則，不要改：只有目前速度高於
    // 定速才需要朝定速衰減，低於（或等於）定速就直接照現有速度重新啟動
    // 迴圈，不強行拉回定速。
    if(dvdSpeed > DVD_SPEED){
      dvdDecaying = true;
      dvdDecayStartTime = performance.now();
      dvdDecayStartSpeed = dvdSpeed;
      dvdDecayDurationMs = DVD_DECAY_MS;
    } else {
      dvdDecaying = false;
    }
    dvdLastTime = null;
    dvdRAF = requestAnimationFrame(stepDvdBounce);
  }, DVD_WATCHDOG_INTERVAL_MS);

  // 視窗尺寸改變時（轉橫向、桌機拖曳視窗寬度）只重新量測尺寸、把目前位置
  // 夾回新的邊界內，不隨機換位置、不重新啟動——避免使用者感覺「畫面一動
  // 元素就跳掉」，這正是「切換頁面／改變視窗不會有任何震動」的關鍵。
  function clampDvdIntoViewport(){
    // 理由同上：只有 e 真的還在物理世界裡（pfDvdItem 非 null）時，transform
    // 才是由物理迴圈接管；已經脫離物理世界、恢復飄動的狀態下，視窗尺寸
    // 改變還是要正常夾回新的邊界內，不能被 photoFallModeActive 擋住。
    if(photoFallModeActive && pfDvdItem) return; // 物理堆疊模式期間，飄動字的 transform 改由物理迴圈接管，這裡不能插手覆寫
    measureDvdSize();
    dvdEscaping = false; // 視窗尺寸一變，舊的滑出目標位置可能已經不對，直接取消，改用下面重新夾回邊界的結果
    const minX = dvdBoundMinX(), minY = dvdBoundMinY();
    const maxX = Math.max(minX, dvdBoundMaxX());
    const maxY = Math.max(minY, dvdBoundMaxY());
    dvdX = clampDvd(dvdX, minX, maxX);
    dvdY = clampDvd(dvdY, minY, maxY);
    dvdBounce.style.transform = `translate(${dvdX}px, ${dvdY}px)`;
  }

  // ---------- 抓取／甩出去（手指、滑鼠共用同一套 Pointer Events，
  // 桌機不再需要長按才能抓，跟手機版一樣直接按著拖就能抓住） ----------
  function dvdPointerDown(e){
