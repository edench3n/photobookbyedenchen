name: Build e-manifest

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: '0 18 * * *'  # 每天 UTC 18:00（台北時間凌晨 2:00）

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run build-e-manifest.js
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: node scripts/build-e-manifest.js

      - name: Install canvas (needed by build-masks.js)
        run: npm install canvas

      - name: Run build-masks.js
        run: node scripts/build-masks.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add e-manifest.json e-images/ masks.json
          if git diff --cached --quiet; then
            echo "沒有變動，不 commit。"
          else
            git commit -m "chore: update e-manifest + masks (automated)"

            n=0
            until git push; do
              n=$((n+1))
              if [ "$n" -ge 5 ]; then
                echo "push 重試 5 次仍失敗，放棄。"
                exit 1
              fi
              echo "push 被拒絕（第 $n 次），同步遠端最新內容後重試..."
              git fetch origin main
              git rebase origin/main
              sleep $((RANDOM % 5 + 1))
            done
          fi
