name: Build e-manifest

# 手動觸發：去 GitHub repo 的 Actions 頁籤，選這個 workflow，按 Run workflow。
# 之後如果想要「Drive 資料夾一有新圖就自動更新」，可以把下面的
# schedule 區塊取消註解（例如每天跑一次），目前先維持純手動，
# 避免在圖片庫還沒穩定前就跑出一堆不必要的 commit。
on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: '0 18 * * *'  # 每天 UTC 18:00（台北時間凌晨 2:00）

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run build-e-manifest.js
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: node scripts/build-e-manifest.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add e-manifest.json e-images/
          if git diff --cached --quiet; then
            echo "沒有變動，不 commit。"
          else
            git commit -m "chore: update e-manifest (automated)"

            # push 前先跟遠端同步一次：如果 push 這段期間，main 被別的
            # 東西（例如網頁上手動編輯、或另一次執行）動過，直接 push
            # 會被拒絕（non-fast-forward）。這裡改成「push 失敗就先
            # pull --rebase 再重試」，最多試 5 次，兩次之間隨機等一下
            # （避免剛好又撞在一起）。這份 workflow 只會動
            # e-manifest.json／e-images/ 這兩個路徑，跟其他改動（例如
            # index.html）不會有實質內容衝突，rebase 基本上都能自動
            # 完成，不需要人工處理。
            n=0
            until git push; do
              n=$((n+1))
              if [ "$n" -ge 5 ]; then
                echo "push 重試 5 次仍失敗，放棄。"
                exit 1
              fi
              echo "push 被拒絕（第 $n 次），同步遠端最新內容後重試..."
              git fetch origin main
              git rebase origin/main
              sleep $((RANDOM % 5 + 1))
            done
          fi
