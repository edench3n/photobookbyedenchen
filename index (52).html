    el.addEventListener('click', () => {
      if(fsSuppressClick) return;
      fsScrollToOffset(off);
    });
    filmstripTrack.appendChild(el);
    const applyRatio = () => {
      if(img.naturalWidth && img.naturalHeight){
        rec.ratio = img.naturalWidth / img.naturalHeight;
        // 比例一確定就立刻套用正確尺寸，不用等拖曳/滾輪之類的下一次互動
        // 才觸發 renderFilmstripFrame()，避免縮圖先用預設框顯示、之後才
        // 忽然跳成正確形狀的閃動感。
        applyFilmstripTransform(rec, off - fsPos);
      }
    };
    if(img.complete && img.naturalWidth) applyRatio();
    else img.addEventListener('load', applyRatio, { once:true });
    return rec;
  }

  function applyFilmstripTransform(rec, d){
    const scale = fsScaleAt(d);
    const y = fsYAt(d);
    const ad = Math.abs(d);
    // 不做漸層淡出：範圍內完整不透明，超過 FS_VISIBLE_RADIUS 直接整張隱藏，
    // 跟參考圖一樣——最多同時只會看到 2*FS_VISIBLE_RADIUS+1 = 7 張，最上/
    // 最下那幾張是被容器邊緣裁掉一部分，而不是透明度漸漸變淡消失。
    const opacity = ad <= FS_VISIBLE_RADIUS + 0.5 ? 1 : 0;
    const size = fsFitSize(rec.ratio);
    rec.el.style.width = size.w.toFixed(2) + 'px';
    rec.el.style.height = size.h.toFixed(2) + 'px';
    rec.el.style.transform = `translate3d(-50%, calc(-50% + ${y.toFixed(2)}px), 0) scale(${scale.toFixed(4)})`;
    rec.el.style.opacity = opacity.toFixed(3);
    rec.el.style.zIndex = String(1000 - Math.round(ad * 10));
    rec.el.style.pointerEvents = opacity > 0.05 ? 'auto' : 'none';
  }

  function renderFilmstripFrame(){
    if(!fsReady || !photos.length) return;
    const n = photos.length;
    const centerOff = Math.round(fsPos);
    const lo = centerOff - FS_RENDER_RADIUS;
    const hi = centerOff + FS_RENDER_RADIUS;

    for(const [off, rec] of fsItemEls){
      if(off < lo || off > hi){
        rec.el.remove();
        fsItemEls.delete(off);
      }
    }
    for(let off = lo; off <= hi; off++){
      let rec = fsItemEls.get(off);
      if(!rec){
        rec = createFilmstripItem(photos[mod(off, n)], off);
        fsItemEls.set(off, rec);
      }
      applyFilmstripTransform(rec, off - fsPos);
    }
  }

  // 拿拉簾目前已經顯示、且圖片已經解碼完成的縮圖，當作左側大圖切換當下的
  // 「暖場」來源——比首頁網格縮圖更可靠命中（使用者可能根本沒把網格捲到
  // 那張照片），才能做到「不淡出、直接非常快速跟上」。
  function getFilmstripWarmImg(idx){
    for(const [off, rec] of fsItemEls){
      if(mod(off, photos.length) === idx && rec.img.complete && rec.img.naturalWidth){
        return rec.img;
      }
    }
    return null;
  }

  function fsSyncCurrentIndex(){
    if(!photos.length) return;
    const idx = mod(Math.round(fsPos), photos.length);
    if(idx === fsLastSyncedIndex) return;
    fsLastSyncedIndex = idx;
    currentIndex = idx;
    // 拉簾捲動中，fsPos 經過的每一個整數格都會呼叫到這裡——如果跟一般點擊
    // 切換照片一樣，每次都跑完整的 renderDetail()（量測版面＋建立新的
    // Image 去載入高畫質版本＋預抓左右鄰居），拉簾快速滑過去的那幾百毫秒內
    // 就會連續塞進好幾次這種重工作，主執行緒忙著算版面、發網路請求，
    // 沒有餘力畫下一幀，拉簾動畫本身反而卡頓、不再是單一連續的滑動——
    // 這正是使用者說「太卡」的主因，不是動畫曲線本身的問題。
    // 拆成兩段：輕量的 renderDetailLight()（文字、拿現成已解碼的縮圖暖場、
    // 定位）維持每一格都即時同步，滑到哪、左側大圖的號碼/標題/暖場縮圖就
    // 立刻跟到哪；真正吃資源的高畫質載入+預抓鄰居（renderDetailFull()）
    // 則 debounce 到索引真的停留一小段時間（代表使用者已經滑到這張、
    // 不是正飛快掠過）才觸發一次，讓拉簾滾動途中主執行緒隨時都是空的，
    // 一路保持連續、不掉幀的滑動。
    renderDetailLight();
    clearTimeout(fsDetailFullTimer);
    fsDetailFullTimer = setTimeout(renderDetailFull, FS_DETAIL_FULL_DELAY);
  }
  let fsDetailFullTimer = null;
  const FS_DETAIL_FULL_DELAY = 90;

  // 點擊某張縮圖／滾輪停止後吸附／拖曳放開後接續動量，三個入口共用同一個
  // 函式：单纯把目標設好、確保 RAF 在跑，剩下全部交給 fsTick 裡那顆彈簧。
  function fsScrollToOffset(off){
    fsTarget = off;
    startFsRAF();
  }

  function fsTick(t){
    if(!fsLastFrameT) fsLastFrameT = t;
    const dt = Math.min(0.048, Math.max(0.001, (t - fsLastFrameT) / 1000)); // 秒，夾在 1~48ms 之間避免分頁切走再切回時的巨大 dt 讓彈簧暴衝
    fsLastFrameT = t;

    if(fsDragging){
      // 位置在 mousemove 裡面就直接寫進 fsPos 了（1:1 跟手），這裡只需要重新渲染
    } else {
      fsPos = fsSmoothDamp(fsPos, fsTarget, fsVel, FS_SMOOTH_TIME, dt);
    }

    renderFilmstripFrame();
    fsSyncCurrentIndex();

    const settled = !fsDragging
      && Math.abs(fsPos - fsTarget) < FS_SETTLE_EPS
      && Math.abs(fsVel.v) < FS_SETTLE_EPS;

    if(fsDragging || !settled){
      fsRAFId = requestAnimationFrame(fsTick);
    } else {
      // 收尾對齊：把剩下那一點浮點誤差直接歸零，確保最終畫面精準停在
      // 整數格上，不會留下肉眼看不太出來、但邏輯上沒完全對齊的殘值。
      fsPos = fsTarget;
      fsVel.v = 0;
      renderFilmstripFrame();
      fsRAFId = null;
      fsLastFrameT = 0;
    }
  }
  function startFsRAF(){
    if(!fsRAFId) fsRAFId = requestAnimationFrame(fsTick);
  }

  let fsWheelIdleTimer = null;
  const FS_WHEEL_IDLE_MS = 100; // 滾輪停止多久之後視為「使用者結束這次滾動」，把目標吸附到最近整數格

  detailFilmstrip.addEventListener('wheel', (e) => {
    if(!fsReady) return;
    e.preventDefault();
    e.stopPropagation();
    // 直接推動「目標」本身，不是推動速度——不管滾輪事件觸發得多密集或
    // 多疏落、每次 deltaY 忽大忽小，後面追過去的永遠是同一顆彈簧算出的
    // 同一條平滑曲線，不會被滾輪自己的觸發節奏拆成階梯狀的忽快忽慢。
    fsTarget += e.deltaY * FS_WHEEL_TO_INDEX;
    startFsRAF();

    // 每次滾輪事件都重新起算閒置計時；連續滾動時計時器一直被延後，
    // 只有真正停下來才會觸發，屆時把目標吸附到最近整數格，彈簧自己
    // 用同一條曲線把最後一小段距離平滑補完，不需要另外切換任何邏輯。
    clearTimeout(fsWheelIdleTimer);
    fsWheelIdleTimer = setTimeout(() => {
      if(fsDragging) return; // 這段閒置期間如果使用者改成用拖曳操作，交給拖曳自己的流程處理
      fsTarget = Math.round(fsTarget);
    }, FS_WHEEL_IDLE_MS);
  }, { passive:false });

  detailFilmstrip.addEventListener('mousedown', (e) => {
    if(!fsReady || e.button !== 0) return;
    clearTimeout(fsWheelIdleTimer); // 開始拖曳，取消前一個滾輪閒置計時器，避免它晚一點跳出來搶著另外對齊一次
    fsDragging = true;
    fsSuppressClick = false;
    fsTarget = fsPos; // 目標先貼齊當下位置，拖曳全程由 mousemove 直接寫 fsPos，彈簧不會在旁邊拉扯
    fsVel.v = 0;
    fsDragStartY = e.clientY;
    fsDragStartPos = fsPos;
    fsLastMoveY = e.clientY;
    fsLastMoveT = performance.now();
    fsDragVelocitySample = 0;
    detailFilmstrip.style.cursor = 'grabbing';
    startFsRAF();
    e.preventDefault();
  });
  window.addEventListener('mousemove', (e) => {
    if(!fsDragging) return;
    const dy = e.clientY - fsDragStartY;
    if(Math.abs(dy) > 4) fsSuppressClick = true;
    const unit = fsH0 * 0.9;
    fsPos = fsDragStartPos - dy / unit;
    fsTarget = fsPos; // 拖曳全程讓目標跟著手指走，放開的瞬間彈簧才不會從舊目標往回拉扯

    const now = performance.now();
    const dt = now - fsLastMoveT;
    if(dt > 0){
      const stepDy = e.clientY - fsLastMoveY;
      fsDragVelocitySample = (-stepDy / unit) / dt * 1000; // 換算成「虛擬索引／秒」，跟彈簧的速度單位一致
    }
    fsLastMoveY = e.clientY;
    fsLastMoveT = now;
  });
  window.addEventListener('mouseup', () => {
    if(!fsDragging) return;
    fsDragging = false;
    detailFilmstrip.style.cursor = '';
    // 放開的瞬間，把剛剛拖曳量出的速度直接塞進彈簧目前的速度狀態，
    // 再把目標設成「用這個速度推算最可能停在哪一張整數格」——彈簧會
    // 帶著這個非零初速接著滑過去，跟拖曳當下的手感無縫銜接，不會有
    // 「先停一下、才重新啟動一段新動畫」的斷點。這跟滾輪停止、點擊
    // 縮圖用的是同一顆彈簧、同一套追蹤邏輯，三種操作方式因此有完全
    // 一致的加速／減速手感——這正是「非常成熟、統一」的動態做法。
    fsVel.v = fsDragVelocitySample;
    const predicted = Math.round(fsPos + fsVel.v * FS_SMOOTH_TIME);
    fsScrollToOffset(predicted);
    setTimeout(() => { fsSuppressClick = false; }, 50);
  });

  function positionDetailImage(naturalW, naturalH){
    const ratio = (naturalW && naturalH) ? naturalW / naturalH : 1;

    const isMobile = isDetailMobile();

    // clear the arrows / back button / bottom-right info on any viewport;
    // desktop keeps its original clearance, mobile gets a much tighter one
    // (just enough to clear the arrow buttons) so the photo can go near-max size
    const horizontalClearance = isMobile ? 130 : 220;
    const verticalClearance = isMobile ? 190 : 260;

    // 桌機／平板另外把右側拉簾（含跟大圖之間的間隙）扣掉，圖片才不會被拉簾蓋住，
    // 也不會整個置中橫跨到拉簾底下——大圖永遠只在「扣掉拉簾之後」的左側區域內置中。
    if(!isMobile) layoutFilmstripZone();
    // 拉簾右側現在多留了 fsTitleGap 給標題文字，左側也多了編號文字（見
    // .detail-number），大圖可用寬度要把這兩塊都扣掉，不然大圖會算得太寬，
    // 蓋到編號/標題文字。96 是「編號文字寬度＋跟拉簾之間的間距」的粗估值。
    const filmstripReserve = isMobile ? 0 : (getFilmstripZoneWidth() + fsTitleGap + 96);

    const availW = Math.max(120, window.innerWidth - horizontalClearance - filmstripReserve);
    const availH = Math.max(120, window.innerHeight - verticalClearance);

    let w = availW;
    let h = w / ratio;
    if(h > availH){
      h = availH;
      w = h * ratio;
    }

    detailImageWrap.style.width = w + 'px';
    detailImageWrap.style.height = h + 'px';

    const leftRegionWidth = isMobile ? window.innerWidth : (window.innerWidth - filmstripReserve);
    const left = (leftRegionWidth - w) / 2;
    const top = (window.innerHeight - h) / 2;

    detailImageWrap.style.left = left + 'px';
    detailImageWrap.style.top = top + 'px';

    if(!isMobile && fsReady) renderFilmstripFrame();
  }

  // renderDetail() 原本是一整塊：文字/暖場縮圖這種「便宜、純本地」的部分，
  // 跟高畫質載入＋decode＋預抓鄰居這種「貴、會摸網路」的部分焊在一起，
  // 每次呼叫都整包一起做。拉簾捲動時 fsSyncCurrentIndex() 會在index變動的
  // 當下呼叫到這裡，如果還是整包一起做，快速滑過好幾張照片就等於連續塞進
  // 好幾次「貴」的工作，主執行緒被卡住，拉簾動畫本身就跟著掉幀、變得卡頓。
  // 拆成 renderDetailLight()／renderDetailFull() 兩段，各自獨立呼叫；
  // renderDetail() 保留原本「兩段一起做」的行為給一般點擊/左右鍵切換用，
  // 行為完全不變。

  // ---- 便宜的一段：文字、版面定位、拿現成已解碼的縮圖先暖場 ----
  function renderDetailLight(){
    const photo = photos[currentIndex];
    detailLightPositioned = false; // 每次重新渲染都先歸零，下面真的用暖場縮圖定位成功才會設回 true

    detailNumber.textContent = pad3(currentIndex + 1);
    detailTitle.textContent = photo.title;
    syncDetailInfoAlignment(); // 標題長度不同，高度可能改變，重新算一次 top
    positionBackButton(); // 桌機版箭頭要貼齊 detail-title 左邊緣，標題文字內容換了，重新量一次位置

    // ---- 先用已經在畫面上、瀏覽器早就快取好的網格縮圖「暖場」----
    // 這是白屏拖很久的主要對策：與其整段時間都空白，先把網格那張已經解碼完成
    // 的縮圖（800px，使用者剛剛就是看著它點進來的）立刻放進大圖區顯示出來，
    // 讓畫面在點擊的瞬間就有內容；等下面真正的高畫質版本載入完成，再無縫換成
    // 那張圖。縮圖本身畫質不受影響——使用者最終看到的還是高畫質版本，這裡只是
    // 拿它來墊過渡的空窗期。
    //
    // 注意：這裡只有在「網格縮圖真的已經載入完成」（gridReady）時才會拿它
    // 暖場——這時候縮圖的寬高比就是這張照片真正的比例，用它定位容器完全準確，
    // 不會有任何跳動。手機版網格用原生 lazy-loading（見 renderGrid 裡
    // `if(supportsTouch) img.loading = 'lazy'`），左右切換切到的下一張很可能
    // 根本沒捲到過、縮圖還沒載入——這種「不知道真正比例」的情況，故意不再
    // 猜一個比例（不管是硬套正方形，還是拿上一張的比例頂著）來暫時顯示，
    // 因為不管猜的是什麼，只要跟真正的比例不同，之後修正時終究會跳動一次。
    // 既然要簡單、要求的是「直接跳轉」，就不猜、不墊、不用過場動畫校正，
    // 單純保留目前畫面（上一張照片，或空白），一路等到下面真正要顯示的
    // 這張照片本身載入＋解碼完成，用它真正的尺寸一次到位、直接跳出來。
    const gridItemImg = document.querySelector(`.grid-item[data-index="${currentIndex}"] img`);
    let warmImg = (gridItemImg && gridItemImg.complete && gridItemImg.naturalWidth && gridItemImg.naturalHeight)
      ? gridItemImg
      : null;
    // 首頁網格縮圖不一定已經捲到、載入過那張照片（尤其是拉簾滾輪快速滑過去
    // 很多張的情況），這時改抓拉簾自己顯示中的縮圖當暖場來源——使用者剛剛
    // 就是「看著它」捲過來的，幾乎一定已經解碼完成，這樣左側大圖才能真正
    // 做到「不淡出、直接非常快速跟上右邊拉簾」。
    if(!warmImg && fsReady){
      warmImg = getFilmstripWarmImg(currentIndex);
    }
    const gridReady = !!warmImg;

    if(gridReady){
      // 有暖場縮圖可以馬上顯示的情況下，wrap 全程保持「show」，不要 remove 再
      // add——這正是「白幕淡出淡入」的成因：只要 class 被 remove 一次，CSS 的
      // opacity transition 就會把 wrap 淡到 0（露出底下純白背景），再淡回 1，
      // 使用者看到的就是一閃白幕。既然已經有東西可以馬上顯示，就不需要這段
      // 淡出再淡入，直接讓 wrap 保持可見、只換 <img> 的內容即可。
      const ratio = warmImg.naturalWidth / warmImg.naturalHeight;
      lastNaturalW = ratio * 1000;
      lastNaturalH = 1000;
      positionDetailImage(lastNaturalW, lastNaturalH);
      detailLightPositioned = true;
      detailImage.src = warmImg.src;
      detailImageWrap.classList.add('show'); // 直接顯示，不經過淡出/淡入
    }
    // gridReady 為 false 時什麼都不做：保留目前畫面（不管是上一張照片還是
    // 空白），一路等到下面 renderDetailFull() 的 commit() 真正拿到這張照片
    // 的正確尺寸，才顯示出來。
  }

  // ---- 貴的一段：真正的高畫質版本載入＋decode＋預抓左右鄰居 ----
  function renderDetailFull(){
    const token = ++detailToken;
    const photo = photos[currentIndex];
    const loader = new Image();

    // commit 只在「真正的高畫質版本」完全解碼完成（不只是下載完，是連畫面
    // 像素都準備好）之後才把它換上 <img>——這樣瀏覽器可以一次到位地把新畫面
    // 畫出來，不會因為臨時解碼大圖而卡一格空白幀（那格空白幀疊在純白背景上，
    // 看起來就像「又閃了一下白幕」）。已經有暖場圖在顯示的情況下，這裡只換
    // src，完全不動 opacity/class，銜接是無縫的；沒有暖場圖的情況下，這裡
    // 就是這張照片第一次、也是唯一一次直接跳出來，尺寸從一開始就是對的。
    const commit = () => {
      if(token !== detailToken) return;
      lastNaturalW = loader.naturalWidth || 1;
      lastNaturalH = loader.naturalHeight || 1;
      const swap = () => {
        if(token !== detailToken) return;
        // 只有在還沒被暖場縮圖定位過的情況下才需要重新定位——已經定位過的話，
        // 這裡重新算一次只會帶來上面說明的那種細微跳動，沒有任何好處。
        if(!detailLightPositioned) positionDetailImage(lastNaturalW, lastNaturalH);
        detailImage.src = loader.src;
        detailImageWrap.classList.add('show');
      };
      if(loader.decode){
        loader.decode().then(swap).catch(swap);
      } else {
        swap();
      }
    };

    // 依序嘗試：detailUrlMobile（手機版專用的縮小版本，畫質在手機螢幕上跟
    // 2000px 沒有分別，但檔案小很多、下載快很多，桌機版沒有這個欄位，直接
    // 跳過）→ detailUrl（Google 圖片 CDN、2000px，又快畫質又好）→
    // fallbackUrl（同一個 CDN 但 1600px，備援）→ url（原始全尺寸檔案，走
    // drive.google.com/uc，最慢，留到真的都失敗才用）→ thumbUrl（保底）
    const sources = [photo.detailUrlMobile, photo.detailUrl, photo.fallbackUrl, photo.url, photo.thumbUrl].filter(Boolean);
    let srcIdx = 0;
    function tryNext(){
      if(srcIdx >= sources.length) return;
      loader.src = sources[srcIdx++];
    }
    loader.onload = commit;
    loader.onerror = tryNext;
    tryNext();

    // already cached — 'load' may not fire again, handle synchronously
    if(loader.complete && loader.naturalWidth){
      commit();
    }

    prefetchNeighbors(currentIndex);
  }

  function renderDetail(){
    renderDetailLight();
    renderDetailFull();
  }

  // 靜默預先下載鄰近的照片（左右各 2 張），這樣按下一張/上一張箭頭時
  // 圖片幾乎都已經在瀏覽器快取裡，可以立即無延遲切換
  const prefetchedUrls = new Set();
  function prefetchOne(url, lowPriority){
    if(!url || prefetchedUrls.has(url)) return;
    prefetchedUrls.add(url);
    const im = new Image();
    // lowPriority 只給「整個相簿慢慢背景預抓」這種完全不急、什麼時候載完
    // 都無所謂的情境用（見 prefetchAllInBackground）；detail 頁瀏覽時
    // 「馬上要用到」的鄰近照片預抓（prefetchNeighbors）維持原本優先度，
    // 不受影響。
    if(lowPriority){ try { im.fetchPriority = 'low'; } catch(e){} }
    im.src = url;
  }
  function prefetchNeighbors(index){
    const n = photos.length;
    if(!n) return;
    for(let d = 1; d <= 2; d++){
      const next = photos[(index + d) % n];
      const prev = photos[(index - d + n) % n];
      // 跟 renderDetail() 實際使用的來源順序保持一致（手機版優先用
      // detailUrlMobile 這個縮小版本），這樣預先下載的才是真的會用到的
      // 那個檔案，切換到鄰近照片時才能確實命中快取、直接跳轉。
      prefetchOne(next.detailUrlMobile || next.detailUrl || next.url);
      prefetchOne(prev.detailUrlMobile || prev.detailUrl || prev.url);
    }
  }

  // 從網格首頁點下去的那張縮圖，快速放大＋移動到照片頁左側大圖欄位——
  // 用一個「分身」<img> 直接掛在 body 下，把它從縮圖當下的螢幕座標，用
  // transform（translate+scale，GPU 合成、不觸發 reflow）動畫到大圖最終
  // 停放的座標，動畫曲線用 cubic-bezier(0.22,1,0.36,1)（類似 "ease-out
  // expo"：一開始快、後段迅速收斂到定點），配合前面拉簾/collab 淡入淡出，
  // 整體是同一個連續的轉場動作，不是分開的兩段動畫。
  function runGridToDetailTransition(originImgEl, index){
    const startRect = originImgEl.getBoundingClientRect();
    const startSrc = originImgEl.currentSrc || originImgEl.src;
    const photo = photos[index];

    // 先把「真正」的大圖容器直接定位到最終位置（此時還是隱藏的），
    // 這樣才能量到分身要飛過去的目標矩形；也讓等一下 renderDetail() 要用
    // 的尺寸／位置提早準備好，飛行動畫結束的瞬間可以無縫接手。
    positionDetailImage(originImgEl.naturalWidth || 1000, originImgEl.naturalHeight || 1000);
    const endRect = detailImageWrap.getBoundingClientRect();

    const clone = document.createElement('img');
    clone.className = 'detail-flip-clone';
    clone.alt = '';
    clone.src = startSrc;
    clone.style.width = startRect.width + 'px';
    clone.style.height = startRect.height + 'px';
    clone.style.transform = `translate(${startRect.left}px, ${startRect.top}px)`;
    document.body.appendChild(clone);

    // 分身一開始用的是網格縮圖（gridUrl，只有 400px 寬），飛行過程會被放大
    // 到接近大圖的尺寸，用這麼小的原始畫質硬撐，放大到後段會明顯模糊——
    // 這裡背景另外把高畫質版本（跟 renderDetailFull() 用的同一批來源）load
    // 起來，一準備好（下載完＋decode 完，確保真的有像素可以畫，不是臨時
    // 解碼卡一格）就換上 clone 的 src。畫面上看到的只是「解析度變高了」，
    // 分身當下的螢幕位置/大小完全不受影響（width/height 是寫死的 px，
    // 換一張像素數不同的來源不會觸發任何 reflow 或跳動）。飛行還沒開始
    // 播放前如果就已經換好（例如這張圖剛好被背景預抓過、瀏覽器已有快取），
    // 使用者甚至會全程只看到清晰的畫質，感覺不到有「切換」這件事。
    let cloneAlive = true;
    if(photo){
      const hiResSrc = photo.detailUrlMobile || photo.detailUrl || photo.fallbackUrl || photo.url;
      if(hiResSrc && hiResSrc !== startSrc){
        const hiResLoader = new Image();
        try { hiResLoader.fetchPriority = 'high'; } catch(e){}
        const applyHiRes = () => {
          if(!cloneAlive) return;
          clone.src = hiResSrc;
        };
        hiResLoader.onload = () => {
          if(hiResLoader.decode){ hiResLoader.decode().then(applyHiRes).catch(applyHiRes); }
          else { applyHiRes(); }
        };
        hiResLoader.src = hiResSrc;
        // already cached：跟 renderDetailFull() 裡同樣的保底判斷，避免快取
        // 命中時 onload 不會再觸發、白白錯過提早換上高畫質的機會。
        if(hiResLoader.complete && hiResLoader.naturalWidth) hiResLoader.onload();
      }
    }

    // 大圖容器本身先隱藏，等分身飛到終點的那一刻再瞬間切換過去，
    // 避免飛行途中同時看到兩張疊在一起的照片。
    detailImageWrap.style.transition = 'none';
    detailImageWrap.style.opacity = '0';
    renderDetail(); // 背景先把真正要顯示的內容（暖場縮圖／高畫質）準備好

    const scaleX = endRect.width / startRect.width;
    const scaleY = endRect.height / startRect.height;
    const DURATION = 460;

    void clone.offsetWidth; // 強制 reflow，確保下面設定的初始 transform 已經套用，接著才切換 transition
    clone.style.transition = `transform ${DURATION}ms cubic-bezier(0.22,1,0.36,1)`;
    requestAnimationFrame(() => {
      clone.style.transform = `translate(${endRect.left}px, ${endRect.top}px) scale(${scaleX}, ${scaleY})`;
    });

    // 拉簾／collab 的淡入淡出跟飛行動畫同時開始，是同一個轉場的一部分。
    requestAnimationFrame(() => {
      renderFilmstripFrame();
      detailFilmstrip.classList.add('ready');
    });

    let done = false;
    const finish = () => {
      if(done) return;
      done = true;
      detailImageWrap.style.transition = 'none';
      detailImageWrap.style.opacity = '1';
      void detailImageWrap.offsetWidth;
      detailImageWrap.style.transition = '';
      cloneAlive = false;
      clone.remove();
    };
    clone.addEventListener('transitionend', finish, { once:true });
    setTimeout(finish, DURATION + 120); // 保底：極端情況下 transitionend 沒觸發也不會卡住
  }

  function openDetail(index, originImgEl){
    currentIndex = index;
    hideHoverPreview();
    const isMobile = isDetailMobile();

    detailPage.classList.add('active');
    document.body.classList.add('detail-active'); // 點進照片後把首頁時鐘、桌機／平板版的 Collab 區塊都藏起來
    document.body.style.overflow = 'hidden';
    syncFixedChrome();

    if(!isMobile){
      fsPos = index;
      fsTarget = index;
      fsVel.v = 0;
      fsLastSyncedIndex = index;
      filmstripTrack.innerHTML = '';
      fsItemEls.clear();
      layoutFilmstripZone();
      fsReady = true;
      detailFilmstrip.classList.remove('ready');
    } else {
      fsReady = false;
    }

    const canFlip = !isMobile && originImgEl && originImgEl.tagName === 'IMG'
      && originImgEl.complete && originImgEl.naturalWidth;

    if(canFlip){
      runGridToDetailTransition(originImgEl, index);
    } else {
      renderDetail();
      if(!isMobile){
        renderFilmstripFrame();
        requestAnimationFrame(() => detailFilmstrip.classList.add('ready'));
      }
    }
  }

  function closeDetail(){
    detailPage.classList.remove('active');
    document.body.classList.remove('detail-active'); // 回到首頁，時鐘、Collab 區塊都恢復顯示
    detailImageWrap.classList.remove('show'); // 立刻清空，避免下次打開時先閃一下舊照片
    detailImageWrap.style.opacity = '';
    detailImageWrap.style.transition = '';
    document.body.style.overflow = '';

    if(fsRAFId){ cancelAnimationFrame(fsRAFId); fsRAFId = null; }
    clearTimeout(fsWheelIdleTimer);
    clearTimeout(fsDetailFullTimer);
    fsVel.v = 0;
    fsDragging = false;
    fsReady = false;
    fsLastFrameT = 0;
    detailFilmstrip.classList.remove('ready');
    filmstripTrack.innerHTML = '';
    fsItemEls.clear();
  }

  /* =========================================================
     PREVIEW PAGE：左右交錯全版跳轉
  ========================================================= */

  // 在等待期間先把「下一張」的圖片載入 + 解碼好（不只是下載，是連畫面像素都準備好），
  // 這樣真正切換的那一刻只是換一個已經解碼完成的 src，瀏覽器可以直接上屏，
  // 不會因為臨時解碼大圖而卡頓、看起來像是有轉場。
  //
  // 這裡同時修正黑屏問題：photo.url 是 Google Drive 的 uc?export=view 連結，
  // 在某些情況下（例如檔案較大時 Google 會回傳「無法掃描病毒」的中介頁面，
  // 而不是圖片本身）會直接載入失敗；原本失敗後沒有任何備援，img 就一直是空的，
  // 底下 .preview-col 的黑色背景就會整片露出來。現在依序嘗試
  // 原始大圖 → 高解析度縮圖(fallbackUrl) → 一般縮圖(thumbUrl)，
  // 只要任何一個能載入成功就使用它。
  function loadWithFallback(photo){
    return new Promise((resolve) => {
      const candidates = [photo && photo.previewUrl, photo && photo.detailUrl, photo && photo.fallbackUrl, photo && photo.url, photo && photo.thumbUrl].filter(Boolean);
      if(!candidates.length){ resolve(''); return; }

      let i = 0;
      const img = new Image();
      // preview 頁要顯示的圖片，永遠是使用者「馬上就會看到」的內容
      // （不管是剛進站的第一畫面，還是撞牆跳轉後的下一張），明確標成高優先度，
      // 讓瀏覽器把連線/頻寬優先讓給它，不要跟同時間背景在跑的其他預抓
      // （首頁網格、hover 大圖預抓等）平均分掉。畫質完全不受影響——
      // candidates 清單、選用的檔案大小都跟原本一模一樣，這裡只調整
      // 下載的「優先順序」，不是換成更小的檔案。
      try { img.fetchPriority = 'high'; } catch(e){}

      function finish(url){
        if(img.decode){
          img.decode().then(() => resolve(url)).catch(() => resolve(url));
        } else {
          resolve(url);
        }
      }

      function tryNext(){
        if(i >= candidates.length){ resolve(''); return; }
        const url = candidates[i++];
        img.onload = () => finish(url);
        img.onerror = tryNext;
        img.src = url;
      }

      tryNext();
    });
  }

  // ---- 序列與起始張：
  // 右側＝單數編號（001, 003, 005...），從最前面第一張開始，往後遞增播放
  // 左側＝雙數編號（002, 004, 006...），從最後一張開始，往前遞減播放
  // 這樣左右像是「從兩端往中間跑」，方向剛好相反、不會混在一起
  let previewOddPhotos = [];   // 右側序列
  let previewEvenPhotos = [];  // 左側序列
  let previewLeftIdx = 0;
  let previewRightIdx = 0;
  let previewActive = false;
  const previewResolvedLeft = [];
  const previewResolvedRight = [];
  // 跟 previewResolvedLeft/Right（存 Promise）分開，另外放一份「已經 resolve
  // 完成的網址」，讓 applyPreviewSide 可以同步（不用 await）判斷某一張圖是不是
  // 已經真的準備好了。這是修好「有時候不按照 0.5 秒節奏跳轉、最後整個停住
  // 不動」這個 bug 的關鍵：原本不管暖機好了沒，每一步都無條件重新 await 一次
  // Promise 才能知道結果，如果那一步剛好排到還沒暖機完成的圖，畫面就會呆呆
  // 卡在原地什麼都不做，等到那次 await 真的完成、而且完成時「剛好」還沒被
  // 下一步蓋過去，才會更新——網路稍慢，這個條件很容易一直不成立，看起來就是
  // 「跳轉忽快忽慢，最後乾脆卡住不動」。有了這份同步 cache，就能一開始就
  // 知道要不要直接用高畫質、還是得先墊縮圖，不用每一步都乾等。
  const previewReadyLeft = [];
  const previewReadyRight = [];

  function resolvePreviewImage(photo, cache, readyCache, idx){
    if(cache[idx]) return cache[idx];
    const p = loadWithFallback(photo).then((url) => {
      readyCache[idx] = url; // 用字串（哪怕是空字串）標記「已經有結果了」，跟 undefined（還沒好）區分開來
      return url;
    });
    cache[idx] = p;
    return p;
  }

  // 縮圖版本（gridUrl/thumbUrl）另外先請瀏覽器下載一次暖機，不特別追蹤
  // Promise——只是想讓瀏覽器的 HTTP 快取先有這份資料，之後 applyPreviewSide
  // 裡真的要顯示縮圖時，新建的 Image() 走的是同一個網址，會直接命中快取
  // 瞬間載完，不用臨場現扛一次網路下載。這是修掉「剛點進 preview 頁還是會
  // 白一下」的關鍵：原本只有暖機高畫質版本，縮圖墊場圖完全沒被提前暖機過，
  // 使用者點進來的那一刻，連縮圖都要現下載。
  function warmPreviewPlaceholder(photo){
    // 墊場縮圖優先用 thumbUrl（800px），只有在極少數 thumbUrl 缺失的情況下才
    // 退回 gridUrl（400px，首頁網格縮圖用，preview 頁的畫面遠比網格格子大，
    // 400px 拉滿半個螢幕會偏糊）。這樣不管是撞太快之外的「一般等待墊場」，
    // 看到的畫面也會比較清楚，不會在切換高畫質版本前先糊一下。
    const url = (photo && (photo.thumbUrl || photo.gridUrl)) || '';
    if(url){
      const im = new Image();
      try { im.fetchPriority = 'high'; } catch(e){} // 這張墊場圖也是使用者馬上會看到的東西，同樣不該被其他背景預抓卡住
      im.src = url;
    }
  }

  // 極小備援圖（tinyUrl）另外暖機一次，專門給撞擊太快/連續撞擊時使用——
  // 跟縮圖墊場的暖機邏輯一樣，提前請瀏覽器把它快取好，真正要用的那一刻
  // 才能「同步」瞬間顯示，不用臨場等網路。
  function warmPreviewTiny(photo){
    const url = (photo && photo.tinyUrl) || '';
    if(url){ const im = new Image(); im.src = url; }
  }

  // 把當前這一側該顯示的那張圖，重新（提早）暖機一次：
  // 先觸發載入 + decode，讓瀏覽器準備好像素，之後真正要顯示時幾乎是瞬間的
  //
  // 注意：這裡故意「不」清空 previewResolvedLeft / previewResolvedRight 快取。
  // 每次點進 preview 頁面的起始索引永遠是同一組固定值（左：最後一張／右：
  // 第一張），如果每次都把快取清空重來，等於把 preparePreviewSequences() 在
  // 網頁一開始就先做好的預熱結果整個丟掉，使用者點進來時又要重新等一次載入，
  // 這正是「剛點進去偶爾全黑」的原因。保留快取，resolvePreviewImage() 內建的
  // `if(cache[idx]) return cache[idx];` 判斷就會直接沿用已經載入好（或正在
  // 載入中）的同一個 promise，不會重複下載、也不會重新等待。
  // WARM_AHEAD_COUNT：除了起始那一張，額外預先暖機幾步之後會用到的圖片。
  // 原本只多暖 1 步，使用者如果一進 preview 頁就手速很快地連續跳好幾張
  // （或者剛進首頁沒多久、圖片都還在陸續下載中就馬上點進 preview），
  // 暖機進度很容易被追過，跳到還沒載好的那張又變成一次白幕/黑幕。
  // 多暖 2 步（等於隨時保留 3 張的下載/解碼緩衝）在幾乎不增加多少流量的
  // 前提下，能大幅降低這種「連續切換太快、暖機追不上」的機率。
  const WARM_AHEAD_COUNT = 2;

  function warmPreviewStart(){
    // 起始張不再固定（原本左邊永遠是最後一張、右邊永遠是第一張），改成
    // 每次都在各自那一側的序列裡隨機挑一張當起點——單號／雙號分兩邊的
    // 規則完全不受影響（previewEvenPhotos / previewOddPhotos 這兩個序列
    // 本身怎麼切分，這裡沒有動），只是「從哪一張開始跑」隨機。這個函式
    // 除了頁面第一次載入會呼叫一次，使用者每次重新進入 preview 頁
    // （openPreviewPage）也都會呼叫一次，所以「重新整理」跟「每次點進
    // preview 頁」都會拿到新的隨機起點。
    previewLeftIdx = previewEvenPhotos.length ? Math.floor(Math.random() * previewEvenPhotos.length) : 0;
    previewRightIdx = previewOddPhotos.length ? Math.floor(Math.random() * previewOddPhotos.length) : 0;
    if(previewEvenPhotos.length){
      warmPreviewPlaceholder(previewEvenPhotos[previewLeftIdx]);
      resolvePreviewImage(previewEvenPhotos[previewLeftIdx], previewResolvedLeft, previewReadyLeft, previewLeftIdx);
    }
    if(previewOddPhotos.length){
      warmPreviewPlaceholder(previewOddPhotos[previewRightIdx]);
      resolvePreviewImage(previewOddPhotos[previewRightIdx], previewResolvedRight, previewReadyRight, previewRightIdx);
    }

    // 同時把「進頁面後接下來幾次切換」會用到的圖片也先預熱。原本只暖機起始
    // 畫面，下一張要等真正切換到那一刻（stepPreviewSide 觸發時）才開始下載
    // ——如果那時候使用者剛好進頁面沒多久、圖片還在載入中，第一輪的切換就會
    // 等圖片載完才真正換畫面，使得開頭幾次切換的間隔時間長短不一（不規則
    // 跳動），要等這個「提前幾步」的暖機追上進度後才會穩定成固定的 0.5 秒
    // 節奏。這裡提前暖機，讓它從使用者一點進頁面（甚至更早，
    // preparePreviewSequences 在照片清單一到手就會呼叫這個函式）就開始
    // 下載，通常會有遠超過 0.5 秒的提前量，等真正切換到它時多半早就已經
    // 載完。
    for(let step = 1; step <= WARM_AHEAD_COUNT; step++){
      if(previewEvenPhotos.length > 1){
        const nextLeftIdx = (previewLeftIdx - step + previewEvenPhotos.length * 2) % previewEvenPhotos.length;
        warmPreviewPlaceholder(previewEvenPhotos[nextLeftIdx]);
        resolvePreviewImage(previewEvenPhotos[nextLeftIdx], previewResolvedLeft, previewReadyLeft, nextLeftIdx);
      }
      if(previewOddPhotos.length > 1){
        const nextRightIdx = (previewRightIdx + step) % previewOddPhotos.length;
        warmPreviewPlaceholder(previewOddPhotos[nextRightIdx]);
        resolvePreviewImage(previewOddPhotos[nextRightIdx], previewResolvedRight, previewReadyRight, nextRightIdx);
      }
    }
  }

  // 照片清單一到手就準備好 preview 用的兩組序列，並且立刻開始暖機第一張，
  // 這樣不管使用者何時點下 preview，兩張起始畫面大機率早就載入/解碼完成，
  // 點進去馬上就能看到照片，不會有黑屏的空檔
  function preparePreviewSequences(){
    previewOddPhotos = photos.filter((_, i) => i % 2 === 0);
    previewEvenPhotos = photos.filter((_, i) => i % 2 === 1);
    // 真正「馬上」要用到的，只有起始畫面 + 前面幾步（warmPreviewStart 裡的
    // WARM_AHEAD_COUNT），這裡先同步暖機好，維持原本「點進去/自動開啟
    // preview 馬上就能看到照片」的保證。
    warmPreviewStart();
    // 剩下「兩條序列全部照片」的極小圖（320px），是給撞牆跳轉「撞太快/
    // 連續撞擊」這種次要情境用的保險，不是進站當下就要用的東西。原本這裡
    // 用 forEach 一次性把全部照片的極小圖請求同時發出去，等於是拿這種次要
    // 用途的請求，去跟首頁網格第一畫面的縮圖、preview 起始畫面搶手機有限
    // 的頻寬/連線數——這正是「首頁小圖跑出來變慢、一開始整個全白幕」的
    // 主因之一。改成用 requestIdleCallback 分批、慢慢補齊：等瀏覽器真的
    // 閒下來（代表首屏真正需要的資源都已經發送出去了）才繼續暖下一張，
    // 不影響它原本「隨時能墊上」的保險功能，只是不再搶第一時間的頻寬。
    const allForTiny = previewEvenPhotos.concat(previewOddPhotos);
    let tinyStep = 0;
    function warmTinyStep(){
      if(tinyStep >= allForTiny.length) return;
      warmPreviewTiny(allForTiny[tinyStep]);
      tinyStep++;
      if('requestIdleCallback' in window){
        requestIdleCallback(warmTinyStep, { timeout: 1000 });
      } else {
        setTimeout(warmTinyStep, 80);
      }
    }
    warmTinyStep();
  }

  // ---------- preview 頁「起始那一刻」左右兩張同時出現 ----------
  // 跟上面 applyPreviewSide 的邏輯很像（一樣是先看 readyCache、沒有的話墊縮圖、
  // 縮圖也沒有才等高畫質），差別是這裡「不」直接把結果賦值給 <img>，而是回傳
  // 一個 Promise<url>，讓呼叫端可以用 Promise.all 等左右兩側都準備好同一個
  // 層級（例如都至少有縮圖可用）之後，再同一刻一起賦值——這樣就不會發生「反正
  // 都還沒完全載好，其中一側先跳出來、另一側還維持白幕好一陣子」這種不同步
  // 的狀況：既然兩邊在載入完成前終究都會有一段白幕，不如讓白幕結束的那一刻
  // 兩邊一起結束，觀感上乾脆俐落很多。
  // 只用在「使用者剛進 preview 頁、兩側都還沒有任何畫面」這個起始情境；
  // 之後靠飄動的 e 撞牆觸發的單側切換（stepPreviewSide／applyPreviewSide）
  // 維持原本各自獨立更新，不受影響——那本來就是兩個各自獨立的事件，沒有
  // 「同時出現」的預期。
  function startPreviewSide(side){
    const seq = side === 'left' ? previewEvenPhotos : previewOddPhotos;
    const cache = side === 'left' ? previewResolvedLeft : previewResolvedRight;
    const readyCache = side === 'left' ? previewReadyLeft : previewReadyRight;
    if(!seq.length) return Promise.resolve('');
    const idx = side === 'left' ? previewLeftIdx : previewRightIdx;
    const photo = seq[idx];

    // 高畫質版本已經暖機完成，直接回傳，畫質不受任何影響
    if(typeof readyCache[idx] === 'string'){
      return Promise.resolve(readyCache[idx] || '');
    }

    // 不管縮圖墊場成不成功，高畫質版本都要在背景繼續請求；這裡回傳的只是
    // 一個「resolve 成 url」的 promise，不在這裡附加賦值副作用（img.src 交給
    // 呼叫端的 Promise.all 統一處理，確保起始畫面兩側同時出現）。這個 promise
    // 本身會被 resolvePreviewImage() 快取住，起始畫面亮相之後
    // upgradePreviewSideToHighRes() 會重新取用同一個快取，把縮圖換成真正的
    // 高畫質版本。
    const highResPromise = resolvePreviewImage(photo, cache, readyCache, idx);

    const placeholderUrl = (photo && (photo.thumbUrl || photo.gridUrl)) || '';
    if(!placeholderUrl) return highResPromise; // 沒有縮圖可墊，只能直接等高畫質

    return new Promise((resolve) => {
      const thumb = new Image();
      try { thumb.fetchPriority = 'high'; } catch(e){}
      thumb.onload = () => {
        if(thumb.decode){
          thumb.decode().then(() => resolve(placeholderUrl)).catch(() => resolve(placeholderUrl));
        } else {
          resolve(placeholderUrl);
        }
      };
      thumb.onerror = () => resolve(''); // 縮圖失敗：這一側先不賦值，交給起始畫面同步亮相之後的 upgradePreviewSideToHighRes 接手補上高畫質版本
      thumb.src = placeholderUrl;
    });
  }

  async function applyPreviewSide(side, forceTiny){
    const seq = side === 'left' ? previewEvenPhotos : previewOddPhotos;
    const cache = side === 'left' ? previewResolvedLeft : previewResolvedRight;
    const readyCache = side === 'left' ? previewReadyLeft : previewReadyRight;
    const imgEl = side === 'left' ? previewLeftImg : previewRightImg;
    if(!seq.length) return;
    const idx = side === 'left' ? previewLeftIdx : previewRightIdx;
    const photo = seq[idx];
    const isStillCurrent = () => previewActive && (side === 'left' ? previewLeftIdx : previewRightIdx) === idx;

    // 撞太快／連續撞擊：不要再走下面等縮圖/高畫質的流程（那些流程哪怕已經
    // 暖機過，也還是要等一次 decode 或 Promise resolve，連續撞擊時排隊排
    // 不完，看起來就是圖片一直跑不出來）。這裡改成直接同步賦值成已經整條
    // 序列都提前暖機過的極小圖，瀏覽器幾乎是瞬間就能畫出來，保證每一次撞
    // 都「馬上」看得到東西。高畫質版本還是在背景繼續請求、暖機起來，等
    // 撞擊速度緩下來、之後又切回附近張次時就能直接用上。
    if(forceTiny){
      // 已經暖機好的話，直接一次到位用高畫質，不需要繞去小圖再升級一輪，
      // 維持原本「有暖機就不閃過縮圖」的品質；只有真的還沒暖機完成，才退
      // 而求其次墊一張小圖。
      if(typeof readyCache[idx] === 'string'){
        if(readyCache[idx] && isStillCurrent()) imgEl.src = readyCache[idx];
        return;
      }
      // 墊場圖畫質分兩層：優先試 thumbUrl（800px）——這張圖在正常情況下早就
      // 被 warmPreviewPlaceholder（起始張 + WARM_AHEAD_COUNT 提前兩步）預先
      // 請瀏覽器下載過，用「設定 src 後立刻檢查 complete/naturalWidth」這個
      // 常見手法可以同步判斷瀏覽器是不是已經有這份快取——如果有，直接拿來用，
      // 完全不會比原本的極小圖慢，但畫質好上一大截；只有連 thumbUrl 都還沒
      // 被快取到的少數情況（例如撞擊速度快到追過了兩步的暖機進度），才退回
      // 用背景全部預先暖機過、保證一定已經快取好的極小圖 tinyUrl（320px），
      // 確保「這一撞畫面一定馬上有反應」這個保證不會被打破。
      const thumbCandidate = photo && photo.thumbUrl;
      let placeholder = null;
      if(thumbCandidate){
        const probe = new Image();
        probe.src = thumbCandidate;
        if(probe.complete && probe.naturalWidth > 0) placeholder = thumbCandidate;
      }
      if(!placeholder) placeholder = photo && photo.tinyUrl;
      if(placeholder && isStillCurrent()) imgEl.src = placeholder;
      resolvePreviewImage(photo, cache, readyCache, idx).then((url) => {
        if(url && isStillCurrent()) imgEl.src = url;
      });
      return;
    }

    // 真正的舊 bug 不是「還沒修過縮圖墊場」，而是這個函式以前不管暖機好了沒，
    // 每一步都無條件重新 `await resolvePreviewImage(...)` 一次才知道結果：
    // 90% 的情況下（WARM_AHEAD_COUNT 早就提前暖機好了）這個 await 幾乎瞬間
    // resolve，看起來沒問題；但只要有一步剛好排到「還沒暖機完成」的圖（網路
    // 忽然變慢、或使用者連續切太快追過暖機進度），這一步就會乾等，畫面完全
    // 不動，等 await 真的完成時，往往下一個 0.5 秒的排程又已經把 idx 推進了，
    // `stillCurrent` 判斷失敗、這次更新直接被丟掉——於是這一步「什麼都沒發生
    // 過」，看起來就是跳轉的節奏忽快忽慢；如果網路一直沒追上，之後每一步都會
    // 被同樣的方式丟掉，最終畫面就完全停住不再更新。
    //
    // 修法：先同步（不 await）查 previewReadyLeft/Right 這份 cache，看這張
    // 照片的高畫質版本是不是已經暖機完成——多數情況下答案是「是」，這時直接
    // 一次到位換上高畫質，跟原本一樣完全不會閃過縮圖。只有真的還沒暖機完成
    // 的少數情況，才退而求其次：先墊上（已經在 warmPreviewStart /
    // warmPreviewPlaceholder 裡提前暖機過、幾乎瞬間就能載完的）縮圖，確保
    // 這一步「一定」會讓畫面換成新照片、維持住固定節奏，不會呆呆卡住等高
    // 畫質版本；等高畫質版本真的完成再無縫換上清晰版本。
    if(typeof readyCache[idx] === 'string'){
      if(readyCache[idx] && isStillCurrent()) imgEl.src = readyCache[idx];
      return;
    }

    const placeholderUrl = (photo && (photo.thumbUrl || photo.gridUrl)) || '';
    if(placeholderUrl){
      // 用一顆看不見的 Image() 載入＋decode()，確定「連畫面像素都準備好」
      // 之後才賦值給真正顯示用的 <img>，這樣縮圖出現的那一刻永遠是完整的
      // 一整張，不會有「上半段先出現、下半段還是黑的」這種半成品畫面。
      // 因為 warmPreviewPlaceholder 已經提前請瀏覽器把這個網址快取好，這裡
      // 多半是直接命中快取、幾乎瞬間完成，不會拖累節奏。
      await new Promise((resolve) => {
        const thumb = new Image();
        thumb.onload = () => {
          if(thumb.decode){
            thumb.decode().then(resolve).catch(resolve);
          } else {
            resolve();
          }
        };
        thumb.onerror = resolve; // 縮圖失敗就跳過，直接留給下面的高畫質版本處理
        thumb.src = placeholderUrl;
      });
      // decode 這段等待期間，使用者可能已經很快切到別張、或直接關掉 preview
      // 頁，這裡要重新確認一次「現在真的還是要顯示這張」才賦值，避免把已經
      // 過期的縮圖畫面蓋到更新的畫面上
      if(!isStillCurrent()) return;
      imgEl.src = placeholderUrl;
    }

    const url = await resolvePreviewImage(photo, cache, readyCache, idx);
    if(!isStillCurrent()) return;
    if(url) imgEl.src = url;
  }

  function stepPreviewSide(side, forceTiny){
    if(side === 'left'){
      if(!previewEvenPhotos.length) return;
      previewLeftIdx = (previewLeftIdx - 1 + previewEvenPhotos.length) % previewEvenPhotos.length; // 左側往前遞減
    } else {
      if(!previewOddPhotos.length) return;
      previewRightIdx = (previewRightIdx + 1) % previewOddPhotos.length; // 右側往後遞增
    }
    // 順便預先暖機下一輪那一側會用到的圖片
    const nextSeq = side === 'left' ? previewEvenPhotos : previewOddPhotos;
    const nextCache = side === 'left' ? previewResolvedLeft : previewResolvedRight;
    const nextIdx = side === 'left'
      ? (previewLeftIdx - 1 + previewEvenPhotos.length) % previewEvenPhotos.length
      : (previewRightIdx + 1) % previewOddPhotos.length;
    const nextReadyCache = side === 'left' ? previewReadyLeft : previewReadyRight;
    if(nextSeq.length){
      warmPreviewPlaceholder(nextSeq[nextIdx]);
      resolvePreviewImage(nextSeq[nextIdx], nextCache, nextReadyCache, nextIdx);
    }
    applyPreviewSide(side, forceTiny);
  }

  // ---------- preview 頁的跳轉節奏：改由飄動的 e 撞到螢幕上/下邊界觸發 ----------
  // 不再用固定 0.5 秒的計時器自動輪流換左右兩側；撞到上半部邊界＝上方（左側）
  // 照片跳一張，撞到下半部邊界＝下方（右側）照片跳一張，手機（上下版面）、
  // 桌機（左右版面）都套用同一套「撞上緣/下緣」判斷。
  //
  // 快速連續撞擊的處理：分別記錄「上緣」「下緣」各自上一次「真正觸發切換」的
  // 時間，這一次撞擊如果離上一次真正切換的時間小於 DVD_PREVIEW_RAPID_MS，
  // 就視為同一次連續撞擊的延續，直接略過——不切照片、也不更新計時基準
  // （previewLeftLastHitAt / previewRightLastHitAt 維持原值不動）。這樣不管
  // 在這個時間窗裡實際撞了幾下，最多也只會真的切一次，不會因為撞太快就被
  // 逼著用比預期更快的速度狂跳；要等離「上一次真正切換」的間隔真的超過這個
  // 門檻，下一下撞擊才會被當成新的一次、觸發切換。
  const DVD_PREVIEW_RAPID_MS = 450;
  let previewLeftLastHitAt = 0;
  let previewRightLastHitAt = 0;
  function handleDvdPreviewEdgeHit(side){
    if(!previewActive) return; // 只在 preview 頁生效，其他頁面撞邊界不受影響
    const now = performance.now();
    const lastAt = side === 'left' ? previewLeftLastHitAt : previewRightLastHitAt;
    if((now - lastAt) < DVD_PREVIEW_RAPID_MS){
      return; // 離上一次真正切換太近，當作同一次連續撞擊，忽略、不切換
    }
    if(side === 'left') previewLeftLastHitAt = now; else previewRightLastHitAt = now;
    // 一律用 forceTiny=true：撞邊界觸發的換張，永遠要保證「這一撞畫面馬上
    // 有反應」，不能冒險走原本那條會被 isStillCurrent() 中途丟棄的非同步
    // 流程（見 applyPreviewSide 裡的完整說明——這正是「撞到邊界但照片沒換」
    // 這個 bug 的成因：換張的呼叫從頭到尾都沒有把 forceTiny 傳進去，等於
    // 那條本來就設計好的快速路徑形同虛設，從未真正啟用過）。
    stepPreviewSide(side, true);
  }

  function startPreviewCycle(){
    previewActive = true;
    previewLeftLastHitAt = 0;
    previewRightLastHitAt = 0;

    // 記下這一刻的索引，等兩側都準備好要賦值時，再次確認使用者沒有在等待
    // 期間又切換到別張（理論上起始畫面不會被撞牆事件搶先，但保留這層防呆）
    const startLeftIdx = previewLeftIdx;
    const startRightIdx = previewRightIdx;

    // 起始畫面：左右兩側都準備好（至少縮圖已經 decode 完成）才「同時」賦值
    // 顯示，不再各自各憑本事誰先載完誰先跳出來。之後的跳轉交給飄動的 e
    // 撞到上/下邊界時觸發（見 handleDvdPreviewEdgeHit → stepPreviewSide →
    // applyPreviewSide，各自獨立更新，不受這裡影響），這裡不再自動排程計時器。
    Promise.all([
      startPreviewSide('left'),
      startPreviewSide('right')
    ]).then(([leftUrl, rightUrl]) => {
      if(!previewActive) return; // 使用者可能在等待期間已經離開 preview 頁
      if(leftUrl && previewLeftIdx === startLeftIdx) previewLeftImg.src = leftUrl;
      if(rightUrl && previewRightIdx === startRightIdx) previewRightImg.src = rightUrl;

      // 起始畫面兩側這時已經「同時」亮出來了（不管當下亮出來的是縮圖還是
      // 已經是高畫質）。從這一刻開始，兩側是否同步已經不重要了——這裡才
      // 各自獨立把背景一直在跑的真正高畫質版本接上去，把縮圖無縫換成清楚
      // 版本；不會重蹈之前「其中一側自己搶先賦值」的覆轍，因為那個問題
      // 只發生在「兩側都還沒亮出來」的起始瞬間，這裡已經過了那個時間點。
      // 同時也補上「縮圖本身載入失敗」的退路：原本縮圖失敗時完全不會賦值，
      // 這一步會接手把高畫質版本補上去，圖片才不會卡在空白。
      upgradePreviewSideToHighRes('left', startLeftIdx);
      upgradePreviewSideToHighRes('right', startRightIdx);
    });
  }

  // 起始畫面同步亮相之後，各自獨立把已經在背景請求的高畫質版本接上去；
  // 不影響「兩側同時出現」的保證，因為這一步永遠發生在那之後。
  function upgradePreviewSideToHighRes(side, idx){
    const seq = side === 'left' ? previewEvenPhotos : previewOddPhotos;
    const cache = side === 'left' ? previewResolvedLeft : previewResolvedRight;
    const readyCache = side === 'left' ? previewReadyLeft : previewReadyRight;
    const imgEl = side === 'left' ? previewLeftImg : previewRightImg;
    const photo = seq[idx];
    if(!photo) return;
    const isStillCurrent = () => previewActive && (side === 'left' ? previewLeftIdx : previewRightIdx) === idx;
    resolvePreviewImage(photo, cache, readyCache, idx).then((url) => {
      if(url && isStillCurrent() && imgEl.src !== url) imgEl.src = url;
    });
  }

  function stopPreviewCycle(){
    previewActive = false;
  }

  // pushHistory=false 用在「因為網址本來就是 #preview（例如重新整理、上一頁/下一頁）
  // 才開啟這個頁面」的情境，這種情況不需要再往歷史紀錄多推一筆，否則會造成
  // 網址狀態跟瀏覽器上一頁/下一頁按鈕的行為對不起來。
  // ---------- 貫穿全站的飄動英文字（EDEN）----------
  // 不再只在手機版 preview 頁顯示，也不再區分手機/桌機兩種抓取方式——
  // 這顆元素是 <body> 的直接子節點，從進站那一刻就開始跑，切換
  // gallery / preview / detail 頁面完全不會影響它、不會被重新定位、
  // 不會被重新啟動，所以「切頁」不會有任何跳動或震動。
  const dvdBounce = document.getElementById('dvdBounce');
  const DVD_SPEED = 240; // px/秒，平常巡迴的固定速度，也是甩出去之後最終會回穩到的速度
  const DVD_DECAY_MS = 16000; // 放開後，從當下的高速慢慢衰減回 240 要花多久——拉得非常長，讓整個降速過程細膩、有餘韻，不是短短幾秒就結束
  const DVD_DECAY_EASE = 12; // 衰減曲線的陡度：模擬真實摩擦力「先快後慢」的指數衰減，數字越大前段掉速越猛——丟出去沒多久速度就已經掉下來一大截，剩下的時間則是很長、很平緩的尾段慢慢貼近終速，過程依然平滑，不會有斷點或頓挫感

  let dvdRAF = null;
  let dvdLastTime = null;
  let dvdX = 0, dvdY = 0;
  // 用「方向（單位向量）＋速度純量」拆開存，而不是直接存 dx/dy：撞牆只需要翻轉
  // 方向、甩出去的衰減只需要調整速度純量，兩件事互相獨立、不會打架
  let dvdDirX = 1, dvdDirY = 0;
  let dvdSpeed = DVD_SPEED;
  let dvdDecaying = false;
  let dvdDecayStartTime = 0;
  let dvdDecayStartSpeed = DVD_SPEED;
  let dvdDragging = false;
  let dvdPointerId = null;
  let dvdGrabOffsetX = 0, dvdGrabOffsetY = 0; // 抓取當下，指標位置跟元素左上角的距離，維持抓取點不跳動
  let dvdMoveSamples = []; // 最近的 {t, x, y} 取樣，放開時用來算「甩動當下」的瞬時速度

  // 元素目前實際渲染出來的視覺尺寸（現在等於圖片本身的實際大小，容器已經
  // 拿掉多餘的按鍵熱區 padding）——撞牆邊界用這個算，不再像舊版那樣寫死
  // 一個固定像素值；圖片大小（clamp 隨視窗寬度連續縮放、手機版另外放大
  // 1.8 倍）改變時，這個尺寸也會跟著變，量測一次存起來，之後每次撞牆
  // 判斷都直接讀這個值，不用每一影格都重新觸發一次 layout。
  let dvdW = 0, dvdH = 0;
  function measureDvdSize(){
    const rect = dvdBounce.getBoundingClientRect();
    if(rect.width > 0) dvdW = rect.width;
    if(rect.height > 0) dvdH = rect.height;
  }

  // ---------- 撞牆震動 ----------
  // 只在支援 navigator.vibrate 的裝置上生效（實務上就是觸控裝置）；桌機
  // 瀏覽器本來就沒有這支 API，下面的 feature-check 會自動跳過，不需要
  // 再另外判斷「是不是手機」「是不是在哪個頁面」。
  // dvdWasCollidedLastFrame：用「邊緣觸發」而不是「只要正在撞牆就震」——
  // 撞牆瞬間 dvdX/dvdY 會被夾在邊界上（見下面 collided 判斷），如果那一幀
  // 剛好速度極慢（例如使用者用極小力道甩出去、或速度衰減到接近 0），
  // 元素可能連續好幾影格都貼在同一個邊界值上，若每一影格都判斷「有沒有
  // 貼著邊界」就震，會變成「卡住那段時間瘋狂連續震動」。改成只在「上一影格
  // 沒有貼著邊界、這一影格才剛貼上」的那個瞬間震一次，之後只要還貼著同一
  // 個邊，就不會重複觸發，直到它離開邊界、之後又撞上另一次才會再震一次。
  let dvdWasCollidedLastFrame = false;
  // 專門給 preview 頁「撞到螢幕邊界跳照片」用的邊緣觸發旗標——不分是撞到
  // 上/下/左/右哪一邊，只要是撞到螢幕邊界（跟撞到頁面內圖片的 collided
  // 分開算）就算一次候選，實際要換哪一側照片再由撞擊當下 e 落在畫面上半/
  // 下半決定（見 stepDvdBounce 裡的判斷）。
  let dvdWasScreenEdgeCollidedLastFrame = false;
  // dvdLastVibrateTime + DVD_VIBRATE_COOLDOWN_MS：再加一層保險用的最短間隔，
  // 防止某些極端情況（例如同一影格 x、y 兩個方向同時撞到角落，或裝置效能
  // 不穩定造成判斷抖動）短時間內觸發不只一次震動。
  let dvdLastVibrateTime = 0;
  const DVD_VIBRATE_COOLDOWN_MS = 120;
  function triggerDvdEdgeVibration(){
    if(!('vibrate' in navigator)) return;
    const now = performance.now();
    if(now - dvdLastVibrateTime < DVD_VIBRATE_COOLDOWN_MS) return; // 冷卻時間內，先不重複觸發
    dvdLastVibrateTime = now;
    try{ navigator.vibrate(8); }catch(err){} // 8ms：非常短、力道很輕的一次震動
  }

  // dvdX/dvdY 存的就是元素本身（border-box，現在等於圖片邊緣）左上角的
  // 位置，不再另外疊一圈抓取熱區 padding——圖片本身已經夠大、夠好點了，
  // 不需要額外的透明熱區，撞牆判斷也因此精準貼合圖片實際邊緣而不是熱區。
  function dvdBoundMinX(){ return 0; }
  function dvdBoundMinY(){ return 0; }
  function dvdBoundMaxX(){ return Math.max(0, window.innerWidth - dvdW); }
  function dvdBoundMaxY(){ return Math.max(0, window.innerHeight - dvdH); }

  function clampDvd(v, min, max){ return v < min ? min : (v > max ? max : v); }

  // ---------- 頁面內的「圖片」也當成撞牆單位 ----------
  // 除了螢幕邊界，飄動的 e 現在還會跟首頁縮圖照片、或詳情頁那張置中大圖
  // 的實際邊緣互撞反彈——preview 頁刻意排除在外，維持原本只跟螢幕邊界
  // 碰撞的行為。回傳的是目前這一刻所有要拿來當「牆」的矩形（viewport
  // 座標，跟 getBoundingClientRect() 一致，也跟 dvd 自己的定位方式一致，
  // 不用另外換算捲動位移）。
  function getObstacleRects(){
    if(previewPage.classList.contains('active')) return [];

    if(detailPage.classList.contains('active')){
      if(!detailImageWrap.classList.contains('show')) return [];
      const r = detailImageWrap.getBoundingClientRect();
      return (r.width > 0 && r.height > 0) ? [r] : [];
    }

    // 首頁格子頁：只抓「已經載入完成、看得到」的縮圖本身（.grid-item img.loaded），
    // 不是縮圖外面那個正方形 thumb-wrap 熱區——縮圖本身可能遠比正方形格子小
    // （object-fit:contain 縮在中間），撞牆邊界要貼合看得到的照片，不是空白格。
    const rects = [];
    grid.querySelectorAll('.grid-item img.loaded').forEach(img => {
      const r = img.getBoundingClientRect();
      if(r.width > 0 && r.height > 0) rects.push(r);
    });
    return rects;
  }

  // 修正距離在這個範圍內（正常貼著邊緣移動時，每影格的重疊量本來就只有
  // 幾 px），維持原本「直接貼齊」的做法——距離小到肉眼根本看不出差別，
  // 用不著額外處理，也不會拖慢反應。只有修正距離超過這個門檻（例如：
  // 直接把 e 拖進一張圖片中間才放開、或視窗縮放讓圖片瞬間移動到 e 原本
  // 站的位置，讓它整個被嵌進圖片裡）才會啟動下面的平滑滑出效果，避免
  // 那種情況下整顆 e 瞬間傳送過去。
  const DVD_ESCAPE_MIN_DIST = 14;
  let dvdEscaping = false;
  let dvdEscapeFromX = 0, dvdEscapeFromY = 0, dvdEscapeToX = 0, dvdEscapeToY = 0;
  let dvdEscapeStartTime = 0, dvdEscapeDurationMs = 0;

  // AABB 對 AABB 的簡單彈跳判斷：用「重疊面積較淺的那個軸」當作碰撞發生的
  // 方向（撞到左右邊 vs 撞到上下邊），再用兩者中心點的相對位置決定要把
  // dvd 往哪邊推出去、哪個方向分量要翻轉。跟撞螢幕邊界共用同一套視覺/震動/
  // 衰減效果，只是牆壁換成圖片的實際邊緣。
  function resolveDvdObstacleCollision(o, timestamp){
    const dvdLeft = dvdX, dvdRight = dvdX + dvdW, dvdTop = dvdY, dvdBottom = dvdY + dvdH;
    const overlapX = Math.min(dvdRight, o.right) - Math.max(dvdLeft, o.left);
    const overlapY = Math.min(dvdBottom, o.bottom) - Math.max(dvdTop, o.top);
    if(overlapX <= 0 || overlapY <= 0) return false;

    const dvdCenterX = dvdX + dvdW / 2, dvdCenterY = dvdY + dvdH / 2;
    const oCenterX = (o.left + o.right) / 2, oCenterY = (o.top + o.bottom) / 2;

    // 方向一律馬上翻好（不等滑動效果跑完），這樣不管接下來是直接貼齊還是
    // 要跑滑出動畫，離開這個函式的當下方向就已經是正確的、之後的物理
    // 迴圈可以直接沿用，不用另外等狀態同步。
    let targetX = dvdX, targetY = dvdY;
    if(overlapX < overlapY){
      if(dvdCenterX < oCenterX){ targetX = o.left - dvdW; dvdDirX = -Math.abs(dvdDirX); }
      else{ targetX = o.right; dvdDirX = Math.abs(dvdDirX); }
    } else {
      if(dvdCenterY < oCenterY){ targetY = o.top - dvdH; dvdDirY = -Math.abs(dvdDirY); }
      else{ targetY = o.bottom; dvdDirY = Math.abs(dvdDirY); }
    }

    const dist = Math.hypot(targetX - dvdX, targetY - dvdY);
    if(dist <= DVD_ESCAPE_MIN_DIST){
      // 差距很小，維持原本「直接貼齊」，跟修正前的行為一樣、肉眼看不出差別
      dvdX = targetX; dvdY = targetY;
    } else {
      // 差距很大：不瞬間傳送，改成很快地滑過去。滑動的速度用「目前的移動
      // 速度（含甩出去當下的高速）再放大」來決定，不是寫死一個固定時間，
      // 這樣不管甩得多用力，滑出去的速度都至少跟得上、甚至略快於接下來
      // 要接手的正常速度，銜接處才不會有「先慢慢滑、放開後又忽然加速」
      // 這種不協調的落差感；同時夾在 60ms~260ms 之間，確保無論距離多近
      // 多遠，看起來都又快又順、不會拖泥帶水，也不會像瞬移一樣一格跳過去。
      const escapeSpeed = Math.max(dvdSpeed * 1.8, DVD_SPEED * 2);
      dvdEscapeDurationMs = Math.min(260, Math.max(60, (dist / escapeSpeed) * 1000));
      dvdEscapeFromX = dvdX; dvdEscapeFromY = dvdY;
      dvdEscapeToX = targetX; dvdEscapeToY = targetY;
      dvdEscapeStartTime = timestamp;
      dvdEscaping = true;
    }
    return true;
  }

  function setDvdDirection(angle){
    dvdDirX = Math.cos(angle);
    dvdDirY = Math.sin(angle);
    // 避免角度太接近純水平/純垂直，看起來會像卡在一條線上來回
    if(Math.abs(dvdDirX) < 0.25) dvdDirX = dvdDirX < 0 ? -0.25 : 0.25;
    if(Math.abs(dvdDirY) < 0.25) dvdDirY = dvdDirY < 0 ? -0.25 : 0.25;
    const len = Math.hypot(dvdDirX, dvdDirY);
    dvdDirX /= len; dvdDirY /= len;
  }

  function resetDvdBounce(){
    measureDvdSize();
    const minX = dvdBoundMinX(), minY = dvdBoundMinY();
    const maxX = Math.max(minX + 1, dvdBoundMaxX());
    const maxY = Math.max(minY + 1, dvdBoundMaxY());
    dvdX = minX + Math.random() * (maxX - minX);
    dvdY = minY + Math.random() * (maxY - minY);
    setDvdDirection(Math.random() * Math.PI * 2); // 隨機挑一個方向出發，360 度都有機會
    dvdSpeed = DVD_SPEED;
    dvdDecaying = false;
    dvdWasCollidedLastFrame = false;
    dvdWasScreenEdgeCollidedLastFrame = false;
    dvdEscaping = false;
    dvdBounce.style.transform = `translate(${dvdX}px, ${dvdY}px)`;
  }

  function stepDvdBounce(timestamp){
    // dvdDragging 在被指標（手指／滑鼠）抓著的時候會是 true——這種情況
    // 元素位置是直接被對應的 pointer 事件寫 transform 控制，物理迴圈本來
    // 就該整個暫停，抓住的當下已經取消過動畫影格，這裡多一層 guard 只是
    // 保險。放開的那一刻（dvdPointerUp）才會重新把 RAF 排回來。
    if(dvdDragging){
      dvdRAF = null;
      dvdLastTime = null;
      return;
    }

    if(dvdLastTime === null) dvdLastTime = timestamp;
    // 限制單幀最大時間差，避免分頁切到背景、幾秒後切回來時，元素瞬間跳一大段
    const dt = Math.min(48, timestamp - dvdLastTime) / 1000;
    dvdLastTime = timestamp;

    // 正在快速滑出障礙物（見 resolveDvdObstacleCollision 裡修正距離太大的
    // 分支）：這幾影格單純沿著滑出的軌跡跑到目標位置，不疊加下面一般的
    // 速度位移／撞牆判斷，避免兩套位移邏輯同時作用、互相打架。方向已經在
    // resolveDvdObstacleCollision 裡先翻好了、速度也完全沒被這段動過，
    // 滑完（progress 到 1）交還控制權給下面一般的物理迴圈時，會直接無縫
    // 接上原本要飛出去的方向和速度，不會有忽快忽慢的落差感。
    if(dvdEscaping){
      const progress = Math.min(1, (timestamp - dvdEscapeStartTime) / dvdEscapeDurationMs);
      const eased = 1 - Math.pow(1 - progress, 3); // easeOutCubic：起手快、收尾平滑，看起來像俐落地滑過去而不是硬煞車
      dvdX = dvdEscapeFromX + (dvdEscapeToX - dvdEscapeFromX) * eased;
      dvdY = dvdEscapeFromY + (dvdEscapeToY - dvdEscapeFromY) * eased;
      if(progress >= 1) dvdEscaping = false;
      dvdBounce.style.transform = `translate(${dvdX}px, ${dvdY}px)`;
      dvdRAF = requestAnimationFrame(stepDvdBounce);
      return;
    }

    // 甩出去的速度如果高於定速，放開的那一刻就直接開始「慢慢地」往定速衰減
    // （見 dvdPointerUp），不再等第一次撞牆才起算——撞牆才開始減速的話，
    // 高速維持的時間長短完全看運氣（丟到哪裡才撞到東西），現在放開就立刻
    // 起算，維持高速的時間反而更短、更可控。這裡用貼近真實摩擦力的指數
    // 衰減（先快後慢，越接近終速變化越平緩），取代原本等速切線的線性
    // 內插，過程更長也更細膩，不會有機械式的僵硬感。
    if(dvdDecaying){
      const progress = Math.min(1, (timestamp - dvdDecayStartTime) / DVD_DECAY_MS);
      const eased = 1 - Math.exp(-DVD_DECAY_EASE * progress);
      dvdSpeed = dvdDecayStartSpeed + (DVD_SPEED - dvdDecayStartSpeed) * eased;
      if(progress >= 1){ dvdSpeed = DVD_SPEED; dvdDecaying = false; }
    }

    const minX = dvdBoundMinX(), minY = dvdBoundMinY();
    const maxX = dvdBoundMaxX(), maxY = dvdBoundMaxY();

    // 視窗尺寸如果剛好在這個時間點縮小（例如手機網址列從收起變成重新展開、
    // 或者鎖住捲動之後瀏覽器介面重新排版——這在剛點進 preview 頁、body 被
    // 加上 overflow:hidden 的那一刻特別容易發生），邊界會在球本身完全沒有
    // 移動的情況下，憑空往內縮到球原本停留的位置外面。如果直接沿用下面
    // 「移動後檢查邊界」的邏輯，這一影格會被誤判成「球剛好撞到邊界」，
    // 觸發一次跟使用者操作、跟球的實際移動都完全無關的假撞牆，preview
    // 照片因此莫名其妙跳了一張——這正是「preview 頁剛點進去，偶爾沒有
    // 撞擊就會跳照片」的成因。這裡先判斷「這一影格移動之前」球是否已經
    // 落在新邊界外面：如果是，代表邊界是外部原因縮小的，不是球自己的
    // 速度移動撞上去的，這一影格只靜靜地把座標夾回邊界內，不觸發撞擊、
    // 不跳圖；真正由球自己這一影格的移動撞到邊界，才會進到下面正常的
    // 撞牆流程。
    if(dvdX < minX || dvdX > maxX || dvdY < minY || dvdY > maxY){
      dvdX = clampDvd(dvdX, minX, maxX);
      dvdY = clampDvd(dvdY, minY, maxY);
      // 不改動 dvdWasScreenEdgeCollidedLastFrame：維持它原本的值，球下一次
      // 真的用自己的移動撞上邊界時，判斷邏輯才不會被這次的靜默修正干擾。
      dvdBounce.style.transform = `translate(${dvdX}px, ${dvdY}px)`;
      dvdRAF = requestAnimationFrame(stepDvdBounce);
      return;
    }

    dvdX += dvdDirX * dvdSpeed * dt;
    dvdY += dvdDirY * dvdSpeed * dt;

    // 撞到邊緣就反彈：把座標夾回邊界內、水平或垂直方向的分量直接翻轉方向
    let collided = false;
    let hitScreenEdge = false; // 上下左右四個螢幕邊界，撞到任何一個都算
    if(dvdX <= minX){ dvdX = minX; dvdDirX = Math.abs(dvdDirX); collided = true; hitScreenEdge = true; }
    else if(dvdX >= maxX){ dvdX = maxX; dvdDirX = -Math.abs(dvdDirX); collided = true; hitScreenEdge = true; }
    if(dvdY <= minY){ dvdY = minY; dvdDirY = Math.abs(dvdDirY); collided = true; hitScreenEdge = true; }
    else if(dvdY >= maxY){ dvdY = maxY; dvdDirY = -Math.abs(dvdDirY); collided = true; hitScreenEdge = true; }

    // 撞到螢幕邊界（上下左右四邊都算，不限定是哪一邊）的那一瞬間（邊緣觸發，
    // 不是每一影格貼著都觸發），觸發 preview 頁跳轉。
    //
    // 注意：.preview-left / .preview-right 在桌機和手機是「不同方向」的版面——
    // 桌機是左右並排（見 .preview-col 預設 CSS），手機（≤640px）則會透過
    // media query 改成上下堆疊（.preview-left 在上、.preview-right 在下，見
    // 上方 CSS 的 640px breakpoint）。原本這裡不分版面，一律只看撞擊當下的
    // 垂直位置落在螢幕上半還是下半來決定切左邊還是右邊的照片——這在手機的
    // 上下堆疊版面下是對的，但在桌機的左右並排版面下完全對不上：撞在畫面
    // 右側，只要那一瞬間垂直位置剛好落在螢幕上半，就會被誤判成「左側」，
    // 切到左邊的圖，這正是「明明撞右邊、卻是左邊圖片跳了」的成因。
    // 修法：判斷方向要跟著版面走——手機用垂直位置（上半/下半），桌機改用
    // 水平位置（左半/右半），跟 640px 這個 breakpoint 保持一致。
    if(hitScreenEdge && !dvdWasScreenEdgeCollidedLastFrame){
      const isStackedPreviewLayout = window.innerWidth <= 640; // 對齊 CSS 手機版 preview-col 改成上下堆疊的 breakpoint
      let side;
      if(isStackedPreviewLayout){
        const screenMidY = window.innerHeight / 2;
        const dvdCenterY = dvdY + dvdH / 2;
        side = dvdCenterY < screenMidY ? 'left' : 'right';
      } else {
        const screenMidX = window.innerWidth / 2;
        const dvdCenterX = dvdX + dvdW / 2;
        side = dvdCenterX < screenMidX ? 'left' : 'right';
      }
      handleDvdPreviewEdgeHit(side);
    }
    dvdWasScreenEdgeCollidedLastFrame = hitScreenEdge;

    // 再檢查跟頁面內圖片（首頁縮圖 / 詳情頁大圖）的碰撞，同一顆球，只是牆壁
    // 換成這些圖片的實際邊緣；同一影格理論上最多只會真的疊到一張圖，用 some
    // 找到第一個真的重疊的矩形即可，不需要每張都硬套一次。
    const obstacles = getObstacleRects();
    for(let i = 0; i < obstacles.length; i++){
      if(resolveDvdObstacleCollision(obstacles[i], timestamp)){ collided = true; break; }
    }

    // 只在「這一影格才剛撞上」時震動一次（見 dvdWasCollidedLastFrame 上面的說明），
    // 不是「只要正貼著邊界」就震——這樣元素卡在邊緣不動時不會連續狂震
    if(collided && !dvdWasCollidedLastFrame){
      triggerDvdEdgeVibration();
    }
    dvdWasCollidedLastFrame = collided;

    dvdBounce.style.transform = `translate(${dvdX}px, ${dvdY}px)`;
    dvdRAF = requestAnimationFrame(stepDvdBounce);
  }

  function startDvdBounce(){
    if(dvdRAF || dvdDragging) return; // 已經在跑了，或正被抓著（放開再接手）
    resetDvdBounce();
    dvdLastTime = null;
    dvdRAF = requestAnimationFrame(stepDvdBounce);
  }

  // 視窗尺寸改變時（轉橫向、桌機拖曳視窗寬度）只重新量測尺寸、把目前位置
  // 夾回新的邊界內，不隨機換位置、不重新啟動——避免使用者感覺「畫面一動
  // 元素就跳掉」，這正是「切換頁面／改變視窗不會有任何震動」的關鍵。
  function clampDvdIntoViewport(){
    measureDvdSize();
    dvdEscaping = false; // 視窗尺寸一變，舊的滑出目標位置可能已經不對，直接取消，改用下面重新夾回邊界的結果
    const minX = dvdBoundMinX(), minY = dvdBoundMinY();
    const maxX = Math.max(minX, dvdBoundMaxX());
    const maxY = Math.max(minY, dvdBoundMaxY());
    dvdX = clampDvd(dvdX, minX, maxX);
    dvdY = clampDvd(dvdY, minY, maxY);
    dvdBounce.style.transform = `translate(${dvdX}px, ${dvdY}px)`;
  }

  // ---------- 抓取／甩出去（手指、滑鼠共用同一套 Pointer Events，
  // 桌機不再需要長按才能抓，跟手機版一樣直接按著拖就能抓住） ----------
  function dvdPointerDown(e){
    e.preventDefault();
    if(dvdRAF){ cancelAnimationFrame(dvdRAF); dvdRAF = null; }
    dvdLastTime = null;
    dvdDragging = true;
    dvdEscaping = false; // 抓取當下若剛好正在滑出動畫途中，直接取消，位置維持抓取的當下值即可
    dvdPointerId = e.pointerId;
    try{ dvdBounce.setPointerCapture(e.pointerId); }catch(err){}

    const rect = dvdBounce.getBoundingClientRect();
    dvdGrabOffsetX = e.clientX - rect.left;
    dvdGrabOffsetY = e.clientY - rect.top;
    dvdX = rect.left;
    dvdY = rect.top;
    dvdMoveSamples = [{ t: performance.now(), x: dvdX, y: dvdY }];
    dvdBounce.style.transform = `translate(${dvdX}px, ${dvdY}px)`;
  }

  function dvdPointerMove(e){
    if(!dvdDragging || e.pointerId !== dvdPointerId) return;
    e.preventDefault();
    const minX = dvdBoundMinX(), minY = dvdBoundMinY();
    const maxX = dvdBoundMaxX(), maxY = dvdBoundMaxY();
    dvdX = clampDvd(e.clientX - dvdGrabOffsetX, minX, maxX);
    dvdY = clampDvd(e.clientY - dvdGrabOffsetY, minY, maxY);
    dvdBounce.style.transform = `translate(${dvdX}px, ${dvdY}px)`;

    const now = performance.now();
    dvdMoveSamples.push({ t: now, x: dvdX, y: dvdY });
    // 只留最近 ~100ms 的取樣，讓算出來的是「放開前那一瞬間甩動」的速度，
    // 不會被拖曳一開始比較慢的移動拉低平均值
    while(dvdMoveSamples.length > 2 && now - dvdMoveSamples[0].t > 100){
      dvdMoveSamples.shift();
    }
  }

  function dvdPointerUp(e){
    if(!dvdDragging || e.pointerId !== dvdPointerId) return;
    dvdDragging = false;
    try{ dvdBounce.releasePointerCapture(e.pointerId); }catch(err){}

    const now = performance.now();
    const first = dvdMoveSamples[0];
    const last = dvdMoveSamples[dvdMoveSamples.length - 1];
    const dt = Math.max(16, now - first.t) / 1000;
    let vx = (last.x - first.x) / dt;
    let vy = (last.y - first.y) / dt;
    let flingSpeed = Math.hypot(vx, vy);

    // 有偵測到方向才更新方向；幾乎沒有移動（flingSpeed 趨近 0）就維持原本
    // 抓取前的方向不變，反正接下來速度也趨近 0，方向本來就看不太出來
    if(flingSpeed > 0.5) setDvdDirection(Math.atan2(vy, vx));

    // 完全依偵測到的甩動速度決定之後的跑動速度，不再有最低 210px/秒的下限：
    // 甩得越輕就跑得越慢，幾乎沒移動、放開後就直接停在原地不動也可以
    dvdSpeed = flingSpeed;
    if(flingSpeed > DVD_SPEED){
      // 放開的這一刻就直接開始往定速衰減（見 stepDvdBounce 裡的指數衰減
      // 公式），不用等它真的撞到牆才起算——這樣維持在高速的時間不會因為
      // 「丟到哪裡才撞到東西」而長短不一，衰減的長長尾段也才看得完整。
      dvdDecaying = true;
      dvdDecayStartTime = now;
      dvdDecayStartSpeed = flingSpeed;
    } else {
      dvdDecaying = false; // 210 以下（含靜止）不會自動變化，維持原速度
    }
    dvdWasCollidedLastFrame = false; // 放開的瞬間視為全新一輪，即使正好放在邊界上也能正確判斷成一次新的撞牆
    dvdWasScreenEdgeCollidedLastFrame = false;

    dvdLastTime = null;
    if(!dvdRAF) dvdRAF = requestAnimationFrame(stepDvdBounce);
  }

  dvdBounce.addEventListener('pointermove', dvdPointerMove);
  dvdBounce.addEventListener('pointerup', dvdPointerUp);
  dvdBounce.addEventListener('pointercancel', dvdPointerUp);
  // pointerdown 不再直接綁在 dvdBounce 上——這個元素現在是 pointer-events:none
  // （見上面 CSS 的說明），本來就不會是任何事件的 hit-test 目標，綁了也不會
  // 觸發。改成在 window 這一層，用「當下實際渲染出來的矩形範圍」跟按下的
  // 座標比對：落在範圍內才視為抓住了飄動字，其餘一律放行，讓事件正常往下
  // 傳給底下真正被點到的照片／頁面元素。
  // pointermove / pointerup / pointercancel 維持原本綁在 dvdBounce 本身：
  // dvdPointerDown 裡呼叫的 setPointerCapture() 會讓同一個 pointerId 之後的
  // 事件全部直接指定送給這個元素，不再經過一般的 hit-test，所以 pointer-events
  // 就算是 none，只要曾經被 capture 過，後續 move/up/cancel 依然收得到。
  let dvdSuppressNextClick = false; // 抓住飄動字的那次按下／放開，不該連帶
                                     // 觸發底下那張照片的 click（打開詳情頁）
  window.addEventListener('pointerdown', (e) => {
    const rect = dvdBounce.getBoundingClientRect();
    if(e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom) return;
    dvdSuppressNextClick = true;
    dvdPointerDown(e);
  });
  // 瀏覽器在 pointerdown→pointerup 之後，不管中途有沒有移動，都還是會在
  // 「當初真正被點到」的那個元素（也就是底下的照片，因為飄動字本身已經
  // pointer-events:none、從未參與 hit-test）補發一個 click。用 capture
  // 階段攔截，搶在照片自己的 click 監聽器（openDetail）執行之前擋下來，
  // 不然會變成「抓一下飄動字，順便把底下的照片打開了」。
  window.addEventListener('click', (e) => {
    if(!dvdSuppressNextClick) return;
    dvdSuppressNextClick = false;
    e.stopPropagation();
    e.preventDefault();
  }, true);

  window.addEventListener('resize', clampDvdIntoViewport);
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', clampDvdIntoViewport);
  }

  // ---------- preview ↔ 首頁：桌機／平板版「整塊滑動」轉場的共用設定 ----------
  // 跟 CSS 手機版斷點（max-width:640px）保持同一個數字，只有桌機／平板
  // 寬度才套用滑動轉場，手機維持原本的淡入淡出。
  const PREVIEW_SLIDE_MIN_WIDTH = 640;
  // 跟 CSS 的 --preview-slide-duration（.42s）保持同一個數字，只是這裡要用
  // 毫秒：當成「保底逾時」用，萬一某些瀏覽器邊界情況下 transitionend 沒有
  // 觸發，最多等動畫時長再加一點緩衝就強制收尾，不要讓頁面卡在滑一半的狀態。
  const PREVIEW_SLIDE_DURATION_MS = 420;
  const PREVIEW_SLIDE_FALLBACK_MS = PREVIEW_SLIDE_DURATION_MS + 130;
  function isDesktopOrTabletViewport(){
    return window.innerWidth > PREVIEW_SLIDE_MIN_WIDTH;
  }

  let previewClosing = false; // 「往上滑走」轉場進行中的旗標，避免重複觸發疊加動畫
  let previewOpening = false; // 「往下蓋下來」轉場進行中的旗標，避免重複觸發疊加動畫

  function openPreviewPage(pushHistory, instant){
    if(pushHistory === undefined) pushHistory = true;
    if(!previewOddPhotos.length || !previewEvenPhotos.length) return;

    // 不管使用者當下是在首頁網格還是照片詳細頁，這裡都不主動關閉/清空
    // 詳細頁的狀態，讓它原封不動留在 preview 底下——因為 preview-page
    // 的 z-index（900）本來就比 detail-page（50）高、蓋起來時又是完全
    // 不透明的白底，兩者疊在一起使用者也看不出底下是首頁還是詳細頁。
    // 好處是等使用者關閉 preview 時（見 closePreviewPage()），只要保留
    // 原本就在的東西不去動它，自然就會「回到剛剛蓋下來之前所在的那個
    // 畫面」——是首頁網格就留在首頁，是照片詳細頁就留在同一張照片，
    // 不會被強制導回首頁。
    hideHoverPreview();

    if(previewClosing){
      // 使用者在「往上滑走」轉場還沒播完時就又要開啟：立刻打斷關閉動畫，
      // 不要讓兩個方向的滑動轉場疊在一起互相打架
      previewPage.classList.remove('preview-slide-exit', 'no-fade');
      previewClosing = false;
    }

    document.body.classList.add('preview-active');
    // 顏色會在這裡開始從黑轉白，但套用了 CSS transition（見 .fixed-header
    // 內的 color 規則），所以是跟著接下來的滑動轉場一起平滑淡過去，不是
    // 瞬間跳掉。字重維持全站統一的 350、不再有 preview 專屬的 260，所以
    // 不會再有「切換 preview 瞬間文字寬度跟著變、對齊偏移量對不準」的
    // 問題。這裡呼叫 syncFixedChrome() 純粹是保底：確保進入 preview 前
    // header 的對齊都是最新狀態，不影響任何視覺切換時機。
    syncFixedChrome();
    document.body.style.overflow = 'hidden';

    const useSlideCover = !instant && isDesktopOrTabletViewport();

    if(instant){
      // 進站當下第一次自動開啟：先關掉淡入動畫再切成 active，讓 opacity
      // 直接一步到位變成 1，不會有中間值讓底下的首頁網格透出來；下一個
      // 影格再把這個 class 拿掉，之後使用者手動開關 preview 都還是原本
      // 平滑的轉場。
      previewPage.classList.add('no-fade');
      void previewPage.offsetHeight; // 強制 reflow，確保上面這行先生效
      previewPage.classList.add('active');
      // preview 現在真的蓋滿畫面了，補呼叫一次把時鐘定位、準備好（見
      // syncClockAlignment() 內的說明）——這一刻時鐘仍然被不透明的
      // previewPage 蓋住、使用者看不到，純粹是先把位置算好、備妥。
      syncFixedChrome();
      requestAnimationFrame(() => requestAnimationFrame(() => {
        previewPage.classList.remove('no-fade');
      }));
    } else if(useSlideCover){
      previewOpening = true;
      // 桌機／平板：整塊從畫面正上方「蓋下來」，速度曲線／時長跟關閉時的
      // 「往上滑走」完全一樣（見 CSS 的 --preview-slide-duration /
      // --preview-slide-ease），對稱、一樣流暢。
      // 先用 no-fade + preview-slide-start 把 opacity/visibility/transform
      // 一次到位「瞬間」定位到畫面正上方（不透明、但整塊在畫面外），下一
      // 影格才拿掉 no-fade、換成 preview-slide-cover，讓瀏覽器真的先畫出
      // 「在畫面正上方」這一幀，接下來的 transform 變化才會被當成一段可以
      // 播放的轉場，而不是被瀏覽器合併成一次跳過中間過程的瞬間變化。
      previewPage.classList.add('no-fade');
      previewPage.classList.add('preview-slide-start');
      void previewPage.offsetHeight;
      previewPage.classList.add('active');
      void previewPage.offsetHeight;

      requestAnimationFrame(() => requestAnimationFrame(() => {
        previewPage.classList.remove('no-fade');
        previewPage.classList.remove('preview-slide-start');
        previewPage.classList.add('preview-slide-cover');

        let settled = false;
        const settleAfterCover = () => {
          if(settled) return;
          settled = true;
          previewPage.removeEventListener('transitionend', onCoverEnd);
          // 蓋下來的動畫已經跑完，整塊回到正常覆蓋畫面的位置，這裡把
          // preview-slide-cover 拿掉純粹是回收 class（transform 的目標值
          // 本來就是 translate3d(0,0,0)，跟 .preview-page 預設的
          // translateZ(0) 視覺上是同一個位置，拿掉不會有任何跳動）。
          previewPage.classList.remove('preview-slide-cover');
          previewOpening = false;
        };
        const onCoverEnd = (e) => {
          if(e.target !== previewPage || e.propertyName !== 'transform') return;
          settleAfterCover();
        };
        previewPage.addEventListener('transitionend', onCoverEnd);
        setTimeout(settleAfterCover, PREVIEW_SLIDE_FALLBACK_MS);
      }));
    } else {
      previewPage.classList.add('active');
    }

    // 把目前網址記錄成 #preview，這樣重新整理頁面時才知道要留在這頁，
    // 而不是每次都跳回首頁
    if(pushHistory && location.hash !== '#preview'){
      history.pushState({ page: 'preview' }, '', '#preview');
    }

    // 每次重新進入都重新隨機挑一張起始張（見 warmPreviewStart 內的說明），
    // 並確保起始畫面已經暖機好，這裡如果先前已經暖過就直接沿用快取，幾乎不用等
    warmPreviewStart();
    startPreviewCycle();

    // 注意：EDEN 飄動字現在是貫穿全站的元素，從進站那一刻就開始跑，
    // 進出 preview 頁面完全不需要（也不應該）重新啟動或重新定位它——
    // 這正是「切換頁面不會有任何震動」的原因。
  }

  // 「首頁網格已經準備好、不會是白的」的判斷：只看一開啟就在第一畫面內、
  // 會被立刻看到的前 GRID_EAGER_COUNT 張縮圖是否都已經真的載入完成（帶有
  // .loaded class——這個 class 是 renderGrid() 裡每張圖片的 load 事件加上
  // 的，見上面）。往上滑開的動態轉場裡，畫面下緣會最先露出網格、上緣（含
  // header 那一整排）最後才露出，這批 eager 縮圖涵蓋的正是「首次進站會看到
  // 的第一畫面」，跟滑動轉場實際會露出來的範圍一致，不需要另外算捲動位置。
  function isHomeGridVisuallyReady(){
    if(!grid) return true;
    const items = grid.querySelectorAll('.grid-item');
    if(!items.length) return false;
    const eagerCount = Math.min(GRID_EAGER_COUNT, items.length);
    for(let i = 0; i < eagerCount; i++){
      const img = items[i].querySelector('img');
      if(!img || !img.classList.contains('loaded')) return false;
    }
    return true;
  }

  // 用 requestAnimationFrame 輪詢代替另外掛一整排 load 事件監聽器：每一影格
  // 檢查一次是否全部就緒，一就緒立刻執行轉場；設一個 600ms 的保底上限，
  // 避免極端情況下（例如某張圖片遲遲載入失敗、onerror 還在重試備援網址）
  // 使用者點了卻卡住看不到任何反應——寧可讓極少數情況下還是看到一瞬間沒
  // 載完的縮圖，也不要讓轉場整個卡住不會發生。
  function whenHomeGridReady(callback){
    if(isHomeGridVisuallyReady()){ callback(); return; }
    const maxWaitMs = 600;
    const startedAt = performance.now();
    const poll = () => {
      if(isHomeGridVisuallyReady() || (performance.now() - startedAt) >= maxWaitMs){
        callback();
        return;
      }
      requestAnimationFrame(poll);
    };
    requestAnimationFrame(poll);
  }

  // 兩種關閉路徑（手機淡出 / 桌機滑開）收尾要做的事完全一樣：body class、
  // 對齊重算、恢復捲動、preview 自動循環停止、網址列同步，拆成共用函式，
  // 不用寫兩次。
  function finishClosePreviewPage(pushHistory){
    document.body.classList.remove('preview-active');
    // header 的黑／白顏色不是靠這個 class 切換的（見 mix-blend-mode 那條
    // CSS 規則的說明），拿掉 preview-active 純粹是恢復 pointer-events，
    // 這裡呼叫 syncFixedChrome() 只是保底重算一次對齊，不影響任何顏色
    // 切換的時機。
    syncFixedChrome();
    document.body.style.overflow = '';
    stopPreviewCycle();

    if(pushHistory && location.hash === '#preview'){
      history.pushState({ page: 'home' }, '', location.pathname + location.search);
    }
  }

  function closePreviewPage(pushHistory){
    if(pushHistory === undefined) pushHistory = true;
    if(previewClosing) return; // 滑動轉場進行中，忽略重複觸發
    if(!previewPage.classList.contains('active')) return;

    if(!isDesktopOrTabletViewport()){
      // 手機版：完全維持原本「立即淡出」的行為，不做滑動轉場
      previewPage.classList.remove('active');
      finishClosePreviewPage(pushHistory);
      return;
    }

    if(previewOpening){
      // 使用者在「往下蓋下來」轉場還沒播完時就又要關閉：立刻打斷開場動畫，
      // 不要讓兩個方向的滑動轉場疊在一起互相打架
      previewPage.classList.remove('preview-slide-cover', 'preview-slide-start', 'no-fade');
      previewOpening = false;
    }

    // 立刻停止 preview 自動輪播，讓滑走的畫面停在使用者按下那一刻看到的
    // 照片，不會在滑動過程中還繼續切換照片
    stopPreviewCycle();
    previewClosing = true;

    whenHomeGridReady(() => {
      // 開始整塊往上滑出。opacity / visibility 維持 .active 當下的數值
      // （全程不透明），純粹靠 transform 位移做出「照片往上滑走、底下首頁
      // 露出來」的效果，見上面 CSS 的 .preview-slide-exit。
      previewPage.classList.add('preview-slide-exit');

      let settled = false;
      const settleAfterSlide = () => {
        if(settled) return;
        settled = true;
        previewPage.removeEventListener('transitionend', onSlideEnd);

        // 跟 openPreviewPage() 的 instant 開場用同一招：先關掉 transition，
        // 把 active / preview-slide-exit 一次拿掉，讓它瞬間回到「關閉」的
        // 最終狀態（opacity:0、visibility:hidden、transform 歸零）。這時
        // 使用者早就完全看不到這個元素了（已經滑出畫面外），所以「瞬間歸位」
        // 不會被看到，不會有滑走的照片突然跳回原位再淡出這種二次閃爍。
        previewPage.classList.add('no-fade');
        void previewPage.offsetHeight; // 強制 reflow，確保上面這行先生效
        previewPage.classList.remove('active');
        previewPage.classList.remove('preview-slide-exit');
        void previewPage.offsetHeight;
        requestAnimationFrame(() => requestAnimationFrame(() => {
          previewPage.classList.remove('no-fade');
        }));

        previewClosing = false;
        finishClosePreviewPage(pushHistory);
      };

      const onSlideEnd = (e) => {
        if(e.target !== previewPage || e.propertyName !== 'transform') return;
        settleAfterSlide();
      };
      previewPage.addEventListener('transitionend', onSlideEnd);
      // 保底：萬一某些瀏覽器邊界情況下 transitionend 沒有觸發，最多等動畫
      // 時長（PREVIEW_SLIDE_DURATION_MS）再加一點緩衝後強制收尾，避免頁面
      // 卡在「滑到一半」的狀態。
      setTimeout(settleAfterSlide, PREVIEW_SLIDE_FALLBACK_MS);
    });
  }

  previewLabel.addEventListener('click', () => openPreviewPage());
  // 這個頁面點任何地方都直接跳回首頁；頁面開啟時 header 會把 pointer-events
  // 關掉，讓點擊直接穿透到這裡，所以點在標題文字上也一樣會回首頁。EDEN 飄動字
  // 不在 previewPage 的 DOM 樹裡（它是 body 的直接子節點），點在它上面的
  // click 本來就不會冒泡到這裡，不需要另外攔截。
  previewPage.addEventListener('click', () => {
    closePreviewPage();
  });
  // overflow:hidden 已經擋住捲動了，這裡再擋一次滾輪事件保險
  previewPage.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });
  // detail-page（點進去單張照片的頁面）同樣道理：body overflow:hidden + CSS
  // touch-action:none 已經擋住大部分捲動，這裡再擋一次滑鼠滾輪事件保險，
  // 確保電腦上滾輪也不會把底下的頁面捲動
  detailPage.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });

  // 支援瀏覽器「上一頁 / 下一頁」按鈕，跟網址列的 #preview 狀態保持同步
  window.addEventListener('popstate', () => {
    if(location.hash === '#preview'){
      openPreviewPage(false);
    } else if(previewPage.classList.contains('active')){
      closePreviewPage(false);
    }
  });

  function nextPhoto(){
    if(fsReady){
      fsScrollToOffset(Math.round(fsPos) + 1); // 桌機／平板：讓拉簾跟著平滑捲一格，不要直接瞬間跳
      return;
    }
    currentIndex = (currentIndex + 1) % photos.length;
    renderDetail();
  }
  function prevPhoto(){
    if(fsReady){
      fsScrollToOffset(Math.round(fsPos) - 1);
      return;
    }
    currentIndex = (currentIndex - 1 + photos.length) % photos.length;
    renderDetail();
  }

  prevBtn.addEventListener('click', prevPhoto);
  nextBtn.addEventListener('click', nextPhoto);
  backHome.addEventListener('click', closeDetail);
  backArrowBtn.addEventListener('click', closeDetail);

  document.addEventListener('keydown', (e) => {
    if(!detailPage.classList.contains('active')) return;
    if(e.key === 'ArrowRight') nextPhoto();
    if(e.key === 'ArrowLeft') prevPhoto();
    if(e.key === 'Escape') closeDetail();
  });

  // 縮放（pinch-zoom）在某些行動瀏覽器上會連帶觸發 resize 事件，
  // 但此時 window.innerWidth/innerHeight 可能回報的是「縮放後」的數值，
  // 若照樣重新定位，大圖就會瞬間跳位、變得極小。
  //
  // 原本的做法：resize 事件「一觸發當下」先判斷是否還在縮放，沒有縮放才排一個
  // 120ms 後執行的 timeout。問題是使用者放開兩指後，縮放比例通常還會再微調
  // 好幾次才真正穩定到 1，這些微調也會觸發 resize；如果剛好某一次判斷時 scale
  // 已經很接近 1（但還沒完全穩定），就會排入 timeout，等 120ms 後才執行——但那時
  // 版面可能還沒真正定案，所以會先用「還沒穩定」的尺寸重新定位一次（歸到偏掉的
  // 位置），等下一次 resize 事件抓到真正穩定的狀態才又修正一次，看起來就是
  // 「先跳到錯誤位置、才瞬間修正」。
  //
  // 修正方式：判斷「是否還在縮放」要放在 timeout 真正執行的當下重新檢查一次，
  // 而不是相信事件剛觸發時的舊狀態；還沒穩定就直接跳過，等下一次 resize 事件
  // 再重新排一次，這樣只有在真正確定縮放已經結束時才會定位，不會有中途跳動。
  let viewportSettleDebounce = null;
  function scheduleViewportSettle(){
    clearTimeout(viewportSettleDebounce);
    viewportSettleDebounce = setTimeout(() => {
      const stillZoomed = window.visualViewport && Math.abs(window.visualViewport.scale - 1) > 0.01;
      if(stillZoomed) return; // 縮放還沒穩定，先不動，等下一次 resize 事件再判斷

      if(detailPage.classList.contains('active')){
        positionDetailImage(lastNaturalW, lastNaturalH);
      }
      // 縮放期間 syncFixedChromeLive 全程跳過沒有更新（見下方），縮放真正結束、
      // 穩定下來的這一刻，順便補一次正確的重新定位，不用等使用者手動觸發
      // 下一次 resize 事件才修正回來
      syncFixedChrome();
    }, 150);
  }

  // syncFixedChrome()（header 的 preview 對齊 / detail-info / 左右箭頭定位）原本
  // 認為只用 getBoundingClientRect() 讀「當下實際渲染位置」，不像 positionDetailImage
  // 依賴 innerWidth/innerHeight，所以不需要等縮放穩定——但這個假設漏算了一種情況：
  // detail-info 的直式定位（syncDetailInfoAlignment）本身就有用到 window.innerHeight
  // 去算 top，雙指縮放中途這個值一樣不可靠，算出來的位置可能整個飛出畫面外，
  // 而且因為縮放結束後沒有任何後續事件會再重新校正它（不像 resize 那樣持續觸發），
  // 這個錯誤的偏移量會一直卡住，直到重新整理頁面、CSS 變數被重置才會消失——
  // 這正是「雙指縮放後 001 那排字飛不見，切換照片、不重整都救不回來」的成因。
  // 修法：縮放進行中（scale 明顯不是 1）就直接跳過整次 live 更新，等縮放真的
  // 結束（下一次 resize/visualViewport resize 事件時 scale 已經穩定）才繼續算。
  let fixedChromeRAF = null;
  function syncFixedChromeLive(){
    if(fixedChromeRAF) return;
    fixedChromeRAF = requestAnimationFrame(() => {
      fixedChromeRAF = null;
      const stillZoomed = window.visualViewport && Math.abs(window.visualViewport.scale - 1) > 0.01;
      if(stillZoomed) return; // 縮放中途座標不可靠，先不要算，避免把 detail-info 之類的定位帶偏
      syncFixedChrome();
    });
  }

  window.addEventListener('resize', scheduleViewportSettle);
  window.addEventListener('resize', syncFixedChromeLive);
  // visualViewport 的 resize 事件在雙指縮放時觸發得比 window resize 更即時、更頻繁，
  // 一起監聽可以更快抓到「縮放剛結束」的那個時間點。
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', scheduleViewportSettle);
    window.visualViewport.addEventListener('resize', syncFixedChromeLive);
  }

  // 手機橫直切換（orientationchange）目前完全靠上面這套 resize 事件機制
  // 順便處理，但這套機制原本是為了「雙指縮放」設計的，對橫直切換來說有
  // 兩個問題疊在一起：
  //   1) 手機瀏覽器（尤其是 iOS Safari）在橫直切換時，網址列高度、安全
  //      區域（safe-area）都要跟著重新計算，resize 事件常常會在這些都
  //      還沒真正定案之前就先觸發一次，此時讀到的 window.innerWidth /
  //      getBoundingClientRect() 都還是過渡態的數字；fitCollabWidth() 用
  //      這種過渡態尺寸算出來的縮放比例，套用下去就是完全錯的大小。
  //   2) 雙指縮放時使用者會連續觸發好幾次 resize，就算某一次算錯了，
  //      下一次 resize 也會自動修正回來；但橫直切換通常只觸發一兩次
  //      resize，如果剛好「最後一次」就是算錯的那次，就沒有任何後續事件
  //      會再自動修正，錯誤的縮放比例／位置會一路卡住，直到使用者重新
  //      整理頁面、CSS 變數被重新初始化才會消失——這正是「橫轉直後 Collab
  //      那塊字忽然變超大，要重新整理才會恢復正常」的成因。
  // 修法：額外獨立監聽 orientationchange（跟雙指縮放無關，不需要
  // stillZoomed 那套判斷），並且不只重算一次，而是排幾個有間隔的延遲
  // 重算（100ms / 400ms / 800ms）。不管手機瀏覽器實際要花多久，才能讓
  // 橫直切換後的 viewport 尺寸真正穩定下來，這幾次重算裡一定會有一次是
  // 在正確的最終尺寸下執行，把 fitCollabWidth() 的縮放比例、時鐘位置等
  // 全部修正回來，不用再靠使用者手動重新整理。
  // 原本用固定的 100/400/800ms 三次重算，賭「一定有一次會抓到旋轉完成後
  // 的正確尺寸」——但某些裝置（尤其 iOS Safari）網址列/安全區域的過渡動畫
  // 可能跑得比 800ms 更久，三次都還是抓到過渡值，之後又沒有任何事件會再
  // 自動修正，錯誤的字級/位置就一路卡住，直到重新整理頁面。改成持續輪詢
  // window.innerWidth，直到連續兩次讀到「同一個數值」（代表尺寸真的穩定
  // 下來了）才停止；輪詢期間每次都照樣重算，就算中途抓到過渡值，最後穩定
  // 下來那一次一定會蓋掉前面所有錯誤結果。設一個總時長上限（3000ms）當
  // 保險，避免極端情況下 resize 事件一直沒停過，輪詢也不會無限跑下去。
  function handleOrientationChange(){
    let lastWidth = null;
    let stableCount = 0;
    let elapsed = 0;
    const interval = 100;
    const maxElapsed = 3000;

    const poll = () => {
      syncFixedChrome();
      clampDvdIntoViewport();
      if(detailPage.classList.contains('active')){
        positionDetailImage(lastNaturalW, lastNaturalH);
      }

      const currentWidth = window.innerWidth;
      if(currentWidth === lastWidth){
        stableCount++;
      } else {
        stableCount = 0;
        lastWidth = currentWidth;
      }

      elapsed += interval;
      if(stableCount >= 2 || elapsed >= maxElapsed) return;
      setTimeout(poll, interval);
    };

    setTimeout(poll, interval);
  }
  window.addEventListener('orientationchange', handleOrientationChange);
  if(window.screen && window.screen.orientation && window.screen.orientation.addEventListener){
    window.screen.orientation.addEventListener('change', handleOrientationChange);
  }

  async function init(){
    // 一律先鎖住捲動，不等 openPreviewPage() 才鎖（那要等照片非同步抓回來、
    // renderGrid() 把整個網格塞進 DOM 之後才會執行到）。網站預設一進來就是
    // 先看到 preview 頁、網格暫時被蓋在底下看不到，理當從最一開始就不能捲動，
    // 不要有任何一個時間窗口是「網格已經塞進 DOM、但還沒被鎖住捲動」的狀態。
    // 使用者實際點開網格頁（closePreviewPage）時才會恢復正常捲動。
    document.body.style.overflow = 'hidden';

    scheduleClockTick(); // 排在 syncFixedChrome() 之前：桌機版三塊防重疊計算需要文字先有內容，才能量出正確寬度
    syncFixedChrome();
    startDvdBounce(); // 貫穿全站的飄動字，不等照片載入，進站就開始跑
    photos = await fetchDriveImages();

    // 照片一到手，第一件事是先暖機 preview 頁要用的起始兩張照片，而不是
    // 先渲染網格。現在進站預設會直接顯示 preview 頁（見下面 openPreviewPage），
    // 網格在使用者點一下之前其實是被蓋在底下、看不到的——所以「使用者這一刻
    // 真正會看到的東西」是 preview 的這兩張照片，理當比網格縮圖更早發出
    // 網路請求、更早拿到瀏覽器的連線／頻寬。原本是先 renderGrid()（會一次
    // 發出前 GRID_EAGER_COUNT 張網格縮圖的請求）才輪到 preview 暖機，等於
    // 讓使用者看不到的內容搶先跟使用者馬上要看到的內容搶頻寬，這是
    // 「preview 頁一開始還是白幕好一陣子」的原因之一。
    preparePreviewSequences();

    renderGrid();
    positionAllGridIdx(); // 保底補一次：萬一有縮圖是從瀏覽器快取瞬間完成、load 事件觸發得比預期早

    prefetchAllInBackground();
    prefetchHoverThumbsInBackground();

    // ---------- 進站預設先看到 preview 頁，點一下才到首頁 ----------
    // 原本只有網址是 #preview 時才會自動開 preview；現在改成不管網址有沒有
    // 這個 hash，一律先開 preview——但故意傳 pushHistory=false，不把
    // #preview 寫進網址列。這樣「剛進站看到 preview」跟「點一下回到首頁」
    // 這兩個狀態，網址列從頭到尾都是同一個乾淨網址（沒有 hash 差異）：
    //   - 進站當下 hash 本來就是空的，這裡不會主動加上 #preview
    //   - 使用者點擊 previewPage 觸發 closePreviewPage() 時，裡面判斷
    //     「pushHistory && location.hash === '#preview'」才會改網址，
    //     這裡 hash 從頭到尾不是 '#preview'，所以自然不會觸發、不會動到網址
    // 如果是使用者分享 https://.../#preview 這種明確帶 hash 的連結進來，
    // 一樣會走到這裡正常開啟 preview，行為不變。
    //
    // 照片「保證會出現」的部分不需要另外重寫一套邏輯——上面
    // preparePreviewSequences() 早就把起始兩張照片（極小圖／縮圖／原始
    // 高畫質）全部排進暖機佇列，而 openPreviewPage → startPreviewCycle →
    // applyPreviewSide() 內建的是一層一層的降級保護：已經暖好就直接上
    // 高畫質、還沒暖好就先等縮圖 decode 完成再顯示、縮圖也還沒好就繼續等
    // 高畫質——不管網路快慢，最後一定會顯示出照片，不會卡在空白或半張的
    // 狀態。這套機制原本就是為了「使用者手動點 preview」這個情境準備的，
    // 這裡讓進站自動開啟也走同一套，不需要重新設計。
    openPreviewPage(false, true);
  }

  // 禁止右鍵選單、禁止拖曳圖片（防止另存新檔 / 長按儲存）
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('dragstart', (e) => {
    if(e.target.tagName === 'IMG') e.preventDefault();
  });

  // 只擋雙擊縮放，不影響雙指縮放（pinch-zoom 保持可用）
  // 用 isMultiTouch 標記排除「雙指放開手指」被誤判成雙擊的狀況
  let lastTouchEnd = 0;
  let isMultiTouch = false;
  document.addEventListener('touchstart', (e) => {
    if(e.touches.length > 1) isMultiTouch = true;
  }, { passive: true });
  document.addEventListener('touchend', (e) => {
    if(e.touches.length > 0) return; // 還有手指沒放開，先不判斷
    if(isMultiTouch){
      isMultiTouch = false;
      lastTouchEnd = Date.now();
      return; // 這是縮放手勢放開，不是雙擊，不攔截
    }
    const now = Date.now();
    if(now - lastTouchEnd <= 300) e.preventDefault(); // 300ms 內連續兩次點擊視為雙擊，擋掉
    lastTouchEnd = now;
  }, { passive: false });

  // 背景慢慢把所有照片都預先下載一次（不搶主要資源），
  // 這樣使用者不管點開哪一張、往哪個方向連續切換，都大機率已經有快取
  function prefetchAllInBackground(){
    let i = 0;
    function step(){
      if(i >= photos.length) return;
      prefetchOne(photos[i].detailUrlMobile || photos[i].detailUrl || photos[i].url, true);
      i++;
      if('requestIdleCallback' in window){
        requestIdleCallback(step, { timeout: 800 });
      } else {
        setTimeout(step, 120);
      }
    }
    step();
  }

  // hover 大圖預覽現在改用獨立的 thumbUrl（畫質維持原本的 s800，不受網格
  // 縮圖瘦身影響），跟網格顯示用的 gridUrl 已經是兩個不同檔案、不會互相
  // 沾光快取。為了不讓「使用者第一次 hover 到某張照片」變成要重新等一次
  // 網路下載，這裡在背景把所有照片的 thumbUrl 都先跑過一輪、解碼好放進
  // hoverPreviewCache，等真的 hover 到時幾乎都已經是現成的。只在支援 hover
  // 的裝置（桌機／滑鼠）才跑，手機本來就沒有 hover 預覽功能，不需要多耗這筆
  // 流量。優先順序低於 prefetchAllInBackground（大圖頁要用的原始畫質），
  // 用 idle callback 排在更後面，不搶主要資源。
  function prefetchHoverThumbsInBackground(){
    if(!supportsHover) return;
    let i = 0;
    function step(){
      if(i >= photos.length) return;
      const photo = photos[i];
      i++;
      if(photo && photo.thumbUrl && !hoverPreviewCache.has(photo.thumbUrl)){
        const loader = new Image();
        try { loader.fetchPriority = 'low'; } catch(e){} // 純背景暖機用，不搶當下畫面實際需要的資源
        loader.src = photo.thumbUrl;
        const store = () => hoverPreviewCache.set(photo.thumbUrl, loader);
        if(loader.decode){ loader.decode().then(store).catch(store); }
        else if(loader.complete){ store(); }
        else { loader.onload = store; }
      }
      if('requestIdleCallback' in window){
        requestIdleCallback(step, { timeout: 1500 });
      } else {
        setTimeout(step, 200);
      }
    }
    step();
  }

  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(() => {
      syncFixedChrome();
      clampDvdIntoViewport();
    });
  }

  init();

})();
</script>
</body>
</html>
