<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>photobook by edenchen</title>

<!-- 🌟 分享預覽（LINE / Facebook / Threads 等）用的 Open Graph 標籤 🌟 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="edenchen">
<meta property="og:title" content="edenchen">
<meta property="og:description" content="edenchen">
<meta property="og:image" content="https://raw.githubusercontent.com/edench3n/photobookbyedenchen/main/og-image.png">
<!-- 給爬蟲的尺寸提示：數值故意設小（正方形、200x200），大部分平台（包含 LINE）
     在圖片本身是正方形且尺寸不大時，會把它當「小縮圖／小 icon」排版，
     而不是撐滿版面的橫幅大圖。這兩個數值務必跟 og-image.png 實際檔案的
     長寬「同比例」，否則有些爬蟲會直接忽略這個 hint、改抓實際檔案尺寸來排版。 -->
<meta property="og:image:width" content="200">
<meta property="og:image:height" content="200">
<meta property="og:url" content="https://www.edench3n.com/">
<!-- 🌟 改成 summary（不是 summary_large_image）：summary_large_image 是 Twitter/X
     指定的「大圖橫幅」卡片樣式，把 og-image.png 撐到滿版顯示；summary 才是
     「小縮圖 + 文字」的樣式，圖片會像小 logo 一樣顯示在旁邊，這正是你要的效果。
     這個標籤主要影響 Twitter/X 的預覽，LINE 則是靠圖片本身的長寬比例（見下方
     og-image.png 的說明）來決定顯示大小。 🌟 -->
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="edenchen">
<meta name="twitter:description" content="edenchen">
<meta name="twitter:image" content="https://raw.githubusercontent.com/edench3n/photobookbyedenchen/main/og-image.png">

<!-- 🌟 1. 設定瀏覽器分頁圖示 (Favicon) 🌟 -->
<link rel="icon" href="https://raw.githubusercontent.com/edench3n/photobookbyedenchen/main/EDEN.png" type="image/png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 照片放在 Google Drive / Google 圖片 CDN，先建立連線可以讓第一批照片更快開始下載 -->
<link rel="preconnect" href="https://drive.google.com">
<link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
<!-- 照片清單本身（誰有哪些照片、網址是什麼）要先打一次 Google Drive API
     才會知道，這是整個頁面「第一張照片出現前」最前面、會卡住後面所有事情
     的一個網路請求；先建好連線，能省下這個關鍵請求的 TCP/TLS 交握時間。 -->
<link rel="preconnect" href="https://www.googleapis.com" crossorigin>
<!-- 全站字體 Stack Sans Text：這次要用到 260、350 這種非標準字重數值，
     改成用可變字重（variable font）的範圍語法載入，瀏覽器可以在範圍內
     內插出任意數字的字重，不用侷限在 400/500/700 這些固定字重。 -->
<link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Text:wght@200..700&display=swap" rel="stylesheet">
<style>
  :root{
    --header-h: 120px;
    --gap: 18px;
    --edge: 48px;
    --fs-title-gap: 170px; /* 桌機／平板拉簾右側預留給編號(010)/標題(Golf..)兩塊文字的寬度，
      JS 的 layoutFilmstripZone() 會依視窗寬度覆寫這個值，這裡只是初始預設，
      同時也是拉簾跟螢幕右邊界之間的留白依據（見 .detail-filmstrip 的 right） */
    --header-font-size: clamp(13.95px, 11.67px + 0.67vw, 19.01px); /* 桌機／平板版再縮小成
      0.85 倍（三個數字都等比乘 0.85：16.41→13.95、13.73→11.67、0.79→0.67、
      22.37→19.01），套用在上排大標題（header-left/preview/right）、首頁下排
      時鐘（page-clock）、以及照片詳細頁「001 tokyo」那排文字（detail-info），
      三者都共用這顆變數。
      手機版在下面 max-width:640px 那段有自己覆蓋的數值（見該處），不受這裡影響，
      維持原樣不變。 */
    color-scheme: light only; /* 避免手機在深色模式下，頁面自己的 CSS/JS 生效之前，
                                  瀏覽器先用系統預設的深色底色渲染，造成一瞬間的黑色閃爍 */
  }
  *{ box-sizing: border-box; }

  /* ---------- 全站文字/元件不可被選取，行動裝置點擊不出現灰色高亮方塊 ---------- */
  html, body, *{
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin:0; padding:0;
    background:#ffffff;
    color:#000000;
    font-family: 'Stack Sans Text', sans-serif;
    font-weight:350; /* 全站統一字重，preview 頁不再另外覆寫（見 .fixed-header 內的說明） */
    -webkit-font-smoothing: antialiased;
    overflow-x:hidden;
    touch-action: manipulation; /* allow scrolling + pinch-zoom, block double-tap-zoom */
    /* 手機瀏覽器（尤其 iOS/Android）內建「文字自動縮放」(text autosizing)：
       為了方便閱讀，遇到窄欄位裡的多行文字（例如手機版被拆成三行的 Collab
       區塊）會自動把字級再放大一次，而且這個放大是疊加在網站自己算出來的
       字級「之上」、由瀏覽器自己決定倍率，橫轉直時會重新估算一次——這正是
       「Collab 那塊橫轉直後忽然變超大、要重新整理才恢復」的真正成因，跟
       上面 JS 計算的時機無關，所以單純調整重算時機沒辦法根治。加上
       text-size-adjust:100% 直接關閉瀏覽器這層自動縮放，字級永遠只由我們
       自己的 CSS/JS 決定。 */
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  html{
    /* 垂直捲軸的寬度永遠保留（不管當下內容需不需要捲動），瀏覽器就不會在
       「捲軸剛好從無到有 / 從有到無」的那個瞬間，讓整個視窗寬度多出/少掉
       那十幾 px。這正是使用者回報「黑線出現的那一刻，剛好跟 Chrome 右邊
       捲軸一起出現」的成因：捲軸一冒出來，100vw／50% 這些用視窗寬度算出來
       的版面（包含 preview 頁左右兩欄的重疊計算）瞬間跟著變窄一次，先前
       特地做出來蓋住縫隙的 2px 重疊來不及跟著重新計算，縫隙就在那一瞬間
       露出來，看起來像一條黑線。固定保留捲軸寬度後，視窗寬度全程不會再
       因為捲軸有無而跳動，這個縫隙也就不會再有機會露出來。
       scrollbar-gutter 是新一點的標準寫法，某些瀏覽器（例如 Safari）還不
       支援，所以下面用 overflow-y:scroll 當退場機制，效果一樣、支援度更廣。 */
    scrollbar-gutter: stable;
    overflow-y: scroll;
  }

  a, button, .grid-item, .header-left, .nav-arrow {
    font-family:inherit;
    font-weight:inherit;
  }

  /* ---------- FIXED HEADER (always on top, always black, never covered) ---------- */
  /* 原本用 CSS Grid「五等分欄位」排版：header-left / header-preview / header-right
     各佔固定的 1/5 欄寬。問題是欄寬只跟總寬度成比例，跟文字實際需要多寬完全無關——
     螢幕變窄到某個程度（大約 700~1000px 之間，並非任何一個明確的 breakpoint），
     "photobook by edenchen" 這行字會比它所在的欄位還寬，被迫換行，看起來就是
     「文字忽然跳行」。改成 Flexbox：每個區塊只佔用文字實際需要的寬度
     （flex-shrink:0 + white-space:nowrap 鎖住 header-left 不被硬擠壓換行），
     彼此靠 justify-content:space-between 撐開版面。這樣同一套排版可以套用在所有
     寬度，不需要再切換 grid/flex，也不會再有那個模式切換造成的額外跳動。 */
  .fixed-header{
    position:fixed;
    top:0; left:0; right:0;
    z-index:1000;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap: var(--gap);
    padding: 36px var(--edge) 0 var(--edge);
    pointer-events:none;
  }
  .fixed-header .header-left,
  .fixed-header .header-preview,
  .fixed-header .header-right{
    color:#000000;
    /* 顏色改用「一般的黑↔白切換 + CSS transition」，不再用 mix-blend-mode。
       原本想用 mix-blend-mode:difference 讓顏色完全自動跟著正下方畫面即時
       計算，理論上很理想，但 .preview-page / .preview-col 為了避免另一個
       「圖層剛建立時黑閃一下」的問題，刻意用 transform:translateZ(0) 把
       自己拉成獨立的 GPU 合成圖層（見那兩處註解）——瀏覽器在跨圖層合成時
       常常沒辦法正確計算 blend mode（等於把背景當成透明處理），結果文字
       反而變成「永遠是白色、疊在白底首頁上完全看不見」，比原本的問題更
       嚴重。
       改回明確的黑／白兩個狀態切換（由 body.preview-active 控制，見下面該
       規則），但額外幫 color 加上一小段 transition，讓它是平滑淡過去、
       不是瞬間跳掉。刻意選一個較短的時間（.22s，比整塊滑動轉場的 .42s
       短很多）：header 因為 z-index 比照片高，全程都畫在照片「上面」，
       桌機／平板整塊滑動關閉時，畫面下緣最先露出網格、header 所在的最上緣
       其實是滑動快結束時才會露出來（見下面 .preview-slide-exit 的說明）
       ——JS 那邊也是抓「滑動剛結束」那個時間點才觸發顏色切換（見
       finishClosePreviewPage() 的說明），這一小段 transition 剛好接在
       那一刻之後平滑淡開，感覺上顏色轉換跟照片剛完成的移動是同一個連續
       動作、而不是分開的兩段動畫。 */
    transition: color .22s ease;
    /* 字級隨螢幕寬度連續、按比例縮小（不是斷點式的一次性跳動）：桌機滿版
       （≥1100px）維持 15px 不變，窄到手機縮小，中間用 vw 連續內插。line-height
       維持 unitless 的 1.5 倍率，會自動跟著 font-size 等比例縮放，不用另外
       處理；letter-spacing 改用 em（相對字級的比例單位）也是同樣道理，字級
       縮小時會自動等比例縮小，不會維持固定像素值變得不成比例。
       這樣做主要是為了避免 header-left / header-preview / header-right 三塊文字
       加起來的總寬度，在窄螢幕下超出螢幕，把 collab 那塊擠出右側畫面。
       數值抽成 --header-font-size 這個 CSS 變數（定義在 :root），detail-info
       （點進照片後下面的說明文字）會直接沿用同一個變數，確保兩邊字級/行距
       永遠一致，不用兩處分別調整、維護。 */
    font-size: var(--header-font-size);
    line-height:1.5;
    pointer-events:auto;
    white-space:pre-line;
  }
  .fixed-header .header-left{
    letter-spacing:0.014em;
    white-space:nowrap; /* 這行字沒有預期的換行點，鎖住不換行，避免中等寬度時被硬擠成兩行 */
    flex-shrink:0;
    position:relative;
    left: var(--header-left-nudge, 0px); /* 桌機滿版 5 欄時，JS 會把這個微調成精準對齊 001 照片左邊緣的偏移量，做法跟 header-preview 對齊 002 完全一樣；手機版這個變數固定是 0，位置不受影響 */
    opacity:0; /* 原因跟 header-preview / header-right 一樣：等 001 圖片載入、
                  算出精準位置後才顯示，避免進頁面/重新整理時「先跑到錯誤位置
                  再跳回來」 */
    transition: opacity .2s ease;
  }
  .fixed-header .header-left.positioned{ opacity:1; }
  .fixed-header .header-preview{
    letter-spacing:0.014em;
    white-space:nowrap;
    flex-shrink:0;
    position:relative;
    left: var(--preview-nudge, 0px); /* 桌機滿版 5 欄時，JS 會把這個微調成精準對齊 002 照片左邊緣的偏移量 */
    opacity:0; /* 進頁面/重新整理的瞬間，precise 對齊還沒算出來（要等 002 圖片載入），
                  在算出正確位置之前先不顯示，避免使用者看到它先出現在錯誤位置、
                  再「跳」到正確位置；JS 算完準確位置後會加上 .positioned 類別
                  才顯示出來（見下面 .positioned 規則） */
    transition: opacity .2s ease;
    /* 注意：這裡故意不對 left 加 transition。JS 每一幀都會用
       getBoundingClientRect() 讀「當下實際渲染出來的位置」回推下一次要設定的
       nudge 值；如果 left 有 transition，瀏覽器會在動畫過程中間插值，但 JS
       讀到的 --preview-nudge（CSS 變數）卻是已經設定好的「最終目標值」而不是
       插值中的當下值，兩者對不上，算出來的新 nudge 就會偏掉，且在連續拖曳、
       每一幀都重算的情況下持續放大誤差，畫面上就是「左右亂飛」。拿掉 transition
       後，每次讀到的都是瀏覽器已經套用完成的實際值，才不會有這個誤差累積問題。 */
  }
  .fixed-header .header-preview.positioned{ opacity:1; }
  @media (hover: hover){
    /* :hover 只在滑鼠這種真的有「懸停」概念的裝置上生效；觸控裝置點擊時
       瀏覽器常會把 tap 模擬成短暫的 :hover，導致手機上點按鈕會看到變淡一下
       這個不想要的效果，用 (hover: hover) 把這條規則限制在滑鼠裝置上即可。 */
    .fixed-header .header-preview.positioned:hover{ opacity:0.5; }
  }
  .fixed-header .header-right{
    text-align:left;
    letter-spacing:0.014em;
    flex-shrink:0;
    position:relative;
    left: var(--header-right-nudge, 0px); /* 桌機滿版 5 欄時，JS 會把這個微調成精準對齊 004 照片左邊緣的偏移量，做法跟 header-preview 對齊 002 完全一樣 */
    opacity:0; /* 原因跟 header-preview 一樣：等 004 圖片載入、算出精準位置後
                  才顯示，避免進頁面/重新整理時「先跑到錯誤位置再跳回來」 */
    transition: opacity .2s ease;
  }
  .fixed-header .header-right.positioned{ opacity:1; }

  /* ---------- 首頁時鐘（桌機／平板／手機都會顯示） ----------
     不管螢幕寬度，body.preview-active（目前在 Preview 頁）或
     body.detail-active（目前在照片詳細頁）都會把它藏起來，確保「只出現在
     首頁」。字體沿用跟大標題同一顆 --header-font-size 變數，字級、行距、
     字重都跟 header 文字一致。
     預設 opacity:0，等 JS 的 syncClockAlignment() 算出精準位置後才加上
     .positioned 顯示出來——做法跟 header-preview / header-right 完全一樣，
     避免進頁面/重新整理時「先跑到錯誤位置再跳回來」的閃爍。
     三塊（年份／月份日期／時間）的 left 由 syncClockAlignment() 依螢幕
     寬度算出精準像素：
       - 桌機／平板（>640px）：三塊同一高度（都貼齊 .page-clock 底部），
         由左到右分別對齊 header-left（標題）、header-preview（"Preview"
         字樣）、header-right（"Collab..." 那排字）的左邊緣，並用跟
         syncEdgeAlignment 同一套 Math.max 最小間距做法逐一往右鏈接，
         確保視窗變窄時三塊彼此不會疊到或跑位。
       - 手機（≤640px）：header-right 換行變成單獨一整排，不再適合當
         基準，改成時間對齊 header-left（標題），年份＋月份日期兩行疊在
         一起、對齊 header-preview（"Preview" 字樣），維持原本手機版設計。 */
  .page-clock{
    position:fixed;
    left:0; right:0;
    bottom:36px; /* 跟 header 上方 36px 留白對稱，高度感跟手機版一致 */
    z-index:900; /* 蓋在照片格子之上，但在 header（1000）之下 */
    pointer-events:none;
    opacity:0;
    transition: opacity .2s ease;
  }
  .page-clock.positioned{ opacity:1; }
  .page-clock-year,
  .page-clock-monthday,
  .page-clock-time{
    position:absolute;
    bottom:0; /* 桌機版三塊同一高度的基準線；手機版年份會用下面 media query 另外往上抬 */
    color:#000000;
    font-size: var(--header-font-size);
    line-height:1.5;
    letter-spacing:0.014em;
    white-space:nowrap;
  }
  .page-clock-year{ left: var(--clock-year-left, var(--edge)); }
  .page-clock-monthday{ left: var(--clock-monthday-left, var(--edge)); }
  .page-clock-time{ left: var(--clock-time-left, var(--edge)); }

  /* "Collab at" 跟 "edenchenworks@gmail.com" 之間的換行，只在手機版需要——
     桌機維持原本「Collab at edenchenworks@gmail.com」同一行、下一行才是
     「@edench3n」的兩行排版。這裡預設先把這個 <br> 藏起來（display:none
     時 <br> 完全不觸發換行，效果等同它不存在，前後的空白字元會正常收合成
     一個空格），只在下面 640px 的手機版 media query 裡才把它顯示出來、
     真正產生換行，變成三行。 */
  .collab-line-break{ display:none; }

  /* 「@edench3n」這一行往上拉近一點，靠近上面的
     「edenchenworks@gmail.com」，但不動「Collab at」跟
     「edenchenworks@gmail.com」之間的間距——line-height 是整個區塊統一的
     倍率，沒辦法只調整其中一行的行距，所以把這一行包成獨立的
     inline-block（<span class="collab-line3">），只在它身上套一個小小的
     負值 margin-top，把它往上拉近；用 em 為單位，這樣不管上面
     fitCollabWidth() 把字級縮放成多少，這個拉近的幅度都會跟著等比例縮放，
     不會在字級變小/變大時看起來忽近忽遠。 */
  .collab-line3{
    display:inline-block;
    margin-top:-0.45em;
  }

  /* 量測用的隱形分身：position:absolute 讓它徹底脫離 .fixed-header 的
     flex 版面（絕對定位的子元素不算 flex item，flex-basis:100% 之類的
     規則完全不會套用在它身上），寬度不設死值，交給瀏覽器用「shrink-to-fit」
     演算法自動收縮成內容本身的自然寬度（也就是因為 <br> 被斷成三行後，
     最長那一行真正需要的寬度）。selector 疊了三層 class 是刻意要贏過上面
     `.fixed-header .header-right{ position:relative; opacity:0; ... }`
     那條規則（兩層 class）的特異度，才能確實蓋掉 position/opacity 這些值。 */
  .fixed-header .header-right.collab-measure{
    position:absolute;
    visibility:hidden;
    opacity:0;
    pointer-events:none;
    left:0;
    top:0;
    width:max-content;
    transition:none;
  }

  /* ---------- GALLERY PAGE ---------- */
  #galleryPage{
    position:relative;
    min-height:100vh;
    padding: calc(var(--header-h)) var(--edge) 140px var(--edge);
    transition: opacity .5s ease, filter .5s ease;
  }
  .grid{
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap: var(--gap) var(--gap);
    /* 編號現在改成貼在「照片實際下方一點點」，不再是貼齊整個正方形格子的
       下緣——縮圖用 max-height:52% 置中顯示，照片下緣跟格子下緣之間本來
       就留有一段沒被照片佔用的空間（至少 24% 格高），編號會落在這段空間
       裡，不會超出格子本身的高度範圍，所以不需要再額外加大列距，跟欄距
       用同一個 var(--gap) 即可。 */
    row-gap: var(--gap);
  }
  .grid-item{
    position:relative;
    touch-action: manipulation;
  }
  .grid-item .thumb-wrap{
    width:100%;
    aspect-ratio: 1 / 1;
    overflow:visible;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative; /* .idx 現在改成絕對定位，left / top 都由 JS 依「照片本身」
                           實際渲染出來的邊界即時算出 */
  }
  .grid-item img{
    max-width:52%;
    max-height:52%;
    width:auto;
    height:auto;
    object-fit:contain;
    display:block;
    transform: scale(1);
    transition: opacity .3s ease, transform .45s cubic-bezier(.16,1,.3,1);
    will-change: transform;
    -webkit-user-drag:none;
    -webkit-touch-callout:none;
    opacity:0; /* hidden (plain white) until fully loaded — no broken-image icon flash */
  }
  .grid-item img.loaded{
    opacity:1;
  }
  .grid-item:hover img{
    transform: scale(1.12);
  }
  .grid-item .idx{
    /* 縮圖是用 object-fit:contain 置中顯示在正方形格子裡的（見上面
       .grid-item img { max-width:52%; max-height:52% }），照片的長寬比
       不同，實際渲染出來的照片本身在格子裡的寬度、高度、左邊緣、下邊緣
       都會跟著不同——格子本身的邊緣，不等於「照片實際」的邊緣。
       這裡的 left（水平：對齊照片實際的最左側）跟 top（垂直：貼在照片
       實際下緣往下一點點的位置）都不是寫死的，而是由 JS 的
       positionGridIdxItem()（每次照片載入完成 / 視窗尺寸改變時都會重算）
       依照片這一刻實際渲染出來的邊界即時算出、寫進 inline style。
       JS 還沒算出正確值之前，left/top 先給保守的預設值 0（格子左上角），
       避免完全沒有 fallback 位置。 */
    position:absolute;
    left:0;
    top:0;
    font-size:9px;
    letter-spacing:0.5px;
    color:#aaaaaa;
    text-align:left;
    white-space:nowrap;
    pointer-events:none; /* 純標示文字，不要擋到底下照片的 hover / 點擊 */
    /* 滑鼠移上去時，圖片會用 scale(1.12) 從正中心放大（見上面
       .grid-item:hover img），左邊緣會跟著往左多撐出「圖片寬度 6%」。
       --idx-hover-shift 是 JS 依這一刻照片實際渲染寬度算出來的這段位移量
       （見下面 positionGridIdxItem()），平常（沒有 hover）維持 translateX(0)，
       hover 時才套用位移（見下面 .grid-item:hover .idx）。transition 的
       時間、曲線刻意跟圖片放大的 transition 完全一致，兩者才會看起來是
       「同步」在動，不會一個先到、一個慢半拍。 */
    transform: translateX(0);
    transition: transform .45s cubic-bezier(.16,1,.3,1);
  }
  .grid-item:hover .idx{
    transform: translateX(calc(-1 * var(--idx-hover-shift, 0px)));
  }

  /* 照片欄數：5 欄（桌機滿版）→ 3 欄 → 2 欄。header 現在固定用 Flexbox（見上），
     不會再跟著這兩個 breakpoint 切換排版模式，兩者互不影響。 */
  @media (max-width: 1100px){
    .grid{ grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 640px){
    .grid{ grid-template-columns: repeat(2, 1fr); }
    :root{ --header-h: 140px; --edge: 20px; }

    /* 手機版改成兩排：第一排是「Photobook by edenchen」與「Preview」左右
       對齊；Collab 那塊（header-right）獨立換到第二排、佔滿整行寬度，
       顏色改成 #999999 的灰色，跟標題文字做出區隔。
       flex-wrap:wrap 讓超出第一排空間的項目自動換到下一排；header-right
       設 flex-basis:100% 強制它自己單獨佔一整排（不會跟前兩個項目擠在
       同一排），DOM 順序本來就是 header-left → header-preview →
       header-right，所以自然而然會排成「第一排兩個、第二排一個」。
       「edenchenworks@gmail.com」中間沒有空白，瀏覽器預設只會在空白處換行，
       遇到這種一整串不可斷開的文字，就算容器縮小了，文字本身還是會把容器
       撐開、超出螢幕——加上 overflow-wrap / word-break，允許瀏覽器在真的
       塞不下時於文字中間斷行，確保不會溢出螢幕。 */
    .fixed-header{
      flex-wrap: wrap;
      row-gap: 8px;
    }
    .fixed-header .header-left,
    .fixed-header .header-preview{
      flex-shrink:0;
    }
    .fixed-header .header-right{
      flex-basis:100%;
      flex-shrink:1;
      min-width:0;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    /* 手機版才把上面藏起來的 <br> 顯示出來，變成「Collab at」／
       「edenchenworks@gmail.com」／「@edench3n」三行；display 只要不是
       none，<br> 就會強制換行，不需要特別指定成哪個 display 值。 */
    .collab-line-break{ display:inline; }

    /* 手機版把 header-right 拆成三行後，「@edench3n」跟上一行
       「edenchenworks@gmail.com」之間的距離感覺比桌機版更明顯（手機字級
       縮小但 line-height 是等比例縮放，實際像素間距反而顯得鬆），這裡針對
       手機版把上面 .collab-line3 的負值 margin-top 加大，讓兩行更靠近。 */
    .collab-line3{
      margin-top:-1.1em;
      transform: translateY(-6px); /* 額外用 transform 位移，確保就算 inline-block
        的 margin 在某些瀏覽器排版下效果被行高吃掉，這個位移也一定會生效，
        不受行框（line box）高度影響。 */
    }

    /* 用連續、按比例縮放的字級（跟桌機那條 clamp 同樣做法），螢幕越窄字級
       跟著越小，多一層安全邊界，確保在最窄的手機上也能完整容納。
       這裡把最大值從 13px 再調小到 12px——原本 13px 時「edenchenworks@gmail.com」
       换行換到最後一個「m」單獨被擠到下一行，稍微縮小整體字級後，這一行就能
       完整塞下，不會再有孤字跑到下一行的狀況。改寫成覆蓋 --header-font-size
       這個變數，detail-info 會自動跟著一起變小，不用另外處理。 */
    :root{ --header-font-size: clamp(17.5px, 14px + 1.094vw, 21px); } /* 手機版標題文字再放大 1.75 倍：10→17.5、8→14、0.625→1.094、12→21，等比例縮放，clamp 的連續縮放邏輯不變 */

    /* 手機版時鐘改成「時間」單獨一塊、「年份＋月份日期」疊成兩行的原本設計
       （桌機版三塊同高度排開的新設計只適用於 >640px，見上面 syncClockAlignment()
       的分支說明）。年份跟月份日期共用同一個 left（--clock-monthday-left，
       JS 在手機分支會把兩者設成同一個值），這裡只需要把年份往上抬一行；
       抬的幅度用 em 為單位，字級縮放時會跟著等比例縮放。 */
    .page-clock-year{
      left: var(--clock-monthday-left, var(--edge));
      bottom: 1.25em;
    }

    /* 手機版首頁時鐘（年份+月份日期那組、時間那塊）整組再往螢幕下方移動
       一些：.page-clock-year 和 .page-clock-time 都是相對 .page-clock 這個
       容器算 bottom，容器本身桌機/手機共用同一個 bottom:36px；這裡針對手機
       版單獨覆寫成更小的值，兩塊文字就會一起往下移。 */
    .page-clock{
      bottom: 16px;
    }
  }

  /* 照片詳細頁時（body 帶 detail-active class）把時鐘藏起來，確保它「只
     出現在首頁」。這條規則不限定寬度，桌機／平板／手機都適用。
     注意：preview 頁開啟時「不」再把時鐘 display:none 藏起來——時鐘的
     z-index（900）比 preview-page（900）低，但 DOM 順序在它前面，疊圖時
     本來就會被 preview-page 蓋住，不需要額外用 display 隱藏。維持一直
     渲染在原地的好處是：桌機／平板關閉 preview 時整塊照片往上滑走，畫面
     下緣（時鐘所在的位置）本來就是最先被滑開、露出來的區域（見下面
     .preview-slide-exit 的說明）——時鐘既然本來就已經在那個位置畫好了，
     照片一滑開就會馬上被「揭開」看到，而不是等滑動動畫整個結束、
     finishClosePreviewPage() 才把它從 display:none 切回來、慢半拍才
     突然冒出來。 */
  body.detail-active .page-clock{ display:none; }

  /* ---------- HOVER PREVIEW ---------- */
  .hover-preview{
    position:fixed;
    z-index:60;
    width: 45vw;
    max-width: 650px;
    pointer-events:none;
    opacity:0;
    transition: none;
  }
  .hover-preview.show{
    opacity:1;
  }
  .hover-preview img{
    width:100%;
    height:auto;
    display:block;
    box-shadow: 0 30px 60px rgba(0,0,0,0.18);
    background:#111;
    -webkit-user-drag:none;
    -webkit-touch-callout:none;
  }

  /* ---------- DETAIL PAGE ---------- */
  .detail-page{
    position:fixed;
    inset:0;
    z-index:50;
    background:#ffffff;
    opacity:0;
    pointer-events:none;
    /* 注意：這裡故意不對 opacity 加 transition。這片純白背景如果本身也用
       淡出/淡入動畫，在它還是半透明的那零點幾秒之間，底下的照片格子會透出來，
       使用者看到的就是「畫面下方閃過一下首頁縮圖」，而不是乾淨地淡入照片——
       這正是「前幾次點進去會閃過小圖」這個 bug 的成因。改成瞬間出現（不透明、
       完全蓋住底下的格子），真正的淡入效果交給下面 .detail-image-wrap 自己的
       0.25s opacity transition 負責（照片本身在純白背景之上淡入），這樣使用者
       看到的就是乾淨地淡入照片，不會有格子透出來的問題。 */
    touch-action: pinch-zoom; /* 擋掉單指上下滑動捲動，但保留雙指縮放的手勢 */
    overflow:hidden;
  }
  .detail-page.active{
    opacity:1;
    pointer-events:auto;
  }
  .detail-image-wrap{
    position:absolute;
    transition: opacity .25s ease;
    opacity:0;
  }
  .detail-image-wrap.show{ opacity:1; }
  .detail-image-wrap img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    -webkit-user-drag:none;
    -webkit-touch-callout:none;
  }

  .nav-arrow{
    position:fixed;
    top:50%;
    transform: translateY(-50%);
    background:none;
    border:none;
    color:#000;
    z-index:55;
    padding:20px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: opacity .2s ease;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .nav-arrow svg{
    width:22px;
    height:22px;
    display:block;
  }
  @media (min-width: 641px){
    /* 桌機／平板箭頭跟著上面 header 字級縮放（上一輪 30px 覺得太大，
       再乘 0.85 縮回約 25.5px），手機維持原本 22px 不變。left/right/top
       這些對齊用的座標都是獨立屬性，不受圖示大小影響，對齊規則維持原樣。 */
    .nav-arrow svg{
      width:25.5px;
      height:25.5px;
    }
  }
  .nav-left{ left: calc(var(--edge) - 20px); }
  .nav-right{ right: calc(var(--edge) - 20px); }
  .nav-left svg{ transform: scaleX(-1); }
  @media (hover: hover){
    /* 觸控裝置點擊常被瀏覽器模擬成短暫的 :hover，導致手機上點按鈕會看到
       變淡一下這個不想要的效果；限制在真正有滑鼠懸停能力的裝置才生效 */
    .nav-arrow:hover{ opacity:0.5; }
  }

  .nav-back{
    position:fixed;
    /* 手機版維持原本設計：貼著 header 文字正下方、畫面左側。桌機／平板
       版改成跟上排大標題同一條水平線、貼齊拉簾右側標題文字左邊緣，見下面
       min-width:641px 那條規則，這裡的數字只在手機版生效。 */
    top: calc(36px + var(--header-font-size) * 1.5 + 22px);
    left: calc(var(--edge) - 20px);
    transform:none;
  }
  .nav-back svg{ transform: rotate(-90deg); }
  @media (hover: hover){
    .nav-back:hover{ opacity:0.5; }
  }
  @media (min-width: 641px){
    /* 桌機／平板：改成跟上排大標題（header-left 那排字）同一條水平線，
       右側固定貼齊 var(--edge)——跟 detail-title（拉簾右邊「地名」那塊
       文字，例如 Akihabara, Tokyo）共用同一個右邊界，兩者對齊的是彼此的
       「最右側」，不是箭頭去貼標題文字的左邊緣（標題長度不同時，左邊緣
       本來就會跟著跑動，貼左邊緣反而會讓箭頭位置一直變動、對不齊）。
       垂直置中對齊 header 文字那一行的中心：36px（header 頂部留白）
       + 半行高，再用 translateY(-50%) 把按鈕自己的中心點對上去，純
       CSS 算好，不需要 JS 量測。 */
    .nav-back{
      top: calc(36px + (var(--header-font-size) * 1.5) / 2);
      left: auto;
      right: var(--edge);
      transform: translateY(-50%);
    }
  }

  /* ---------- DETAIL PAGE — 桌機／平板專用：右側拉簾 (filmstrip) ----------
     手機版完全不受影響：拉簾在 max-width:640px 直接 display:none，維持原本
     prev/next 箭頭切換的操作方式；desktop/tablet 則反過來把 prev/next 箭頭
     藏起來，改用拉簾操作（見下面 .nav-left/.nav-right 規則）。 */
  @media (min-width: 641px){
    .detail-page .nav-left,
    .detail-page .nav-right{ display:none; }
  }
  .detail-filmstrip{
    position:fixed;
    top:0; bottom:0;
    /* 原本 right:0，拉簾整組貼死在螢幕最右邊界，太靠邊。改成扣掉一般頁面
       邊界(--edge)，再扣掉右側預留給「編號／標題」兩塊文字的寬度
       (--fs-title-gap)——這樣拉簾本身會往畫面內側再退一截，右邊多出來的
       空間剛好用來放 .detail-title（見下面該規則），不是留白浪費掉。 */
    right: calc(var(--edge) + var(--fs-title-gap, 170px));
    width: var(--fs-zone-w, 320px);
    z-index:52;
    overflow:hidden;
    /* 修正首頁滑鼠移到第4欄照片（004、009、014...跟拉簾對齊的同一欄）時
       滾輪/hover大圖/點擊全部失效的 bug：這個容器不管有沒有在照片詳細頁
       裡使用，從頁面一載入就常駐在 DOM 裡（top:0; bottom:0，貫穿整個畫面
       高度），過去這裡直接寫 pointer-events:auto，就算它本身是完全透明、
       視覺上根本看不到（opacity:0、還沒有 .ready），還是會照樣攔截滑鼠事件
       ——首頁網格剛好有一整欄落在這個透明容器底下，滾輪/hover/點擊全部被
       它吃掉，才會出現「這一欄完全沒反應」的現象。改成預設 none，只有真的
       進入照片詳細頁、拉簾準備好顯示出來（.ready）時才需要讓它可以互動，
       這裡才打開 pointer-events。 */
    pointer-events:none;
    opacity:0;
    transition: opacity .32s ease;
    touch-action:none; /* 拉簾自己的滾輪/拖曳手勢自己處理，不要交給瀏覽器預設捲動 */
  }
  .detail-filmstrip.ready{ opacity:1; pointer-events:auto; }
  @media (max-width:640px){
    .detail-filmstrip{ display:none; }
  }
  .filmstrip-track{
    position:absolute;
    inset:0;
  }
  .filmstrip-item{
    position:absolute;
    left:50%; top:50%;
    /* 寬高不再寫死固定值／固定 3:2 比例——原本無論照片直的橫的，全部用
       object-fit:cover 硬裁成同一個 3:2 矩形，直的照片會被裁掉上下、橫的
       照片被裁掉左右，看起來每張照片的「內容中心」都不太一樣。改由 JS
       (fsFitSize，套用在 applyFilmstripTransform 裡)依每張照片真正的寬高比，
       把它 contain 進同一個 fsW0×fsH0 的框裡再設成 inline width/height：
       直的照片變窄、橫的照片變寬，但因為都還是靠 left:50%/top:50% +
       translate(-50%,-50%) 置中，不管照片形狀怎麼變，中心點永遠對齊在同一個
       位置，不會因為長寬不同而偏移。 */
    overflow:hidden;
    cursor:pointer;
    background:#111;
  }
  .filmstrip-item img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    -webkit-user-drag:none;
    -webkit-touch-callout:none;
    pointer-events:none;
  }

  /* 從網格首頁飛到照片頁左側大圖欄位的過場用「分身」圖片：獨立於
     .detail-page 之外（直接掛在 body 下），用 transform 做位移＋縮放（GPU
     合成、不觸發 layout reflow，動畫比改 left/top/width/height 更流暢），
     transform-origin 固定在左上角，這樣 translate 的座標跟 scale 的效果
     才會疊加得剛好對齊目標矩形，不會偏移。 */
  .detail-flip-clone{
    position:fixed;
    top:0; left:0;
    transform-origin: 0 0;
    z-index:1500;
    display:block;
    object-fit:cover;
    pointer-events:none;
    -webkit-user-drag:none;
    will-change: transform;
  }

  /* 進入照片詳細頁時，Collab 那塊（header-right）淡出消失——只在桌機／
     平板生效（手機版 header-right 換行變成獨立一整排，維持原本設計不變）。
     沿用 .header-right 本來就有的 `transition: opacity .2s ease`，這裡只是
     覆寫目標值，動畫本身不用再重寫一次。 */
  @media (min-width: 641px){
    body.detail-active .fixed-header .header-right{
      opacity:0 !important;
      pointer-events:none !important;
    }
  }

  .detail-info{
    position:fixed;
    left: var(--detail-info-left, var(--edge));
    top: var(--detail-info-top, auto);
    /* 注意：這裡故意不設 bottom。如果同時設 top（JS 算好的 px 值）又設
       bottom，在沒有指定 height 的 position:fixed 元素上，瀏覽器不會把
       bottom「忽略」掉，而是會把方塊撐高到 top～bottom 之間的整段距離——
       這樣一來，下面 JS 用 getBoundingClientRect().height 量到的就不是
       文字實際內容的高度，而是「上一次撐出來的高度」，導致每次重新定位
       都拿不準的高度去算下一個不準的 top，多次觸發（切換照片、縮放、
       字型載入完成…）後誤差會慢慢疊加，這正是「文字偶爾往上飄到照片上」
       這個 bug 的成因。拿掉 bottom 後，高度永遠由內容自然決定，量測才會
       準；JS 一定會在畫面顯示前就把 --detail-info-top 算好，所以拿掉
       bottom 不會有「JS 還沒算完先閃一下」的問題。 */
    z-index:55;
    text-align:left;
    /* 字級、行距直接沿用 header 那排標題用的同一個變數/比例，兩邊永遠一致，
       header 變小（例如手機版）這裡就跟著一起變小，不用兩處分別調整 */
    font-size: var(--header-font-size);
    line-height:1.5;
    /* 手機版 header 是橫向一排、用 space-between 排版，"collab" 常常被推到很
       靠右的地方，如果 detail-info 從那個 x 座標開始還維持不換行的單行文字，
       絕大部分內容會直接超出螢幕右側被裁掉、整段看起來就像「不見了」。
       這裡限制寬度為「從目前這個 left 位置到螢幕右側邊界（扣掉 edge）」剩下的
       空間，超過就自動換行，確保不管 left 落在螢幕哪個位置，文字都完整留在
       可視範圍內，同時仍然維持「對齊 collab 左側」這個位置關係。 */
    max-width: calc(100vw - var(--detail-info-left, var(--edge)) - var(--edge));
    overflow-wrap: break-word;
  }
  .detail-info .detail-number{ color:#000; }
  .detail-info .detail-title{ color:#000; }

  /* 桌機／平板：編號(010)、標題(Golf..)拆成拉簾兩側各自獨立的一塊文字，
     不再疊在一起放左下角。兩塊都用 position:fixed 各自定位，直接跳脫
     .detail-info 這個父層原本的 flow 排版（父層在桌機版因此變成沒有可見
     內容的空殼，不影響畫面）。
     垂直方向統一用 top:50% + translateY(-50%)：拉簾本身是 top:0;bottom:0
     滿版高度的容器，「目前作用中」的縮圖（d=0）套用的位移 fsYAt(0)=0，
     永遠精準落在螢幕垂直正中央——這裡用同一個 50% 對齊，文字就會跟那張
     縮圖的中心線對齊，不需要額外量測拉簾目前捲到哪。
     手機版完全不受影響：這條規則包在 min-width:641px 裡，手機維持原本
     .detail-info 疊在一起、貼左下角、對齊 header-right 那套設計。 */
  @media (min-width: 641px){
    .detail-number,
    .detail-title{
      position:fixed;
      top:50%;
      transform:translateY(-50%);
      z-index:55;
      font-size: var(--header-font-size);
      line-height:1.5;
      white-space:nowrap;
    }
    .detail-number{
      /* 貼在拉簾左邊緣往左 32px，跟拉簾維持一段固定間距 */
      right: calc(var(--edge) + var(--fs-title-gap, 170px) + var(--fs-zone-w, 320px) + 32px);
      text-align:right;
    }
    .detail-title{
      /* 貼齊螢幕右邊界（跟頁面其他區塊共用同一個 --edge 留白），寬度限制在
         拉簾右側預留的那塊區域內（--fs-title-gap），標題太長時自動換行，
         不會蓋到拉簾本身。 */
      right: var(--edge);
      text-align:right;
      max-width: calc(var(--fs-title-gap, 170px) - 16px);
      white-space: normal;
      overflow-wrap: break-word;
    }
  }

  /* "preview" 標籤現在是 .fixed-header 裡的一般欄位（跟 header-left / header-right
     用同一套 grid/flex 排版），樣式定義已合併到上面的 .fixed-header 規則，
     不再需要獨立的 position:fixed + JS 算像素位置 + opacity 淡入技巧 —— 這樣它
     一定跟另外兩塊文字同時、立刻出現，畫面變窄時也會跟著同一套 grid/flex 換行，
     不會被推出螢幕外。 */

  /* ---------- PREVIEW PAGE（左右交錯全版跳轉） ---------- */
  .preview-page{
    position:fixed;
    inset:0;
    z-index:900;
    overflow:hidden; /* 配合下面 .preview-col 故意做出的重疊，超出邊界的部分直接裁掉 */
    display:flex; /* 一律保持 flex 版面，用 opacity+visibility 做淡入淡出，
                     不再用 display 直接切換（那樣完全沒有轉場、是瞬間跳出來） */
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    background:#fff; /* 桌機版左右兩欄各佔 50% 寬，理論上剛好拼滿，但螢幕寬度
                         不是整數、或瀏覽器算 50% 時的次像素捨入，偶爾會在正
                         中間留下不到 1px 的縫；這條縫原本會直接透出後面（半
                         透明疊在網格頁上）的內容，變成一條不固定顏色、看起來
                         像細黑線的縫。整個 preview-page 先鋪一層白色底色，
                         這條縫不管什麼時候出現，透出來的都是白色，不會再看到
                         奇怪的線。 */
    /* 進場：opacity 立刻開始淡入，visibility 也立刻變 visible（delay:0s），
       不然還沒淡入就先被 visibility 卡住看不到。
       退場交給 .active 被移除時，下面沒有 .active 的這條規則接手（見下）。 */
    transition: opacity .15s ease, visibility 0s linear 0s;
    touch-action:none; /* 這個頁面不能捲動/縮放 */
    /* 從頁面一載入就先把這個元素固定拉成獨立的 GPU 合成圖層（而不是等第一次
       opacity 動畫觸發時才臨時建立）。部分 WebKit/Safari 版本在「臨時」建立
       合成圖層的那一瞬間，圖層內容還沒真正畫上去之前會先合成出一格黑色畫面，
       這正是「圖片還沒出現前那條/那片黑」的另一個可能來源，跟前面 CSS
       background 完全無關（背景其實一直是白的），所以單純把背景設白沒辦法
       解決。圖層提早建立好、常駐著，就不會再有這個「臨時建立」的瞬間。 */
    transform: translateZ(0);
  }
  .preview-page.active{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
  }
  .preview-page.no-fade{
    /* 進站當下第一次自動打開 preview 頁專用：跳過 0.15s 的淡入動畫，
       直接瞬間變成完全不透明。原因是這段淡入期間 preview-page 本身
       （包含它的白色底色）也在跟著淡入，opacity 還沒到 1 之前，底下
       已經渲染好的首頁網格（001 002...等數字是不等圖片就會馬上出現的）
       會透過這段還沒淡完的透明度被看到，造成「preview 圖片還沒出來，
       首頁數字先跑出來」的畫面。只有這個進站瞬間需要瞬間切換，使用者
       之後手動點擊 preview 標籤 / 點擊畫面關閉，都還是走原本平滑的
       0.15s 淡入淡出，不受影響。 */
    transition:none !important;
  }
  .preview-page:not(.active){
    /* 退場：opacity 淡出的這 0.15s 期間，visibility 還要維持 visible，
       等淡出動畫真正跑完（transition-delay 跟 opacity 的時長對齊）才切成
       hidden，不然畫面會在還沒淡完就被 visibility 直接切掉、變成一半淡出
       一半瞬間消失的怪異效果 */
    transition: opacity .15s ease, visibility 0s linear .15s;
  }

  /* ---------- 桌機／平板：preview ↔ 首頁 之間「整塊滑動」的轉場 ----------
     關閉（回首頁，整塊往上滑走）跟開啟（回 preview，整塊從正上方蓋下來）
     用同一套時間長度／速度曲線（見下面 --preview-slide-* 變數），只差在
     transform 的起訖值相反，讓兩個方向的動態手感完全對稱、一樣流暢。
     只在桌機／平板（>640px，由 JS 的 isDesktopOrTabletViewport() 判斷後才
     加上這些 class）套用；手機版完全不受影響，仍然是原本 opacity 淡入淡出。
     這裡刻意不去動 opacity/visibility（維持 .active 當下的 1 / visible 不變），
     單純用 transform 把整塊照片（左右兩欄，不含上面 fixed-header——header
     是獨立的 fixed 元素、z-index 更高，本來就不在這個容器內，位置完全不受
     影響）整塊位移，讓底下 #galleryPage 的網格隨著位移「露」出來或被蓋住，
     是實體的滑動轉場，不是淡入淡出。
     easing 選用 easeInQuart 系的曲線（前段慢、後段明顯加速），符合「流暢
     但快速、由慢到快」的動態需求，也是 motion graphic 常見的 accelerate
     曲線；時長縮短成 .42s，比第一版更快，按下去之後畫面反應更迅速。
     時長／曲線抽成 CSS 變數，JS 的保底逾時計算會讀同一組數字，兩邊只需要
     改一個地方就能同步調整。
     transform 用 translate3d（而不是 translateY）延續上面 .preview-page
     本來就有的 translateZ(0) 獨立圖層技巧，滑動期間全程留在同一個 GPU
     合成圖層裡，不會在動畫開始/結束的瞬間重新合成圖層造成的那種閃爍。 */
  :root{
    --preview-slide-duration: .42s;
    --preview-slide-ease: cubic-bezier(.5, 0, .75, 0);
  }
  .preview-page.preview-slide-exit{
    transition: transform var(--preview-slide-duration) var(--preview-slide-ease);
    transform: translate3d(0, -100%, 0);
  }
  /* 開啟（點 Preview 標籤 / 從別處導回 preview）：先用 .preview-slide-start
     把整塊瞬間定位到畫面正上方（transform 沒有被 .preview-page 或
     .preview-page.active 的 transition 涵蓋到，所以這一步不會被誤動畫，
     是真正的瞬間跳位），下一影格再切換成這個 class，讓它用跟關閉時完全
     一樣的時間長度／速度曲線，從正上方往下蓋下來蓋滿整個畫面。 */
  .preview-page.preview-slide-cover{
    transition: transform var(--preview-slide-duration) var(--preview-slide-ease);
    transform: translate3d(0, 0, 0);
  }
  .preview-page.preview-slide-start{
    transform: translate3d(0, -100%, 0);
  }
  .preview-col{
    position:relative;
    /* 桌機/平板是左右兩欄各佔 50% 寬，理論上剛好拼滿，但螢幕寬度不是整數、
       或瀏覽器算 50% 時的次像素捨入，偶爾會在正中間留下不到 1px 的縫——
       這條縫不管 preview-page / preview-col 背景設多白都沒用，因為那其實
       不是「背景透出來」，而是兩個各自獨立的渲染圖層中間真的有一絲空隙，
       瀏覽器（尤其是手機 Safari）在那條空隙上有時會合成出一條看起來像
       黑色的細線。修法跟下面手機版「上下兩欄」用的是同一招：兩欄都故意
       「多蓋出」2px（遠大於任何次像素捨入誤差），右欄再往左拉 2px 貼上去，
       兩張圖片保證重疊 2px，那條縫就不可能再露出來；多出來的 2px 由上面
       .preview-page 的 overflow:hidden 裁掉，不影響版面寬度。 */
    width: calc(50% + 2px);
    height:100%;
    overflow:hidden;
    transform: translateZ(0); /* 跟 .preview-page 同樣的道理，提早固定成獨立圖層，避免臨時建立圖層那一瞬間的黑色閃爍 */
    background:#fff; /* 原本是 #000（黑幕）；圖片還沒載出來之前的空檔容易被
                         使用者感知成「當機」，改成跟全站底色一致的白色，
                         視覺上比較不突兀，也跟白色背景銜接得更自然。 */
  }
  .preview-right{
    margin-left: -2px; /* 往左貼上去跟左欄重疊 2px，後渲染的右欄會蓋掉重疊區域，縫隙不會露出來 */
  }
  .preview-col img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover; /* 剛好填滿區域、不留白，也不會過度放大 */
    display:block;
    background:#fff; /* 圖片本身也鋪一層白色：萬一這個 <img> 被瀏覽器獨立拉成一個
                         合成圖層（compositing layer），圖層剛建立、內容還沒真正
                         畫出來之前的那一瞬間，畫面來源就是這個底色，不會是黑的 */
    -webkit-user-drag:none;
    -webkit-touch-callout:none;
    /* 明確禁止任何轉場效果：暖場縮圖（thumbUrl）換成高畫質版本時，兩者都是
       直接指定 src、瞬間切換，本來就不會自動觸發淡入淡出——這裡還是明講
       transition:none，避免以後不小心加了其他共用規則（例如改成套用某個
       全站 img 的 transition class）意外讓這裡也淡入淡出，確保永遠是完全
       無縫的瞬間跳接。 */
    transition:none !important;
  }

  /* 手機：左右兩欄改成上下兩欄。只改排版方向跟每欄的寬高比例，跳轉的時機/節奏
     （JS 那邊完全沒動）跟每張照片的填滿方式（object-fit:cover）都維持不變。 */
  @media (max-width: 640px){
    .preview-page.active{
      flex-direction: column;
      overflow:hidden; /* 配合下面刻意重疊的 2px，多出來的部分直接裁掉，
                           不會往下多推出一截或跑出捲軸 */
    }
    /* 上下兩欄用 height:50% 各分一半時，手機瀏覽器（尤其動態網址列造成
       視窗高度不是整數，或算 50% 時本身就有次像素捨入）常常會在兩欄交界
       處留下不到 1px 的空隙，因為背景是白色、又剛好貼著白色的
       body/preview-page 底色，看起來就是一條很細的白線。
       修法：讓兩欄都刻意「多蓋出」2px（遠大於任何次像素捨入誤差），
       下面那欄再往上拉 2px，兩張照片一定會重疊個 1~2px，白線就不可能
       再露出來；多出來的 2px 由上面 .preview-page.active 的
       overflow:hidden 裁掉，不影響版面高度。 */
    .preview-col{
      width:100%;
      height: calc(50% + 2px);
    }
    .preview-right{
      margin-left: 0; /* 手機是上下欄，取消桌機版左右重疊用的 margin-left，改用下面的 margin-top 做上下重疊 */
      margin-top: -2px;
    }
  }

  /* ---------- 貫穿全站、蓋在所有頁面之上的飄動英文字 ----------
     不再只在手機版 preview 頁面顯示、也不再區分手機/桌機兩種操作方式：
     用 position:fixed（相對視窗，不是相對捲動位置）+ transform 定位
     （JS 算好 x/y 直接寫 transform，不動 top/left，效能比較好）。這個
     元素是 <body> 的直接子節點，不屬於 galleryPage / previewPage /
     detailPage 任何一個頁面容器，所以切換頁面（顯示/隱藏、加減 class）
     完全不會影響到它、不會有任何跳動或重新定位。z-index 拉到最高，
     蓋過頁面裡所有文字、圖片。手機、桌機都用同一套 Pointer Events
     直接抓取拖曳，放開後依甩動速度飛出去，撞到視窗邊緣就反彈。 */
  .dvd-bounce{
    position:fixed;
    top:0; left:0;
    box-sizing:border-box;
    z-index:99999;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:0; /* 拿掉原本的按鍵熱區 padding，讓這個容器的邊界=圖片實際邊緣，撞牆判斷才會精準貼合圖形 */
    /* 原本這裡是 pointer-events:auto，讓整個元素隨時都能接收滑鼠/觸控事件
       才能被抓取拖曳——但代價是它飄到首頁縮圖上方時，會直接擋掉「底下」
       那張照片的 click / mouseenter / mouseleave / wheel 事件（瀏覽器一律
       只把事件送給當下最上層、pointer-events 不是 none 的元素），使用者
       看起來就是「有時候滾輪沒用、有時候點了照片沒反應、hover 大圖也沒
       跳出來」——症狀是隨機的，因為飄動字的位置本來就隨機、不固定停在哪；
       如果它剛好卡在同一欄兩張照片中間來回反彈（撞牆物理本身沒有問題，
       只是恰好卡住），那一整欄的照片在那段時間都會被蓋住，就是「一整
       直排都沒反應」的成因。
       改成 pointer-events:none：預設完全不參與 hit-test，滑鼠/觸控/滾輪
       事件會直接「穿透」它，落到底下真正看得到、可以互動的照片或頁面上，
       行為就跟這個元素單純只是視覺裝飾一樣。抓取／拖曳的手勢改成在
       window 層級用座標比對它目前的實際位置（見下面 JS `dvdGlobalPointerDown`
       的說明），不再依賴這裡的 pointer-events，兩者互不影響。 */
    pointer-events:none;
    touch-action:none; /* 讓拖曳完全交給 JS 的 Pointer Events 處理，瀏覽器不要自己介入 */
    -webkit-user-drag:none;
    -webkit-touch-callout:none;
    will-change: transform;
    cursor: grab;
  }
  .dvd-bounce:active{ cursor: grabbing; }
  .dvd-bounce-img{
    display:block;
    height: clamp(40.5px, 9.72vw, 118.8px); /* 沿用原本文字版的高度區間，再整體放大 1.35 倍 */
    width:auto;
    -webkit-user-drag:none;
    -webkit-touch-callout:none;
    pointer-events:none; /* 拖曳事件交給外層 .dvd-bounce 處理，圖片本身不用再接收事件 */
  }
  @media (max-width: 640px){
    /* 手機版在原本 1.8 倍的基礎上再放大 1.2 倍：桌機/平板維持原本大小不變，只調整這個 breakpoint 底下的高度區間 */
    .dvd-bounce-img{
      height: clamp(64.8px, 15.552vw, 190.08px);
    }
  }
  /* 平板縮小成桌機版的 0.85 倍。原本用「寬度介於 641~1100px 之間」來判斷
     平板，但這只適用於平板螢幕小到會切到 3 欄版面的情況；螢幕夠大（或
     橫放）的平板，寬度會超過 1100px、跟桌機一樣顯示 5 欄版面，寬度上完全
     看不出跟桌機的差別，這個縮小規則就套用不到——這正是「我的平板也是
     五欄位版本」這個回報的成因。
     改用 (hover: none) and (pointer: coarse) 判斷：這抓的是「主要輸入裝置
     是觸控、且沒有滑鼠懸停能力」這個特性本身，不管平板當下顯示 3 欄還是
     5 欄、螢幕多寬多窄都一樣抓得到；再加上 min-width:641px 排除掉手機
     （手機已經有自己上面那條規則），確保跟手機版互不衝突。桌機/筆電因為
     有滑鼠（hover:hover、pointer:fine）完全不會命中這個規則，維持原本大小
     不變。 */
  @media (hover: none) and (pointer: coarse) and (min-width: 641px){
    .dvd-bounce-img{
      height: clamp(34.425px, 8.262vw, 100.98px);
    }
  }

  /* preview 頁開啟時：文字轉白色（配合上面 color 的 transition，會平滑
     淡過去，不是瞬間切換），並讓點擊直接穿透到底下的 preview-page（由它
     負責處理「點任何地方都跳回首頁」）。
     字重不再跟著切換成 260：字重改變會讓文字的實際渲染寬度跟著變，
     header-preview / header-right 這些用 JS 精準對齊照片邊緣的元素，一旦
     寬度變了就要重新算一次偏移量，而 --preview-nudge 這類變數故意沒有加
     transition（原因見上面該處註解），重新算完是瞬間套用新值，看起來就是
     文字「動了一下」。字重全站統一維持 350、不再有 preview 專屬的 260，
     這些元素在首頁／preview 之間切換就不會再有寬度變化，也就不需要重新
     對齊，位置全程完全不動，感覺上真的是同一個物件持續待在原地，只有
     顏色隨著轉場平滑改變。 */
  body.preview-active .fixed-header,
  body.preview-active .fixed-header *{
    color:#ffffff !important;
    pointer-events:none !important;
  }

  .hidden{ display:none !important; }

  ::selection{ background:#000; color:#fff; }
</style>

<script>
(function(){

  const demoFileNames = [
    'Akihabara, Tokyo.jpg', 'MJ Studio Visit.jpg', 'FA Laptop Session.jpg',
    'Gaming Cafe Interior.jpg', 'FA Grid Archive.jpg', 'FA Golf Fit Label.jpg',
    'Selina Miles Spread.jpg', 'Bruno Portrait Layout.jpg', 'DS Grande Print.jpg',

    'MJ Business Card.jpg', 'Skaff Deg Medlemskap.jpg', 'FA Phone Case Collab.jpg'
  ];

  const demoDims = [
    { w: 900,  h: 1200 }, { w: 1000, h: 1000 }, { w: 1300, h: 900  },
    { w: 1400, h: 800  }, { w: 1000, h: 1000 }, { w: 900,  h: 1200 },
    { w: 850,  h: 1300 }, { w: 1300, h: 950  }, { w: 700,  h: 1400 },
    { w: 850,  h: 1300 }, { w: 1100, h: 1100 }, { w: 1300, h: 900  },
    { w: 1400, h: 850  }, { w: 900,  h: 1250 }, { w: 850,  h: 1350 }
  ];

  const demoColors = ['#1a1a1a','#242424','#151515','#2c2c2c','#1e1e1e'];

  function makePlaceholder(w, h, color, label){
    const fontSize = Math.round(w * 0.08);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`
      + `<rect width="100%" height="100%" fill="${color}"/>`
      + `<text x="50%" y="50%" fill="#ffffff" fill-opacity="0.85" font-family="sans-serif" `
      + `font-size="${fontSize}" text-anchor="middle" dominant-baseline="middle">${label}</text>`
      + `</svg>`;
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  }

  const demoPhotos = demoFileNames.map((name, i) => {
    const dims = demoDims[i % demoDims.length];
    const color = demoColors[i % demoColors.length];
    const placeholderUrl = makePlaceholder(dims.w, dims.h, color, String(i + 1).padStart(3, '0'));
    return {
      title: name.replace(/\.[^/.]+$/, ''),
      url: placeholderUrl,
      thumbUrl: placeholderUrl,
      tinyUrl: placeholderUrl // demo 用的本來就是很小的 SVG data URI，直接沿用即可
    };
  });

  let photos = [];
  let currentIndex = 0;

  const grid = document.getElementById('photoGrid');
  const galleryPage = document.getElementById('galleryPage');
  const hoverPreview = document.getElementById('hoverPreview');
  const detailPage = document.getElementById('detailPage');
  const detailImageWrap = document.getElementById('detailImageWrap');
  const detailImage = document.getElementById('detailImage');
  const detailFilmstrip = document.getElementById('detailFilmstrip');
  const filmstripTrack = document.getElementById('filmstripTrack');
  const detailNumber = document.getElementById('detailNumber');
  const detailTitle = document.getElementById('detailTitle');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const backHome = document.getElementById('backHome');
  const backArrowBtn = document.getElementById('backArrowBtn');
  const headerRight = document.querySelector('.fixed-header .header-right');
  const collabMeasure = document.getElementById('collabMeasure');
  const detailInfo = document.querySelector('.detail-info');
  const previewLabel = document.getElementById('previewLabel');
  const previewPage = document.getElementById('previewPage');
  const previewLeftImg = document.getElementById('previewLeftImg');
  const previewRightImg = document.getElementById('previewRightImg');
  const pageClock = document.getElementById('pageClock');
  const pageClockYear = document.getElementById('pageClockYear');
  const pageClockMonthDay = document.getElementById('pageClockMonthDay');
  const pageClockTime = document.getElementById('pageClockTime');

  const supportsHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  const supportsTouch = window.matchMedia('(pointer: coarse)').matches;

  function pad3(n){ return String(n).padStart(3, '0'); }

  // 左右箭頭原本用 top:50% + transform:translateY(-50%) 置中，
  // 這種「百分比 + transform」的組合在手機 Safari 雙指縮放時，
  // WebKit 不會即時重算百分比位置，導致縮放過程中箭頭跟著漂移。
  // 改成用 JS 算好的固定像素 top（跟不會漂移的返回鍵按鈕做法一致），
  // 縮放中就不會有東西需要重新計算，自然不會飄動。
  function positionNavArrows(){
    [prevBtn, nextBtn].forEach(btn => {
      const h = btn.getBoundingClientRect().height || 64;
      const top = Math.round((window.innerHeight - h) / 2);
      btn.style.top = top + 'px';
      btn.style.transform = 'none';
    });
  }

  // 返回鍵（左上角「上一頁」箭頭）
  // ---- 桌機／平板（>640px）----
  // 現在跟上排大標題同一條水平線、右側固定貼齊 var(--edge)（跟
  // detail-title 共用同一個右邊界）這件事純粹用 CSS 的 calc + 
  // translateY(-50%) 就能算好（見 .nav-back 在 min-width:641px 那條
  // 規則），不需要 JS 介入，這裡只要清掉手機版可能殘留的 inline style
  // 讓 CSS 生效即可。
  // ---- 手機（≤640px）----
  // 維持原本邏輯：原本固定 top:170px，跟 header 文字距離太遠，手機橫放時
  // 螢幕高度大幅變矮會跑出畫面，改成即時量測 header 下緣，並確保按鈕永遠
  // 留在畫面可視範圍內（見下方 minTop/maxTop 夾限）。
  function positionBackButton(){
    if(!backArrowBtn) return;

    if(window.innerWidth > 640){
      backArrowBtn.style.top = '';
      backArrowBtn.style.left = '';
      backArrowBtn.style.right = '';
      backArrowBtn.style.transform = '';
      return;
    }

    backArrowBtn.style.left = '';
    backArrowBtn.style.right = 'auto';

    const headerEl = document.querySelector('.fixed-header');
    if(!headerEl) return;
    const headerBottom = headerEl.getBoundingClientRect().bottom;
    const btnH = backArrowBtn.getBoundingClientRect().height || 64;
    const gapBelowHeader = 40; // header 下緣到按鈕之間至少留的安全間距
    const desiredTop = 170; // 畫面夠高時（直式手機、桌機）維持原本的設計高度

    const maxTop = window.innerHeight - btnH - bottomSafety;

    // 畫面矮到連「minTop」都放不下（極端窄的橫式視窗）時，優先保證不會被
    // 裁到畫面外，寧可稍微貼近 header 也不要跑出可視範圍
    const top = maxTop < minTop
      ? Math.max(bottomSafety, maxTop)
      : Math.min(desiredTop, maxTop);

    backArrowBtn.style.top = Math.round(Math.max(top, 0)) + 'px';
    backArrowBtn.style.transform = 'none';
  }

  // 同樣道理：detail-info 文字原本用 bottom:40px 定位，改成 JS 算好的
  // 固定像素 top，跟左邊對齊 header 的邏輯一起做，縮放時就不會飄動。
  function syncDetailInfoAlignment(){
    const rect = headerRight.getBoundingClientRect();
    document.documentElement.style.setProperty('--detail-info-left', rect.left + 'px');

    if(detailInfo){
      const infoH = detailInfo.getBoundingClientRect().height || 0;
      const bottomMargin = 40;
      const top = window.innerHeight - bottomMargin - infoH;
      document.documentElement.style.setProperty('--detail-info-top', Math.round(top) + 'px');
    }
  }

  // "preview" 標籤對齊 002、"collab" 區塊（header-right）對齊 004，做法完全一樣，
  // 所以抽成同一個函式重複用：對齊下方指定照片實際渲染出來的左邊緣（縮圖是置中
  // 顯示在格子裡的，跟格子本身的邊緣不一樣，所以格子對齊還不夠準）。
  //
  // 在桌機滿版 5 欄範圍內「持續即時追蹤」目標照片實際渲染出來的位置——拖曳寬度
  // 時，照片的位置本身就是連續、按比例在變化的（欄寬隨容器寬度平滑縮放），
  // 每一幀都重新量測、對齊，標籤自然就會跟著它一起連續、按比例地滑動，效果
  // 就是「拉動時自由按比例縮放」。
  //
  // （曾經試過「只在最大寬度量一次、之後凍結成固定偏移量疊加在 flex 自然位置
  // 上」，但 flex 用 justify-content:space-between 算出來的中間項位置，本來就
  // 跟下面照片格子的欄位邊界是兩套完全無關的邏輯，固定偏移量疊加在跟照片無關的
  // 位置上，整段拖曳過程都會對不準，不只是斷點那一下——所以改回這個持續追蹤的
  // 版本，才是真正跟著照片格子按比例移動的做法。）
  //
  // 唯一無法避免的：5→3 欄的斷點本身，是照片格子「整數欄數」瞬間切換造成的
  // 結構性跳動——目標照片自己在那一刻就會被搬到完全不同的欄位寬度（不是連續
  // 縮放，是離散跳動），不是「拖曳中持續追蹤」這個做法造成的問題；只要還要求
  // 兩側都精準對齊該照片，這一下跳動就無法用 JS 消除，除非放棄其中一側的精準
  // 對齊。
  const DESKTOP_BREAKPOINT = 1100; // 與 CSS 中 .grid 從 5 欄變 3 欄的 media query 門檻一致
  // minGapEl：這個標籤左邊緊鄰的上一個 header 元素（例如 previewLabel 的
  // minGapEl 是 backHome，headerRight 的 minGapEl 是 previewLabel）。
  //
  // 問題成因：每個標籤都是「持續即時追蹤目標照片左邊緣」（見上面說明），但
  // 照片欄位寬度是隨容器寬度連續、按比例縮小的，標題文字寬度卻不是照同一個
  // 比例縮小（字級用另一條 clamp 曲線縮放，縮小速度跟欄寬不同步）。在滿版 5
  // 欄斷點（1100px）之前的某一段寬度，目標照片的左邊緣會比「上一個標籤實際
  // 佔用到的右邊緣」還要更左，兩者的文字就會疊在一起——這正是「preview 快
  // 撞到 edenchen 標題」的成因，純粹追蹤照片位置本身無法避免。
  //
  // 成熟的處理方式：不是特例判斷某個寬度該不該對齊，而是幫每個標籤設一個
  // 「不能比上一個元素的右邊緣 + 最小間距還要靠左」的下限，用 Math.max 跟原本
  // 追蹤照片算出來的目標位置取比較靠右的那個。寬度還夠時，目標位置本來就在
  // 下限右邊，跟以前行為完全一樣；寬度縮小到快要重疊的那一刻，下限開始生效，
  // 標籤改成穩定貼齊上一個元素右邊、留一個固定間距，之後隨寬度縮小自然一起
  // 往左走（因為上一個元素本身也會變窄），全程沒有跳動、也保證兩者不會疊在
  // 一起，直到真正進入 3 欄斷點、改用手機版那一整排 flex-wrap 版型為止。
  function syncEdgeAlignment(el, cssVar, targetDataIndex, minGapEl){
    if(!el || !grid) return;

    if(window.innerWidth <= DESKTOP_BREAKPOINT){
      document.documentElement.style.setProperty(cssVar, '0px');
      // 窄螢幕不需要精準對齊照片，目前這個位置（0 偏移）本來就已經是最終位置，
      // 直接顯示出來，不會有「先跑到錯誤位置」的問題
      el.classList.add('positioned');
      return;
    }

    const targetImg = grid.querySelector(`.grid-item[data-index="${targetDataIndex}"] img`);
    if(!targetImg) return; // 目標照片還沒渲染出來，先不顯示這個標籤，等它真的渲染出來再算
    const imgRect = targetImg.getBoundingClientRect();
    if(!imgRect.width) return; // 圖片還沒渲染出寬度，先不調，等 load 事件再算一次

    // 讀回目前已經套用的偏移量，還原出「沒有微調時」原本的左邊界，再算出新的
    // 偏移量——因為對應元素的 left 沒有 CSS transition（見 CSS 註解），這裡讀到
    // 的永遠是瀏覽器已經套用完成的實際值，不會有動畫插值中的數值跟目標值對不上、
    // 導致越算越偏的問題。
    const elRect = el.getBoundingClientRect();
    const currentNudge = parseFloat(getComputedStyle(document.documentElement).getPropertyValue(cssVar)) || 0;
    const baseLeft = elRect.left - currentNudge;

    let targetLeft = imgRect.left;
    if(minGapEl){
      const gapPx = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap')) || 0;
      const minLeft = minGapEl.getBoundingClientRect().right + gapPx;
      targetLeft = Math.max(targetLeft, minLeft);
    }

    const nudge = Math.round(targetLeft - baseLeft);
    document.documentElement.style.setProperty(cssVar, nudge + 'px');
    // 算出真正精準的位置後才顯示（見 CSS 的 opacity:0 / .positioned 規則），
    // 這是「進頁面/重新整理時標籤會先跑到錯誤位置再跳回來」這個 bug 的修法：
    // 與其讓它先出現在錯誤（預設 0 偏移）的位置、算完再跳過去，不如乾脆讓它
    // 在還沒算出正確位置之前保持隱藏，算完直接在正確位置出現，使用者就不會
    // 看到那個「跳」的過程。
    el.classList.add('positioned');
  }
  function syncPreviewAlignment(){
    syncEdgeAlignment(previewLabel, '--preview-nudge', 1, backHome); // 002 = data-index "1"，下限對齊上一個元素 backHome（標題）
  }
  function syncHeaderRightAlignment(){
    syncEdgeAlignment(headerRight, '--header-right-nudge', 3, previewLabel); // 004 = data-index "3"，下限對齊上一個元素 previewLabel
  }
  function syncHeaderLeftAlignment(){
    syncEdgeAlignment(backHome, '--header-left-nudge', 0); // 001 = data-index "0"，最左邊沒有上一個元素，不需要下限
  }

  // 首頁時鐘的對齊，依螢幕寬度分兩套基準（跟 CSS 的 max-width:640px 斷點
  // 一致，手機版 header-right 會換行變成單獨一整排，不再適合當基準）：
  //   - 桌機／平板（>640px）：三塊同一高度排開，由左到右分別對齊
  //     header-left（標題）、header-preview（"Preview" 字樣）、
  //     header-right（"Collab..." 那排字）的左邊緣。
  //   - 手機（≤640px）：時間對齊 header-left（標題）左邊緣，年份＋月份
  //     日期疊成兩行、對齊 header-preview（"Preview" 字樣）左邊緣
  //     （年份的垂直位置、跟月份日期共用同一個 left，都交給 CSS 的
  //     max-width:640px media query 處理，這裡只需要算出水平位置）。
  // 讀的都是 getBoundingClientRect().left，不像 syncEdgeAlignment 需要
  // 額外處理「上一次已套用的 nudge」——時鐘本身不會回頭影響 header 文字的
  // 位置，讀到的永遠就是目標值本身，不用反推。
  function syncClockAlignment(){
    if(!pageClock) return;

    // 修正「preview 頁還沒真正蓋滿畫面前，首頁時鐘就先跑出來」的閃爍：
    // 時鐘之所以在 preview 關閉時能「一揭開就看到」，靠的是它從頭到尾都
    // 已經定位好、只是被 z-index 較高、後渲染的 preview-page 蓋住（見上面
    // body.detail-active .page-clock 那條規則旁的說明）。但這個機制有個
    // 前提：preview-page 必須已經真的蓋住畫面。網站一進來，preview 用的
    // 兩張照片要等 Google Drive API 回應才會準備好，這段等待期間
    // body 雖然已經帶著 preview-active class，但 previewPage 本身還沒被
    // 加上 .active（尚未真正覆蓋畫面），如果這裡照樣把時鐘定位、顯示出來，
    // 使用者就會看到時鐘先浮現在（還是透明的）preview 之上。這裡先擋住，
    // 等 openPreviewPage() 真正讓 previewPage 蓋滿畫面之後，會再手動呼叫
    // 一次這個函式（見該處），到時候這個判斷式就會通過，時鐘才會被定位、
    // 準備好給接下來關閉 preview 時「揭開即見」的效果。
    if(document.body.classList.contains('preview-active') && !previewPage.classList.contains('active')) return;

    if(window.innerWidth <= 640){
      if(!backHome || !previewLabel) return;
      const homeRect = backHome.getBoundingClientRect();
      const previewRect = previewLabel.getBoundingClientRect();
      if(!homeRect.width || !previewRect.width) return; // 還沒渲染出寬度，先不調，等下一次 sync 再算

      document.documentElement.style.setProperty('--clock-time-left', Math.round(homeRect.left) + 'px');
      document.documentElement.style.setProperty('--clock-monthday-left', Math.round(previewRect.left) + 'px');
      pageClock.classList.add('positioned');
      return;
    }

    // 桌機／平板：header-left / header-preview / header-right 彼此之間
    // 已經有 syncEdgeAlignment 內建的 minGap 機制防止疊在一起，但我們自己
    // 另外畫出來的年份、月份日期文字寬度不一定跟它們對應的 header 文字一樣
    // 寬——視窗變窄、header 文字彼此靠近時，前一塊時鐘文字有可能比下一塊
    // 的目標位置更靠右，蓋到後面。這裡額外依序量出「年份」「月份日期」
    // 目前實際渲染出來的寬度，用跟 syncEdgeAlignment 同一套「Math.max
    // 最小間距」做法由左到右逐一鏈接：後面那一塊的最終位置一定不會比
    // 「前一塊左邊界 + 前一塊寬度 + 最小間距」更靠左，空間不夠時自動往右
    // 讓開，而不是被前一塊蓋住，響應式拉窄時三塊全程不會互相疊到或跑位。
    if(!backHome || !previewLabel || !headerRight) return;
    const homeRect = backHome.getBoundingClientRect();
    const previewRect = previewLabel.getBoundingClientRect();
    const collabRect = headerRight.getBoundingClientRect();
    if(!homeRect.width || !previewRect.width || !collabRect.width) return;

    const gapPx = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap')) || 0;

    const yearLeft = homeRect.left;
    document.documentElement.style.setProperty('--clock-year-left', Math.round(yearLeft) + 'px');

    const yearWidth = pageClockYear.getBoundingClientRect().width || 0;
    const minMonthDayLeft = yearLeft + yearWidth + gapPx;
    const monthDayLeft = Math.max(previewRect.left, minMonthDayLeft);
    document.documentElement.style.setProperty('--clock-monthday-left', Math.round(monthDayLeft) + 'px');

    const monthDayWidth = pageClockMonthDay.getBoundingClientRect().width || 0;
    const minTimeLeft = monthDayLeft + monthDayWidth + gapPx;
    const timeLeft = Math.max(collabRect.left, minTimeLeft);
    document.documentElement.style.setProperty('--clock-time-left', Math.round(timeLeft) + 'px');

    pageClock.classList.add('positioned');
  }

  const CLOCK_MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function updateClockDisplay(){
    if(!pageClockTime || !pageClockYear || !pageClockMonthDay) return;
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    const ss = String(now.getSeconds()).padStart(2, '0');
    pageClockTime.textContent = `${hh} ${mm} ${ss}`;
    pageClockYear.textContent = `${now.getFullYear()}`;
    pageClockMonthDay.textContent = `${CLOCK_MONTH_ABBR[now.getMonth()]} ${now.getDate()}`;
  }
  // 用「每次都算好離下一個整秒還有幾毫秒」的遞迴 setTimeout，而不是單純的
  // setInterval(fn, 1000)：setInterval 是從呼叫的那一刻開始累計 1000ms，
  // 跟真正的系統時鐘整秒邊界對不上，長時間下來還會因為分頁被瀏覽器節流
  // （background tab throttling）等因素慢慢產生累積誤差、跳動不均勻。
  // 這裡每次更新完當下秒數後，才用當下的 now.getMilliseconds() 重新算出
  // 離下一個整秒的精準剩餘時間，確保每一次跳動都精準落在整秒邊界上，
  // 秒數看起來才會又穩又流暢，不會忽快忽慢。
  let pageClockTickTimer = null;
  function scheduleClockTick(){
    updateClockDisplay();
    if(pageClockTickTimer) clearTimeout(pageClockTickTimer);
    const msToNextSecond = 1000 - new Date().getMilliseconds();
    pageClockTickTimer = setTimeout(scheduleClockTick, msToNextSecond);
  }

  // 左上角「↑」返回鍵、「←」上一張箭頭，原本用寫死的 CSS
  // left: calc(var(--edge) - 20px)，也就是直接貼齊頁面基礎留白 --edge。
  // 但桌機滿版時，「photobook by edenchen」這排字（header-left）並不是貼在
  // --edge，而是被上面 syncHeaderLeftAlignment() 精準微調過，對齊的是
  // 001 照片實際渲染出來的左邊緣（縮圖是置中顯示在格子裡的，比格子本身的
  // 留白要再往右一些）——這正是螢幕截圖裡箭頭明顯落在文字左邊、對不齊的
  // 原因：箭頭用的是「頁面留白」，文字用的是「照片邊緣」，兩者本來就是
  // 不同的基準線。
  // 修法：改成箭頭也用同一個基準——直接讀 header-left 這一刻真正渲染出來的
  // 左邊緣，再扣掉按鈕本身的 20px padding（讓箭頭「圖示」本身、不是按鈕的
  // 透明熱區，對齊到文字左邊緣）。右側箭頭則依對稱性，套用同一個內縮值、
  // 從畫面右邊界往內推，讓左右留白維持對稱（不是分別各算各的）。
  // 手機／平板（DESKTOP_BREAKPOINT 以下）header-left 本來就沒有精準對齊
  // 微調（nudge 固定是 0px），這裡算出來的值會自然跟原本 var(--edge)-20px
  // 一致，所以這個改動不影響手機版的既有位置。
  function positionNavHorizontal(){
    if(!backHome) return;
    const rect = backHome.getBoundingClientRect();
    if(!rect.width && !rect.height) return; // header-left 還沒渲染出實際位置，先不調，等下一次 sync 再算
    const navLeft = Math.round(rect.left - 20);
    // backArrowBtn（左上角「↑」返回鍵）只在手機／平板（≤640px）沿用這裡的
    // 「跟 header-left 同一基準」邏輯；桌機（>640px）它已經被 CSS 的
    // .nav-back media query 改成貼齊畫面右側、跟大標題同一條水平線（見
    // positionBackButton() 的說明），這裡如果不分寬度、一律把它也塞進跟
    // prevBtn 同一組左側定位，會用 inline style（優先度必定蓋過 CSS）
    // 把桌機版剛設定好的右側位置整個蓋掉——這正是「桌機版箭頭有時候會
    // 跑位」的成因：這個函式跟 positionBackButton() 互相搶著設定同一個
    // 按鈕的位置，誰後執行誰贏，兩邊的呼叫順序在不同觸發路徑下不一致，
    // 結果就是位置忽左忽右、看起來像隨機跑掉。
    // 修法：桌機寬度時，這裡完全不碰 backArrowBtn，把它整個交給
    // positionBackButton() 一個函式獨家負責，不再有兩邊互搶的情況。
    const isDesktopNavBack = window.innerWidth > 640;
    const leftBtns = isDesktopNavBack ? [prevBtn] : [prevBtn, backArrowBtn];
    leftBtns.forEach(btn => {
      if(!btn) return;
      btn.style.left = navLeft + 'px';
      btn.style.right = 'auto';
    });
    if(nextBtn){
      nextBtn.style.right = navLeft + 'px';
      nextBtn.style.left = 'auto';
    }
  }

  // 手機版：Collab 那塊（header-right）整塊等比放大／縮小，讓最長的那一行
  // （「edenchenworks@gmail.com」）的最右側字元，精準對齊上面「Photobook by
  // edenchen」（header-left）最後一個字元「n」的最右側。兩者本來就是從
  // .fixed-header 同一個起始點（padding-left）開始排版，所以只要把
  // Collab 那一行的「寬度」調整成跟標題的寬度完全一樣，右邊自然就會跟著
  // 對齊，不用另外處理右邊界。
  //
  // 做法：量測「Collab 最長一行」目前的自然寬度，用它跟 header-left 目前
  // 實際渲染出來的寬度算出縮放比例，直接把這個比例乘上字級寫回去。
  //
  // 這裡故意不直接量測顯示中的 header-right——它是 flex item，且套用了
  // flex-basis:100%（見手機版 media query），就算暫時切成 inline-block，
  // 瀏覽器對 flex item 一律先「blockify」，flex-basis 依然會把它撐滿整排
  // 寬度，量出來的其實是「畫面可用寬度」而不是文字真正需要的寬度，算出來的
  // 縮放比例會嚴重失準。改成量測旁邊那個專門準備的隱形分身 #collabMeasure：
  // 它是 position:absolute（見上面 CSS 的 .collab-measure 規則），完全脫離
  // flex 版面，寬度用瀏覽器原生的 shrink-to-fit 演算法自動收縮成「這個字級
  // 下、最長一行」真正需要的自然寬度，不受任何容器寬度影響，量到的數字才
  // 準確可靠。因為它從頭到尾都沒被 JS 動過字級，隨時都是可信賴的基準值，
  // 不需要每次重算前先重設。
  //
  // 算出新字級之後只套用在「真正顯示的」header-right 上，#collabMeasure
  // 本身維持原始字級不變，繼續當下一次計算的基準。因為 line-height 是無
  // 單位的 1.5 倍率，字級改變時行距會自動等比例跟著縮放，不用另外處理。
  function fitCollabWidth(){
    if(!headerRight || !backHome || !collabMeasure) return;

    if(window.innerWidth > 640){
      // 桌機不需要縮放，還原成 CSS 預設字級（跟著 --header-font-size 走）
      headerRight.style.fontSize = '';
      return;
    }

    const naturalWidth = collabMeasure.getBoundingClientRect().width;
    const targetWidth = backHome.getBoundingClientRect().width;
    if(!naturalWidth || !targetWidth) return;

    const baseFontSize = parseFloat(getComputedStyle(collabMeasure).fontSize);
    if(!baseFontSize) return;

    const ratio = targetWidth / naturalWidth;
    headerRight.style.fontSize = (baseFontSize * ratio) + 'px';
  }

  // 統一入口：視窗/版面真正穩定下來時（不是縮放中）才呼叫，
  // 一次把左右箭頭、detail-info 文字、header-left、preview 標籤、collab 區塊
  // 都重新定位好。
  function syncFixedChrome(){
    syncDetailInfoAlignment();
    positionNavArrows();
    positionBackButton();
    syncHeaderLeftAlignment();
    positionNavHorizontal(); // 必須排在 syncHeaderLeftAlignment() 之後，才能讀到這一輪算好的最新位置
    syncPreviewAlignment();
    syncHeaderRightAlignment();
    fitCollabWidth(); // 必須排在最後：要讀到 header-left 這一輪最終的寬度才能算準縮放比例
    syncClockAlignment(); // 需要 header-left / header-preview 這一輪最終位置，排在它們之後算
    positionAllGridIdx(); // 視窗尺寸/欄數改變後，重新把每張照片的編號貼回「照片本身」的右下角
  }

  async function fetchDriveImages(){
    if(!GOOGLE_API_KEY || GOOGLE_API_KEY === 'YOUR_API_KEY' ||
       !GOOGLE_DRIVE_FOLDER_ID || GOOGLE_DRIVE_FOLDER_ID === 'YOUR_FOLDER_ID'){
      return demoPhotos;
    }

    try{
      const q = encodeURIComponent(`'${GOOGLE_DRIVE_FOLDER_ID}' in parents and mimeType contains 'image/' and trashed = false`);
      const fields = encodeURIComponent('files(id,name,createdTime,thumbnailLink)');
      const url = `https://www.googleapis.com/drive/v3/files?q=${q}&fields=${fields}&orderBy=name&key=${GOOGLE_API_KEY}`;

      const res = await fetch(url);
      if(!res.ok) throw new Error('Drive API request failed: ' + res.status);
      const data = await res.json();

      if(!data.files || data.files.length === 0) return demoPhotos;

      return data.files
        .sort((a,b) => a.name.localeCompare(b.name))
        .map(file => {
          // thumbnailLink 是 Google 圖片 CDN 產生的、已經縮圖過的版本（速度快、
          // 全球都有快取節點，也比較不會像 uc?export=view 那樣在檔案較大時
          // 被擋掉或跳出「無法掃描病毒」的中介頁面）。網格縮圖只是小圖，
          // 用 800px 的版本畫質完全足夠；點開大圖看細節時才用原始全尺寸檔案，
          // 畫質不受任何影響。
          const thumbBase = file.thumbnailLink ? file.thumbnailLink.replace(/=s\d+$/, '') : '';
          return {
            title: file.name.replace(/\.[^/.]+$/, ''),
            url: `https://drive.google.com/uc?export=view&id=${file.id}`, // 原始全尺寸檔案：畫質最高，但走 drive.google.com/uc，
                                                                            // 不是 CDN，檔案大時常常要等好幾秒才回應，甚至偶爾被
                                                                            // 導去「無法掃描病毒」的中介頁面——這是白屏拖很久的主因
            // detailUrl：大圖頁真正優先使用的來源。一樣是 thumbnailLink 這個
            // Google 圖片 CDN（全球節點、速度快很多），只是把尺寸從網格用的
            // 800px 拉到 2000px——一般螢幕（含 Retina）全螢幕顯示都綽綽有餘，
            // 肉眼幾乎看不出跟原始檔案的差異，但下載速度是原本 uc?export=view
            // 的好幾倍快，白屏時間大幅縮短。
            detailUrl: thumbBase ? (thumbBase + '=s2000') : '',
            // detailUrlMobile：只給手機版大圖頁用的縮小版本。手機螢幕的可視
            // 寬度（扣掉左右箭頭留白後）通常落在 250~300px 左右，就算是
            // Retina/3x 螢幕，實際需要的像素寬度也大概落在 900px 上下，
            // 2000px 對手機來說是遠超過肉眼看得出差異的大小，卻要多花好幾倍
            // 的下載時間。改用 1200px：畫質在手機螢幕上跟 2000px 幾乎沒有
            // 分別，但檔案小很多、下載快很多，這樣切換照片時大機率能直接
            // 一次到位顯示正確畫面，不需要再靠縮圖墊場、事後校正這些額外的
            // 過場處理。只在觸控裝置套用，桌機版不受影響，仍然用 2000px。
            detailUrlMobile: (supportsTouch && thumbBase) ? (thumbBase + '=s1200') : '',
            thumbUrl: thumbBase ? (thumbBase + '=s800') : `https://drive.google.com/uc?export=view&id=${file.id}`, // hover 大圖預覽專用：畫質保持不變
            // gridUrl：首頁網格縮圖實際顯示用的尺寸。網格每張圖片最終渲染出來
            // 頂多幾十到一百多 px 寬（.grid-item img { max-width:52% } 疊在
            // 本來就不大的欄位裡），用 800px 明顯是殺雞用牛刀，檔案大小是真正
            // 需要的好幾倍，這正是「首頁小圖載入速度太慢」的主因。改用 400px，
            // 即使是 Retina 螢幕也綽綽有餘，肉眼幾乎看不出差異，但檔案大小明顯
            // 縮小、下載更快。注意：hover 滑鼠跳出來的大圖預覽刻意還是用上面
            // 那個沒被縮小的 thumbUrl（s800），不會被這次調整影響到。
            gridUrl: thumbBase ? (thumbBase + '=s400') : `https://drive.google.com/uc?export=view&id=${file.id}`,
            fallbackUrl: thumbBase ? (thumbBase + '=s1600') : '', // 縮圖／原圖都失敗時的備援
            // tinyUrl：專門給 preview 頁「飄動的 e 撞到上/下邊界」觸發跳轉、但撞擊
            // 太快或連續撞擊、且連 thumbUrl（800px）都還沒被瀏覽器快取到時
            // 使用的最後備援圖。原本是 60px，檔案極小、瞬間就能顯示，但撞太快
            // 時整個畫面幾乎全是這張圖，60px 拉滿半個螢幕肉眼一看就是馬賽克，
            // 畫質完全不能看；後來改成 320px 已經好一些，但在部分手機（尤其
            // Retina/3x 螢幕）上全螢幕拉滿看還是偏糊，這正是使用者回報「偶爾
            // 還是會看到畫質很差的圖片跳出來」的來源之一。再提升到 480px：
            // 檔案仍然遠比 800px 版本小很多，一樣會在照片清單一到手就被背景
            // 全部預先暖機好（見下方 preparePreviewSequences／warmPreviewTiny，
            // 顯示當下同樣是瞬間、不會變慢），但清晰度明顯提升，即使是它被
            // 顯示出來的少數情況，看起來也不會再一眼就覺得「畫質很差」。
            tinyUrl: thumbBase ? (thumbBase + '=s480') : `https://drive.google.com/uc?export=view&id=${file.id}`,
            // previewUrl：只給手機版的 preview 跳轉頁用。跳轉頁每 0.5 秒就換一張，
            // 畫面停留時間很短、肉眼幾乎來不及看清細節，卻要求跟大圖頁一樣載 2000px
            // 原圖，在手機網路下載這麼大的檔案本來就慢，這正是「下方區域黑一陣子
            // 照片才跳出來」的主因之一。這裡再從 900px 降到 650px：因為畫面每
            // 0.5 秒就換下一張，加上照片是用 object-fit:cover 塞滿半個手機螢幕
            // （不是給人放大細看），650px 在肉眼可辨識的程度上跟 900px 幾乎沒有
            // 差異，但檔案大小可以再省下不少，白幕/黑幕出現的機率跟時間都會更短。
            // 只在觸控裝置（supportsTouch）套用，桌機版不受影響，仍然用原本的 2000px。
            // 原本是 650px，在一般手機螢幕上還算夠用，但在高密度（3x Retina）
            // 大螢幕手機上，object-fit:cover 撐滿半個螢幕寬度時 650px 已經不太
            // 夠銳利，肉眼看得出偏軟。調到 900px：檔案仍然遠比 2000px 小很多、
            // 下載跟解碼都很快，但清晰度在大多數手機上已經跟看原圖沒有明顯差異。
            previewUrl: (supportsTouch && thumbBase) ? (thumbBase + '=s900') : ''
          };
        });
    }catch(err){
      return demoPhotos;
    }
  }

  // 首頁網格最前面這幾張縮圖，不管手機螢幕多高，幾乎都是「一打開就看得到」
  // 的第一畫面內容；原本手機版（supportsTouch）不分青紅皂白全部縮圖都套用
  // loading="lazy"，包括這些明明馬上就要顯示的圖片——lazy 是設計給「捲動
  // 到才需要看到」的內容用的，套在第一畫面內容上，瀏覽器不會把它們當成
  // 高優先度資源，反而會延後、降低它們的下載優先順序，這正是「一開始都
  // 還是全白幕」的主因之一。這裡改成：前面這幾張明確給 eager + 高優先度，
  // 讓瀏覽器把頻寬優先用在使用者馬上就會看到的圖片上；再往後（真的要捲動
  // 才會看到）的縮圖才繼續用 lazy，省流量、不影響第一畫面出現的速度。
  // 10 張足夠涵蓋手機 2 欄、平板 3 欄、桌機 5 欄各種版面下的第一畫面，
  // 多留一點餘裕也不會造成明顯負擔（縮圖檔案本身已經很小)。
  const GRID_EAGER_COUNT = 10;

  // 把單一 .grid-item 裡的編號（.idx）貼在「照片本身」實際渲染出來的
  // 位置：水平（left）對齊照片實際的最左側，垂直（top）貼在照片實際
  // 下緣「往下一點點」的位置——不是整個正方形格子（.thumb-wrap）的邊緣。
  // 縮圖用 max-width:52%/max-height:52% + object-fit:contain 置中顯示，
  // 不同照片的長寬比會讓照片本身在格子裡的實際大小、位置都不一樣，只有
  // 用 getBoundingClientRect() 量出這一刻真正渲染出來的邊界，才能準確算出
  // 正確的 left / top，讓編號永遠貼著照片實際的邊緣，不是格子的邊緣。
  //
  // 這裡量到的 imgRect 是「滑鼠沒有移上去、還沒放大」時的原始大小，但
  // .grid-item:hover img 會把圖片整個放大 1.12 倍（transform-origin 預設
  // 是正中心，放大時上下左右會一起往外撐開，不是只往上長）。如果只留給
  // 照片原始下緣一點點固定間距，滑鼠移上去、圖片放大後，下緣會往下多撐出
  // 「圖片高度 12% 的一半」，很容易整個蓋到編號上面。這裡把這段放大會多
  // 撐出來的高度也一起預留進間距裡，編號就會穩穩留在「照片放大後的下緣」
  // 更下面，滑鼠移上去也不會碰到。
  //
  // 左邊緣也是同樣道理：放大時左邊緣會往左多撐出「圖片寬度 12% 的一半」，
  // 但這段不是像下緣那樣「預留固定間距」就好——使用者要的是編號的最左側
  // 要「跟著」照片放大的最左側一起即時移動、看起來流暢同步，而不是編號
  // 提前就留在一個放大後才會用到的位置（那樣沒放大時反而會離照片左邊緣
  // 太遠）。所以這裡改成：編號平常仍然對齊「照片原始（未放大）的左邊緣」，
  // 多算出來的這段放大位移量只放進 CSS 變數 --idx-hover-shift，交給
  // CSS 的 .grid-item:hover .idx 規則、用 transform:translateX() 在滑鼠
  // 真的移上去的當下才套用；因為套用的 transition 時間/曲線特意跟圖片
  // 放大的 transition 完全一致（都是 .45s cubic-bezier(.16,1,.3,1)），
  // 兩者會同時開始、同時結束，看起來就是編號跟著照片一起放大移動。
  const GRID_IDX_GAP = 14; // 編號跟照片（含放大狀態）下緣之間留的間距（px）——使用者要求再往下多留一些
  const GRID_HOVER_SCALE = 1.12; // 必須跟 CSS 的 .grid-item:hover img { transform: scale(1.12) } 保持一致
  function positionGridIdxItem(item){
    if(!item) return;
    const thumbWrap = item.querySelector('.thumb-wrap');
    const img = thumbWrap ? thumbWrap.querySelector('img') : null;
    const idx = item.querySelector('.idx');
    if(!thumbWrap || !img || !idx) return;
    if(!img.classList.contains('loaded')) return; // 圖片還沒真正載入完成，尺寸不可靠，先不動、等 load 事件再算
    const wrapRect = thumbWrap.getBoundingClientRect();
    const imgRect = img.getBoundingClientRect();
    if(!imgRect.width || !imgRect.height) return; // 極端情況（例如剛好被隱藏）保底不動，維持原本的 0
    const hoverGrowthY = Math.ceil(imgRect.height * (GRID_HOVER_SCALE - 1) / 2); // 放大時下緣會多往下撐出來的高度
    const hoverGrowthX = Math.ceil(imgRect.width * (GRID_HOVER_SCALE - 1) / 2); // 放大時左邊緣會多往左撐出來的寬度
    const left = Math.max(0, Math.round(imgRect.left - wrapRect.left));
    const top = Math.max(0, Math.round(imgRect.bottom - wrapRect.top)) + hoverGrowthY + GRID_IDX_GAP;
    idx.style.left = left + 'px';
    idx.style.top = top + 'px';
    item.style.setProperty('--idx-hover-shift', hoverGrowthX + 'px');
  }

  // 視窗尺寸改變（換欄數、橫直切換、雙指縮放結束…）會讓每張照片重新排版、
  // 實際渲染大小也會跟著變，所有已經渲染出來的編號都要一起重新算一次位置。
  // 這個函式會被排進跟其他版面對齊邏輯同一個入口 syncFixedChrome()（見下方），
  // 不需要另外自己接 resize / orientationchange 事件。
  function positionAllGridIdx(){
    if(!grid) return;
    grid.querySelectorAll('.grid-item').forEach(positionGridIdxItem);
  }

  function renderGrid(){
    grid.innerHTML = '';
    photos.forEach((photo, i) => {
      const item = document.createElement('div');
      item.className = 'grid-item';
      item.dataset.index = i;

      const thumbWrap = document.createElement('div');
      thumbWrap.className = 'thumb-wrap';

      const img = document.createElement('img');
      img.alt = photo.title;
      img.draggable = false;
      img.decoding = 'async'; // 解碼不卡主執行緒，捲動/縮放更順
      // 手機沒有 hover 預覽功能，用瀏覽器原生 lazy loading 讓非畫面內的縮圖
      // 延後下載，省流量、加快第一批可見縮圖出現的速度；桌機保留即時載入，
      // 確保滑鼠移過去的當下大圖預覽完全不用等。
      // 但前 GRID_EAGER_COUNT 張是「一打開就看得到」的第一畫面內容，不管
      // 手機還是桌機都明確設成 eager + 高優先度，不要被當成可以延後的資源。
      if(i < GRID_EAGER_COUNT){
        img.loading = 'eager';
        try { img.fetchPriority = 'high'; } catch(e){} // 不支援的瀏覽器就當作沒設定，不影響原本行為
      } else if(supportsTouch){
        img.loading = 'lazy';
      }
      img.addEventListener('load', () => {
        img.classList.add('loaded');
        // 圖片這一刻才真正知道自己渲染出來的實際大小／位置，載入完成後
        // 立刻把這張照片對應的編號（.idx）重新定位到「照片本身」的
        // 右下角，見下面 positionGridIdxItem()
        positionGridIdxItem(item);
      });
      if(i === 0){
        // "photobook by edenchen"（header-left）對齊 001，同樣要等這張圖片真的
        // 渲染出寬度才能算準；左側箭頭／返回鍵是照著這排字的位置對齊的，
        // 這裡也要跟著重算一次，不然文字對齊了、箭頭卻還停在算之前的舊位置
        img.addEventListener('load', () => { syncHeaderLeftAlignment(); positionNavHorizontal(); fitCollabWidth(); });
      }
      if(i === 1){
        // "preview" 標籤的精準桌機對齊要用這張圖片實際渲染出來的寬度才能算，
        // 圖片載入完成（知道真正尺寸）後再嘗試量測一次（如果之前還沒量過）
        img.addEventListener('load', syncPreviewAlignment);
      }
      if(i === 3){
        // "collab" 區塊（header-right）對齊 004，同樣要等這張圖片真的渲染出
        // 寬度才能算準
        img.addEventListener('load', syncHeaderRightAlignment);
      }
      img.onerror = () => {
        // 縮圖失敗 → 換大一點的備援縮圖 → 最後才退回原始全尺寸檔案
        if(photo.gridUrl && img.src !== photo.gridUrl){
          // 理論上不會走到這裡（第一次就是設成 gridUrl），保留只是防呆
          img.src = photo.gridUrl;
        } else if(photo.thumbUrl && img.src !== photo.thumbUrl){
          img.src = photo.thumbUrl;
        } else if(photo.fallbackUrl && img.src !== photo.fallbackUrl){
          img.src = photo.fallbackUrl;
        } else if(img.src !== photo.url){
          img.src = photo.url;
        }
      };
      img.src = photo.gridUrl || photo.thumbUrl || photo.url; // 網格用最小的縮圖，快很多；大圖頁另外載入原始檔

      thumbWrap.appendChild(img);

      const idx = document.createElement('div');
      idx.className = 'idx';
      idx.textContent = pad3(i + 1);

      item.appendChild(thumbWrap);
      item.appendChild(idx);
      grid.appendChild(item);

      item.addEventListener('click', () => openDetail(i, img));
      if(supportsHover){
        img.addEventListener('mouseenter', () => showHoverPreview(photo, img));
        img.addEventListener('mouseleave', hideHoverPreview);
      }
    });
  }

  function computeSafeRandomPosition(excludeRect, boxW, boxH){
    const margin = 24;
    const buffer = 16;
    const safeExclude = {
      left: excludeRect.left - buffer,
      top: excludeRect.top - buffer,
      right: excludeRect.right + buffer,
      bottom: excludeRect.bottom + buffer
    };

    const maxLeft = Math.max(margin, window.innerWidth - boxW - margin);
    const maxTop = Math.max(margin, window.innerHeight - boxH - margin);

    let best = null;

    for(let attempt = 0; attempt < 40; attempt++){
      const left = margin + Math.random() * (maxLeft - margin);
      const top = margin + Math.random() * (maxTop - margin);
      const rect = { left, top, right: left + boxW, bottom: top + boxH };

      const overlapsCursorArea =
        rect.left < safeExclude.right && rect.right > safeExclude.left &&
        rect.top < safeExclude.bottom && rect.bottom > safeExclude.top;

      if(!overlapsCursorArea){
        best = rect;
        break;
      }
    }

    if(!best){
      const roomRight = window.innerWidth - safeExclude.right;
      const roomLeft = safeExclude.left;
      const roomBottom = window.innerHeight - safeExclude.bottom;
      const roomTop = safeExclude.top;
      const maxRoom = Math.max(roomRight, roomLeft, roomBottom, roomTop);

      let left, top;
      if(maxRoom === roomRight){
        left = Math.min(window.innerWidth - boxW - margin, safeExclude.right + margin);
        top = Math.min(Math.max(margin, excludeRect.top), window.innerHeight - boxH - margin);
      } else if(maxRoom === roomLeft){
        left = Math.max(margin, safeExclude.left - boxW - margin);
        top = Math.min(Math.max(margin, excludeRect.top), window.innerHeight - boxH - margin);
      } else if(maxRoom === roomBottom){
        top = Math.min(window.innerHeight - boxH - margin, safeExclude.bottom + margin);
        left = Math.min(Math.max(margin, excludeRect.left), window.innerWidth - boxW - margin);
      } else {
        top = Math.max(margin, safeExclude.top - boxH - margin);
        left = Math.min(Math.max(margin, excludeRect.left), window.innerWidth - boxW - margin);
      }
      best = { left: Math.max(margin, left), top: Math.max(margin, top) };
    }

    return best;
  }

  // hover 大圖預覽要用的快取：key 是 photo.thumbUrl，value 是已經 decode 完成、
  // 保證可以立即顯示的 <img> 元素。桌機一進頁面就會在背景把所有照片的
  // thumbUrl 都預先跑過一輪（見 prefetchHoverThumbsInBackground），
  // 所以使用者實際 hover 到的當下，這裡幾乎都已經有現成的了。
  const hoverPreviewCache = new Map();

  function showHoverPreview(photo, itemEl){
    if(!photo || !photo.thumbUrl){
      // 沒有 hover 專用的縮圖網址（極端情況，例如 demo 資料不完整），
      // 退回原本「複製網格縮圖」的舊行為，至少還有東西可以看
      if(itemEl.complete && itemEl.naturalWidth){
        hoverPreview.innerHTML = '';
        const bigImg = itemEl.cloneNode();
        bigImg.removeAttribute('loading');
        bigImg.draggable = false;
        hoverPreview.appendChild(bigImg);
        placeAndReveal(itemEl);
      }
      return;
    }

    const cached = hoverPreviewCache.get(photo.thumbUrl);
    // guard: 這張 hover 用的圖片還沒載完＋解碼完成，就先等，不要把還沒完整
    // 的畫面塞進去（跟先前修 preview 頁「兩段式」黑幕是同一個道理：一定要
    // 整張圖都準備好了才顯示，不會有半張的中間態）
    if(!cached){
      const loader = new Image();
      loader.src = photo.thumbUrl;
      const onReady = () => {
        const finish = () => {
          hoverPreviewCache.set(photo.thumbUrl, loader);
          if(itemEl.matches(':hover')) showHoverPreview(photo, itemEl);
        };
        if(loader.decode){ loader.decode().then(finish).catch(finish); } else { finish(); }
      };
      if(loader.complete && loader.naturalWidth) onReady();
      else loader.onload = onReady;
      return;
    }

    // 已經預先載好＋解碼完成，直接顯示，不會閃爍、也不會有中間態
    hoverPreview.innerHTML = '';
    const bigImg = cached.cloneNode();
    bigImg.removeAttribute('loading');
    bigImg.draggable = false;
    bigImg.onerror = () => { if(photo.fallbackUrl) bigImg.src = photo.fallbackUrl; };
    hoverPreview.appendChild(bigImg);

    placeAndReveal(itemEl);
  }

  function placeAndReveal(itemEl){
    const boxW = hoverPreview.getBoundingClientRect().width || Math.min(window.innerWidth * 0.45, 650);
    const ratio = (itemEl.naturalHeight && itemEl.naturalWidth)
      ? itemEl.naturalHeight / itemEl.naturalWidth
      : 1;
    const boxH = boxW * ratio;

    const excludeRect = itemEl.getBoundingClientRect();
    const pos = computeSafeRandomPosition(excludeRect, boxW, boxH);

    hoverPreview.style.left = pos.left + 'px';
    hoverPreview.style.top = pos.top + 'px';
    hoverPreview.classList.add('show');
  }

  function hideHoverPreview(){
    hoverPreview.classList.remove('show');
  }

  let detailToken = 0;
  let lastNaturalW = 0, lastNaturalH = 0;
  // 修正「進到照片頁後，過一下子照片忽然跳一下（位置也移動了）、畫質也跟著
  // 跳」的 bug：renderDetailLight() 如果已經用網格縮圖（gridUrl，跟真正照片
  // 同比例、只是縮小）把 wrap 的大小/位置定位好了，renderDetailFull() 的
  // 高畫質版本載入完成後就不應該再用它自己量到的 naturalWidth/Height 重新
  // 呼叫一次 positionDetailImage()——兩次量到的比例理論上該一樣，但難免有
  // 極細微的捨入差異，多算這一次除了沒有必要，還會讓使用者在畫面已經穩定
  // 顯示之後，忽然看到 wrap 尺寸/位置又無聲跳動一次。這裡用一個旗標記錄
  // 「這一次 renderDetailLight() 是否已經用暖場縮圖定位過」，有的話
  // renderDetailFull() 就只換圖、不再重新定位。
  let detailLightPositioned = false;

  function isDetailMobile(){ return window.innerWidth <= 640; }

  /* =========================================================
     DETAIL PAGE — 右側拉簾 (filmstrip)，桌機／平板專用
     ---------------------------------------------------------
     核心概念：
     - fsPos 是一個「連續、不做 wrap」的浮點虛擬索引（可以是負數、可以超過
       photos.length），代表拉簾目前捲動到的中心位置。實際要顯示第幾張照片
       永遠用 mod(Math.round(off), photos.length) 換算，這樣拖曳/滾輪可以
       無限往同一方向捲，視覺上自然循環，不需要處理邊界特例。
     - 每個可見的「格子」用它的整數虛擬位移 off（不是照片 index）當 DOM
       key，因為照片數量少時同一張照片可能同時出現在多個位移上（例如往同
       方向捲超過一輪），用 off 當 key 才不會撞在一起。
     - 每張縮圖的縮放、垂直位移都是「連續函數」（不是離散的 7 個檔位），
       捲動中途（fsPos 帶小數）一樣能算出平滑的中間值，滾輪/拖曳才會看起來
       流暢而不是一格一格跳。位移用「縮放函數的定積分」反推，確保任何時刻
       相鄰兩張縮圖之間的間距都等於「兩張圖各自當下的高度」+ 固定間隙，
       不會互相重疊、也不會忽近忽遠。
     - 點擊縮圖／滾輪／拖曳放開，三種操作全部只改一個目標值 fsTarget，
       實際「怎麼動過去」統一交給同一顆臨界阻尼彈簧（SmoothDamp，見下面
       fsSmoothDamp）去追，每一幀都自動算出平滑的中間值——不管哪一種
       操作觸發，加速／減速的曲線手感永遠一致，這就是所謂成熟、統一的
       motion graphic 動態做法，細節說明見 fsTick 上方那段。
  ========================================================= */
  let fsReady = false;                 // 拉簾這次是否已經初始化好、可以互動
  let fsPos = 0;                       // 目前實際畫面上的位置（連續浮點虛擬索引）
  let fsTarget = 0;                    // 目前要追的目標位置——點擊/滾輪/拖曳放開，
                                        // 全部只改這個數字，實際怎麼「動過去」統一交給
                                        // 下面同一顆 spring 負責，三種操作因此共用同一條
                                        // 加速→減速曲線，手感永遠一致。
  const fsVel = { v: 0 };              // spring 目前的速度狀態（虛擬索引／秒）
  let fsRAFId = null;
  let fsLastFrameT = 0;
  let fsLastSyncedIndex = null;        // 上一次同步給左側大圖的實際照片 index
  const fsItemEls = new Map();         // off(number) -> { el, img }

  let fsDragging = false;
  let fsSuppressClick = false;
  let fsDragStartY = 0, fsDragStartPos = 0;
  let fsLastMoveY = 0, fsLastMoveT = 0, fsDragVelocitySample = 0;

  let fsW0 = 300, fsH0 = 200, fsGap = 16, fsZoneWidth = 340, fsTitleGap = 170;
  const FS_RENDER_RADIUS = 9;          // 實際渲染的緩衝範圍。縮圖間距被 FS_STACK_OVERLAP 壓縮後，
                                        // 同樣半徑內能塞進更多張縮圖，需要調大這個值，容器上下邊緣
                                        // 才會被縮圖填滿到底（含最上/最下幾張被容器裁掉一部分、
                                        // 凸出畫面外的效果），不會提早露出空白。
  const FS_SCALE_K = 0.48;             // 縮放隨距離衰減的係數，數字越大縮小得越快。原本 0.62 在中心
                                        // 附近曲線太陡，縮圖一經過中心點就急速放大/縮小，看起來很「硬」；
                                        // 調小讓縮放曲線更平緩、更接近線性漸變，拖曳/滾動時的放大效果更流暢。
  // ---------------------------------------------------------------
  // 動態系統：改用單一一顆「臨界阻尼彈簧」(critically damped spring /
  // SmoothDamp) 取代原本「滾輪用摩擦力衰減、放開/停止後另外接一段
  // ease-in-out 吸附動畫」這種兩套邏輯拼接的做法。
  //
  // 原本的問題：滾輪每次觸發都是「瞬間把速度加一截」，速度曲線本身是
  // 一階一階往上疊的階梯狀，不是平滑的加速；停下來後才切換成另一套
  // ease-in-out 對齊動畫，跟前面那段速度銜接的地方就算已經對齊起始
  // 速度，本質上仍是「兩套不同的運動方程式互相接棒」，這正是動作
  // 圖像設計裡最忌諱的「兩截式運動」，肉眼很容易感覺到那個接縫。
  //
  // 改法：全程只有一顆彈簧——目前位置 fsPos 每一幀都用 SmoothDamp
  // （工業界動畫工具、遊戲引擎常用的臨界阻尼彈簧公式，特性是从靜止
  // 開始會自然地「先加速、再減速貼齊目標」、且保證不會超出目標再彈
  // 回來）去追一個目標 fsTarget：
  //   - 點擊某張縮圖 → 直接把 fsTarget 設成那張的位置，彈簧自己产生
  //     一段平滑的加速→減速動畫飛過去。
  //   - 滾輪 → 每個 wheel 事件直接推動 fsTarget 本身（不是推動速度），
  //     彈簧全程平滑地跟在目標後面追，滾輪觸發得再密集或再疏落，
  //     追出來的軌跡永遠是同一條連續曲線，不會被拆成一格一格的階梯。
  //     停止滾動後，把 fsTarget 吸附到最近整數格，彈簧自然而然地把
  //     最後一小段距離用同一條曲線補完。
  //   - 拖曳放開 → 放開瞬間量到的手指移動速度，直接當成彈簧目前的
  //     速度狀態（fsVel.v）餵進去，再把 fsTarget 設成用這個速度推算
  //     出的最近整數格；彈簧帶著這個非零初速接著滑過去，跟拖曳當下
  //     的手感無縫相接，不會有「先停頓一下才重新啟動」的斷點。
  // 三種操作路徑最終都只是在改 fsTarget（或順便給 fsVel 一個初速），
  // 實際「怎麼動」永遠是同一顆彈簧、同一套物理，這就是所謂「非常
  // 成熟、統一」的 motion graphic 動態做法——不再有兩套邏輯拼接。
  // ---------------------------------------------------------------
  const FS_SMOOTH_TIME = 0.30;         // 彈簧的「反應時間常數」（秒）。數字越大，追目標追得
                                        // 越慢、越有份量感／越滑順；越小則越緊跟、越靈敏。
                                        // 統一套用在點擊/滾輪/拖曳放開三種情境，確保手感一致。
  const FS_WHEEL_TO_INDEX = 1 / 280;   // 滾輪 deltaY(px) 直接換算成「目標要往前推多少格」的係數
                                        // （注意：這裡動的是目標本身，不是速度）。原本 1/650 太遲鈍，
                                        // 同樣滾一段距離拉簾動得很少；調大讓同樣的滾動幅度換來更多
                                        // 移動量，滾起來明顯更快、更靈敏。
  const FS_SETTLE_EPS = 0.0006;        // 位置與速度都小於這個閾值，視為已經完全貼齊目標，
                                        // 可以停止逐幀重算，省電、也避免無意義的浮點抖動。

  const FS_STACK_OVERLAP = 0.46;       // 相鄰縮圖重疊的緊密程度：1 = 剛好緊貼不重疊(原本行為)，
                                        // 數字調低（0.56→0.46），縮圖彼此再貼近一些，盡量不留空白。
                                        // 數字越小疊得越緊、重疊範圍越大。目前設定讓中間最大張的
                                        // 那幾張明顯互相壓在一起，形成像素材參考圖那樣的層疊卡片感，
                                        // 而不是一張張分開排列。
  const FS_VISIBLE_RADIUS = 3;         // 畫面中最多同時出現幾張的「半徑」：中心 1 張 + 上下各
                                        // FS_VISIBLE_RADIUS 張 = 最多 2*3+1 = 7 張，跟參考圖一致。
                                        // 超過這個範圍的縮圖直接完全隱藏（opacity 0），不做漸層
                                        // 淡出——參考圖裡最上/最下那幾張其實是「完整不透明、被
                                        // 容器邊緣裁掉一部分」，不是變透明後才消失的。
  function mod(n, m){ return ((n % m) + m) % m; }

  function fsScaleAt(d){
    return 1 / (1 + FS_SCALE_K * Math.abs(d));
  }
  // 位移 = 縮放函式對距離的定積分 × 重疊係數（見上方 FS_STACK_OVERLAP）：
  // 原本的定積分本身算出的是「剛好不重疊、緊貼」的間距，乘上一個小於 1
  // 的係數讓實際擺放距離比「不重疊」需要的距離更短，縮圖之間就會互相
  // 疊在一起——中間最大張的疊最多，越往上下張變小、露出來的部分也
  // 越完整，跟參考圖的層疊效果一致。積分本身的形狀不變，只是整體壓縮，
  // 所以原本「連續、不會忽近忽遠」的平滑特性完全保留。
  function fsYAt(d){
    const ad = Math.abs(d);
    const val = ((fsH0 / FS_SCALE_K) * Math.log(1 + FS_SCALE_K * ad) + fsGap * ad) * FS_STACK_OVERLAP;
    return d < 0 ? -val : val;
  }

  // 臨界阻尼彈簧（SmoothDamp）：current 平滑地追向 target，過程中不會
  // 超出 target 再彈回來（no overshoot），從靜止開始追時會自然呈現
  // 「先加速、再減速貼齊」的曲線；velRef 是彈簧目前的速度狀態，會被
  // 這個函式原地更新，下一幀呼叫時要帶著同一個 velRef 才能延續動量。
  // smoothTime 是時間常數（秒），dt 是這一幀經過的時間（秒）。
  function fsSmoothDamp(current, target, velRef, smoothTime, dt){
    const omega = 2 / Math.max(0.0001, smoothTime);
    const x = omega * dt;
    const exp = 1 / (1 + x + 0.48 * x * x + 0.235 * x * x * x);
    const change = current - target;
    const temp = (velRef.v + omega * change) * dt;
    velRef.v = (velRef.v - omega * temp) * exp;
    let output = target + (change + temp) * exp;
    // 保底：極端情況下（例如極大 dt）避免衝過頭又要下一幀拉回來，
    // 直接夾在目標上，速度歸零，維持「絕不超出目標」的特性。
    if((target - current > 0) === (output > target)){
      output = target;
      velRef.v = 0;
    }
    return output;
  }

  function layoutFilmstripZone(){
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    // ---- 1) 先決定縮圖本身的視覺尺寸 ----
    // 原本 fsW0 只看螢幕寬度，算出來的圖偏小；乘上一個放大係數，讓中間
    // 那張看起來夠大、不會太小家氣。上限也跟著放寬（原本 300 → 420），
    // 避免寬螢幕時被舊上限卡住、放大係數形同虛設。
    // 放大係數、上限都再調高一輪（1.35→1.55、420→470），讓拉簾裡的照片
    // 整體再大一點，彼此之間的留白也跟著相對變少。
    const baseW = Math.max(150, Math.min(300, vw * 0.185));
    fsW0 = Math.min(470, baseW * 1.55);
    fsH0 = fsW0 / 1.5; // 3:2，跟 CSS 的 aspect-ratio 保持一致

    // ---- 2) 再反推縮圖之間的間距(fsGap)，讓最外圈（FS_VISIBLE_RADIUS，
    // 目前最多同時顯示 7 張）那張的位置，落在略超出視窗上下邊界的地方 ----
    // fsYAt() 的公式是 ((fsH0/K)*ln(1+K*ad) + gap*ad) * OVERLAP，對 gap
    // 是線性的，直接解方程式反推需要多少 gap 才能讓 ad=FS_VISIBLE_RADIUS
    // 那張的位置到達 targetEdge，比起事後整體再乘一個縮放係數（會連帶把
    // 圖片尺寸一起放大到不合理的地步），更能精準只調整「間距」，圖片大小
    // 維持第 1 步算出來的合理值不變。
    // targetEdge 故意抓視窗高度一半再多一點（0.56 而不是 0.5），讓最外圈
    // 那張的「中心點」就已經超出邊界一些，加上它自己的半張高度，保證整張
    // 圖有一段會被容器 overflow:hidden 裁掉、緊貼畫面上下邊界，而不是恰好
    // 停在邊界內側留一條縫——這就是參考圖「整疊圖從螢幕最上緣排到最下緣」
    // 的效果。
    const targetEdge = vh * 0.56;
    const logTerm = (fsH0 / FS_SCALE_K) * Math.log(1 + FS_SCALE_K * FS_VISIBLE_RADIUS);
    let gap = (targetEdge / FS_STACK_OVERLAP - logTerm) / FS_VISIBLE_RADIUS;
    // 極端窄高（例如手機直向的平板尺寸）算出來的 gap 可能小到讓圖片幾乎
    // 全部疊在一起、甚至變負值；夾在一個仍保有明顯層疊感、但不會完全
    // 疊死的範圍內。上限則避免超寬螢幕算出離譜大的間距、疊卡片感消失。
    fsGap = Math.max(fsW0 * 0.03, Math.min(fsW0 * 0.6, gap));

    fsZoneWidth = Math.min(vw * 0.34, Math.max(220, fsW0 + 70));
    // 拉簾右側預留給編號/標題文字的寬度，跟著視窗寬度做一點縮放（太窄的螢幕
    // 不需要留這麼多），下限/上限維持在能放下一般地名長度標題的範圍內。
    fsTitleGap = Math.max(130, Math.min(220, vw * 0.11));
    document.documentElement.style.setProperty('--fs-base-w', fsW0 + 'px');
    document.documentElement.style.setProperty('--fs-zone-w', fsZoneWidth + 'px');
    document.documentElement.style.setProperty('--fs-title-gap', fsTitleGap + 'px');
  }
  function getFilmstripZoneWidth(){
    return isDetailMobile() ? 0 : fsZoneWidth;
  }

  // 把一張照片的真實寬高比，contain 進 fsW0×fsH0 這個框裡（跟原本
  // object-fit:contain 的邏輯一樣，只是我們直接把結果拿來設「元素本身」的
  // 寬高，而不是留白裁切）：長邊碰到框，短邊依比例縮小。這樣量出來的尺寸
  // 保證不會超過原本 fsW0×fsH0 的範圍，拉簾原本靠 fsH0 算出來的捲動間距
  // （fsYAt／fsScaleAt）完全不用跟著改，不會有相鄰縮圖擠在一起或重疊的風險。
  function fsFitSize(ratio){
    const boxRatio = fsW0 / fsH0;
    const r = (ratio && isFinite(ratio) && ratio > 0) ? ratio : boxRatio;
    if(r >= boxRatio) return { w: fsW0, h: fsW0 / r };
    return { w: fsH0 * r, h: fsH0 };
  }

  function createFilmstripItem(photo, off){
    const el = document.createElement('div');
    el.className = 'filmstrip-item';
    const img = document.createElement('img');
    img.draggable = false;
    img.alt = '';
    img.decoding = 'async';
    img.src = photo.gridUrl || photo.thumbUrl || photo.url;
    el.appendChild(img);
    const rec = { el, img, ratio: null }; // ratio 在圖片真正載入、量到 naturalWidth/Height 之前先留 null，
                                            // applyFilmstripTransform 裡沒有 ratio 時會退回原本的 3:2 預設框
